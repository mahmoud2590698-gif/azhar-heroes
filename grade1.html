var AYAH={"051057": {"a": 57, "text": "مَآ أُرِيدُ مِنْهُم مِّن رِّزْقٍۢ وَمَآ أُرِيدُ أَن يُطْعِمُونِ"}, "085008": {"a": 8, "text": "وَمَا نَقَمُوا۟ مِنْهُمْ إِلَّآ أَن يُؤْمِنُوا۟ بِٱللَّهِ ٱلْعَزِيزِ ٱلْحَمِيدِ"}, "052035": {"a": 35, "text": "أَمْ خُلِقُوا۟ مِنْ غَيْرِ شَىْءٍ أَمْ هُمُ ٱلْخَٰلِقُونَ"}, "054007": {"a": 7, "text": "خُشَّعًا أَبْصَٰرُهُمْ يَخْرُجُونَ مِنَ ٱلْأَجْدَاثِ كَأَنَّهُمْ جَرَادٌۭ مُّنتَشِرٌۭ"}, "051056": {"a": 56, "text": "وَمَا خَلَقْتُ ٱلْجِنَّ وَٱلْإِنسَ إِلَّا لِيَعْبُدُونِ"}, "096001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ"}, "083031": {"a": 31, "text": "وَإِذَا ٱنقَلَبُوٓا۟ إِلَىٰٓ أَهْلِهِمُ ٱنقَلَبُوا۟ فَكِهِينَ"}, "056077": {"a": 77, "text": "إِنَّهُۥ لَقُرْءَانٌۭ كَرِيمٌۭ"}, "104004": {"a": 4, "text": "كَلَّا ۖ لَيُنۢبَذَنَّ فِى ٱلْحُطَمَةِ"}, "084025": {"a": 25, "text": "إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۭ"}, "051028": {"a": 28, "text": "فَأَوْجَسَ مِنْهُمْ خِيفَةًۭ ۖ قَالُوا۟ لَا تَخَفْ ۖ وَبَشَّرُوهُ بِغُلَٰمٍ عَلِيمٍۢ"}, "050008": {"a": 8, "text": "تَبْصِرَةًۭ وَذِكْرَىٰ لِكُلِّ عَبْدٍۢ مُّنِيبٍۢ"}, "089015": {"a": 15, "text": "فَأَمَّا ٱلْإِنسَٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ"}, "071007": {"a": 7, "text": "وَإِنِّى كُلَّمَا دَعَوْتُهُمْ لِتَغْفِرَ لَهُمْ جَعَلُوٓا۟ أَصَٰبِعَهُمْ فِىٓ ءَاذَانِهِمْ وَٱسْتَغْشَوْا۟ ثِيَابَهُمْ وَأَصَرُّوا۟ وَٱسْتَكْبَرُوا۟ ٱسْتِكْبَارًۭا"}, "051027": {"a": 27, "text": "فَقَرَّبَهُۥٓ إِلَيْهِمْ قَالَ أَلَا تَأْكُلُونَ"}, "051055": {"a": 55, "text": "وَذَكِّرْ فَإِنَّ ٱلذِّكْرَىٰ تَنفَعُ ٱلْمُؤْمِنِينَ"}, "057024": {"a": 24, "text": "ٱلَّذِينَ يَبْخَلُونَ وَيَأْمُرُونَ ٱلنَّاسَ بِٱلْبُخْلِ ۗ وَمَن يَتَوَلَّ فَإِنَّ ٱللَّهَ هُوَ ٱلْغَنِىُّ ٱلْحَمِيدُ"}, "067004": {"a": 4, "text": "ثُمَّ ٱرْجِعِ ٱلْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ ٱلْبَصَرُ خَاسِئًۭا وَهُوَ حَسِيرٌۭ"}, "089010": {"a": 10, "text": "وَفِرْعَوْنَ ذِى ٱلْأَوْتَادِ"}, "054036": {"a": 36, "text": "وَلَقَدْ أَنذَرَهُم بَطْشَتَنَا فَتَمَارَوْا۟ بِٱلنُّذُرِ"}, "066002": {"a": 2, "text": "قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْ ۚ وَٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ"}, "051026": {"a": 26, "text": "فَرَاغَ إِلَىٰٓ أَهْلِهِۦ فَجَآءَ بِعِجْلٍۢ سَمِينٍۢ"}, "055010": {"a": 10, "text": "وَٱلْأَرْضَ وَضَعَهَا لِلْأَنَامِ"}, "071006": {"a": 6, "text": "فَلَمْ يَزِدْهُمْ دُعَآءِىٓ إِلَّا فِرَارًۭا"}, "054010": {"a": 10, "text": "فَدَعَا رَبَّهُۥٓ أَنِّى مَغْلُوبٌۭ فَٱنتَصِرْ"}, "057001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ"}, "076023": {"a": 23, "text": "إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ ٱلْقُرْءَانَ تَنزِيلًۭا"}, "056091": {"a": 91, "text": "فَسَلَٰمٌۭ لَّكَ مِنْ أَصْحَٰبِ ٱلْيَمِينِ"}, "050004": {"a": 4, "text": "قَدْ عَلِمْنَا مَا تَنقُصُ ٱلْأَرْضُ مِنْهُمْ ۖ وَعِندَنَا كِتَٰبٌ حَفِيظٌۢ"}, "052015": {"a": 15, "text": "أَفَسِحْرٌ هَٰذَآ أَمْ أَنتُمْ لَا تُبْصِرُونَ"}, "082018": {"a": 18, "text": "ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ"}, "070038": {"a": 38, "text": "أَيَطْمَعُ كُلُّ ٱمْرِئٍۢ مِّنْهُمْ أَن يُدْخَلَ جَنَّةَ نَعِيمٍۢ"}, "079027": {"a": 27, "text": "ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا"}, "052016": {"a": 16, "text": "ٱصْلَوْهَا فَٱصْبِرُوٓا۟ أَوْ لَا تَصْبِرُوا۟ سَوَآءٌ عَلَيْكُمْ ۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ"}, "105001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ ٱلْفِيلِ"}, "052024": {"a": 24, "text": "۞ وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌۭ لَّهُمْ كَأَنَّهُمْ لُؤْلُؤٌۭ مَّكْنُونٌۭ"}, "069013": {"a": 13, "text": "فَإِذَا نُفِخَ فِى ٱلصُّورِ نَفْخَةٌۭ وَٰحِدَةٌۭ"}, "067005": {"a": 5, "text": "وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ"}, "054009": {"a": 9, "text": "۞ كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ فَكَذَّبُوا۟ عَبْدَنَا وَقَالُوا۟ مَجْنُونٌۭ وَٱزْدُجِرَ"}, "072027": {"a": 27, "text": "إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا"}, "051031": {"a": 31, "text": "۞ قَالَ فَمَا خَطْبُكُمْ أَيُّهَا ٱلْمُرْسَلُونَ"}, "055015": {"a": 15, "text": "وَخَلَقَ ٱلْجَآنَّ مِن مَّارِجٍۢ مِّن نَّارٍۢ"}, "085007": {"a": 7, "text": "وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌۭ"}, "047001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ أَضَلَّ أَعْمَٰلَهُمْ"}, "078036": {"a": 36, "text": "جَزَآءًۭ مِّن رَّبِّكَ عَطَآءً حِسَابًۭا"}, "056045": {"a": 45, "text": "إِنَّهُمْ كَانُوا۟ قَبْلَ ذَٰلِكَ مُتْرَفِينَ"}, "050012": {"a": 12, "text": "كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ وَأَصْحَٰبُ ٱلرَّسِّ وَثَمُودُ"}, "071017": {"a": 17, "text": "وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلْأَرْضِ نَبَاتًۭا"}, "091013": {"a": 13, "text": "فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا"}, "079040": {"a": 40, "text": "وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ"}, "053038": {"a": 38, "text": "أَلَّا تَزِرُ وَازِرَةٌۭ وِزْرَ أُخْرَىٰ"}, "050015": {"a": 15, "text": "أَفَعَيِينَا بِٱلْخَلْقِ ٱلْأَوَّلِ ۚ بَلْ هُمْ فِى لَبْسٍۢ مِّنْ خَلْقٍۢ جَدِيدٍۢ"}, "049018": {"a": 18, "text": "إِنَّ ٱللَّهَ يَعْلَمُ غَيْبَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَٱللَّهُ بَصِيرٌۢ بِمَا تَعْمَلُونَ"}, "052012": {"a": 12, "text": "ٱلَّذِينَ هُمْ فِى خَوْضٍۢ يَلْعَبُونَ"}, "075005": {"a": 5, "text": "بَلْ يُرِيدُ ٱلْإِنسَٰنُ لِيَفْجُرَ أَمَامَهُۥ"}, "067003": {"a": 3, "text": "ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا ۖ مَّا تَرَىٰ فِى خَلْقِ ٱلرَّحْمَٰنِ مِن تَفَٰوُتٍۢ ۖ فَٱرْجِعِ ٱلْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍۢ"}, "056060": {"a": 60, "text": "نَحْنُ قَدَّرْنَا بَيْنَكُمُ ٱلْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ"}, "091014": {"a": 14, "text": "فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا"}, "055074": {"a": 74, "text": "لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ"}, "073005": {"a": 5, "text": "إِنَّا سَنُلْقِى عَلَيْكَ قَوْلًۭا ثَقِيلًا"}, "050029": {"a": 29, "text": "مَا يُبَدَّلُ ٱلْقَوْلُ لَدَىَّ وَمَآ أَنَا۠ بِظَلَّٰمٍۢ لِّلْعَبِيدِ"}, "051053": {"a": 53, "text": "أَتَوَاصَوْا۟ بِهِۦ ۚ بَلْ هُمْ قَوْمٌۭ طَاغُونَ"}, "070014": {"a": 14, "text": "وَمَن فِى ٱلْأَرْضِ جَمِيعًۭا ثُمَّ يُنجِيهِ"}, "077048": {"a": 48, "text": "وَإِذَا قِيلَ لَهُمُ ٱرْكَعُوا۟ لَا يَرْكَعُونَ"}, "083014": {"a": 14, "text": "كَلَّا ۖ بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ"}, "047002": {"a": 2, "text": "وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَءَامَنُوا۟ بِمَا نُزِّلَ عَلَىٰ مُحَمَّدٍۢ وَهُوَ ٱلْحَقُّ مِن رَّبِّهِمْ ۙ كَفَّرَ عَنْهُمْ سَيِّـَٔاتِهِمْ وَأَصْلَحَ بَالَهُمْ"}, "055024": {"a": 24, "text": "وَلَهُ ٱلْجَوَارِ ٱلْمُنشَـَٔاتُ فِى ٱلْبَحْرِ كَٱلْأَعْلَٰمِ"}, "089008": {"a": 8, "text": "ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ"}, "048007": {"a": 7, "text": "وَلِلَّهِ جُنُودُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا"}, "061010": {"a": 10, "text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ هَلْ أَدُلُّكُمْ عَلَىٰ تِجَٰرَةٍۢ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍۢ"}, "050026": {"a": 26, "text": "ٱلَّذِى جَعَلَ مَعَ ٱللَّهِ إِلَٰهًا ءَاخَرَ فَأَلْقِيَاهُ فِى ٱلْعَذَابِ ٱلشَّدِيدِ"}, "054011": {"a": 11, "text": "فَفَتَحْنَآ أَبْوَٰبَ ٱلسَّمَآءِ بِمَآءٍۢ مُّنْهَمِرٍۢ"}, "056041": {"a": 41, "text": "وَأَصْحَٰبُ ٱلشِّمَالِ مَآ أَصْحَٰبُ ٱلشِّمَالِ"}, "055043": {"a": 43, "text": "هَٰذِهِۦ جَهَنَّمُ ٱلَّتِى يُكَذِّبُ بِهَا ٱلْمُجْرِمُونَ"}, "048028": {"a": 28, "text": "هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًۭا"}, "075040": {"a": 40, "text": "أَلَيْسَ ذَٰلِكَ بِقَٰدِرٍ عَلَىٰٓ أَن يُحْۦِىَ ٱلْمَوْتَىٰ"}, "077049": {"a": 49, "text": "وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"}, "079018": {"a": 18, "text": "فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ"}, "048008": {"a": 8, "text": "إِنَّآ أَرْسَلْنَٰكَ شَٰهِدًۭا وَمُبَشِّرًۭا وَنَذِيرًۭا"}, "075036": {"a": 36, "text": "أَيَحْسَبُ ٱلْإِنسَٰنُ أَن يُتْرَكَ سُدًى"}, "089021": {"a": 21, "text": "كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّۭا دَكًّۭا"}, "067002": {"a": 2, "text": "ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًۭا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ"}, "056076": {"a": 76, "text": "وَإِنَّهُۥ لَقَسَمٌۭ لَّوْ تَعْلَمُونَ عَظِيمٌ"}, "068033": {"a": 33, "text": "كَذَٰلِكَ ٱلْعَذَابُ ۖ وَلَعَذَابُ ٱلْءَاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ"}, "072010": {"a": 10, "text": "وَأَنَّا لَا نَدْرِىٓ أَشَرٌّ أُرِيدَ بِمَن فِى ٱلْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًۭا"}, "055009": {"a": 9, "text": "وَأَقِيمُوا۟ ٱلْوَزْنَ بِٱلْقِسْطِ وَلَا تُخْسِرُوا۟ ٱلْمِيزَانَ"}, "089006": {"a": 6, "text": "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ"}, "061011": {"a": 11, "text": "تُؤْمِنُونَ بِٱللَّهِ وَرَسُولِهِۦ وَتُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ"}, "089005": {"a": 5, "text": "هَلْ فِى ذَٰلِكَ قَسَمٌۭ لِّذِى حِجْرٍ"}, "066001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ"}, "051032": {"a": 32, "text": "قَالُوٓا۟ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٍۢ مُّجْرِمِينَ"}, "050027": {"a": 27, "text": "۞ قَالَ قَرِينُهُۥ رَبَّنَا مَآ أَطْغَيْتُهُۥ وَلَٰكِن كَانَ فِى ضَلَٰلٍۭ بَعِيدٍۢ"}, "054028": {"a": 28, "text": "وَنَبِّئْهُمْ أَنَّ ٱلْمَآءَ قِسْمَةٌۢ بَيْنَهُمْ ۖ كُلُّ شِرْبٍۢ مُّحْتَضَرٌۭ"}, "048009": {"a": 9, "text": "لِّتُؤْمِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَتُعَزِّرُوهُ وَتُوَقِّرُوهُ وَتُسَبِّحُوهُ بُكْرَةًۭ وَأَصِيلًا"}, "077031": {"a": 31, "text": "لَّا ظَلِيلٍۢ وَلَا يُغْنِى مِنَ ٱللَّهَبِ"}, "080023": {"a": 23, "text": "كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ"}, "089009": {"a": 9, "text": "وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ"}}, EXPL={"3|الرياضيات|عالم الجمع والطرح": [{"t": "عالم الجمع والطرح", "k": "", "lines": ["بص يا حبيبي، لما نجمع، بنحط الأرقام تحت بعض: آحاد تحت آحاد، وعشرات تحت عشرات، ومئات تحت مئات."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["نبدأ الجمع من اليمين، من الآحاد. لو الناتج 10 أو أكتر، نكتب الآحاد ونرفع العشرة للعمود اللي جنبه. اسمها الحمل."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["في الطرح كمان نبدأ من الآحاد. لو الرقم اللي فوق أصغر، نستلف عشرة من العمود اللي جنبه."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["مثال: 45 + 28. نجمع 5 + 8 = 13، نكتب 3 ونرفع 1. بعدين 4 + 2 + 1 = 7. الناتج 73."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["اتأكد من الحل: الجمع نختبره بالطرح، والطرح نختبره بالجمع. لو رجعنا للرقم الأصلي يبقى الحل صح. يلا يا بطل."]}], "3|الرياضيات|عالم الزمن": [{"t": "عالم الزمن", "k": "", "lines": ["بص يا حبيبي، الساعة فيها 60 دقيقة، واليوم فيه 24 ساعة، والأسبوع 7 أيام."]}, {"t": "عالم الزمن", "k": "", "lines": ["العقرب الصغير بيقول الساعة، والعقرب الكبير بيقول الدقايق. لما الكبير على 6 نقول والنصف، ولما يكون على 3 نقول والربع."]}, {"t": "عالم الزمن", "k": "", "lines": ["الزمن المنقضي هو الفرق بين وقت البداية ووقت النهاية. من 3:00 لحد 5:30 يبقى ساعتين ونص."]}, {"t": "عالم الزمن", "k": "", "lines": ["السنة فيها 12 شهر، والشهر ممكن يكون 30 أو 31 يوم، وفبراير أقل."]}, {"t": "عالم الزمن", "k": "", "lines": ["اقرأ السؤال وشوف بيسأل عن ساعة ولا دقيقة ولا يوم، وبعدين اختار الوحدة الصح. يلا يا بطل."]}], "3|الرياضيات|مملكة الضرب": [{"t": "مملكة الضرب", "k": "", "lines": ["بص يا حبيبي، الضرب هو جمع الرقم نفسه كذا مرة. 4 × 3 يعني 4 + 4 + 4 = 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["جدول الضرب لازم نحفظه. ممكن نتعلمه بالعد بالقفزات: 3، 6، 9، 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["الترتيب مش بيغير الناتج: 4 × 3 = 3 × 4."]}, {"t": "مملكة الضرب", "k": "", "lines": ["أي رقم × 1 يساوي نفسه. وأي رقم × 0 يساوي صفر."]}, {"t": "مملكة الضرب", "k": "", "lines": ["لو السؤال فيه مجموعات متساوية، اعرف عدد المجموعات وعدد كل مجموعة واضرب. يلا يا بطل."]}], "3|الرياضيات|مملكة ا var TIPS=["اقرأ السؤال مرتين قبل أن تجيب.","إن لم تكن متأكدًا، فاستبعد الاختيارات الخاطئة أولًا.","خذ نفسًا عميقًا قبل السؤال الصعب.","الخطأ يعلّمك أكثر من الإجابة السهلة.","راجع أخطاءك كل يوم خمس دقائق.","اشرب ماءً وارتح بين الجولات.","جرّب أن تشرح الدرس لغيرك، ستفهمه أفضل.","ابدأ بالمادة التي تحبها، ثم الأصعب.","اكتب الحل على ورقة قبل أن تختار.","النوم مبكرًا يجعل المذاكرة أسهل.","شاهد الشرح المتحرك إذا أخطأت في موضوع أكثر من مرة.","التكرار القليل كل يوم خير من يوم واحد طويل.","اسأل معلمك عن أي شيء لا تفهمه.","عندما تتعب، خذ استراحة ضحك.","ابدأ طعامَك ببسم الله، وكُل بيمينك، وكُل مما يليك؛ فهكذا علّمنا النبيُّ ﷺ.","فكِّر قبل أن تتكلم؛ فالكلمةُ الطيبة صدقة، والكلمة الجارحة لا تُنسى.","العب بروحٍ رياضية: افرح بالفوز بتواضع، وتقبّل الخسارة بابتسامة؛ فاللعبُ يجمع ولا يفرِّق.","ادخل المسجدَ بيمينك وقل دعاءَ الدخول، واجلس بأدبٍ وهدوء؛ فأنت في بيت الله.","قبل أن تدخل غرفةَ غيرك، اطرق البابَ بلطفٍ واستأذن؛ فالاستئذانُ أدبٌ رفيعٌ يحفظ الخصوصية.","ابدأ يومَك بذكر الله، واختمه بحمده؛ فالقلبُ الذي يذكر اللهَ قلبٌ مطمئن.","ساعد من يحتاج حولك: أخاك الصغير، وجارَك الكبير، وصديقَك المتعثر؛ فالمساعدةُ تُسعد قلبين.","ابدأ يومَك بالسلام على أهل بيتك؛ فالسلامُ يُدخل المحبةَ والطمأنينةَ إلى القلوب.","كن صادقًا دائمًا، حتى لو كان الصدقُ صعبًا؛ فالصدقُ يهدي إلى البرِّ والجنة.","حافظ على صلواتك الخمس في أوقاتها؛ فالصلاةُ راحةُ القلب ونورُ اليوم.","ابدأ مذاكرتَك بدعاءٍ قصير ونيةٍ صالحة؛ فطلبُ العلم عبادةٌ يُحبها الله.","النظافةُ من الإيمان؛ حافظ على نظافة جسدك وثيابك ومكانك دائمًا.","برُّ الوالدين طريقُك إلى رضا الله؛ كلمةٌ طيبةٌ وابتسامةٌ صادقةٌ تُسعد قلبَ أمِّك وأبيك.","زُر أقاربَك واسأل عنهم ولو بمكالمة؛ فصلةُ الرحم تُبارك في العمر والرزق.","اشكر اللهَ بعد الطعام بقول: الحمد لله؛ فالشكرُ يزيد النعمَ ويبارك فيها.","استمع إلى من يحدِّثك حتى يُكمل كلامَه، ولا تقاطعه؛ فحُسنُ الاستماع من حُسن الخُلق.","لا تسخر من صديقٍ أخطأ أو خسر؛ فاليوم تضحك وغدًا قد تكون مكانه.","حافظ على وردٍ يوميٍّ من القرآن ولو آياتٍ قليلة؛ فخيرُ الأعمال أدومُها وإن قلّت.","استأذن ثلاثَ مرات؛ فإن لم يُؤذَن لك، فارجع بقلبٍ راضٍ ولا تغضب.","ادعُ لوالديك وأهلك وأصدقائك بظهر الغيب؛ فدعوتُك لهم تعود عليك بمثلها.","كن رفيقًا بالحيوانات؛ اسقِها وأطعمها ولا تؤذِها، ففي كلِّ كبدٍ رطبةٍ أجر.","حين تدخل بيتَك أو بيتَ غيرك، قل: السلام عليكم، بصوتٍ واضحٍ وابتسامةٍ جميلة.","الأمانةُ أن تحفظ ما اؤتمنتَ عليه: مالًا كان أو سرًّا أو وعدًا قطعته.","توضأ بإتقانٍ وأحسن وضوءَك؛ فالوضوءُ طهارةٌ ونور.","قسِّم واجباتِك إلى أجزاءٍ صغيرة، وأنجزها واحدةً تلو الأخرى؛ فالجبلُ يُصعَد خطوةً خطوة.","رتِّب غرفتَك وأدواتَك بعد استعمالها؛ فالنظامُ يوفِّر وقتَك ويريح قلبَك.","حين تطلب منك أمُّك شيئًا، فلبِّ طلبَها بفرح؛ فخدمةُ الوالدين شرفٌ وبركة.","احترم كبارَ السن: قف لهم، وقدِّمهم في المجلس، واستمع إلى حكاياتهم بحب.","لا تعبْ طعامًا قُدِّم إليك؛ إن اشتهيتَه أكلتَ، وإن لم تشتهِه تركتَه بلا تعليق.","تكلّم بصوتٍ هادئٍ واضح؛ فرفعُ الصوت لا يجعل الحقَّ أقوى.","شارك ألعابَك مع أصدقائك؛ فالمشاركةُ تزيد الفرحَ ولا تُنقصه.","استمع إلى القرآن بقلبٍ حاضرٍ حين يُتلى؛ ففي سماعه رحمةٌ وطمأنينة.","حتى في بيتك، استأذن قبل دخول غرفة والديك أو إخوتك؛ فالأدبُ يبدأ من البيت.","اشكر من أحسن إليك بقول: جزاك الله خيرًا؛ فمن لا يشكر الناسَ لا يشكر الله.","تبسُّمُك في وجه أخيك صدقة؛ فلا تبخل بابتسامتك على أحد.","ردُّ السلام فضلٌ عظيم؛ رُدَّه بأحسنَ منه أو بمثلِه، وبوجهٍ بشوش.","إن وعدتَ فأوفِ بوعدك؛ فالوفاءُ بالوعد علامةُ المؤمن الصادق.","صلِّ بخشوعٍ وحضور قلب، وتذكّر أنك تقف بين يدي الله؛ فالصلاةُ لقاءٌ جميل.","راجع دروسَك أولًا بأول، ولا تؤجِّل عملَ اليوم إلى الغد.","اغسل يديك قبل الطعام وبعده، وبعد اللعب؛ فالصحةُ نعمةٌ عظيمةٌ تستحق الشكر.","قبِّل يدَ والديك وادعُ لهما كلَّ يوم؛ فدعاؤهما لك بابٌ من أبواب التوفيق.","معلِّمُك بمنزلة والدك في التربية؛ فاحترمه واشكره وادعُ له بالخير.","شارك إخوتَك وأصدقاءَك طعامَك إن استطعت؛ فالطعامُ المشترك ألذُّ وأبرك.","إن لم يكن عندك كلامٌ نافع، فالصمتُ أجمل؛ قال رسول الله ﷺ: «من كان يؤمن بالله واليوم الآخر فليقل خيرًا أو ليصمت».","اختر صديقَك بعناية؛ فالصديقُ الصالح يُعينك على الخير ويُبعدك عن الشر.","احترم مصحفَك: ضعه في مكانٍ نظيفٍ مرتفع، ولا تضع فوقه شيئًا.","لا تنظر من ثقب الباب أو النافذة قبل أن تدخل؛ فاحترامُ خصوصية الناس من كمال الخُلق.","افرح لفرح غيرك وادعُ له بالبركة؛ فالقلبُ الذي يحب الخيرَ للناس قلبٌ عظيم.","إن رأيتَ صديقًا حزينًا، اجلس بجواره واسأله عن حاله؛ فالكلمةُ الحانية دواء.","إفشاءُ السلام بين الناس من أحبِّ الأعمال إلى الله؛ فكن سبّاقًا إليه دائمًا.","اعترف بخطئك بشجاعة إن أخطأت؛ فالاعتذارُ قوةٌ لا ضعف.","جهِّز سجادتَك ومصحفَك في مكانٍ تحبه؛ فالمكانُ الجميل يُعينك على العبادة.","اسأل معلِّمَك عما لا تفهمه ولا تخجل؛ فالسؤالُ مفتاحُ العلم.","حافظ على نظافة مدرستك وشارعك؛ فإماطةُ الأذى عن الطريق من أخلاق المؤمن.","استمع إلى نصيحة والديك بصدرٍ رحب؛ فهما أكثرُ من يحبُّك ويخاف عليك في الدنيا.","خاطب الكبيرَ بألفاظٍ مهذبة، ولا ترفع صوتَك فوق صوته أبدًا.","حين تدخل بيتك، قل: «بسم الله ولجنا، وبسم الله خرجنا، وعلى ربنا توكلنا»، ثم سلّم على أهلك.","حين تخرج من بيتك، قل: «بسم الله، توكلت على الله، ولا حول ولا قوة إلا بالله» — تُكفى وتُهدى وتُوقى.","قبل أن تأكل، سمِّ الله وقل: «بسم الله»؛ فإن نسيت في أوله فقل: «بسم الله في أوله وآخره».","بعد أن تفرغ من طعامك، قل: «الحمد لله الذي أطعمني هذا ورزقنيه من غير حول مني ولا قوة».","حين تدخل المسجد، قدّم رجلك اليمنى وقل: «اللهم افتح لي أبواب رحمتك».","حين تخرج من المسجد، قدّم رجلك اليسرى وقل: «اللهم إني أسألك من فضلك».","حين تستيقظ من نومك، قل: «الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور».","قبل أن تنام، قل: «باسمك اللهم أموت وأحيا»، ونم على وضوء إن استطعت.","حين تركب السيارة أو الحافلة، قل: «سبحان الذي سخّر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون».","إذا لبست ثوبًا جديدًا، فقل: «الحمد لله الذي كساني هذا ورزقنيه من غير حول مني ولا قوة».","بعد الوضوء، قل: «أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدًا عبده ورسوله» — تُفتح لك أبواب الجنة.","حين تسمع الأذان، ردّد مع المؤذن كلمة كلمة، ثم صلِّ على النبي ﷺ واسأل الله له الوسيلة.","قبل دخول الخلاء قل: «اللهم إني أعوذ بك من الخبث والخبائث»، وحين تخرج قل: «غفرانك».","حين ترى المطر ينزل، قل: «اللهم صيّبًا نافعًا»، وادعُ بما تحب؛ فالدعاء عند المطر مستجاب.","حين تقوم من مجلس، قل كفارة المجلس: «سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك».","إذا عطست فقل: «الحمد لله»، وإذا قال لك أخوك: «يرحمك الله»، فقل: «يهديكم الله ويصلح بالكم».","الصدق منجاة: من صدق نجا ولو بعد حين؛ فاجعل لسانك لا يعرف إلا الحق، وستجد أثره في قلبك وحياتك.","الكذب حبله قصير: كذبة واحدة تحتاج عشر كذبات لتغطيتها، وفي النهاية يخسر صاحبها ثقة الناس ورضا الله.","احترام الكبير بركة: من وقّر الكبير في صغره وقّره الناس في كبره؛ فقم للكبير، وقدّمه في المجلس، واستمع إليه بأدب.","اعطف على أخيك الصغير: خذ بيده وعلّمه برفق واصبر عليه؛ فأنت قدوته الأولى بعد والديك، وهو يقلّد ما تفعله.","الشيطان يسعى جاهدًا ليجعلك جاهلًا كسولًا؛ فإذا وسوس لك بترك الصلاة والمذاكرة فاستعذ بالله وقم إلى عملك — فالعلم والعمل أعداء الشيطان.","صلاتك نجاتك: من حافظ على الصلوات الخمس كانت له نورًا وبرهانًا ونجاة يوم القيامة؛ فلا تؤخّر صلاة عن وقتها أبدًا.","علاقتك بالله هي النجاة الحقيقية: كلما ضاقت بك الدنيا فافزع إلى الصلاة والدعاء؛ فباب الله لا يُغلق في وجه من طرقه.","لا تؤجّل عمل اليوم إلى الغد؛ فالتسويف لصّ الوقت. ابدأ الآن ولو بخطوة صغيرة، وستندهش مما تنجزه.","قبل أن تتكلم، اسأل نفسك ثلاثة أسئلة: هل كلامي حق؟ هل هو نافع؟ هل هو لطيف؟ فإن لم يكن كذلك فالصمت أجمل.","اجعل القرآن صاحبك لا ضيفك: صفحة واحدة كل يوم بعد الفجر تجعلك تختم وتتدبر، وخير الأعمال أدومها وإن قلّت.","احفظ سرّ أخيك كما تحفظ سرّك؛ فمن ستر مسلمًا ستره الله، والسر أمانة لا تُذاع ولو اختلفت مع صاحبه.","كن أول من يبدأ بالخير: بادر بالسلام، وبادر بالصلح إذا اختلفت مع صديق، وبادر بالمساعدة قبل أن تُطلب منك.","وقتك أمانة ستُسأل عنها: ساعة جدّ وساعة لعب باعتدال؛ فمن حفظ وقته في الصغر بنى مستقبله في الكبر.","ادعُ لأخيك بظهر الغيب؛ فحين تدعو له يقول الملك الموكّل بك: آمين، ولك بمثل ما دعوت.","ساعد أمك في أعمال البيت من نفسك قبل أن تطلب منك؛ فالبرّ الحقيقي أن تبادر لا أن تنتظر الطلب.","إذا غضبت فاسكت قليلًا وعدّ في سرّك إلى عشرة؛ فأكثر الكلام الذي نندم عليه قلناه ونحن غاضبون.","حافظ على أذكار الصباح والمساء؛ فهي حصنك من كل سوء، وبداية يومك ونهايته بذكر الله بركة.","التمس لأخيك عذرًا إذا رأيت منه ما لا يعجبك؛ فحسن الظن راحة لقلبك وحفظ لمحبتك للناس.","علّم صديقك شيئًا تعلمته اليوم؛ فزكاة العلم تعليمه، وما علّمته غيرك ثبت في ذهنك أكثر.","إذا وجدت قلمًا أو شيئًا ضائعًا من زميلك فسلّمه لمعلمك؛ فالأمانة أن يرجع الحق لصاحبه ولو كان صغيرًا.","زُر قريبًا مريضًا أو اتصل به واسأل عنه؛ فعيادة المريض تخفف عنه وتُدخل السرور على قلبه.","لا تُسرف في الماء وأنت تتوضأ أو تستحم؛ فالماء نعمة عظيمة، والنبي ﷺ كان يتوضأ بالقليل.","اغتنم وقت فراغك في حفظ سورة قصيرة أو مراجعة درس؛ فالدقائق الصغيرة تصنع إنجازات كبيرة.","اعتنِ بنظافة أسنانك بالفرشاة كل يوم؛ ففم نظيف وابتسامة جميلة من تمام النظافة التي يحبها الله.","لا تتكلم عن غائب بما يكره أن يسمعه؛ فالغيبة تأكل الحسنات كما تأكل النار الحطب.","اتصل بجدك وجدتك واسأل عن صحتهما وادعُ لهما؛ فصوتك يسعدهما أكثر مما تتصور.","ضع جنيهًا صغيرًا في حصالة صدقة كل أسبوع؛ فالصدقة ولو قليلة تطفئ غضب الرب وتزيد البركة.","إذا جاء زميل جديد إلى فصلك فكن أول من يرحب به ويعرّفه بالمكان؛ فالغريب يحتاج قلبًا قريبًا.","ابدأ كل عمل باسم الله: المذاكرة واللعب والأكل؛ فما بُدئ ببسم الله تمّت بركته.","ألقِ السلام على من تعرف ومن لا تعرف؛ فإفشاء السلام ينشر المحبة بين الناس.","استغفر الله كل يوم ولو عشر مرات بقلب حاضر؛ فالاستغفار يفتح أبواب الرزق ويفرّج الهموم.","اخفض صوتك في المسجد والمكتبة والأماكن الهادئة؛ فمراعاة مشاعر الآخرين من كمال الأدب.","اشكر الله كل صباح على نعم صغيرة: بصرك وسمعك وصحتك وأهلك؛ فمن شكر على القليل رزقه الله الكثير.","إذا لعبت مع أصدقائك فالعب بنزاهة: لا غش ولا ظلم؛ فالفوز الشريف وحده هو الذي يُفرح القلب.","رتّب حذاءك وأغراضك عند الباب؛ فالبيت المرتب يبدأ من عادات صغيرة مرتبة.","ادعُ لوالديك في سجودك؛ فأقرب ما يكون العبد من ربه وهو ساجد، ودعاؤك لهما من أعظم البر.","إذا رأيت عامل نظافة أو رجلًا يكدح في الشارع فسلّم عليه وادعُ له؛ فكل عمل شريف يستحق الاحترام.","نم مبكرًا بعد صلاة العشاء وقراءة ما تيسر من القرآن؛ فجسمك أمانة، والنوم الكافي يجعلك أقوى وأذكى في يومك."];
