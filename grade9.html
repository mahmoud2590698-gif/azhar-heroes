 (و) لمعنى ما يضاف إليه من عاقل، أو غير عاقل، أو زمان، أو مكان، فهي بحسب ما تضاف إليه: أي».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-699", "question": "ما إعراب «يره» في قوله تعالى: ﴿فمن يعمل مثقال ذرة خيرا يره﴾؟", "choices": ["فعل مضارع جواب الشرط مجزوم، وعلامة جزمه حذف حرف العلة (الألف)", "فعل مضارع مجزوم بالسكون", "فعل مضارع منصوب بأن مضمرة، وعلامة نصبه الفتحة", "فعل ماض مبني على الفتح"], "answer": "فعل مضارع جواب الشرط مجزوم، وعلامة جزمه حذف حرف العلة (الألف)", "answerIndex": 0, "explanation": "«(يره): فعل مضارع جواب الشرط مجزوم، وعلامة جزمه حذف حرف العلة، وهو الألف»؛ و«(من): اسم شرط جازم مبني على السكون في محل رفع مبتدأ» و«(يعمل): فعل مضارع فعل الشرط مجزوم وعلامة جزمه السكون».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-700", "question": "ما علامة إعراب فعل الشرط وجوابه في قوله تعالى: ﴿وإن تبدوا ما في أنفسكم أو تخفوه يحاسبكم به الله﴾؟", "choices": ["فرعية - أصلية (تبدوا: حذف النون، ويحاسبكم: السكون)", "أصلية - أصلية", "فرعية - فرعية", "أصلية - فرعية"], "answer": "فرعية - أصلية (تبدوا: حذف النون، ويحاسبكم: السكون)", "answerIndex": 0, "explanation": "«وإن تبدوا ما في أنفسكم أو تخفوه يحاسبكم به الله [البقرة 284]: تبدوا فعل الشرط مجزوم وعلامة جزمه حذف النون، ويحاسبكم جواب الشرط مجزوم وعلامة جزمه السكون».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-701", "question": "ما همزة الوصل؟", "choices": ["همزة تنطق في أول الكلام وتسقط في وسطه؛ جلبت للتوصل للنطق بالساكن", "همزة لا تكون إلا في الأسماء العشرة", "همزة تنطق في أول الكلام ووسطه، وترسم ء فوق الألف أو أسفل منها", "همزة تكون في أول الحروف المبدوءة بالهمزة ما عدا (أل)"], "answer": "همزة تنطق في أول الكلام وتسقط في وسطه؛ جلبت للتوصل للنطق بالساكن", "answerIndex": 0, "explanation": "«همزته همزة وصل تنطق إذا بدأنا الكلام بالكلمة التي زيدت فيها، وتسقط في وسط الكلام»؛ و«جلبت همزة الوصل توصلا للنطق بذلك الساكن».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-702", "question": "في قوله تعالى: ﴿ذلك الكتاب لا ريب فيه﴾ ما نوع همزة كلمة الكتاب؟", "choices": ["همزة وصل سماعية؛ لأنها همزة (أل)", "همزة وصل قياسية؛ لأنها في مصدر لفعل خماسي", "همزة قطع؛ لأنها في اسم مبدوء بالهمزة", "همزة قطع؛ لأنها في حرف دون (أل)"], "answer": "همزة وصل سماعية؛ لأنها همزة (أل)", "answerIndex": 0, "explanation": "«همزة (أل) همزة وصل سماعية في الحرف، وكل حرف غير (أل) همزته قطع قياسية».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-703", "question": "ما مواضع همزة الوصل في الفعل؟", "choices": ["المضارع المبدوء بهمزة للمفرد المتكلم فقط", "الماضي الرباعي وأمره ومصدره فقط", "الماضي والأمر مما زاد على أربعة أحرف، والأمر من الثلاثي الذي سكن ثانيه في المضارع", "الماضي الثلاثي ومصدره فقط"], "answer": "الماضي والأمر مما زاد على أربعة أحرف، والأمر من الثلاثي الذي سكن ثانيه في المضارع", "answerIndex": 2, "explanation": "«همزة الوصل في الفعل قياسية وتكون في: (أ) الماضي والأمر مما زاد على أربعة أحرف (الخماسي والسداسي). (ب) الأمر من الثلاثي الذي سكن ثانيه في المضارع»؛ ومنه قوله تعالى: ﴿ادع إلى سبيل ربك بالحكمة والموعظة الحسنة﴾ فادع أمر من الثلاثي (دعا) سكن ثانيه في المضارع (يدعو).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-704", "question": "ما الأسماء العشرة التي همزتها همزة وصل سماعية؟", "choices": ["اسم، ابن، ابنة، امرؤ، امرأة، اثنان، اثنتان، إنسان، أحمد، أستاذ", "ابن، ابنة، امرؤ، امرأة، أحمد، أخيك، أستاذ، إنسان، إحسان، أخذ", "اسم، است، ابن، ابنة، امرؤ، امرأة، اثنان، اثنتان، ابنُم، ايمُن", "اسم، است، ابن، ابنة، امرؤ، امرأة، اثنان، اثنتان، أحمد، محمد"], "answer": "اسم، است، ابن، ابنة، امرؤ، امرأة، اثنان، اثنتان، ابنُم، ايمُن", "answerIndex": 2, "explanation": "«وتأتي سماعية: في الأسماء العشرة المسموعة عن العرب وهي: (اسم، است، ابن، ابنة، امرؤ، امرأة، اثنان، اثنتان، ابنُم، ايمُن في القسم)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-705", "question": "في قوله تعالى: ﴿واستكبروا استكبارا﴾ ما نوع همزة كلمة استكبارا؟ ولماذا؟", "choices": ["همزة وصل قياسية؛ لأنها مصدر لفعل زادت حروفه على أربعة أحرف", "همزة قطع؛ لأنها في اسم مبدوء بالهمزة غير الأسماء العشرة", "همزة وصل سماعية؛ لأنها من الأسماء العشرة", "همزة قطع؛ لأنها مصدر للفعل الرباعي المبدوء بالهمزة"], "answer": "همزة وصل قياسية؛ لأنها مصدر لفعل زادت حروفه على أربعة أحرف", "answerIndex": 0, "explanation": "«تأتي همزة الوصل قياسية في الأسماء: في مصادر الأفعال الزائدة على أربعة أحرف»؛ واستكبارا مصدر للفعل السداسي (استكبر).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-706", "question": "ما همزة القطع؟", "choices": ["همزة تنطق في أول الكلام فقط وتسقط في وسطه", "همزة لا ترسم أبدا في الكتابة", "همزة تكون في (أل) فقط", "همزة تنطق في أول الكلام ووسطه، وترسم ء فوق الألف أو أسفل منها"], "answer": "همزة تنطق في أول الكلام ووسطه، وترسم ء فوق الألف أو أسفل منها", "answerIndex": 3, "explanation": "«همزة القطع هي التي تنطق في أول الكلام ووسطه»؛ وترسم الهمزة فوق الألف أو أسفل منها.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-707", "question": "ما مواضع همزة القطع؟", "choices": ["الأسماء المبدوءة بالهمزة ما عدا العشرة، وأول الحروف ما عدا (أل)، وأول الماضي الثلاثي ومصدره، وأول الماضي الرباعي وأمره ومصدره، وأول المضارع للمفرد المتكلم", "الماضي والأمر مما زاد على أربعة أحرف فقط", "الأمر من الثلاثي الذي سكن ثانيه في المضارع فقط", "الأسماء العشرة فقط"], "answer": "الأسماء المبدوءة بالهمزة ما عدا العشرة، وأول الحروف ما عدا (أل)، وأول الماضي الثلاثي ومصدره، وأول الماضي الرباعي وأمره ومصدره، وأول المضارع للمفرد المتكلم", "answerIndex": 0, "explanation": "«الأسماء المبدوءة بالهمزة ما عدا الأسماء العشرة المسموعة عن العرب التي همزتها وصل» و«أول الحروف المبدوءة بالهمزة، ما عدا (أل)» و«أول الفعل الماضي الثلاثي المبدوء بالهمزة، ومصدره» و«أول الفعل الماضي الرباعي المبدوء بالهمزة، وأمره، ومصدره» و«أول الفعل المضارع المبدوء بهمزة للمفرد المتكلم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-708", "question": "في قوله تعالى: ﴿وإذ استسقى موسى لقومه﴾ ما نوع همزة كلمة استسقى؟", "choices": ["همزة قطع؛ لأنها في ماض رباعي", "همزة قطع؛ لأنها في مضارع للمفرد المتكلم", "همزة وصل قياسية؛ لأنها في ماض سداسي", "همزة وصل سماعية؛ لأنها من الأسماء العشرة"], "answer": "همزة وصل قياسية؛ لأنها في ماض سداسي", "answerIndex": 2, "explanation": "«الماضي والأمر مما زاد على أربعة أحرف (الخماسي والسداسي)»؛ و«الفعل (استسقى) ماض سداسي».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-709", "question": "في قوله تعالى: ﴿ثاني اثنين إذ هما في الغار﴾ ما نوع همزة كلمة اثنين؟", "choices": ["همزة وصل قياسية؛ لأنها مصدر لفعل خماسي", "همزة وصل سماعية؛ لأنها من الأسماء العشرة", "همزة قطع؛ لأنها في حرف دون (أل)", "همزة قطع؛ لأنها في اسم مبدوء بالهمزة غير العشرة"], "answer": "همزة وصل سماعية؛ لأنها من الأسماء العشرة", "answerIndex": 1, "explanation": "«في الأسماء العشرة المسموعة عن العرب وهي: (اسم، است، ابن، ابنة، امرؤ، امرأة، اثنان، اثنتان، ابنُم، ايمُن في القسم)»؛ واثنين مثنى اثنان.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-710", "question": "في قوله تعالى: ﴿اخلفني في قومي وأصلح﴾ ما نوع همزة كلمة أصلح؟", "choices": ["همزة وصل قياسية؛ لأنها أمر من الخماسي", "همزة قطع؛ لأنها ماض ثلاثي مبدوء بالهمزة", "همزة وصل سماعية؛ لأنها من الأسماء العشرة", "همزة قطع؛ لأنها أمر من الرباعي المبدوء بالهمزة"], "answer": "همزة قطع؛ لأنها أمر من الرباعي المبدوء بالهمزة", "answerIndex": 3, "explanation": "«أول الفعل الماضي الرباعي المبدوء بالهمزة، وأمره، ومصدره»؛ أما اخلفني فهمزتها وصل؛ لأنها أمر من الثلاثي (خلف) سكن ثانيه في المضارع (يخلف).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-711", "question": "ما المصدر؟", "choices": ["أصل المشتقات، يدل على الحدث والزمن معا", "أصل المشتقات، يدل على الحدث مجردا من الزمن", "فرع من المشتقات، يدل على الزمن فقط", "اسم يدل على هيئة الفعل عند وقوعه"], "answer": "أصل المشتقات، يدل على الحدث مجردا من الزمن", "answerIndex": 1, "explanation": "«المصدر أصل المشتقات، وهو يدل على الحدث مجردا من الزمن، بخلاف الفعل الذي يدل على الحدث والزمن».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-712", "question": "ما المصادر الثلاثية السماعية؟ وكيف تعرف؟", "choices": ["هي التي لها قاعدة قياسية يقاس عليها، مثل: صياغة وجولان", "هي التي تأتي على وزن فعالة دائما", "هي التي لا تخضع لقاعدة، وإنما تعرف بالسماع من أفواه الثقات وبالرجوع إلى المعاجم اللغوية، مثل: قراءة وغفران", "هي التي لا تعرف إلا من القرآن الكريم"], "answer": "هي التي لا تخضع لقاعدة، وإنما تعرف بالسماع من أفواه الثقات وبالرجوع إلى المعاجم اللغوية، مثل: قراءة وغفران", "answerIndex": 2, "explanation": "«المصادر الثلاثية السماعية: وهي لا تخضع لقاعدة، وإنما تعرف بالسماع، من أفواه الثقات، وبالرجوع إلى المعاجم اللغوية مثل: (قرأ: قراءة)، و(غفر: غفرانًا)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-713", "question": "ما وزن مصدر ما دل على صناعة أو حرفة، وما وزن مصدر ما دل على حركة واضطراب؟", "choices": ["فُعُول، وفُعَال", "فُعْلة، وفَعِيل", "فِعَالة، وفَعَلان", "فُعَال، وفُعُول"], "answer": "فِعَالة، وفَعَلان", "answerIndex": 2, "explanation": "«صناعة، أو حرفة، فمصدره على وزن (فعالة)»؛ و«حركة واضطراب، فمصدره على وزن (فعلان)»؛ ومثالهما: «صاغ: صياغة» و«جال: جولان».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-714", "question": "ما وزن مصدر ما دل على لون، وما وزن مصدر ما دل على سير؟", "choices": ["فُعَال، وفُعُول", "فُعْلة، وفَعِيل", "فِعَالة، وفَعَلان", "فُعُول، وفُعَال"], "answer": "فُعْلة، وفَعِيل", "answerIndex": 1, "explanation": "«لون، فمصدره على وزن (فعلة)»؛ و«سير، فمصدره على وزن (فعيل)»؛ ومثالهما: «حمر: حمرة» و«رحل: رحيل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-715", "question": "ما وزن مصدر ما دل على داء أو مرض، وما وزن مصدر ما دل على صوت؟", "choices": ["فُعَال للداء، وفُعَال أو فَعِيل للصوت", "فُعُول، وفُعْلة", "فِعَالة، وفَعَلان", "فُعْلة، وفَعِيل"], "answer": "فُعَال للداء، وفُعَال أو فَعِيل للصوت", "answerIndex": 0, "explanation": "«داء، أو مرض، فمصدره على وزن (فعال)»؛ و«صوت، فمصدره على وزن (فعال أو فعيل)»؛ ومثالهما: «صدع: صداع» و«حف: حفيف» و«بكى: بكاء».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-716", "question": "ما وزن مصدر ما دل على امتناع وإباء؟", "choices": ["فَعَلان", "فُعُول أو فِعَال", "فِعَالة", "فَعِيل"], "answer": "فُعُول أو فِعَال", "answerIndex": 1, "explanation": "«امتناع وإباء، فمصدره على وزن (فعول أو فعال)»؛ ومثاله: «نفر: نفار ونفور».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-717", "question": "ما الغالب في مصدر الفعل الثلاثي المتعدي (فهم، فتح، أخذ)؟", "choices": ["على وزن فُعُول", "على وزن فَعَلان", "على وزن فَعْل", "على وزن فِعَالة"], "answer": "على وزن فَعْل", "answerIndex": 2, "explanation": "«أما الفعل المتعدي (فعل فعل) مكسور العين أو مفتوحها فالمصدر منهما يأتي على وزن (فعل)»؛ مثل: «(فهم، فهم) (فتح، فتح) (أخذ، أخذ)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-718", "question": "في قوله تعالى: ﴿يبتغون فضلا من ربهم ورضوانا﴾ ما حكم مصدري فضلا ورضوانا من حيث القياس والسماع؟", "choices": ["قياسيان؛ لأنهما يدلان على حركة واضطراب", "الأول سماعي والثاني قياسي", "سماعيان؛ لأنهما لا يدلان على شيء من معاني القياسي", "الأول قياسي والثاني سماعي"], "answer": "سماعيان؛ لأنهما لا يدلان على شيء من معاني القياسي", "answerIndex": 2, "explanation": "«من هذه المصادر ما هو غير قياسي، أي لا ينضبط تحت قاعدة، وإنما يعرف بالرجوع إلى المسموع من أفواه الثقات وبالقراءة في المعاجم اللغوية»؛ ففضلا ورضوانا لا يدلان على صناعة ولا حركة ولا لون ولا سير ولا داء ولا صوت ولا امتناع.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-719", "question": "ما مصدر الفعل الرباعي (أفعل)؟ وما الذي يحدث إذا كانت فاء الفعل واوا؟", "choices": ["مصدره فعال ومفاعلة، وإذا كانت فاء الفعل واوا حذفت", "مصدره إفعال، وإذا كانت فاء الفعل واوا قلبت ياء، مثل: أوقد إيقادا", "مصدره تفعيل، وإذا كانت فاء الفعل واوا قلبت ياء", "مصدره فعللة، وإذا كانت فاء الفعل واوا قلبت همزة"], "answer": "مصدره إفعال، وإذا كانت فاء الفعل واوا قلبت ياء، مثل: أوقد إيقادا", "answerIndex": 1, "explanation": "«الفعل الرباعي (أفعل) مصدره (إفعال) فإذا كانت فاء الفعل واوا قلبت ياء مثل: (أوقد إيقادا)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-720", "question": "ما الذي يحدث في مصدر الفعل الرباعي (أفعل) إذا كانت لامه حرف علة؟ وإذا كانت عينه ألفا؟", "choices": ["تقلب اللام ياء، وتحذف العين دون تعويض", "تقلب اللام واوا، وتقلب العين همزة", "تحذف اللام، وتقلب العين ياء", "إذا كانت لامه حرف علة قلبت في المصدر همزة، مثل: أرضى إرضاء؛ وإذا كانت عينه ألفا حذفت في المصدر وعوض عنها تاء في الآخر، مثل: أراد إرادة"], "answer": "إذا كانت لامه حرف علة قلبت في المصدر همزة، مثل: أرضى إرضاء؛ وإذا كانت عينه ألفا حذفت في المصدر وعوض عنها تاء في الآخر، مثل: أراد إرادة", "answerIndex": 3, "explanation": "«وإذا كانت لامه حرف علة قلبت في المصدر همزة، مثل: (أرضى إرضاء) وإذا كانت عين الفعل ألفا حذفت في المصدر وعوض عنها تاء في الآخر، مثل: (أراد إرادة)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-721", "question": "ما مصدر الفعل الرباعي (فعل)؟ وما الذي يحدث إذا كان معتل اللام؟", "choices": ["مصدره فعللة، فإذا كان معتل اللام قلبت ياء", "مصدره إفعال، فإذا كان معتل اللام قلبت همزة", "مصدره فعال ومفاعلة، فإذا كان معتل اللام حذفت ياؤه", "مصدره تفعيل، فإذا كان معتل اللام حذفت ياء التفعيل وعوض عنها تاء في الآخر، مثل: عدى تعدية"], "answer": "مصدره تفعيل، فإذا كان معتل اللام حذفت ياء التفعيل وعوض عنها تاء في الآخر، مثل: عدى تعدية", "answerIndex": 3, "explanation": "«الفعل الرباعي (فعل) مصدره (تفعيل)، فإذا كان معتل اللام حذفت ياء التفعيل وعوض عنها تاء في الآخر، مثل: (عدى تعدية)»؛ ومنه تنمية وتزكية.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-722", "question": "ما مصدر الفعل الرباعي (فاعل)؟ ومتى لا يكون مصدره إلا على مفاعلة؟", "choices": ["مصدره فعللة وفعلال فقط", "مصدره فعال ومفاعلة، مثل: ناضل نضالا ومناضلة؛ وإذا كان الفعل مبدوءا بالياء المفتوحة فلا يكون مصدره إلا على مفاعلة، مثل: يامن ميامنة", "مصدره إفعال فقط", "مصدره تفعيل فقط"], "answer": "مصدره فعال ومفاعلة، مثل: ناضل نضالا ومناضلة؛ وإذا كان الفعل مبدوءا بالياء المفتوحة فلا يكون مصدره إلا على مفاعلة، مثل: يامن ميامنة", "answerIndex": 1, "explanation": "«الفعل الرباعي (فاعل) مصدره (فعال ومفاعلة) مثل: (ناضل نضالا ومناضلة)، وإذا كان الفعل مبدوءا بالياء المفتوحة فلا يكون مصدره إلا على (مفاعلة) مثل: (يامن - ميامنة)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-723", "question": "ما مصدر الفعل الرباعي (فعلل)؟", "choices": ["مصدره تفعيل دائما", "مصدره فعال ومفاعلة دائما", "مصدره إفعال دائما", "مصدره فعللة إذا كان غير مضعف، مثل: زخرف زخرفة؛ فإذا كان مضعفا كان مصدره فعلال وفعللة، مثل: زلزل زلزالا وزلزلة"], "answer": "مصدره فعللة إذا كان غير مضعف، مثل: زخرف زخرفة؛ فإذا كان مضعفا كان مصدره فعلال وفعللة، مثل: زلزل زلزالا وزلزلة", "answerIndex": 3, "explanation": "«الفعل الرباعي (فعلل) مصدره (فعللة) إذا كان غير مضعف، مثل: (زخرف زخرفة) فإذا كان مضعفا كان مصدره (فعلال - فعللة) مثل: (زلزل - زلزال - زلزلة)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-724", "question": "في قوله تعالى: ﴿وما زادهم إلا إيمانا وتسليما﴾ ما وزن مصدري إيمانا وتسليما؟", "choices": ["إيمانا على وزن مفاعلة، وتسليما على وزن إفعال", "إيمانا على وزن تفعيل، وتسليما على وزن تفعيل", "إيمانا على وزن إفعال، وتسليما على وزن إفعال", "إيمانا على وزن إفعال، وتسليما على وزن تفعيل"], "answer": "إيمانا على وزن إفعال، وتسليما على وزن تفعيل", "answerIndex": 3, "explanation": "إيمانا مصدر الفعل (آمن) على وزن إفعال؛ لأن «الفعل الرباعي (أفعل) مصدره (إفعال)»؛ وتسليما مصدر الفعل (سلم) على وزن تفعيل؛ لأن «الفعل الرباعي (فعل) مصدره (تفعيل)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-725", "question": "كيف يصاغ مصدر الفعل الخماسي المبدوء بهمزة وصل؟", "choices": ["يجيء مصدره على وزن مضارعه مع كسر ثالثه", "يجيء مصدره على وزن الماضي مع ضم ثالثه", "يجيء مصدره على وزن الماضي مع كسر ثالثه، وزيادة ألف قبل الآخر، مثل: اعتمد اعتمادا وانكسر انكسارا", "يأتي مصدره على وزن ماضيه مع ضم ما قبل الآخر"], "answer": "يجيء مصدره على وزن الماضي مع كسر ثالثه، وزيادة ألف قبل الآخر، مثل: اعتمد اعتمادا وانكسر انكسارا", "answerIndex": 2, "explanation": "«فإذا كان الخماسي مبدوءا بهمزة وصل فيجيء مصدره على وزن الماضي مع كسر ثالثه، وزيادة ألف قبل الآخر، مثل: (اعتمد، اعتمادا) و(انكسر، انكسارا) و(احمر، احمرارا)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-726", "question": "كيف يصاغ مصدر الفعل الخماسي المبدوء بتاء زائدة؟", "choices": ["يجيء مصدره على وزن الماضي مع كسر ثالثه وزيادة ألف قبل الآخر", "يأتي مصدره على وزن ماضيه مع ضم ما قبل الآخر، مثل: تقدم تقدما وتقاعس تقاعسا", "يأتي مصدره على وزن الماضي مع فتح ما قبل الآخر", "يأتي مصدره على وزن مضارعه مع ضم ما قبل الآخر"], "answer": "يأتي مصدره على وزن ماضيه مع ضم ما قبل الآخر، مثل: تقدم تقدما وتقاعس تقاعسا", "answerIndex": 1, "explanation": "«وإذا كان الفعل خماسيا مبدوءا بتاء زائدة يأتي مصدره على وزن ماضيه مع ضم ما قبل الآخر، مثل (تقدم، تقدما) و(تقاعس، تقاعسا) و(تهلل، تهللا)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-727", "question": "ما الذي يحدث للام الفعل الألف في مصدر الخماسي المبدوء بهمزة وصل؟ وفي مصدر الخماسي المبدوء بتاء زائدة؟", "choices": ["تقلب ياء في الحالين", "في المبدوء بهمزة وصل تقلب همزة، مثل: انطوى انطواء واعتلى اعتلاء؛ وفي المبدوء بتاء زائدة تقلب ياء ويكسر ما قبلها، مثل: تصدى تصديا وتقاضى تقاضيا", "تقلب واوا في الحالين", "تحذف في الحالين"], "answer": "في المبدوء بهمزة وصل تقلب همزة، مثل: انطوى انطواء واعتلى اعتلاء؛ وفي المبدوء بتاء زائدة تقلب ياء ويكسر ما قبلها، مثل: تصدى تصديا وتقاضى تقاضيا", "answerIndex": 1, "explanation": "«فإذا كانت لام الفعل ألفا قلبت همزة، مثل (انطوى، انطواء) و(اعتلى، اعتلاء)»؛ و«فإذا كانت لام الفعل ألفا قلبت في المصدر ياء، وكسر ما قبلها، مثل: (تصدى، تصديا) و(تقاضى، تقاضيا)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-728", "question": "كيف يصاغ مصدر الفعل السداسي؟", "choices": ["يجيء مصدره على وزن الماضي دون زيادة ألف", "يأتي مصدره على وزن ماضيه مع ضم ما قبل الآخر", "يجيء مصدره على وزن مضارعه مع كسر ثالثه", "يجيء مصدره على وزن الماضي مع كسر ثالثه، وزيادة ألف قبل الآخر، مثل: استغفر استغفارا؛ فإذا كانت عينه ألفا حذفت وعوض عنها بتاء في الآخر، مثل: استقام استقامة؛ وإذا كانت لامه ألفا قلبت همزة، مثل: استوفى استيفاء"], "answer": "يجيء مصدره على وزن الماضي مع كسر ثالثه، وزيادة ألف قبل الآخر، مثل: استغفر استغفارا؛ فإذا كانت عينه ألفا حذفت وعوض عنها بتاء في الآخر، مثل: استقام استقامة؛ وإذا كانت لامه ألفا قلبت همزة، مثل: استوفى استيفاء", "answerIndex": 3, "explanation": "«إذا كان الفعل سداسيا - ولا يكون إلا مبدوءا بهمزة وصل - فيجيء مصدره على وزن الماضي مع كسر ثالثه، وزيادة ألف قبل الآخر مثل: (اقشعر، اقشعرارا) و(استغفر، استغفارا)»؛ و«فإذا كانت عين الفعل ألفا حذفت وعوض عنها بتاء في الآخر مثل: (استقام، استقامة)»؛ و«وإذا كانت لام الفعل ألفا قلبت همزة مثل: (استوفى، استيفاء)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-729", "question": "ما الذي حدث من تغيير في مصدر الفعل (اهتدى)؟", "choices": ["قلبت فاء الكلمة ياء", "حذفت عين الكلمة وعوض عنها بتاء", "جاء على وزن الماضي، وكسر ثالثه، وزيادة ألف قبل الآخر، وقلب لام الكلمة همزة", "جاء على وزن الماضي، وضم ما قبل الآخر"], "answer": "جاء على وزن الماضي، وكسر ثالثه، وزيادة ألف قبل الآخر، وقلب لام الكلمة همزة", "answerIndex": 2, "explanation": "«اهتدى: اهتداء، افتعال، جاء على وزن الماضي، وكسر ثالثه، وزيادة ألف قبل الآخر، وقلب لام الكلمة همزة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-730", "question": "في قوله تعالى: ﴿إلا ابتغاء وجه ربه الأعلى﴾ ما نوع مصدر كلمة ابتغاء؟", "choices": ["مصدر سداسي، فعله مثال", "مصدر خماسي، فعله ناقص (ابتغى)", "مصدر رباعي، فعله أجوف", "مصدر ثلاثي، فعله صحيح"], "answer": "مصدر خماسي، فعله ناقص (ابتغى)", "answerIndex": 1, "explanation": "«ابتغى: ابتغاء، افتعال، جاء على وزن الماضي، وكسر ثالثه، وزيادة ألف قبل الآخر، وقلب لام الكلمة همزة»؛ وفعله (ابتغى) ناقص؛ لأن لامه ياء.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-731", "question": "ما المصدر الميمي؟", "choices": ["اسم يدل على هيئة الفعل عند وقوعه", "مصدر يدل على وقوع الحدث مرة واحدة", "اسم يدل على معنى المصدر الأصلي، مبدوء بميم زائدة لغير المفاعلة", "المصدر المصنوع بزيادة ياء مشددة وتاء"], "answer": "اسم يدل على معنى المصدر الأصلي، مبدوء بميم زائدة لغير المفاعلة", "answerIndex": 2, "explanation": "«المصدر الميمي: اسم يدل على معنى المصدر الأصلي، مبدوء بميم زائدة لغير المفاعلة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-732", "question": "كيف يصاغ المصدر الميمي من الفعل الثلاثي الصحيح والأجوف والناقص؟", "choices": ["على وزن فَعْلة بفتح الفاء", "على وزن مضارعه بإبدال حرف المضارعة ميما مضمومة", "على وزن مَفْعَل بفتح العين، مثل: مَقْرَأ ومَعْبَد ومَنْزَل، ومن الأجوف مثل: مَفَاز ومَعَاد، ومن الناقص مثل: مَجْرَى ومَأْوَى", "على وزن مَفْعِل بكسر العين"], "answer": "على وزن مَفْعَل بفتح العين، مثل: مَقْرَأ ومَعْبَد ومَنْزَل، ومن الأجوف مثل: مَفَاز ومَعَاد، ومن الناقص مثل: مَجْرَى ومَأْوَى", "answerIndex": 2, "explanation": "«يصاغ المصدر الميمي على وزن (مفعل) بفتح العين من الفعل الثلاثي الصحيح مضموم العين أو مفتوحها أو مكسورها في المضارع مثل: (مقرأ، معبد، منزل)، ومن الثلاثي الأجوف، مثل: (مفاز، معاد) ومن الثلاثي الناقص، مثل: (مجرى، مأوى)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-733", "question": "كيف يصاغ المصدر الميمي من الفعل الثلاثي المثال الواوي صحيح اللام الذي حذفت فاؤه في المضارع؟", "choices": ["على وزن مَفْعِل بكسر العين، مثل: مَوْقِف ومَوْثِب", "على وزن مَفْعَل بفتح العين", "على وزن فَعْلة بفتح الفاء", "على وزن مضارعه بإبدال حرف المضارعة ميما مضمومة"], "answer": "على وزن مَفْعِل بكسر العين، مثل: مَوْقِف ومَوْثِب", "answerIndex": 0, "explanation": "«ويصاغ على وزن (مفعل) بكسر العين من الثلاثي المثال الواوي صحيح اللام الذي حذفت فاؤه في المضارع، مثل: (موقف، موثب)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-734", "question": "كيف يصاغ المصدر الميمي من غير الثلاثي؟ وكيف نفرق بينه وبين اسم المفعول؟", "choices": ["على وزن مضارعه بإبدال حرف المضارعة ميما مضمومة وفتح ما قبل الآخر، ويفرق بينهما بسياق الجملة", "على وزن مَفْعِل بكسر العين", "على وزن فِعْلة بكسر الفاء", "على وزن مَفْعَل بفتح العين"], "answer": "على وزن مضارعه بإبدال حرف المضارعة ميما مضمومة وفتح ما قبل الآخر، ويفرق بينهما بسياق الجملة", "answerIndex": 0, "explanation": "«ويصاغ من غير الثلاثي على وزن مضارعه بإبدال حرف المضارعة ميما مضمومة وفتح ما قبل الآخر، أي (طريقة صياغة اسم المفعول)، ويفرق بينهما بسياق الجملة»؛ مثل ملتقى ومستقر.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-735", "question": "وضح الفرق بين كلمة مستخرج في المثالين: (أ) استخرج البترول من باطن الأرض مستخرجا. (ب) البترول مستخرج من باطن الأرض.", "choices": ["في الأولى مصدر ميمي، وفي الثانية اسم مفعول", "في المثالين اسم مفعول", "في الأولى اسم مفعول، وفي الثانية مصدر ميمي", "في المثالين مصدر ميمي"], "answer": "في الأولى مصدر ميمي، وفي الثانية اسم مفعول", "answerIndex": 0, "explanation": "«ويصاغ من غير الثلاثي على وزن مضارعه بإبدال حرف المضارعة ميما مضمومة وفتح ما قبل الآخر، أي (طريقة صياغة اسم المفعول)، ويفرق بينهما بسياق الجملة»؛ ففي (أ) دلت على معنى المصدر (الاستخراج)، وفي (ب) دلت على من وقع عليه الفعل.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-736", "question": "في قوله تعالى: ﴿إنها ساءت مستقرا ومقاما﴾ ما نوعا مصدري مستقرا ومقاما؟", "choices": ["اسم مرة واسم هيئة", "مصدران ميميان: مستقرا لفعل سداسي (استقر)، ومقاما لفعل رباعي (أقام)", "مصدران أصليان: مستقرا لفعل سداسي، ومقاما لفعل رباعي", "مصدر ميمي ومصدر صناعي"], "answer": "مصدران ميميان: مستقرا لفعل سداسي (استقر)، ومقاما لفعل رباعي (أقام)", "answerIndex": 1, "explanation": "«مستقرا: مستفعل، استقر، لأنه من فعل سداسي»؛ و«مقاما: مفعل، أقام، لأنه من فعل رباعي»؛ وكلاهما مصدر ميمي؛ لأنه «اسم يدل على معنى المصدر الأصلي، مبدوء بميم زائدة لغير المفاعلة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-737", "question": "ما المصدر الصناعي؟", "choices": ["مصدر يدل على وقوع الحدث مرة واحدة", "المصدر المصنوع بزيادة ياء مشددة وتاء على آخر الاسم للدلالة على حقيقته، وما يحيط بها من الهيئات والأحوال", "اسم يدل على معنى المصدر الأصلي مبدوء بميم زائدة", "مصدر يدل على هيئة الفعل عند وقوعه"], "answer": "المصدر المصنوع بزيادة ياء مشددة وتاء على آخر الاسم للدلالة على حقيقته، وما يحيط بها من الهيئات والأحوال", "answerIndex": 1, "explanation": "«المصدر الصناعي هو المصدر المصنوع بزيادة ياء مشددة وتاء على آخر الاسم للدلالة على حقيقته، وما يحيط بها من الهيئات والأحوال».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-738", "question": "يشتمل المصدر الصناعي على؟", "choices": ["ميم زائدة في أوله", "تاء مربوطة في آخره فقط", "ياء مدية في وسطه", "ياء مشددة وتاء مربوطة على آخر الاسم"], "answer": "ياء مشددة وتاء مربوطة على آخر الاسم", "answerIndex": 3, "explanation": "«أسماء زيد على آخرها ياء مشددة وتاء مربوطة؛ وذلك للدلالة على حقيقة الاسم وما يحيط بها من الهيئات والأحوال».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-739", "question": "ما حكم المصدر الصناعي من حيث القياس والسماع؟", "choices": ["سماعي", "قليل", "نادر", "قياسي؛ لكثرة وروده عن العرب ولحاجة العلم له"], "answer": "قياسي؛ لكثرة وروده عن العرب ولحاجة العلم له", "answerIndex": 3, "explanation": "«أصدر مجمع اللغة العربية قرارا بقياسية المصدر الصناعي؛ لكثرة وروده عن العرب، ولحاجة العلم له».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-740", "question": "ما الفرق بين كلمة عالمية في قولنا: عالمية الإسلام لا ينكرها إلا جاحد، وقولنا: رسالة الإسلام رسالة عالمية؟", "choices": ["كلتاهما مصدر صناعي", "الأولى مصدر صناعي، والثانية اسم منسوب (صفة)", "الأولى اسم منسوب والثانية مصدر صناعي", "كلتاهما اسم منسوب"], "answer": "الأولى مصدر صناعي، والثانية اسم منسوب (صفة)", "answerIndex": 1, "explanation": "«عالمية الإسلام لا ينكرها إلا جاحد»؛ و«رسالة الإسلام رسالة عالمية»؛ فالأولى مصدر صناعي؛ لأنها «المصدر المصنوع بزيادة ياء مشددة وتاء على آخر الاسم»؛ والثانية اسم منسوب وصفت به الرسالة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-741", "question": "أي جملة لم تشتمل على مصدر صناعي؟", "choices": ["الوطنية متأصلة في دمائنا", "الإنسانية من الصفات الحميدة", "الحرية مطلب للشعوب", "التربية الحسنة مطلب أساسي"], "answer": "التربية الحسنة مطلب أساسي", "answerIndex": 3, "explanation": "«التربية الحسنة مطلب أساسي»؛ فالتربية مصدر رباعي (ربى: تربية) لا مصدر صناعي؛ لأن الصناعي «المصدر المصنوع بزيادة ياء مشددة وتاء على آخر الاسم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-742", "question": "ما اسم المرة؟ وكيف يصاغ من الفعل الثلاثي؟", "choices": ["المصدر المصنوع بزيادة ياء مشددة وتاء", "مصدر يدل على هيئة الفعل عند وقوعه؛ ويصاغ على وزن فِعْلة بكسر الفاء", "اسم يدل على معنى المصدر الأصلي مبدوء بميم زائدة", "مصدر يدل على وقوع الحدث مرة واحدة، ويجوز تثنيته وجمعه؛ ويصاغ من الفعل الثلاثي على وزن فَعْلة بفتح الفاء، مثل: لفتة ونظرة"], "answer": "مصدر يدل على وقوع الحدث مرة واحدة، ويجوز تثنيته وجمعه؛ ويصاغ من الفعل الثلاثي على وزن فَعْلة بفتح الفاء، مثل: لفتة ونظرة", "answerIndex": 3, "explanation": "«اسم المرة: مصدر يدل على وقوع الحدث مرة واحدة، ويجوز تثنيته وجمعه (دعوة، دعوتان، دعوات)»؛ و«يصاغ اسم المرة من الفعل الثلاثي على وزن (فعلة)، مثل: (لفته، نظرة)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "الصرف", "id": "h26-g9-743", "question": "كيف يصاغ اسم المرة من غير الثلاثي؟ ومتى يجب وصفه بكلمة (واحدة)؟", "choices": ["على وزن المصدر الأصلي للفعل مع زيادة var AYAH={"051057": {"a": 57, "text": "مَآ أُرِيدُ مِنْهُم مِّن رِّزْقٍۢ وَمَآ أُرِيدُ أَن يُطْعِمُونِ"}, "085008": {"a": 8, "text": "وَمَا نَقَمُوا۟ مِنْهُمْ إِلَّآ أَن يُؤْمِنُوا۟ بِٱللَّهِ ٱلْعَزِيزِ ٱلْحَمِيدِ"}, "052035": {"a": 35, "text": "أَمْ خُلِقُوا۟ مِنْ غَيْرِ شَىْءٍ أَمْ هُمُ ٱلْخَٰلِقُونَ"}, "054007": {"a": 7, "text": "خُشَّعًا أَبْصَٰرُهُمْ يَخْرُجُونَ مِنَ ٱلْأَجْدَاثِ كَأَنَّهُمْ جَرَادٌۭ مُّنتَشِرٌۭ"}, "051056": {"a": 56, "text": "وَمَا خَلَقْتُ ٱلْجِنَّ وَٱلْإِنسَ إِلَّا لِيَعْبُدُونِ"}, "096001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ"}, "083031": {"a": 31, "text": "وَإِذَا ٱنقَلَبُوٓا۟ إِلَىٰٓ أَهْلِهِمُ ٱنقَلَبُوا۟ فَكِهِينَ"}, "056077": {"a": 77, "text": "إِنَّهُۥ لَقُرْءَانٌۭ كَرِيمٌۭ"}, "104004": {"a": 4, "text": "كَلَّا ۖ لَيُنۢبَذَنَّ فِى ٱلْحُطَمَةِ"}, "084025": {"a": 25, "text": "إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۭ"}, "051028": {"a": 28, "text": "فَأَوْجَسَ مِنْهُمْ خِيفَةًۭ ۖ قَالُوا۟ لَا تَخَفْ ۖ وَبَشَّرُوهُ بِغُلَٰمٍ عَلِيمٍۢ"}, "050008": {"a": 8, "text": "تَبْصِرَةًۭ وَذِكْرَىٰ لِكُلِّ عَبْدٍۢ مُّنِيبٍۢ"}, "089015": {"a": 15, "text": "فَأَمَّا ٱلْإِنسَٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ"}, "071007": {"a": 7, "text": "وَإِنِّى كُلَّمَا دَعَوْتُهُمْ لِتَغْفِرَ لَهُمْ جَعَلُوٓا۟ أَصَٰبِعَهُمْ فِىٓ ءَاذَانِهِمْ وَٱسْتَغْشَوْا۟ ثِيَابَهُمْ وَأَصَرُّوا۟ وَٱسْتَكْبَرُوا۟ ٱسْتِكْبَارًۭا"}, "051027": {"a": 27, "text": "فَقَرَّبَهُۥٓ إِلَيْهِمْ قَالَ أَلَا تَأْكُلُونَ"}, "051055": {"a": 55, "text": "وَذَكِّرْ فَإِنَّ ٱلذِّكْرَىٰ تَنفَعُ ٱلْمُؤْمِنِينَ"}, "057024": {"a": 24, "text": "ٱلَّذِينَ يَبْخَلُونَ وَيَأْمُرُونَ ٱلنَّاسَ بِٱلْبُخْلِ ۗ وَمَن يَتَوَلَّ فَإِنَّ ٱللَّهَ هُوَ ٱلْغَنِىُّ ٱلْحَمِيدُ"}, "067004": {"a": 4, "text": "ثُمَّ ٱرْجِعِ ٱلْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ ٱلْبَصَرُ خَاسِئًۭا وَهُوَ حَسِيرٌۭ"}, "089010": {"a": 10, "text": "وَفِرْعَوْنَ ذِى ٱلْأَوْتَادِ"}, "054036": {"a": 36, "text": "وَلَقَدْ أَنذَرَهُم بَطْشَتَنَا فَتَمَارَوْا۟ بِٱلنُّذُرِ"}, "066002": {"a": 2, "text": "قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْ ۚ وَٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ"}, "051026": {"a": 26, "text": "فَرَاغَ إِلَىٰٓ أَهْلِهِۦ فَجَآءَ بِعِجْلٍۢ سَمِينٍۢ"}, "055010": {"a": 10, "text": "وَٱلْأَرْضَ وَضَعَهَا لِلْأَنَامِ"}, "071006": {"a": 6, "text": "فَلَمْ يَزِدْهُمْ دُعَآءِىٓ إِلَّا فِرَارًۭا"}, "054010": {"a": 10, "text": "فَدَعَا رَبَّهُۥٓ أَنِّى مَغْلُوبٌۭ فَٱنتَصِرْ"}, "057001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ"}, "076023": {"a": 23, "text": "إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ ٱلْقُرْءَانَ تَنزِيلًۭا"}, "056091": {"a": 91, "text": "فَسَلَٰمٌۭ لَّكَ مِنْ أَصْحَٰبِ ٱلْيَمِينِ"}, "050004": {"a": 4, "text": "قَدْ عَلِمْنَا مَا تَنقُصُ ٱلْأَرْضُ مِنْهُمْ ۖ وَعِندَنَا كِتَٰبٌ حَفِيظٌۢ"}, "052015": {"a": 15, "text": "أَفَسِحْرٌ هَٰذَآ أَمْ أَنتُمْ لَا تُبْصِرُونَ"}, "082018": {"a": 18, "text": "ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ"}, "070038": {"a": 38, "text": "أَيَطْمَعُ كُلُّ ٱمْرِئٍۢ مِّنْهُمْ أَن يُدْخَلَ جَنَّةَ نَعِيمٍۢ"}, "079027": {"a": 27, "text": "ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا"}, "052016": {"a": 16, "text": "ٱصْلَوْهَا فَٱصْبِرُوٓا۟ أَوْ لَا تَصْبِرُوا۟ سَوَآءٌ عَلَيْكُمْ ۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ"}, "105001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ ٱلْفِيلِ"}, "052024": {"a": 24, "text": "۞ وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌۭ لَّهُمْ كَأَنَّهُمْ لُؤْلُؤٌۭ مَّكْنُونٌۭ"}, "069013": {"a": 13, "text": "فَإِذَا نُفِخَ فِى ٱلصُّورِ نَفْخَةٌۭ وَٰحِدَةٌۭ"}, "067005": {"a": 5, "text": "وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ"}, "054009": {"a": 9, "text": "۞ كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ فَكَذَّبُوا۟ عَبْدَنَا وَقَالُوا۟ مَجْنُونٌۭ وَٱزْدُجِرَ"}, "072027": {"a": 27, "text": "إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا"}, "051031": {"a": 31, "text": "۞ قَالَ فَمَا خَطْبُكُمْ أَيُّهَا ٱلْمُرْسَلُونَ"}, "055015": {"a": 15, "text": "وَخَلَقَ ٱلْجَآنَّ مِن مَّارِجٍۢ مِّن نَّارٍۢ"}, "085007": {"a": 7, "text": "وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌۭ"}, "047001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ أَضَلَّ أَعْمَٰلَهُمْ"}, "078036": {"a": 36, "text": "جَزَآءًۭ مِّن رَّبِّكَ عَطَآءً حِسَابًۭا"}, "056045": {"a": 45, "text": "إِنَّهُمْ كَانُوا۟ قَبْلَ ذَٰلِكَ مُتْرَفِينَ"}, "050012": {"a": 12, "text": "كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ وَأَصْحَٰبُ ٱلرَّسِّ وَثَمُودُ"}, "071017": {"a": 17, "text": "وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلْأَرْضِ نَبَاتًۭا"}, "091013": {"a": 13, "text": "فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا"}, "079040": {"a": 40, "text": "وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ"}, "053038": {"a": 38, "text": "أَلَّا تَزِرُ وَازِرَةٌۭ وِزْرَ أُخْرَىٰ"}, "050015": {"a": 15, "text": "أَفَعَيِينَا بِٱلْخَلْقِ ٱلْأَوَّلِ ۚ بَلْ هُمْ فِى لَبْسٍۢ مِّنْ خَلْقٍۢ جَدِيدٍۢ"}, "049018": {"a": 18, "text": "إِنَّ ٱللَّهَ يَعْلَمُ غَيْبَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَٱللَّهُ بَصِيرٌۢ بِمَا تَعْمَلُونَ"}, "052012": {"a": 12, "text": "ٱلَّذِينَ هُمْ فِى خَوْضٍۢ يَلْعَبُونَ"}, "075005": {"a": 5, "text": "بَلْ يُرِيدُ ٱلْإِنسَٰنُ لِيَفْجُرَ أَمَامَهُۥ"}, "067003": {"a": 3, "text": "ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا ۖ مَّا تَرَىٰ فِى خَلْقِ ٱلرَّحْمَٰنِ مِن تَفَٰوُتٍۢ ۖ فَٱرْجِعِ ٱلْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍۢ"}, "056060": {"a": 60, "text": "نَحْنُ قَدَّرْنَا بَيْنَكُمُ ٱلْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ"}, "091014": {"a": 14, "text": "فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا"}, "055074": {"a": 74, "text": "لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ"}, "073005": {"a": 5, "text": "إِنَّا سَنُلْقِى عَلَيْكَ قَوْلًۭا ثَقِيلًا"}, "050029": {"a": 29, "text": "مَا يُبَدَّلُ ٱلْقَوْلُ لَدَىَّ وَمَآ أَنَا۠ بِظَلَّٰمٍۢ لِّلْعَبِيدِ"}, "051053": {"a": 53, "text": "أَتَوَاصَوْا۟ بِهِۦ ۚ بَلْ هُمْ قَوْمٌۭ طَاغُونَ"}, "070014": {"a": 14, "text": "وَمَن فِى ٱلْأَرْضِ جَمِيعًۭا ثُمَّ يُنجِيهِ"}, "077048": {"a": 48, "text": "وَإِذَا قِيلَ لَهُمُ ٱرْكَعُوا۟ لَا يَرْكَعُونَ"}, "083014": {"a": 14, "text": "كَلَّا ۖ بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ"}, "047002": {"a": 2, "text": "وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَءَامَنُوا۟ بِمَا نُزِّلَ عَلَىٰ مُحَمَّدٍۢ وَهُوَ ٱلْحَقُّ مِن رَّبِّهِمْ ۙ كَفَّرَ عَنْهُمْ سَيِّـَٔاتِهِمْ وَأَصْلَحَ بَالَهُمْ"}, "055024": {"a": 24, "text": "وَلَهُ ٱلْجَوَارِ ٱلْمُنشَـَٔاتُ فِى ٱلْبَحْرِ كَٱلْأَعْلَٰمِ"}, "089008": {"a": 8, "text": "ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ"}, "048007": {"a": 7, "text": "وَلِلَّهِ جُنُودُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا"}, "061010": {"a": 10, "text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ هَلْ أَدُلُّكُمْ عَلَىٰ تِجَٰرَةٍۢ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍۢ"}, "050026": {"a": 26, "text": "ٱلَّذِى جَعَلَ مَعَ ٱللَّهِ إِلَٰهًا ءَاخَرَ فَأَلْقِيَاهُ فِى ٱلْعَذَابِ ٱلشَّدِيدِ"}, "054011": {"a": 11, "text": "فَفَتَحْنَآ أَبْوَٰبَ ٱلسَّمَآءِ بِمَآءٍۢ مُّنْهَمِرٍۢ"}, "056041": {"a": 41, "text": "وَأَصْحَٰبُ ٱلشِّمَالِ مَآ أَصْحَٰبُ ٱلشِّمَالِ"}, "055043": {"a": 43, "text": "هَٰذِهِۦ جَهَنَّمُ ٱلَّتِى يُكَذِّبُ بِهَا ٱلْمُجْرِمُونَ"}, "048028": {"a": 28, "text": "هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًۭا"}, "075040": {"a": 40, "text": "أَلَيْسَ ذَٰلِكَ بِقَٰدِرٍ عَلَىٰٓ أَن يُحْۦِىَ ٱلْمَوْتَىٰ"}, "077049": {"a": 49, "text": "وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"}, "079018": {"a": 18, "text": "فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ"}, "048008": {"a": 8, "text": "إِنَّآ أَرْسَلْنَٰكَ شَٰهِدًۭا وَمُبَشِّرًۭا وَنَذِيرًۭا"}, "075036": {"a": 36, "text": "أَيَحْسَبُ ٱلْإِنسَٰنُ أَن يُتْرَكَ سُدًى"}, "089021": {"a": 21, "text": "كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّۭا دَكًّۭا"}, "067002": {"a": 2, "text": "ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًۭا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ"}, "056076": {"a": 76, "text": "وَإِنَّهُۥ لَقَسَمٌۭ لَّوْ تَعْلَمُونَ عَظِيمٌ"}, "068033": {"a": 33, "text": "كَذَٰلِكَ ٱلْعَذَابُ ۖ وَلَعَذَابُ ٱلْءَاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ"}, "072010": {"a": 10, "text": "وَأَنَّا لَا نَدْرِىٓ أَشَرٌّ أُرِيدَ بِمَن فِى ٱلْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًۭا"}, "055009": {"a": 9, "text": "وَأَقِيمُوا۟ ٱلْوَزْنَ بِٱلْقِسْطِ وَلَا تُخْسِرُوا۟ ٱلْمِيزَانَ"}, "089006": {"a": 6, "text": "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ"}, "061011": {"a": 11, "text": "تُؤْمِنُونَ بِٱللَّهِ وَرَسُولِهِۦ وَتُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ"}, "089005": {"a": 5, "text": "هَلْ فِى ذَٰلِكَ قَسَمٌۭ لِّذِى حِجْرٍ"}, "066001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ"}, "051032": {"a": 32, "text": "قَالُوٓا۟ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٍۢ مُّجْرِمِينَ"}, "050027": {"a": 27, "text": "۞ قَالَ قَرِينُهُۥ رَبَّنَا مَآ أَطْغَيْتُهُۥ وَلَٰكِن كَانَ فِى ضَلَٰلٍۭ بَعِيدٍۢ"}, "054028": {"a": 28, "text": "وَنَبِّئْهُمْ أَنَّ ٱلْمَآءَ قِسْمَةٌۢ بَيْنَهُمْ ۖ كُلُّ شِرْبٍۢ مُّحْتَضَرٌۭ"}, "048009": {"a": 9, "text": "لِّتُؤْمِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَتُعَزِّرُوهُ وَتُوَقِّرُوهُ وَتُسَبِّحُوهُ بُكْرَةًۭ وَأَصِيلًا"}, "077031": {"a": 31, "text": "لَّا ظَلِيلٍۢ وَلَا يُغْنِى مِنَ ٱللَّهَبِ"}, "080023": {"a": 23, "text": "كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ"}, "089009": {"a": 9, "text": "وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ"}}, EXPL={"3|الرياضيات|عالم الجمع والطرح": [{"t": "عالم الجمع والطرح", "k": "", "lines": ["بص يا حبيبي، لما نجمع، بنحط الأرقام تحت بعض: آحاد تحت آحاد، وعشرات تحت عشرات، ومئات تحت مئات."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["نبدأ الجمع من اليمين، من الآحاد. لو الناتج 10 أو أكتر، نكتب الآحاد ونرفع العشرة للعمود اللي جنبه. اسمها الحمل."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["في الطرح كمان نبدأ من الآحاد. لو الرقم اللي فوق أصغر، نستلف عشرة من العمود اللي جنبه."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["مثال: 45 + 28. نجمع 5 + 8 = 13، نكتب 3 ونرفع 1. بعدين 4 + 2 + 1 = 7. الناتج 73."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["اتأكد من الحل: الجمع نختبره بالطرح، والطرح نختبره بالجمع. لو رجعنا للرقم الأصلي يبقى الحل صح. يلا يا بطل."]}], "3|الرياضيات|عالم الزمن": [{"t": "عالم الزمن", "k": "", "lines": ["بص يا حبيبي، الساعة فيها 60 دقيقة، واليوم فيه 24 ساعة، والأسبوع 7 أيام."]}, {"t": "عالم الزمن", "k": "", "lines": ["العقرب الصغير بيقول الساعة، والعقرب الكبير بيقول الدقايق. لما الكبير على 6 نقول والنصف، ولما يكون على 3 نقول والربع."]}, {"t": "عالم الزمن", "k": "", "lines": ["الزمن المنقضي هو الفرق بين وقت البداية ووقت النهاية. من 3:00 لحد 5:30 يبقى ساعتين ونص."]}, {"t": "عالم الزمن", "k": "", "lines": ["السنة فيها 12 شهر، والشهر ممكن يكون 30 أو 31 يوم، وفبراير أقل."]}, {"t": "عالم الزمن", "k": "", "lines": ["اقرأ السؤال وشوف بيسأل عن ساعة ولا دقيقة ولا يوم، وبعدين اختار الوحدة الصح. يلا يا بطل."]}], "3|الرياضيات|مملكة الضرب": [{"t": "مملكة الضرب", "k": "", "lines": ["بص يا حبيبي، الضرب هو جمع الرقم نفسه كذا مرة. 4 × 3 يعني 4 + 4 + 4 = 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["جدول الضرب لازم نحفظه. ممكن نتعلمه بالعد بالقفزات: 3، 6، 9، 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["الترتيب مش بيغير الناتج: 4 × 3 = 3 × 4."]}, {"t": "مملكة الضرب", "k": "", "lines": ["أي رقم × 1 يساوي نفسه. وأي رقم × 0 يساوي صفر."]}, {"t": "مملكة الضرب", "k": "", "lines": ["لو السؤال فيه مجموعات متساوية، اعرف عدد المجموعات وعدد كل مجموعة واضرب. يلا يا بطل."]}], "3|الرياضيات|مملكة ا <script id="azhar-pro-js">
(function(){

function ageWord(a){if(!a)return"";return a===1?"سنة واحدة":a===2?"سنتان":a<=10?a+" سنين":a+" سنة"}
function greet(){
 try{
  if(typeof P==="undefined"||!P||!P.name)return;
  var app=document.getElementById("app");if(!app||app.querySelector("#azhi"))return;
  if(app.querySelector("#azparents"))return;

  var d=document.createElement("div");d.id="azhi";

  d.textContent="🌟 أهلًا بعودتك يا "+P.name+age+goal+" — يلا نكمل بطولاتك!";
  h1.parentNode.insertBefore(d,h1.nextSibling);

  pb.textContent="👨‍👩‍👧 ركن بابا وماما — سؤال للأهل ومساعدة ليهم";
  pb.addEventListener("click",function(){window.__azParents()});
  d.parentNode.insertBefore(pb,d.nextSibling);
 }catch(e){}
}
var PQ=null;
function pqPick(){
 try{
  var pool=(window.RAW||[]).filter(function(r){return r&&r.choices&&r.choices.length>=3&&r.explanation&&["القرآن","التربية الإسلامية","العربي"].indexOf(r.subject)>=0});
  if(!pool.length)pool=(window.RAW||[]).filter(function(r){return r&&r.choices&&r.choices.length>=3&&r.explanation});
  if(!pool.length)return null;
  var q=pool[Math.floor(Math.random()*pool.length)];
  var ch=q.choices.slice();for(var i=ch.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ch[i];ch[i]=ch[j];ch[j]=t}
  return {q:q.question,ch:ch,ans:q.answer,exp:q.explanation,subj:q.subject};
 }catch(e){return null}
}

  var qhtml=PQ?('<div class="card"><h2>🧠 سؤال لبابا وماما</h2><p class="sync">من مادة '+PQ.subj+' — جاوبوا مع '+kid+' واتناقشوا في السبب:</p><div class="qtext">'+PQ.q+'</div><div id="azpq">'+PQ.ch.map(function(c,i){return '<button class="choice" data-azpq="'+i+'"><span>'+c+'</span></button>'}).join("")+'</div><div id="azpfb"></div><button class="btn small ghost" id="azpnew">🔄 سؤال جديد للأهل</button></div>'):'';
  var h='<div id="azparents"><h1>👨‍👩‍👧 ركن بابا وماما</h1>'

   +qhtml
   +'<div class="card"><h2>🤝 إزاي تساعدوا '+son+'؟</h2><p>'+ageTip+'</p><p>· اسألوه كل يوم: «اتعلمت إيه جديد؟» وخلوه يعلّمكم هو — أحلى تثبيت للمعلومة إنه يشرحها.<br>· شوفوا تقريره من زرار «تقريري» في اللعبة وقارنوا تقدمه أسبوع بأسبوع، وامدحوا الجهد مش الدرجة بس.<br>· لو سؤال صعب عليه، سيبوه يستخدم تلميح الأول قبل ما تقولوا الإجابة.</p></div>'
   +'<div class="card"><h2>💬 أسئلة تفتح الكلام بعد اللعب</h2><p>· إيه أكتر سؤال عجبك النهاردة وليه؟<br>· إيه السؤال اللي غلطت فيه واتعلمت منه إيه؟<br>· لو هتعمل سؤال لبابا وماما، هيكون عن إيه؟<br>· إيه المادة اللي عايز تكسب فيها تلميحات زيادة؟</p></div>'
   +'<button class="btn" data-a="home">🏠 رجوع للعبة '+kid+'</button></div>';
  render(h);
  var nb=document.getElementById("azpnew");if(nb)nb.addEventListener("click",function(){PQ=pqPick();window.__azParents()});
  var box=document.getElementById("azpq");
  if(box)box.addEventListener("click",function(e){var b=e.target.closest("[data-azpq]");if(!b||!PQ)return;var pick=PQ.ch[+b.getAttribute("data-azpq")];var fb=document.getElementById("azpfb");
   if(pick===PQ.ans){b.classList.add("ok");fb.innerHTML='<div class="warn" style="background:#e8f5e9">🎉 إجابة صح! '+PQ.exp+'<br>اتكلموا مع '+kid+': ليه دي الإجابة الصح؟</div>'}
   else{b.classList.add("bad");fb.innerHTML='<div class="warn">قربتوا! الإجابة الصح: <b>'+PQ.ans+'</b><br>'+PQ.exp+'</div>'}});
 }catch(e){}
};
