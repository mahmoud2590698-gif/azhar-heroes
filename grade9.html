aware ............... how tired the children were.", "choices": ["with", "at", "of", "on"], "answer": "of", "answerIndex": 2, "explanation": "aware of أي مدرك وواعٍ بـ.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-282", "question": "According ............... the report, the weather will be cold tomorrow.", "choices": ["on", "to", "from", "of"], "answer": "to", "answerIndex": 1, "explanation": "according to أي وفقًا لـ.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-283", "question": "Instead ............... taking the bus, we decided to walk to school because the weather was nice.", "choices": ["up", "at", "of", "in"], "answer": "of", "answerIndex": 2, "explanation": "instead of أي بدلًا من، ويأتي بعدها فعل + ing.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-284", "question": "Artificial Intelligence and robots are not ............... . They are completely different.", "choices": ["similar", "different", "equal", "the same"], "answer": "the same", "answerIndex": 3, "explanation": "AI and robots are not the same أي ليسا الشيء نفسه؛ بل مختلفان تمامًا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/287655"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-285", "question": "We add the prefix «...............» to «abled» to form its opposite.", "choices": ["dis-", "in-", "un-", "mis-"], "answer": "dis-", "answerIndex": 0, "explanation": "البادئة dis- تعطي عكس abled فتصبح disabled.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/287655"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-286", "question": "Our essays will ............... (return) next week.", "choices": ["returned", "returning", "be returned", "return"], "answer": "be returned", "answerIndex": 2, "explanation": "المستقبل البسيط المبني للمجهول: will be + التصريف الثالث؛ المقالات تُعاد (تُرجَّع) الأسبوع المقبل.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-287", "question": "I expect that Ibrahim ............... (win) the match.", "choices": ["won", "will win", "is winning", "wins"], "answer": "will win", "answerIndex": 1, "explanation": "will + المصدر للتعبير عن توقّع وتنبّؤ في المستقبل.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-288", "question": "The English lesson will ............... (explain) tomorrow.", "choices": ["explained", "explaining", "explain", "be explained"], "answer": "be explained", "answerIndex": 3, "explanation": "الدرس سيُشرَح غدًا — مبني للمجهول في المستقبل: will be + التصريف الثالث.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-289", "question": "Will the mistake ............... (correct) soon?", "choices": ["correct", "correcting", "be corrected", "corrected"], "answer": "be corrected", "answerIndex": 2, "explanation": "سؤال في المستقبل المبني للمجهول: Will + الفاعل + be + التصريف الثالث.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-290", "question": "The final match ............... (will/play) at 6 p.m. next Friday.", "choices": ["is played", "plays", "will be played", "will play"], "answer": "will be played", "answerIndex": 2, "explanation": "المباراة ستُلعَب — مبني للمجهول في المستقبل.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-291", "question": "Driverless cars will ............... (use) everywhere.", "choices": ["be used", "using", "used", "use"], "answer": "be used", "answerIndex": 0, "explanation": "السيارات بلا سائق ستُستخدَم في كل مكان — will be + التصريف الثالث.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-292", "question": "The playground will be cleaned ............... (by/on) the volunteers.", "choices": ["with", "by", "for", "on"], "answer": "by", "answerIndex": 1, "explanation": "في المبني للمجهول نذكر الفاعل بعد by: cleaned by the volunteers.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-293", "question": "Robots will ............... (clean) the houses in the future.", "choices": ["cleaned", "clean", "cleaning", "cleans"], "answer": "clean", "answerIndex": 1, "explanation": "will + المصدر في المعلوم: Robots will clean the houses.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-294", "question": "Don't worry, I ............... you with your homework.", "choices": ["will help", "helped", "help", "am helping"], "answer": "will help", "answerIndex": 0, "explanation": "will للتعبير عن الوعد والعرض في لحظة الكلام: I will help you.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=tSSLPJFeWqs"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-295", "question": "When I ............... home, I will call you.", "choices": ["arriving", "will arrive", "arrive", "arrived"], "answer": "arrive", "answerIndex": 2, "explanation": "بعد when وأدوات الربط الزمنية نستخدم المضارع البسيط لا المستقبل: When I arrive home, I will call you.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=tSSLPJFeWqs"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-296", "question": "Robots and Artificial Intelligence are not the same. A robot is a ............... that can move and do tasks.", "choices": ["machine", "emotion", "program", "brain"], "answer": "machine", "answerIndex": 0, "explanation": "من نص القراءة: الروبوت آلة machine تتحرّك وتؤدّي مهام.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-297", "question": "AI is like the ............... of a robot. It helps robots make decisions and learn from actions.", "choices": ["battery", "hand", "eye", "brain"], "answer": "brain", "answerIndex": 3, "explanation": "من نص القراءة: الذكاء الاصطناعي مثل عقل brain الروبوت.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-298", "question": "Artificial Intelligence can now create art, music, and stories using advanced algorithms. It learns by studying human-made work and identifying ............... .", "choices": ["colors", "sounds", "mistakes", "patterns"], "answer": "patterns", "answerIndex": 3, "explanation": "من نص القراءة: يتعلّم الذكاء الاصطناعي بدراسة الأعمال البشرية وتحديد الأنماط patterns.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-299", "question": "In the future, many tasks will be done by AI and computers. Deliveries will be made by ............... .", "choices": ["humans", "mistakes", "rules", "drones"], "answer": "drones", "answerIndex": 3, "explanation": "من نص القراءة: في المستقبل ستُنجَز التوصيلات بواسطة الطائرات المسيّرة drones.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-300", "question": "One rainy morning, I walked into my classroom and saw something surprising. My teacher wasn't there. Instead, a robot stood at the front. My friends were ............... , but the robot explained everything clearly.", "choices": ["bored", "tired", "happy", "confused"], "answer": "confused", "answerIndex": 3, "explanation": "من نص القراءة: كان أصدقائي مرتبكين confused عندما وقف الروبوت أمام الصف.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-301", "question": "ما المقصود بالسمعيات؟", "choices": ["الأمور التي يدركها العقل وحده دون حاجة إلى خبر", "أحكام العبادات العملية الظاهرة", "الأمور التي تدرك بالحواس والمشاهدة", "الأمور التي لا تؤخذ إلا بإخبار النبي ﷺ ولا يستقل العقل بإدراكها"], "answer": "الأمور التي لا تؤخذ إلا بإخبار النبي ﷺ ولا يستقل العقل بإدراكها", "answerIndex": 3, "explanation": "السمعيات هي الأمور التي لا تؤخذ إلا بإخبار النبي ﷺ، ولا يستقل العقل بإدراكها؛ لأنها لا تدرك بالحواس ولا بالمشاهدة، وإنما طريق ثبوتها الكتاب والسنة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-302", "question": "ما طريق ثبوت السمعيات؟", "choices": ["السنة فقط", "العقل والمشاهدة", "الكتاب فقط", "الكتاب والسنة معًا"], "answer": "الكتاب والسنة معًا", "answerIndex": 3, "explanation": "طريق ثبوت السمعيات الكتاب والسنة؛ لأنها أمور غيبية لا تدرك بالحواس ولا بالمشاهدة، ولا مجال للعقل في إدراكها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/279312"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-303", "question": "ما حكم الإيمان بالسمعيات كالحشر والحساب والميزان؟", "choices": ["مستحب", "واجب؛ لأنها ركن من أركان الإيمان", "جائز", "مكروه"], "answer": "واجب؛ لأنها ركن من أركان الإيمان", "answerIndex": 1, "explanation": "الإيمان بالسمعيات ـ كالحشر والحساب والميزان ـ واجب؛ لأنها ركن من أركان الإيمان، فجميع السمعيات جائزة عقلًا واجبة سمعًا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-304", "question": "ما حكم من أنكر شيئًا من السمعيات؟", "choices": ["مبتدع ضال لا يكفر", "فاسق فقط", "كافر؛ إذ يلزمه تكذيب الله ورسوله في خبريهما", "لا شيء عليه"], "answer": "كافر؛ إذ يلزمه تكذيب الله ورسوله في خبريهما", "answerIndex": 2, "explanation": "من أنكر شيئًا من السمعيات فهو كافر؛ إذ يلزمه تكذيب الله ورسوله في خبريهما.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-305", "question": "ما المراد بسؤال القبر؟", "choices": ["سؤال الملكين للميت في قبره عن ربه ودينه ونبيه", "سؤال الملائكة للمؤمنين عن صلاتهم", "سؤال الله للعباد يوم القيامة عن أعمالهم", "محاسبة الميت على ذنوبه في قبره"], "answer": "سؤال الملكين للميت في قبره عن ربه ودينه ونبيه", "answerIndex": 0, "explanation": "سؤال القبر هو سؤال الملكين للميت في قبره عن ربه ودينه ونبيه، سواء دفن الميت في قبر أم لم يدفن.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-306", "question": "ما اسما الملكين اللذين يسألان الميت في قبره؟", "choices": ["جبريل وميكائيل", "مالك ورضوان", "رقيب وعتيد", "منكر ونكير"], "answer": "منكر ونكير", "answerIndex": 3, "explanation": "بعد انصراف الناس من دفن الميت يأتيه ملكان، يقال لأحدهما منكر وللآخر نكير، فيقعدانه فيعيد الله الروح فيه، ويسألانه عن ربه ودينه ونبيه.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-307", "question": "ما الأسئلة التي يسألها الملكان للميت في قبره؟", "choices": ["ما عملك؟ وكم صليت؟ وكم صمت؟", "«من ربك؟ وما دينك؟ وما تقول في الرجل الذي بعث فيكم؟»", "من أبوك؟ وأين بيتك؟ وما مالك؟", "ما اسمك؟ وكم عمرك؟ وأين مت؟"], "answer": "«من ربك؟ وما دينك؟ وما تقول في الرجل الذي بعث فيكم؟»", "answerIndex": 1, "explanation": "يقول الملكان للميت: «من ربك؟ وما دينك؟ وما تقول في الرجل الذي بعث فيكم؟» فيقول المؤمن: ربي الله، وديني الإسلام، والرجل المبعوث فينا محمد ﷺ.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-308", "question": "بم يجيب المؤمن الملكين حين يسألانه في قبره؟", "choices": ["لا أدري، كنت أقول ما يقوله الناس", "ربي الله، وديني الإسلام، والرجل المبعوث فينا محمد ﷺ", "لا أجيب حتى أرى مقعدي", "ربي الملائكة وديني الصلاة"], "answer": "ربي الله، وديني الإسلام، والرجل المبعوث فينا محمد ﷺ", "answerIndex": 1, "explanation": "فيقول المؤمن: ربي الله، وديني الإسلام، والرجل المبعوث فينا محمد ﷺ، فيقولان له: انظر إلى مقعدك من النار قد أبدلك الله به مقعدًا في الجنة فيراهما جميعًا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-309", "question": "بم يجيب الكافر أو المنافق حين يسأله الملكان في قبره؟", "choices": ["ربي الله وديني الإسلام", "لا أذكر شيئًا من الدنيا", "لا أدري، كنت أقول ما يقوله الناس فيه", "أسلمت وجهي لله"], "answer": "لا أدري، كنت أقول ما يقوله الناس فيه", "answerIndex": 2, "explanation": "أما الكافر أو المنافق فيقول: لا أدري، كنت أقول ما يقوله الناس فيه، فيقولان له: لا دريت ولا تليت، ثم يصيبه من العذاب ما قدر له.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-310", "question": "ما الدليل من القرآن على سؤال القبر؟", "choices": ["﴿وَمِن وَرَائِهِم بَرْزَخٌ إِلَىٰ يَوْمِ يُبْعَثُونَ﴾", "﴿يُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ﴾", "﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ﴾", "﴿النَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا﴾"], "answer": "﴿يُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ﴾", "answerIndex": 1, "explanation": "دليل سؤال القبر من القرآن قوله تعالى: ﴿يُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ﴾ [إبراهيم: 27]، قال ابن عباس: الشهادة يسألون عنها في قبورهم بعد موتهم.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/14:27/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-311", "question": "ما حكم الإيمان بسؤال القبر؟", "choices": ["واجب، وإنكاره كفر", "جائز تركه", "واجب، وإنكاره بدعة وضلالة", "مستحب فقط"], "answer": "واجب، وإنكاره بدعة وضلالة", "answerIndex": 2, "explanation": "الإيمان بسؤال القبر واجب، وإنكاره بدعة وضلالة؛ لأنه ثابت بالكتاب والسنة، وهو أمر جائز عقلًا، وأجمع عليه أهل العلم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/279312"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-312", "question": "ما حكم من أنكر سؤال القبر؟", "choices": ["لا حكم عليه", "مبتدع ضال، ولا يكفر على الراجح ما دام يؤمن بالجزاء الأخروي", "فاسق لا تقبل شهادته", "كافر بإجماع العلماء"], "answer": "مبتدع ضال، ولا يكفر على الراجح ما دام يؤمن بالجزاء الأخروي", "answerIndex": 1, "explanation": "لا يكفر منكر سؤال القبر على الراجح، ما دام المنكر يؤمن بالجزاء الأخروي؛ وحكمه أنه مبتدع ضال.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/279312"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-313", "question": "لماذا سمي سؤال الملكين بسؤال القبر؟", "choices": ["لأن القبر أول منازل الآخرة", "لأن الغالب في الموتى أن يدفنوا في القبور", "لأن السؤال لا يكون إلا في القبر فقط", "لأن الملكين يسكنان القبور"], "answer": "لأن الغالب في الموتى أن يدفنوا في القبور", "answerIndex": 1, "explanation": "سؤال القبر هو سؤال الملكين للميت في قبره، وسواء دفن الميت في قبر أم لم يدفن، كأن أكلته السباع أو الأسماك أو أحرقته النار، ولكنهم أطلقوا عليه سؤال القبر؛ لأن الغالب في الموتى أن يدفنوا في القبور.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-314", "question": "هل يسأل من غرق أو أحرق أو أكله سبع كما يسأل من دفن في قبره؟", "choices": ["نعم، يسأل بكيفية يعلمها الله تعالى", "لا يسأل إلا المؤمن المدفون", "يسأل سؤالًا واحدًا فقط", "لا، السؤال خاص بمن دفن فقط"], "answer": "نعم، يسأل بكيفية يعلمها الله تعالى", "answerIndex": 0, "explanation": "يسأل من غرق أو أحرق أو أكله سبع بكيفية يعلمها الله تعالى؛ فالسؤال عام لكل ميت سواء دفن أم لم يدفن.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-315", "question": "ما نعيم القبر وعذابه؟", "choices": ["ما يتعرض له العبد في قبره قبل البعث من النعيم أو العذاب على حسب حاله من الإيمان والكفر والطاعة والمعصية", "نعيم المؤمنين في الجنة بعد الحساب", "عذاب الكافرين في النار يوم القيامة", "ما يجده الميت من راحة بعد الموت مباشرة"], "answer": "ما يتعرض له العبد في قبره قبل البعث من النعيم أو العذاب على حسب حاله من الإيمان والكفر والطاعة والمعصية", "answerIndex": 0, "explanation": "نعيم القبر وعذابه هو ما يتعرض له العبد في قبره قبل البعث من النعيم أو العذاب، على حسب حاله من الإيمان والكفر، والطاعة والمعصية.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-316", "question": "ما حكم الإيمان بنعيم القبر وعذابه؟", "choices": ["واجب على المؤمن فقط دون الكافر", "واجب، وإنكارهما بدعة وضلالة وليس بالكفر", "مستحب", "واجب، وإنكارهما كفر"], "answer": "واجب، وإنكارهما بدعة وضلالة وليس بالكفر", "answerIndex": 1, "explanation": "نعيم القبر وعذابه من الأمور الثابتة بالقرآن والسنة، وأجمع على وقوعهما السلف قبل ظهور البدع، فالإيمان بهما واجب، وإنكارهما بدعة وضلالة، وليس بالكفر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/279312"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-317", "question": "ما الدليل من القرآن على عذاب القبر؟", "choices": ["﴿فَمَن ثَقُلَتْ مَوَازِينُهُ فَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ﴾", "﴿النَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا﴾ في حق آل فرعون", "﴿يَوْمَ يَفِرُّ الْمَرْءُ مِنْ أَخِيهِ﴾", "﴿وَمِن وَرَائِهِم بَرْزَخٌ إِلَىٰ يَوْمِ يُبْعَثُونَ﴾"], "answer": "﴿النَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا﴾ في حق آل فرعون", "answerIndex": 1, "explanation": "قال تعالى في حق آل فرعون: ﴿النَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا﴾ [غافر: 46]، فالآية تثبت أنهم يعرضون على النار صباحًا ومساءً، وهذا العرض في القبر؛ لأن ختام الآية يثبت أنهم يدخلون النار يوم القيامة، كما أن يوم القيامة لا غدو فيه ولا عشي.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/40:46/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-318", "question": "ما الدليل من القرآن على نعيم القبر؟", "choices": ["﴿وَلَا تَحْسَبَنَّ الَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ أَمْوَاتًا بَلْ أَحْيَاءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ﴾", "﴿النَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا﴾", "﴿فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا﴾", "﴿وَالْوَزْنُ يَوْمَئِذٍ الْحَقُّ﴾"], "answer": "﴿وَلَا تَحْسَبَنَّ الَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ أَمْوَاتًا بَلْ أَحْيَاءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ﴾", "answerIndex": 0, "explanation": "دليل نعيم القبر من القرآن قوله تعالى في حق الشهداء: ﴿وَلَا تَحْسَبَنَّ الَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ أَمْوَاتًا بَلْ أَحْيَاءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ﴾ [آل عمران: 169].", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/3:169/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-319", "question": "من المنعم والمعذب في القبر عند أهل السنة؟", "choices": ["الجسد والروح جميعًا", "الجسد دون الروح", "الروح فقط", "لا جسد ولا روح"], "answer": "الجسد والروح جميعًا", "answerIndex": 0, "explanation": "المنعم والمعذب عند أهل السنة الجسد والروح جميعًا، ولأهل القبور حياة يدركون بها أثر النعيم والعذاب ولو تفتتت أجسادهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-320", "question": "كيف حال الميت في نعيم القبر وعذابه؟", "choices": ["لا يشعر بشيء حتى البعث", "يشعر به أهله كما يشعر هو", "كحال النائم يشعر باللذة أو الألم، ولا يشعر من ينام بجواره بشيء", "كحال اليقظان يرى كل شيء حوله"], "answer": "كحال النائم يشعر باللذة أو الألم، ولا يشعر من ينام بجواره بشيء", "answerIndex": 2, "explanation": "حال الميت في نعيم القبر وعذابه كحال النائم يشعر باللذة أو الألم، ولا يشعر من ينام بجواره بشيء من ذلك، وكيفية تنعيمهم أو تعذيبهم أمر غيبي لا تعرف حقيقته.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-321", "question": "ما حياة البرزخ؟", "choices": ["حياة الجنة بعد الحساب", "حياة الشهداء فقط", "حياة القبر بين حياة الدنيا وحياة الآخرة", "حياة الدنيا قبل الموت"], "answer": "حياة القبر بين حياة الدنيا وحياة الآخرة", "answerIndex": 2, "explanation": "هذه الحياة تسمى حياة البرزخ، قال تعالى: ﴿وَمِن وَرَائِهِم بَرْزَخٌ إِلَىٰ يَوْمِ يُبْعَثُونَ﴾ [المؤمنون: 100]، أي هي بين حياة الدنيا وحياة الآخرة، وهي حياة القبر.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/23:100/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-322", "question": "في حديث القبرين، ما الذنبان اللذان كان صاحبا القبرين يعذبان بسببهما؟", "choices": ["الغيبة وأكل الربا", "المشي بالنميمة وعدم الاستبراء من البول", "السرقة والكذب", "ترك الصلاة والصيام"], "answer": "المشي بالنميمة وعدم الاستبراء من البول", "answerIndex": 1, "explanation": "مر النبي ﷺ بقبرين فقال: «إنهما ليعذبان، وما يعذبان في كبير». ثم قال: بلى إنه كبير، «أما أحدهما فكان يمشي بالنميمة، وأما الآخر فكان لا يستبرئ من بوله».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-323", "question": "ما البعث والنشر؟", "choices": ["جمع الناس في مكان واحد للحساب", "وزن أعمال العباد يوم القيامة", "عبور الناس على جسر جهنم", "إحياء الله الموتى وإخراجهم بعد جمع أجزائهم الأصلية من قبورهم يوم القيامة بعد فناء الدنيا"], "answer": "إحياء الله الموتى وإخراجهم بعد جمع أجزائهم الأصلية من قبورهم يوم القيامة بعد فناء الدنيا", "answerIndex": 3, "explanation": "البعث والنشر هو إحياء الله الموتى، وإخراجهم بعد جمع أجزائهم الأصلية من قبورهم يوم القيامة بعد فناء الدنيا، ويكون ذلك برد الله أرواح العباد إلى أجسامهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-324", "question": "ما حكم الإيمان بالبعث والنشر؟", "choices": ["جائز", "واجب، بل هو ركن من أركان الإيمان، وإنكاره كفر", "مستحب", "واجب، وإنكاره بدعة فقط"], "answer": "واجب، بل هو ركن من أركان الإيمان، وإنكاره كفر", "answerIndex": 1, "explanation": "الإيمان بالبعث والنشر واجب، بل هو ركن من أركان الإيمان، وإنكاره كفر؛ لأنه من الأمور الثابتة بالقرآن والسنة، وقد أجمعت عليه الشرائع كلها، وهو من الأمور الجائزة عقلًا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-325", "question": "ما الدليل العقلي على وقوع البعث؟", "choices": ["أن الروح تفنى مع الجسد", "أن الناس يموتون جميعًا في وقت واحد", "الذي خلق الناس أول مرة من العدم قادر على إعادتهم، بل الإعادة أسهل", "أن القبور تبقى كما هي"], "answer": "الذي خلق الناس أول مرة من العدم قادر على إعادتهم، بل الإعادة أسهل", "answerIndex": 2, "explanation": "ثبت بالأدلة اليقينية أن الله خلق الناس بقدرته من العدم، وإذا ماتوا وأراد الله أن يعيدهم بعد الموت فلا مانع من ذلك عقلًا، فإن الذي خلقهم أول مرة من العدم قادر على إعادتهم بعد موتهم، بل الإعادة أسهل، فإن من صنع شيئًا يستطيع أن يعيد صناعته مرة ثانية بسهولة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-326", "question": "قال تعالى: ﴿وَهُوَ الَّذِي يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ وَهُوَ أَهْوَنُ عَلَيْهِ﴾، ما الذي تدل عليه الآية؟", "choices": ["قدرة الله على إعادة الخلق بعد الموت", "أن الموت نهاية كل شيء", "أن الدنيا باقية لا تفنى", "أن الخلق لا يفنى أبدًا"], "answer": "قدرة الله على إعادة الخلق بعد الموت", "answerIndex": 0, "explanation": "قال تعالى: ﴿وَهُوَ الَّذِي يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ وَهُوَ أَهْوَنُ عَلَيْهِ﴾ [الروم: 27]، فالذي بدأ الخلق من العدم قادر على إعادته بعد الموت، بل الإعادة أهون عليه.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/30:27/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-327", "question": "من الذي جاء النبي ﷺ بعظم قد رم ثم فته بيده سائلًا: أترى أن الله يبعث هذا بعدما رم؟", "choices": ["عتبة بن ربيعة", "الوليد بن المغيرة", "أبي بن خلف", "أبو جهل"], "answer": "أبي بن خلف", "answerIndex": 2, "explanation": "روي أن أبي بن خلف جاء النبي ﷺ بعظم قد رم ثم فته بيده، وقال يا محمد: أترى أن الله يبعث هذا بعدما رم؟ فقال ﷺ: «نعم ويبعثك ويدخلك النار».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-328", "question": "بم أجاب الله تعالى من قال: ﴿مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ﴾؟", "choices": ["﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾", "﴿قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ﴾", "﴿إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ﴾", "﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾"], "answer": "﴿قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ﴾", "answerIndex": 1, "explanation": "قال تعالى: ﴿وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ قَالَ مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ﴾ [يس: 78] ﴿قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ﴾ [يس: 79]، فالذي أنشأ العظام أول مرة قادر على إحيائها بعدما رمت.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/36:79/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-329", "question": "ما الحشر؟", "choices": ["عرض الأعمال على أصحابها", "سوق الله العباد بعد بعثهم إلى موقف الحساب الذي يجتمع فيه الخلائق", "إحياء الموتى وإخراجهم من قبورهم", "وزن الأعمال يوم القيامة"], "answer": "سوق الله العباد بعد بعثهم إلى موقف الحساب الذي يجتمع فيه الخلائق", "answerIndex": 1, "explanation": "الحشر معناه سوق الله العباد بعد بعثهم إلى موقف الحساب الذي يجتمع فيه الخلائق، وفيه يحاسبون وتوزن أعمالهم ويعرف كل مصيره.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-330", "question": "ما الفرق بين النشر والحشر؟", "choices": ["النشر قبل الموت والحشر بعده", "النشر للمؤمنين والحشر للكافرين", "لا فرق بينهما", "النشر إخراج الموتى من قبورهم، والحشر سوقهم بعد بعثهم إلى موقف الحساب"], "answer": "النشر إخراج الموتى من قبورهم، والحشر سوقهم بعد بعثهم إلى موقف الحساب", "answerIndex": 3, "explanation": "البعث والنشر هو إحياء الله الموتى وإخراجهم من قبورهم، والحشر هو سوق الله العباد بعد بعثهم إلى موقف الحساب؛ فالنشر سابق على الحشر.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-331", "question": "ما حكم الإيمان بالحشر؟", "choices": ["واجب، وإنكاره كفر؛ لإنكار معلوم من الدين بالضرورة", "مستحب", "واجب، وإنكاره بدعة فقط", "جائز"], "answer": "واجب، وإنكاره كفر؛ لإنكار معلوم من الدين بالضرورة", "answerIndex": 0, "explanation": "الإيمان بالحشر واجب، وإنكاره كفر؛ لإنكار معلوم من الدين بالضرورة، حيث وردت به نصوص شرعية كثيرة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-332", "question": "كيف يكون حال المتقين في الحشر؟", "choices": ["مشاة على أرجلهم", "مسحوبين على وجوههم", "عميًا لا يبصرون", "ركبانًا"], "answer": "ركبانًا", "answerIndex": 3, "explanation": "أحوال الناس في الحشر مختلفة، فمنهم الراكب وهم المتقون، ومنهم الماشي على رجليه وهم أصحاب الطاعات القليلة، ومنهم المسحوب على وجهه وهم الكفار، ومنهم الأعمى وهو الجائر في الحكم، ومنهم الأصم والأبكم وهو المعجب بعمله.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-333", "question": "قال تعالى: ﴿وَحَشَرْنَاهُمْ فَلَمْ نُغَادِرْ مِنْهُمْ أَحَدًا﴾، ما الذي تدل عليه الآية؟", "choices": ["أن الجبال تسير يوم القيامة فقط", "أن المؤمنين يدخلون الجنة بغير حساب", "أن الله يحشر جميع الخلائق يوم القيامة ولا يترك منهم أحدًا", "أن الأرض تتشقق عن الموتى"], "answer": "أن الله يحشر جميع الخلائق يوم القيامة ولا يترك منهم أحدًا", "answerIndex": 2, "explanation": "قال تعالى: ﴿وَيَوْمَ نُسَيِّرُ الْجِبَالَ وَتَرَى الْأَرْضَ بَارِزَةً وَحَشَرْنَاهُمْ فَلَمْ نُغَادِرْ مِنْهُمْ أَحَدًا﴾ [الكهف: 47]، فالحشر عام لجميع الخلائق لا يغادر منهم أحدًا.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/18:47/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-334", "question": "من أول من تنشق عنه الأرض ويبعث يوم القيامة؟", "choices": ["سيدنا محمد ﷺ", "سيدنا عيسى عليه السلام", "سيدنا موسى عليه السلام", "سيدنا إبراهيم عليه السلام"], "answer": "سيدنا محمد ﷺ", "answerIndex": 0, "explanation": "أول من تنشق عنه الأرض ويبعث سيدنا محمد ﷺ، كما أنه أول من يرد المحشر، وأول من يدخل الجنة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-335", "question": "ما الميزان يوم القيامة؟", "choices": ["آلة يوزن بها العباد، أو أعمالهم، أو صحائف أعمالهم", "جسر يعبر عليه الخلق", "كتاب تسجل فيه الأعمال", "مكان يجتمع فيه الناس للحساب"], "answer": "آلة يوزن بها العباد، أو أعمالهم، أو صحائف أعمالهم", "answerIndex": 0, "explanation": "الميزان آلة يوزن بها العباد، أو أعمالهم، أو صحائف أعمالهم، والميزان واحد لكل الأعمال ولجميع الأمم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-336", "question": "لمن يكون الوزن يوم القيامة؟", "choices": ["للمؤمن والكافر، ولا يكون للأنبياء والملائكة ومن يدخل الجنة بغير حساب", "لجميع الخلق بلا استثناء", "للمؤمنين فقط", "للأنبياء والملائكة فقط"], "answer": "للمؤمن والكافر، ولا يكون للأنبياء والملائكة ومن يدخل الجنة بغير حساب", "answerIndex": 0, "explanation": "الميزان واحد لكل الأعمال ولجميع الأمم، والوزن يكون للمؤمن والكافر، ولا يكون للأنبياء والملائكة ومن يدخل الجنة بغير حساب.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-337", "question": "ما الذي يجب الإيمان به في الميزان؟", "choices": ["تفصيلات الميزان كلها", "أن هناك وزنًا وميزانًا، ومنكر ذلك كافر بإجماع العلماء", "أن الوزن للأنبياء خاصة", "أن الميزان له كفتان فقط"], "answer": "أن هناك وزنًا وميزانًا، ومنكر ذلك كافر بإجماع العلماء", "answerIndex": 1, "explanation": "الذي يجب على العبد أن يؤمن به بالنسبة للميزان هو أن هناك وزنًا وميزانًا، ومنكر ذلك كافر بإجماع العلماء، أما ما سوى ذلك من تفصيلات، فلا يجب على العبد الإيمان به، ولا يعد إنكاره كفرًا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-338", "question": "قال تعالى: ﴿وَنَضَعُ الْمَوَازِينَ الْقِسْطَ لِيَوْمِ الْقِيَامَةِ فَلَا تُظْلَمُ نَفْسٌ شَيْئًا﴾، ما الذي تدل عليه الآية؟", "choices": ["أن الموازين كثيرة بعدد الأمم", "عدل الله في وزن الأعمال يوم القيامة فلا تظلم نفس شيئًا", "أن الكافر لا يوزن عمله", "أن الوزن يكون قبل البعث"], "answer": "عدل الله في وزن الأعمال يوم القيامة فلا تظلم نفس شيئًا", "answerIndex": 1, "explanation": "قال تعالى: ﴿وَنَضَعُ الْمَوَازِينَ الْقِسْطَ لِيَوْمِ الْقِيَامَةِ فَلَا تُظْلَمُ نَفْسٌ شَيْئًا﴾ [الأنبياء: 47]، فبالوزن يظهر العدل في العذاب والعفو عن الذنوب والآثام.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/21:47/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-339", "question": "ما الحساب يوم القيامة؟", "choices": ["اطلاع الله الناس قبل انصرافهم من أرض المحشر على أعمالهم وما قدموه في الدنيا بعد أخذ كتبهم", "سوق العباد إلى موقف الحساب", "سؤال الملكين في القبر", "وزن الأعمال في الميزان"], "answer": "اطلاع الله الناس قبل انصرافهم من أرض المحشر على أعمالهم وما قدموه في الدنيا بعد أخذ كتبهم", "answerIndex": 0, "explanation": "الحساب معناه اطلاع الله الناس قبل انصرافهم من أرض المحشر على أعمالهم وما قدموه في الدنيا من تصرفات فعلية أو قولية أو اعتقادية، خيرًا كانت أو شرًا، بطريقة لا يعلمها إلا الله، بعد أخذ كتبهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-340", "question": "كم صنفًا الناس في الحساب؟", "choices": ["ثلاثة أصناف: من يدخل الجنة بغير حساب، ومن يدخل النار بغير حساب، ومن يوقف للحساب", "أربعة أصناف", "صنف واحد", "صنفان فقط"], "answer": "ثلاثة أصناف: من يدخل الجنة بغير حساب، ومن يدخل النار بغير حساب، ومن يوقف للحساب", "answerIndex": 0, "explanation": "الناس في الحساب على ثلاثة أصناف: منهم من يدخل الجنة بغير حساب ولا يسألون عن أعمالهم، وطائفة تدخل النار بغير حساب لاشتداد غضب الله عليهم، وطائفة توقف للحساب فيحاسبهم الله على أعمالهم الحسنة والسيئة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-341", "question": "قال ﷺ: «يدخل الجنة من أمتي سبعون ألفًا بغير حساب»، من هؤلاء؟", "choices": ["منهم الصابرون والشهداء", "من مات صغيرًا فقط", "أهل بدر خاصة", "الأنبياء والملائكة"], "answer": "منهم الصابرون والشهداء", "answerIndex": 0, "explanation": "قال ﷺ: «يدخل الجنة من أمتي سبعون ألفًا بغير حساب»، منهم الصابرون والشهداء، وهؤلاء لا يسألون عن أعمالهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-342", "question": "ما جزاء من أوتي كتابه بيمينه يوم القيامة؟", "choices": ["يرد إلى الدنيا", "يوقف للحساب العسير", "يدخل النار بغير حساب", "يحاسب حسابًا يسيرًا وينقلب إلى أهله مسرورًا"], "answer": "يحاسب حسابًا يسيرًا وينقلب إلى أهله مسرورًا", "answerIndex": 3, "explanation": "قال تعالى: ﴿فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ﴾ [الانشقاق: 7] ﴿فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا﴾ [الانشقاق: 8] ﴿وَيَنقَلِبُ إِلَىٰ أَهْلِهِ مَسْرُورًا﴾ [الانشقاق: 9]، فمن أوتي كتابه بيمينه كان حسابه يسيرًا.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/84:8/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-343", "question": "ما الصراط؟", "choices": ["باب من أبواب الجنة", "نهر في الجنة", "طريق الجنة في الدنيا", "جسر ممدود على ظهر جهنم، يعبر عليه جميع الخلائق من المؤمنين وغيرهم"], "answer": "جسر ممدود على ظهر جهنم، يعبر عليه جميع الخلائق من المؤمنين وغيرهم", "answerIndex": 3, "explanation": "الصراط هو جسر ممدود على ظهر جهنم، يعبر عليه جميع الخلائق من المؤمنين وغيرهم، والإيمان به واجب شرعًا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-344", "question": "ما موقف كثير من المعتزلة من الصراط؟", "choices": ["يقولون إن الصراط في الدنيا فقط", "ينكرون الحساب أيضًا", "يؤمنون به جسرًا حقيقيًا كأهل السنة", "يصرفون الأدلة عن ظاهرها ويقولون المراد بها الأدلة الواضحة وليس جسرًا حقيقيًا"], "answer": "يصرفون الأدلة عن ظاهرها ويقولون المراد بها الأدلة الواضحة وليس جسرًا حقيقيًا", "answerIndex": 3, "explanation": "يعتقد أهل السنة أن الأدلة الواردة على الصراط من القرآن والسنة على ظاهرها وحقيقتها، وكثير من المعتزلة يصرفها عن ظاهرها ويقول: المراد بها الأدلة الواضحة وليس جسرًا حقيقيًا، أو هو طريق الجنة والنار دون تفاصيل.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-345", "question": "كيف يمر الناس على الصراط؟", "choices": ["يمر المؤمن ماشيًا والكافر راكبًا", "لا يمر عليه إلا الأنبياء", "يمرون جميعًا بنفس السرعة", "منهم من يمر مثل البرق، ومنهم من يمر مثل الريح، ومنهم من يسعى سعيًا، ومنهم من يحبو حبوًا، ومنهم من يزحف زحفًا"], "answer": "منهم من يمر مثل البرق، ومنهم من يمر مثل الريح، ومنهم من يسعى سعيًا، ومنهم من يحبو حبوًا، ومنهم من يزحف زحفًا", "answerIndex": 3, "explanation": "قال رسول الله ﷺ: «يمر الناس على جسر جهنم»، وعليه حسك تخطف الناس يمينًا وشمالًا، وبجنبتيه ملائكة يقولون: «اللهم سلم سلم»، فمن الناس من يمر مثل البرق، ومنهم من يمر مثل الريح، ومنهم من يسعى سعيًا، ومنهم من يحبو حبوًا، ومنهم من يزحف زحفًا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-346", "question": "ما الثواب؟", "choices": ["دعاء الملائكة للمؤمنين", "ما أعده الله للعصاة من العذاب في النار", "أجر العمل في الدنيا فقط", "ما أعده الله لعباده الطائعين من النعيم المقيم في الجنة تفضلًا منه سبحانه"], "answer": "ما أعده الله لعباده الطائعين من النعيم المقيم في الجنة تفضلًا منه سبحانه", "answerIndex": 3, "explanation": "الثواب هو ما أعده الله لعباده الطائعين من النعيم المقيم في الجنة تفضلًا منه سبحانه، ويدخل في الثواب السعادة والسرور الذي يفيضه الله على المطيع.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-347", "question": "ما العقاب؟", "choices": ["حرمان العاصي من رزقه في الدنيا", "ما أعده الله للعصاة والكفار من العذاب في النار عدلًا منه سبحانه", "مرض يصيب العاصي", "تأخير الثواب إلى يوم القيامة"], "answer": "ما أعده الله للعصاة والكفار من العذاب في النار عدلًا منه سبحانه", "answerIndex": 1, "explanation": "العقاب هو ما أعده الله للعصاة والكفار من العذاب في النار عدلًا منه سبحانه، ويدخل في العقاب الهم والحزن الذي يصيب العصاة والكفار.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-348", "question": "قال تعالى: ﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ﴾، ما الذي تدل عليه الآية؟", "choices": ["أن الذرة لا توزن", "أن كل عمل خيرًا كان أو شرًا يجد صاحبه جزاءه يوم القيامة", "أن الخير فقط يجزى به", "أن الشر يغفر دائمًا"], "answer": "أن كل عمل خيرًا كان أو شرًا يجد صاحبه جزاءه يوم القيامة", "answerIndex": 1, "explanation": "قال تعالى: ﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ﴾ [الزلزلة: 7] ﴿وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ﴾ [الزلزلة: 8]، فالثواب رحمة من الله وفضل، والعقاب عدل منه سبحانه، ولولا الثواب والعقاب لم يكن فرق في الآخرة يه لقاؤكم", "يشتد عليه فراقكم", "شديد وشاق عليه تعبكم ومشقتكم"], "answer": "شديد وشاق عليه تعبكم ومشقتكم", "answerIndex": 3, "explanation": "«عزيز: عز على فلان الأمر، أي: اشتد، والمقصود: شديد وشاق عليه»، و«ما عنتم: مشقتكم وتعبكم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-370", "question": "ما معنى «حسبي الله» في قوله تعالى ﴿فَإِنْ تَوَلَّوْا فَقُلْ حَسْبِيَ اللَّهُ﴾؟", "choices": ["حسيبي في الحساب يوم القيامة", "كافيني ونصيري", "شاهدي على أعمالكم", "وليي دون المؤمنين"], "answer": "كافيني ونصيري", "answerIndex": 1, "explanation": "«حسبي الله: كافيني ونصيري».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-371", "question": "ما الحديث الذي يدل على أن نسب النبي ﷺ إلى آدم لم يكن النسل فيه إلا من نكاح؟", "choices": ["«إن الله اصطفى كنانة من ولد إسماعيل، واصطفى قريشا من كنانة، واصطفى من قريش بني هاشم، واصطفاني من بني هاشم»", "«من تردى من جبل فقتل نفسه فهو في نار جهنم»", "«خرجت من نكاح ولم أخرج من سفاح»", "«لا تتبع النظرة النظرة، فإن لك الأولى وليست لك الآخرة»"], "answer": "«خرجت من نكاح ولم أخرج من سفاح»", "answerIndex": 2, "explanation": "قال ﷺ: «خرجت من نكاح ولم أخرج من سفاح من لدن آدم إلى أن ولدني أبي وأمي، لم يصبني من سفاح الجاهلية شيء»، ومعناه أن نسبه ﷺ إلى آدم ولم يكن النسل فيه إلا من نكاح ولم يكن فيه زنا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-372", "question": "ما الذي قاله النبي ﷺ عن اصطفاء الله تعالى لنسبه؟", "choices": ["«إن الله اصطفى كنانة من ولد إسماعيل، واصطفى قريشا من كنانة، واصطفى من قريش بني هاشم، واصطفاني من بني هاشم»", "«خرجت من نكاح ولم أخرج من سفاح»", "«من تردى من جبل فقتل نفسه فهو في نار جهنم»", "«لا تتبع النظرة النظرة، فإن لك الأولى وليست لك الآخرة»"], "answer": "«إن الله اصطفى كنانة من ولد إسماعيل، واصطفى قريشا من كنانة، واصطفى من قريش بني هاشم، واصطفاني من بني هاشم»", "answerIndex": 0, "explanation": "رواه مسلم عن واثلة بن الأسقع قال: سمعت رسول الله ﷺ يقول: «إن الله اصطفى كنانة من ولد إسماعيل، واصطفى قريشا من كنانة، واصطفى من قريش بني هاشم، واصطفاني من بني هاشم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-373", "question": "ما الوصفان اللذان لم يجمعهما الله تعالى لأحد من الأنبياء من أسمائه إلا للنبي ﷺ؟", "choices": ["عزيز حكيم", "غفور رحيم", "سميع بصير", "رءوف رحيم"], "answer": "رءوف رحيم", "answerIndex": 3, "explanation": "«ولم يجمع الله تعالى لأحد من الأنبياء وصفين من أسمائه إلا للنبي ﷺ فإنه قال عن النبي ﷺ: بالمؤمنين رءوف رحيم، وقال عن ذاته سبحانه: إن الله بالناس لرءوف رحيم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-374", "question": "ما الدرس المستفاد من قوله تعالى ﴿فَإِنْ تَوَلَّوْا فَقُلْ حَسْبِيَ اللَّهُ﴾؟", "choices": ["ترك الدعوة عند إعراض المشركين", "تفويض الأمر إلى الله واللجوء إليه وصدق التوكل عل
