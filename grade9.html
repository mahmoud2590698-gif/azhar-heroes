n": "أول أكسيد الكربون غاز سام ينتج عن الاحتراق غير التام، ويرتبط بهيموجلوبين الدم أسرع من الأكسجين فيمنع نقل الأكسجين إلى الجسم.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-14", "question": "في تفاعل الخارصين مع محلول كبريتات النحاس، يكون العامل المختزل هو:", "choices": ["ذرات الخارصين Zn", "أيونات النحاس Cu2+", "أيونات الكبريتات", "الماء"], "answer": "ذرات الخارصين Zn", "answerIndex": 0, "explanation": "ذرات الخارصين تفقد إلكترونين فتتأكسد إلى أيونات Zn2+، فهي العامل المختزل؛ بينما أيونات النحاس Cu2+ تكتسب الإلكترونين فهي العامل المؤكسد.", "type": "mcq", "topic": "", "source": "https://www.alawayil.com/2026/11/sciences.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-15", "question": "يُقصد بالتيار الكهربي:", "choices": ["تدفق الشحنات الكهربية خلال موصل", "انتقال الحرارة خلال الموصل", "انتقال الضوء خلال السلك", "اهتزاز جزيئات الموصل فقط"], "answer": "تدفق الشحنات الكهربية خلال موصل", "answerIndex": 0, "explanation": "التيار الكهربي هو سريان الشحنات الكهربية (الإلكترونات الحرة) في اتجاه واحد داخل الموصل.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-16", "question": "وحدة قياس شدة التيار الكهربي هي:", "choices": ["الفولت", "الأمبير", "الأوم", "الجول"], "answer": "الأمبير", "answerIndex": 1, "explanation": "شدة التيار تُقاس بالأمبير، بينما فرق الجهد بالفولت والمقاومة بالأوم.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-17", "question": "مرت شحنة مقدارها 600 كولوم خلال موصل في زمن قدره دقيقتان، فتكون شدة التيار:", "choices": ["2 أمبير", "3 أمبير", "5 أمبير", "10 أمبير"], "answer": "5 أمبير", "answerIndex": 2, "explanation": "شدة التيار = الشحنة ÷ الزمن = 600 ÷ 120 = 5 أمبير (دقيقتان = 120 ثانية).", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-18", "question": "الجهاز المستخدم لقياس شدة التيار الكهربي هو:", "choices": ["الفولتميتر", "الأميتر", "الدينامو", "البوصلة"], "answer": "الأميتر", "answerIndex": 1, "explanation": "الأميتر يقيس شدة التيار ويُوصل على التوالي في الدائرة، بينما الفولتميتر يقيس فرق الجهد ويُوصل على التوازي.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-19", "question": "فرق الجهد بين نقطتين يُعرف بأنه:", "choices": ["الشغل المبذول لنقل وحدة الشحنة بين النقطتين", "كمية الشحنة فقط", "زمن مرور التيار", "عدد الإلكترونات فقط"], "answer": "الشغل المبذول لنقل وحدة الشحنة بين النقطتين", "answerIndex": 0, "explanation": "فرق الجهد = الشغل المبذول ÷ الشحنة المنقولة، ويُقاس بالفولت.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-20", "question": "إذا كان الشغل المبذول لنقل شحنة مقدارها 2 كولوم يساوي 10 جول، فإن فرق الجهد يساوي:", "choices": ["2 فولت", "5 فولت", "10 فولت", "20 فولت"], "answer": "5 فولت", "answerIndex": 1, "explanation": "فرق الجهد = الشغل ÷ الشحنة = 10 ÷ 2 = 5 فولت.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-21", "question": "التيار الذي يتغير اتجاهه بصورة دورية يُسمى:", "choices": ["تيار مستمر", "تيار متردد", "تيار ثابت", "تيار ساكن"], "answer": "تيار متردد", "answerIndex": 1, "explanation": "التيار المتردد (AC) يغير اتجاهه دوريًا، أما التيار المستمر (DC) فيسري في اتجاه واحد ثابت.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-22", "question": "عند توصيل ثلاثة أعمدة متماثلة، قوة كل منها 1.5 فولت، على التوازي تكون القوة الدافعة الكهربية الكلية:", "choices": ["1.5 فولت", "3 فولت", "4.5 فولت", "6 فولت"], "answer": "1.5 فولت", "answerIndex": 0, "explanation": "عند توصيل الأعمدة المتماثلة على التوازي تبقى القوة الدافعة الكلية مساوية لقوة العمود الواحد (1.5 فولت)، بينما تزيد شدة التيار الكلية.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-23", "question": "عند توصيل ثلاثة أعمدة متماثلة، قوة كل منها 1.5 فولت، على التوالي وبالاتجاه الصحيح تكون القوة الدافعة الكهربية الكلية:", "choices": ["1.5 فولت", "2 فولت", "4.5 فولت", "6 فولت"], "answer": "4.5 فولت", "answerIndex": 2, "explanation": "عند التوصيل على التوالي تُجمع قوى الأعمدة: 1.5 + 1.5 + 1.5 = 4.5 فولت.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-24", "question": "أثبتت تجربة أورستد أن:", "choices": ["مرور التيار الكهربي يولد تأثيرًا مغناطيسيًا", "المغناطيس يولد ضوءًا", "البطارية لا تحتاج إلى دائرة", "الفولتميتر يقيس شدة التيار"], "answer": "مرور التيار الكهربي يولد تأثيرًا مغناطيسيًا", "answerIndex": 0, "explanation": "لاحظ أورستد انحراف إبرة البوصلة عند مرور تيار في سلك قريب منها، فأثبت أن للتيار الكهربي تأثيرًا مغناطيسيًا حوله.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-25", "question": "من العوامل التي تزيد قوة المغناطيس الكهربي:", "choices": ["تقليل عدد لفات الملف", "زيادة عدد لفات الملف", "فتح الدائرة الكهربية", "إزالة مصدر التيار"], "answer": "زيادة عدد لفات الملف", "answerIndex": 1, "explanation": "تزداد قوة المغناطيس الكهربي بزيادة عدد لفات الملف وشدة التيار المار فيه، وبوضع قلب من الحديد المطاوع داخله.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-26", "question": "يُستخدم المغناطيس الكهربي في:", "choices": ["الجرس الكهربي", "الترمومتر الزئبقي فقط", "الميزان الزنبركي فقط", "المسطرة"], "answer": "الجرس الكهربي", "answerIndex": 0, "explanation": "الجرس الكهربي من أشهر تطبيقات المغناطيس الكهربي، إذ يجذب المطرقة عند مرور التيار في ملفه.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-27", "question": "المحرك الكهربي (الموتور) يحوّل:", "choices": ["الطاقة الميكانيكية إلى طاقة كهربية", "الطاقة الكهربية إلى طاقة حركية", "الطاقة الضوئية إلى طاقة كهربية", "الطاقة الحرارية إلى طاقة مغناطيسية"], "answer": "الطاقة الكهربية إلى طاقة حركية", "answerIndex": 1, "explanation": "المحرك الكهربي يحوّل الطاقة الكهربية إلى طاقة حركية (دوران)، وعكس عمله المولد الكهربي.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-28", "question": "المولد الكهربي (الدينامو) يحوّل:", "choices": ["الطاقة الكهربية إلى طاقة حركية", "الطاقة الميكانيكية إلى طاقة كهربية", "الطاقة الكيميائية إلى طاقة ضوئية فقط", "الطاقة الصوتية إلى طاقة حرارية"], "answer": "الطاقة الميكانيكية إلى طاقة كهربية", "answerIndex": 1, "explanation": "المولد الكهربي يحوّل الطاقة الميكانيكية (الحركة) إلى طاقة كهربية، ومن أمثلته دينامو الدراجة.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-29", "question": "أي مما يلي يُعد مثالًا على المولد الكهربي؟", "choices": ["دينامو الدراجة", "الأميتر", "المفتاح الكهربي", "الفولتميتر"], "answer": "دينامو الدراجة", "answerIndex": 0, "explanation": "دينامو الدراجة مولد كهربي صغير يحوّل حركة دوران العجلة إلى طاقة كهربية لإضاءة المصباح.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-30", "question": "أي عبارة صحيحة عن المحرك والمولد الكهربي؟", "choices": ["المحرك: كهربية ← حركية، والمولد: ميكانيكية ← كهربية", "المحرك: ميكانيكية ← كهربية، والمولد: كهربية ← حركية", "كلاهما يحوّل الطاقة الكهربية إلى طاقة حركية", "كلاهما يحوّل الطاقة الميكانيكية إلى طاقة كهربية"], "answer": "المحرك: كهربية ← حركية، والمولد: ميكانيكية ← كهربية", "answerIndex": 0, "explanation": "المحرك والمولد عكس بعضهما في تحويل الطاقة: المحرك يحوّل الكهربية إلى حركية، والمولد يحوّل الحركية (الميكانيكية) إلى كهربية.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/10/science-unit-2-test-electricity-magnetism.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-31", "question": "ينص قانون أوم على أن شدة التيار الكهربي المار في موصل تتناسب تناسبًا طرديًا مع فرق الجهد بين طرفيه عند ثبوت:", "choices": ["درجة الحرارة", "شدة التيار", "المقاومة", "الزمن"], "answer": "درجة الحرارة", "answerIndex": 0, "explanation": "نص قانون أوم: تتناسب شدة التيار طرديًا مع فرق الجهد عند ثبوت درجة الحرارة، وصيغته الرياضية: المقاومة = فرق الجهد ÷ شدة التيار.", "type": "mcq", "topic": "", "source": "https://www.alawayil.com/2026/11/sciences.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-32", "question": "الأجزاء المحددة على الكروموسومات والمسؤولة عن ظهور صفة وراثية معينة هي:", "choices": ["الجينات", "الأمشاج", "السيتوبلازم", "الغشاء الخلوي"], "answer": "الجينات", "answerIndex": 0, "explanation": "الجين جزء محدد من الكروموسوم (من DNA) مسؤول عن ظهور صفة وراثية معينة، مثل لون العين أو طول الساق.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-33", "question": "الأشكال البديلة أو النسخ المتعددة للجين الواحد التي تحدد مظاهر الصفة تُسمى:", "choices": ["الأليلات", "الكروموسومات", "الأمشاج", "الخلايا الجسدية"], "answer": "الأليلات", "answerIndex": 0, "explanation": "الأليل هو أحد الصور البديلة للجين الواحد؛ فمثلًا جين طول الساق له أليل للطول (سائد) وأليل للقصر (متنحٍ).", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-34", "question": "المادة الكيميائية التي تحفظ المعلومات الوراثية وتوجد داخل نواة الخلية هي:", "choices": ["الحمض النووي DNA", "البروتين", "الدهون", "الكربوهيدرات"], "answer": "الحمض النووي DNA", "answerIndex": 0, "explanation": "الحمض النووي (DNA) هو المادة الوراثية التي تحمل تعليمات بناء الجسم وانتقال الصفات، ويوجد داخل نواة الخلية.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-35", "question": "نسبة ظهور الصفة السائدة في أفراد الجيل الأول عند تزاوج فردين نقيين في صفة متضادة طبقًا لقانون مندل الأول هي:", "choices": ["25%", "50%", "75%", "100%"], "answer": "100%", "answerIndex": 3, "explanation": "عند تزاوج فردين نقيين متضادين في صفة واحدة يظهر جميع أفراد الجيل الأول بالصفة السائدة فقط (100%)، وتختفي الصفة المتنحية في هذا الجيل.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-36", "question": "عند تزاوج فردين نقيين في صفة متضادة، تكون نسبة الصفة السائدة إلى الصفة المتنحية في أفراد الجيل الثاني:", "choices": ["1 سائد : 3 متنحٍ", "3 سائد : 1 متنحٍ", "1 سائد : 1 متنحٍ", "2 سائد : 2 متنحٍ"], "answer": "3 سائد : 1 متنحٍ", "answerIndex": 1, "explanation": "في الجيل الثاني تظهر الصفة المتنحية من جديد بنسبة 1 من كل 4 أفراد، فتكون النسبة 3 سائد : 1 متنحٍ طبقًا لقانون مندل الأول.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-37", "question": "حدث تزاوج بين نبات بسلة طويل الساق هجين (Tt) وآخر قصير الساق (tt)، فتكون نسبة الأبناء طوال الساق إلى قصار الساق:", "choices": ["1 طويل : 1 قصير", "3 طويل : 1 قصير", "1 طويل : 3 قصير", "جميعهم طوال الساق"], "answer": "1 طويل : 1 قصير", "answerIndex": 0, "explanation": "بمربع بانيت: الأبناء نصفهم (Tt) طويل الساق ونصفهم (tt) قصير الساق، فالنسبة 1 : 1.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-38", "question": "العملية التي تنجو فيها الأفراد الأكثر تكيفًا مع البيئة فتمرر جيناتها للأجيال القادمة تُسمى:", "choices": ["الانتخاب الطبيعي", "الانتخاب الاصطناعي", "التطفل", "التكاثر اللاجنسي"], "answer": "الانتخاب الطبيعي", "answerIndex": 0, "explanation": "في الانتخاب الطبيعي تنجو الأفراد الحاملة لصفات وراثية تساعدها على البقاء والتكاثر، فتنتقل هذه الصفات للأجيال التالية.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-39", "question": "الانتخاب الاصطناعي (التربية الانتقائية) هو عملية يقوم فيها:", "choices": ["الإنسان باختيار وتربية نباتات أو حيوانات لها صفات وراثية مرغوبة", "الطبيعة باختيار الأفراد الأقوى دون تدخل", "الحيوان باختيار غذائه بنفسه", "النبات بتغيير جيناته تلقائيًا"], "answer": "الإنسان باختيار وتربية نباتات أو حيوانات لها صفات وراثية مرغوبة", "answerIndex": 0, "explanation": "في الانتخاب الاصطناعي يختار الإنسان الأفراد ذات الصفات المرغوبة (كإنتاج الحليب أو حجم الثمار) ويربيها، بخلاف الانتخاب الطبيعي الذي توجهه البيئة.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-40", "question": "ما وجه المقارنة الصحيح بين الانتخاب الطبيعي والانتخاب الاصطناعي؟", "choices": ["الطبيعي توجهه البيئة والاصطناعي يوجهه الإنسان", "الطبيعي يوجهه الإنسان والاصطناعي توجهه البيئة", "كلاهما يوجهه الإنسان", "كلاهما يتم دون اختيار أي صفات"], "answer": "الطبيعي توجهه البيئة والاصطناعي يوجهه الإنسان", "answerIndex": 0, "explanation": "القوة الموجهة هي الفرق الجوهري: الانتخاب الطبيعي توجهه ظروف البيئة وبقاء الأصلح، والانتخاب الاصطناعي يوجهه الإنسان لصفات يريدها.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-41", "question": "أقصى عدد من الأفراد يمكن للبيئة دعمه وإعالته دون تدهور مواردها يُسمى:", "choices": ["السعة التحميلية", "العامل المحدد", "الانتخاب الطبيعي", "السجل الحفري"], "answer": "السعة التحميلية", "answerIndex": 0, "explanation": "السعة التحميلية هي أقصى عدد من أفراد الجماعة الحيوية تستطيع البيئة دعمه بمواردها المتاحة دون أن تتدهور.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-42", "question": "حفرية الأركيوبتركس تُعد حلقة وصل انتقالية لأنها تجمع بين صفات:", "choices": ["الزواحف والطيور", "الأسماك والبرمائيات", "الثدييات والزواحف", "الحشرات والطيور"], "answer": "الزواحف والطيور", "answerIndex": 0, "explanation": "الأركيوبتركس يجمع صفات الزواحف (أسنان في الفكين ومخالب في الأجنحة وذيل فقاري طويل) وصفات الطيور (الريش والمنقار)، فيوضح تطور الطيور من الزواحف.", "type": "mcq", "topic": "", "source": "https://www.alawayil.com/2026/11/sciences.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-43", "question": "حفرية الماموث المحفوظة في الجليد تُعد مثالًا لحفرية:", "choices": ["أثر", "كائن كامل", "قالب مصمت", "طابع"], "answer": "كائن كامل", "answerIndex": 1, "explanation": "الماموث المحفوظ في الجليد حفرية كائن كامل، إذ بقي جسمه كاملًا دون تحلل بفعل التجمد.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-44", "question": "يُستدل من وجود حفريات النيموليت في صخور جبل المقطم على أن:", "choices": ["المقطم كان قاع بحر منذ أكثر من 35 مليون سنة", "المقطم كان بركانًا نشطًا", "المقطم كان صحراء جافة دائمًا", "النيموليت يعيش في المياه العذبة"], "answer": "المقطم كان قاع بحر منذ أكثر من 35 مليون سنة", "answerIndex": 0, "explanation": "النيموليت كائن بحري، فوجود حفرياته في صخور جبل المقطم دليل على أن المنطقة كانت قاع بحر قبل أكثر من 35 مليون سنة.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-45", "question": "الفترة الزمنية التي يستغرقها تحلل نصف عدد النوى المشعة في عينة ما تُسمى:", "choices": ["المقياس الزمني", "فترة عمر النصف", "التأريخ النسبي", "السجل الحفري"], "answer": "فترة عمر النصف", "answerIndex": 1, "explanation": "عمر النصف هو الزمن اللازم لتحلل نصف النوى المشعة في العينة، ويُستخدم في تقدير أعمار الصخور والحفريات.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-46", "question": "ينص قانون تعاقب الطبقات على أن الطبقات الصخرية:", "choices": ["الموجودة في الأعلى هي الأقدم دائمًا", "الموجودة في الأسفل هي الأقدم ما لم تتعرض لاضطراب", "كلها من عمر واحد", "الأقدم في المنتصف دائمًا"], "answer": "الموجودة في الأسفل هي الأقدم ما لم تتعرض لاضطراب", "answerIndex": 1, "explanation": "قانون تعاقب الطبقات: في التتابع الرسوبي غير المضطرب تكون الطبقات السفلى أقدم من الطبقات التي تعلوها.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-47", "question": "الحفريات التي عاشت لمدى زمني قصير ومدى جغرافي واسع ثم انقرضت وتُستخدم لتحديد عمر الصخور تُسمى:", "choices": ["الحفريات المرشدة", "حفريات الأثر", "حفريات الكائن الكامل", "الحفريات المتحجرة"], "answer": "الحفريات المرشدة", "answerIndex": 0, "explanation": "الحفرية المرشدة عاشت زمنًا قصيرًا وانتشرت جغرافيًا واسعًا ثم انقرضت، فيُستدل بها على عمر الطبقات الصخرية التي توجد فيها.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-48", "question": "الآثار الدالة على نشاط الكائن الحي أثناء حياته، مثل أنفاق الديدان وأثر أقدام الديناصورات، تُسمى حفريات:", "choices": ["أثر", "كائن كامل", "قالب مصمت", "متحجرة"], "answer": "أثر", "answerIndex": 0, "explanation": "حفريات الأثر هي آثار نشاط الكائن الحي لا جسمه نفسه، مثل أنفاق الديدان وآثار الأقدام والجحور.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-49", "question": "العملية التي يتم فيها إحلال المعادن محل المواد العضوية للكائن الحي جزءًا بجزء لإنتاج أخشاب أو حفريات متصلبة تُسمى:", "choices": ["التحجر (التمعدن)", "الانحلال الحراري", "التجمد", "الترسيب"], "answer": "التحجر (التمعدن)", "answerIndex": 0, "explanation": "في التحجر تحل المعادن محل المادة العضوية للكائن جزءًا بجزء مع الاحتفاظ بشكله، فتنتج أخشاب متحجرة وحفريات متصلبة.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "العلوم", "id": "h26-g9-50", "question": "الكائنات الحية الحساسة التي تُستخدم كمؤشر حيوي لدراسة نقاء وصحة الهواء من التلوث هي:", "choices": ["الأشنات", "الطحالب", "الفراشات", "السراخس"], "answer": "الأشنات", "answerIndex": 0, "explanation": "الأشنات حساسة جدًا لتلوث الهواء، فوجودها يدل على نقاء الهواء وغيابها يدل على تلوثه، لذلك تُستخدم مؤشرًا حيويًا.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/science-grade3mid-final1.html"}, {"grade": 9, "subject": "الدراسات الاجتماعية", "id": "h26-g9-51", "question": "يُطلق اسم قارات العالم الجديد على:", "choices": ["أوروبا وأمريكا الشمالية وأفريقيا", "آسيا وأفريقيا وأستراليا", "أوروبا وآسيا وأفريقيا", "أمريكا الشمالية وأمريكا الجنوبية وأستراليا"], "answer": "أمريكا الشمالية وأمريكا الجنوبية وأستراليا", "answerIndex": 3, "explanation": "قارات العالم الجديد هي الأمريكتان وأستراليا، وسُميت بذلك لأن الأوروبيين عرفوها متأخرة بعد الكشوف الجغرافية.", "type": "mcq", "topic": "", "source": "https://learningforthefuture1.blogspot.com/2026/09 q", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U2-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-134", "question": "When my brother and I have a conflict, my mother always ..................... it.", "choices": ["thinks", "helps", "allows", "resolves"], "answer": "resolves", "answerIndex": 3, "explanation": "resolve تعني يحل؛ الأم تحل الخلاف بين الأخوين.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U2-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-135", "question": "From my point of ....................., this is a great idea.", "choices": ["connection", "communication", "view", "review"], "answer": "view", "answerIndex": 2, "explanation": "point of view تعني وجهة نظر؛ وهي عبارة ثابتة.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U2-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-136", "question": "The manager held a meeting to discuss the new rules. To form the noun of «discuss», add the suffix «...............».", "choices": ["-ment", "-ful", "-ion", "-en"], "answer": "-ion", "answerIndex": 2, "explanation": "discuss + ion = discussion وتعني مناقشة.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U2-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-137", "question": "We must be ..................... to our teachers and parents because they help us a lot in life.", "choices": ["lazy", "respectful", "respected", "upset"], "answer": "respectful", "answerIndex": 1, "explanation": "respectful تعني محترم؛ نصف بها الشخص الذي يُظهر الاحترام، أما respected فتعني مُحترَم من الآخرين.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U2-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-138", "question": "When we talk ..................... person, it is easier to understand each other.", "choices": ["at", "on", "over", "in"], "answer": "in", "answerIndex": 3, "explanation": "in person تعني وجهًا لوجه؛ وهي عبارة ثابتة.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U2-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-139", "question": "It is important to have a/an ..................... with our friends to show the strong connection between each other.", "choices": ["inspiration", "bond", "imagination", "respectful"], "answer": "bond", "answerIndex": 1, "explanation": "bond تعني رابطة قوية؛ وهي الاسم المناسب هنا بعد a/an.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U2-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-140", "question": "Hala was very ..................... to her friend when she felt nervous before her exam.", "choices": ["calm", "supportive", "angry", "support"], "answer": "supportive", "answerIndex": 1, "explanation": "supportive تعني داعمة؛ وهي الصفة المناسبة بعد was very، أما support فاسم.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U2-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-141", "question": "Adham thought about what to buy for his friend. To form the adjective of «thought», add the suffix «...............».", "choices": ["-ness", "-ing", "-ment", "-ful"], "answer": "-ful", "answerIndex": 3, "explanation": "thought + ful = thoughtful وتعني متأنٍّ أو مراعٍ لمشاعر الآخرين.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U2-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-142", "question": "A/An ..................... is a movement or action that shows emotion.", "choices": ["silence", "gesture", "argument", "distraction"], "answer": "gesture", "answerIndex": 1, "explanation": "gesture تعني إيماءة؛ حركة أو فعل يُظهر شعورًا.", "type": "mcq", "topic" he train on time.", "choices": ["leaves", "had left", "left", "leave"], "answer": "had left", "answerIndex": 1, "explanation": "الشرط الثالث: If + had left في جزء الشرط، وwould have caught في النتيجة.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U2-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-148", "question": "If I ..................... you were coming, I would have baked a cake.", "choices": ["know", "knew", "would know", "had known"], "answer": "had known", "answerIndex": 3, "explanation": "الشرط الثالث: If + had known في جزء الشرط، وwould have baked في النتيجة.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g9t1u1test3c.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-149", "question": "We ..................... lost if we had brought a map with us.", "choices": ["didn't get", "hadn't gotten", "wouldn't get", "wouldn't have gotten"], "answer": "wouldn't have gotten", "answerIndex": 3, "explanation": "الشرط الثالث: If + had brought في جزء الشرط، وwould not have got lost في النتيجة.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g9t1u1test3c.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-150", "question": "If they ..................... more carefully, they wouldn't have made that mistake.", "choices": ["would listen", "listened", "listen", "had listened"], "answer": "had listened", "answerIndex": 3, "explanation": "الشرط الثالث: If + had listened في جزء الشرط، وwouldn't have made في النتيجة.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g9t1u1test3c.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-151", "question": "أوجد قيمة المقدار (2^3)^2.", "choices": ["16", "32", "64", "128"], "answer": "64", "answerIndex": 2, "explanation": "(2^3)^2 = 2^(3×2) = 2^6 = 64؛ قاعدة قوى القوى: نضرب الأسين.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-152", "question": "أي مما يلي يساوي (b^2)^3 ؟", "choices": ["b^5", "b^8", "b^9", "b^6"], "answer": "b^6", "answerIndex": 3, "explanation": "(b^2)^3 = b^(2×3) = b^6؛ قاعدة قوى القوى: نضرب الأسين.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-153", "question": "أوجد قيمة المقدار (x^3)^4 في أبسط صورة.", "choices": ["x^7", "x^12", "x^6", "x^81"], "answer": "x^12", "answerIndex": 1, "explanation": "(x^3)^4 = x^(3×4) = x^12؛ قاعدة قوى القوى: نضرب الأسين.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-154", "question": "أوجد قيمة المقدار (3^2)^3 × 3^-1.", "choices": ["27", "81", "243", "729"], "answer": "243", "answerIndex": 2, "explanation": "(3^2)^3 = 3^6 = 729، ثم 729 × 3^-1 = 729 ÷ 3 = 243 = 3^5.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-155", "question": "أوجد قيمة المقدار 3^5 ÷ 3^2.", "choices": ["3", "27", "9", "81"], "answer": "27", "answerIndex": 1, "explanation": "عند قسمة قوى لها نفس الأساس نطرح الأسين: 3^(5-2) = 3^3 = 27.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-156", "question": "أوجد قيمة المقدار a^5 × a^3 في أبسط صورة.", "choices": ["a^2", "a^5", "a^8", "a^15"], "answer": "a^8", "answerIndex": 2, "explanation": "عند ضرب قوى لها نفس الأساس نجمع الأسين: a^(5+3) = a^8.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-157", "question": "أوجد قيمة المقدار (2a)^3 في أبسط صورة.", "choices": ["2a^3", "8a^6", "6a^3", "8a^3"], "answer": "8a^3", "answerIndex": 3, "explanation": "نوزع الأس على العاملين: (2a)^3 = 2^3 × a^3 = 8a^3.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-158", "question": "أوجد قيمة المقدار 2^-3.", "choices": ["-6", "1/8", "8", "-8"], "answer": "1/8", "answerIndex": 1, "explanation": "الأس السالب يعني المقلوب: 2^-3 = 1/2^3 = 1/8.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-159", "question": "أوجد قيمة المقدار 5^0.", "choices": ["0", "5", "1", "-1"], "answer": "1", "answerIndex": 2, "explanation": "أي عدد غير الصفر مرفوع للقوة صفر يساوي 1.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-160", "question": "أوجد قيمة المقدار 10^-2.", "choices": ["-100", "-20", "100", "1/100"], "answer": "1/100", "answerIndex": 3, "explanation": "10^-2 = 1/10^2 = 1/100.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-161", "question": "أوجد قيمة المقدار (4^2)^3 في أبسط صورة.", "choices": ["4^12", "4^6", "4^5", "4^8"], "answer": "4^6", "answerIndex": 1, "explanation": "(4^2)^3 = 4^(2×3) = 4^6؛ قاعدة قوى القوى: نضرب الأسين.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-162", "question": "أوجد قيمة المقدار (5^2)^3 في أبسط صورة.", "choices": ["5^10", "5^5", "5^8", "5^6"], "answer": "5^6", "answerIndex": 3, "explanation": "(5^2)^3 = 5^(2×3) = 5^6؛ قاعدة قوى القوى: نضرب الأسين.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-163", "question": "أوجد قيمة المقدار (1/2)^-2.", "choices": ["2", "-4", "4", "1/4"], "answer": "4", "answerIndex": 2, "explanation": "(1/2)^-2 = 2^2 = 4؛ الأس السالب يقلب الكسر ثم نربع.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-164", "question": "إذا كان 2^(x+1) = 32، فما قيمة x ؟", "choices": ["5", "6", "4", "3"], "answer": "4", "answerIndex": 2, "explanation": "32 = 2^5، فتساوي الأسين: x+1 = 5، إذن x = 4.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-165", "question": "إذا كان 3^(x-2) = 27، فما قيمة x ؟", "choices": ["4", "6", "3", "5"], "answer": "5", "answerIndex": 3, "explanation": "27 = 3^3، فتساوي الأسين: x-2 = 3، إذن x = 5.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-166", "question": "إذا كان 4^x = 64، فما قيمة x ؟", "choices": ["3", "4", "2", "6"], "answer": "3", "answerIndex": 0, "explanation": "64 = 4^3، فتساوي الأسين: x = 3.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-167", "question": "إذا كان 9^x = 81، فما قيمة x ؟", "choices": ["2", "9", "3", "4"], "answer": "2", "answerIndex": 0, "explanation": "81 = 9^2، فتساوي الأسين: x = 2.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-168", "question": "إذا كان (1/2)^x = 1/16، فما قيمة x ؟", "choices": ["8", "4", "3", "2"], "answer": "4", "answerIndex": 1, "explanation": "1/16 = (1/2)^4، فتساوي الأسين: x = 4.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-169", "question": "إذا كان 5^(2x-1) = 125، فما قيمة x ؟", "choices": ["4", "2", "1", "3"], "answer": "2", "answerIndex": 1, "explanation": "125 = 5^3، فتساوي الأسين: 2x-1 = 3، إذن 2x = 4، ومنها x = 2.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/285926"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-170", "question": "إذا كان 11^(x-3) = 1، فما قيمة x ؟", "choices": ["4", "1", "2", "3"], "answer": "3", "answerIndex": 3, "explanation": "1 = 11^0، فتساوي الأسين: x-3 = 0، إذن x = 3.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-171", "question": "إذا كان 5^(2x-1) = 1/125، فما قيمة x ؟", "choices": ["-1", "-2", "1", "2"], "answer": "-1", "answerIndex": 0, "explanation": "1/125 = 5^-3، فتساوي الأسين: 2x-1 = -3، إذن 2x = -2، ومنها x = -1.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-172", "question": "إذا كان (1/8)^(x-2) = 128، فما قيمة x ؟", "choices": ["1/3", "-1/3", "3", "-3"], "answer": "-1/3", "answerIndex": 1, "explanation": "1/8 = 2^-3 و128 = 2^7، فتساوي الأسين: -3(x-2) = 7، أي -3x+6 = 7، ومنها x = -1/3.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-173", "question": "إذا كان 5^n × 49^n ÷ 35^n = 343، فما قيمة n ؟", "choices": ["7", "2", "4", "3"], "answer": "3", "answerIndex": 3, "explanation": "5^n × 49^n ÷ 35^n = (5×49÷35)^n = 7^n، و343 = 7^3، إذن n = 3.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-174", "question": "إذا كان 7^n × 27^n ÷ 21^n = 81، فما قيمة n ؟", "choices": ["4", "2", "9", "3"], "answer": "2", "answerIndex": 1, "explanation": "7^n × 27^n ÷ 21^n = (7×27÷21)^n = 9^n، و81 = 9^2، إذن n = 2.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-175", "question": "إذا كان 6^(2x-1) = 36، فما قيمة x ؟", "choices": ["1", "3/2", "2", "5/2"], "answer": "3/2", "answerIndex": 1, "explanation": "36 = 6^2، فتساوي الأسين: 2x-1 = 2، إذن 2x = 3، ومنها x = 3/2.", "type": "mcq", "topic": "", "source": "https://drive.google.com/file/d/1Se7vq8IgPjJOEFzWmZ5s7gvkJSW9VSIS/view"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-176", "question": "رأس المنحنى للدالة f(x) = 2(x-3)^2 + 1 هو ..........", "choices": ["(-3, -1)", "(-3, 1)", "(3, -1)", "(3, 1)"], "answer": "(3, 1)", "answerIndex": 3, "explanation": "الصورة f(x) = a(x-h)^2 + k رأسها (h, k)؛ هنا h = 3 وk = 1، فرأس المنحنى (3, 1).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-177", "question": "رأس المنحنى للدالة f(x) = (x+2)^2 + 5 هو ..........", "choices": ["(-2, 5)", "(2, 5)", "(2, -5)", "(-2, -5)"], "answer": "(-2, 5)", "answerIndex": 0, "explanation": "الصورة f(x) = a(x-h)^2 + k رأسها (h, k)؛ هنا h = -2 وk = 5، فرأس المنحنى (-2, 5).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-178", "question": "مجموعة أصفار الدالة f(x) = -3x هي ..........", "choices": ["{0}", "{3}", "{-3}", "∅"], "answer": "{0}", "answerIndex": 0, "explanation": "نضع الدالة = 0: -3x = 0، إذن x = 0، فمجموعة الأصفار {0}.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-179", "question": "مجموعة الأصفار الحقيقية للدالة f(x) = x^2 + 25 هي ..........", "choices": ["{-5}", "{5}", "{5, -5}", "∅"], "answer": "∅", "answerIndex": 3, "explanation": "x^2 + 25 = 0 تعني x^2 = -25، وهذا مستحيل في الأعداد الحقيقية، فمجموعة الأصفار فاي ∅.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-180", "question": "مجموعة أصفار الدالة f(x) = x^2 + 5x - 6 هي ..........", "choices": ["{6, -1}", "{-6, 1}", "{6, 1}", "{-6, -1}"], "answer": "{-6, 1}", "answerIndex": 1, "explanation": "x^2 + 5x - 6 = (x+6)(x-1) = 0، إذن x = -6 أو x = 1، فمجموعة الأصفار {-6, 1}.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-181", "question": "أوجد مجموعة الأصفار الحقيقية للدالة f(x) = x^2 - 36.", "choices": ["∅", "{6}", "{-6}", "{6, -6}"], "answer": "{6, -6}", "answerIndex": 3, "explanation": "x^2 - 36 = 0 تعني x^2 = 36، إذن x = 6 أو x = -6، فمجموعة الأصفار {6, -6}.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/285926"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-182", "question": "أوجد مجموعة الأصفار الحقيقية للدالة f(x) = 2x - 16.", "choices": ["{8}", "{16}", "{-8}", "{2}"], "answer": "{8}", "answerIndex": 0, "explanation": "2x - 16 = 0 تعني 2x = 16، إذن x = 8، فمجموعة الأصفار {8}.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/285926"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-183", "question": "مجموعة الأصفار الحقيقية للدالة f(x) = 6 هي ..........", "choices": ["{-6}", "{0}", "∅", "{6}"], "answer": "∅", "answerIndex": 2, "explanation": "الدالة الثابتة f(x) = 6 لا تساوي صفرًا أبدًا، فليس لها أصفار؛ مجموعة الأصفار فاي ∅.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-184", "question": "إذا كان مجال الدالة f(x) = 2x/(x-a) هو ح - {-2} فإن a = ..........", "choices": ["2", "4", "-2", "0"], "answer": "-2", "answerIndex": 2, "explanation": "المجال يستثني صفر المقام؛ المقام صفر عند x = a، والمستثنى هو -2، إذن a = -2.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-185", "question": "القيم التي تجعل الكسر f(x) = (3x+2)/(x^2-9) غير معرف هي ..........", "choices": ["±9", "3", "±3", "-3"], "answer": "±3", "answerIndex": 2, "explanation": "الكسر غير معرف عند أصفار المقام: x^2 - 9 = 0، إذن x = 3 أو x = -3، أي ±3.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-186", "question": "مجال الدالة f(x) = (x+2)/(x^2-9) هو ..........", "choices": ["ح - {3}", "ح", "ح - {-3, 3}", "ح - {-3}"], "answer": "ح - {-3, 3}", "answerIndex": 2, "explanation": "المجال = ح - {أصفار المقام}؛ x^2 - 9 = 0 عند x = 3 وx = -3، فالمجال ح - {-3, 3}.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-187", "question": "المجال المشترك للدالتين f(x) = 5x/(x^2-x) ، g(x) = 2/(x^2-1) هو ..........", "choices": ["ح - {0, 1, -1}", "ح - {1, -1}", "ح - {0, 1}", "ح - {0, -1}"], "answer": "ح - {0, 1, -1}", "answerIndex": 0, "explanation": "المجال المشترك = ح - {اتحاد أصفار المقامات}؛ مقام الأولى x(x-1) أصفاره 0 و1، ومقام الثانية x^2-1 أصفاره 1 و-1، فالاتحاد {0, 1, -1}.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-188", "question": "المجال المشترك للدالتين f(x) = (5+x)/(x^2-4) ، g(x) = (x^2-9)/(x+3) هو ..........", "choices": ["ح - {-3, 3}", "ح - {2, -2}", "ح - {-3, 2}", "ح - {-3, 2, -2}"], "answer": "ح - {-3, 2, -2}", "answerIndex": 3, "explanation": "أصفار مقام الأولى x^2-4 هي 2 و-2، وصفر مقام الثانية x+3 هو -3، فالاتحاد {-3, 2, -2}.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-189", "question": "المعكوس الجمعي للكسر 3/(x^2+1) هو ..........", "choices": ["-3/(x^2+1)", "3/(x^2+1)", "(x^2+1)/3", "-(x^2+1)/3"], "answer": "-3/(x^2+1)", "answerIndex": 0, "explanation": "المعكوس الجمعي يغيّر إشارة الكسر: المعكوس الجمعي لـ 3/(x^2+1) هو -3/(x^2+1).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-190", "question": "المعكوس الجمعي للكسر (x+4)/(x-5) هو ..........", "choices": ["(x+4)/(5-x)", "(x-5)/(x+4)", "-(x-4)/(x-5)", "(x+4)/(x-5)"], "answer": "(x+4)/(5-x)", "answerIndex": 0, "explanation": "المعكوس الجمعي يغيّر إشارة الكسر: -(x+4)/(x-5) = (x+4)/(5-x).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-191", "question": "المعكوس الضربي للكسر 3/(x^2+1) هو ..........", "choices": ["(x^2+1)/3", "3/(x^2+1)", "-3/(x^2+1)", "-(x^2+1)/3"], "answer": "(x^2+1)/3", "answerIndex": 0, "explanation": "المعكوس الضربي يقلب الكسر: المعكوس الضربي لـ 3/(x^2+1) هو (x^2+1)/3.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-192", "question": "نقطة تقاطع منحنى الدالة f(x) = x^2 - 3x - 5 مع محور y هي ..........", "choices": ["(5, 0)", "(-5, 0)", "(0, -5)", "(0, 5)"], "answer": "(0, -5)", "answerIndex": 2, "explanation": "للتقاطع مع محور y نضع x = 0: f(0) = -5، فالنقطة (0, -5).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-193", "question": "نقطة تقاطع منحنى الدالة f(x) = x^2 - 2x - 10 مع محور y هي ..........", "choices": ["(10, 0)", "(-10, 0)", "(0, -10)", "(0, 10)"], "answer": "(0, -10)", "answerIndex": 2, "explanation": "للتقاطع مع محور y نضع x = 0: f(0) = -10، فالنقطة (0, -10).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-194", "question": "القيمة العظمى للدالة f(x) = -3x^2 + 6x + 5 هي ..........", "choices": ["1", "-8", "8", "5"], "answer": "8", "answerIndex": 2, "explanation": "رأس المنحنى عند x = -b/2a = 1، وf(1) = -3+6+5 = 8، ولأن معامل x^2 سالب فهي قيمة عظمى.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-195", "question": "رأس المنحنى للدالة f(x) = x^2 - 2x هو ..........", "choices": ["(1, -1)", "(1, 1)", "(-1, -1)", "(-1, 1)"], "answer": "(1, -1)", "answerIndex": 0, "explanation": "رأس المنحنى عند x = -b/2a = 1، وf(1) = 1-2 = -1، فرأس المنحنى (1, -1)؛ محور التماثل x = 1 والقيمة الصغرى -1.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-196", "question": "رأس المنحنى للدالة f(x) = -x^2 + 2x هو ..........", "choices": ["(1, -1)", "(-1, 1)", "(-1, -1)", "(1, 1)"], "answer": "(1, 1)", "answerIndex": 3, "explanation": "رأس المنحنى عند x = -b/2a = 1، وf(1) = -1+2 = 1، فرأس المنحنى (1, 1)؛ ولأن معامل x^2 سالب فالقيمة العظمى 1.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-197", "question": "مجموعة أصفار الدالة f(x) = (x^2-2x)/(x^2+2x) هي ..........", "choices": ["{2}", "{0}", "{-2}", "{0, 2}"], "answer": "{2}", "answerIndex": 0, "explanation": "بعد الاختصار (x-2)/(x+2) = 0 عند x = 2، مع استثناء 0 و-2 من المجال؛ فالصفر الوحيد هو 2.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-198", "question": "إذا كانت f(x) = x/[x(x-3)] ، g(x) = 1/(x-3) فإن قيم x التي عندها f(x) = g(x) هي ..........", "choices": ["ح", "ح - {0, 3}", "ح - {0}", "ح - {3}"], "answer": "ح - {0, 3}", "answerIndex": 1, "explanation": "f(x) = 1/(x-3) بعد الاختصار بشرط x ≠ 0 وx ≠ 3، فتتساوى الدالتان على ح - {0, 3}.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-199", "question": "إذا كان 4 ، 0 هما صفرا الدالة f(x) = x^2 + ax + b فإن قيمة a تساوي ..........", "choices": ["-4", "4", "0", "-2"], "answer": "-4", "answerIndex": 0, "explanation": "مجموع الصفرين = -a؛ 4+0 = 4 = -a، إذن a = -4 (وحاصل ضربهما b = 0).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الجبر", "id": "h26-g9-200", "question": "إذا كان 4 أحد أصفار الدالة f(x) = x^2 - kx + 12 فإن k = ..........", "choices": ["7", "12", "4", "3"], "answer": "7", "answerIndex": 0, "explanation": "نعوض x = 4: 16 - 4k + 12 = 0، إذن 4k = 28، ومنها k = 7.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/emtehan-wehda-2-ryada-3-edady-model-2-dawal-.html"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-201", "question": "ما الشرطان اللازمان معًا لتشابه مضلعين؟", "choices": ["تساوي قياسات الزوايا المتناظرة وتناسب أطوال الأضلاع المتناظرة", "تساوي قياسات الزوايا فقط", "تساوي المحيطين فقط", "تساوي أطوال الأضلاع فقط"], "answer": "تساوي قياسات الزوايا المتناظرة وتناسب أطوال الأضلاع المتناظرة", "answerIndex": 0, "explanation": "يتشابه المضلعان إذا تحقق الشرطان معًا: تساوي قياسات الزوايا المتناظرة، وتناسب أطوال الأضلاع المتناظرة؛ ولو نقص أحدهما فالمضلعان غير متشابهين.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286482"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-202", "question": "مضلعان متشابهان، النسبة بين طولي ضلعين متناظرين فيهما 5 : 3، ومجموع محيطيهما 128 سم، فما محيط المضلع الأكبر؟", "choices": ["96", "64", "80", "48"], "answer": "80", "answerIndex": 2, "explanation": "نسبة المحيطين = نسبة التشابه 5 : 3؛ نفرض المحيطين 5س و3س، فـ 5س+3س=128، س=16، فمحيط الأكبر 5×16=80 سم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286482"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-203", "question": "المضلع ABCD يشابه المضلع XYZW، وطول AB = 6 سم، وطول XY = 9 سم، ومحيط ABCD = 24 سم، فما محيط XYZW؟", "choices": ["16", "54", "30", "36"], "answer": "36", "answerIndex": 3, "explanation": "نسبة التشابه 9/6 = 3/2، ونسبة المحيطين تساويها، فمحيط XYZW = 24 × 3/2 = 36 سم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286482"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-204", "question": "المضلع ABCD يشابه المضلع XYZW، وAB توازي DC، وقياس زاوية A = 70°، فما قياس زاوية W؟", "choices": ["90", "110", "180", "70"], "answer": "110", "answerIndex": 1, "explanation": "زاوية W تناظر زاوية D؛ وبما أن AB توازي DC فالزاويتان A وD متكاملتان (داخلتان في جهة واحدة)، فقياس D = 180-70 = 110°، إذن قياس W = 110°.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286482"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-205", "question": "مستطيلان متشابهان، أبعاد المستطيل الأول 6 سم و4 سم، ومحيط المستطيل الثاني 50 سم، فما بعدا المستطيل الثاني؟", "choices": ["15 سم و10 سم", "20 سم و10 سم", "12 سم و8 سم", "25 سم و5 سم"], "answer": "15 سم و10 سم", "answerIndex": 0, "explanation": "محيط الأول = 2×(6+4) = 20 سم، ونسبة التشابه = 50/20 = 2.5، فبعدا الثاني 6×2.5=15 سم و4×2.5=10 سم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286482"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-206", "question": "إذا كانت نسبة التشابه بين مضلعين 2 : 3، فما النسبة بين محيطيهما؟", "choices": ["3 : 2", "2 : 3", "4 : 9", "1 : 1"], "answer": "2 : 3", "answerIndex": 1, "explanation": "النسبة بين محيطي مضلعين متشابهين تساوي نسبة التشابه بينهما.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286482"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-207", "question": "مضلعان متشابهان بنسبة تشابه 2 : 5، فما النسبة بين مساحتيهما؟", "choices": ["8 : 125", "2 : 5", "4 : 25", "5 : 2"], "answer": "4 : 25", "answerIndex": 2, "explanation": "النسبة بين مساحتي مضلعين متشابهين تساوي مربع نسبة التشابه: (2/5)² = 4/25.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286482"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-208", "question": "مربعان متشابهان، طول ضلع الأول 3 سم وطول ضلع الثاني 6 سم، ومساحة الأول 9 سم²، فما مساحة الثاني؟", "choices": ["27", "45", "36", "18"], "answer": "36", "answerIndex": 2, "explanation": "نسبة التشابه 6/3 = 2، ونسبة المساحتين مربعها 4، فمساحة الثاني = 9×4 = 36 سم².", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286482"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-209", "question": "أي مما يلي متشابهان دائمًا؟", "choices": ["أي مربعين", "أي معينين", "أي مستطيلين", "أي شبهي منحرف"], "answer": "أي مربعين", "answerIndex": 0, "explanation": "أي مربعين متشابهان دائمًا لأن زواياهما كلها قوائم وأضلاعهما متناسبة؛ أما المستطيلان والمعينان فليسا متشابهين بالضرورة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286482"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-210", "question": "مستطيل أبعاده 4 سم و6 سم، ومستطيل آخر أبعاده 5 سم و9 سم، فهل المستطيلان متشابهان؟", "choices": ["لا، لأن محيطيهما مختلفان", "نعم، لأن أضلاعهما متناسبة", "نعم، لأن زواياهما متساوية", "لا، لأن 4/5 لا تساوي 6/9"], "answer": "لا، لأن 4/5 لا تساوي 6/9", "answerIndex": 3, "explanation": "للتشابه يجب تناسب الأضلاع المتناظرة: 4/5 = 0.8 بينما 6/9 ≈ 0.67، فالأضلاع غير متناسبة والمستطيلان غير متشابهين (تساوي الزوايا وحده لا يكفي).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286482"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-211", "question": "مثلثان فيهما قياسا زاويتين متساويان مع قياسي زاويتين متناظرتين في الآخر، فالمثلثان ..........", "choices": ["غير متشابهين", "متطابقان", "متساويا المساحة", "متشابهان"], "answer": "متشابهان", "answerIndex": 3, "explanation": "هذه الحالة الأولى لتشابه المثلثات (زاويتان): تساوي قياسي زاويتين يكفي لتشابه المثلثين.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=4-aLhDc8paY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-212", "question": "إذا تناسبت أطوال الأضلاع الثلاثة المتناظرة في مثلثين، فالمثلثان ..........", "choices": ["متطابقان", "غير متشابهين", "متشابهان", "متساويا المساحة"], "answer": "متشابهان", "answerIndex": 2, "explanation": "هذه الحالة الثانية لتشابه المثلثات (ثلاثة أضلاع متناسبة).", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=4-aLhDc8paY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-213", "question": "إذا تناسب طولا ضلعين متناظرين وتساوى قياسا الزاويتين المحصورتين بينهما في مثلثين، فالمثلثان ..........", "choices": ["متطابقان", "متساويا المساحة", "متشابهان", "غير متشابهين"], "answer": "متشابهان", "answerIndex": 2, "explanation": "هذه الحالة الثالثة لتشابه المثلثات (ضلعان متناسبان والزاوية المحصورة بينهما متساوية).", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=4-aLhDc8paY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-214", "question": "مثلث أطوال أضلاعه 3 سم و4 سم و5 سم، وآخر أطوال أضلاعه 6 سم و8 سم و10 سم، فما نسبة التشابه بينهما؟", "choices": ["2 : 1", "1 : 2", "3 : 4", "1 : 3"], "answer": "1 : 2", "answerIndex": 1, "explanation": "3/6 = 4/8 = 5/10 = 1/2، فالأضلاع متناسبة ونسبة التشابه 1 : 2 (الحالة الثانية).", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=4-aLhDc8paY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-215", "question": "مثلثان متشابهان بنسبة تشابه 3 : 2، فإذا كان طول ضلع في المثلث الأول 9 سم، فما طول الضلع المناظر له في المثلث الثاني؟", "choices": ["12", "6", "4.5", "13.5"], "answer": "6", "answerIndex": 1, "explanation": "الضلع المناظر = 9 × 2/3 = 6 سم.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=4-aLhDc8paY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-216", "question": "في مثلثين قائمي الزاوية، إذا تناسب طولا الوترين وطولا ضلعين متناظرين آخرين، فالمثلثان ..........", "choices": ["غير متشابهين", "متساويا المساحة", "متطابقان", "متشابهان"], "answer": "متشابهان", "answerIndex": 3, "explanation": "هذه حالة التشابه في المثلثين القائمي الزاوية: تناسب الوترين مع تناسب ضلعين متناظرين يكفي للتشابه.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=4-aLhDc8paY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-217", "question": "مثلث قائم الزاوية في أ، رسم الارتفاع أ د على الوتر ب جـ، فإذا كان ب د = 4 سم، ود جـ = 9 سم، فما طول أ د؟", "choices": ["6", "36", "13", "5"], "answer": "6", "answerIndex": 0, "explanation": "بنظرية إقليدس: مربع الارتفاع على الوتر يساوي حاصل ضرب جزأي الوتر: أ د² = ب د × د جـ = 4×9 = 36، فأ د = 6 سم.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=4-aLhDc8paY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-218", "question": "في المثلث السابق (ب د = 4 سم، د جـ = 9 سم)، فما طول الضلع أ ب؟", "choices": ["2 جذر 13 سم", "9 سم", "6 سم", "13 سم"], "answer": "2 جذر 13 سم", "answerIndex": 0, "explanation": "بنظرية إقليدس: أ ب² = ب د × ب جـ = 4 × 13 = 52، فأ ب = جذر 52 = 2 جذر 13 سم.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=4-aLhDc8paY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-219", "question": "مثلثان متشابهان بنسبة تشابه 2 : 3، ومحيط الأول 18 سم، فما محيط الثاني؟", "choices": ["12", "36", "27", "9"], "answer": "27", "answerIndex": 2, "explanation": "نسبة المحيطين = نسبة التشابه، فمحيط الثاني = 18 × 3/2 = 27 سم.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=4-aLhDc8paY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-220", "question": "مثلثان متشابهان بنسبة تشابه 1 : 4، ومساحة الأول 5 سم²، فما مساحة الثاني؟", "choices": ["10", "20", "40", "80"], "answer": "80", "answerIndex": 3, "explanation": "نسبة المساحتين = مربع نسبة التشابه = (1/4)² = 1/16، فمساحة الثاني = 5 × 16 = 80 سم².", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=4-aLhDc8paY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-221", "question": "معامل التمدد يساوي ..........", "choices": ["طول الصورة ÷ طول الشكل الأصلي", "طول الشكل الأصلي ÷ طول الصورة", "مساحة الصورة ÷ مساحة الشكل الأصلي", "محيط الصورة − محيط الشكل الأصلي"], "answer": "طول الصورة ÷ طول الشكل الأصلي", "answerIndex": 0, "explanation": "معامل التمدد k = طول الصورة ÷ طول الشكل الأصلي (طول الضلع في الصورة على طول الضلع المناظر في الأصل).", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=lg2ztSXsu3Y"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-222", "question": "إذا كان معامل التمدد k = 3، فالتمدد ..........", "choices": ["تطابق", "تكبير", "انعكاس", "تصغير"], "answer": "تكبير", "answerIndex": 1, "explanation": "إذا كان معامل التمدد أكبر من 1 فالتمدد تكبير؛ والصورة أكبر من الشكل الأصلي.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=lg2ztSXsu3Y"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-223", "question": "إذا كان معامل التمدد k = 1/2، فالتمدد ..........", "choices": ["تصغير", "تكبير", "انعكاس", "تطابق"], "answer": "تصغير", "answerIndex": 0, "explanation": "إذا كان معامل التمدد بين 0 و1 فالتمدد تصغير؛ والصورة أصغر من الشكل الأصلي.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=lg2ztSXsu3Y"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-224", "question": "صورة النقطة (2, 3) بتمدد مركزه نقطة الأصل ومعامله 2 هي ..........", "choices": ["(2, 6)", "(1, 3)", "(4, 3)", "(4, 6)"], "answer": "(4, 6)", "answerIndex": 3, "explanation": "بتمدد مركزه نقطة الأصل ومعامله k تتحول النقطة (x, y) إلى (kx, ky): (2×2, 3×2) = (4, 6).", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=lg2ztSXsu3Y"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-225", "question": "صورة النقطة (-1, 4) بتمدد مركزه نقطة الأصل ومعامله 3 هي ..........", "choices": ["(3, 12)", "(-1, 12)", "(-3, 12)", "(-3, 4)"], "answer": "(-3, 12)", "answerIndex": 2, "explanation": "(-1×3, 4×3) = (-3, 12).", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=lg2ztSXsu3Y"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-226", "question": "قطعة مستقيمة طولها 5 سم، صارت صورتها بالتمدد 15 سم، فما معامل التمدد؟", "choices": ["10", "3", "1/3", "5"], "answer": "3", "answerIndex": 1, "explanation": "معامل التمدد = طول الصورة ÷ طول الأصل = 15 ÷ 5 = 3.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=lg2ztSXsu3Y"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-227", "question": "مثلث محيطه 12 سم، صُوِّر بتمدد معامله 2، فما محيط صورته؟", "choices": ["12", "6", "24", "48"], "answer": "24", "answerIndex": 2, "explanation": "التمدد يكبّر الأطوال بمعامل التمدد، فمحيط الصورة = 12 × 2 = 24 سم.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=lg2ztSXsu3Y"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-228", "question": "مربع مساحته 9 سم²، صُوِّر بتمدد معامله 3، فما مساحة صورته؟", "choices": ["81", "36", "27", "18"], "answer": "81", "answerIndex": 0, "explanation": "المساحات تتكبّر بمربع معامل التمدد: 3² = 9، فمساحة الصورة = 9 × 9 = 81 سم².", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=lg2ztSXsu3Y"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-229", "question": "جا الزاوية الحادة في المثلث القائم الزاوية تساوي ..........", "choices": ["طول الضلع المقابل / طول الضلع المجاور", "طول الضلع المجاور / طول الوتر", "طول الضلع المقابل / طول الوتر", "طول الوتر / طول الضلع المقابل"], "answer": "طول الضلع المقابل / طول الوتر", "answerIndex": 2, "explanation": "جا الزاوية = طول الضلع المقابل للزاوية ÷ طول الوتر.", "type": "mcq", "topic": "", "source": "https://shantaed.blogspot.com/2025/12/trigonometry-guide-third-preparatory-term-1-2026-pdf.html"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-230", "question": "جتا الزاوية الحادة في المثلث القائم الزاوية تساوي ..........", "choices": ["طول الضلع المقابل / طول الوتر", "طول الضلع المقابل / طول الضلع المجاور", "طول الوتر / طول الضلع المجاور", "طول الضلع المجاور / طول الوتر"], "answer": "طول الضلع المجاور / طول الوتر", "answerIndex": 3, "explanation": "جتا الزاوية = طول الضلع المجاور للزاوية ÷ طول الوتر.", "type": "mcq", "topic": "", "source": "https://shantaed.blogspot.com/2025/12/trigonometry-guide-third-preparatory-term-1-2026-pdf.html"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-231", "question": "ظا الزاوية الحادة في المثلث القائم الزاوية تساوي ..........", "choices": ["طول الضلع المجاور / طول الوتر", "طول الوتر / طول الضلع المقابل", "طول الضلع المقابل / طول الضلع المجاور", "طول الضلع المقابل / طول الوتر"], "answer": "طول الضلع المقابل / طول الضلع المجاور", "answerIndex": 2, "explanation": "ظا الزاوية = طول الضلع المقابل ÷ طول الضلع المجاور، وتساوي أيضًا جا الزاوية ÷ جتا الزاوية.", "type": "mcq", "topic": "", "source": "https://shantaed.blogspot.com/2025/12/trigonometry-guide-third-preparatory-term-1-2026-pdf.html"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-232", "question": "مثلث قائم الزاوية، طول الضلع المقابل لإحدى زاويتيه الحادتين 3 سم وطول الوتر 5 سم، فما جا هذه الزاوية؟", "choices": ["5/3", "4/5", "3/4", "3/5"], "answer": "3/5", "answerIndex": 3, "explanation": "جا الزاوية = المقابل ÷ الوتر = 3 ÷ 5 = 3/5.", "type": "mcq", "topic": "", "source": "https://shantaed.blogspot.com/2025/12/trigonometry-guide-third-preparatory-term-1-2026-pdf.html"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-233", "question": "في مثلث قائم الزاوية أطوال أضلاعه 3 سم و4 سم و5 سم، فإذا كان الوتر 5 سم والمقابل لإحدى الزاويتين الحادتين 3 سم، فما ظا هذه الزاوية؟", "choices": ["5/3", "4/5", "3/4", "3/5"], "answer": "3/4", "answerIndex": 2, "explanation": "المجاور = 4 سم، فظا الزاوية = المقابل ÷ المجاور = 3 ÷ 4 = 3/4.", "type": "mcq", "topic": "", "source": "https://shantaed.blogspot.com/2025/12/trigonometry-guide-third-preparatory-term-1-2026-pdf.html"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-234", "question": "جا 30° تساوي ..........", "choices": ["1", "جذر 2 / 2", "1/2", "جذر 3 / 2"], "answer": "1/2", "answerIndex": 2, "explanation": "من جدول الزوايا الخاصة: جا 30° = 1/2.", "type": "mcq", "topic": "", "source": "https://shantaed.blogspot.com/2025/12/trigonometry-guide-third-preparatory-term-1-2026-pdf.html"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-235", "question": "ظا 45° تساوي ..........", "choices": ["1", "1/2", "جذر 3", "جذر 2"], "answer": "1", "answerIndex": 0, "explanation": "من جدول الزوايا الخاصة: ظا 45° = 1، لأن جا 45° = جتا 45°.", "type": "mcq", "topic": "", "source": "https://shantaed.blogspot.com/2025/12/trigonometry-guide-third-preparatory-term-1-2026-pdf.html"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-236", "question": "جا 45° تساوي ..........", "choices": ["1/2", "1", "جذر 3 / 2", "1/جذر 2"], "answer": "1/جذر 2", "answerIndex": 3, "explanation": "من جدول الزوايا الخاصة: جا 45° = 1/جذر 2 (وتساوي جذر 2 / 2).", "type": "mcq", "topic": "", "source": "https://shantaed.blogspot.com/2025/12/trigonometry-guide-third-preparatory-term-1-2026-pdf.html"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-237", "question": "إذا كانت س، ص زاويتين متتامتين، فإن جا س تساوي ..........", "choices": ["جا ص", "جتا ص", "1", "ظا ص"], "answer": "جتا ص", "answerIndex": 1, "explanation": "جا الزاوية = جتا متممتها: جا س = جتا (90° − س) = جتا ص.", "type": "mcq", "topic": "", "source": "https://shantaed.blogspot.com/2025/12/trigonometry-guide-third-preparatory-term-1-2026-pdf.html"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-238", "question": "جا² س + جتا² س تساوي ..........", "choices": ["0", "2", "ظا س", "1"], "answer": "1", "answerIndex": 3, "explanation": "المتطابقة الأساسية: جا² س + جتا² س = 1 لأي زاوية حادة س.", "type": "mcq", "topic": "", "source": "https://shantaed.blogspot.com/2025/12/trigonometry-guide-third-preparatory-term-1-2026-pdf.html"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-239", "question": "ظا س تساوي ..........", "choices": ["جا س + جتا س", "جتا س / جا س", "جا س / جتا س", "جا س × جتا س"], "answer": "جا س / جتا س", "answerIndex": 2, "explanation": "ظا س = (المقابل/الوتر) ÷ (المجاور/الوتر) = المقابل/المجاور = جا س ÷ جتا س.", "type": "mcq", "topic": "", "source": "https://shantaed.blogspot.com/2025/12/trigonometry-guide-third-preparatory-term-1-2026-pdf.html"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-240", "question": "إذا كان ظا س = جذر 3 حيث س زاوية حادة، فما قياس س؟", "choices": ["90°", "60°", "45°", "30°"], "answer": "60°", "answerIndex": 1, "explanation": "من جدول الزوايا الخاصة: ظا 60° = جذر 3، إذن س = 60°.", "type": "mcq", "topic": "", "source": "https://shantaed.blogspot.com/2025/12/trigonometry-guide-third-preparatory-term-1-2026-pdf.html"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-241", "question": "ميل المستقيم المار بالنقطتين (1, 2) و(4, 8) يساوي ..........", "choices": ["6", "3", "2", "1/2"], "answer": "2", "answerIndex": 2, "explanation": "الميل = (8 − 2) ÷ (4 − 1) = 6 ÷ 3 = 2.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=CIkTVtp89lY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-242", "question": "ميل المستقيم الموازي لمستقيم ميله 3 يساوي ..........", "choices": ["-1/3", "3", "-3", "1/3"], "answer": "3", "answerIndex": 1, "explanation": "المستقيمان المتوازيان لهما الميل نفسه.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=CIkTVtp89lY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-243", "question": "ميل المستقيم العمودي على مستقيم ميله 2 يساوي ..........", "choices": ["-1/2", "-2", "2", "1/2"], "answer": "-1/2", "answerIndex": 0, "explanation": "حاصل ضرب ميلي مستقيمين متعامدين = -1، فالميل العمودي = -1/2.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=CIkTVtp89lY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-244", "question": "في معادلة المستقيم y = 3x + 5، ما الميل والجزء المقطوع من محور y؟", "choices": ["الميل -3 والجزء المقطوع 5", "الميل 5 والجزء المقطوع 3", "الميل 3 والجزء المقطوع 5", "الميل 3 والجزء المقطوع -5"], "answer": "الميل 3 والجزء المقطوع 5", "answerIndex": 2, "explanation": "في الصورة y = mx + c يكون m هو الميل وc هو الجزء المقطوع من محور y؛ هنا m = 3 وc = 5.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=CIkTVtp89lY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-245", "question": "معادلة المستقيم الذي ميله 2 ويمر بالنقطة (0, 1) هي ..........", "choices": ["y = -2x + 1", "y = x + 2", "y = 2x + 1", "y = 2x - 1"], "answer": "y = 2x + 1", "answerIndex": 2, "explanation": "بصورة الميل والجزء المقطوع y = mx + c: الميل 2 والجزء المقطوع 1 (لأن المستقيم يمر بالنقطة (0, 1))، فالمعادلة y = 2x + 1.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=CIkTVtp89lY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-246", "question": "ميل مستقيم يصنع زاوية 45° مع الاتجاه الموجب لمحور x يساوي ..........", "choices": ["جذر 3", "1/2", "1", "0"], "answer": "1", "answerIndex": 2, "explanation": "ميل المستقيم = ظا زاوية ميله = ظا 45° = 1.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=CIkTVtp89lY"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-247", "question": "مدى البيانات 3، 7، 2، 9، 5 يساوي ..........", "choices": ["5", "7", "9", "2"], "answer": "7", "answerIndex": 1, "explanation": "المدى = أكبر قيمة − أصغر قيمة = 9 − 2 = 7.", "type": "mcq", "topic": "", "source": "https://khutwa101.com/ar/courses/stat101/lessons/m1-l5"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-248", "question": "المدى الربيعي للبيانات 2، 4، 6، 8، 10، 12 يساوي ..........", "choices": ["4", "10", "8", "6"], "answer": "6", "answerIndex": 3, "explanation": "الربيع الأول وسيط النصف الأدنى (2، 4، 6) = 4، والربيع الثالث وسيط النصف الأعلى (8، 10، 12) = 10، فالمدى الربيعي = 10 − 4 = 6.", "type": "mcq", "topic": "", "source": "https://khutwa101.com/ar/courses/stat101/lessons/m1-l5"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-249", "question": "الانحراف المعياري للبيانات 2، 6 يساوي ..........", "choices": ["1", "2", "4", "جذر 2"], "answer": "2", "answerIndex": 1, "explanation": "الوسط الحسابي = 4، وانحرافا القيمتين عنه -2 و2، ومربعاهما 4 و4، فالتباين = (4+4) ÷ 2 = 4 (بقسمة مجموع مربعات الانحرافات على عدد القيم)، والانحراف المعياري = جذر 4 = 2.", "type": "mcq", "topic": "", "source": "https://khutwa101.com/ar/courses/stat101/lessons/m1-l5"}, {"grade": 9, "subject": "الهندسة", "id": "h26-g9-250", "question": "الانحراف المعياري للبيانات 5، 5، 5، 5 يساوي ..........", "choices": ["5", "1", "0", "20"], "answer": "0", "answerIndex": 2, "explanation": "كل القيم تساوي الوسط الحسابي 5، فكل الانحرافات صفر، والتباين صفر، والانحراف المعياري صفر.", "type": "mcq", "topic": "", "source": "https://khutwa101.com/ar/courses/stat101/lessons/m1-l5"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-251", "question": "Self-driving cars are a great example of modern innovation in transportation. «Innovation» is a synonym of «...............».", "choices": ["creativity", "routine", "tradition", "imitation"], "answer": "creativity", "answerIndex": 0, "explanation": "innovation تعني ابتكار، ومرادفها creativity أي إبداع.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-252", "question": "We play this game on a computer. It is a ............... game.", "choices": ["real", "natural", "true", "virtual"], "answer": "virtual", "answerIndex": 3, "explanation": "virtual تعني افتراضي؛ اللعبة تُلعب على الحاسوب فهي لعبة افتراضية.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-253", "question": "The adjective «...............» means very modern, developed, or complex; not basic.", "choices": ["basic", "advanced", "simple", "expensive"], "answer": "advanced", "answerIndex": 1, "explanation": "advanced تعني متقدّم وحديث ومتطوّر؛ وعكسها basic.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-254", "question": "The new robot will ............... human workers in some factories.", "choices": ["replace", "expect", "allow", "put"], "answer": "replace", "answerIndex": 0, "explanation": "replace تعني يحلّ محلّ؛ الروبوت سيحلّ محلّ العمال البشريين في بعض المصانع.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-255", "question": "Although AI and robots are smart, they still have ............... and cannot do everything.", "choices": ["intelligence", "medicines", "limits", "behaviors"], "answer": "limits", "answerIndex": 2, "explanation": "limits تعني حدود؛ للذكاء الاصطناعي حدود فلا يستطيع فعل كل شيء.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-256", "question": "Doctors in hospitals use robots to help them during ............... .", "choices": ["play", "cleaning", "homework", "surgery"], "answer": "surgery", "answerIndex": 3, "explanation": "surgery تعني جراحة؛ الروبوتات تساعد الأطباء أثناء الجراحة.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-257", "question": "A/An ............... is a machine that can move and do work for us.", "choices": ["computer", "emotion", "human", "robot"], "answer": "robot", "answerIndex": 3, "explanation": "robot آلة تتحرّك وتؤدّي أعمالًا لنا.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-258", "question": "My teacher gave me a difficult ............... to finish today.", "choices": ["song", "game", "task", "meal"], "answer": "task", "answerIndex": 2, "explanation": "task تعني مهمّة أو عمل يُنجَز.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-259", "question": "Artificial Intelligence allows the robot to ............... decisions.", "choices": ["put", "make", "do", "read"], "answer": "make", "answerIndex": 1, "explanation": "الاصطلاح الثابت make decisions أي يتّخذ قرارات.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-260", "question": "The way someone or something acts or responds is called a/an ............... .", "choices": ["behavior", "emotion", "algorithm", "emoji"], "answer": "behavior", "answerIndex": 0, "explanation": "behavior تعني سلوك؛ أي الطريقة التي يتصرّف بها شخص أو شيء.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-261", "question": "We use a ............... to clean the floor.", "choices": ["robot dog", "vacuum cleaner", "fan", "fridge"], "answer": "vacuum cleaner", "answerIndex": 1, "explanation": "vacuum cleaner أي مكنسة كهربائية تُستخدم لتنظيف الأرضية.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-262", "question": "Artificial Intelligence can ............... music and write poetry.", "choices": ["do", "learn", "feel", "compose"], "answer": "compose", "answerIndex": 3, "explanation": "compose تعني يؤلّف ويلحّن؛ الذكاء الاصطناعي يؤلّف الموسيقى ويكتب الشعر.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-263", "question": "Artificial Intelligence is ............... our world by offering amazing benefits.", "choices": ["transforming", "reducing", "limiting", "diagnosing"], "answer": "transforming", "answerIndex": 0, "explanation": "transform تعني يحوّل ويغيّر؛ الذكاء الاصطناعي يحوّل عالمنا بفوائده المدهشة.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-264", "question": "In schools, AI provides ............... learning, which fits each student perfectly.", "choices": ["personalized", "difficult", "complex", "stupid"], "answer": "personalized", "answerIndex": 0, "explanation": "personalized learning تعني تعلّمًا مخصّصًا يناسب كل طالب.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-265", "question": "The school bought a new computer as a/an ............... for the old one.", "choices": ["entertainment", "replacement", "machine", "software"], "answer": "replacement", "answerIndex": 1, "explanation": "replacement تعني بديل؛ الحاسوب الجديد بديل للقديم.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-266", "question": "AI improves the quality of ............... service by making communication faster and easier.", "choices": ["student", "teacher", "customer", "animal"], "answer": "customer", "answerIndex": 2, "explanation": "customer service تعني خدمة العملاء؛ والذكاء الاصطناعي يحسّن جودتها.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-267", "question": "The movie made everyone cry because it showed strong ............... .", "choices": ["emotions", "houses", "trees", "cars"], "answer": "emotions", "answerIndex": 0, "explanation": "emotions تعني مشاعر؛ الفيلم أظهر مشاعر قوية فأبكى الجميع.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-268", "question": "A ............... is a flying machine controlled by a remote.", "choices": ["satellite", "drone", "ship", "mobile phone"], "answer": "drone", "answerIndex": 1, "explanation": "drone طائرة بلا طيّار تُتحكَّم فيها عن بُعد.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-269", "question": "AI systems learn by analyzing large amounts of data and recognizing ............... .", "choices": ["patterns", "silence", "water", "stones"], "answer": "patterns", "answerIndex": 0, "explanation": "patterns تعني أنماط؛ أنظمة الذكاء الاصطناعي تتعلّم بتحليل البيانات والتعرّف على الأنماط.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-270", "question": "The synonym of the word «error» is «...............».", "choices": ["act", "idea", "draft", "mistake"], "answer": "mistake", "answerIndex": 3, "explanation": "error مرادفها mistake أي خطأ.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-271", "question": "Hesham couldn't solve the complex math problem. The word «complex» can be replaced with «...............» to give the same meaning.", "choices": ["simple", "easy", "creative", "complicated"], "answer": "complicated", "answerIndex": 3, "explanation": "complex مرادفها complicated أي معقّد.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-272", "question": "Deleting «e» and adding the suffix «-ity» turns the word «creative» into a/an ............... .", "choices": ["adverb", "verb", "adjective", "noun"], "answer": "noun", "answerIndex": 3, "explanation": "اللاحقة -ity تحوّل الصفة creative إلى الاسم creativity.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-273", "question": "I need an instant answer to my question. The suffix «-ly» changes the adjective «instant» into a/an ............... .", "choices": ["adjective", "adverb", "noun", "verb"], "answer": "adverb", "answerIndex": 1, "explanation": "اللاحقة -ly تحوّل الصفة instant إلى الحال instantly.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-274", "question": "It rained for two hours last night. Add the suffix «...............» to turn the word «rain» into an adjective.", "choices": ["-ment", "-ly", "-ing", "-y"], "answer": "-y", "answerIndex": 3, "explanation": "نضيف -y إلى rain فتصبح rainy أي ممطر.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-275", "question": "Ali feels proud of his progress in English. The suffix «...............» is added to «feel» to form its noun.", "choices": ["-ful", "-ing", "-ment", "-ed"], "answer": "-ing", "answerIndex": 1, "explanation": "feel + -ing = feeling أي شعور (اسم).", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-276", "question": "AI has become a powerful tool in the field of education. The antonym of «powerful» is «...............».", "choices": ["customized", "clear", "weak", "strong"], "answer": "weak", "answerIndex": 2, "explanation": "powerful عكسها weak أي ضعيف.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-277", "question": "I watched an exciting movie. «...............» is the opposite of «exciting».", "choices": ["boring", "surprising", "interesting", "unexcited"], "answer": "boring", "answerIndex": 0, "explanation": "exciting عكسها boring أي مملّ.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-278", "question": "My teacher didn't ............... us use our mobile phones during the exam.", "choices": ["get", "let", "force", "allow"], "answer": "let", "answerIndex": 1, "explanation": "let + مفعول + مصدر بدون to: didn't let us use.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-279", "question": "Mr. Karim allowed us ............... the lab.", "choices": ["to entering", "entering", "to enter", "enter"], "answer": "to enter", "answerIndex": 2, "explanation": "allow + مفعول + to + مصدر: allowed us to enter.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-280", "question": "The robot cannot work without a set ............... instructions given by the programmer.", "choices": ["of", "off", "for", "with"], "answer": "of", "answerIndex": 0, "explanation": "الاصطلاح a set of instructions أي مجموعة من التعليمات.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-281", "question": "Because the robot was a machine, it wasn't
