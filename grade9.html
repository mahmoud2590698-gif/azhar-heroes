s://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-272", "question": "Deleting «e» and adding the suffix «-ity» turns the word «creative» into a/an ............... .", "choices": ["adverb", "verb", "adjective", "noun"], "answer": "noun", "answerIndex": 3, "explanation": "اللاحقة -ity تحوّل الصفة creative إلى الاسم creativity.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-273", "question": "I need an instant answer to my question. The suffix «-ly» changes the adjective «instant» into a/an ............... .", "choices": ["adjective", "adverb", "noun", "verb"], "answer": "adverb", "answerIndex": 1, "explanation": "اللاحقة -ly تحوّل الصفة instant إلى الحال instantly.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-274", "question": "It rained for two hours last night. Add the suffix «...............» to turn the word «rain» into an adjective.", "choices": ["-ment", "-ly", "-ing", "-y"], "answer": "-y", "answerIndex": 3, "explanation": "نضيف -y إلى rain فتصبح rainy أي ممطر.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-275", "question": "Ali feels proud of his progress in English. The suffix «...............» is added to «feel» to form its noun.", "choices": ["-ful", "-ing", "-ment", "-ed"], "answer": "-ing", "answerIndex": 1, "explanation": "feel + -ing = feeling أي شعور (اسم).", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-276", "question": "AI has become a powerful tool in the field of education. The antonym of «powerful» is «...............».", "choices": ["customized", "clear", "weak", "strong"], "answer": "weak", "answerIndex": 2, "explanation": "powerful عكسها weak أي ضعيف.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-277", "question": "I watched an exciting movie. «...............» is the opposite of «exciting».", "choices": ["boring", "surprising", "interesting", "unexcited"], "answer": "boring", "answerIndex": 0, "explanation": "exciting عكسها boring أي مملّ.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-278", "question": "My teacher didn't ............... us use our mobile phones during the exam.", "choices": ["get", "let", "force", "allow"], "answer": "let", "answerIndex": 1, "explanation": "let + مفعول + مصدر بدون to: didn't let us use.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-279", "question": "Mr. Karim allowed us ............... the lab.", "choices": ["to entering", "entering", "to enter", "enter"], "answer": "to enter", "answerIndex": 2, "explanation": "allow + مفعول + to + مصدر: allowed us to enter.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-280", "question": "The robot cannot work without a set ............... instructions given by the programmer.", "choices": ["of", "off", "for", "with"], "answer": "of", "answerIndex": 0, "explanation": "الاصطلاح a set of instructions أي مجموعة من التعليمات.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-281", "question": "Because the robot was a machine, it wasn't aware ............... how tired the children were.", "choices": ["with", "at", "of", "on"], "answer": "of", "answerIndex": 2, "explanation": "aware of أي مدرك وواعٍ بـ.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-282", "question": "According ............... the report, the weather will be cold tomorrow.", "choices": ["on", "to", "from", "of"], "answer": "to", "answerIndex": 1, "explanation": "according to أي وفقًا لـ.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-283", "question": "Instead ............... taking the bus, we decided to walk to school because the weather was nice.", "choices": ["up", "at", "of", "in"], "answer": "of", "answerIndex": 2, "explanation": "instead of أي بدلًا من، ويأتي بعدها فعل + ing.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-284", "question": "Artificial Intelligence and robots are not ............... . They are completely different.", "choices": ["similar", "different", "equal", "the same"], "answer": "the same", "answerIndex": 3, "explanation": "AI and robots are not the same أي ليسا الشيء نفسه؛ بل مختلفان تمامًا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/287655"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-285", "question": "We add the prefix «...............» to «abled» to form its opposite.", "choices": ["dis-", "in-", "un-", "mis-"], "answer": "dis-", "answerIndex": 0, "explanation": "البادئة dis- تعطي عكس abled فتصبح disabled.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/287655"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-286", "question": "Our essays will ............... (return) next week.", "choices": ["returned", "returning", "be returned", "return"], "answer": "be returned", "answerIndex": 2, "explanation": "المستقبل البسيط المبني للمجهول: will be + التصريف الثالث؛ المقالات تُعاد (تُرجَّع) الأسبوع المقبل.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-287", "question": "I expect that Ibrahim ............... (win) the match.", "choices": ["won", "will win", "is winning", "wins"], "answer": "will win", "answerIndex": 1, "explanation": "will + المصدر للتعبير عن توقّع وتنبّؤ في المستقبل.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-288", "question": "The English lesson will ............... (explain) tomorrow.", "choices": ["explained", "explaining", "explain", "be explained"], "answer": "be explained", "answerIndex": 3, "explanation": "الدرس سيُشرَح غدًا — مبني للمجهول في المستقبل: will be + التصريف الثالث.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-289", "question": "Will the mistake ............... (correct) soon?", "choices": ["correct", "correcting", "be corrected", "corrected"], "answer": "be corrected", "answerIndex": 2, "explanation": "سؤال في المستقبل المبني للمجهول: Will + الفاعل + be + التصريف الثالث.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-290", "question": "The final match ............... (will/play) at 6 p.m. next Friday.", "choices": ["is played", "plays", "will be played", "will play"], "answer": "will be played", "answerIndex": 2, "explanation": "المباراة ستُلعَب — مبني للمجهول في المستقبل.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-291", "question": "Driverless cars will ............... (use) everywhere.", "choices": ["be used", "using", "used", "use"], "answer": "be used", "answerIndex": 0, "explanation": "السيارات بلا سائق ستُستخدَم في كل مكان — will be + التصريف الثالث.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-292", "question": "The playground will be cleaned ............... (by/on) the volunteers.", "choices": ["with", "by", "for", "on"], "answer": "by", "answerIndex": 1, "explanation": "في المبني للمجهول نذكر الفاعل بعد by: cleaned by the volunteers.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-293", "question": "Robots will ............... (clean) the houses in the future.", "choices": ["cleaned", "clean", "cleaning", "cleans"], "answer": "clean", "answerIndex": 1, "explanation": "will + المصدر في المعلوم: Robots will clean the houses.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-294", "question": "Don't worry, I ............... you with your homework.", "choices": ["will help", "helped", "help", "am helping"], "answer": "will help", "answerIndex": 0, "explanation": "will للتعبير عن الوعد والعرض في لحظة الكلام: I will help you.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=tSSLPJFeWqs"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-295", "question": "When I ............... home, I will call you.", "choices": ["arriving", "will arrive", "arrive", "arrived"], "answer": "arrive", "answerIndex": 2, "explanation": "بعد when وأدوات الربط الزمنية نستخدم المضارع البسيط لا المستقبل: When I arrive home, I will call you.", "type": "mcq", "topic": "", "source": "https://www.youtube.com/watch?v=tSSLPJFeWqs"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-296", "question": "Robots and Artificial Intelligence are not the same. A robot is a ............... that can move and do tasks.", "choices": ["machine", "emotion", "program", "brain"], "answer": "machine", "answerIndex": 0, "explanation": "من نص القراءة: الروبوت آلة machine تتحرّك وتؤدّي مهام.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-297", "question": "AI is like the ............... of a robot. It helps robots make decisions and learn from actions.", "choices": ["battery", "hand", "eye", "brain"], "answer": "brain", "answerIndex": 3, "explanation": "من نص القراءة: الذكاء الاصطناعي مثل عقل brain الروبوت.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-298", "question": "Artificial Intelligence can now create art, music, and stories using advanced algorithms. It learns by studying human-made work and identifying ............... .", "choices": ["colors", "sounds", "mistakes", "patterns"], "answer": "patterns", "answerIndex": 3, "explanation": "من نص القراءة: يتعلّم الذكاء الاصطناعي بدراسة الأعمال البشرية وتحديد الأنماط patterns.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-299", "question": "In the future, many tasks will be done by AI and computers. Deliveries will be made by ............... .", "choices": ["humans", "mistakes", "rules", "drones"], "answer": "drones", "answerIndex": 3, "explanation": "من نص القراءة: في المستقبل ستُنجَز التوصيلات بواسطة الطائرات المسيّرة drones.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "اللغة الإنجليزية", "id": "h26-g9-300", "question": "One rainy morning, I walked into my classroom and saw something surprising. My teacher wasn't there. Instead, a robot stood at the front. My friends were ............... , but the robot explained everything clearly.", "choices": ["bored", "tired", "happy", "confused"], "answer": "confused", "answerIndex": 3, "explanation": "من نص القراءة: كان أصدقائي مرتبكين confused عندما وقف الروبوت أمام الصف.", "type": "mcq", "topic": "", "source": "https://www.motive2learn.com/2026/10/quiz-prep3-T1-U3-p1.html"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-301", "question": "ما المقصود بالسمعيات؟", "choices": ["الأمور التي يدركها العقل وحده دون حاجة إلى خبر", "أحكام العبادات العملية الظاهرة", "الأمور التي تدرك بالحواس والمشاهدة", "الأمور التي لا تؤخذ إلا بإخبار النبي ﷺ ولا يستقل العقل بإدراكها"], "answer": "الأمور التي لا تؤخذ إلا بإخبار النبي ﷺ ولا يستقل العقل بإدراكها", "answerIndex": 3, "explanation": "السمعيات هي الأمور التي لا تؤخذ إلا بإخبار النبي ﷺ، ولا يستقل العقل بإدراكها؛ لأنها لا تدرك بالحواس ولا بالمشاهدة، وإنما طريق ثبوتها الكتاب والسنة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-302", "question": "ما طريق ثبوت السمعيات؟", "choices": ["السنة فقط", "العقل والمشاهدة", "الكتاب فقط", "الكتاب والسنة معًا"], "answer": "الكتاب والسنة معًا", "answerIndex": 3, "explanation": "طريق ثبوت السمعيات الكتاب والسنة؛ لأنها أمور غيبية لا تدرك بالحواس ولا بالمشاهدة، ولا مجال للعقل في إدراكها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/279312"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-303", "question": "ما حكم الإيمان بالسمعيات كالحشر والحساب والميزان؟", "choices": ["مستحب", "واجب؛ لأنها ركن من أركان الإيمان", "جائز", "مكروه"], "answer": "واجب؛ لأنها ركن من أركان الإيمان", "answerIndex": 1, "explanation": "الإيمان بالسمعيات ـ كالحشر والحساب والميزان ـ واجب؛ لأنها ركن من أركان الإيمان، فجميع السمعيات جائزة عقلًا واجبة سمعًا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-304", "question": "ما حكم من أنكر شيئًا من السمعيات؟", "choices": ["مبتدع ضال لا يكفر", "فاسق فقط", "كافر؛ إذ يلزمه تكذيب الله ورسوله في خبريهما", "لا شيء عليه"], "answer": "كافر؛ إذ يلزمه تكذيب الله ورسوله في خبريهما", "answerIndex": 2, "explanation": "من أنكر شيئًا من السمعيات فهو كافر؛ إذ يلزمه تكذيب الله ورسوله في خبريهما.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-305", "question": "ما المراد بسؤال القبر؟", "choices": ["سؤال الملكين للميت في قبره عن ربه ودينه ونبيه", "سؤال الملائكة للمؤمنين عن صلاتهم", "سؤال الله للعباد يوم القيامة عن أعمالهم", "محاسبة الميت على ذنوبه في قبره"], "answer": "سؤال الملكين للميت في قبره عن ربه ودينه ونبيه", "answerIndex": 0, "explanation": "سؤال القبر هو سؤال الملكين للميت في قبره عن ربه ودينه ونبيه، سواء دفن الميت في قبر أم لم يدفن.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-306", "question": "ما اسما الملكين اللذين يسألان الميت في قبره؟", "choices": ["جبريل وميكائيل", "مالك ورضوان", "رقيب وعتيد", "منكر ونكير"], "answer": "منكر ونكير", "answerIndex": 3, "explanation": "بعد انصراف الناس من دفن الميت يأتيه ملكان، يقال لأحدهما منكر وللآخر نكير، فيقعدانه فيعيد الله الروح فيه، ويسألانه عن ربه ودينه ونبيه.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-307", "question": "ما الأسئلة التي يسألها الملكان للميت في قبره؟", "choices": ["ما عملك؟ وكم صليت؟ وكم صمت؟", "«من ربك؟ وما دينك؟ وما تقول في الرجل الذي بعث فيكم؟»", "من أبوك؟ وأين بيتك؟ وما مالك؟", "ما اسمك؟ وكم عمرك؟ وأين مت؟"], "answer": "«من ربك؟ وما دينك؟ وما تقول في الرجل الذي بعث فيكم؟»", "answerIndex": 1, "explanation": "يقول الملكان للميت: «من ربك؟ وما دينك؟ وما تقول في الرجل الذي بعث فيكم؟» فيقول المؤمن: ربي الله، وديني الإسلام، والرجل المبعوث فينا محمد ﷺ.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-308", "question": "بم يجيب المؤمن الملكين حين يسألانه في قبره؟", "choices": ["لا أدري، كنت أقول ما يقوله الناس", "ربي الله، وديني الإسلام، والرجل المبعوث فينا محمد ﷺ", "لا أجيب حتى أرى مقعدي", "ربي الملائكة وديني الصلاة"], "answer": "ربي الله، وديني الإسلام، والرجل المبعوث فينا محمد ﷺ", "answerIndex": 1, "explanation": "فيقول المؤمن: ربي الله، وديني الإسلام، والرجل المبعوث فينا محمد ﷺ، فيقولان له: انظر إلى مقعدك من النار قد أبدلك الله به مقعدًا في الجنة فيراهما جميعًا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-309", "question": "بم يجيب الكافر أو المنافق حين يسأله الملكان في قبره؟", "choices": ["ربي الله وديني الإسلام", "لا أذكر شيئًا من الدنيا", "لا أدري، كنت أقول ما يقوله الناس فيه", "أسلمت وجهي لله"], "answer": "لا أدري، كنت أقول ما يقوله الناس فيه", "answerIndex": 2, "explanation": "أما الكافر أو المنافق فيقول: لا أدري، كنت أقول ما يقوله الناس فيه، فيقولان له: لا دريت ولا تليت، ثم يصيبه من العذاب ما قدر له.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-310", "question": "ما الدليل من القرآن على سؤال القبر؟", "choices": ["﴿وَمِن وَرَائِهِم بَرْزَخٌ إِلَىٰ يَوْمِ يُبْعَثُونَ﴾", "﴿يُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ﴾", "﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ﴾", "﴿النَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا﴾"], "answer": "﴿يُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ﴾", "answerIndex": 1, "explanation": "دليل سؤال القبر من القرآن قوله تعالى: ﴿يُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ﴾ [إبراهيم: 27]، قال ابن عباس: الشهادة يسألون عنها في قبورهم بعد موتهم.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/14:27/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-311", "question": "ما حكم الإيمان بسؤال القبر؟", "choices": ["واجب، وإنكاره كفر", "جائز تركه", "واجب، وإنكاره بدعة وضلالة", "مستحب فقط"], "answer": "واجب، وإنكاره بدعة وضلالة", "answerIndex": 2, "explanation": "الإيمان بسؤال القبر واجب، وإنكاره بدعة وضلالة؛ لأنه ثابت بالكتاب والسنة، وهو أمر جائز عقلًا، وأجمع عليه أهل العلم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/279312"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-312", "question": "ما حكم من أنكر سؤال القبر؟", "choices": ["لا حكم عليه", "مبتدع ضال، ولا يكفر على الراجح ما دام يؤمن بالجزاء الأخروي", "فاسق لا تقبل شهادته", "كافر بإجماع العلماء"], "answer": "مبتدع ضال، ولا يكفر على الراجح ما دام يؤمن بالجزاء الأخروي", "answerIndex": 1, "explanation": "لا يكفر منكر سؤال القبر على الراجح، ما دام المنكر يؤمن بالجزاء الأخروي؛ وحكمه أنه مبتدع ضال.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/279312"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-313", "question": "لماذا سمي سؤال الملكين بسؤال القبر؟", "choices": ["لأن القبر أول منازل الآخرة", "لأن الغالب في الموتى أن يدفنوا في القبور", "لأن السؤال لا يكون إلا في القبر فقط", "لأن الملكين يسكنان القبور"], "answer": "لأن الغالب في الموتى أن يدفنوا في القبور", "answerIndex": 1, "explanation": "سؤال القبر هو سؤال الملكين للميت في قبره، وسواء دفن الميت في قبر أم لم يدفن، كأن أكلته السباع أو الأسماك أو أحرقته النار، ولكنهم أطلقوا عليه سؤال القبر؛ لأن الغالب في الموتى أن يدفنوا في القبور.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-314", "question": "هل يسأل من غرق أو أحرق أو أكله سبع كما يسأل من دفن في قبره؟", "choices": ["نعم، يسأل بكيفية يعلمها الله تعالى", "لا يسأل إلا المؤمن المدفون", "يسأل سؤالًا واحدًا فقط", "لا، السؤال خاص بمن دفن فقط"], "answer": "نعم، يسأل بكيفية يعلمها الله تعالى", "answerIndex": 0, "explanation": "يسأل من غرق أو أحرق أو أكله سبع بكيفية يعلمها الله تعالى؛ فالسؤال عام لكل ميت سواء دفن أم لم يدفن.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-315", "question": "ما نعيم القبر وعذابه؟", "choices": ["ما يتعرض له العبد في قبره قبل البعث من النعيم أو العذاب على حسب حاله من الإيمان والكفر والطاعة والمعصية", "نعيم المؤمنين في الجنة بعد الحساب", "عذاب الكافرين في النار يوم القيامة", "ما يجده الميت من راحة بعد الموت مباشرة"], "answer": "ما يتعرض له العبد في قبره قبل البعث من النعيم أو العذاب على حسب حاله من الإيمان والكفر والطاعة والمعصية", "answerIndex": 0, "explanation": "نعيم القبر وعذابه هو ما يتعرض له العبد في قبره قبل البعث من النعيم أو العذاب، على حسب حاله من الإيمان والكفر، والطاعة والمعصية.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-316", "question": "ما حكم الإيمان بنعيم القبر وعذابه؟", "choices": ["واجب على المؤمن فقط دون الكافر", "واجب، وإنكارهما بدعة وضلالة وليس بالكفر", "مستحب", "واجب، وإنكارهما كفر"], "answer": "واجب، وإنكارهما بدعة وضلالة وليس بالكفر", "answerIndex": 1, "explanation": "نعيم القبر وعذابه من الأمور الثابتة بالقرآن والسنة، وأجمع على وقوعهما السلف قبل ظهور البدع، فالإيمان بهما واجب، وإنكارهما بدعة وضلالة، وليس بالكفر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/279312"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-317", "question": "ما الدليل من القرآن على عذاب القبر؟", "choices": ["﴿فَمَن ثَقُلَتْ مَوَازِينُهُ فَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ﴾", "﴿النَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا﴾ في حق آل فرعون", "﴿يَوْمَ يَفِرُّ الْمَرْءُ مِنْ أَخِيهِ﴾", "﴿وَمِن وَرَائِهِم بَرْزَخٌ إِلَىٰ يَوْمِ يُبْعَثُونَ﴾"], "answer": "﴿النَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا﴾ في حق آل فرعون", "answerIndex": 1, "explanation": "قال تعالى في حق آل فرعون: ﴿النَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا﴾ [غافر: 46]، فالآية تثبت أنهم يعرضون على النار صباحًا ومساءً، وهذا العرض في القبر؛ لأن ختام الآية يثبت أنهم يدخلون النار يوم القيامة، كما أن يوم القيامة لا غدو فيه ولا عشي.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/40:46/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-318", "question": "ما الدليل من القرآن على نعيم القبر؟", "choices": ["﴿وَلَا تَحْسَبَنَّ الَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ أَمْوَاتًا بَلْ أَحْيَاءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ﴾", "﴿النَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا﴾", "﴿فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا﴾", "﴿وَالْوَزْنُ يَوْمَئِذٍ الْحَقُّ﴾"], "answer": "﴿وَلَا تَحْسَبَنَّ الَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ أَمْوَاتًا بَلْ أَحْيَاءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ﴾", "answerIndex": 0, "explanation": "دليل نعيم القبر من القرآن قوله تعالى في حق الشهداء: ﴿وَلَا تَحْسَبَنَّ الَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ أَمْوَاتًا بَلْ أَحْيَاءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ﴾ [آل عمران: 169].", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/3:169/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-319", "question": "من المنعم والمعذب في القبر عند أهل السنة؟", "choices": ["الجسد والروح جميعًا", "الجسد دون الروح", "الروح فقط", "لا جسد ولا روح"], "answer": "الجسد والروح جميعًا", "answerIndex": 0, "explanation": "المنعم والمعذب عند أهل السنة الجسد والروح جميعًا، ولأهل القبور حياة يدركون بها أثر النعيم والعذاب ولو تفتتت أجسادهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-320", "question": "كيف حال الميت في نعيم القبر وعذابه؟", "choices": ["لا يشعر بشيء حتى البعث", "يشعر به أهله كما يشعر هو", "كحال النائم يشعر باللذة أو الألم، ولا يشعر من ينام بجواره بشيء", "كحال اليقظان يرى كل شيء حوله"], "answer": "كحال النائم يشعر باللذة أو الألم، ولا يشعر من ينام بجواره بشيء", "answerIndex": 2, "explanation": "حال الميت في نعيم القبر وعذابه كحال النائم يشعر باللذة أو الألم، ولا يشعر من ينام بجواره بشيء من ذلك، وكيفية تنعيمهم أو تعذيبهم أمر غيبي لا تعرف حقيقته.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-321", "question": "ما حياة البرزخ؟", "choices": ["حياة الجنة بعد الحساب", "حياة الشهداء فقط", "حياة القبر بين حياة الدنيا وحياة الآخرة", "حياة الدنيا قبل الموت"], "answer": "حياة القبر بين حياة الدنيا وحياة الآخرة", "answerIndex": 2, "explanation": "هذه الحياة تسمى حياة البرزخ، قال تعالى: ﴿وَمِن وَرَائِهِم بَرْزَخٌ إِلَىٰ يَوْمِ يُبْعَثُونَ﴾ [المؤمنون: 100]، أي هي بين حياة الدنيا وحياة الآخرة، وهي حياة القبر.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/23:100/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-322", "question": "في حديث القبرين، ما الذنبان اللذان كان صاحبا القبرين يعذبان بسببهما؟", "choices": ["الغيبة وأكل الربا", "المشي بالنميمة وعدم الاستبراء من البول", "السرقة والكذب", "ترك الصلاة والصيام"], "answer": "المشي بالنميمة وعدم الاستبراء من البول", "answerIndex": 1, "explanation": "مر النبي ﷺ بقبرين فقال: «إنهما ليعذبان، وما يعذبان في كبير». ثم قال: بلى إنه كبير، «أما أحدهما فكان يمشي بالنميمة، وأما الآخر فكان لا يستبرئ من بوله».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-323", "question": "ما البعث والنشر؟", "choices": ["جمع الناس في مكان واحد للحساب", "وزن أعمال العباد يوم القيامة", "عبور الناس على جسر جهنم", "إحياء الله الموتى وإخراجهم بعد جمع أجزائهم الأصلية من قبورهم يوم القيامة بعد فناء الدنيا"], "answer": "إحياء الله الموتى وإخراجهم بعد جمع أجزائهم الأصلية من قبورهم يوم القيامة بعد فناء الدنيا", "answerIndex": 3, "explanation": "البعث والنشر هو إحياء الله الموتى، وإخراجهم بعد جمع أجزائهم الأصلية من قبورهم يوم القيامة بعد فناء الدنيا، ويكون ذلك برد الله أرواح العباد إلى أجسامهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-324", "question": "ما حكم الإيمان بالبعث والنشر؟", "choices": ["جائز", "واجب، بل هو ركن من أركان الإيمان، وإنكاره كفر", "مستحب", "واجب، وإنكاره بدعة فقط"], "answer": "واجب، بل هو ركن من أركان الإيمان، وإنكاره كفر", "answerIndex": 1, "explanation": "الإيمان بالبعث والنشر واجب، بل هو ركن من أركان الإيمان، وإنكاره كفر؛ لأنه من الأمور الثابتة بالقرآن والسنة، وقد أجمعت عليه الشرائع كلها، وهو من الأمور الجائزة عقلًا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-325", "question": "ما الدليل العقلي على وقوع البعث؟", "choices": ["أن الروح تفنى مع الجسد", "أن الناس يموتون جميعًا في وقت واحد", "الذي خلق الناس أول مرة من العدم قادر على إعادتهم، بل الإعادة أسهل", "أن القبور تبقى كما هي"], "answer": "الذي خلق الناس أول مرة من العدم قادر على إعادتهم، بل الإعادة أسهل", "answerIndex": 2, "explanation": "ثبت بالأدلة اليقينية أن الله خلق الناس بقدرته من العدم، وإذا ماتوا وأراد الله أن يعيدهم بعد الموت فلا مانع من ذلك عقلًا، فإن الذي خلقهم أول مرة من العدم قادر على إعادتهم بعد موتهم، بل الإعادة أسهل، فإن من صنع شيئًا يستطيع أن يعيد صناعته مرة ثانية بسهولة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-326", "question": "قال تعالى: ﴿وَهُوَ الَّذِي يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ وَهُوَ أَهْوَنُ عَلَيْهِ﴾، ما الذي تدل عليه الآية؟", "choices": ["قدرة الله على إعادة الخلق بعد الموت", "أن الموت نهاية كل شيء", "أن الدنيا باقية لا تفنى", "أن الخلق لا يفنى أبدًا"], "answer": "قدرة الله على إعادة الخلق بعد الموت", "answerIndex": 0, "explanation": "قال تعالى: ﴿وَهُوَ الَّذِي يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ وَهُوَ أَهْوَنُ عَلَيْهِ﴾ [الروم: 27]، فالذي بدأ الخلق من العدم قادر على إعادته بعد الموت، بل الإعادة أهون عليه.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/30:27/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-327", "question": "من الذي جاء النبي ﷺ بعظم قد رم ثم فته بيده سائلًا: أترى أن الله يبعث هذا بعدما رم؟", "choices": ["عتبة بن ربيعة", "الوليد بن المغيرة", "أبي بن خلف", "أبو جهل"], "answer": "أبي بن خلف", "answerIndex": 2, "explanation": "روي أن أبي بن خلف جاء النبي ﷺ بعظم قد رم ثم فته بيده، وقال يا محمد: أترى أن الله يبعث هذا بعدما رم؟ فقال ﷺ: «نعم ويبعثك ويدخلك النار».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-328", "question": "بم أجاب الله تعالى من قال: ﴿مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ﴾؟", "choices": ["﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾", "﴿قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ﴾", "﴿إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ﴾", "﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾"], "answer": "﴿قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ﴾", "answerIndex": 1, "explanation": "قال تعالى: ﴿وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ قَالَ مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ﴾ [يس: 78] ﴿قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ﴾ [يس: 79]، فالذي أنشأ العظام أول مرة قادر على إحيائها بعدما رمت.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/36:79/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-329", "question": "ما الحشر؟", "choices": ["عرض الأعمال على أصحابها", "سوق الله العباد بعد بعثهم إلى موقف الحساب الذي يجتمع فيه الخلائق", "إحياء الموتى وإخراجهم من قبورهم", "وزن الأعمال يوم القيامة"], "answer": "سوق الله العباد بعد بعثهم إلى موقف الحساب الذي يجتمع فيه الخلائق", "answerIndex": 1, "explanation": "الحشر معناه سوق الله العباد بعد بعثهم إلى موقف الحساب الذي يجتمع فيه الخلائق، وفيه يحاسبون وتوزن أعمالهم ويعرف كل مصيره.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-330", "question": "ما الفرق بين النشر والحشر؟", "choices": ["النشر قبل الموت والحشر بعده", "النشر للمؤمنين والحشر للكافرين", "لا فرق بينهما", "النشر إخراج الموتى من قبورهم، والحشر سوقهم بعد بعثهم إلى موقف الحساب"], "answer": "النشر إخراج الموتى من قبورهم، والحشر سوقهم بعد بعثهم إلى موقف الحساب", "answerIndex": 3, "explanation": "البعث والنشر هو إحياء الله الموتى وإخراجهم من قبورهم، والحشر هو سوق الله العباد بعد بعثهم إلى موقف الحساب؛ فالنشر سابق على الحشر.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-331", "question": "ما حكم الإيمان بالحشر؟", "choices": ["واجب، وإنكاره كفر؛ لإنكار معلوم من الدين بالضرورة", "مستحب", "واجب، وإنكاره بدعة فقط", "جائز"], "answer": "واجب، وإنكاره كفر؛ لإنكار معلوم من الدين بالضرورة", "answerIndex": 0, "explanation": "الإيمان بالحشر واجب، وإنكاره كفر؛ لإنكار معلوم من الدين بالضرورة، حيث وردت به نصوص شرعية كثيرة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-332", "question": "كيف يكون حال المتقين في الحشر؟", "choices": ["مشاة على أرجلهم", "مسحوبين على وجوههم", "عميًا لا يبصرون", "ركبانًا"], "answer": "ركبانًا", "answerIndex": 3, "explanation": "أحوال الناس في الحشر مختلفة، فمنهم الراكب وهم المتقون، ومنهم الماشي على رجليه وهم أصحاب الطاعات القليلة، ومنهم المسحوب على وجهه وهم الكفار، ومنهم الأعمى وهو الجائر في الحكم، ومنهم الأصم والأبكم وهو المعجب بعمله.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-333", "question": "قال تعالى: ﴿وَحَشَرْنَاهُمْ فَلَمْ نُغَادِرْ مِنْهُمْ أَحَدًا﴾، ما الذي تدل عليه الآية؟", "choices": ["أن الجبال تسير يوم القيامة فقط", "أن المؤمنين يدخلون الجنة بغير حساب", "أن الله يحشر جميع الخلائق يوم القيامة ولا يترك منهم أحدًا", "أن الأرض تتشقق عن الموتى"], "answer": "أن الله يحشر جميع الخلائق يوم القيامة ولا يترك منهم أحدًا", "answerIndex": 2, "explanation": "قال تعالى: ﴿وَيَوْمَ نُسَيِّرُ الْجِبَالَ وَتَرَى الْأَرْضَ بَارِزَةً وَحَشَرْنَاهُمْ فَلَمْ نُغَادِرْ مِنْهُمْ أَحَدًا﴾ [الكهف: 47]، فالحشر عام لجميع الخلائق لا يغادر منهم أحدًا.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/18:47/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-334", "question": "من أول من تنشق عنه الأرض ويبعث يوم القيامة؟", "choices": ["سيدنا محمد ﷺ", "سيدنا عيسى عليه السلام", "سيدنا موسى عليه السلام", "سيدنا إبراهيم عليه السلام"], "answer": "سيدنا محمد ﷺ", "answerIndex": 0, "explanation": "أول من تنشق عنه الأرض ويبعث سيدنا محمد ﷺ، كما أنه أول من يرد المحشر، وأول من يدخل الجنة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-335", "question": "ما الميزان يوم القيامة؟", "choices": ["آلة يوزن بها العباد، أو أعمالهم، أو صحائف أعمالهم", "جسر يعبر عليه الخلق", "كتاب تسجل فيه الأعمال", "مكان يجتمع فيه الناس للحساب"], "answer": "آلة يوزن بها العباد، أو أعمالهم، أو صحائف أعمالهم", "answerIndex": 0, "explanation": "الميزان آلة يوزن بها العباد، أو أعمالهم، أو صحائف أعمالهم، والميزان واحد لكل الأعمال ولجميع الأمم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-336", "question": "لمن يكون الوزن يوم القيامة؟", "choices": ["للمؤمن والكافر، ولا يكون للأنبياء والملائكة ومن يدخل الجنة بغير حساب", "لجميع الخلق بلا استثناء", "للمؤمنين فقط", "للأنبياء والملائكة فقط"], "answer": "للمؤمن والكافر، ولا يكون للأنبياء والملائكة ومن يدخل الجنة بغير حساب", "answerIndex": 0, "explanation": "الميزان واحد لكل الأعمال ولجميع الأمم، والوزن يكون للمؤمن والكافر، ولا يكون للأنبياء والملائكة ومن يدخل الجنة بغير حساب.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-337", "question": "ما الذي يجب الإيمان به في الميزان؟", "choices": ["تفصيلات الميزان كلها", "أن هناك وزنًا وميزانًا، ومنكر ذلك كافر بإجماع العلماء", "أن الوزن للأنبياء خاصة", "أن الميزان له كفتان فقط"], "answer": "أن هناك وزنًا وميزانًا، ومنكر ذلك كافر بإجماع العلماء", "answerIndex": 1, "explanation": "الذي يجب على العبد أن يؤمن به بالنسبة للميزان هو أن هناك وزنًا وميزانًا، ومنكر ذلك كافر بإجماع العلماء، أما ما سوى ذلك من تفصيلات، فلا يجب على العبد الإيمان به، ولا يعد إنكاره كفرًا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-338", "question": "قال تعالى: ﴿وَنَضَعُ الْمَوَازِينَ الْقِسْطَ لِيَوْمِ الْقِيَامَةِ فَلَا تُظْلَمُ نَفْسٌ شَيْئًا﴾، ما الذي تدل عليه الآية؟", "choices": ["أن الموازين كثيرة بعدد الأمم", "عدل الله في وزن الأعمال يوم القيامة فلا تظلم نفس شيئًا", "أن الكافر لا يوزن عمله", "أن الوزن يكون قبل البعث"], "answer": "عدل الله في وزن الأعمال يوم القيامة فلا تظلم نفس شيئًا", "answerIndex": 1, "explanation": "قال تعالى: ﴿وَنَضَعُ الْمَوَازِينَ الْقِسْطَ لِيَوْمِ الْقِيَامَةِ فَلَا تُظْلَمُ نَفْسٌ شَيْئًا﴾ [الأنبياء: 47]، فبالوزن يظهر العدل في العذاب والعفو عن الذنوب والآثام.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/21:47/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-339", "question": "ما الحساب يوم القيامة؟", "choices": ["اطلاع الله الناس قبل انصرافهم من أرض المحشر على أعمالهم وما قدموه في الدنيا بعد أخذ كتبهم", "سوق العباد إلى موقف الحساب", "سؤال الملكين في القبر", "وزن الأعمال في الميزان"], "answer": "اطلاع الله الناس قبل انصرافهم من أرض المحشر على أعمالهم وما قدموه في الدنيا بعد أخذ كتبهم", "answerIndex": 0, "explanation": "الحساب معناه اطلاع الله الناس قبل انصرافهم من أرض المحشر على أعمالهم وما قدموه في الدنيا من تصرفات فعلية أو قولية أو اعتقادية، خيرًا كانت أو شرًا، بطريقة لا يعلمها إلا الله، بعد أخذ كتبهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-340", "question": "كم صنفًا الناس في الحساب؟", "choices": ["ثلاثة أصناف: من يدخل الجنة بغير حساب، ومن يدخل النار بغير حساب، ومن يوقف للحساب", "أربعة أصناف", "صنف واحد", "صنفان فقط"], "answer": "ثلاثة أصناف: من يدخل الجنة بغير حساب، ومن يدخل النار بغير حساب، ومن يوقف للحساب", "answerIndex": 0, "explanation": "الناس في الحساب على ثلاثة أصناف: منهم من يدخل الجنة بغير حساب ولا يسألون عن أعمالهم، وطائفة تدخل النار بغير حساب لاشتداد غضب الله عليهم، وطائفة توقف للحساب فيحاسبهم الله على أعمالهم الحسنة والسيئة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-341", "question": "قال ﷺ: «يدخل الجنة من أمتي سبعون ألفًا بغير حساب»، من هؤلاء؟", "choices": ["منهم الصابرون والشهداء", "من مات صغيرًا فقط", "أهل بدر خاصة", "الأنبياء والملائكة"], "answer": "منهم الصابرون والشهداء", "answerIndex": 0, "explanation": "قال ﷺ: «يدخل الجنة من أمتي سبعون ألفًا بغير حساب»، منهم الصابرون والشهداء، وهؤلاء لا يسألون عن أعمالهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-342", "question": "ما جزاء من أوتي كتابه بيمينه يوم القيامة؟", "choices": ["يرد إلى الدنيا", "يوقف للحساب العسير", "يدخل النار بغير حساب", "يحاسب حسابًا يسيرًا وينقلب إلى أهله مسرورًا"], "answer": "يحاسب حسابًا يسيرًا وينقلب إلى أهله مسرورًا", "answerIndex": 3, "explanation": "قال تعالى: ﴿فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ﴾ [الانشقاق: 7] ﴿فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا﴾ [الانشقاق: 8] ﴿وَيَنقَلِبُ إِلَىٰ أَهْلِهِ مَسْرُورًا﴾ [الانشقاق: 9]، فمن أوتي كتابه بيمينه كان حسابه يسيرًا.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/84:8/quran-simple"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-343", "question": "ما الصراط؟", "choices": ["باب من أبواب الجنة", "نهر في الجنة", "طريق الجنة في الدنيا", "جسر ممدود على ظهر جهنم، يعبر عليه جميع الخلائق من المؤمنين وغيرهم"], "answer": "جسر ممدود على ظهر جهنم، يعبر عليه جميع الخلائق من المؤمنين وغيرهم", "answerIndex": 3, "explanation": "الصراط هو جسر ممدود على ظهر جهنم، يعبر عليه جميع الخلائق من المؤمنين وغيرهم، والإيمان به واجب شرعًا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-344", "question": "ما موقف كثير من المعتزلة من الصراط؟", "choices": ["يقولون إن الصراط في الدنيا فقط", "ينكرون الحساب أيضًا", "يؤمنون به جسرًا حقيقيًا كأهل السنة", "يصرفون الأدلة عن ظاهرها ويقولون المراد بها الأدلة الواضحة وليس جسرًا حقيقيًا"], "answer": "يصرفون الأدلة عن ظاهرها ويقولون المراد بها الأدلة الواضحة وليس جسرًا حقيقيًا", "answerIndex": 3, "explanation": "يعتقد أهل السنة أن الأدلة الواردة على الصراط من القرآن والسنة على ظاهرها وحقيقتها، وكثير من المعتزلة يصرفها عن ظاهرها ويقول: المراد بها الأدلة الواضحة وليس جسرًا حقيقيًا، أو هو طريق الجنة والنار دون تفاصيل.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-345", "question": "كيف يمر الناس على الصراط؟", "choices": ["يمر المؤمن ماشيًا والكافر راكبًا", "لا يمر عليه إلا الأنبياء", "يمرون جميعًا بنفس السرعة", "منهم من يمر مثل البرق، ومنهم من يمر مثل الريح، ومنهم من يسعى سعيًا، ومنهم من يحبو حبوًا، ومنهم من يزحف زحفًا"], "answer": "منهم من يمر مثل البرق، ومنهم من يمر مثل الريح، ومنهم من يسعى سعيًا، ومنهم من يحبو حبوًا، ومنهم من يزحف زحفًا", "answerIndex": 3, "explanation": "قال رسول الله ﷺ: «يمر الناس على جسر جهنم»، وعليه حسك تخطف الناس يمينًا وشمالًا، وبجنبتيه ملائكة يقولون: «اللهم سلم سلم»، فمن الناس من يمر مثل البرق، ومنهم من يمر مثل الريح، ومنهم من يسعى سعيًا، ومنهم من يحبو حبوًا، ومنهم من يزحف زحفًا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-346", "question": "ما الثواب؟", "choices": ["دعاء الملائكة للمؤمنين", "ما أعده الله للعصاة من العذاب في النار", "أجر العمل في الدنيا فقط", "ما أعده الله لعباده الطائعين من النعيم المقيم في الجنة تفضلًا منه سبحانه"], "answer": "ما أعده الله لعباده الطائعين من النعيم المقيم في الجنة تفضلًا منه سبحانه", "answerIndex": 3, "explanation": "الثواب هو ما أعده الله لعباده الطائعين من النعيم المقيم في الجنة تفضلًا منه سبحانه، ويدخل في الثواب السعادة والسرور الذي يفيضه الله على المطيع.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-347", "question": "ما العقاب؟", "choices": ["حرمان العاصي من رزقه في الدنيا", "ما أعده الله للعصاة والكفار من العذاب في النار عدلًا منه سبحانه", "مرض يصيب العاصي", "تأخير الثواب إلى يوم القيامة"], "answer": "ما أعده الله للعصاة والكفار من العذاب في النار عدلًا منه سبحانه", "answerIndex": 1, "explanation": "العقاب هو ما أعده الله للعصاة والكفار من العذاب في النار عدلًا منه سبحانه، ويدخل في العقاب الهم والحزن الذي يصيب العصاة والكفار.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التوحيد", "id": "h26-g9-348", "question": "قال تعالى: ﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ﴾، ما الذي تدل عليه الآية؟", "choices": ["أن الذرة لا توزن", "أن كل عمل خيرًا كان أو شرًا يجد صاحبه جزاءه يوم القيامة", "أن الخير فقط يجزى به", "أن الشر يغفر دائمًا"], "answer": "أن كل عمل خيرًا كان أو شرًا يجد صاحبه جزاءه يوم القيامة", "answerIndex": 1, "explanation": "قال تعالى: ﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ﴾ [الزلزلة: 7] ﴿وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ﴾ [الزلزلة: 8]، فالثواب رحمة من الله وفضل، والعقاب عدل منه سبحانه، ولولا الثواب والعقاب لم يكن فرق في الآخرة var seedState=null;
function RND(){if(seedState===null)return Math.random();seedState|=0;seedState=seedState+0x6D2B79F5|0;var t=Math.imul(seedState^seedState>>>15,1|seedState);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

var HINDI=true;
function ar(s){s=String(s);return HINDI?s.replace(/[0-9]/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]}):s.replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)})}
function ri(a,b){return a+Math.floor(RND()*(b-a+1))}
function pick(a){return a[Math.floor(RND()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(RND()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function nearNums(ans,n){var s={};s[ans]=1;var out=[],tries=0,sp=Math.max(3,Math.round(Math.abs(ans)*0.3));
 while(out.length<n&&tries++<300){var v=ans+ri(-sp,sp);if(v>0&&!s[v]){s[v]=1;out.push(v)}if(tries>60)sp+=2}
 return out}

, "054036": {"a": 36, "text": "وَلَقَدْ أَنذَرَهُم بَطْشَتَنَا فَتَمَارَوْا۟ بِٱلنُّذُرِ"}, "066002": {"a": 2, "text": "قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْ ۚ وَٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ"}, "051026": {"a": 26, "text": "فَرَاغَ إِلَىٰٓ أَهْلِهِۦ فَجَآءَ بِعِجْلٍۢ سَمِينٍۢ"}, "055010": {"a": 10, "text": "وَٱلْأَرْضَ وَضَعَهَا لِلْأَنَامِ"}, "071006": {"a": 6, "text": "فَلَمْ يَزِدْهُمْ دُعَآءِىٓ إِلَّا فِرَارًۭا"}, "054010": {"a": 10, "text": "فَدَعَا رَبَّهُۥٓ أَنِّى مَغْلُوبٌۭ فَٱنتَصِرْ"}, "057001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ"}, "076023": {"a": 23, "text": "إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ ٱلْقُرْءَانَ تَنزِيلًۭا"}, "056091": {"a": 91, "text": "فَسَلَٰمٌۭ لَّكَ مِنْ أَصْحَٰبِ ٱلْيَمِينِ"}, "050004": {"a": 4, "text": "قَدْ عَلِمْنَا مَا تَنقُصُ ٱلْأَرْضُ مِنْهُمْ ۖ وَعِندَنَا كِتَٰبٌ حَفِيظٌۢ"}, "052015": {"a": 15, "text": "أَفَسِحْرٌ هَٰذَآ أَمْ أَنتُمْ لَا تُبْصِرُونَ"}, "082018": {"a": 18, "text": "ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ"}, "070038": {"a": 38, "text": "أَيَطْمَعُ كُلُّ ٱمْرِئٍۢ مِّنْهُمْ أَن يُدْخَلَ جَنَّةَ نَعِيمٍۢ"}, "079027": {"a": 27, "text": "ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا"}, "052016": {"a": 16, "text": "ٱصْلَوْهَا فَٱصْبِرُوٓا۟ أَوْ لَا تَصْبِرُوا۟ سَوَآءٌ عَلَيْكُمْ ۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ"}, "105001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ ٱلْفِيلِ"}, "052024": {"a": 24, "text": "۞ وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌۭ لَّهُمْ كَأَنَّهُمْ لُؤْلُؤٌۭ مَّكْنُونٌۭ"}, "069013": {"a": 13, "text": "فَإِذَا نُفِخَ فِى ٱلصُّورِ نَفْخَةٌۭ وَٰحِدَةٌۭ"}, "067005": {"a": 5, "text": "وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ"}, "054009": {"a": 9, "text": "۞ كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ فَكَذَّبُوا۟ عَبْدَنَا وَقَالُوا۟ مَجْنُونٌۭ وَٱزْدُجِرَ"}, "072027": {"a": 27, "text": "إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا"}, "051031": {"a": 31, "text": "۞ قَالَ فَمَا خَطْبُكُمْ أَيُّهَا ٱلْمُرْسَلُونَ"}, "055015": {"a": 15, "text": "وَخَلَقَ ٱلْجَآنَّ مِن مَّارِجٍۢ مِّن نَّارٍۢ"}, "085007": {"a": 7, "text": "وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌۭ"}, "047001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ أَضَلَّ أَعْمَٰلَهُمْ"}, "078036": {"a": 36, "text": "جَزَآءًۭ مِّن رَّبِّكَ عَطَآءً حِسَابًۭا"}, "056045": {"a": 45, "text": "إِنَّهُمْ كَانُوا۟ قَبْلَ ذَٰلِكَ مُتْرَفِينَ"}, "050012": {"a": 12, "text": "كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ وَأَصْحَٰبُ ٱلرَّسِّ وَثَمُودُ"}, "071017": {"a": 17, "text": "وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلْأَرْضِ نَبَاتًۭا"}, "091013": {"a": 13, "text": "فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا"}, "079040": {"a": 40, "text": "وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ"}, "053038": {"a": 38, "text": "أَلَّا تَزِرُ وَازِرَةٌۭ وِزْرَ أُخْرَىٰ"}, "050015": {"a": 15, "text": "أَفَعَيِينَا بِٱلْخَلْقِ ٱلْأَوَّلِ ۚ بَلْ هُمْ فِى لَبْسٍۢ مِّنْ خَلْقٍۢ جَدِيدٍۢ"}, "049018": {"a": 18, "text": "إِنَّ ٱللَّهَ يَعْلَمُ غَيْبَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَٱللَّهُ بَصِيرٌۢ بِمَا تَعْمَلُونَ"}, "052012": {"a": 12, "text": "ٱلَّذِينَ هُمْ فِى خَوْضٍۢ يَلْعَبُونَ"}, "075005": {"a": 5, "text": "بَلْ يُرِيدُ ٱلْإِنسَٰنُ لِيَفْجُرَ أَمَامَهُۥ"}, "067003": {"a": 3, "text": "ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا ۖ مَّا تَرَىٰ فِى خَلْقِ ٱلرَّحْمَٰنِ مِن تَفَٰوُتٍۢ ۖ فَٱرْجِعِ ٱلْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍۢ"}, "056060": {"a": 60, "text": "نَحْنُ قَدَّرْنَا بَيْنَكُمُ ٱلْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ"}, "091014": {"a": 14, "text": "فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا"}, "055074": {"a": 74, "text": "لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ"}, "073005": {"a": 5, "text": "إِنَّا سَنُلْقِى عَلَيْكَ قَوْلًۭا ثَقِيلًا"}, "050029": {"a": 29, "text": "مَا يُبَدَّلُ ٱلْقَوْلُ لَدَىَّ وَمَآ أَنَا۠ بِظَلَّٰمٍۢ لِّلْعَبِيدِ"}, "051053": {"a": 53, "text": "أَتَوَاصَوْا۟ بِهِۦ ۚ بَلْ هُمْ قَوْمٌۭ طَاغُونَ"}, "070014": {"a": 14, "text": "وَمَن فِى ٱلْأَرْضِ جَمِيعًۭا ثُمَّ يُنجِيهِ"}, "077048": {"a": 48, "text": "وَإِذَا قِيلَ لَهُمُ ٱرْكَعُوا۟ لَا يَرْكَعُونَ"}, "083014": {"a": 14, "text": "كَلَّا ۖ بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ"}, "047002": {"a": 2, "text": "وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَءَامَنُوا۟ بِمَا نُزِّلَ عَلَىٰ مُحَمَّدٍۢ وَهُوَ ٱلْحَقُّ مِن رَّبِّهِمْ ۙ كَفَّرَ عَنْهُمْ سَيِّـَٔاتِهِمْ وَأَصْلَحَ بَالَهُمْ"}, "055024": {"a": 24, "text": "وَلَهُ ٱلْجَوَارِ ٱلْمُنشَـَٔاتُ فِى ٱلْبَحْرِ كَٱلْأَعْلَٰمِ"}, "089008": {"a": 8, "text": "ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ"}, "048007": {"a": 7, "text": "وَلِلَّهِ جُنُودُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا"}, "061010": {"a": 10, "text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ هَلْ أَدُلُّكُمْ عَلَىٰ تِجَٰرَةٍۢ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍۢ"}, "050026": {"a": 26, "text": "ٱلَّذِى جَعَلَ مَعَ ٱللَّهِ إِلَٰهًا ءَاخَرَ فَأَلْقِيَاهُ فِى ٱلْعَذَابِ ٱلشَّدِيدِ"}, "054011": {"a": 11, "text": "فَفَتَحْنَآ أَبْوَٰبَ ٱلسَّمَآءِ بِمَآءٍۢ مُّنْهَمِرٍۢ"}, "056041": {"a": 41, "text": "وَأَصْحَٰبُ ٱلشِّمَالِ مَآ أَصْحَٰبُ ٱلشِّمَالِ"}, "055043": {"a": 43, "text": "هَٰذِهِۦ جَهَنَّمُ ٱلَّتِى يُكَذِّبُ بِهَا ٱلْمُجْرِمُونَ"}, "048028": {"a": 28, "text": "هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًۭا"}, "075040": {"a": 40, "text": "أَلَيْسَ ذَٰلِكَ بِقَٰدِرٍ عَلَىٰٓ أَن يُحْۦِىَ ٱلْمَوْتَىٰ"}, "077049": {"a": 49, "text": "وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"}, "079018": {"a": 18, "text": "فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ"}, "048008": {"a": 8, "text": "إِنَّآ أَرْسَلْنَٰكَ شَٰهِدًۭا وَمُبَشِّرًۭا وَنَذِيرًۭا"}, "075036": {"a": 36, "text": "أَيَحْسَبُ ٱلْإِنسَٰنُ أَن يُتْرَكَ سُدًى"}, "089021": {"a": 21, "text": "كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّۭا دَكًّۭا"}, "067002": {"a": 2, "text": "ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًۭا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ"}, "056076": {"a": 76, "text": "وَإِنَّهُۥ لَقَسَمٌۭ لَّوْ تَعْلَمُونَ عَظِيمٌ"}, "068033": {"a": 33, "text": "كَذَٰلِكَ ٱلْعَذَابُ ۖ وَلَعَذَابُ ٱلْءَاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ"}, "072010": {"a": 10, "text": "وَأَنَّا لَا نَدْرِىٓ أَشَرٌّ أُرِيدَ بِمَن فِى ٱلْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًۭا"}, "055009": {"a": 9, "text": "وَأَقِيمُوا۟ ٱلْوَزْنَ بِٱلْقِسْطِ وَلَا تُخْسِرُوا۟ ٱلْمِيزَانَ"}, "089006": {"a": 6, "text": "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ"}, "061011": {"a": 11, "text": "تُؤْمِنُونَ بِٱللَّهِ وَرَسُولِهِۦ وَتُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ"}, "089005": {"a": 5, "text": "هَلْ فِى ذَٰلِكَ قَسَمٌۭ لِّذِى حِجْرٍ"}, "066001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ"}, "051032": {"a": 32, "text": "قَالُوٓا۟ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٍۢ مُّجْرِمِينَ"}, "050027": {"a": 27, "text": "۞ قَالَ قَرِينُهُۥ رَبَّنَا مَآ أَطْغَيْتُهُۥ وَلَٰكِن كَانَ فِى ضَلَٰلٍۭ بَعِيدٍۢ"}, "054028": {"a": 28, "text": "وَنَبِّئْهُمْ أَنَّ ٱلْمَآءَ قِسْمَةٌۢ بَيْنَهُمْ ۖ كُلُّ شِرْبٍۢ مُّحْتَضَرٌۭ"}, "048009": {"a": 9, "text": "لِّتُؤْمِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَتُعَزِّرُوهُ وَتُوَقِّرُوهُ وَتُسَبِّحُوهُ بُكْرَةًۭ وَأَصِيلًا"}, "077031": {"a": 31, "text": "لَّا ظَلِيلٍۢ وَلَا يُغْنِى مِنَ ٱللَّهَبِ"}, "080023": {"a": 23, "text": "كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ"}, "089009": {"a": 9, "text": "وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ"}}, EXPL={"3|الرياضيات|عالم الجمع والطرح": [{"t": "عالم الجمع والطرح", "k": "", "lines": ["بص يا حبيبي، لما نجمع، بنحط الأرقام تحت بعض: آحاد تحت آحاد، وعشرات تحت عشرات، ومئات تحت مئات."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["نبدأ الجمع من اليمين، من الآحاد. لو الناتج 10 أو أكتر، نكتب الآحاد ونرفع العشرة للعمود اللي جنبه. اسمها الحمل."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["في الطرح كمان نبدأ من الآحاد. لو الرقم اللي فوق أصغر، نستلف عشرة من العمود اللي جنبه."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["مثال: 45 + 28. نجمع 5 + 8 = 13، نكتب 3 ونرفع 1. بعدين 4 + 2 + 1 = 7. الناتج 73."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["اتأكد من الحل: الجمع نختبره بالطرح، والطرح نختبره بالجمع. لو رجعنا للرقم الأصلي يبقى الحل صح. يلا يا بطل."]}], "3|الرياضيات|عالم الزمن": [{"t": "عالم الزمن", "k": "", "lines": ["بص يا حبيبي، الساعة فيها 60 دقيقة، واليوم فيه 24 ساعة، والأسبوع 7 أيام."]}, {"t": "عالم الزمن", "k": "", "lines": ["العقرب الصغير بيقول الساعة، والعقرب الكبير بيقول الدقايق. لما الكبير على 6 نقول والنصف، ولما يكون على 3 نقول والربع."]}, {"t": "عالم الزمن", "k": "", "lines": ["الزمن المنقضي هو الفرق بين وقت البداية ووقت النهاية. من 3:00 لحد 5:30 يبقى ساعتين ونص."]}, {"t": "عالم الزمن", "k": "", "lines": ["السنة فيها 12 شهر، والشهر ممكن يكون 30 أو 31 يوم، وفبراير أقل."]}, {"t": "عالم الزمن", "k": "", "lines": ["اقرأ السؤال وشوف بيسأل عن ساعة ولا دقيقة ولا يوم، وبعدين اختار الوحدة الصح. يلا يا بطل."]}], "3|الرياضيات|مملكة الضرب": [{"t": "مملكة الضرب", "k": "", "lines": ["بص يا حبيبي، الضرب هو جمع الرقم نفسه كذا مرة. 4 × 3 يعني 4 + 4 + 4 = 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["جدول الضرب لازم نحفظه. ممكن نتعلمه بالعد بالقفزات: 3، 6، 9، 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["الترتيب مش بيغير الناتج: 4 × 3 = 3 × 4."]}, {"t": "مملكة الضرب", "k": "", "lines": ["أي رقم × 1 يساوي نفسه. وأي رقم × 0 يساوي صفر."]}, {"t": "مملكة الضرب", "k": "", "lines": ["لو السؤال فيه مجموعات متساوية، اعرف عدد المجموعات وعدد كل مجموعة واضرب. يلا يا بطل."]}], "3|الرياضيات|مملكة ا <script id="azhar-pro-js">
(function(){

function ageWord(a){if(!a)return"";return a===1?"سنة واحدة":a===2?"سنتان":a<=10?a+" سنين":a+" سنة"}
function greet(){
 try{
  if(typeof P==="undefined"||!P||!P.name)return;
  var app=document.getElementById("app");if(!app||app.querySelector("#azhi"))return;
  if(app.querySelector("#azparents"))return;

  var d=document.createElement("div");d.id="azhi";

  d.textContent="🌟 أهلًا بعودتك يا "+P.name+age+goal+" — يلا نكمل بطولاتك!";
  h1.parentNode.insertBefore(d,h1.nextSibling);

  pb.textContent="👨‍👩‍👧 ركن بابا وماما — سؤال للأهل ومساعدة ليهم";
  pb.addEventListener("click",function(){window.__azParents()});
  d.parentNode.insertBefore(pb,d.nextSibling);
 }catch(e){}
}
var PQ=null;
function pqPick(){
 try{
  var pool=(window.RAW||[]).filter(function(r){return r&&r.choices&&r.choices.length>=3&&r.explanation&&["القرآن","التربية الإسلامية","العربي"].indexOf(r.subject)>=0});
  if(!pool.length)pool=(window.RAW||[]).filter(function(r){return r&&r.choices&&r.choices.length>=3&&r.explanation});
  if(!pool.length)return null;
  var q=pool[Math.floor(Math.random()*pool.length)];
  var ch=q.choices.slice();for(var i=ch.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ch[i];ch[i]=ch[j];ch[j]=t}
  return {q:q.question,ch:ch,ans:q.answer,exp:q.explanation,subj:q.subject};
 }catch(e){return null}
}

  var qhtml=PQ?('<div class="card"><h2>🧠 سؤال لبابا وماما</h2><p class="sync">من مادة '+PQ.subj+' — جاوبوا مع '+kid+' واتناقشوا في السبب:</p><div class="qtext">'+PQ.q+'</div><div id="azpq">'+PQ.ch.map(function(c,i){return '<button class="choice" data-azpq="'+i+'"><span>'+c+'</span></button>'}).join("")+'</div><div id="azpfb"></div><button class="btn small ghost" id="azpnew">🔄 سؤال جديد للأهل</button></div>'):'';
  var h='<div id="azparents"><h1>👨‍👩‍👧 ركن بابا وماما</h1>'

   +qhtml
   +'<div class="card"><h2>🤝 إزاي تساعدوا '+son+'؟</h2><p>'+ageTip+'</p><p>· اسألوه كل يوم: «اتعلمت إيه جديد؟» وخلوه يعلّمكم هو — أحلى تثبيت للمعلومة إنه يشرحها.<br>· شوفوا تقريره من زرار «تقريري» في اللعبة وقارنوا تقدمه أسبوع بأسبوع، وامدحوا الجهد مش الدرجة بس.<br>· لو سؤال صعب عليه، سيبوه يستخدم تلميح الأول قبل ما تقولوا الإجابة.</p></div>'
   +'<div class="card"><h2>💬 أسئلة تفتح الكلام بعد اللعب</h2><p>· إيه أكتر سؤال عجبك النهاردة وليه؟<br>· إيه السؤال اللي غلطت فيه واتعلمت منه إيه؟<br>· لو هتعمل سؤال لبابا وماما، هيكون عن إيه؟<br>· إيه المادة اللي عايز تكسب فيها تلميحات زيادة؟</p></div>'
   +'<button class="btn" data-a="home">🏠 رجوع للعبة '+kid+'</button></div>';
  render(h);
  var nb=document.getElementById("azpnew");if(nb)nb.addEventListener("click",function(){PQ=pqPick();window.__azParents()});
  var box=document.getElementById("azpq");
  if(box)box.addEventListener("click",function(e){var b=e.target.closest("[data-azpq]");if(!b||!PQ)return;var pick=PQ.ch[+b.getAttribute("data-azpq")];var fb=document.getElementById("azpfb");
   if(pick===PQ.ans){b.classList.add("ok");fb.innerHTML='<div class="warn" style="background:#e8f5e9">🎉 إجابة صح! '+PQ.exp+'<br>اتكلموا مع '+kid+': ليه دي الإجابة الصح؟</div>'}
   else{b.classList.add("bad");fb.innerHTML='<div class="warn">قربتوا! الإجابة الصح: <b>'+PQ.ans+'</b><br>'+PQ.exp+'</div>'}});
 }catch(e){}
};
