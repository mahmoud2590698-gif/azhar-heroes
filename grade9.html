nswer": "سورة المائدة، الآيتان 33-34", "answerIndex": 3, "explanation": "يتناول الدرس الآيتين 33 و34 من سورة المائدة، وفيهما بيان عقوبة المفسدين في الأرض واستثناء التائبين قبل القدرة عليهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-391", "question": "ما معنى «المحاربة» في الآية الكريمة؟", "choices": ["الحرب بين الدول الكبرى", "قطع الطريق على الآمنين، والاعتداء عليهم بالقتل أو سلب أموالهم أو غير ذلك", "القتال في سبيل الله", "الخلاف بين المسلمين"], "answer": "قطع الطريق على الآمنين، والاعتداء عليهم بالقتل أو سلب أموالهم أو غير ذلك", "answerIndex": 1, "explanation": "«المحاربة: من الحرب، وهي ضد السلم، والمراد: قطع الطريق على الآمنين، والاعتداء عليهم بالقتل أو سلب أموالهم أو غير ذلك».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-392", "question": "ما العقوبات الأربع للمفسدين في الأرض كما بينتها الآيتان؟", "choices": ["القتل، والصلب، وقطع اليد والرجل من خلاف، أو النفي من الأرض", "الجلد والرجم والسجن والغرامة", "القتل فقط", "النفي والسجن والجلد"], "answer": "القتل، والصلب، وقطع اليد والرجل من خلاف، أو النفي من الأرض", "answerIndex": 0, "explanation": "«وذكرت الآيتان أنه لا جزاء للمفسدين في الأرض إلا القتل، والصلب، وقطع اليد والرجل من خلاف، أو النفي من الأرض عقوبة لهم، وخزيا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-393", "question": "متى يستحق المفسد عقوبة الصلب؟", "choices": ["إن أخذ المال فقط", "إن جمع بين أخذ المال والقتل", "إن أخاف الناس فقط", "إن تاب قبل القدرة عليه"], "answer": "إن جمع بين أخذ المال والقتل", "answerIndex": 1, "explanation": "«العقوبة الثانية: الصلب: ويستحق المفسدون هذه العقوبة إن جمعوا بين أخذ المال والقتل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-394", "question": "ما حكم من تاب من الإفساد في الأرض قبل أن يتمكن الحاكم منه؟", "choices": ["لا تقبل توبته أبدا", "يسقط عنه حد الحرابة، وتبقى المؤاخذة على حقوق الآدميين", "يسقط عنه الحد وحقوق العباد معا", "يعاقب بالقتل فقط"], "answer": "يسقط عنه حد الحرابة، وتبقى المؤاخذة على حقوق الآدميين", "answerIndex": 1, "explanation": "«إلا من تاب قبل أن يتمكن الحاكم منه، ويقدر على عقوبته فإن توبته حينئذ جديرة بأن تكون توبة خالصة لله، يسقط عنه بها حد الحرابة، وتبقى المؤاخذة على ما ارتكب من حقوق الآدميين».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-395", "question": "فيمن نزلت آية الحرابة (المائدة 33) على قول الجمهور كما ذكر القرطبي؟", "choices": ["الأخنس بن شريق", "أهل مكة", "اليهود", "العرنيين"], "answer": "العرنيين", "answerIndex": 3, "explanation": "«قال القرطبي: اختلف الناس في سبب نزول هذه الآية؛ فالذي عليه الجمهور أنها نزلت في العرنيين».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-396", "question": "ما الآيتان اللتان يتناولهما درس «من مقاصد الشريعة حفظ الأعراض»؟", "choices": ["سورة النور، الآيتان 30-31", "سورة المائدة، الآيتان 33-34", "سورة البقرة، الآيات 204-206", "سورة النساء، الآيات 29-31"], "answer": "سورة النور، الآيتان 30-31", "answerIndex": 0, "explanation": "يتناول الدرس الآيتين 30 و31 من سورة النور، وفيهما الأمر بغض البصر وحفظ الفرج وبيان من يجوز إبداء الزينة أمامهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-397", "question": "لماذا ابتدأ الله سبحانه بالأمر بغض البصر قبل حفظ الفرج؟", "choices": ["لأن البصر أهم من الفرج", "لأنه الباب الأكبر إلى القلب، ولأن النظرة المريبة ذريعة إلى ارتكاب المعصية", "لأن غض البصر أسهل من حفظ الفرج", "لأن النظر حلال في كل الأحوال"], "answer": "لأنه الباب الأكبر إلى القلب، ولأن النظرة المريبة ذريعة إلى ارتكاب المعصية", "answerIndex": 1, "explanation": "«وابتدأ سبحانه بالأمر بغض البصر؛ لأنه الباب الأكبر إلى القلب، ولأن النظرة المريبة ذريعة إلى ارتكاب المعصية».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-398", "question": "ما الذي يجوز للمرأة إبداء زينتها أمامه من الأصناف التي ذكرتها الآية؟", "choices": ["الأجانب من الرجال", "الأزواج والآباء والأبناء والإخوة", "الجيران والأصدقاء", "كل من تتعامل معه في السوق"], "answer": "الأزواج والآباء والأبناء والإخوة", "answerIndex": 1, "explanation": "استثنى القرآن الكريم المحارم الذين يخالطون المرأة، فأجاز إبداء المرأة لزينتها أمامهم، وهؤلاء الأصناف هم: الأزواج، والآباء، وآباء الأزواج، والأبناء، وأبناء الأزواج، والإخوة، وأبناء الإخوة، وأبناء الأخوات، والنساء المختصات بصحبة المرأة وخدمتها، وملك اليمين من النساء، والتابعين غير أولي الإربة من الرجال، والطفل الذين لم يظهروا على عورات النساء.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-399", "question": "ما معنى «خمرهن» في قوله تعالى ﴿وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَىٰ جُيُوبِهِنَّ﴾؟", "choices": ["جمع خمر وهو الشراب المسكر", "الثياب الفاخرة", "الحلي والزينة", "جمع خمار، وهو ما تغطي به المرأة رأسها"], "answer": "جمع خمار، وهو ما تغطي به المرأة رأسها", "answerIndex": 3, "explanation": "«خمرهن: جمع خمار، وهو ما تغطي به المرأة رأسها».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "التفسير", "id": "h26-g9-400", "question": "بم ختم الله تعالى آيتي غض البصر وحفظ الفرج؟", "choices": ["بالأمر بالتوبة إلى الله جميعا رجاء الفلاح", "بالوعيد بالنار للعصاة", "بذكر عقوبة القذف", "بالنهي عن الزواج"], "answer": "بالأمر بالتوبة إلى الله جميعا رجاء الفلاح", "answerIndex": 0, "explanation": "«ولما كانت النفس البشرية تضعف بطبيعتها، فتح الله باب التوبة فقال تعالى: وتوبوا إلى الله جميعا أيها المؤمنون لعلكم تفلحون».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-401", "question": "من راوي حديث «حق المسلم على المسلم»؟", "choices": ["أبو هريرة رضي الله عنه", "عبد الله بن عمر رضي الله عنهما", "أنس بن مالك رضي الله عنه", "عبد الله بن مسعود رضي الله عنه"], "answer": "عبد الله بن عمر رضي الله عنهما", "answerIndex": 1, "explanation": "روى الحديث عبد الله بن عمر رضي الله عنهما، وفيه قال ﷺ: «المسلم أخو المسلم لا يظلمه ولا يسلمه»، وهو حديث متفق عليه.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-402", "question": "ما معنى «لا يسلمه» في حديث حق المسلم على المسلم؟", "choices": ["لا يسلم عليه إذا لقيه", "لا يعطيه من ماله شيئا", "لا يلقيه في الهلكة، ولا يترك حمايته من عدوه", "لا يجالسه في المجالس"], "answer": "لا يلقيه في الهلكة، ولا يترك حمايته من عدوه", "answerIndex": 2, "explanation": "«لا يسلمه»: لا يلقيه في الهلكة، ولا يترك حمايته من عدوه، وحق المسلم على المسلم أن يعينه حين يظلم، ويساعده على رفع الظلم عنه بقدر طاقته.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-403", "question": "ما جزاء من ستر أخاه المسلم كما ورد في الحديث؟", "choices": ["«ستره الله يوم القيامة»", "غفر الله له ذنوبه كلها", "أدخله الله الجنة بغير حساب", "رزقه الله مالا كثيرا"], "answer": "«ستره الله يوم القيامة»", "answerIndex": 0, "explanation": "قال ﷺ: «ومن ستر مسلما ستره الله يوم القيامة»، والستر: أن يراه على قبيح فلا يظهره للناس.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-404", "question": "ما الذي يرشد إليه حديث حق المسلم على المسلم؟", "choices": ["أن المسلم يجوز له ظلم أخيه إذا ظلمه", "أن الستر على المسلم يمنع من نصحه", "أن حق المسلم على المسلم ألا يعينه على الشدائد", "أن الجزاء في الآخرة يكون من جنس الطاعات في الدنيا"], "answer": "أن الجزاء في الآخرة يكون من جنس الطاعات في الدنيا", "answerIndex": 3, "explanation": "من إرشادات الحديث: أن الجزاء في الآخرة يكون من جنس الطاعات في الدنيا، وحض المسلمين على التعاون والتراحم والتناصر والتناصح فيما بينهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-405", "question": "ما معنى قول النبي ﷺ: «حتى ظننت أنه سيورثه» في حديث الوصية بالجار؟", "choices": ["ظننت أن الجار يرث النبي ﷺ", "حسبت أن جبريل سيأخذ ميراثي", "حسبت أنه يأمرني عن الله بتوريث الجار من جاره", "ظننت أن الجار سيبيع داره"], "answer": "حسبت أنه يأمرني عن الله بتوريث الجار من جاره", "answerIndex": 2, "explanation": "«ظننت»: حسبت أنه يأمرني عن الله بتوريث الجار من جاره، و«سيورثه»: سيجعل له نصيبا في الميراث، وذلك لكثرة تكرار الوصية بالجار.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-406", "question": "ما حد الجوار كما روته أم المؤمنين عائشة رضي الله عنها؟", "choices": ["أربعون دارا من كل جانب", "عشرون دارا من كل جانب", "ستون دارا من كل جانب", "مئة دار من كل جانب"], "answer": "أربعون دارا من كل جانب", "answerIndex": 0, "explanation": "حد الجوار كما تقول أم المؤمنين عائشة: «أربعون دارا من كل جانب»، ويطلق الجار على المجاور في الدار في الغالب، وكلما كان أقرب جوارا كان أعظم حقا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-407", "question": "كم حقا للجار غير المسلم؟", "choices": ["حقان: الإسلام والجوار", "حق واحد وهو حق الجوار فقط", "ثلاثة حقوق", "لا حق له"], "answer": "حق واحد وهو حق الجوار فقط", "answerIndex": 1, "explanation": "الجيران ثلاثة: جار له حق واحد وهو غير المسلم، له حق الجوار فقط؛ وجار له حقان وهو المسلم غير القريب؛ وجار له ثلاثة حقوق وهو المسلم القريب.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-408", "question": "أي مما يأتي من مظاهر حق الجار؟", "choices": ["منعه من زيارة أهله", "رفع الصوت عليه", "إغلاق الباب في وجهه", "إعانته وإقراضه وعيادته عند مرضه"], "answer": "إعانته وإقراضه وعيادته عند مرضه", "answerIndex": 3, "explanation": "من مظاهر حق الجار: إعانته، وإقراضه، وعيادته عند مرضه، وتهنئته عند سروره، وتعزيته عند مصيبته، ونحو ذلك.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-409", "question": "من راوي حديث «قيمة العمل»؟", "choices": ["أبو هريرة رضي الله عنه", "المقدام بن معديكرب رضي الله عنه", "أنس بن مالك رضي الله عنه", "جابر بن عبد الله رضي الله عنه"], "answer": "المقدام بن معديكرب رضي الله عنه", "answerIndex": 1, "explanation": "راوي الحديث المقدام بن معديكرب، نزل الشام وسكن حمص، روى أربعين حديثا، مات سنة 87 هـ عن واحد وتسعين عاما.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-410", "question": "ما أطيب أنواع الكسب كما بين حديث قيمة العمل؟", "choices": ["ما كان ثمرة لعمل اليد", "الميراث بلا كدح", "الهبة من غير تعب", "ما جاء من السؤال"], "answer": "ما كان ثمرة لعمل اليد", "answerIndex": 0, "explanation": "يبين الرسول ﷺ أن أطيب أنواع الكسب وأهنأه ما كان ثمرة لعمل اليد، فالذي يعمل بيده ويأكل من عرق جبينه خير من الذي يأكل من كسب لم يكد فيه ولم يتعب.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-411", "question": "لماذا خص النبي ﷺ نبي الله داود عليه السلام بالذكر في حديث قيمة العمل؟", "choices": ["لأنه كان فقيرا محتاجا إلى العمل", "لأنه أول من عمل بالحدادة", "لأنه نبي ملك ومع ذلك كان يأكل من عمل يده", "لأنه كان تاجرا مشهورا"], "answer": "لأنه نبي ملك ومع ذلك كان يأكل من عمل يده", "answerIndex": 2, "explanation": "خص نبي الله داود بالذكر؛ لكونه نبيا ملكا، ومع ذلك كان يأكل من عمل يده، وقد كان أنبياء الله جميعا يأكلون من عمل أيديهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-412", "question": "ما الذي يترتب على ترك العمل وقلة الإنتاج؟", "choices": ["الغنى وكثرة المال", "تقدم المجتمع", "راحة النفس", "البطالة"], "answer": "البطالة", "answerIndex": 3, "explanation": "إن ترك العمل وقلة الإنتاج يؤديان إلى البطالة، والإسلام يدعو إلى العمل، ويحارب الخمول والكسل.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-413", "question": "ما معنى «راع» في حديث المسؤولية في الإسلام؟", "choices": ["حافظ ملتزم بصلاح ما قام عليه", "سائق الإبل في الصحراء", "جامع المال من الناس", "حارس الباب"], "answer": "حافظ ملتزم بصلاح ما قام عليه", "answerIndex": 0, "explanation": "«راع»: حافظ ملتزم بصلاح ما قام عليه، و«الرعية»: كل ما يشمله حفظ الراعي وإشرافه.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-414", "question": "أكمل: المرأة راعية في...", "choices": ["بيت أبيها", "السوق", "بيت زوجها", "المسجد"], "answer": "بيت زوجها", "answerIndex": 2, "explanation": "قال ﷺ: «والمرأة راعية في بيت زوجها ومسؤولة عن رعيتها».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-415", "question": "ما الذي يفيده لفظ «كل» مضافا إلى نكرة في حديث المسؤولية؟", "choices": ["التخصيص والتقييد", "العموم والشمول", "الشك والاحتمال", "النفي والإبطال"], "answer": "العموم والشمول", "answerIndex": 1, "explanation": "جاء في الحديث لفظ «كل» مضافا إلى نكرة؛ يفيد العموم والشمول؛ ليشمل كل فرد من أفراد المجتمع، وأن كل فرد عليه مسؤولية.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-416", "question": "عن ماذا يسأل الخادم يوم القيامة كما في حديث المسؤولية؟", "choices": ["عن صلاة سيده", "عن طعام سيده", "عن لباس سيده", "عن عمله ومال سيده الذي استرعاه الله عليه"], "answer": "عن عمله ومال سيده الذي استرعاه الله عليه", "answerIndex": 3, "explanation": "الخادم مسؤول عن عمله أمام سيده؛ فإن قام به فاز، وإن قصر خسر، والحديث يقول: «والخادم راع في مال سيده ومسؤول عن رعيته».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-417", "question": "ما معنى «تلعنه» في حديث النهي عن ترويع الآمنين؟", "choices": ["تدعو عليه بالطرد من رحمة الله", "تدعو له بالرحمة", "تمدحه عند الملائكة", "تستغفر له"], "answer": "تدعو عليه بالطرد من رحمة الله", "answerIndex": 0, "explanation": "«تلعنه»: أي تدعو عليه بالطرد من رحمة الله، واللعن من الملائكة معناه الدعاء على الذي يشير إلى أخيه بالسلاح بالحرمان من الرحمة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-418", "question": "ما حكم الإشارة إلى المسلم بالسلاح على سبيل المزاح؟", "choices": ["جائزة ما دام لا يؤذي أحدا", "مستحبة للتسلية", "محرمة ومنهي عنها", "مكروهة فقط"], "answer": "محرمة ومنهي عنها", "answerIndex": 2, "explanation": "يحذر رسول الله ﷺ المسلم من ترويع الآمنين وإخافة الناس بحمل وإشهار السلاح في وجوههم، ولو كان على سبيل المزاح والهزل.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-419", "question": "إلى متى يظل لعن الملائكة على من أشار إلى أخيه بحديدة؟", "choices": ["حتى يموت", "حتى يدعه", "حتى يتوب", "حتى يعتذر"], "answer": "حتى يدعه", "answerIndex": 1, "explanation": "قال ﷺ: «من أشار إلى أخيه بحديدة، فإن الملائكة تلعنه، حتى يدعه وإن كان أخاه لأبيه وأمه»، ويظل لعن الملائكة له حتى يغمد سلاحه ويؤمن أخاه.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-420", "question": "ما الذي يرشد إليه حديث النهي عن ترويع الآمنين؟", "choices": ["جواز حمل السلاح في وجه المسلم", "جواز التقاتل بالسلاح", "أن المزاح بالسلاح لا بأس به", "تحريم الأسباب المؤدية إلى القتل"], "answer": "تحريم الأسباب المؤدية إلى القتل", "answerIndex": 3, "explanation": "من إرشادات الحديث: تحريم قتل المسلم وقتاله، وتحريم الأسباب المؤدية إلى القتل، والنهي عن ترويع المسلم ولو كان على سبيل المزاح.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-421", "question": "ما معنى «لا يلقي لها بالا» في حديث خطورة الكلمة؟", "choices": ["لا يتفكر في عاقبتها التي تترتب عليها", "لا يسمعها جيدا", "لا يحفظها في قلبه", "لا يرددها بلسانه"], "answer": "لا يتفكر في عاقبتها التي تترتب عليها", "answerIndex": 0, "explanation": "«لا يلقي لها بالا»: لا يتفكر في عاقبتها التي تترتب عليها.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-422", "question": "ما أثر الكلمة الطيبة والكلمة الخبيثة كما في حديث خطورة الكلمة؟", "choices": ["الطيبة لا أثر لها والخبيثة يرفع بها", "كلتاهما ترفعان صاحبها", "الطيبة يرفعه الله بها درجات والخبيثة يهوي بها في جهنم", "كلتاهما تهويان بصاحبهما"], "answer": "الطيبة يرفعه الله بها درجات والخبيثة يهوي بها في جهنم", "answerIndex": 2, "explanation": "قال ﷺ: «إن العبد ليتكلم بالكلمة من رضوان الله، لا يلقي لها بالا، يرفعه الله بها درجات، وإن العبد ليتكلم بالكلمة من سخط الله، لا يلقي لها بالا، يهوي بها في جهنم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-423", "question": "أي مما يأتي من الأحكام التي ترتبت على الكلمة كما في الدرس؟", "choices": ["الصلاة والصيام والزكاة", "دخول الإسلام بكلمة الشهادة والزواج بكلمة والطلاق بكلمة", "البيع والشراء فقط", "السفر والإقامة"], "answer": "دخول الإسلام بكلمة الشهادة والزواج بكلمة والطلاق بكلمة", "answerIndex": 1, "explanation": "لشدة خطورة الكلمة فإن الإسلام رتب عليها أحكاما كثيرة؛ فدخول الإسلام بكلمة الشهادة، والزواج يكون بكلمة، والطلاق بكلمة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-424", "question": "من هو العاقل في ميزان حديث خطورة الكلمة؟", "choices": ["الذي يكثر الكلام في كل مجلس", "الذي لا يتأنى في الكلمة التي تخرج منه", "الذي يستعمل نعمة النطق في إيذاء الناس", "الذي يتأنى في الكلمة التي تخرج من فمه فلا يؤذي بها أحدا"], "answer": "الذي يتأنى في الكلمة التي تخرج من فمه فلا يؤذي بها أحدا", "answerIndex": 3, "explanation": "من إرشادات الحديث: العاقل هو الذي يتأنى في الكلمة التي تخرج من فمه فلا يؤذي بها أحدا من الخلق، وينبغي للإنسان أن يستعمل نعمة النطق فيما يرضي الله.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-425", "question": "من السائل عن أحب الأعمال إلى الله في الحديث؟", "choices": ["عبد الله بن مسعود رضي الله عنه", "أبو هريرة رضي الله عنه", "عبد الله بن عمر رضي الله عنهما", "أنس بن مالك رضي الله عنه"], "answer": "عبد الله بن مسعود رضي الله عنه", "answerIndex": 0, "explanation": "سأل عبد الله بن مسعود رضي الله عنه رسول الله ﷺ: «أي الأعمال أحب إلى الله؟» قال: «الصلاة على وقتها».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-426", "question": "ما ترتيب الأعمال الأحب إلى الله كما ورد في الحديث؟", "choices": ["بر الوالدين ثم الصلاة ثم الجهاد", "الجهاد ثم الصلاة ثم بر الوالدين", "الصلاة على وقتها ثم بر الوالدين ثم الجهاد في سبيل الله", "الصيام ثم الصلاة ثم بر الوالدين"], "answer": "الصلاة على وقتها ثم بر الوالدين ثم الجهاد في سبيل الله", "answerIndex": 2, "explanation": "قال ﷺ: «الصلاة على وقتها»، قلت: ثم أي؟ قال: «ثم بر الوالدين»، قلت: ثم أي؟ قال: «ثم الجهاد في سبيل الله».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-427", "question": "لماذا قدمت الصلاة على بر الوالدين في حديث أحب الأعمال؟", "choices": ["لأن الصلاة أسهل من بر الوالدين", "لأن الصلاة شكر الله والبر شكر الوالدين وشكر الله مقدم", "لأن الوالدين لا يحتاجان إلى البر", "لأن الجهاد أهم منهما"], "answer": "لأن الصلاة شكر الله والبر شكر الوالدين وشكر الله مقدم", "answerIndex": 1, "explanation": "قدم الرسول الصلاة على بر الوالدين؛ لأن الصلاة شكر الله، والبر شكر الوالدين، وشكر الله مقدم على بر الوالدين.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-428", "question": "ما معنى «الصلاة على وقتها»؟", "choices": ["أداؤها في آخر وقتها", "تأخيرها إلى الليل", "أداؤها مرة في الأسبوع", "أداؤها في أول وقتها"], "answer": "أداؤها في أول وقتها", "answerIndex": 3, "explanation": "«الصلاة على وقتها»: أداؤها في أول وقتها، والصلاة في أول الوقت أفضل من الصلاة في آخر وقتها.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-429", "question": "كم صنفا من الناس يظلهم الله في ظله يوم القيامة؟", "choices": ["سبعة أصناف", "خمسة أصناف", "عشرة أصناف", "ثلاثة أصناف"], "answer": "سبعة أصناف", "answerIndex": 0, "explanation": "قال ﷺ: «سبعة يظلهم الله تعالى في ظله يوم لا ظل إلا ظله».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-430", "question": "لماذا قدم الإمام العادل على ما بعده في حديث السبعة الذين يظلهم الله؟", "choices": ["لأنه أغنى الناس", "لعموم نفعه وكثرة مصالحه", "لأنه أكبرهم سنا", "لأنه أقربهم إلى النبي ﷺ"], "answer": "لعموم نفعه وكثرة مصالحه", "answerIndex": 1, "explanation": "قدم الإمام العادل على ما بعده؛ لعموم نفعه، وكثرة مصالحه، ولأنه إذا صلح صلحت الرعية كلها.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-431", "question": "لماذا خص الشاب بالذكر في حديث السبعة الذين يظلهم الله؟", "choices": ["لأن الشاب أقوى جسدا من الشيخ", "لأن الشاب لا يذنب أبدا", "لأن العبادة من الشاب أفضل لغلبة الشهوة والهوى وكثرة الدواعي لطاعة الهوى", "لأن الشباب أكثر عددا"], "answer": "لأن العبادة من الشاب أفضل لغلبة الشهوة والهوى وكثرة الدواعي لطاعة الهوى", "answerIndex": 2, "explanation": "خص الشاب؛ لأن العبادة من الشاب أفضل؛ لغلبة الشهوة، والهوى، وكثرة الدواعي لطاعة الهوى؛ فملازمة العبادة حينئذ أشد وأدل على غلبة التقوى.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-432", "question": "أي صنف من السبعة هو صاحب قوله ﷺ: «حتى لا تعلم شماله ما تنفق يمينه»؟", "choices": ["رجل ذكر الله خاليا", "الإمام العادل", "رجل قلبه معلق في المساجد", "رجل تصدق بصدقة فأخفاها"], "answer": "رجل تصدق بصدقة فأخفاها", "answerIndex": 3, "explanation": "قال ﷺ: «ورجل تصدق بصدقة فأخفاها حتى لا تعلم شماله ما تنفق يمينه»، والتصدق سرا أقرب إلى الإخلاص وأبعد عن الرياء.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-433", "question": "ما المعنى الواحد الذي جمع السبعة رغم اختلاف أعمالهم في الصورة؟", "choices": ["مجاهدتهم لأنفسهم ومخالفتهم أهواءها", "حبهم للمال والجاه", "كثرة أموالهم", "طول أعمارهم"], "answer": "مجاهدتهم لأنفسهم ومخالفتهم أهواءها", "answerIndex": 0, "explanation": "هذه السبعة اختلفت أعمالهم في الصورة، وجمعها معنى واحد، وهو مجاهدتهم لأنفسهم، ومخالفتهم لأهوائها.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-434", "question": "من راوي حديث «آداب الطريق»؟", "choices": ["أبو هريرة رضي الله عنه", "أبو سعيد الخدري رضي الله عنه", "عبد الله بن عمر رضي الله عنهما", "جابر بن عبد الله رضي الله عنه"], "answer": "أبو سعيد الخدري رضي الله عنه", "answerIndex": 1, "explanation": "راوي الحديث أبو سعيد الخدري، وهو سعد بن مالك بن سنان الأنصاري، استصغر في غزوة أحد، وشهد الخندق وبيعة الرضوان، روى 1170 حديثا، توفي بالمدينة سنة 74 هـ وقيل 64.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-435", "question": "ما حق الطريق كما بينه حديث آداب الطريق؟", "choices": ["الجلوس الطويل وكثرة الكلام", "النظر إلى المارة وتتبع أخبارهم", "غض البصر وكف الأذى ورد السلام وأمر بالمعروف ونهي عن المنكر", "إغلاق الطريق أمام الناس"], "answer": "غض البصر وكف الأذى ورد السلام وأمر بالمعروف ونهي عن المنكر", "answerIndex": 2, "explanation": "قال ﷺ: «غض البصر، وكف الأذى، ورد السلام، وأمر بالمعروف، ونهي عن المنكر».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-436", "question": "لماذا نهى النبي ﷺ عن الجلوس في الطرقات؟", "choices": ["لأن الطريق ملك للدولة فقط", "لأن الجلوس يمنع المارة من المرور", "لأن الطرقات ضيقة", "لأن الجالس على الطريق لا يسلم غالبا من النظر إلى محرم أو سماع ما لا يحل أو إساءة للغير"], "answer": "لأن الجالس على الطريق لا يسلم غالبا من النظر إلى محرم أو سماع ما لا يحل أو إساءة للغير", "answerIndex": 3, "explanation": "لما كان الجالس على الطريق لا يسلم غالبا من النظر إلى محرم، أو سماع ما لا يحل، أو إساءة للغير، نهى النبي أصحابه عن الجلوس في الطرقات دون مراعاة آدابها.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-437", "question": "أي مما يأتي من آداب الطريق التي لم تذكر في الحديث؟", "choices": ["تشميت العاطس وإنصاف المظلوم وإنقاذ المكروب", "النظر إلى المحرم", "إيذاء المارة باللسان", "ترك رد السلام"], "answer": "تشميت العاطس وإنصاف المظلوم وإنقاذ المكروب", "answerIndex": 0, "explanation": "ومن حق الطريق أيضا: تشميت العاطس، وإنصاف المظلوم، وإنقاذ المكروب، ومساعدة المحتاج، وإرشاد السائل، ومساعدة ذوي الاحتياجات الخاصة، ومثل ذلك.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-438", "question": "ما معنى «معاهدا» في حديث رعاية حقوق غير المسلمين؟", "choices": ["من أسلم حديثا", "من له حق الأمان", "من كان من أهل المدينة", "من كان تاجرا"], "answer": "من له حق الأمان", "answerIndex": 1, "explanation": "«معاهدا»: من له حق الأمان، وهو من كان له مع المسلمين عهد شرعي، سواء كان بعقد أمان، أو هدنة من سلطان أو حاكم، أو أمان من مسلم أو مسلمة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-439", "question": "ما معنى «لم يرح» في قوله ﷺ: «من قتل معاهدا لم يرح رائحة الجنة»؟", "choices": ["لم ير", "لم يسمع", "لم يشم", "لم يجد"], "answer": "لم يشم", "answerIndex": 2, "explanation": "«لم يرح»: لم يشم، و«رائحة الجنة»: نسيمها الطيب.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-440", "question": "ما عقوبة من قتل معاهدا كما في الحديث؟", "choices": ["يعاقب بالسجن سنة واحدة", "لا عقوبة عليه", "يغرم مالا فقط", "لا يشم رائحة الجنة وإن ريحها توجد من مسيرة أربعين عاما"], "answer": "لا يشم رائحة الجنة وإن ريحها توجد من مسيرة أربعين عاما", "answerIndex": 3, "explanation": "قال ﷺ: «من قتل معاهدا لم يرح رائحة الجنة، وإن ريحها توجد من مسيرة أربعين عاما».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-441", "question": "من راوي حديث «رعاية حقوق غير المسلمين»؟", "choices": ["عبد الله بن عمرو رضي الله عنهما", "عبد الله بن عمر رضي الله عنهما", "أبو هريرة رضي الله عنه", "أنس بن مالك رضي الله عنه"], "answer": "عبد الله بن عمرو رضي الله عنهما", "answerIndex": 0, "explanation": "راوي الحديث عبد الله بن عمرو بن العاص، أبو محمد، أحد السابقين، أسلم قبل أبيه، أحد العبادلة الفقهاء، روى 700 حديث، مات سنة 63 وقيل 65.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-442", "question": "ما المفلس عند الصحابة كما أجابوا النبي ﷺ؟", "choices": ["من لا بيت له", "من لا درهم له ولا متاع", "من لا أولاد له", "من لا عمل له"], "answer": "من لا درهم له ولا متاع", "answerIndex": 1, "explanation": "قال الصحابة: «المفلس فينا من لا درهم له ولا متاع»، و«متاع»: كل ما ينتفع به من عروض الدنيا قليلها وكثيرها.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-443", "question": "من المفلس الحقيقي يوم القيامة كما بين الحديث؟", "choices": ["من لا يصلي ولا يصوم", "من كان فقيرا في الدنيا", "من يأتي بصلاة وصيام وزكاة وقد شتم هذا وقذف هذا وأكل مال هذا", "من لم يحج بيت الله"], "answer": "من يأتي بصلاة وصيام وزكاة وقد شتم هذا وقذف هذا وأكل مال هذا", "answerIndex": 2, "explanation": "المفلس الحقيقي هو الذي يأتي بأعمال صالحة كثيرة، ولكن شاب هذه الأعمال الصالحة بعض الأخلاق الرديئة: من شتم، وإلقاء التهم جزافا على الخلق، والاعتداء بالضرب، وقذف وضرب، وأذى باليد أو اللسان.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-444", "question": "ما معنى «سفك دم هذا» في حديث المفلس يوم القيامة؟", "choices": ["سب عرضه", "أخذ ماله", "ضربه بيده", "أهرق دمه"], "answer": "أهرق دمه", "answerIndex": 3, "explanation": "«وسفك دم هذا»: أهرق دمه.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-445", "question": "ماذا يحدث للمفلس إذا فنيت حسناته قبل أن يقضى ما عليه؟", "choices": ["أخذ من خطاياهم فطرحت عليه ثم طرح في النار", "غفر الله له ما عليه", "ردت إليه حسناته", "أدخل الجنة برحمة الله"], "answer": "أخذ من خطاياهم فطرحت عليه ثم طرح في النار", "answerIndex": 0, "explanation": "قال ﷺ: «فإن فنيت حسناته قبل أن يقضى ما عليه أخذ من خطاياهم فطرحت عليه، ثم طرح في النار».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-446", "question": "من راوي حديث «ترك الشبهات مخافة الوقوع في الحرام»؟", "choices": ["عبد الله بن عمر رضي الله عنهما", "النعمان بن بشير رضي الله عنه", "أبو هريرة رضي الله عنه", "أنس بن مالك رضي الله عنه"], "answer": "النعمان بن بشير رضي الله عنه", "answerIndex": 1, "explanation": "راوي الحديث النعمان بن بشير بن سعد، ابن أخت عبد الله بن رواحة، ولد سنة اثنتين من الهجرة، روي له 114 حديثا، ولي حمص، قتل سنة 64 هجرية.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-447", "question": "ما معنى «مشتبهات» في حديث ترك الشبهات؟", "choices": ["أمور واضحة في الحرمة", "أمور محرمة قطعا", "أمور اشتبهت بغيرها من الأمور فلم يتضح حكمها على التعيين", "أمور مباحة للجميع"], "answer": "أمور اشتبهت بغيرها من الأمور فلم يتضح حكمها على التعيين", "answerIndex": 2, "explanation": "«مشتبهات»: أمور اشتبهت بغيرها من الأمور فلم يتضح حكمها على التعيين.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-448", "question": "بم ضرب النبي ﷺ المثل لمن وقع في الشبهات؟", "choices": ["كالتاجر يخسر ماله", "كالمسافر يضل طريقه", "كالزارع يهمل زرعه", "كالراعي يرعى حول الحمى يوشك أن يرتع فيه"], "answer": "كالراعي يرعى حول الحمى يوشك أن يرتع فيه", "answerIndex": 3, "explanation": "قال ﷺ: «ومن وقع في الشبهات وقع في الحرام، كالراعي يرعى حول الحمى، يوشك أن يرتع فيه».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-449", "question": "ما المضغة التي إذا صلحت صلح الجسد كله وإذا فسدت فسد الجسد كله؟", "choices": ["القلب", "العقل", "اللسان", "اليد"], "answer": "القلب", "answerIndex": 0, "explanation": "قال ﷺ: «ألا وإن في الجسد مضغة، إذا صلحت، صلح الجسد كله، وإذا فسدت، فسد الجسد كله، ألا وهي القلب»، و«مضغة»: القطعة من اللحم، سميت بذلك لأنها تمضغ في الفم لصغرها.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "الحديث", "id": "h26-g9-450", "question": "ما منزلة حديث «إن الحلال بين، وإن الحرام بين» عند العلماء؟", "choices": ["حديث ضعيف لا يعمل به", "أجمع العلماء على عظمه وكثرة فوائده وأنه من الأحاديث التي عليها مدار الإسلام", "حديث خاص بالترم الثاني فقط", "حديث منسوخ الحكم"], "answer": "أجمع العلماء على عظمه وكثرة فوائده وأنه من الأحاديث التي عليها مدار الإسلام", "answerIndex": 1, "explanation": "أجمع العلماء على عظم هذا الحديث وكثرة فوائده، وأنه من الأحاديث التي عليها مدار الإسلام.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-451", "question": "في أي شهر وسنة كانت غزوة خيبر؟", "choices": ["رمضان 8 هـ", "المحرم 7 هـ", "جمادى الأولى 8 هـ", "شوال 8 هـ"], "answer": "المحرم 7 هـ", "answerIndex": 1, "explanation": "غزوة خيبر كانت في المحرم سنة 7 هـ / 628م، كما في عنوان الموضوع الأول من وحدة السيرة في الكتاب المدرسي.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-452", "question": "ما سبب فتح خيبر؟", "choices": ["ازدياد نقمة اليهود وتدبيرهم المؤامرات لإيذاء المسلمين بعد إخراج بني قينقاع وبني النضير وبني قريظة من المدينة", "اعتداء بني بكر على خزاعة وقتل نحو عشرين رجلا منها", "قتل الحارث بن عمير رسول النبي ﷺ إلى ملك بصرى", "ضيق صدور أشراف هوازن وثقيف بنصر المسلمين في مكة"], "answer": "ازدياد نقمة اليهود وتدبيرهم المؤامرات لإيذاء المسلمين بعد إخراج بني قينقاع وبني النضير وبني قريظة من المدينة", "answerIndex": 0, "explanation": "ازدادت نقمة اليهود على المسلمين بعد أن أخرج رسول الله ﷺ يهود بني قينقاع وبني النضير وبني قريظة من المدينة، فلجأ بعضهم إلى يهود خيبر، وقاموا بتدبير المؤامرات لإيذاء المسلمين، فكان البد من إخراجهم من خيبر حتى يأمن المسلمون شرهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-453", "question": "كم كان عدد جيش المسلمين في غزوة خيبر؟", "choices": ["3000 مقاتل", "10000 مقاتل", "1600 مقاتل", "12000 مقاتل"], "answer": "1600 مقاتل", "answerIndex": 2, "explanation": "خرج النبي ﷺ من المدينة إلى خيبر بعد عودته من الحديبية، في جيش عدده 1600 مقاتل، فوصل بعد ثلاثة أيام.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-454", "question": "ماذا قال النبي ﷺ حين وجد اليهود جيش المسلمين أمام حصون خيبر؟", "choices": ["«ألعطين الراية غدا لرجل يحب الله ورسوله، ويحبه الله ورسوله»", "«اذهبوا فأنتم الطلقاء»", "«خربت خيبر، إذا نزلنا بساحة قوم فساء صباح المنذرين»", "«يا قوم انطلقوا إنما هي إحدى الحسنيين، إما نصر وإما شهادة»"], "answer": "«خربت خيبر، إذا نزلنا بساحة قوم فساء صباح المنذرين»", "answerIndex": 2, "explanation": "لما خرج اليهود في الصباح إلى مزارعهم ووجدوا الرسول ﷺ والمسلمين أمام حصونهم، فولوا هاربين وصاحوا: محمد والجيش! فقال رسول الله ﷺ: «خربت خيبر، إذا نزلنا بساحة قوم فساء صباح المنذرين».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-455", "question": "في أي حصن جمع يهود خيبر أموالهم وعيالهم؟", "choices": ["حصن الكتيبة", "حصن النطاة", "وادي أوطاس", "مدينة معان"], "answer": "حصن الكتيبة", "answerIndex": 0, "explanation": "جمع يهود خيبر أموالهم وعيالهم في حصن الكتيبة، وجعلوا مقاتليهم في حصن النطاة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-456", "question": "في أي حصن جعل يهود خيبر مقاتليهم؟", "choices": ["حصن الكتيبة", "حصن النطاة", "بصرى الشام", "وادي حنين"], "answer": "حصن النطاة", "answerIndex": 1, "explanation": "جمع يهود خيبر أموالهم وعيالهم في حصن الكتيبة، وجعلوا مقاتليهم في حصن النطاة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-457", "question": "لماذا أمر النبي ﷺ بقطع النخيل المحيط بالحصن في خيبر؟", "choices": ["ليطعم منه الجيش", "ليبني به المسلمون بيوتهم", "ليحرق به حصون اليهود", "لأن كثرته تعوق تحركات الجيش"], "answer": "لأن كثرته تعوق تحركات الجيش", "answerIndex": 3, "explanation": "أمر النبي ﷺ بقطع النخيل المحيط بالحصن؛ لأن كثرته تعوق تحركات الجيش، فخرج اليهود يدافعون عن حصونهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-458", "question": "لمن أعطى النبي ﷺ الراية في غزوة خيبر؟", "choices": ["علي بن أبي طالب", "زيد بن حارثة", "خالد بن الوليد", "جعفر بن أبي طالب"], "answer": "علي بن أبي طالب", "answerIndex": 0, "explanation": "قال النبي ﷺ في مساء يوم: «ألعطين الراية غدا لرجل يحب الله ورسوله، ويحبه الله ورسوله»؛ وفي الصباح أعطى الراية لعلي بن أبي طالب.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-459", "question": "من قائد الحصن الذي قتله علي بن أبي طالب في خيبر؟", "choices": ["شرحبيل بن عمرو", "مالك بن عوف", "الحارث بن أبي زينب", "أبو سفيان بن حرب"], "answer": "الحارث بن أبي زينب", "answerIndex": 2, "explanation": "تقدم علي إلى الحصن، فخرج إليه أهله، ودارت المعركة، وقتل قائد الحصن الحارث بن أبي زينب، فتولى بعده أخوه مرحب، وقاتل عليا حتى كاد أن يقتله، إلا أن عليا ضربه فقتله.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-460", "question": "كم عدد شهداء المسلمين في غزوة خيبر؟", "choices": ["93 شهيدا", "حوالي 20 شهيدا", "1600 شهيد", "3000 شهيد"], "answer": "حوالي 20 شهيدا", "answerIndex": 1, "explanation": "استشهد من المسلمين في غزوة خيبر حوالي 20 شهيدا، بينما قتل من اليهود 93 قتيلا، وبهذه الغزوة ساد سلطان المسلمين على جزيرة العرب.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-461", "question": "كم عدد قتلى اليهود في فتح خيبر؟", "choices": ["90 قتيلا", "83 قتيلا", "93 قتيلا", "20 قتيلا"], "answer": "93 قتيلا", "answerIndex": 2, "explanation": "استشهد من المسلمين في غزوة خيبر حوالي 20 شهيدا، بينما قتل من اليهود 93 قتيلا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-462", "question": "كيف قسم النبي ﷺ غنائم خيبر بين المسلمين؟", "choices": ["للفارس سهم وللراجل سهمان", "للفارس ثلاثة أسهم وللراجل سهم واحد", "للراجل سهم وللفارس سهمان", "بالتساوي بين الفارس والراجل"], "answer": "للفارس ثلاثة أسهم وللراجل سهم واحد", "answerIndex": 1, "explanation": "غنم المسلمون من خيبر ألف رمح، وأربعمائة سيف، ومائة درع، وخمسمائة قوس، فقسمها النبي ﷺ بين المسلمين، للفارس ثلاثة أسهم وللراجل سهم واحد.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-463", "question": "ما الذي كان من بين غنائم خيبر فطلبه اليهود فرده النبي ﷺ إليهم؟", "choices": ["عدة صحائف من التوراة", "عدة صحائف من الإنجيل", "عدة صحائف من القرآن", "ألف رمح وأربعمائة سيف"], "answer": "عدة صحائف من التوراة", "answerIndex": 0, "explanation": "كان من بين الغنائم عدة صحائف من التوراة، فطلب اليهود ردها إليهم، فأمر النبي ﷺ بردها لهم، وهذا يدل على احترام الإسلام والمسلمين للكتب المنزلة، ومدى تسامحهم الذي أصبح مضرب الأمثال.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-464", "question": "على ماذا تصالح أهل خيبر مع المسلمين؟", "choices": ["على أن يخرجوا من خيبر جميعا", "على أن يسلموا جميعا", "على أن يدفعوا الجزية كل عام", "على حقن دماء المقاتلة وترك الذرية لهم، وأن تبقى خيبر تحت أيديهم يعملون فيها على نصف محصولها"], "answer": "على حقن دماء المقاتلة وترك الذرية لهم، وأن تبقى خيبر تحت أيديهم يعملون فيها على نصف محصولها", "answerIndex": 3, "explanation": "طلب اليهود الصلح، وبعد مفاوضات مع المسلمين، تصالحوا على حقن دماء المقاتلة من اليهود، وترك الذرية لهم، ثم سألوا رسول الله ﷺ أن تبقى خيبر تحت أيديهم يعملون فيها ويزرعونها؛ لأنهم أعرف بأراضيهم، على أن يأخذوا نصف محصولها، فوافق الرسول ﷺ.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-465", "question": "في أي شهر وسنة كانت سرية مؤتة؟", "choices": ["جمادى الأولى 7 هـ", "جمادى الآخرة 8 هـ", "جمادى الأولى 8 هـ", "رجب 9 هـ"], "answer": "جمادى الأولى 8 هـ", "answerIndex": 2, "explanation": "سرية مؤتة كانت في جمادى الأولى سنة 8 هـ / سبتمبر 629م، كما في عنوان الموضوع الثاني من وحدة السيرة في الكتاب المدرسي.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-466", "question": "بم تسمى سرية مؤتة؟", "choices": ["غزوة الأحزاب", "غزوة الأمراء", "غزوة العسرة", "غزوة الفتح"], "answer": "غزوة الأمراء", "answerIndex": 1, "explanation": "سمى البخاري سرية مؤتة غزوة وإن لم يخرج فيها النبي ﷺ لكثرة جيش المسلمين فيها، وتسمى بغزوة الأمراء؛ لأن النبي ﷺ عقد الإمارة فيها لثلاثة أمراء واحدا بعد الآخر.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-467", "question": "ما سبب غزوة مؤتة؟", "choices": ["قتل الحارث بن عمير الأزدي رسول النبي ﷺ إلى ملك بصرى", "اعتداء بني بكر على خزاعة وقتل نحو عشرين رجلا منها", "ازدياد نقمة اليهود وتدبيرهم المؤامرات في خيبر", "ضيق صدور أشراف هوازن وثقيف بنصر المسلمين في مكة"], "answer": "قتل الحارث بن عمير الأزدي رسول النبي ﷺ إلى ملك بصرى", "answerIndex": 0, "explanation": "كان الرسول ﷺ قد أرسل الحارث بن عمير الأزدي بكتاب إلى ملك بصرى من جهة هرقل يدعوه إلى الإسلام، فبعث إليه ملك بصرى شرحبيل بن عمرو الغساني ليقتله في الطريق أثناء سفره، فغضب رسول الله ﷺ لقتل رسوله، فجهز جيشا عدده 3000 مقاتل.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-468", "question": "كم كان عدد جيش المسلمين في سرية مؤتة؟", "choices": ["1600 مقاتل", "10000 مقاتل", "12000 مقاتل", "3000 مقاتل"], "answer": "3000 مقاتل", "answerIndex": 3, "explanation": "جهز رسول الله ﷺ جيشا عدده 3000 مقاتل لسرية مؤتة، بعد أن غضب لقتل رسوله الحارث بن عمير الأزدي.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-469", "question": "من أول أمير عقده النبي ﷺ لجيش مؤتة؟", "choices": ["زيد بن حارثة", "جعفر بن أبي طالب", "عبد الله بن رواحة", "خالد بن الوليد"], "answer": "زيد بن حارثة", "answerIndex": 0, "explanation": "قال النبي ﷺ للجيش: «أمير الجيش زيد بن حارثة، فإن قتل فجعفر بن أبي طالب، فإن قتل فعبد الله بن رواحة، فإن قتل فليختر المسلمون منهم رجلا فليجعلوه عليهم أميرا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-470", "question": "من الأمير الثاني في جيش مؤتة بعد زيد بن حارثة؟", "choices": ["زيد بن حارثة", "عبد الله بن رواحة", "جعفر بن أبي طالب", "خالد بن الوليد"], "answer": "جعفر بن أبي طالب", "answerIndex": 2, "explanation": "قال النبي ﷺ: «أمير الجيش زيد بن حارثة، فإن قتل فجعفر بن أبي طالب، فإن قتل فعبد الله بن رواحة، فإن قتل فليختر المسلمون منهم رجلا فليجعلوه عليهم أميرا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-471", "question": "بم أوصى النبي ﷺ جيش مؤتة حين ودعه؟", "choices": ["أن يقتلوا كل من يلقونهم", "أن يدعوا إلى الإسلام أولا، وألا يقتلوا النساء ولا الأطفال، ولا راهبا في صومعته، ولا يهدموا المنازل ولا يقطعوا شجرا", "أن يهدموا المنازل ويقطعوا الشجر", "أن يأخذوا أموال أهل بصرى جميعا"], "answer": "أن يدعوا إلى الإسلام أولا، وألا يقتلوا النساء ولا الأطفال، ولا راهبا في صومعته، ولا يهدموا المنازل ولا يقطعوا شجرا", "answerIndex": 1, "explanation": "خرج الجيش وودعه النبي ﷺ ودعا لهم بالنصر، وأوصاهم أن يدعوا من هناك إلى الإسلام أولا، وألا يقتلوا النساء ولا الأطفال، ولا يقتلوا راهبا في صومعته، ولا يهدموا المنازل ولا يقطعوا شجرا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-472", "question": "كم جمع شرحبيل بن عمرو الغساني من قبائل العرب لقتال المسلمين في مؤتة؟", "choices": ["عشرة آلاف", "خمسون ألفا", "ثلاثون ألفا", "مائة ألف"], "answer": "مائة ألف", "answerIndex": 3, "explanation": "جمع شرحبيل بن عمرو الغساني مائة ألف من قبائل العرب، واستنجد بملك الروم فجمع لهم هرقل أكثر من مائة ألف مقاتل من الروم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-473", "question": "أين أقام المسلمون ليلتين يفكرون في أمرهم قبل لقاء العدو في مؤتة؟", "choices": ["معان", "أوطاس", "بصرى", "مر الظهران"], "answer": "معان", "answerIndex": 0, "explanation": "سمع المسلمون بعدد العدو فأقاموا في معان ليلتين يفكرون في أمرهم، وقالوا: نكتب إلى رسول الله ﷺ فنخبره بعدد عدونا، فشجعهم عبد الله بن رواحة على التقدم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-474", "question": "ماذا قال عبد الله بن رواحة يشجع المسلمين على التقدم في مؤتة؟", "choices": ["«اصنعوا لآل جعفر طعاما فقد أتاهم ما يشغلهم»", "«اذهبوا فأنتم الطلقاء»", "«يا قوم انطلقوا إنما هي إحدى الحسنيين، إما نصر وإما شهادة»", "«الآن حمي الوطيس»"], "answer": "«يا قوم انطلقوا إنما هي إحدى الحسنيين، إما نصر وإما شهادة»", "answerIndex": 2, "explanation": "شجع عبد الله بن رواحة المسلمين على التقدم، وقال لهم: «يا قوم انطلقوا إنما هي إحدى الحسنيين، إما نصر وإما شهادة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-475", "question": "كيف استشهد جعفر بن أبي طالب في مؤتة؟", "choices": ["طعن بالرماح حتى استشهد", "قطعت يداه فاحتضن الراية بعضديه", "سقط عن فرسه فمات", "أصابه سهم في صدره"], "answer": "قطعت يداه فاحتضن الراية بعضديه", "answerIndex": 1, "explanation": "أخذ اللواء جعفر بن أبي طالب فأبلى بلاء حسنا، حتى أحاط العدو بفرسه، فنزل عنها ثم انطلق يقاتل الروم حتى قطعت يداه فاحتضن الراية بعضديه وقاتل حتى استشهد.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-476", "question": "من تولى قيادة جيش المسلمين بعد استشهاد القادة الثلاثة في مؤتة؟", "choices": ["خالد بن الوليد", "زيد بن حارثة", "جعفر بن أبي طالب", "عبد الله بن رواحة"], "answer": "خالد بن الوليد", "answerIndex": 0, "explanation": "بعد استشهاد القواد الثلاثة اتفق الناس على تولية خالد بن الوليد، فوحد الصفوف وجمع الشمل، وظل يقاتل العدو حتى أقبل الليل، ثم نظم الجيش من جديد فقدم من كان في الخلف وأخر من كان في الأمام، فظن العدو أن مددا جاء للمسلمين، وآثر خالد المحافظة على المسلمين بالانسحاب فأنقذ الجيش الإسلامي من خطر محقق.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-477", "question": "ماذا قال النبي ﷺ مواسيا أسر الشهداء بعد مؤتة؟", "choices": ["«يا قوم انطلقوا إنما هي إحدى الحسنيين، إما نصر وإما شهادة»", "«ألعطين الراية غدا لرجل يحب الله ورسوله، ويحبه الله ورسوله»", "«خربت خيبر، إذا نزلنا بساحة قوم فساء صباح المنذرين»", "«اصنعوا لآل جعفر طعاما فقد أتاهم ما يشغلهم»"], "answer": "«اصنعوا لآل جعفر طعاما فقد أتاهم ما يشغلهم»", "answerIndex": 3, "explanation": "واسى الرسول ﷺ أسر الشهداء، حين قال: ائتوني ببني جعفر، فدخلوا عليه، فضمهم وذرفت عيناه بالدمع، وقال: «اصنعوا لآل جعفر طعاما فقد أتاهم ما يشغلهم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-478", "question": "في أي شهر وسنة كان فتح مكة؟", "choices": ["رمضان 8 هـ", "المحرم 7 هـ", "جمادى الأولى 8 هـ", "شوال 8 هـ"], "answer": "رمضان 8 هـ", "answerIndex": 0, "explanation": "فتح مكة كان في رمضان 8 هـ، يناير 630م، كما في عنوان الموضوع الثالث من وحدة السيرة في الكتاب المدرسي.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-479", "question": "ما سبب فتح مكة؟", "choices": ["قتل الحارث بن عمير رسول النبي ﷺ إلى ملك بصرى", "نقمة اليهود وتدبيرهم المؤامرات في خيبر", "اعتداء بني بكر على خزاعة وقتل نحو عشرين رجلا منها وإمداد قريش لها بالمال والسلاح", "ضيق صدور أشراف هوازن وثقيف بنصر المسلمين في مكة"], "answer": "اعتداء بني بكر على خزاعة وقتل نحو عشرين رجلا منها وإمداد قريش لها بالمال والسلاح", "answerIndex": 2, "explanation": "أتاح صلح الحديبية لكل قبيلة عربية أن تدخل في حلف رسول الله ﷺ إن شاءت، أو تدخل في حلف قريش، فارتضت بنو بكر أن تدخل في عقد قريش، وارتضت خزاعة أن تدخل في عقد رسول الله ﷺ، وفي تلك السنة اعتدت بنو بكر على خزاعة، فقتلت منهم نحو عشرين رجلا، وأمدت قريش بني بكر بالمال والسلاح، فلما بلغ ذلك الرسول ﷺ غضب غضبا شديدا، وتجهز لقتال قريش وقد أخفى أمره.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-480", "question": "في عقد من دخلت خزاعة بعد صلح الحديبية؟", "choices": ["في عقد قريش", "في عقد رسول الله ﷺ", "في عقد بني بكر", "في عقد هوازن"], "answer": "في عقد رسول الله ﷺ", "answerIndex": 1, "explanation": "ارتضت بنو بكر أن تدخل في عقد قريش، وارتضت خزاعة أن تدخل في عقد رسول الله ﷺ، ثم اعتدت بنو بكر على خزاعة فقتلت منهم نحو عشرين رجلا.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-481", "question": "كم قتلت بنو بكر من خزاعة حين اعتدت عليها؟", "choices": ["عشرة رجال", "خمسة عشر رجلا", "ثلاثون رجلا", "نحو عشرين رجلا"], "answer": "نحو عشرين رجلا", "answerIndex": 3, "explanation": "اعتدت بنو بكر على خزاعة، فقتلت منهم نحو عشرين رجلا، وأمدت قريش بني بكر بالمال والسلاح.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-482", "question": "في أي يوم سار النبي ﷺ من المدينة لفتح مكة؟", "choices": ["التاسع من رمضان", "العاشر من رمضان", "الحادي عشر من رمضان", "العشرون من رمضان"], "answer": "العاشر من رمضان", "answerIndex": 1, "explanation": "سار رسول الله ﷺ من المدينة في يوم العاشر من رمضان، وكان عددهم قرابة عشرة آلاف.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-483", "question": "كم كان عدد المسلمين في جيش فتح مكة؟", "choices": ["قرابة عشرة آلاف", "ثلاثة آلاف", "ألف وستمائة", "اثنا عشر ألفا"], "answer": "قرابة عشرة آلاف", "answerIndex": 0, "explanation": "سار رسول الله ﷺ من المدينة في يوم العاشر من رمضان، وكان عددهم قرابة عشرة آلاف.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-484", "question": "أين أسر حرس النبي ﷺ أبا سفيان بن حرب؟", "choices": ["في وادي حنين", "في وادي أوطاس", "في مر الظهران", "في مدينة معان"], "answer": "في مر الظهران", "answerIndex": 2, "explanation": "في مر الظهران عثر حرس رسول الله ﷺ على أبي سفيان ابن حرب واثنين معه، فأسروهم، وجاؤوا بهم إلى النبي ﷺ، فأسلم أبو سفيان.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-485", "question": "ماذا قال العباس للنبي ﷺ عن أبي سفيان يوم فتح مكة؟", "choices": ["«من دخل دار أبي سفيان فهو آمن»", "«اذهبوا فأنتم الطلقاء»", "«يا قوم انطلقوا إنما هي إحدى الحسنيين، إما نصر وإما شهادة»", "«إن أبا سفيان رجل يحب الفخر، فاجعل له شيئا يفتخر به»"], "answer": "«إن أبا سفيان رجل يحب الفخر، فاجعل له شيئا يفتخر به»", "answerIndex": 3, "explanation": "قال العباس للنبي ﷺ: «إن أبا سفيان رجل يحب الفخر، فاجعل له شيئا يفتخر به»، فقال ﷺ: «من دخل دار أبي سفيان فهو آمن».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-486", "question": "ما النداء الكامل الذي أعلنه منادي الرسول ﷺ يوم فتح مكة؟", "choices": ["«من دخل داره وأغلق بابه فهو آمن»", "«من دخل داره وأغلق بابه فهو آمن، ومن دخل المسجد فهو آمن، ومن دخل دار أبي سفيان فهو آمن»", "«اذهبوا فأنتم الطلقاء»", "«يا معشر قريش، ما تظنون أني فاعل بكم؟»"], "answer": "«من دخل داره وأغلق بابه فهو آمن، ومن دخل المسجد فهو آمن، ومن دخل دار أبي سفيان فهو آمن»", "answerIndex": 1, "explanation": "وصل جيش المسلمين إلى مكة، فأعلن منادي الرسول ﷺ: «من دخل داره وأغلق بابه فهو آمن، ومن دخل المسجد فهو آمن، ومن دخل دار أبي سفيان فهو آمن».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-487", "question": "كم صنما أزال النبي ﷺ حول البيت يوم فتح مكة؟", "choices": ["360 صنما", "93 صنما", "20 صنما", "100 صنم"], "answer": "360 صنما", "answerIndex": 0, "explanation": "طاف رسول الله ﷺ بالبيت، وأزال ما حوله من أصنام بلغت 360 صنما، ثم دخل الكعبة، وصلى فيها ركعتين.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-488", "question": "ماذا قال النبي ﷺ لقريش بعد أن سألهم ما يظنون أن يفعل بهم؟", "choices": ["«يا معشر قريش، ما تظنون أني فاعل بكم؟»", "«من دخل دار أبي سفيان فهو آمن»", "«اذهبوا فأنتم الطلقاء»", "«الآن حمي الوطيس»"], "answer": "«اذهبوا فأنتم الطلقاء»", "answerIndex": 2, "explanation": "وقف النبي ﷺ على باب الكعبة، وقريش تنظر ما هو فاعل بها، فقال: «يا معشر قريش، ما تظنون أني فاعل بكم؟» قالوا خيرا؛ أخ كريم وابن أخ كريم، فقال رسول الله ﷺ: «اذهبوا فأنتم الطلقاء».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-489", "question": "ما نتائج الفتح الأعظم؟", "choices": ["انتشار الإسلام في بلاد الشام", "فتح بلاد فارس", "هجرة المسلمين إلى الحبشة", "القضاء على الوثنية والشرك في أغلب جزيرة العرب، والقضاء على الصراع بين القبائل فانصرفت الجهود إلى نشر الإسلام"], "answer": "القضاء على الوثنية والشرك في أغلب جزيرة العرب، والقضاء على الصراع بين القبائل فانصرفت الجهود إلى نشر الإسلام", "answerIndex": 3, "explanation": "من نتائج الفتح الأعظم: القضاء على الوثنية والشرك في أغلب جزيرة العرب، والقضاء على الصراع بين القبائل فانصرفت الجهود إلى نشر الإسلام.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-490", "question": "في أي شهر وسنة كانت غزوة حنين؟", "choices": ["رمضان 8 هـ", "10 من شوال 8 هـ", "جمادى الأولى 8 هـ", "المحرم 7 هـ"], "answer": "10 من شوال 8 هـ", "answerIndex": 1, "explanation": "غزوة حنين كانت في 10 من شوال 8 هـ / فبراير 630م، كما في عنوان الموضوع الرابع من وحدة السيرة في الكتاب المدرسي.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-491", "question": "ما سبب غزوة حنين؟", "choices": ["ضيق صدور أشراف هوازن وثقيف بالنصر الذي آتاه الله رسوله ﷺ والمؤمنين", "قتل الحارث بن عمير رسول النبي ﷺ إلى ملك بصرى", "اعتداء بني بكر على خزاعة", "ازدياد نقمة اليهود وتدبيرهم المؤامرات في خيبر"], "answer": "ضيق صدور أشراف هوازن وثقيف بالنصر الذي آتاه الله رسوله ﷺ والمؤمنين", "answerIndex": 0, "explanation": "حينما فتح الله تعالى على رسوله ﷺ مكة، وخضعت له قريش بعد بغيها وعدوانها، ضاقت صدور أشراف هوازن وثقيف بالنصر الذي آتاه الله عز وجل رسوله ﷺ والمؤمنين.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-492", "question": "من سيد هوازن الذي جمع هوازن وثقيف لحرب المسلمين في حنين؟", "choices": ["شرحبيل بن عمرو", "أبو سفيان بن حرب", "مالك بن عوف", "خالد بن الوليد"], "answer": "مالك بن عوف", "answerIndex": 2, "explanation": "خرجت هوازن وثقيف يتقدمهم مالك بن عوف سيد هوازن، الذي أمرهم أن يأتوا ومعهم أموالهم ونساؤهم وأبناؤهم، حتى نزلوا وادي أوطاس.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-493", "question": "لماذا أمر مالك بن عوف قومه أن يأتوا معهم بأموالهم ونسائهم وأبنائهم؟", "choices": ["ليخيفوا المسلمين بكثرتهم", "ليبيعوها في السوق", "ليحملوا عليها الغنائم", "حتى يمتنعوا عن الفرار ويدافعوا عن الأهل والمال والولد"], "answer": "حتى يمتنعوا عن الفرار ويدافعوا عن الأهل والمال والولد", "answerIndex": 3, "explanation": "أمرهم مالك بن عوف أن يأتوا ومعهم أموالهم ونساؤهم وأبناؤهم، وإنما أمرهم بذلك حتى يمتنعوا عن الفرار، ويدافعوا عن الأهل والمال والولد.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-494", "question": "أين نزلت هوازن وثقيف قبل غزوة حنين؟", "choices": ["وادي أوطاس", "وادي حنين", "مدينة معان", "مر الظهران"], "answer": "وادي أوطاس", "answerIndex": 0, "explanation": "خرجت هوازن وثقيف يتقدمهم مالك بن عوف، الذي أمرهم أن يأتوا ومعهم أموالهم ونساؤهم وأبناؤهم، حتى نزلوا وادي أوطاس.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-495", "question": "كم كان عدد جيش المسلمين في غزوة حنين؟", "choices": ["3000", "12000", "1600", "10000"], "answer": "12000", "answerIndex": 1, "explanation": "خرج رسول الله ﷺ للقتال في هذه المعركة، ومعه 12000 من المسلمين، 10000 من أهل المدينة، و2000 من أهل مكة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-496", "question": "ماذا قال المسلمون معجبين بكثرتهم قبل غزوة حنين؟", "choices": ["«إلي يا عباد الله، أنا النبي لا كذب، أنا ابن عبد المطلب»", "«الآن حمي الوطيس»", "«لن نغلب اليوم من قلة»", "«اذهبوا فأنتم الطلقاء»"], "answer": "«لن نغلب اليوم من قلة»", "answerIndex": 2, "explanation": "سار المسلمون معجبين بكثرتهم، فخورين بقوتهم قائلين: «لن نغلب اليوم من قلة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-497", "question": "على ماذا وقف النبي ﷺ ثابتا ينادي في الناس يوم حنين؟", "choices": ["على بغلة له بيضاء", "على ناقته", "على فرسه", "على راحلته"], "answer": "على بغلة له بيضاء", "answerIndex": 0, "explanation": "وقف رسول الله ﷺ ثابتا على بغلة له بيضاء ينادي في الناس ويحثهم على القتال في سبيل الله تعالى: «إلي يا عباد الله، أنا النبي لا كذب، أنا ابن عبد المطلب».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-498", "question": "بم نادى النبي ﷺ في الناس يوم حنين حين فر كثير من المسلمين؟", "choices": ["«الآن حمي الوطيس»", "«لن نغلب اليوم من قلة»", "«يا قوم انطلقوا إنما هي إحدى الحسنيين، إما نصر وإما شهادة»", "«إلي يا عباد الله، أنا النبي لا كذب، أنا ابن عبد المطلب»"], "answer": "«إلي يا عباد الله، أنا النبي لا كذب، أنا ابن عبد المطلب»", "answerIndex": 3, "explanation": "وقف رسول الله ﷺ ثابتا على بغلة له بيضاء ينادي في الناس ويحثهم على القتال في سبيل الله تعالى: «إلي يا عباد الله، أنا النبي لا كذب، أنا ابن عبد المطلب»، فثبت المسلمون ورجعوا يقاتلون الكفار.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-499", "question": "ماذا قال النبي ﷺ حين أشرف ينظر إلى قتال المسلمين يوم حنين؟", "choices": ["«إلي يا عباد الله، أنا النبي لا كذب، أنا ابن عبد المطلب»", "«الآن حمي الوطيس»", "«لن نغلب اليوم من قلة»", "«اصنعوا لآل جعفر طعاما فقد أتاهم ما يشغلهم»"], "answer": "«الآن حمي الوطيس»", "answerIndex": 1, "explanation": "أخذ العباس بن عبد المطلب ينادي بأعلى صوته: يا أصحاب السمرة، فرجعوا يقاتلون الكفار، وكان النداء: يا للأنصار، وأشرف رسول الله ﷺ ينظر إلى قتالهم قائلا: «الآن حمي الوطيس»، ثم أخذ حصيات من الأرض فرمى بهن وجوه الكفار، فانهزموا وولوا هاربين.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 9, "subject": "السيرة", "id": "h26-g9-500", "question": "كم كانت غنائم المسلمين من الإبل في غزوة حنين؟", "choices": ["12000 من الإبل", "40000 من الإبل", "24000 من الإبل", "6000 من الإبل"], "answer": "24000 من الإبل", "answerIndex": 2, "explanation": "كانت غنائم المسلمين في غزوة حنين 24000 من الإبل، و40000 من الشياة، و40000 أوقية من الفضة، و6000 من الذراري والنساء، وأعطى رسول الله ﷺ أناسا يؤلف قلوبهم ليحسن إسلامهم.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%
