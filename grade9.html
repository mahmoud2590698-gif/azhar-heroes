تنة أركسوا فيها) 91 سورة النساء 2 (كلما دخلت أمة) 38 سورة الأعراف 3 (كلما جاء أمة) 44 سورة المؤمنون 4 (كلما ألقي فيها فوج) 8 سورة الملك»، والآية ﴿كل ما ردوا إلى الفتنة أركسوا فيها﴾ (النساء 91).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-577", "question": "ما حكم «بئس ما» في مواضع القرآن؟", "choices": ["موصولة في جميع مواضع القرآن", "مقطوعة في جميع مواضع القرآن", "تقطع في جميع مواضع القرآن عدا موضعين", "موصولة في جميع مواضع القرآن عدا موضعين"], "answer": "تقطع في جميع مواضع القرآن عدا موضعين", "answerIndex": 2, "explanation": "«تقطع (بئس) عن (ما) في جميع مواضع القرآن عدا موضعين هما: 1 (بئسما اشتروا به أنفسهم) 90 سورة البقرة 2 (بئسما خلفتموني) 150 سورة الأعراف».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-578", "question": "أي مما يأتي مثال على «بئس ما» المقطوعة؟", "choices": ["(بئسما اشتروا به أنفسهم) 90 سورة البقرة", "(فبئس ما يشترون) 187 سورة آل عمران", "(بئسما خلفتموني) 150 سورة الأعراف", "(قل بئسما يأمركم به إيمانكم) 93 سورة البقرة"], "answer": "(فبئس ما يشترون) 187 سورة آل عمران", "answerIndex": 1, "explanation": "«وما عدا ذلك فمقطوع مثل: 1 (فبئس ما يشترون) 187 سورة آل عمران 2 (لبئس ما كانوا يصنعون) 63 سورة المائدة»، أما «(بئسما اشتروا به أنفسهم) 90 سورة البقرة» و«(بئسما خلفتموني) 150 سورة الأعراف» فموصولتان، و«(قل بئسما يأمركم به إيمانكم) 93 سورة البقرة» مختلف فيه والعمل فيه على الوصل.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-579", "question": "ما حكم موضع «قل بئسما يأمركم به إيمانكم» (البقرة 93)؟", "choices": ["مقطوع بلا خلاف", "موصول بلا خلاف", "وقع فيه الخلاف والعمل فيه على القطع", "وقع فيه الخلاف والعمل فيه على الوصل"], "answer": "وقع فيه الخلاف والعمل فيه على الوصل", "answerIndex": 3, "explanation": "«ووقع الخلاف في موضع واحد والعمل فيه على الوصل: (قل بئسما يأمركم به إيمانكم) 93 سورة البقرة»، والآية ﴿قل بئسما يأمركم به إيمانكم﴾ (البقرة 93).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-580", "question": "في كم موضع قطعت «في ما» بلا خلاف؟", "choices": ["موضع واحد", "موضعان", "أربعة مواضع", "عشرة مواضع"], "answer": "موضع واحد", "answerIndex": 0, "explanation": "«تقطع (في) عن (ما) في موضع واحد بلا خلاف هو: (أتتركون في ما هاهنا آمنين) 146 سورة الشعراء»، والآية ﴿أتتركون في ما هاهنا آمنين﴾ (الشعراء 146).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-581", "question": "كم موضعا وقع الخلاف فيها في «في ما» وما العمل فيها؟", "choices": ["عشرة مواضع والعمل فيها على الوصل", "موضع واحد والعمل فيه على القطع", "عشرة مواضع والعمل فيها على القطع", "ثلاثة مواضع والعمل فيها على القطع"], "answer": "عشرة مواضع والعمل فيها على القطع", "answerIndex": 2, "explanation": "«ووقع الخلاف في عشرة مواضع والعمل فيها على القطع وهي: 1 (في ما فعلن في أنفسهن) 240 البقرة الموضع الثاني 2 (في ما آتاكم فاستبقوا الخيرات) 48 سورة المائدة»، والآية ﴿في ما فعلن في أنفسهن﴾ (البقرة 240) هي الموضع الثاني المختلف فيه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-582", "question": "ما مثال «في ما» الموصولة؟", "choices": ["﴿فيما فعلن في أنفسهن﴾", "﴿في ما فعلن في أنفسهن﴾", "﴿في ما آتاكم فاستبقوا الخيرات﴾", "﴿أتتركون في ما هاهنا آمنين﴾"], "answer": "﴿فيما فعلن في أنفسهن﴾", "answerIndex": 0, "explanation": "«وما عدا ذلك فموصول مثل: (في ما فعلن في أنفسهن) 234 البقرة الموضع الأول» — فالموضع الأول في البقرة 234 موصول ﴿فيما فعلن في أنفسهن﴾، أما الموضع الثاني في البقرة 240 فمقطوع ﴿في ما فعلن في أنفسهن﴾ والعمل فيه على القطع.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-583", "question": "ما حكم «أين ما» في مواضع القرآن؟", "choices": ["موصولة في جميع مواضع القرآن", "مقطوعة في جميع مواضع القرآن", "موصولة في جميع مواضع القرآن عدا موضعين", "تقطع في جميع مواضع القرآن عدا موضعين"], "answer": "تقطع في جميع مواضع القرآن عدا موضعين", "answerIndex": 3, "explanation": "«تقطع (أين) عن (ما) في جميع مواضع القرآن مثل: (أين ما تكونوا يأت بكم الله جميعا) 148 سورة البقرة عدا موضعين فبالوصل هما: 1 (فأينما تولوا فثم وجه الله) 115 سورة البقرة 2 (أينما يوجهه لا يأت بخير) 76 سورة النحل».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-584", "question": "أي مما يأتي مثال على «أين ما» الموصولة؟", "choices": ["﴿فأينما تولوا فثم وجه الله﴾", "﴿أين ما تكونوا يأت بكم الله جميعا﴾", "﴿أينما تكونوا يدرككم الموت﴾", "(أين ما كنتم تعبدون) 92 سورة الشعراء"], "answer": "﴿فأينما تولوا فثم وجه الله﴾", "answerIndex": 0, "explanation": "«1 (فأينما تولوا فثم وجه الله) 115 سورة البقرة» من الموضعين الموصولين، والآية ﴿فأينما تولوا فثم وجه الله﴾ (البقرة 115)، أما ﴿أين ما تكونوا يأت بكم الله جميعا﴾ فمقطوعة، و﴿أينما تكونوا يدرككم الموت﴾ و«(أين ما كنتم تعبدون) 92 سورة الشعراء» فمختلف فيهما والعمل فيهما على القطع.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-585", "question": "كم موضعا وقع الخلاف فيها في «أين ما» وما العمل فيها؟", "choices": ["ثلاثة مواضع والعمل فيها على الوصل", "موضعان والعمل فيهما على القطع", "ثلاثة مواضع والعمل فيها على القطع", "عشرة مواضع والعمل فيها على القطع"], "answer": "ثلاثة مواضع والعمل فيها على القطع", "answerIndex": 2, "explanation": "«ووقع الخلاف في ثلاثة مواضع والعمل فيها على القطع هي: 1 (أينما تكونوا يدرككم الموت) 78 سورة النساء 2 (أين ما كنتم تعبدون) 92 سورة الشعراء 3 (أين ما ثقفوا أخذوا) 61 سورة الأحزاب»، والآية ﴿أينما تكونوا يدرككم الموت﴾ (النساء 78).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-586", "question": "ما حكم «إن لم» مكسورة الهمزة في مواضع القرآن؟", "choices": ["تقطع في موضعين فقط", "موصولة في جميع مواضع القرآن", "تقطع في جميع مواضع القرآن بلا استثناء", "تقطع في جميع مواضع القرآن عدا موضعا واحدا"], "answer": "تقطع في جميع مواضع القرآن عدا موضعا واحدا", "answerIndex": 3, "explanation": "«تقطع (إن) مكسورة الهمزة ساكنة النون عن (لم) في جميع مواضع القرآن مثل: (فإن لم تفعلوا ولن تفعلوا) 24 سورة البقرة ما عدا موضع واحد فبالوصل وهو: (فإلم يستجيبوا لكم) 14 سورة هود».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-587", "question": "ما موضع وصل «إن لم» الوحيد؟", "choices": ["﴿فإن لم تفعلوا ولن تفعلوا﴾", "﴿ذلك أن لم يكن ربك مهلك القرى بظلم﴾", "﴿أن لن ينقلب الرسول﴾", "﴿فإلم يستجيبوا لكم﴾"], "answer": "﴿فإلم يستجيبوا لكم﴾", "answerIndex": 3, "explanation": "«ما عدا موضع واحد فبالوصل وهو: (فإلم يستجيبوا لكم) 14 سورة هود»، والآية ﴿فإلم يستجيبوا لكم﴾ (هود 14) — وفيها دُمجت «إن» و«لم» رسما فكتبتا «إلم».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-588", "question": "في كم موضع قطعت «أن لن»؟", "choices": ["في جميع مواضع القرآن عدا موضعين", "موضعان", "موضع واحد", "أربعة مواضع"], "answer": "في جميع مواضع القرآن عدا موضعين", "answerIndex": 0, "explanation": "«تقطع (أن) مفتوحة الهمزة ساكنة النون عن (لن) في جميع مواضع القرآن مثل: (أن لن ينقلب الرسول) 12 سورة الفتح عدا موضعين فبالوصل هما: (ألن نجعل لكم موعدا) 48 سورة الكهف (ألن نجمع عظامه) 3 سورة القيامة».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-589", "question": "أي مما يأتي مثال على «أن لن» الموصولة؟", "choices": ["﴿أن لن ينقلب الرسول﴾", "﴿فإلم يستجيبوا لكم﴾", "﴿ألن نجعل لكم موعدا﴾", "﴿أن لو نشاء أصبناهم﴾"], "answer": "﴿ألن نجعل لكم موعدا﴾", "answerIndex": 2, "explanation": "«(ألن نجعل لكم موعدا) 48 سورة الكهف» أحد الموضعين الموصولين، والآية ﴿ألن نجعل لكم موعدا﴾ (الكهف 48)، والموضع الثاني ﴿ألن نجمع عظامه﴾ (القيامة 3)، أما ﴿أن لن ينقلب الرسول﴾ فمقطوعة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-590", "question": "في كم موضع قطعت «أن لو»؟", "choices": ["موضعان", "في جميع مواضع القرآن", "موضع واحد", "أربعة مواضع"], "answer": "في جميع مواضع القرآن", "answerIndex": 1, "explanation": "«تقطع (أن) عن (لو) في جميع مواضع القرآن مثل: 1 (أن لو نشاء أصبناهم) 100 سورة الأعراف 2 (أن لو كانوا يعلمون الغيب) 14 سورة سبأ»، والآية ﴿أن لو نشاء أصبناهم﴾ (الأعراف 100).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-591", "question": "ما حكم موضع «أن لو استقاموا على الطريقة» (الجن 16)؟", "choices": ["مقطوع بلا خلاف", "موصول بلا خلاف", "وقع فيه الخلاف والعمل فيه على الوصل", "وقع فيه الخلاف والراجح فيه القطع"], "answer": "وقع فيه الخلاف والراجح فيه القطع", "answerIndex": 3, "explanation": "«ووقع الخلاف في موضع واحد والراجح فيه القطع وهو: (أن لو استقاموا على الطريقة) 16 سورة الجن»، والآية ﴿أن لو استقاموا على الطريقة﴾ (الجن 16).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-592", "question": "ما حكم «كي لا» في مواضع القرآن؟", "choices": ["تقطع في جميع مواضع القرآن", "موصولة في جميع مواضع القرآن", "تقطع في جميع مواضع القرآن عدا موضعين", "موصولة في جميع مواضع القرآن عدا أربعة مواضع"], "answer": "تقطع في جميع مواضع القرآن", "answerIndex": 0, "explanation": "«تقطع (كي) عن (لا) في جميع مواضع القرآن مثل: (كي لا يكون دولة) 7 سورة الحشر»، والآية ﴿كي لا يكون دولة﴾ (الحشر 7).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-593", "question": "كم موضعا وردت «كي لا» موصولة؟", "choices": ["موضعان", "موضع واحد", "أربعة مواضع", "عشرة مواضع"], "answer": "أربعة مواضع", "answerIndex": 2, "explanation": "«عدا أربعة مواضع فبالوصل: 1 (كيلا تحزنوا على ما فاتكم) 153 سورة آل عمران 2 (كيلا يعلم من بعد علم شيئا) 5 سورة الحج 3 (كيلا يكون عليك حرج) 50 سورة الأحزاب 4 (كيلا تأسوا على ما فاتكم) 23 سورة الحديد»، والآية ﴿كيلا تحزنوا على ما فاتكم﴾ (آل عمران 153).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-594", "question": "في كم موضع قطعت «عن من»؟", "choices": ["موضع واحد", "موضعان", "أربعة مواضع", "عشرة مواضع"], "answer": "موضعان", "answerIndex": 1, "explanation": "«تقطع (عن) عن (من) في موضعين هما: 1 (ويصرفه عن من يشاء) 43 سورة النور 2 (عن من تولى عن ذكرنا) 29 سورة النجم»، والآية ﴿ويصرفه عن من يشاء﴾ (النور 43).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-595", "question": "في كم موضع قطعت «يوم هم»؟", "choices": ["موضع واحد", "أربعة مواضع", "عشرة مواضع", "موضعان"], "answer": "موضعان", "answerIndex": 3, "explanation": "«تقطع (يوم) عن (هم) في موضعين هما: 1 (يوم هم بارزون) 16 سورة غافر 2 (يوم هم على النار يفتنون) 13 سورة الذاريات»، والآية ﴿يوم هم بارزون﴾ (غافر 16).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-596", "question": "ما مثال «يوم هم» الموصولة؟", "choices": ["﴿يومهم الذي يوعدون﴾", "﴿يوم هم بارزون﴾", "(يوم هم على النار يفتنون) 13 سورة الذاريات", "﴿مال هذا الكتاب﴾"], "answer": "﴿يومهم الذي يوعدون﴾", "answerIndex": 0, "explanation": "«وما عدا ذلك فموصول مثل: (يومهم الذي يوعدون) 42 سورة المعارج»، والآية ﴿يومهم الذي يوعدون﴾ (المعارج 42)، أما ﴿يوم هم بارزون﴾ و«(يوم هم على النار يفتنون) 13 سورة الذاريات» فمقطوعتان.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-597", "question": "في كم موضع قطعت «مال» عن مجرورها؟", "choices": ["موضع واحد", "موضعان", "أربعة مواضع", "عشرة مواضع"], "answer": "أربعة مواضع", "answerIndex": 2, "explanation": "«تقطع (مال) عن مجرورها في أربعة مواضع هي: 1 (مال هذا الكتاب) 49 سورة الكهف 2 (مال هذا الرسول) 7 سورة الفرقان 3 (فمال هؤلاء القوم) 78 سورة النساء 4 (فمال الذين كفروا) 36 سورة المعارج».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-598", "question": "أي مما يأتي من مواضع قطع «مال»؟", "choices": ["(وما لأحد عنده) 19 سورة الليل", "﴿مال هذا الكتاب﴾", "﴿يومهم الذي يوعدون﴾", "﴿ولات حين مناص﴾"], "answer": "﴿مال هذا الكتاب﴾", "answerIndex": 1, "explanation": "«1 (مال هذا الكتاب) 49 سورة الكهف»، والآية ﴿مال هذا الكتاب﴾ (الكهف 49)، أما «(وما لأحد عنده) 19 سورة الليل» فهي الموصولة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-599", "question": "في كم موضع قطعت «لات» عن «حين»؟", "choices": ["أربعة مواضع", "موضعان", "عشرة مواضع", "موضع واحد"], "answer": "موضع واحد", "answerIndex": 3, "explanation": "«تقطع (لات) عن (حين) في موضع واحد هو: (ولات حين مناص) 3 سورة ص»، والآية ﴿ولات حين مناص﴾ (ص 3).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "التجويد", "id": "h26-g9-600", "question": "ماذا قال ابن الجزري في «لات حين» في مصحف الإمام؟", "choices": ["«فاقطع بعشر كلمات أن لا»", "«ووزنوهن وكالوهم صل»", "«كذا من ال ويا وها لا تفصل»", "«تحين في الإمام صل ووهلا»"], "answer": "«تحين في الإمام صل ووهلا»", "answerIndex": 3, "explanation": "«ومال هذا والذين هؤلاء تحين في الإمام صل ووهلا» — أي أن «لات حين» موصولة في مصحف الإمام مع خلاف، وهي في المصاحف الأخرى مقطوعة في موضعها الواحد ﴿ولات حين مناص﴾ (ص 3).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/215697"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-601", "question": "ما معنى «السماحة» في اللغة كما عرفها الكتاب؟", "choices": ["العفو والمغفرة", "الكرم والجود", "اليسر والسهولة", "الشدة والغلظة"], "answer": "اليسر والسهولة", "answerIndex": 2, "explanation": "«السماحة ـ يا بني ـ في اللغة: اليسر والسهولة. وهي تعني التسامح مع الآخرين في المعاملة، مسلمين كانوا أو غير مسلمين».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-602", "question": "ما حكم اختلاف الناس في الأديان واللغات والألوان عند الكتاب؟", "choices": ["هو عقوبة من الله للناس", "هو أمر طارئ سينتهي قريبا", "هو من فعل الشيطان بالناس", "هو مشيئة الله وإرادته في خلقه"], "answer": "هو مشيئة الله وإرادته في خلقه", "answerIndex": 3, "explanation": "«وهذا التعدد والتنوع والاختلاف بين الناس في الأديان وفي اللغات وفي اللون وفي العرق ـ هو مشيئة الله وإرادته في خلقه»؛ قال تعالى: ﴿ولو شاء ربك لآمن من في الأرض كلهم جميعا﴾ (يونس 99).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-603", "question": "ما أول تعاليم الإسلام في معاملة أهل الأديان الأخرى؟", "choices": ["رفع شعار لا إكراه في الدين", "إجبار الناس على الإسلام", "منع غير المسلمين من شعائرهم", "مقاطعة أهل الأديان الأخرى"], "answer": "رفع شعار لا إكراه في الدين", "answerIndex": 0, "explanation": "«أول هذه التعاليم أن الإسلام رفع شعار لا إكراه في الدين»؛ قال تعالى: ﴿لا إكراه في الدين﴾ (البقرة 256).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-604", "question": "ما معنى «لا إكراه في الدين» كما بينه الكتاب؟", "choices": ["أن الإسلام كفل حرية التدين لكل فرد", "أن لكل دين أن يجبر أتباعه على تركه", "أن الإسلام أباح إكراه الناس على الخير", "أن الدخول في الإسلام يكون بالإجبار"], "answer": "أن الإسلام كفل حرية التدين لكل فرد", "answerIndex": 0, "explanation": "«معنى ذلك أن الإسلام كفل حرية التدين لكل فرد، فلا إكراه ولا إجبار لأحد على الدخول في الإسلام، وطريق الدخول في الإسلام هو القناعة التامة بهدايته».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-605", "question": "ما حكم إسلام من أكره على الدخول في الإسلام؟", "choices": ["يصح إسلامه بمجرد النطق مكرها", "لا يصح إسلامه حتى يوجد منه ما يدل على إسلامه", "يبطل إسلامه أبدا ولو أسلم بعدها طوعا", "يصح إسلامه إذا كان الإكراه من أبيه"], "answer": "لا يصح إسلامه حتى يوجد منه ما يدل على إسلامه", "answerIndex": 1, "explanation": "«والمقرر عند الفقهاء أنه لو أكره أحد على الدخول في الإسلام؛ فإنه لا يصح إسلامه حتى يوجد منه ما يدل على إسلامه».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-606", "question": "هل يجوز للحاكم المسلم أن يمنع غير المسلمين من ممارسة شعائرهم الدينية؟", "choices": ["نعم، إلا في أعيادهم", "نعم، إذا كانوا من أهل الكتاب", "نعم، له ذلك في كل حال", "لا، ليس له ذلك"], "answer": "لا، ليس له ذلك", "answerIndex": 3, "explanation": "«ليس للحاكم المسلم أن يمنع غير المسلمين من ممارسة شعائرهم الدينية الخاصة بهم»؛ وقد صلى وفد نجران في مسجد النبي ﷺ فقال: «دعوهم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-607", "question": "ماذا فعل النبي ﷺ حين جاء وفد نجران النصارى إلى مسجده وحان وقت صلاتهم؟", "choices": ["منعهم من الصلاة حتى يسلموا", "أمر بإخراجهم من المسجد", "قال: دعوهم، فاستقبلوا المشرق فصلوا صلاتهم", "أمرهم بالصلاة إلى القبلة"], "answer": "قال: دعوهم، فاستقبلوا المشرق فصلوا صلاتهم", "answerIndex": 2, "explanation": "«لقد قدم عليه في المدينة وفد نجران ـ وهم من النصارى ـ فدخلوا عليه مسجده بعد العصر، فحان وقت صلاتهم؛ فقاموا يصلون في مسجد الرسول ﷺ، فأراد الناس منعهم؛ فقال رسول الله ﷺ: دعوهم، فاستقبلوا المشرق فصلوا صلاتهم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-608", "question": "ما الآية التي استدل بها الكتاب على وجوب العدل مع غير المسلمين؟", "choices": ["﴿كونوا قوامين لله شهداء بالقسط﴾ (المائدة 8)", "﴿لا إكراه في الدين﴾ (البقرة 256)", "﴿ولتجدن أقربهم مودة﴾ (المائدة 82)", "﴿من قتل نفسا بغير نفس﴾ (المائدة 32)"], "answer": "﴿كونوا قوامين لله شهداء بالقسط﴾ (المائدة 8)", "answerIndex": 0, "explanation": "«فالأمر بالعدل بين الناس جميعا دون النظر إلى أديانهم أو أجناسهم»؛ قال تعالى: ﴿كونوا قوامين لله شهداء بالقسط ولا يجرمنكم شنآن قوم على ألا تعدلوا اعدلوا هو أقرب للتقوى﴾ (المائدة 8).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-609", "question": "ما حكم الإسلام في البر والإحسان إلى غير المسلمين الذين لا يقاتلون المسلمين؟", "choices": ["نهى عنه مطلقا", "أباحه للمسلمين فقط", "أوجبه على غير المسلمين فقط", "أمر به، قال تعالى: ﴿لا ينهاكم الله عن الذين لم يقاتلوكم في الدين ولم يخرجوكم من دياركم أن تبروهم وتقسطوا إليهم﴾"], "answer": "أمر به، قال تعالى: ﴿لا ينهاكم الله عن الذين لم يقاتلوكم في الدين ولم يخرجوكم من دياركم أن تبروهم وتقسطوا إليهم﴾", "answerIndex": 3, "explanation": "«أمر الإسلام بالإحسان إلى غير المسلمين الذين لا يبدون العداوة ولا يخالفون ولا يقاتلون»؛ قال تعالى: ﴿لا ينهاكم الله عن الذين لم يقاتلوكم في الدين ولم يخرجوكم من دياركم أن تبروهم وتقسطوا إليهم إن الله يحب المقسطين﴾ (الممتحنة 8).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-610", "question": "ما موقف الإسلام من صلة الأقربين من غير المسلمين؟", "choices": ["نهى عن صلتهم مطلقا", "أمر بمقاطعتهم حتى يسلموا", "أمر بصلة الأقربين من غير المسلمين والإنفاق عليهم وبرهم والإحسان إليهم", "أباح صلتهم دون الإنفاق عليهم"], "answer": "أمر بصلة الأقربين من غير المسلمين والإنفاق عليهم وبرهم والإحسان إليهم", "answerIndex": 2, "explanation": "«أمر الإسلام بصلة الأقربين من غير المسلمين والإنفاق عليهم وبرهم والإحسان إليهم»؛ قالت أسماء بنت أبي بكر: «إن أمي قدمت وهي راغبة ـ يعني في صلتي ـ أفأصلها؟ قال: نعم صلي أمك».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-611", "question": "ما حكم البيع والشراء مع غير المسلمين؟", "choices": ["يجوز الشراء منهم دون البيع لهم", "يجوز أن يبيع المسلم لهم وأن يشتري منهم", "حرام مطلقا", "يجوز البيع لهم دون الشراء منهم"], "answer": "يجوز أن يبيع المسلم لهم وأن يشتري منهم", "answerIndex": 1, "explanation": "«أباح الإسلام التعامل مع غير المسلمين في البيع والشراء»؛ «يجوز أن يبيع المسلم لهم وأن يشتري منهم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-612", "question": "ما حكم قبول هدية غير المسلم؟", "choices": ["جائز من أهل الكتاب فقط دون غيرهم", "جائز؛ فقد قبل رسول الله ﷺ هدية المقوقس صاحب مصر", "مكروه", "حرام مطلقا"], "answer": "جائز؛ فقد قبل رسول الله ﷺ هدية المقوقس صاحب مصر", "answerIndex": 1, "explanation": "«أباح للمسلم أن يقبل هديتهم؛ فقد قبل رسول الله ﷺ هدية المقوقس صاحب مصر».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-613", "question": "ماذا فعل النبي ﷺ حين مرض الغلام اليهودي الذي كان يخدمه؟", "choices": ["ترك عيادته لأنه يهودي", "دعا عليه بالمرض", "أتاه النبي ﷺ يعوده، فقال: أسلم", "أمر بإخراجه من المدينة"], "answer": "أتاه النبي ﷺ يعوده، فقال: أسلم", "answerIndex": 2, "explanation": "«أن غلاما ليهود كان يخدم النبي ﷺ فمرض، فأتاه النبي ﷺ يعوده، فقال: أسلم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-614", "question": "ما عقوبة من قتل معاهدا كما ورد في الحديث؟", "choices": ["يعاقب بالحبس شهرا", "لا عقوبة عليه", "لم يرح رائحة الجنة", "يعاقب بالجلد فقط"], "answer": "لم يرح رائحة الجنة", "answerIndex": 2, "explanation": "قال ﷺ: «من قتل معاهدا لم يرح رائحة الجنة»؛ و«شدد الوعيد وأغلظ في العقوبة لمن استباح حرمة دمائهم؛ أو تعرض لهم بالأذى».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-615", "question": "ما حكم قتل السائحين الذين يأتون لزيارة بلادنا؟", "choices": ["جائز", "مباح في حال الحرب فقط", "حرام شرعا؛ لأن تأشيرة الدخول التي يحصلون عليها بمثابة عهد أمان لهم", "واجب"], "answer": "حرام شرعا؛ لأن تأشيرة الدخول التي يحصلون عليها بمثابة عهد أمان لهم", "answerIndex": 2, "explanation": "«فإن قتل السائحين الذين يأتون لزيارة بلادنا جريمة نكراء، وذنب عظيم، وهو حرام شرعا؛ لأن تأشيرة الدخول التي يحصلون عليها بمثابة عهد أمان لهم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-616", "question": "ما علاقة الإسلام بالأديان السماوية السابقة؟", "choices": ["علاقة تضاد وتنافر مطلق", "جميع الأديان السماوية المنزلة من عند الله تعالى اسمها الإسلام، وهي ملة واحدة متحدة في العقيدة والأخلاق", "الإسلام نسخها فلا صلة به", "لا علاقة بينها"], "answer": "جميع الأديان السماوية المنزلة من عند الله تعالى اسمها الإسلام، وهي ملة واحدة متحدة في العقيدة والأخلاق", "answerIndex": 1, "explanation": "«فجميع الأديان السماوية المنزلة من عند الله تعالى اسمها الإسلام، وهي ملة واحدة متحدة في العقيدة والأخلاق، مختلفة في بعض الشرائع»؛ «فعلاقة الإسلام إذا بالأديان الأخرى علاقة الأخ بإخوته وأشقائه».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-617", "question": "ما علاقة القرآن بالكتب السماوية السابقة؟", "choices": ["علاقة تأييد وتصديق لها", "علاقة إنكار وتكذيب لها", "لا علاقة بينها", "القرآن نسخها فلا يصدقها"], "answer": "علاقة تأييد وتصديق لها", "answerIndex": 0, "explanation": "«فعلاقة القرآن بالكتب السابقة: علاقة تأييد وتصديق لها ولما تدعو إليه الناس من توحيد وأخلاق وأصول للشرائع»؛ «القرآن قد جاء مصدقا ومؤكدا لما قبله من الكتب في التشريعات التي لا تتغير ولا تتبدل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-618", "question": "بم شبه النبي ﷺ نفسه والأنبياء من قبله؟", "choices": ["كمثل رجل بنى بيتا فأحسنه وأجمله إلا موضع لبنة من زاوية؛ فأنا اللبنة وأنا خاتم النبيين", "كمثل رجل بنى قصرا بلا باب", "كمثل سفينة بلا شراع", "كمثل شجرة بلا ثمر"], "answer": "كمثل رجل بنى بيتا فأحسنه وأجمله إلا موضع لبنة من زاوية؛ فأنا اللبنة وأنا خاتم النبيين", "answerIndex": 0, "explanation": "«إن مثلي ومثل الأنبياء من قبلي؛ كمثل رجل بنى بيتا فأحسنه وأجمله إلا موضع لبنة من زاوية؛ فجعل الناس يطوفون به ويعجبون له ويقولون: هلا وضعت هذه اللبنة؟ قال: فأنا اللبنة وأنا خاتم النبيين»؛ قال تعالى: ﴿ما كان محمد أبا أحد من رجالكم ولكن رسول الله وخاتم النبيين﴾ (الأحزاب 40).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-619", "question": "ماذا كتب خالد بن الوليد في عقد الذمة للمسيحيين من أهل الحيرة؟", "choices": ["من كبر منهم أو أصابته آفة، أو كان غنيا فافتقر؛ طرحت جزيته، وعيل من بيت مال المسلمين وعياله", "يطرد الفقير من أرض الإسلام", "يمنع الفقير من بيت المال", "تضاعف الجزية على الفقير"], "answer": "من كبر منهم أو أصابته آفة، أو كان غنيا فافتقر؛ طرحت جزيته، وعيل من بيت مال المسلمين وعياله", "answerIndex": 0, "explanation": "«كتب خالد بن الوليد رضي الله عنه في عقد الذمة للمسيحيين من أهل الحيرة بالعراق: من كبر منهم أو أصابته آفة من الآفات، أو كان غنيا فافتقر، وصار أهل دينه يتصدقون عليه؛ طرحت جزيته، وعيل من بيت مال المسلمين وعياله»؛ «فالإسلام لا يرضى أن يذل رجل من المواطنين غير المسلمين».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-620", "question": "ما الذي تضمنته وثيقة المدينة في شأن اليهود؟", "choices": ["منع اليهود من التعامل مع المسلمين", "أن يعيش المسلمون واليهود معا، يتعايشون، ويتعاملون، ويدافعون عن المدينة ضد أي خطر خارجي", "إجبار اليهود على الإسلام", "إخراج اليهود من المدينة"], "answer": "أن يعيش المسلمون واليهود معا، يتعايشون، ويتعاملون، ويدافعون عن المدينة ضد أي خطر خارجي", "answerIndex": 1, "explanation": "«عاش فيه اليهود بعهد مع المسلمين أبرمه رسول الله ﷺ معهم، عرف بوثيقة المدينة. وقد تضمنت هذه الوثيقة أن يعيش المسلمون واليهود معا، يتعايشون، ويتعاملون، ويدافعون عن المدينة ضد أي خطر خارجي».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-621", "question": "ما تعريف «التطرف» كما ورد في الكتاب؟", "choices": ["الدعوة إلى الله بالحكمة", "مجاوزة حد التوسط والاعتدال في فهم الدين، والميل إلى التشدد والمبالغة", "الاعتدال في فهم الدين", "التمسك بالدين والعمل به"], "answer": "مجاوزة حد التوسط والاعتدال في فهم الدين، والميل إلى التشدد والمبالغة", "answerIndex": 1, "explanation": "«التطرف: معناه ـ يا حبيبتي ـ مجاوزة حد التوسط والاعتدال في فهم الدين، والميل إلى التشدد والمبالغة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-622", "question": "ما تعريف «الإرهاب» كما ورد في الكتاب؟", "choices": ["هو الدفاع عن النفس والأهل والوطن", "هو إقامة العدل بين الناس", "هو التخويف والتفزيع، واستخدام القوة الغاشمة", "هو الدعوة إلى الله بالحكمة"], "answer": "هو التخويف والتفزيع، واستخدام القوة الغاشمة", "answerIndex": 2, "explanation": "«والإرهاب: هو التخويف والتفزيع، واستخدام القوة الغاشمة، وهو وصف يطلق على الذين يسلكون سبل العنف والإرهاب لتحقيق أهداف سياسية أو دينية أو اقتصادية أو فكرية».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-623", "question": "ما الفرق بين الجهاد والإرهاب كما بينه الكتاب؟", "choices": ["الجهاد هو الدفاع عن النفس والأهل والوطن، أما الإرهاب فهو إشاعة الخوف، وقتل الأبرياء، وسفك الدماء", "الجهاد للمسلمين والإرهاب لغيرهم", "لا فرق بينهما", "الجهاد هو قتل الأبرياء والإرهاب هو الدفاع عن الوطن"], "answer": "الجهاد هو الدفاع عن النفس والأهل والوطن، أما الإرهاب فهو إشاعة الخوف، وقتل الأبرياء، وسفك الدماء", "answerIndex": 0, "explanation": "«فالجهاد هو الدفاع عن النفس والأهل والوطن»؛ «أما الإرهاب فهو إشاعة الخوف، وقتل الأبرياء، وسفك الدماء التي حرم الله، والإفساد في الأرض»؛ قال تعالى: ﴿أذن للذين يقاتلون بأنهم ظلموا وإن الله على نصرهم لقدير﴾ (الحج 39).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-624", "question": "بم أذن الله للمؤمنين في آية سورة الحج التي استدل بها الكتاب على الجهاد؟", "choices": ["﴿أذن للذين يقاتلون بأنهم ظلموا﴾", "﴿من قتل نفسا بغير نفس﴾", "﴿لا إكراه في الدين﴾", "﴿إنما جزاء الذين يحاربون الله ورسوله﴾"], "answer": "﴿أذن للذين يقاتلون بأنهم ظلموا﴾", "answerIndex": 0, "explanation": "«فالجهاد هو الدفاع عن النفس والأهل والوطن»؛ قال تعالى: ﴿أذن للذين يقاتلون بأنهم ظلموا وإن الله على نصرهم لقدير﴾ (الحج 39).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-625", "question": "ما أول جريمة قتل وقعت على الأرض كما ذكر الكتاب؟", "choices": ["قتل قوم نوح نبيهم", "قتل أحد ابني آدم أخاه", "قتل فرعون بني إسرائيل", "قتل قابيل أباه"], "answer": "قتل أحد ابني آدم أخاه", "answerIndex": 1, "explanation": "«وأول جريمة قتل وقعت على الأرض هي قتل أحد ابني آدم أخاه»؛ قال تعالى: ﴿لئن بسطت إلي يدك لتقتلني ما أنا بباسط يدي إليك لأقتلك﴾ (المائدة 28)؛ «فكان أول قاتل وإرهابي على وجه الأرض».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-626", "question": "ما حكم مقولة «الإرهاب صناعة إسلامية» كما قرر الكتاب؟", "choices": ["هذا خطأ يسير", "هذا رأي معتبر", "هذا خطأ فادح؛ فالإسلام دين البر والرحمة والسماحة", "هذا صحيح"], "answer": "هذا خطأ فادح؛ فالإسلام دين البر والرحمة والسماحة", "answerIndex": 2, "explanation": "«هذا خطأ فادح ـ يا بني ـ يردده كثير من الغربيين؛ لجهلهم بالإسلام وتعاليمه؛ فالإسلام دين البر والرحمة والسماحة»؛ «وهو يرفض التطرف والإرهاب بكل صوره وأشكاله رفضا قاطعا؛ لأنه عدوان، والله لا يحب المعتدين».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-627", "question": "ما عقوبة الذين يحاربون الله ورسوله ويسعون في الأرض فسادا كما في آية المائدة؟", "choices": ["أن يحبسوا شهرا", "أن يغرموا مالا", "أن يجلدوا مئة جلدة", "﴿أن يقتلوا أو يصلبوا أو تقطع أيديهم وأرجلهم من خلاف أو ينفوا من الأرض﴾"], "answer": "﴿أن يقتلوا أو يصلبوا أو تقطع أيديهم وأرجلهم من خلاف أو ينفوا من الأرض﴾", "answerIndex": 3, "explanation": "قال تعالى: ﴿إنما جزاء الذين يحاربون الله ورسوله ويسعون في الأرض فسادا أن يقتلوا أو يصلبوا أو تقطع أيديهم وأرجلهم من خلاف أو ينفوا من الأرض﴾ (المائدة 33)؛ «حارب الإسلام التطرف والإرهاب، فقرر لكل جريمة عقوبة تناسب مرتكبها لكي يقضي عليها في مهدها، ويطهر المجتمع من شرها».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-628", "question": "ما جزاء من قتل نفسا بغير نفس أو فساد في الأرض كما في آية المائدة؟", "choices": ["فكأنما قتل نفسه فقط", "فكأنما أحيا الناس جميعا", "فلا جزاء عليه", "فكأنما قتل الناس جميعا"], "answer": "فكأنما قتل الناس جميعا", "answerIndex": 3, "explanation": "قال تعالى: ﴿من قتل نفسا بغير نفس أو فساد في الأرض فكأنما قتل الناس جميعا ومن أحياها فكأنما أحيا الناس جميعا﴾ (المائدة 32).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-629", "question": "هل التطرف والإرهاب ظاهرة حديثة كما يعتقد بعض الناس؟", "choices": ["نعم؛ ظهرت مع الحروب الحديثة", "نعم؛ ظهرت في عصرنا فقط", "لا؛ لم تظهر إلا بعد القرن العشرين", "لا؛ ظاهرة قديمة ليست حديثة"], "answer": "لا؛ ظاهرة قديمة ليست حديثة", "answerIndex": 3, "explanation": "«مع أن التطرف والإرهاب ظاهرة نمت مداها في عالمنا المعاصر، إلا أنها ظاهرة قديمة ليست حديثة كما يعتقد بعض الناس».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-630", "question": "على ماذا يحرص الإسلام في مواجهة التطرف والإرهاب؟", "choices": ["على عزل المسلمين عن غيرهم", "على إهمال الظاهرة وتركها", "على تشجيع العنف ضد المخالفين", "على ترسيخ أسس السلام والاستقرار والأمن والأمان؛ ويحارب التطرف والإرهاب"], "answer": "على ترسيخ أسس السلام والاستقرار والأمن والأمان؛ ويحارب التطرف والإرهاب", "answerIndex": 3, "explanation": "«وهكذا يا أولادي يحرص الإسلام على ترسيخ أسس السلام والاستقرار والأمن والأمان؛ ويحارب التطرف والإرهاب».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-631", "question": "من هو الإمام الأشعري؟", "choices": ["العلامة أبو الحسن علي بن إسماعيل بن أبي بشر", "أبو الحسن علي بن أبي طالب", "أبو موسى الأشعري الصحابي الجليل", "أبو الحسن الشاذلي"], "answer": "العلامة أبو الحسن علي بن إسماعيل بن أبي بشر", "answerIndex": 0, "explanation": "«الإمام الأشعري يا بني هو العلامة أبو الحسن علي بن إسماعيل بن أبي بشر، وبالفعل يرجع نسبه إلى سيدنا أبي موسى الأشعري الصحابي الجليل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-632", "question": "متى ولد الإمام الأشعري وأين، ومتى توفي وأين؟", "choices": ["ولد ببغداد عام 260هـ، وتوفي بالبصرة عام 324هـ", "ولد بالبصرة عام 260هـ، وتوفي في بغداد عام 324هـ", "ولد بالقاهرة عام 260هـ، وتوفي بدمشق عام 324هـ", "ولد بمكة عام 150هـ، وتوفي بالمدينة عام 204هـ"], "answer": "ولد بالبصرة عام 260هـ، وتوفي في بغداد عام 324هـ", "answerIndex": 1, "explanation": "«وقد ولد بالبصرة عام مئتين وستين من الهجرة (260هـ)، وتوفي ـ رحمه الله تعالى ـ في بغداد عام ثلاث مئة وأربعة وعشرين من الهجرة (324هـ)»؛ «عاش الإمام الأشعري بين القرنين الثالث والرابع من الهجرة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-633", "question": "ما وصف مذهب الإمام الأشعري في العقيدة؟", "choices": ["مذهبا جديدا خالف السلف", "مذهب الخوارج", "تقريرا وتوضيحا لمذهب أهل السنة والجماعة", "مذهب المعتزلة"], "answer": "تقريرا وتوضيحا لمذهب أهل السنة والجماعة", "answerIndex": 2, "explanation": "«كان مذهبه في العقيدة تقريرا وتوضيحا لمذهب أهل السنة والجماعة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-634", "question": "من أشهر مؤلفات الإمام الأشعري؟", "choices": ["تفسير الطبري وتفسير القرطبي", "إحياء علوم الدين والرسالة القشيرية", "الإبانة عن أصول الديانة، واللمع في الرد على أهل الزيغ والبدع", "صحيح البخاري وصحيح مسلم"], "answer": "الإبانة عن أصول الديانة، واللمع في الرد على أهل الزيغ والبدع", "answerIndex": 2, "explanation": "«وله مؤلفات كثيرة في علوم الإسلام، منها الإبانة عن أصول الديانة، واللمع في الرد على أهل الزيغ والبدع، ورسالة استحسان الخوض في علم الكلام».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-635", "question": "لماذا انتسب أهل السنة إلى الإمام الأشعري دون غيره من علماء السلف؟", "choices": ["لأنه ألف أكثر الكتب", "لاشتهاره بين الأمة بالحرص على إظهار عقيدة السلف، في وقت انتشرت فيه المذاهب المغايرة", "لأنه أول من تكلم في العقيدة", "لأنه من الصحابة"], "answer": "لاشتهاره بين الأمة بالحرص على إظهار عقيدة السلف، في وقت انتشرت فيه المذاهب المغايرة", "answerIndex": 1, "explanation": "«لكن أهل السنة انتسبوا إليه ولم ينتسبوا إلى غيره؛ لاشتهاره بين الأمة بالحرص على إظهار عقيدة السلف، في وقت انتشرت فيه المذاهب المغايرة والمخالفة لها»؛ «فقام بالرد عليهم وبيان فساد مذهبهم بالأدلة والحجج العقلية».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-636", "question": "هل قدم الإمام الأشعري للناس عقيدة جديدة من عنده؟", "choices": ["نعم؛ ألف عقيدة جديدة", "نعم؛ خالف هدي النبي ﷺ", "لا؛ كان ما فعله تسجيلا وتقريرا وتدوينا لما كان عليه رسول الله ﷺ وصحابته والسلف الأوائل", "نعم؛ ابتدع مذهبا لم يكن معروفا"], "answer": "لا؛ كان ما فعله تسجيلا وتقريرا وتدوينا لما كان عليه رسول الله ﷺ وصحابته والسلف الأوائل", "answerIndex": 2, "explanation": "«فالإمام الأشعري لم يقدم للناس عقيدة جديدة من عنده لم تكن على هدي النبي صلى الله عليه وسلم، وصحابته رضوان الله عليهم، وإنما كان ما فعله تسجيلا وتقريرا وتدوينا لما كان عليه رسول الله صلى الله عليه وسلم وصحابته والسلف الأوائل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-637", "question": "من أشهر أئمة الأشاعرة في علم العقيدة وأصول الفقه؟", "choices": ["البخاري ومسلم", "مالك والشافعي", "الباقلاني والجويني والغزالي والرازي", "ابن تيمية وابن القيم"], "answer": "الباقلاني والجويني والغزالي والرازي", "answerIndex": 2, "explanation": "«فمنهم من برع في علم العقيدة وعلم أصول الفقه مثل: الباقلاني والجويني والغزالي والرازي وغيرهم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-638", "question": "من أشهر أئمة الأشاعرة في الحديث وعلومه؟", "choices": ["سيبويه والخليل بن أحمد", "الحاكم النيسابوري والبيهقي والنووي وابن حجر العسقلاني والسيوطي", "الجاحظ وابن خلدون", "الطبري والقرطبي وابن عطية"], "answer": "الحاكم النيسابوري والبيهقي والنووي وابن حجر العسقلاني والسيوطي", "answerIndex": 1, "explanation": "«ومنهم من برع في الحديث وعلومه مثل: الحاكم النيسابوري والبيهقي والنووي والعز بن عبد السلام وابن حجر العسقلاني والسيوطي»؛ «ونلاحظ يا بني أن المسلمين على طول التاريخ تعلموا صحيح البخاري ومسلم، وغيرهما، من الشراح الأشاعرة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-639", "question": "ما وسطية المذهب الأشعري كما وصفها الكتاب؟", "choices": ["مذهب وسط بين المذاهب كلها، وهو على منهج السلف الصالح، فلا إفراط فيه ولا تفريط", "يرفض العقل والنقل معا", "يميل إلى العقل على حساب النص", "ينحاز لظاهر النص على حساب العقل"], "answer": "مذهب وسط بين المذاهب كلها، وهو على منهج السلف الصالح، فلا إفراط فيه ولا تفريط", "answerIndex": 0, "explanation": "«لأن المذهب الأشعري مذهب وسط بين المذاهب كلها، وهو على منهج السلف الصالح، فلا إفراط فيه ولا تفريط»؛ «فالأشاعرة لا يميلون إلى العقل على حساب النص، ولا ينحازون لظاهر النص على حساب العقل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-640", "question": "ما موقف الأزهر الشريف من المذهب الأشعري؟", "choices": ["تركه الأزهر منذ قرن", "رفضه الأزهر", "تبناه أزهرنا الشريف على مر عقوده المزهرة عقيدة وسلوكا", "لم يدرسه الأزهر أبدا"], "answer": "تبناه أزهرنا الشريف على مر عقوده المزهرة عقيدة وسلوكا", "answerIndex": 2, "explanation": "«وهكذا يا أحبابي كتب لهذا المذهب البقاء إلى يومنا هذا، وتبناه أزهرنا الشريف على مر عقوده المزهرة عقيدة وسلوكا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-641", "question": "من سيكون أقرب المسلمين من النبي ﷺ يوم القيامة؟", "choices": ["أطولهم عمرا", "أكثرهم مالا", "أقواهم جسدا", "أحسن الناس أخلاقا"], "answer": "أحسن الناس أخلاقا", "answerIndex": 3, "explanation": "«إنهم أحسن الناس أخلاقا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-642", "question": "أيكون المؤمن كذابا؟", "choices": ["لا", "نعم إذا كان مزاحا", "نعم", "نعم إذا كان مضطرا"], "answer": "لا", "answerIndex": 0, "explanation": "«إن نبينا ﷺ عندما سئل: أيكون المؤمن بخيلا؟ قال: نعم، وسئل: أيكون المؤمن جبانا؟ قال: نعم، ولكن لما سئل: أيكون المؤمن كذابا؟ قال: لا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-643", "question": "ما جزاء من يصدق ويتحرى الصدق كما في الحديث؟", "choices": ["حتى يكتب عند الله غنيا", "حتى يكتب عند الله عالما", "حتى يكتب عند الله شهيدا", "حتى يكتب عند الله صديقا"], "answer": "حتى يكتب عند الله صديقا", "answerIndex": 3, "explanation": "«عليكم بالصدق فإن الصدق يهدي إلى البر، وإن البر يهدي إلى الجنة، وما يزال الرجل يصدق ويتحرى الصدق حتى يكتب عند الله صديقا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-644", "question": "ما حكم «كذبة أبريل» كما قرر الكتاب؟", "choices": ["مكروهة فقط", "الكذب حرام في أبريل وغيره، وفي الجد والمزاح", "حرام في الجد دون المزاح", "جائزة لأنها مزاح"], "answer": "الكذب حرام في أبريل وغيره، وفي الجد والمزاح", "answerIndex": 1, "explanation": "«الكذب حرام في أبريل وغيره، وفي الجد والمزاح، والإسلام وإن أجاز الدعابة، والضحك والمزاح، لكنه لا يجيز الكذب وسيلة لذلك»؛ قال ﷺ: «ويل للذي يحدث فيكذب، ليضحك القوم، ويل له، ويل له».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-645", "question": "في أي المواضع يسوغ الكذب كما ذكر الكتاب؟", "choices": ["في المزاح مع الأصدقاء", "في البيع والشراء", "في مدح النفس", "للإصلاح بين المتخاصمين، وفي الحرب، وفي مداعبة الزوج لزوجته"], "answer": "للإصلاح بين المتخاصمين، وفي الحرب، وفي مداعبة الزوج لزوجته", "answerIndex": 3, "explanation": "«إنه يسوغ للإصلاح بين المتخاصمين تأليفا للقلوب، وفي الحرب، حتى لا يطلع عدونا على أسرار مواقعنا الحصينة، وفي مداعبة الزوج لزوجته كأن يعدها بالهدايا الثمينة، ويذكر لها أنها أجمل النساء».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-646", "question": "ما تعريف الحياء والعفة كما ورد في الكتاب؟", "choices": ["الحياء: الخوف من الناس، والعفة: ترك الزواج", "الحياء: كثرة الكلام، والعفة: قلة الطعام", "الحياء: إظهار الزينة، والعفة: حب المال", "الحياء: انقباض نفسي يحصل للإنسان من خوف ما يذم عليه شرعا، والعفة: ضبط النفس عند الشهوات المحرمة"], "answer": "الحياء: انقباض نفسي يحصل للإنسان من خوف ما يذم عليه شرعا، والعفة: ضبط النفس عند الشهوات المحرمة", "answerIndex": 3, "explanation": "«الحياء معناه: انقباض نفسي يحصل للإنسان من خوف ما يذم عليه شرعا»؛ «والعفة: ضبط النفس عند الشهوات المحرمة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-647", "question": "ما حكم ارتداء المرأة النقاب كما قرر الكتاب؟", "choices": ["أباح الإسلام إظهار الوجه دون الكفين", "أوجب الإسلام النقاب على كل امرأة", "حرم الإسلام إظهار الوجه والكفين", "الإسلام أباح للمرأة أن تظهر وجهها وكفيها، ولم يوجب عليها ارتداء النقاب"], "answer": "الإسلام أباح للمرأة أن تظهر وجهها وكفيها، ولم يوجب عليها ارتداء النقاب", "answerIndex": 3, "explanation": "«أولا: الإسلام أباح للمرأة أن تظهر وجهها وكفيها، ولم يوجب عليها ارتداء النقاب».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-648", "question": "في كم وقتا شرع الإسلام آداب الاستئذان داخل البيوت بين أفراد الأسرة؟", "choices": ["في أوقات ثلاثة ذكرها القرآن الكريم", "في وقتين", "في خمسة أوقات", "في وقت واحد"], "answer": "في أوقات ثلاثة ذكرها القرآن الكريم", "answerIndex": 0, "explanation": "«لقد شرع آداب الاستئذان داخل البيوت بين أفراد الأسرة في أوقات ثلاثة ذكرها القرآن الكريم»؛ قال تعالى: ﴿يا أيها الذين آمنوا ليستأذنكم الذين ملكت أيمانكم والذين لم يبلغوا الحلم منكم ثلاث مرات﴾ (النور 58).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-649", "question": "كم مرة يستأذن من أراد دخول بيت، ثم يرجع إن لم يؤذن له؟", "choices": ["خمس مرات", "عشر مرات", "مرة واحدة", "ثلاث مرات؛ قال رسول الله ﷺ: إذا استأذن أحدكم ثلاثا فلم يؤذن له فليرجع"], "answer": "ثلاث مرات؛ قال رسول الله ﷺ: إذا استأذن أحدكم ثلاثا فلم يؤذن له فليرجع", "answerIndex": 3, "explanation": "«لا تستأذن أكثر من ثلاث مرات إذا علمت أن من في البيت قد علم بك. قال رسول الله ﷺ: إذا استأذن أحدكم ثلاثا فلم يؤذن له فليرجع»؛ قال تعالى: ﴿وإن قيل لكم ارجعوا فارجعوا هو أزكى لكم﴾ (النور 28).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "الثقافة الإسلامية", "id": "h26-g9-650", "question": "ما الحياء المذموم كما بينه الكتاب؟", "choices": ["الحياء من الكذب", "الحياء الذي يمنع صاحبه من أداء واجب شرعي، أو يدفعه إلى فعل أمر محرم", "الحياء من إيذاء الناس", "الحياء من ارتكاب المعصية"], "answer": "الحياء الذي يمنع صاحبه من أداء واجب شرعي، أو يدفعه إلى فعل أمر محرم", "answerIndex": 1, "explanation": "«إن الحياء الذي يمنع صاحبه من أداء واجب شرعي، أو يدفعه إلى فعل أمر محرم ليس حياء، بل هو أمر مذموم، فمن استحيا أن يؤدي الصلاة الواجبة بسبب ضيوف، حتى فات وقتها، ليس حييا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2025/prep/prep3/%D8%A7%D9%84%D8%AB%D9%82%D8%A7%D9%81%D8%A9%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%D9%8A%D8%A9.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-651", "question": "ما تعريف «المنادى» كما عرفه الكتاب؟", "choices": ["الاسم المرفوع في أول الجملة", "الفعل الذي يدل على الطلب", "المطلوب إقباله بواسطة حرف من أحرف النداء", "الحرف الذي يجر الاسم"], "answer": "المطلوب إقباله بواسطة حرف من أحرف النداء", "answerIndex": 2, "explanation": "«أن المنادى هو: المطلوب إقباله بواسطة حرف من أحرف النداء وهي: يا، وأيا، وهيا، وأي، والهمزة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-652", "question": "ما أدوات النداء الخمسة؟", "choices": ["يا، وأيا، وهيا، وأي، والهمزة", "يا، ولن، وكي، وأن، وإذن", "يا، وأيا، وهيا، ولما، ولم", "يا، وإن، وإذما، ومن، وما"], "answer": "يا، وأيا، وهيا، وأي، والهمزة", "answerIndex": 0, "explanation": "«وأدوات النداء هي: يا، وأيا، وهيا، وأي، والهمزة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-653", "question": "متى يبنى المنادى على ما يرفع به؟", "choices": ["إذا كان مثنى أو جمعًا دائمًا", "إذا كان نكرة غير مقصودة", "إذا كان مضافًا أو شبيهًا بالمضاف", "إذا كان مفردًا علمًا، أو مفردًا نكرة مقصودة ولم توصف"], "answer": "إذا كان مفردًا علمًا، أو مفردًا نكرة مقصودة ولم توصف", "answerIndex": 3, "explanation": "«يبنى المنادى على ما يرفع به في حالتين: (أ) إذا كان مفردًا علمًا. (ب) إذا كان مفردًا نكرة مقصودة، ولم توصف النكرة، فإن وصفت فالنصب أولى».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-654", "question": "متى يعرب المنادى، أي: يكون منصوبًا؟", "choices": ["إذا سبقته همزة الاستفهام", "إذا كان مفردًا علمًا أو نكرة مقصودة", "إذا كان مضافًا، أو شبيهًا بالمضاف، أو نكرة غير مقصودة", "إذا كان مثنى أو جمع مذكر سالمًا"], "answer": "إذا كان مضافًا، أو شبيهًا بالمضاف، أو نكرة غير مقصودة", "answerIndex": 2, "explanation": "«يعرب المنادى -أي: يكون منصوبًا- في ثلاث حالات: (أ) إذا كان مضافًا. (ب) إذا كان شبيهًا بالمضاف. (ج) إذا كان نكرة غير مقصودة، أي: التي لم يقصد بها معين».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-655", "question": "ما نوع المنادى وحكمه في قولنا: «يا سعيد تأدب»؟", "choices": ["نكرة غير مقصودة منصوبة", "مفرد علم مبني على الضم", "مضاف منصوب بالفتحة", "شبيه بالمضاف منصوب"], "answer": "مفرد علم مبني على الضم", "answerIndex": 1, "explanation": "«يا سعيد تأدب: مفرد علم، البناء على الضم»؛ لأن «كل منادى مفرد علم فهو يبنى على ما يرفع به».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-656", "question": "ما نوع المنادى في قولنا: «يا طيبًا عنصره لا تبخل»؟ ولماذا؟", "choices": ["مضاف؛ لأنه أضيف إلى ما بعده", "شبيه بالمضاف؛ لأن المتمم لمعناه مرفوع على أنه فاعل", "مفرد علم؛ لأنه اسم شخص", "نكرة مقصودة؛ لأنه قصد بها معين"], "answer": "شبيه بالمضاف؛ لأن المتمم لمعناه مرفوع على أنه فاعل", "answerIndex": 1, "explanation": "«والشبيه بالمضاف هو ما اتصل به شيء من تمام معناه، والمتمم لمعناه إما مرفوع على أنه فاعل نحو: يا طيبًا عنصره، أو منصوب على أنه مفعول به نحو: يا قارئًا كتابًا، أو مخفوض نحو: يا بخيلًا بماله».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-657", "question": "ما حكم المنادى النكرة المقصودة إذا وُصفت؟", "choices": ["يترجح بناؤها على نصبها", "تنصب وجوبًا بلا ترجيح", "تبنى على الضم وجوبًا", "يترجح نصبها على بنائها"], "answer": "يترجح نصبها على بنائها", "answerIndex": 3, "explanation": "«فإن وصفت ترجح نصبها، على ضمها، نحو: يا رجلًا عظيمًا يرجى لكل عظيم»؛ ومثله: «يا تلميذًا مجتهدًا أنصت».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-658", "question": "ما إعراب «أي» في قوله تعالى: ﴿يا أيها الإنسان ما غرك بربك الكريم﴾؟", "choices": ["فاعل مرفوع بالضمة", "مبتدأ مرفوع بالضمة", "منادى مبني على الضم، في محل نصب", "بدل مرفوع بالضمة"], "answer": "منادى مبني على الضم، في محل نصب", "answerIndex": 2, "explanation": "«أي: منادى مبني على الضم، في محل نصب»؛ و«ها: حرف زائد» و«الإنسان: بدل من أي مرفوع».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-659", "question": "ما حكم المنادى في قولنا: «يا سيبويه» و«يا حذام»؟", "choices": ["منصوب بالفتحة الظاهرة", "مبني على الكسر الظاهر", "مبني على ضم مقدر", "مبني على الضم الظاهر"], "answer": "مبني على ضم مقدر", "answerIndex": 2, "explanation": "«إذا كان المنادى المفرد العلم مبنيًا قبل النداء، نحو: سيبويه، وحذام، فإنه في حالة النداء يكون مبنيًا على ضم مقدر، يمنع من ظهوره البناء الأصلي، فتقول: يا سيبويه، ويا حذام، بالكسر فيهما لا غير».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-660", "question": "ما حروف الجر؟", "choices": ["من، وإلى، وعن، وعلى، وفي، ورب، والباء، والكاف، واللام، وأحرف القسم الواو والباء والتاء", "من، وإلى، وعن، وعلى، وفي، ولم، ولما، ولا، وإن", "من، وإلى، وعن، وعلى، وفي، ورب، والباء، والكاف، واللام فقط", "من، وإلى، وعن، وعلى، وفي، وأن، ولن، وكي، وإذن"], "answer": "من، وإلى، وعن، وعلى، وفي، ورب، والباء، والكاف، واللام، وأحرف القسم الواو والباء والتاء", "answerIndex": 0, "explanation": "«أن حروف الجر هي: من، وإلى، وعن، وعلى، وفي، ورب، والباء، والكاف، واللام، وأحرف القسم هي: الواو، والباء، والتاء».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-661", "question": "ما الحرفان اللذان يفيدان ابتداء الغاية وانتهاءها؟", "choices": ["من للابتداء، وإلى للانتهاء", "في للظرفية، ورب للتقليل", "عن للمجاوزة، وعلى للاستعلاء", "الباء للسببية، والكاف للتشبيه"], "answer": "من للابتداء، وإلى للانتهاء", "answerIndex": 0, "explanation": "«فـ(من) للابتداء، و(إلى) للانتهاء».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-662", "question": "ما معنى حرف الجر (عن) في قولنا: «ابتعدت عن الأشرار»؟", "choices": ["المجاوزة", "الاستعلاء", "الانتهاء", "الابتداء"], "answer": "المجاوزة", "answerIndex": 0, "explanation": "«ابتعدت عن الأشرار: عن للمجاوزة»؛ و«أن لكل حرف من حروف الجر معنى خاصًا به، فـ(من) للابتداء، و(إلى) للانتهاء، و(عن) للمجاوزة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-663", "question": "ما معنى حرف الجر (على) في قولنا: «صعدت على الهرم»؟", "choices": ["الظرفية", "الاستعلاء", "المجاوزة", "التقليل"], "answer": "الاستعلاء", "answerIndex": 1, "explanation": "«صعدت على الهرم: على للاستعلاء».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-664", "question": "ما معنى حرف الجر (رب) في قولنا: «رب مهمل يفوز»؟", "choices": ["الاستعلاء", "التعظيم", "التقليل", "التكثير"], "answer": "التقليل", "answerIndex": 2, "explanation": "«رب مهمل يفوز: رب للتقليل»؛ ومن تدريبات الكتاب: «رب حاجة مأمولة دنت بغير سعي: رب للتقليل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-665", "question": "ما معنى حرف الجر (الباء) في قولنا: «كل امرئ يكافأ بعمله»؟", "choices": ["الظرفية", "السببية", "الملك", "التشبيه"], "answer": "السببية", "answerIndex": 1, "explanation": "«كل امرئ يكافأ بعمله، ويعاقب بتقصيره: الباء في بعمله للسببية».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-666", "question": "ما معنى حرف الجر (الكاف) في قولنا: «الأطفال كالملائكة»؟", "choices": ["الملك", "السببية", "التشبيه", "المجاوزة"], "answer": "التشبيه", "answerIndex": 2, "explanation": "«الأطفال كالملائكة: الكاف للتشبيه».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-667", "question": "ما معنى حرف الجر (اللام) في قوله تعالى: ﴿لله ما في السماوات وما في الأرض﴾؟", "choices": ["التشبيه", "القسم", "السببية", "الملك"], "answer": "الملك", "answerIndex": 3, "explanation": "«قال تعالى: لله ما في السماوات وما في الأرض [البقرة 284]: اللام للملك».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-668", "question": "ما أحرف القسم؟", "choices": ["الباء، والتاء، ومن", "الواو، والتاء، وفي", "الواو، والباء، والفاء", "الواو، والباء، والتاء"], "answer": "الواو، والباء، والتاء", "answerIndex": 3, "explanation": "«وأحرف القسم هي: الواو، والباء، والتاء»؛ ومن أمثلتها: «والله لأقولن الحق» و«بالله لن أخالفك» و«وتالله لأكيدن أصنامكم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-669", "question": "ما عامل الجر في المضاف إليه؟", "choices": ["المضاف إليه نفسه", "الفعل قبله", "حرف الجر", "المضاف"], "answer": "المضاف", "answerIndex": 3, "explanation": "«أن عامل الجر في المضاف إليه هو المضاف».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-670", "question": "ما أنواع الإضافة بين الكلمتين؟", "choices": ["إضافة على معنى من فقط", "إضافة على معنى الباء، وإضافة على معنى الكاف، وإضافة على معنى عن", "إضافة على معنى اللام فقط", "إضافة على معنى اللام، وإضافة على معنى من، وإضافة على معنى في"], "answer": "إضافة على معنى اللام، وإضافة على معنى من، وإضافة على معنى في", "answerIndex": 3, "explanation": "«أن الإضافة بين الكلمتين على ثلاثة أنواع: (أ) إضافة على معنى (اللام) إذا كان المضاف ملكًا للمضاف إليه أو مختصًا به. (ب) إضافة على معنى (من) إذا كان المضاف بعضًا من المضاف إليه وصح الإخبار بالمضاف إليه عن المضاف. (ج) إضافة على معنى (في) إذا كان المضاف إليه ظرفًا -زمان أو مكان- للمضاف».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-671", "question": "متى تكون الإضافة بمعنى (اللام)؟", "choices": ["إذا كان المضاف فعلًا والمضاف إليه فاعلًا", "إذا كان المضاف بعضًا من المضاف إليه", "إذا كان المضاف ملكًا للمضاف إليه أو مختصًا به", "إذا كان المضاف إليه ظرفًا للمضاف"], "answer": "إذا كان المضاف ملكًا للمضاف إليه أو مختصًا به", "answerIndex": 2, "explanation": "«أن الإضافة في مثالي المجموعة الأولى على معنى: كتاب لمحمد، وطالب للعلم، فهي مقدرة باللام، ومعنى تقديرها باللام: أن المضاف ملك للمضاف إليه أو مختص به»؛ ومنها: «غلام زيد».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-672", "question": "متى تكون الإضافة بمعنى (من)؟", "choices": ["إذا كان المضاف بعضًا من المضاف إليه وصح الإخبار بالمضاف إليه عن المضاف", "إذا كان المضاف إليه ضميرًا متصلًا", "إذا كان المضاف ملكًا للمضاف إليه", "إذا كان المضاف إليه ظرفًا للمضاف"], "answer": "إذا كان المضاف بعضًا من المضاف إليه وصح الإخبار بالمضاف إليه عن المضاف", "answerIndex": 0, "explanation": "«أن الإضافة في مثالي المجموعة الثانية على معنى: ثوب من الحرير، وشجرتان من البرتقال، فهي مقدرة بـ(من)، ومعنى تقديرها بـ(من): أن المضاف بعض من المضاف إليه، ويصح الإخبار بالمضاف إليه عن المضاف»؛ ومنها: «خاتم فضة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-673", "question": "متى تكون الإضافة بمعنى (في)؟", "choices": ["إذا كان المضاف ملكًا للمضاف إليه", "إذا كان المضاف بعضًا من المضاف إليه", "إذا كان المضاف إليه ظرفًا للمضاف", "إذا كان المضاف ظرفًا للمضاف إليه"], "answer": "إذا كان المضاف إليه ظرفًا للمضاف", "answerIndex": 2, "explanation": "«أن الإضافة في مثالي المجموعة الثالثة على معنى: صوم في رمضان، وسهر في الليل، فهي مقدرة بفي، ومعنى تقديرها بـ(في): أن المضاف إليه ظرف للمضاف»؛ ومنها: «مكر الليل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-674", "question": "«شجرتا البرتقال مثمرتان» — الإضافة فيهما بمعنى ماذا؟", "choices": ["بمعنى (في)", "بمعنى (من)", "بمعنى (اللام)", "بمعنى (الباء)"], "answer": "بمعنى (من)", "answerIndex": 1, "explanation": "«شجرتا البرتقال مثمرتان: إضافة بمعنى (من)»؛ لأن المعنى: «شجرتان من البرتقال».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-675", "question": "عند قطع الإضافة في قولنا: «أحب مكارم الأخلاق» نقول؟", "choices": ["أحب مكارمَ للأخلاق", "أحب مكارمَ من الأخلاق", "أحب مكارمَ الأخلاقِ", "أحب مكارمَ في الأخلاق"], "answer": "أحب مكارمَ للأخلاق", "answerIndex": 0, "explanation": "«عند قطع الإضافة في قولنا: أحب مكارم الأخلاق نقول: أحب مكارمَ للأخلاق»؛ لأن الإضافة هنا بمعنى (اللام).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-676", "question": "ما إعراب «الموت» في قوله تعالى: ﴿وجاءت سكرة الموت بالحق﴾؟", "choices": ["مفعول به منصوب وعلامة نصبه الفتحة", "فاعل مرفوع وعلامة رفعه الضمة", "مضاف إليه مجرور وعلامة جره الكسرة الظاهرة", "بدل مجرور وعلامة جره الكسرة"], "answer": "مضاف إليه مجرور وعلامة جره الكسرة الظاهرة", "answerIndex": 2, "explanation": "«(سكرة): مضاف، و(الموت): مضاف إليه مجرور وعلامة جره الكسرة الظاهرة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-677", "question": "ما نواصب المضارع؟", "choices": ["أن، ولن، وإذن، وكي", "أن، ولن، وكي، ولا", "أن، ولن، وإذن، وحتى", "أن، ولن، ولم، ولما"], "answer": "أن، ولن، وإذن، وكي", "answerIndex": 0, "explanation": "«أن نواصب المضارع أربعة: -1 أن: وهي حرف مصدري، ونصب، واستقبال. -2 لن: وهي حرف نفي، ونصب، واستقبال. -3 إذن: وهي حرف جواب، وجزاء، ونصب. -4 كي: وهي حرف مصدري، ونصب».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-678", "question": "ما معنى (أن) الناصبة للمضارع؟", "choices": ["حرف مصدري ونصب واستقبال", "حرف جزم ونفي وقلب", "حرف جواب وجزاء ونصب", "حرف نفي ونصب واستقبال"], "answer": "حرف مصدري ونصب واستقبال", "answerIndex": 0, "explanation": "«(أن) حرف مصدري، ونصب، واستقبال»؛ ومثالها: «يريد الله أن يخفف عنكم [النساء 28]».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-679", "question": "ما معنى (لن) الناصبة للمضارع؟", "choices": ["حرف مصدري ونصب واستقبال", "حرف جواب وجزاء ونصب", "حرف نفي ونصب واستقبال", "حرف جر وتعليل"], "answer": "حرف نفي ونصب واستقبال", "answerIndex": 2, "explanation": "«(لن): حرف نفي، ونصب، واستقبال»؛ ومثالها: «لن تبلغ المجد إلا بالعمل: لن حرف نفي واستقبال».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-680", "question": "ما معنى (إذن) الناصبة للمضارع؟", "choices": ["حرف جر وتعليل", "حرف مصدري ونصب واستقبال", "حرف جواب وجزاء ونصب", "حرف نفي ونصب واستقبال"], "answer": "حرف جواب وجزاء ونصب", "answerIndex": 2, "explanation": "«(إذن): حرف جواب، وجزاء، ونصب»؛ ومثالها: «سأجتهد: إذن تفوز: إذن حرف جواب وجزاء».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-681", "question": "أي نواصب المضارع تعمل دون شرط، وأيها يعمل بشرط؟", "choices": ["كلها تعمل دون شرط", "دون شرط: إذن وكي؛ بشرط: أن ولن", "دون شرط: أن وإذن؛ بشرط: لن وكي", "ما يعمل دون شرط: أن ولن؛ وما يعمل بشرط: إذن وكي"], "answer": "ما يعمل دون شرط: أن ولن؛ وما يعمل بشرط: إذن وكي", "answerIndex": 3, "explanation": "«أن هذه الأحرف من حيث الشرط لعملها وعدمه قسمان: (أ) ما يعمل دون شرط، وهي: أن، ولن. (ب) ما يعمل بشرط، وهي: إذن، وكي».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-682", "question": "ما الشروط الثلاثة للنصب بـ(إذن)؟", "choices": ["أن تكون بعد نفي، وأن يكون الفعل بعدها أمرًا، وأن تكون في أول الكلام", "أن تكون مصدرة في أول الجواب، وأن يكون الفعل بعدها مستقبلًا، وأن تكون متصلة بالفعل", "أن تسبقها اللام، وأن يكون الفعل بعدها ماضيًا، وأن تكون منفصلة عن الفعل", "أن تكون في وسط الكلام، وأن يكون الفعل بعدها للحال، وأن يفصل بينها وبين الفعل فاصل"], "answer": "أن تكون مصدرة في أول الجواب، وأن يكون الفعل بعدها مستقبلًا، وأن تكون متصلة بالفعل", "answerIndex": 1, "explanation": "«ويشترط للنصب بإذن ثلاثة شروط: (أ) أن تكون مصدرة في أول الجواب. (ب) أن يكون الفعل بعدها مستقبل. (ج) أن تكون متصلة بالفعل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-683", "question": "ما حكم (كي) في قولنا: «ترجم الغرب كتاب (القانون) لابن سينا؛ كي يستفيدوا منه في الطب»؟", "choices": ["حرف تعليل وجر، والناصب (أن) مضمرة وجوبًا", "حرف مصدري ناصب بنفسه", "حرف عطف لا يعمل النصب", "حرف جزم ونفي وقلب"], "answer": "حرف تعليل وجر، والناصب (أن) مضمرة وجوبًا", "answerIndex": 0, "explanation": "«ترجم الغرب كتاب (القانون) لابن سينا؛ كي يستفيدوا منه في الطب: كي هنا محتملة للجر والتعليل؛ لأنها لم تسبق باللام لفظًا ولا تقديرًا، فهي حرف تعليل وجر، والناصب (أن) مضمرة وجوبًا»؛ و«شرط كون (كي) مصدرية ناصبة، أن تكون مسبوقة باللام لفظًا كما في المثال الأول، أو تقديرًا كما في المثال الثاني».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-684", "question": "ما علامة نصب الفعل «يؤمنوا» في قوله تعالى: ﴿أفتطمعون أن يؤمنوا لكم﴾؟", "choices": ["حذف النون", "الفتحة المقدرة", "الفتحة الظاهرة", "السكون"], "answer": "حذف النون", "answerIndex": 0, "explanation": "«أفتطمعون أن يؤمنوا لكم [البقرة 75]: يؤمنوا فعل مضارع منصوب بـ(أن) وعلامة نصبه حذف النون».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-685", "question": "ما ناصب الفعل المضارع بعد لام التعليل؟", "choices": ["(لن) ظاهرة وجوبًا", "(كي) مضمرة وجوبًا", "اللام نفسها", "(أن) ظاهرة أو مضمرة جوازًا"], "answer": "(أن) ظاهرة أو مضمرة جوازًا", "answerIndex": 3, "explanation": "«أن ناصب المضارع بعد لام التعليل هو (أن) وتكون ظاهرة كما في مثالي المجموعة الأولى، ومضمرة بعد اللام كما في مثالي المجموعة الثانية»؛ و«أن إضمار (أن) بعد هذه اللام جائز».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-686", "question": "متى يجب إظهار (أن) بعد لام التعليل؟", "choices": ["إذا جاءت (إن) الشرطية بعد اللام", "إذا جاءت (لم) بعد اللام", "إذا جاءت (لا) النافية بعد اللام", "إذا جاءت (ما) النافية بعد اللام"], "answer": "إذا جاءت (لا) النافية بعد اللام", "answerIndex": 2, "explanation": "«ما تقدم من جواز إضمار (أن) بعد لام التعليل شرطه ألا تأتي (لا) النافية بعد هذه اللام، فإن جاءت (لا) النافية بعدها وجب إظهار (أن) نحو: لئلا يكون للناس على الله حجة [النساء 165]»؛ قال تعالى: ﴿لئلا يكون للناس على الله حجة﴾.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-687", "question": "ما الأحرف الستة التي ينصب المضارع بعدها بـ(أن) مضمرة وجوبًا؟", "choices": ["لام التعليل، وحتى، وكي، وأو، والفاء، والواو", "لام الجحود، وحتى، وكي، وأو، وفاء السببية، وواو المعية", "أن، ولن، وإذن، وكي، ولم، ولما", "لام الجحود، وحتى، وكي، وإن، وإذما، ومن"], "answer": "لام الجحود، وحتى، وكي، وأو، وفاء السببية، وواو المعية", "answerIndex": 1, "explanation": "«أن الفعل المضارع ينصب بأن مضمرة وجوبًا بعد حرف من أحرف ستة: (1- لام الجحود) وهي المسبوقة بـ(كون) ناقص منفي (ما كان أو لم يكن). (2- حتى) إذا كان الفعل بعدها مستقبل بالنسبة لما قبلها، سواء أكان مستقبل بالنسبة لزمن التكلم أم لا، فإن كان الفعل بعدها للحال وجب رفعه. (3- كي) إذا لم تسبقها اللام لفظًا أو تقديرًا وإلا فهي مصدرية ناصبة بنفسها. (4- أو) إذا صلح موضعها (حتى) أو (إلا). (5- فاء السببية) إذا سبقت بنفي محض، أو وقعت جوابًا لطلب بالفعل. (6- واو المعية) إذا سبقت بنفي محض، أو وقعت جوابًا لطلب بالفعل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-688", "question": "ما شرط النصب بـ(أن) مضمرة وجوبًا بعد (اللام)؟", "choices": ["أن تكون اللام بعد (لا) النافية", "أن تكون اللام مسبوقة بفعل أمر", "أن تكون اللام مسبوقة بكون ناقص منفي (ما كان أو لم يكن)", "أن تكون اللام للتعليل"], "answer": "أن تكون اللام مسبوقة بكون ناقص منفي (ما كان أو لم يكن)", "answerIndex": 2, "explanation": "«فشرط النصب بعد (اللام)، أن تكون مسبوقة بكون ناقص منفي (ما كان أو لم يكن) نحو قوله تعالى: وما كان الله ليعذبهم وأنت فيهم [الأنفال 33] وقوله تعالى: لم يكن الله ليغفر لهم [النساء 137] وتسمى هذه اللام (لام الجحود)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-689", "question": "ما حكم الفعل «ليعذبهم» في قوله تعالى: ﴿وما كان الله ليعذبهم وأنت فيهم﴾؟", "choices": ["منصوب بـ(أن) مضمرة جوازًا بعد لام التعليل", "مجزوم بـ(لم)", "منصوب بـ(لن) الظاهرة", "منصوب بـ(أن) مضمرة وجوبًا بعد لام الجحود"], "answer": "منصوب بـ(أن) مضمرة وجوبًا بعد لام الجحود", "answerIndex": 3, "explanation": "«وتسمى هذه اللام (لام الجحود)»؛ و«(يضيع): فعل مضارع منصوب بأن مضمرة وجوبًا بعد لام الجحود» — ومثله «ليعذبهم» بعد ﴿وما كان الله﴾.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-690", "question": "ما شرط النصب بـ(أن) مضمرة وجوبًا بعد (حتى)؟", "choices": ["أن يكون المضارع بعدها ماضيًا", "أن يكون المضارع بعدها مستقبلًا بالنسبة لما قبلها", "أن تسبقها لام التعليل", "أن يكون المضارع بعدها للحال"], "answer": "أن يكون المضارع بعدها مستقبلًا بالنسبة لما قبلها", "answerIndex": 1, "explanation": "«وشرط النصب بعد (حتى) أن يكون المضارع بعدها مستقبل بالنسبة لما قبلها، بمعنى: أنه لا يقع إلا بعد وقوع الفعل الذي قبلها»؛ و«فإن تخلف هذا الشرط بأن كان الفعل بعدها للحال وجب رفعه نحو: أسرع حتى أركب القطار، إذا قلت ذلك وقت الركوب».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-691", "question": "ما شرط النصب بـ(أن) مضمرة وجوبًا بعد فاء السببية وواو المعية؟", "choices": ["أن يصلح موضعهما (حتى) أو (إلا)", "أن تسبقهما اللام لفظًا أو تقديرًا", "أن تُسبقا بنفي محض، أو تقعا جوابًا لطلب بالفعل", "أن تُسبقا بكون ناقص منفي"], "answer": "أن تُسبقا بنفي محض، أو تقعا جوابًا لطلب بالفعل", "answerIndex": 2, "explanation": "«وشرط النصب بعد (فاء السببية، وواو المعية) أن تكون كل منهما: (أ) مسبوقة بنفي محض نحو: ما علمت بنجاحك فأهنئك، أو: وأهنئك. (ب) أو جوابًا لطلب بالفعل نحو: اجتهد فتنجح، أو: وتنجح».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-692", "question": "ما حكم الفعل «فيموتوا» في قوله تعالى: ﴿لا يقضى عليهم فيموتوا﴾؟", "choices": ["مرفوع؛ لتجرده من الناصب والجازم", "منصوب بـ(لن)، وعلامة نصبه الفتحة", "مجزوم بـ(لا) الناهية، وعلامة جزمه حذف النون", "منصوب بـ(أن) مضمرة وجوبًا بعد فاء السببية، وعلامة نصبه حذف النون"], "answer": "منصوب بـ(أن) مضمرة وجوبًا بعد فاء السببية، وعلامة نصبه حذف النون", "answerIndex": 3, "explanation": "«(الفاء): سببية وهي حرف مبني على الفتح لا محل له من الإعراب. (يموتوا): فعل مضارع منصوب (بأن) مضمرة وجوبًا، وعلامة نصبه حذف النون؛ لأنه من الأفعال الخمسة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-693", "question": "ما الجوازم التي تجزم فعلًا واحدًا؟", "choices": ["لم، ولما، وإن، وإذما", "إن، وإذما، ومن، وما", "لم، ولما، ولام الأمر والدعاء، ولا في النهي والدعاء", "لن، وكي، وأن، وإذن"], "answer": "لم، ولما، ولام الأمر والدعاء، ولا في النهي والدعاء", "answerIndex": 2, "explanation": "«أن الجوازم التي تجزم فعلًا واحدًا أربعة أحرف، وهي: (1- لم): وتفيد النفي، والقلب، وقد تدخل عليها همزة الاستفهام. (2- لما): وتفيد النفي والقلب، وقد تدخل عليها همزة الاستفهام، وتخالف (لم) من وجهين: أولهما: أن النفي بها متصل إلى زمن التكلم. ثانيهما: أن الفعل المنفي بها متوقع الحصول. (3- اللام): وتفيد طلب الفعل. وطلب الفعل إما أمر، إذا كان من الأعلى إلى الأدنى، أو دعاء، إذا كان من الأدنى إلى الأعلى. (4- لا): وتفيد طلب الكف عن الفعل. وطلب الكف إما نهي: إذا كان من الأعلى إلى الأدنى، أو دعاء: إذا كان من الأدنى إلى الأعلى».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-694", "question": "ما معنى (لم) الجازمة؟", "choices": ["حرف جزم ونفي وقلب", "حرف جزم وأمر ودعاء", "حرف نصب ونفي واستقبال", "حرف جر وتعليل"], "answer": "حرف جزم ونفي وقلب", "answerIndex": 0, "explanation": "«(لم): حرف جزم، ونفي، وقلب. جزم: لأنها تجزم المضارع، ونفي لأنها تمنع حصول المضارع، وقلب لأنها تقلب زمن المضارع، من الحال والاستقبال إلى الماضي»؛ ومثالها: ﴿ألم نشرح لك صدرك﴾.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-695", "question": "ما معنى (لام) الأمر الجازمة؟", "choices": ["طلب الكف عن الفعل: نهيًا أو دعاءً", "النفي والقلب", "نصب المضارع بعدها", "طلب الفعل: أمرًا إذا كان من الأعلى إلى الأدنى، ودعاءً إذا كان من الأدنى إلى الأعلى"], "answer": "طلب الفعل: أمرًا إذا كان من الأعلى إلى الأدنى، ودعاءً إذا كان من الأدنى إلى الأعلى", "answerIndex": 3, "explanation": "«(اللام): حرف جزم، وتفيد طلب الفعل. وطلب الفعل: يكون أمرًا، إذا كان الطلب من الأعلى إلى الأدنى. ويكون دعاء، إذا كان الطلب من الأدنى إلى الأعلى»؛ ومثال الأمر: «لينفق ذو سعة [الطلاق 7]» ومثال الدعاء: «ليقض علينا ربك [الزخرف 77]».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-696", "question": "ما معنى (لا) الجازمة؟", "choices": ["نصب المضارع بعدها", "طلب الكف عن الفعل: نهيًا إذا كان من الأعلى إلى الأدنى، ودعاءً إذا كان من الأدنى إلى الأعلى", "طلب الفعل: أمرًا أو دعاءً", "النفي والقلب"], "answer": "طلب الكف عن الفعل: نهيًا إذا كان من الأعلى إلى الأدنى، ودعاءً إذا كان من الأدنى إلى الأعلى", "answerIndex": 1, "explanation": "«(لا): حرف جزم، وتفيد طلب الكف عن الفعل ترك الفعل، وطلب الكف يكون نهيًا إذا كان الطلب من الأعلى إلى الأدنى، ويكون دعاء إذا كان الطلب من الأدنى إلى الأعلى»؛ ومثال النهي: ﴿لا تحزن إن الله معنا﴾ ومثال الدعاء: ﴿ربنا لا تؤاخذنا إن نسينا أو أخطأنا﴾.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-697", "question": "ما الأدوات التي تجزم فعلين؟", "choices": ["إن، وإذما، ومن، وما فقط", "إن، وإذما، ومن، وما، ومهما، وكيفما، ومتى، وأيان، وأين، وأنى، وحيثما، وأي", "أن، ولن، وإذن، وكي", "لم، ولما، ولام الأمر، ولا الناهية"], "answer": "إن، وإذما، ومن، وما، ومهما، وكيفما، ومتى، وأيان، وأين، وأنى، وحيثما، وأي", "answerIndex": 1, "explanation": "«أن الأدوات التي تجزم فعلين: أولهما فعل الشرط، وثانيهما جوابه، وجزاؤه هي: إن، وإذما، ومن، وما، ومهما، وكيفما، ومتى، وأيان، وأين، وأنى، وحيثما، وأي».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A3%D8%B9%20-%201.pdf"}, {"grade": 9, "subject": "النحو", "id": "h26-g9-698", "question": "ما دلالة أسماء الشرط الجازمة: (من) و(ما) و(كيفما) و(متى) و(أين) و(أي)؟", "choices": ["كلها للزمان", "كلها للحال", "من لغير العاقل، وما للعاقل، وكيفما للزمان، ومتى للمكان، وأين للحال، وأي للعاقل فقط", "من للعاقل، وما ومهما لغير العاقل، وكيفما للحال، ومتى وأيان للزمان، وأين وأنى وحيثما للمكان، وأي بحسب ما تضاف إليه"], "answer": "من للعاقل، وما ومهما لغير العاقل، وكيفما للحال، ومتى وأيان للزمان، وأين وأنى وحيثما للمكان، وأي بحسب ما تضاف إليه", "answerIndex": 3, "explanation": "«وأن اسم الشرط بحسب معناه الأصلي ستة أقسام: (أ) للعاقل: من. (ب) لغير العاقل: ما، ومهما. (ج) للحال: كيفما. (د) للزمان: متى، وأيان. (هـ) للمكان: أين، وأنى، وحيثما.
