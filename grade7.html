ource": "https://www.nezakr.net/edu/p/2540/"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-105", "question": "ما نظير الهيدروجين الوحيد الذي لا توجد نيوترونات في نواته؟", "choices": ["التريتيوم", "البروتيوم", "الديوتيريوم", "الهيليوم"], "answer": "البروتيوم", "answerIndex": 1, "explanation": "نظائر الهيدروجين تتفق في العدد الذري وتختلف في عدد النيوترونات؛ ونواة البروتيوم فيها بروتون واحد بلا نيوترونات، بينما نواة التريتيوم فيها بروتون ونيوترونان.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2540/"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-106", "question": "على أي أساس رتّب مندليف العناصر في جدوله الدوري؟", "choices": ["الترتيب التنازلي حسب الكتل الذرية", "حسب ألوان العناصر", "الترتيب التصاعدي حسب الكتل الذرية", "الترتيب التصاعدي حسب الأعداد الذرية"], "answer": "الترتيب التصاعدي حسب الكتل الذرية", "answerIndex": 2, "explanation": "رتّب مندليف العناصر ترتيبًا تصاعديًا حسب كتلها الذرية في جدوله.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2540/"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-107", "question": "عنصر الفوسفور عدده الذري 15؛ ففي أي دورة ومجموعة يقع في الجدول الدوري؟", "choices": ["الدورة الثانية والمجموعة الخامسة A", "الدورة الرابعة والمجموعة الخامسة A", "الدورة الثالثة والمجموعة الثالثة A", "الدورة الثالثة والمجموعة الخامسة A"], "answer": "الدورة الثالثة والمجموعة الخامسة A", "answerIndex": 3, "explanation": "بتوزيع إلكترونات الفوسفور (2، 8، 5) نجد 3 مستويات مشغولة و5 إلكترونات في المستوى الأخير؛ فيقع في الدورة الثالثة والمجموعة الخامسة A.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2540/"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-108", "question": "عنصر الكالسيوم عدده الذري 20؛ ففي أي دورة ومجموعة يقع في الجدول الدوري؟", "choices": ["الدورة الثانية والمجموعة الثانية A", "الدورة الرابعة والمجموعة الثانية A", "الدورة الرابعة والمجموعة الرابعة A", "الدورة الثالثة والمجموعة الثانية A"], "answer": "الدورة الرابعة والمجموعة الثانية A", "answerIndex": 1, "explanation": "توزيع إلكترونات الكالسيوم (2، 8، 8، 2)؛ فله 4 مستويات مشغولة وإلكترونان في المستوى الأخير؛ فيقع في الدورة الرابعة والمجموعة الثانية A.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2540/"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-109", "question": "عناصر الفئة s كلها فلزات باستثناء عنصر .......", "choices": ["الهيليوم", "الليثيوم", "الهيدروجين", "الصوديوم"], "answer": "الهيدروجين", "answerIndex": 2, "explanation": "عناصر الفئة s كلها فلزات باستثناء الهيدروجين؛ فهو لافلز رغم وقوعه في الفئة s.", "type": "mcq", "topic": "", "source": "https://www.anwar-azzouz.com/prep-1-science"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-110", "question": "ما تعريف المادة؟", "choices": ["كل ما له لون فقط", "كل ما هو صلب فقط", "كل ما يمكن رؤيته فقط", "كل ما له كتلة ويشغل حيزًا"], "answer": "كل ما له كتلة ويشغل حيزًا", "answerIndex": 3, "explanation": "المادة هي كل ما له كتلة ويشغل حيزًا من الفراغ.", "type": "mcq", "topic": "", "source": "https://www.anwar-azzouz.com/prep-1-science"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-111", "question": "محلول ملح الطعام في الماء مخلوط .......، ويمكن فصل الملح منه بـ .......", "choices": ["غير متجانس — التبخير", "متجانس — التبخير", "غير متجانس — الترشيح", "متجانس — الفصل المغناطيسي"], "answer": "متجانس — التبخير", "answerIndex": 1, "explanation": "محلول ملح الطعام مخلوط متجانس تتوزع مكوناته بانتظام؛ ويمكن الحصول على الملح منه بتبخير الماء، أما استعادة الماء نفسه فتكون بالتقطير.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2540/"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-112", "question": "يُستخدم ....... في ملء إطارات السيارات بدلًا من الهواء.", "choices": ["ثاني أكسيد الكربون", "الأكسجين", "الهيدروجين", "النيتروجين"], "answer": "النيتروجين", "answerIndex": 3, "explanation": "من استخدامات النيتروجين ملء إطارات السيارات بدلًا من الهواء.", "type": "mcq", "topic": "", "source": "https://www.anwar-azzouz.com/prep-1-science"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-113", "question": "بطريقة لويس النقطية: H• + •H → H–H؛ فالرابطة في جزيء الهيدروجين تساهمية .......", "choices": ["أيونية", "ثلاثية", "أحادية", "ثنائية"], "answer": "أحادية", "answerIndex": 2, "explanation": "في جزيء الهيدروجين يتشارك كل ذرة هيدروجين بإلكترون واحد فتتكون رابطة تساهمية أحادية، أما جزيء الأكسجين O=O فرابطته تساهمية ثنائية.", "type": "mcq", "topic": "", "source": "https://www.anwar-azzouz.com/prep-1-science"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-114", "question": "يرتبط الفلز A من مجموعة الأقلاء الأرضية (A²⁺) مع اللافلز B من المجموعة (6A) (B²⁻)؛ فما الصيغة الجزيئية للمركب الأيوني الناتج؟", "choices": ["A₂B", "A₂B₃", "AB", "AB₂"], "answer": "AB", "answerIndex": 2, "explanation": "شحنة الفلز +2 وشحنة اللافلز −2 فتتعادلان بذرة واحدة من كل منهما؛ فتكون الصيغة AB.", "type": "mcq", "topic": "", "source": "https://www.anwar-azzouz.com/prep-1-science"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-115", "question": "عند دلك ساق من الزجاج بقطعة من الحرير تتكون على ساق الزجاج شحنة كهربية .......", "choices": ["سالبة", "مغناطيسية", "متعادلة", "موجبة"], "answer": "موجبة", "answerIndex": 3, "explanation": "الزجاج يسبق الحرير في السلسلة الكهروستاتيكية فيفقد إلكترونات ويُشحن بشحنة موجبة، بينما يكتسب الحرير الإلكترونات فيُشحن بشحنة سالبة.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-116", "question": "تبدأ خطوط القوى الكهربية من الشحنة ....... وتنتهي عند الشحنة .......", "choices": ["الموجبة — السالبة", "السالبة — الموجبة", "الموجبة — الموجبة", "السالبة — السالبة"], "answer": "الموجبة — السالبة", "answerIndex": 0, "explanation": "خطوط القوى الكهربية خطوط وهمية لا تتقاطع؛ تبدأ دائمًا من الشحنات الموجبة وتنتهي عند الشحنات السالبة.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-117", "question": "يُقاس مقدار الشحنة الكهربية الضعيفة جدًا بجهاز .......", "choices": ["الكولوم ميتر", "الفولتامتر", "الإلكتروسكوب", "مانعة الصواعق"], "answer": "الكولوم ميتر", "answerIndex": 0, "explanation": "الكولوم ميتر جهاز دقيق يُستخدم لقياس كميات الشحنة الكهربية الضعيفة جدًا مثل النانوكولوم، أما وحدة قياس الشحنة فهي الكولوم.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-118", "question": "كشاف كهربي مشحون بشحنة موجبة؛ فإذا قُرّب منه دون تلامس جسم مشحون بشحنة موجبة فإن انفراج ورقتي الذهب .......", "choices": ["لا يتغير", "يزداد", "يقل", "ينعدم"], "answer": "يزداد", "answerIndex": 1, "explanation": "زيادة انفراج الورقتين تعني أن شحنة الجسم من نفس نوع شحنة الكشاف، ونقص الانفراج يعني أنها مخالفة لها.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-119", "question": "عند مرور حزمة من الجسيمات دون الذرية بين لوحين متوازيين أحدهما موجب والآخر سالب؛ فالإلكترونات تنحرف نحو .......", "choices": ["تتوقف عن الحركة", "اللوح الموجب", "تسير في خط مستقيم دون انحراف", "اللوح السالب"], "answer": "اللوح الموجب", "answerIndex": 1, "explanation": "الإلكترونات سالبة الشحنة فتنحرف باتجاه اللوح الموجب، والبروتونات موجبة فتنحرف باتجاه اللوح السالب، والنيوترونات متعادلة فتسير في خط مستقيم دون انحراف.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-120", "question": "أي المواد التالية من المواد المغناطيسية؟", "choices": ["النحاس", "الذهب", "الفضة", "الكوبلت"], "answer": "الكوبلت", "answerIndex": 3, "explanation": "المواد المغناطيسية تنجذب إلى المغناطيس مثل الحديد والنيكل والكوبلت، أما الذهب والفضة والنحاس والألومنيوم فمواد غير مغناطيسية.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-121", "question": "عند كسر مغناطيس إلى عدة أجزاء فإن كل جزء يصبح .......", "choices": ["مغناطيسًا جديدًا كاملًا له قطبان", "قطبًا جنوبيًا منفردًا", "قطبًا شماليًا منفردًا", "قطعة غير مغناطيسية"], "answer": "مغناطيسًا جديدًا كاملًا له قطبان", "answerIndex": 0, "explanation": "لا يمكن أبدًا الحصول على قطب مغناطيسي منفرد؛ فكل جزء ناتج من كسر المغناطيس يُشكل تلقائيًا مغناطيسًا جديدًا كاملًا له قطب شمالي وجنوبي.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-122", "question": "تتجه خطوط المجال المغناطيسي خارج المغناطيس من .......", "choices": ["القطب الجنوبي إلى القطب الشمالي", "القطب الشمالي إلى القطب الجنوبي", "طرف المغناطيس إلى منتصفه", "منتصف المغناطيس إلى طرفه"], "answer": "القطب الشمالي إلى القطب الجنوبي", "answerIndex": 1, "explanation": "خطوط المجال المغناطيسي خطوط وهمية لا تتقاطع؛ تخرج دائمًا من القطب الشمالي وتتجه نحو القطب الجنوبي خارج المغناطيس، وتتزاحم عند القطبين.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-123", "question": "لماذا تُصنع علبة البوصلة من النحاس أو البلاستيك ولا تُصنع من الحديد؟", "choices": ["لأن الحديد أرخص ثمنًا", "لأن الحديد أثقل وزنًا", "لأن الحديد يصدأ بالماء", "حتى لا تنجذب الإبرة المغناطيسية للعلبة"], "answer": "حتى لا تنجذب الإبرة المغناطيسية للعلبة", "answerIndex": 3, "explanation": "علبة البوصلة من مادة غير مغناطيسية حتى لا تنجذب الإبرة المغناطيسية للعلبة فتُعيق حركتها الحرة وتؤثر على دقة تحديد الاتجاهات.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-124", "question": "ما استخدام الفرشاة المغناطيسية؟", "choices": ["شحن الأجسام بالكهرباء الساكنة", "الكشف عن البصمات غير الواضحة في مسرح الجريمة", "تحديد الاتجاهات الجغرافية", "قياس شدة المجال المغناطيسي"], "answer": "الكشف عن البصمات غير الواضحة في مسرح الجريمة", "answerIndex": 1, "explanation": "الفرشاة المغناطيسية أداة خاصة تستخدم مسحوق برادة الحديد في الكشف عن البصمات الخفية غير الواضحة، ويستخدمها خبراء الأدلة الجنائية والطب الشرعي في التحقيقات.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-125", "question": "جسم كتلته 50 kg عند سطح الأرض (شدة مجال الجاذبية = 10 N/kg)؛ فما وزنه؟", "choices": ["5 N", "500 N", "50 N", "5000 N"], "answer": "500 N", "answerIndex": 1, "explanation": "الوزن = الكتلة × شدة مجال الجاذبية = 50 × 10 = 500 نيوتن.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-126", "question": "جسم كتلته 60 kg؛ فما وزنه على سطح القمر إذا كان وزنه على سطح الأرض 600 N؟", "choices": ["10 N", "600 N", "3600 N", "100 N"], "answer": "100 N", "answerIndex": 3, "explanation": "وزن الجسم على سطح القمر = سدس وزنه على سطح الأرض؛ لأن شدة مجال جاذبية القمر تعادل سدس شدة مجال جاذبية الأرض: 600 ÷ 6 = 100 نيوتن، بينما تظل كتلته 60 kg ثابتة.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-127", "question": "تحدث ظاهرة المد والجزر ....... كل يوم، وتكون في أعلى نشاطها عندما يكون القمر في طور .......", "choices": ["مرتين — المحاق أو البدر", "مرة واحدة — التربيع الأول", "أربع مرات — المحاق أو البدر", "مرتين — التربيع الأول أو الأخير"], "answer": "مرتين — المحاق أو البدر", "answerIndex": 0, "explanation": "تحدث ظاهرة المد والجزر مرتين كل يوم (بمعدل مرة كل 12 ساعة تقريبًا)، وتكون في أعلى نشاط وقوة وارتفاع عندما يكون القمر في طور المحاق أو طور البدر.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-128", "question": "أي مما يلي صحيح عن قوى الجاذبية؟", "choices": ["تجاذب فقط دائمًا ولا يوجد فيها تنافر", "قد تكون تجاذبًا أو تنافرًا", "تؤثر فقط عند التلامس المباشر", "تتناسب عكسيًا مع كتلتي الجسمين"], "answer": "تجاذب فقط دائمًا ولا يوجد فيها تنافر", "answerIndex": 0, "explanation": "قوة الجاذبية قوة جذب دائمًا ولا يوجد تنافر فيها مطلقًا، على عكس القوى الكهربية والمغناطيسية التي قد تكون تجاذبًا أو تنافرًا؛ وهي قوة مجال تؤثر عن بعد وتتناسب طرديًا مع كتلتي الجسمين.", "type": "mcq", "topic": "", "source": "https://mrsaeid.com/article/science-review-1st-prep-november-2026"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-129", "question": "ما وحدة البناء والوظيفة في الكائن الحي؟", "choices": ["العضو", "النسيج", "الجهاز", "الخلية"], "answer": "الخلية", "answerIndex": 3, "explanation": "الخلية هي وحدة البناء والوظيفة في الكائن الحي؛ فالكائن الحي يتكون من أجهزة، وكل جهاز من أعضاء، وكل عضو من أنسجة، وكل نسيج من خلايا.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lesson/34471/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AF%D8%B1%D8%B3-%D8%A7%D9%84%D8%A3%D9%88%D9%84-%D8%A7%D9%84%D8%AE%D9%84%D8%A7%D9%8A%D8%A7-%D9%88%D8%A7%D9%84%D8%AD%D9%8A%D8%A7%D8%A9?without_solution=1"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-130", "question": "ما الذي يميز خلية أوليات النواة عن خلية حقيقيات النواة؟", "choices": ["مادتها الوراثية محاطة بغشاء نووي", "مادتها الوراثية في السيتوبلازم غير محاطة بغشاء نووي", "أكبر حجمًا وتحتوي على عضيات أكثر", "تحتوي على بلاستيدات خضراء دائمًا"], "answer": "مادتها الوراثية في السيتوبلازم غير محاطة بغشاء نووي", "answerIndex": 1, "explanation": "أوليات النواة كائنات وحيدة الخلية بسيطة التركيب صغيرة الحجم نسبيًا، توجد مادتها الوراثية في السيتوبلازم غير محاطة بغشاء نووي؛ أما حقيقيات النواة فتحتوي على نواة حقيقية تحاط مادتها الوراثية بغشاء نووي.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lesson/34471/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AF%D8%B1%D8%B3-%D8%A7%D9%84%D8%A3%D9%88%D9%84-%D8%A7%D9%84%D8%AE%D9%84 her=3867326"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-140", "question": "أي ميكروب يسبب مرض التيفويد؟", "choices": ["بكتيريا السالمونيلا التيفية", "فطر الخميرة", "بكتيريا العقد الجذرية", "إنتاميبا هستولوتيكا"], "answer": "بكتيريا السالمونيلا التيفية", "answerIndex": 0, "explanation": "التيفويد مرض بكتيري تسببه بكتيريا السالمونيلا التيفية التي تصيب القناة الهضمية، وينتقل بتناول الأطعمة والمياه الملوثة بها، ومن أعراضه الحمى الشديدة التي قد تصل إلى 40°م مع الصداع وآلام المعدة.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316854/أول-اعدادي/العلوم/أضيف-مضاد-حيوى-إلى-اللبن-المعد-لتحضير-الزبادى-ما-النتيجة-المتوقعة-مع-التفسير?teacher=3867326"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-141", "question": "ما مجموعة الكواكب التي توصف بالكواكب الصخرية؟", "choices": ["الكواكب الداخلية (عطارد، الزهرة، الأرض، المريخ)", "عطارد والزهرة فقط", "الكواكب الخارجية (المشتري، زحل، أورانوس، نبتون)", "الأرض والمريخ فقط"], "answer": "الكواكب الداخلية (عطارد، الزهرة، الأرض، المريخ)", "answerIndex": 0, "explanation": "الكواكب الصخرية هي الكواكب الداخلية الأربعة: عطارد والزهرة والأرض والمريخ.", "type": "mcq", "topic": "", "source": "https://www.anwar-azzouz.com/prep-1-science"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-142", "question": "ما مجموعة الكواكب التي تتميز بوجود البراكين النشطة؟", "choices": ["الأرض والمريخ", "المشتري وزحل", "الزهرة والأرض", "عطارد والمريخ"], "answer": "الزهرة والأرض", "answerIndex": 2, "explanation": "تتميز الزهرة والأرض بوجود البراكين النشطة بين كواكب المجموعة الشمسية.", "type": "mcq", "topic": "", "source": "https://www.anwar-azzouz.com/prep-1-science"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-143", "question": "ما وجه التشابه بين مكونات الغلاف الجوي لكوكب عطارد وكوكب المشتري؟", "choices": ["كلاهما بلا غلاف جوي", "كلاهما مكون من ثاني أكسيد الكربون", "كلاهما مكون من غازي الهيدروجين والهيليوم", "كلاهما مكون من الأكسجين والنيتروجين"], "answer": "كلاهما مكون من غازي الهيدروجين والهيليوم", "answerIndex": 2, on": "لماذا لا يحدث خسوف القمر في كل بدر؟", "choices": ["لأن مدار القمر يميل بنحو 5 درجات على مدار الأرض", "لأن القمر يدور حول نفسه بسرعة", "لأن القمر يختفي تمامًا كل شهر", "لأن الشمس تبتعد عن الأرض"], "answer": "لأن مدار القمر يميل بنحو 5 درجات على مدار الأرض", "answerIndex": 0, "explanation": "لا يحدث الخسوف في كل بدر لأن مدار القمر يميل بنحو 5 درجات على مدار الأرض؛ فيمر القمر غالبًا فوق ظل الأرض أو أسفله.", "type": "mcq", "topic": "", "source": "https://dabour-hub.com/eg/courses/prep1-science-2027/%D8%AE%D8%B3%D9%88%D9%81-%D8%A7%D9%84%D9%82%D9%85%D8%B1/part-5/"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-148", "question": "كيف يبدو القمر في الخسوف الكلي؟", "choices": ["يختفي تمامًا ولا يُرى إطلاقًا", "يدخل كله في ظل الأرض ويبدو باللون الأحمر النحاسي", "يمر في شبه الظل فيتغير لونه تغيرًا طفيفًا", "يدخل جزء منه في الظل ويظهر الجزء الآخر مضيئًا"], "answer": "يدخل كله في ظل الأرض ويبدو باللون الأحمر النحاسي", "answerIndex": 1, "explanation": "في الخسوف الكلي يدخل القمر كله في ظل الأرض (الظل الكامل) ويبدو باللون الأحمر النحاسي؛ لأن بعض ضوء الشمس ينكسر في الغلاف الجوي للأرض ويصل إلى القمر.", "type": "mcq", "topic": "", "source": "https://dabour-hub.com/eg/courses/prep1-science-2027/%D8%AE%D8%B3%D9%88%D9%81-%D8%A7%D9%84%D9%82%D9%85%D8%B1/part-5/"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-149", "question": "ما المدة بين بدرين متتاليين؟ ولماذا لا نرى من القمر إلا وجهًا واحدًا؟", "choices": ["29.5 يومًا — لأنه يدور حول محوره في المدة نفسها التي يدور فيها حول الأرض", "27.3 يومًا — لأنه لا يدور حول محوره إطلاقًا", "29.5 يومًا — لأنه ثابت لا يدور", "365 يومًا — لأنه يدور حول الشمس"], "answer": "29.5 يومًا — لأنه يدور حول محوره في المدة نفسها التي يدور فيها حول الأرض", "answerIndex": 0, "explanation": "تتكرر أوجه القمر كل حوالي 29.5 يومًا وهي المدة بين بدرين متتاليين، ويدور القمر حول محوره في المدة نفسها التي يحتاجها للدوران حول الأرض؛ لذلك لا يرى سكان الأرض إلا وجهًا واحدًا منه.", "type": "mcq", "topic": "", "source": "https://dabour-hub.com/eg/courses/prep1-science-2027/%D8%AE%D8%B3%D9%88%D9%81-%D8%A7%D9%84%D9%82%D9%85%D8%B1/part-5/"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-150", "question": "يحدث كسوف الشمس عندما يقع ....... بين الأرض والشمس، ويكون القمر في طور .......", "choices": ["القمر — المحاق", "القمر — البدر", "الأرض — البدر", "الأرض — المحاق"], "answer": "القمر — المحاق", "answerIndex": 0, "explanation": "في كسوف الشمس يقع القمر بين الأرض والشمس ويكون في طور المحاق (القمر الجديد)، أما في خسوف القمر فتقع الأرض بين الشمس والقمر ويكون في طور البدر.", "type": "mcq", "topic": "", "source": "https://dabour-hub.com/eg/courses/prep1-science-2027/%D8%AE%D8%B3%D9%88%D9%81-%D8%A7%D9%84%D9%82%D9%85%D8%B1/part-5/"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-151", "question": "أين توجد المادة الوراثية في الخلية البكتيرية؟", "choices": ["داخل الفجوة العصارية", "داخل نواة حقيقية محاطة بغشاء نووي", "في السيتوبلازم غير محاطة بغشاء نووي", "داخل الميتوكوندريا"], "answer": "في السيتوبلازم غير محاطة بغشاء نووي", "answerIndex": 2, "explanation": "البكتيريا من أوليات النواة؛ فمادتها الوراثية توجد في السيتوبلازم غير محاطة بغشاء نووي، على عكس حقيقيات النواة التي تحاط مادتها الوراثية بغشاء نووي يفصلها عن السيتوبلازم.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lesson/34471/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AF%D8%B1%D8%B3-%D8%A7%D9%84%D8%A3%D9%88%D9%84-%D8%A7%D9%84%D8%AE%D9%84%D8%A7%D9%8A%D8%A7-%D9%88%D8%A7%D9%84%D8%AD%D9%8A%D8%A7%D8%A9?without_solution=1"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-152", "question": "أي التراكيب التالية يوجد في الخلية النباتية ولا يوجد في الخلية الحيوانية؟", "choices": ["الميتوكوندريا", "جهاز جولجي", "الجسم المركزي", "البلاستيدات الخضراء"], "answer": "البلاستيدات الخضراء", "answerIndex": 3, "explanation": "تحتوي الخلية النباتية على البلاستيدات الخضراء التي تتم فيها عملية البناء الضوئي، بينما لا توجد البلاستيدات الخضراء في الخلية الحيوانية.", "type": "mcq", "topic": "", "source": "https://sahl.io/ choices": ["غاز الأكسجين", "غاز ثاني أكسيد الكربون", "غاز النيتروجين", "غاز الميثان"], "answer": "غاز الميثان", "answerIndex": 3, "explanation": "يتكون كوكب أورانوس من غازات وجليد، ويحتوي غلافه الجوي على غاز الميثان الذي يلوّنه باللون الأزرق المخضر.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316866/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AD%D8%B1%D9%83%D8%A9-%D8%A7%D9%84%D8%B8%D8%A7%D9%87%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D8%B4%D9%85%D8%B3"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-180", "question": "أي الكواكب التالية له قشرة رقيقة جدًا مليئة بالحفر الناتجة عن سقوط النيازك؟", "choices": ["الزهرة", "عطارد", "المريخ", "الأرض"], "answer": "عطارد", "answerIndex": 1, "explanation": "لكوكب عطارد قشرة رقيقة جدًا مليئة بالحفر الناتجة عن سقوط النيازك، وغلافه الجوي رقيق جدًا مكون من غازي الهيدروجين والهيليوم، ولا توجد به براكين نشطة.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316866/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AD%D8%B1%D9%83%D8%A9-%D8%A7%D9%84%D8%B8%D8%A7%D9%87%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D8%B4%D9%85%D8%B3"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-181", "question": "كم تستغرق الأرض في دورانها حول محورها دورة كاملة؟", "choices": ["12 ساعة تقريبًا", "365.25 يومًا", "29.5 يومًا", "24 ساعة تقريبًا"], "answer": "24 ساعة تقريبًا", "answerIndex": 3, "explanation": "تدور الأرض دورة كاملة حول محورها الوهمي الممتد من القطب الشمالي إلى القطب الجنوبي كل 24 ساعة تقريبًا، ويترتب على ذلك تعاقب الليل والنهار.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316866/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AD%D8%B1%D9%83%D8%A9-%D8%A7%D9%84%D8%B8%D8%A7%D9%87%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D8%B4%D9%85%D8%B3"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-182", "question": "بأي زاوية يميل محور الأرض عن الخط العمودي على مستوى مدارها حول الشمس؟", "choices": ["23.5 درجة", "90 درجة", "5 درجات", "45 درجة"], "answer": "23.5 درجة", "answerIndex": 0, "explanation": "يميل محور الأرض بزاوية مقدارها 23.5 درجة عن الخط العمودي على مستوى مدارها حول الشمس، ويؤدي ميل محور الأرض إلى اختلاف زاوية سقوط أشعة الشمس على المناطق المختلفة من سطح الأرض.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316866/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AD%D8%B1%D9%83%D8%A9-%D8%A7%D9%84%D8%B8%D8%A7%D9%87%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D8%B4%D9%85%D8%B3"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-183", "question": "كم تستغرق الأرض في دورانها حول الشمس دورة كاملة؟", "choices": ["30 يومًا", "29.5 يومًا", "365.25 يومًا", "24 ساعة"], "answer": "365.25 يومًا", "answerIndex": 2, "explanation": "تدور الأرض حول الشمس دورة كاملة كل 365.25 يومًا، ويترتب على ميل محورها ودورانها حول الشمس تعاقب فصول السنة الأربعة.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316866/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AD%D8%B1%D9%83%D8%A9-%D8%A7%D9%84%D8%B8%D8%A7%D9%87%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D8%B4%D9%85%D8%B3"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-184", "question": "ما الذي يترتب على دوران الأرض حول محورها أمام الشمس؟", "choices": ["تعاقب فصول السنة الأربعة", "حدوث كسوف الشمس", "تعاقب الليل والنهار والحركة الظاهرية للشمس", "حدوث خسوف القمر"], "answer": "تعاقب الليل والنهار والحركة الظاهرية للشمس", "answerIndex": 2, "explanation": "يترتب على دوران الأرض حول محورها أمام الشمس تعاقب الليل والنهار والحركة الظاهرية للشمس، بينما يترتب على ميل محورها ودورانها حول الشمس تعاقب فصول السنة الأربعة.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316866/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AD%D8%B1%D9%83%D8%A9-%D8%A7%D9%84%D8%B8%D8%A7%D9%87%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D8%B4%D9%85%D8%B3"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-185", "question": "ما الذي يترتب على ميل محور الأرض ودورانها حول الشمس؟", "choices": ["تعاقب الليل والنهار", "حدوث المد والجزر", "تعاقب فصول السنة الأربعة", "تغير أطوار القمر"], "answer": "تعاقب فصول السنة الأربعة", "answerIndex": 2, "explanation": "يؤدي ميل محور الأرض ودورانها حول الشمس إلى سقوط أشعة الشمس على سطح الأرض بزوايا مختلفة، فيترتب على ذلك تعاقب فصول السنة الأربعة على مدار 365.25 يومًا.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316866/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AD%D8%B1%D9%83%D8%A9-%D8%A7%D9%84%D8%B8%D8%A7%D9%87%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D8%B4%D9%85%D8%B3"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-186", "question": "في أي اتجاه تبدو الشمس متحركة في السماء أثناء دوران الأرض حول محورها؟", "choices": ["من الغرب إلى الشرق", "من الجنوب إلى الشمال", "من الشرق إلى الغرب", "من الشمال إلى الجنوب"], "answer": "من الشرق إلى الغرب", "answerIndex": 2, "explanation": "أثناء دورة الأرض حول محورها من الغرب إلى الشرق تبدو الشمس في السماء وكأن موقعها يتغير من الشرق إلى الغرب، وهو ما يُسمى بالحركة الظاهرية للشمس.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316866/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AD%D8%B1%D9%83%D8%A9-%D8%A7%D9%84%D8%B8%D8%A7%D9%87%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D8%B4%D9%85%D8%B3"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-187", "question": "متى يكون طول ظل العصا أقل ما يمكن؟", "choices": ["وقت الظهيرة", "وقت غروب الشمس", "وقت شروق الشمس", "منتصف الليل"], "answer": "وقت الظهيرة", "answerIndex": 0, "explanation": "طول الظل المتكون وقت الظهيرة يكون أقل ما يمكن لأن الارتفاع الظاهري للشمس يكون أكبر ما يمكن وقت الظهيرة، والعلاقة بين الارتفاع الظاهري للشمس وطول الظل عكسية.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316866/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AD%D8%B1%D9%83%D8%A9-%D8%A7%D9%84%D8%B8%D8%A7%D9%87%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D8%B4%D9%85%D8%B3"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-188", "question": "ما الأداة القديمة التي كانت تُستخدم في تحديد الوقت اعتمادًا على طول واتجاه الظل؟", "choices": ["التلسكوب", "البوصلة", "الساعة الرملية", "المزولة"], "answer": "المزولة", "answerIndex": 3, "explanation": "المزولة ساعة شمسية قديمة كانت تُستخدم في تحديد الوقت اعتمادًا على طول واتجاه الظل الناتج عن الحركة الظاهرية للشمس.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316866/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AD%D8%B1%D9%83%D8%A9-%D8%A7%D9%84%D8%B8%D8%A7%D9%87%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D8%B4%D9%85%D8%B3"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-189", "question": "في أي فصل يكون الطرف الشمالي لمحور الأرض مائلًا نحو الشمس؟", "choices": ["فصل الصيف", "فصل الشتاء", "فصل الربيع", "فصل الخريف"], "answer": "فصل الصيف", "answerIndex": 0, "explanation": "الطرف الشمالي لمحور الأرض يكون مائلًا باتجاه الشمس في فصل الصيف، ومائلًا بعيدًا عنها في فصل الشتاء، أما في فصلي الربيع والخريف فلا يكون مائلًا نحوها أو بعيدًا عنها.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316866/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D9%84%D8%AD%D8%B1%D9%83%D8%A9-%D8%A7%D9%84%D8%B8%D8%A7%D9%87%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D8%B4%D9%85%D8%B3"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-190", "question": "ما أقرب الأجسام الفضائية إلى الأرض؟", "choices": ["القمر", "المريخ", "الزهرة", "الشمس"], "answer": "القمر", "answerIndex": 0, "explanation": "القمر جسم معتم تابع للأرض، ويُعد أقرب الأجسام الفضائية إلى الأرض، ويظهر منيرًا نتيجة عكس ضوء الشمس.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316902/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D8%B3%D8%AA%D8%BA%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D9%84%D9%85-%D9%81%D9%89-%D8%AE%D8%AF%D8%A7%D8%B9-%D8%A7%D9%84%D8%A8%D8%B3%D8%B7%D8%A7%D8%A1?teacher=3867326"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-191", "question": "كم طورًا يمر بها القمر خلال الشهر العربي؟", "choices": ["ثمانية أطوار", "ستة أطوار", "أربعة أطوار", "اثنا عشر طورًا"], "answer": "ثمانية أطوار", "answerIndex": 0, "explanation": "يمر القمر بثمانية أطوار خلال الشهر العربي: المحاق، والهلال الأول، والتربيع الأول، والأحدب الأول، والبدر، والأحدب الثاني، والتربيع الأخير، والهلال الثاني.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316902/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D8%B3%D8%AA%D8%BA%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D9%84%D9%85-%D9%81%D9%89-%D8%AE%D8%AF%D8%A7%D8%B9-%D8%A7%D9%84%D8%A8%D8%B3%D8%B7%D8%A7%D8%A1?teacher=3867326"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-192", "question": "في أي طور يكون القمر بعد مرور 7 أيام من بداية الشهر العربي؟", "choices": ["الأحدب الثاني", "البدر", "التربيع الأول", "المحاق"], "answer": "التربيع الأول", "answerIndex": 2, "explanation": "أطوار القمر: المحاق في بداية الشهر، ثم الهلال الأول، ثم التربيع الأول بعد مرور 7 أيام، ثم الأحدب الأول في اليوم الحادي عشر، ثم البدر بعد مرور 14 يومًا.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316902/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D8%B3%D8%AA%D8%BA%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D9%84%D9%85-%D9%81%D9%89-%D8%AE%D8%AF%D8%A7%D8%B9-%D8%A7%D9%84%D8%A8%D8%B3%D8%B7%D8%A7%D8%A1?teacher=3867326"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-193", "question": "عندما يُكمل القمر الربع الثاني من دورته حول الأرض يصبح في طور .......", "choices": ["المحاق", "الأحدب الأول", "البدر", "التربيع الأول"], "answer": "البدر", "answerIndex": 2, "explanation": "عند إكمال القمر الربع الثاني من دورته (بعد مرور 14 يومًا) يصبح في طور البدر، ويظهر على هيئة قرص مكتمل.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316902/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D8%B3%D8%AA%D8%BA%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D9%84%D9%85-%D9%81%D9%89-%D8%AE%D8%AF%D8%A7%D8%B9-%D8%A7%D9%84%D8%A8%D8%B3%D8%B7%D8%A7%D8%A1?teacher=3867326"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-194", "question": "ما نسبة ما قُطع من دورة القمر حول الأرض حتى الوصول إلى طور البدر؟", "choices": ["الثلث", "الدورة كاملة", "النصف", "الربع"], "answer": "النصف", "answerIndex": 2, "explanation": "حتى الوصول إلى طور البدر يكون القمر قد قطع نصف دورته حول الأرض (ربعان)، إذ يظهر البدر بعد مرور 14 يومًا من دورة مدتها 29.5 يومًا.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316902/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D8%B3%D8%AA%D8%BA%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D9%84%D9%85-%D9%81%D9%89-%D8%AE%D8%AF%D8%A7%D8%B9-%D8%A7%D9%84%D8%A8%D8%B3%D8%B7%D8%A7%D8%A1?teacher=3867326"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-195", "question": "ما الفترة الزمنية بين طوري البدر والمحاق؟", "choices": ["15 يومًا", "29 يومًا", "11 يومًا", "7 أيام"], "answer": "15 يومًا", "answerIndex": 0, "explanation": "الفترة بين طوري البدر والمحاق نحو 15 يومًا، أي نصف دورة القمر حول الأرض (29.5 يومًا).", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316902/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D8%B3%D8%AA%D8%BA%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D9%84%D9%85-%D9%81%D9%89-%D8%AE%D8%AF%D8%A7%D8%B9-%D8%A7%D9%84%D8%A8%D8%B3%D8%B7%D8%A7%D8%A1?teacher=3867326"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-196", "question": "ما المنطقة شبه المضيئة التي تحيط بالظل ويصلها جزء من الأشعة الضوئية؟", "choices": ["الكسوف", "الظل", "الهالة", "شبه الظل"], "answer": "شبه الظل", "answerIndex": 3, "explanation": "وجود جسم معتم في مسار الأشعة الضوئية يؤدي إلى تكوين منطقة مظلمة تُعرف باسم الظل، تحيط بها منطقة يصلها جزء من الأشعة الضوئية فتكون شبه مضيئة تُعرف باسم شبه الظل.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316902/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D8%B3%D8%AA%D8%BA%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D9%84%D9%85-%D9%81%D9%89-%D8%AE%D8%AF%D8%A7%D8%B9-%D8%A7%D9%84%D8%A8%D8%B3%D8%B7%D8%A7%D8%A1?teacher=3867326"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-197", "question": "يحدث خسوف القمر الجزئي عندما .......", "choices": ["يقع القمر في منطقتي الظل وشبه الظل", "يقع القمر في منطقة شبه الظل فقط", "يكون القمر في طور المحاق", "يكون القمر في طور الهلال"], "answer": "يقع القمر في منطقتي الظل وشبه الظل", "answerIndex": 0, "explanation": "الخسوف الجزئي يظهر فيه القمر ناقصًا عندما يقع في منطقتي الظل وشبه الظل، أما الخسوف الكلي فيظهر فيه القمر كقرص معتم لعدم وصول ضوء الشمس إليه.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316902/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D8%B3%D8%AA%D8%BA%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D9%84%D9%85-%D9%81%D9%89-%D8%AE%D8%AF%D8%A7%D8%B9-%D8%A7%D9%84%D8%A8%D8%B3%D8%B7%D8%A7%D8%A1?teacher=3867326"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-198", "question": "أين يقع القمر عند حدوث الخسوف الكلي؟", "choices": ["خارج مدار الأرض", "في منطقة ظل الأرض بالكامل", "بين الشمس والأرض", "في منطقة شبه ظل الأرض فقط"], "answer": "في منطقة ظل الأرض بالكامل", "answerIndex": 1, "explanation": "في الخسوف الكلي يقع القمر بالكامل في منطقة ظل الأرض فيظهر كقرص معتم لعدم وصول ضوء الشمس إليه.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316902/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D8%B3%D8%AA%D8%BA%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D9%84%D9%85-%D9%81%D9%89-%D8%AE%D8%AF%D8%A7%D8%B9-%D8%A7%D9%84%D8%A8%D8%B3%D8%B7%D8%A7%D8%A1?teacher=3867326"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-199", "question": "عند وقوع القمر بالكامل في منطقة شبه ظل الأرض فإنه .......", "choices": ["يُرى قرصًا أحمر مضاءً بإضاءة خافتة، ولا يُعد خسوفًا", "يختفي تمامًا ويُعد خسوفًا كليًا", "يظهر ناقصًا ويُعد خسوفًا جزئيًا", "يظهر قرصًا مكتملًا شديد الإضاءة"], "answer": "يُرى قرصًا أحمر مضاءً بإضاءة خافتة، ولا يُعد خسوفًا", "answerIndex": 0, "explanation": "عند وقوع القمر بالكامل في منطقة شبه ظل الأرض فإنه يُرى على هيئة قرص أحمر مضاء بإضاءة خافتة، وهذا لا يُعد خسوفًا.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lecture/316902/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85/%D8%A7%D8%B3%D8%AA%D8%BA%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D9%84%D9%85-%D9%81%D9%89-%D8%AE%D8%AF%D8%A7%D8%B9-%D8%A7%D9%84%D8%A8%D8%B3%D8%B7%D8%A7%D8%A1?teacher=3867326"}, {"grade": 7, "subject": "العلوم", "id": "h26-g7-200", "question": "لماذا لا يحدث كسوف الشمس كل شهر؟", "choices": ["لأن مستوى مدار القمر حول الأرض يميل 5 درجات عن مستوى مدار الأرض حول الشمس فلا تقع الأجرام الثلاثة على استقامة واحدة كل شهر", "لأن الشمس تبتعد عن الأرض كل شهر", "لأن القمر يدور حول الأرض مرة كل عام", "لأن القمر يكون في طور البدر كل شهر"], "answer": "لأن مستوى مدار القمر حول الأرض يميل 5 درجات عن مستوى مدار الأرض حول الشمس فلا تقع الأجرام الثلاثة على استقامة واحدة كل شهر", "answerIndex": 0, "explanation": "من شروط الكسوف وقوع الأرض والقمر والشمس على استقامة واحدة، وهذا لا يحدث في كل شهر لأن مستوى دوران القمر حول الأرض يميل عن مستوى دوران الأرض حول الشمس بمقدار 5 درجات؛ والسبب نفسه يفسر عدم حدوث خسوف للقمر في كل طور بدر.", "type": "mcq", "topic": "", "source": "https://minhaji.com/export/10217"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-201", "question": "ترتيب قارة إفريقيا بين قارات العالم من حيث المساحة هو .........", "choices": ["الرابع", "الأول", "الثاني", "الثالث"], "answer": "الثاني", "answerIndex": 2, "explanation": "قارة إفريقيا ثاني أكبر قارات العالم من حيث المساحة بعد قارة آسيا.", "type": "mcq", "topic": "", "source": "https://anwar-azzouz.com/prep-1-studies"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-202", "question": "تمثل مساحة قارة إفريقيا نحو ......... من مساحة اليابس في الكرة الأرضية.", "choices": ["10%", "30%", "40%", "20%"], "answer": "20%", "answerIndex": 3, "explanation": "تمثل قارة إفريقيا نحو 20% من مساحة اليابس، أي ما يعادل خُمس المساحة.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_24.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-203", "question": "يمر بقارة إفريقيا ......... دوائر عرض رئيسية.", "choices": ["دائرتا عرض", "ثلاث دوائر عرض", "خمس دوائر عرض", "أربع دوائر عرض"], "answer": "ثلاث دوائر عرض", "answerIndex": 1, "explanation": "يمر بإفريقيا ثلاث دوائر عرض رئيسية: مدار السرطان في الشمال، ودائرة الاستواء في الوسط، ومدار الجدي في الجنوب.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_24.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-204", "question": "دائرة العرض الرئيسية التي تمر في وسط قارة إفريقيا تقريبًا هي دائرة .........", "choices": ["جرينتش", "الجدي", "الاستواء", "السرطان"], "answer": "الاستواء", "answerIndex": 2, "explanation": "تمر دائرة الاستواء في وسط قارة إفريقيا تقريبًا، بينما يمر مدار السرطان في الشمال ومدار الجدي في الجنوب.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_24.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-205", "question": "تمتد قارة إفريقيا بين دائرتي عرض .........", "choices": ["51 درجة شرقًا و17 درجة غربًا", "37.5 درجة شمالًا و34.5 درجة جنوبًا", "34.5 درجة شمالًا و37.5 درجة جنوبًا", "17 درجة شرقًا و51 درجة غربًا"], "answer": "37.5 درجة شمالًا و34.5 درجة جنوبًا", "answerIndex": 1, "explanation": "تمتد إفريقيا بين دائرتي عرض 37.5 درجة شمالًا و34.5 درجة جنوبًا (37°30′ شمالًا و34°30′ جنوبًا)، وبين خطي طول 51 درجة شرقًا و17 درجة غربًا.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_24.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-206", "question": "تقترب قارة إفريقيا من قارة أوروبا عند مضيق .........", "choices": ["هرمز", "تيران", "جبل طارق", "باب المندب"], "answer": "جبل طارق", "answerIndex": 2, "explanation": "تقترب إفريقيا من أوروبا عند مضيق جبل طارق، وتقترب من آسيا عند مضيق باب المندب.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_24.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-207", "question": "تتصل قارة إفريقيا بقارة آسيا عن طريق .........", "choices": ["مضيق جبل طارق", "مضيق باب المندب", "قناة السويس", "شبه جزيرة سيناء"], "answer": "شبه جزيرة سيناء", "answerIndex": 3, "explanation": "تتصل إفريقيا بآسيا عن طريق شبه جزيرة سيناء، وهي معبر للحضارات بين القارتين.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_24.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-208", "question": "تضم قارة إفريقيا ......... دولة.", "choices": ["34 دولة", "54 دولة", "64 دولة", "44 دولة"], "answer": "54 دولة", "answerIndex": 1, "explanation": "تضم قارة إفريقيا 54 دولة، منها 10 دول عربية.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_24.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-209", "question": "أكبر الدول الإفريقية من حيث المساحة هي دولة .........", "choices": ["مصر", "السودان", "الجزائر", "نيجيريا"], "answer": "الجزائر", "answerIndex": 2, "explanation": "الجزائر هي أكبر الدول الإفريقية من حيث المساحة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/280110"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-210", "question": "تقع مصر في الركن ......... من قارة إفريقيا.", "choices": ["الشمالي الغربي", "الجنوبي الغربي", "الجنوبي الشرقي", "الشمالي الشرقي"], "answer": "الشمالي الشرقي", "answerIndex": 3, "explanation": "تقع مصر في الركن الشمالي الشرقي من قارة إفريقيا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/280110"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-211", "question": "أرسل الملك ......... بعثة للدوران حول قارة إفريقيا بدأت من البحر الأحمر وعادت عبر مضيق جبل طارق واستغرقت ثلاث سنوات.", "choices": ["هنري الملاح", "نخاو الثاني", "محمد علي", "الخديوي إسماعيل"], "answer": "نخاو الثاني", "answerIndex": 1, "explanation": "أرسل الملك نخاو الثاني بعثة للدوران حول إفريقيا بدأت من البحر الأحمر وعادت عبر مضيق جبل طارق، واستغرقت الرحلة ثلاث سنوات.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_24.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-212", "question": "يغلب على سطح قارة إفريقيا المظهر .........", "choices": ["الصحراوي", "السهلي", "الجبلي", "الهضبي"], "answer": "الهضبي", "answerIndex": 3, "explanation": "أغلب سطح قارة إفريقيا يتكون من هضاب واسعة، لذلك يغلب عليها المظهر الهضبي.", "type": "mcq", "topic": "", "source": "https://anwar-azzouz.com/prep-1-studies"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-213", "question": "هضبة شمال إفريقيا هضبة .........", "choices": ["ضيقة الاتساع قليلة الارتفاع", "عظيمة الاتساع شديدة الارتفاع", "عظيمة الاتساع قليلة الارتفاع", "ضيقة الاتساع شديدة الارتفاع"], "answer": "عظيمة الاتساع قليلة الارتفاع", "answerIndex": 2, "explanation": "هضبة شمال إفريقيا هضبة عظيمة الاتساع وقليلة الارتفاع، وتنحدر تدريجيًّا نحو الشمال حتى تلتقي بسواحل البحر المتوسط.", "type": "mcq", "topic": "", "source": "https://anwar-azzouz.com/prep-1-studies"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-214", "question": "توجد ......... أكبر صحاري العالم في هضبة شمال إفريقيا.", "choices": ["صحراء ناميبيا", "الصحراء الغربية", "الصحراء الكبرى", "صحراء كلهاري"], "answer": "الصحراء الكبرى", "answerIndex": 2, "explanation": "توجد الصحراء الكبرى — أكبر صحاري العالم — في هضبة شمال إفريقيا.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_18.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-215", "question": "أعلى قمة جبلية في قارة إفريقيا هي جبل .........", "choices": ["توبقال", "دراكنزبرج", "كينيا", "كلمنجارو"], "answer": "كلمنجارو", "answerIndex": 3, "explanation": "جبل كلمنجارو هو أعلى قمة جبلية في إفريقيا (5895 مترًا)، وهو جبل بركاني تتكون الثلوج فوق قمته رغم وقوعه في المنطقة الاستوائية الحارة.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_18.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-216", "question": "تقع جبال أطلس في دول .........", "choices": ["المغرب والجزائر وتونس", "مصر والسودان وإريتريا", "كينيا وأوغندا وتنزانيا", "ليبيا وتشاد والنيجر"], "answer": "المغرب والجزائر وتونس", "answerIndex": 0, "explanation": "تقع جبال أطلس في ثلاث دول هي المغرب والجزائر وتونس، وأعلى قمة فيها جبل توبقال بالمغرب.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_18.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-217", "question": "أعلى قمة جبلية في سلسلة جبال البحر الأحمر هي جبل ......... ويقع في مصر.", "choices": ["شايب البنات", "الكاب", "توبقال", "كلمنجارو"], "answer": "شايب البنات", "answerIndex": 0, "explanation": "أعلى قمة جبلية في سلسلة جبال البحر الأحمر هي جبل شايب البنات في مصر.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_18.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-218", "question": "تُعد هضبة الحبشة المنبع ......... لنهر النيل.", "choices": ["الشتوي", "الموسمي", "الدائم", "الوحيد"], "answer": "الموسمي", "answerIndex": 1, "explanation": "تُعد هضبة الحبشة المنبع الموسمي لنهر النيل لأن الأمطار تسقط عليها في فصل الصيف.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_18.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-219", "question": "يُعد نهر النيل نهرًا دوليًّا لأن مجراه وروافده تمتد داخل أراضي ......... دولة.", "choices": ["ثلاث", "إحدى عشرة", "خمس", "سبع"], "answer": "إحدى عشرة", "answerIndex": 1, "explanation": "يُعد نهر النيل نهرًا دوليًّا لامتداد مجراه وروافده داخل أراضي إحدى عشرة دولة.", "type": "mcq", "topic": "", "source": "https://anwar-azzouz.com/prep-1-studies"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-220", "question": "بحيرة فيكتوريا هي ......... أكبر البحيرات الطبيعية العذبة في العالم.", "choices": ["رابع", "أولى", "ثالث", "ثاني"], "answer": "ثاني", "answerIndex": 3, "explanation": "تتضمن هضبة البحيرات الاستوائية مجموعة من البحيرات أهمها بحيرة فيكتوريا، ثاني أكبر البحيرات الطبيعية العذبة في العالم.", "type": "mcq", "topic": "", "source": "https://anwar-azzouz.com/prep-1-studies"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-221", "question": "تُعد هضبة البحيرات الاستوائية المنبع ......... لنهر النيل.", "choices": ["الدائم", "الوحيد", "الموسمي", "الصيفي"], "answer": "الدائم", "answerIndex": 0, "explanation": "تُعد هضبة البحيرات الاستوائية المنبع الدائم لنهر النيل.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_18.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-222", "question": "نهر ......... رافد من هضبة الحبشة يقابل النيل شمال التقاء النيل الأزرق بالنيل الأبيض.", "choices": ["الكونغو", "عطبرة", "زمبيزي", "النيجر"], "answer": "عطبرة", "answerIndex": 1, "explanation": "نهر عطبرة من المنابع الموسمية في هضبة الحبشة، ويقابل النيل شمال التقاء النيل الأزرق بالنيل الأبيض، ويمد النيل بمياهه حتى المصب.", "type": "mcq", "topic": "", "source": "https://anwar-azzouz.com/prep-1-studies"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-223", "question": "دفعت مصر تكاليف إنشاء خزان جبل الأولياء لتوليد الطاقة الكهربائية في دولة .........", "choices": ["كينيا", "أوغندا", "إثيوبيا", "السودان"], "answer": "السودان", "answerIndex": 3, "explanation": "دفعت مصر تكاليف إنشاء خزان جبل الأولياء في السودان لتوليد الطاقة الكهربائية؛ وفي أوغندا أنشأت سد أوين.", "type": "mcq", "topic": "", "source": "https://anwar-azzouz.com/prep-1-studies"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-224", "question": "قامت حضارة كوش في دولة .........", "choices": ["إثيوبيا", "السودان", "مصر", "تونس"], "answer": "السودان", "answerIndex": 1, "explanation": "قامت حضارة كوش في السودان، وهي من الحضارات الإفريقية القديمة التي نشأت على ضفاف النيل.", "type": "mcq", "topic": "", "source": "https://alhakimblog2023.blogspot.com/2025/08/blog-post_24.html"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-225", "question": "نشأت حضارة قرطاج في دولة .........", "choices": ["المغرب", "تونس", "الجزائر", "ليبيا"], "answer": "تونس", "answerIndex": 1, "explanation": "نشأت حضارة قرطاج في دولة تونس.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/280110"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-226", "question": "يبدأ عصر الدولة القديمة بالأسرة .........", "choices": ["السادسة", "الرابعة", "الخامسة", "الثالثة"], "answer": "الثالثة", "answerIndex": 3, "explanation": "يبدأ عصر الدولة القديمة بالأسرة الثالثة، ومن أشهر ملوكها الملك زوسر صاحب الهرم المدرج بسقارة.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lesson/34483/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%AA%D9%82%D9%8A%D9%8A%D9%85-%D8%AE%D8%AA%D8%A7%D9%85%D9%8A-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D9%88%D8%AD%D8%AF%D8%A9-%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%D8%A9?without_solution=1"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-227", , "choices": ["50%", "10%", "25%", "1%"], "answer": "1%", "answerIndex": 3, "explanation": "تُعرف الأراضي الرطبة العذبة بالنظم البرمائية، وتقع بين الأنظمة البرية والمائية، وتمثل الأراضي الرطبة في قارة إفريقيا نحو 1% من مساحتها؛ ومن أهمها مستنقعات الغابات ومستنقعات البردي ومستنقعات السد في جنوب السودان.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lesson/34486/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D9%84%D8%AF%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB-%D8%A7%D9%84%D9%86%D8%B8%D9%85-%D8%A7%D9%84%D8%A8%D9%8A%D8%A6%D9%8A%D8%A9-%D8%A7%D9%84%D9%85%D8%A7%D8%A6%D9%8A%D8%A9-%D9%81%D9%8A-%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A7?without_solution=1"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-282", "question": "تأتي قارة إفريقيا في المرتبة ......... بعد قارة آسيا من حيث مساحة المانجروف", "choices": ["الثانية", "الثالثة", "الأولى", "الرابعة"], "answer": "الثانية", "answerIndex": 0, "explanation": "تأتي قارة إفريقيا في المرتبة الثانية بعد قارة آسيا من حيث مساحة المانجروف، وتنتشر أشجار المانجروف في إفريقيا بشكل أكثر وضوحًا في السواحل الغربية عن الشرقية لكثرة النظم النهرية وزيادة كمية الأمطار.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lesson/34486/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D9%84%D8%AF%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB-%D8%A7%D9%84%D9%86%D8%B8%D9%85-%D8%A7%D9%84%D8%A8%D9%8A%D8%A6%D9%8A%D8%A9-%D8%A7%D9%84%D9%85%D8%A7%D8%A6%D9%8A%D8%A9-%D9%81%D9%8A-%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A7?without_solution=1"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-283", "question": "أُعلنت جميع مناطق المانجروف في مصر محميات طبيعية مثل محميات .........", "choices": ["وادي الريان وقارون", "رأس محمد والزرانيق", "نبق وعلبة وحماطة", "سيوة والواحات البحرية"], "answer": "نبق وعلبة وحماطة", "answerIndex": 2, "explanation": "تبلغ مساحة المانجروف في مصر نحو 5 كم²، وتنمو أشجاره في مساحات صغيرة على سواحل البحر الأحمر وخليج العقبة، وأُعلنت جميع مناطق المانجروف في مصر محميات طبيعية مثل محميات نبق وعلبة وحماطة.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lesson/34486/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D9%84%D8%AF%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB-%D8%A7%D9%84%D9%86%D8%B8%D9%85-%D8%A7%D9%84%D8%A8%D9%8A%D8%A6%D9%8A%D8%A9-%D8%A7%D9%84%D9%85%D8%A7%D8%A6%D9%8A%D8%A9-%D9%81%D9%8A-%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A7?without_solution=1"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-284", "question": "من مناطق الشعاب المرجانية في مصر .........", "choices": ["بحيرة المنزلة وبحيرة البردويل", "دلتا النيجر وخليج غينيا", "الغردقة ومحمية رأس محمد ومنطقة دهب", "واحة سيوة وواحة الفرافرة"], "answer": "الغردقة ومحمية رأس محمد ومنطقة دهب", "answerIndex": 2, "explanation": "توجد الشعاب المرجانية في معظم السواحل الشرقية لقارة إفريقيا وسواحل جزر القمر ومدغشقر، وسواحل البحر الأحمر في مصر، خاصة في منطقة الغردقة ومحمية رأس محمد ومنطقة دهب.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lesson/34486/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D9%84%D8%AF%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB-%D8%A7%D9%84%D9%86%D8%B8%D9%85-%D8%A7%D9%84%D8%A8%D9%8A%D8%A6%D9%8A%D8%A9-%D8%A7%D9%84%D9%85%D8%A7%D8%A6%D9%8A%D8%A9-%D9%81%D9%8A-%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A7?without_solution=1"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-285", "question": "تأسس الصندوق الإفريقي لتغير المناخ في عام ......... لمساعدة الدول الإفريقية على مواجهة مشكلة التغيرات المناخية", "choices": ["2001م", "2012م", "2014م", "2030م"], "answer": "2014م", "answerIndex": 2, "explanation": "من الجهود الإفريقية للحفاظ على النظم البيئية والتنوع البيولوجي: تأسيس الصندوق الإفريقي لتغير المناخ في عام 2014م لمساعدة الدول الإفريقية على مواجهة مشكلة التغيرات المناخية، وإعداد أجندة 2063 «إفريقيا التي نريدها».", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lesson/34486/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D9%84%D8%AF%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D8%A7%D9%84%D8%AB-%D8%A7%D9%84%D9%86%D8%B8%D9%85-%D8%A7%D9%84%D8%A8%D9%8A%D8%A6%D9%8A%D8%A9-%D8%A7%D9%84%D9%85%D8%A7%D8%A6%D9%8A%D8%A9-%D9%81%D9%8A-%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A7?without_solution=1"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-286", "question": "عرفت إفريقيا الإسلام لأول مرة عندما أشار النبي ﷺ على أصحابه بالهجرة إلى .........", "choices": ["بلاد فارس", "بلاد الشام", "بلاد الحبشة", "بلاد الأندلس"], "answer": "بلاد الحبشة", "answerIndex": 2, "explanation": "عرفت إفريقيا الإسلام لأول مرة عندما أشار النبي محمد ﷺ على أصحابه بالهجرة إلى بلاد الحبشة فرارًا من أذى قريش.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lesson/34488/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D9%84%D8%AF%D8%B1%D8%B3-%D8%A7%D9%84%D8%A3%D9%88%D9%84-%D8%A7%D9%86%D8%AA%D8%B4%D8%A7%D8%B1-%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85-%D9%81%D9%8A-%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A7?without_solution=1"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-287", "question": "يُعد المعبر البري الوحيد الذي يربط شبه الجزيرة العربية بإفريقيا .........", "choices": ["شبه جزيرة سيناء", "المحيط الهندي", "مضيق باب المندب", "البحر الأحمر"], "answer": "شبه جزيرة سيناء", "answerIndex": 0, "explanation": "تُعد شبه جزيرة سيناء المعبر البري الوحيد الذي يربط شبه الجزيرة العربية بإفريقيا، ومنها عبرت جيوش المسلمين لفتح شمال إفريقيا ونشر الإسلام بها.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lesson/34488/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D9%84%D8%AF%D8%B1%D8%B3-%D8%A7%D9%84%D8%A3%D9%88%D9%84-%D8%A7%D9%86%D8%AA%D8%B4%D8%A7%D8%B1-%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85-%D9%81%D9%8A-%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A7?without_solution=1"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-288", "question": "كان للتجار المسلمين دور بارز في نشر الإسلام بإفريقيا من خلال .........", "choices": ["إجبار الناس على اعتناق الإسلام", "فرض الضرائب على السكان", "منع التجارة مع القبائل الإفريقية", "حسن أخلاقهم من الصدق والأمانة ورفض التعامل بالربا أو الغش"], "answer": "حسن أخلاقهم من الصدق والأمانة ورفض التعامل بالربا أو الغش", "answerIndex": 3, "explanation": "كان للتجار المسلمين دور بارز في نشر الإسلام بإفريقيا وإن كان بشكل غير مباشر، وذلك من خلال مظهرهم وملابسهم النظيفة المحتشمة، وحسن أخلاقهم من الصدق والأمانة ورفض التعامل بالربا أو الغش.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lesson/34488/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D9%84%D8%AF%D8%B1%D8%B3-%D8%A7%D9%84%D8%A3%D9%88%D9%84-%D8%A7%D9%86%D8%AA%D8%B4%D8%A7%D8%B1-%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85-%D9%81%D9%8A-%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A7?without_solution=1"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-289", "question": "تحولت مدينة «تمبكتو» في مالي من مركز تجاري إلى .........", "choices": ["مركز ثقافي وعلمي لنشر الإسلام", "عاصمة للخلافة العباسية", "ميناء عسكري للروم", "مركز لتجارة الرقيق"], "answer": "مركز ثقافي وعلمي لنشر الإسلام", "answerIndex": 0, "explanation": "تحولت العديد من المواني والمراكز التجارية إلى مراكز ثقافية وعلمية لنشر الإسلام مثل مدينة «كانو» في نيجيريا، ومدينة «تمبكتو» في مالي.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lesson/34488/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D9%84%D8%AF%D8%B1%D8%B3-%D8%A7%D9%84%D8%A3%D9%88%D9%84-%D8%A7%D9%86%D8%AA%D8%B4%D8%A7%D8%B1-%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85-%D9%81%D9%8A-%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A7?without_solution=1"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-290", "question": "كانت ......... أولى الدول الإفريقية التي فتحها عمرو بن العاص في عهد الخليفة عمر بن الخطاب", "choices": ["مصر", "طرابلس", "إفريقية (تونس)", "برقة"], "answer": "مصر", "answerIndex": 0, "explanation": "بدأ الفتح الإسلامي لقارة إفريقيا منذ عهد الخلفاء الراشدين، وكانت مصر أولى الدول الإفريقية التي فتحها عمرو بن العاص في عهد الخليفة عمر بن الخطاب، ومنها انتشر الإسلام لدول إفريقيا.", "type": "mcq", "topic": "", "source": "https://sahl.io/index.php/eg/lesson/34488/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D9%84%D8%AF%D8%B1%D8%B3-%D8%A7%D9%84%D8%A3%D9%88%D9%84-%D8%A7%D9%86%D8%AA%D8%B4%D8%A7%D8%B1-%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85-%D9%81%D9%8A-%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A7?without_solution=1"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-291", "question": "فتح عبد الله بن أبي السرح مدينة سبيطلة في عهد الخليفة .........", "choices": ["عثمان بن عفان", "علي بن أبي طالب", "عمر بن الخطاب", "أبو بكر الصديق"], "answer": "عثمان بن عفان", "answerIndex": 0, "explanation": "أرسل عبد الله بن أبي السرح الحملات الاستطلاعية لأطراف إفريقية (تونس حاليًا)، ثم استأذن الخليفة عثمان بن عفان في فتح إفريقية، وخرج على رأس جيش المسلمين حتى وصل قرب سبيطلة وانتصر على
