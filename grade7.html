بي صلى الله عليه وسلم الذي كان من السابقين إلى الإسلام؟", "choices": ["عمار بن ياسر", "زيد بن حارثة", "سلمان الفارسي", "بلال بن رباح"], "answer": "زيد بن حارثة", "answerIndex": 1, "explanation": "من أوائل من آمن بالنبي صلى الله عليه وسلم زيد بن حارثة، وحاضنته أم أيمن.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-639", "question": "من حاضنة النبي صلى الله عليه وسلم التي كانت من السابقين إلى الإسلام؟", "choices": ["أم أيمن", "الشفاء بنت عوف", "حليمة السعدية", "ثويبة الأسلمية"], "answer": "أم أيمن", "answerIndex": 0, "explanation": "من أوائل من آمن بالنبي صلى الله عليه وسلم حاضنته أم أيمن رضي الله عنها.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-640", "question": "من الصحابي الذي كان من السابقين إلى الإسلام وهو من العشرة المبشرين بالجنة؟", "choices": ["عمار بن ياسر", "بلال بن رباح", "عثمان بن عفان", "عبد الله بن مسعود"], "answer": "عثمان بن عفان", "answerIndex": 2, "explanation": "من أوائل من آمن بالنبي صلى الله عليه وسلم عثمان بن عفان، والزبير بن العوام، وسعد بن أبي وقاص، وعبد الرحمن بن عوف.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-641", "question": "ما السورة التي ورد فيها الأمر بالجهر بالدعوة: ﴿فَاصْدَعْ بِمَا تُؤْمَرُ وَأَعْرِضْ عَنِ الْمُشْرِكِينَ﴾؟", "choices": ["سورة العلق", "سورة المدثر", "سورة المسد", "سورة الحجر"], "answer": "سورة الحجر", "answerIndex": 3, "explanation": "أمر الله رسوله صلى الله عليه وسلم بأن يجهر بالدعوة إلى دين الله بقوله تعالى: ﴿فَاصْدَعْ بِمَا تُؤْمَرُ وَأَعْرِضْ عَنِ الْمُشْرِكِينَ﴾ (سورة الحجر، الآية 94).", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-642", "question": "ما رقم الآية التي أمر الله فيها نبيه بالجهر بالدعوة في سورة الحجر؟", "choices": ["الآية 94", "الآية 95", "الآية 93", "الآية 99"], "answer": "الآية 94", "answerIndex": 0, "explanation": "قال الله تعالى: ﴿فَاصْدَعْ بِمَا تُؤْمَرُ وَأَعْرِضْ عَنِ الْمُشْرِكِينَ﴾ (سورة الحجر، الآية 94).", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-643", "question": "بأي جبل صعد النبي صلى الله عليه وسلم حين جهر بالدعوة؟", "choices": ["جبل ثور", "جبل عرفات", "جبل حراء", "جبل الصفا"], "answer": "جبل الصفا", "answerIndex": 3, "explanation": "صعد النبي صلى الله عليه وسلم في يوم على جبل الصفا، وهو جبل معروف في مكة منه يبدأ السعي بين الصفا والمروة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-644", "question": "بماذا بدأ النبي صلى الله عليه وسلم دعوته الجهرية؟", "choices": ["بأهل الطائف", "بأهله الأقربين", "بأهل الشام", "بأهل يثرب"], "answer": "بأهله الأقربين", "answerIndex": 1, "explanation": "أمر الله رسوله صلى الله عليه وسلم بأن يجهر بالدعوة، فبدأ بأهله الأقربين، ثم صعد على جبل الصفا.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-645", "question": "ماذا قالت قريش للنبي صلى الله عليه وسلم حين سألهم: «أرأيتم لو أخبرتكم أن خيلًا بسفح هذا الجبل تريد أن تغير عليكم أكنتم مصدقي»؟", "choices": ["«تبًا لك ألهذا جمعتنا»", "«فإني نذير لكم بين يدي عذاب شديد»", "«ما أنا بقارئ»", "«ما جربنا عليك كذبًا قط»"], "answer": "«ما جربنا عليك كذبًا قط»", "answerIndex": 3, "explanation": "قال النبي صلى الله عليه وسلم: «أرأيتم لو أخبرتكم أن خيلًا بسفح هذا الجبل تريد أن تغير عليكم أكنتم مصدقي»؟ قالوا: نعم، «ما جربنا عليك كذبًا قط»، فقال: «فإني نذير لكم بين يدي عذاب شديد».", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-646", "question": "من الذي قال للنبي صلى الله عليه وسلم حين جهر بالدعوة: «تبًا لك ألهذا جمعتنا»؟", "choices": ["أبو جهل بن هشام", "أمية بن خلف", "عتبة بن ربيعة", "عمه أبو لهب"], "answer": "عمه أبو لهب", "answerIndex": 3, "explanation": "لما قال النبي صلى الله عليه وسلم: «فإني نذير لكم بين يدي عذاب شديد»، قال له عمه أبو لهب: «تبًا لك ألهذا جمعتنا»، فأنزل الله تعالى فيه سورة المسد.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-647", "question": "ما السورة التي نزلت في أبي لهب؟", "choices": ["سورة الإخلاص", "سورة الفيل", "سورة الكوثر", "سورة المسد"], "answer": "سورة المسد", "answerIndex": 3, "explanation": "قال أبو لهب: «تبًا لك ألهذا جمعتنا»، فأنزل الله تعالى فيه سورة المسد.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-648", "question": "من التي كانت تضع الشوك وتلقي القاذورات في طريق النبي صلى الله عليه وسلم؟", "choices": ["أم جميل بنت حرب زوجة أبي لهب", "أروى بنت عبد المطلب", "أم الحكم بنت أبي سفيان", "هند بنت عتبة"], "answer": "أم جميل بنت حرب زوجة أبي لهب", "answerIndex": 0, "explanation": "من صور إيذاء المشركين للنبي صلى الله عليه وسلم أن أم جميل بنت حرب زوجة أبي لهب كانت تضع الشوك وتلقي بالقاذورات النجسة أمام بيته وفي طريقه.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-649", "question": "ماذا قال النبي صلى الله عليه وسلم لآل ياسر وهم يعذبون في مكة؟", "choices": ["«زملوني زملوني»", "«فإني نذير لكم بين يدي عذاب شديد»", "«ما أنا بقارئ»", "«صبرًا آل ياسر، فإن موعدكم الجنة»"], "answer": "«صبرًا آل ياسر، فإن موعدكم الجنة»", "answerIndex": 3, "explanation": "مر رسول الله صلى الله عليه وسلم بعمار بن ياسر وأبيه ياسر وأمه سمية وهم يعذبون، فقال لهم: «صبرًا آل ياسر، فإن موعدكم الجنة».", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-650", "question": "من الصحابي الذي لاقى من سيده أمية بن خلف أنواعًا من الأذى؟", "choices": ["زيد بن حارثة", "بلال بن رباح", "سعد بن أبي وقاص", "عمار بن ياسر"], "answer": "بلال بن رباح", "answerIndex": 1, "explanation": "وصل إيذاء قريش إلى المستضعفين والأرقاء، ومن هؤلاء بلال بن رباح الحبشي، الذي لاقى من سيده أمية بن خلف أنواعًا من الأذى.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-651", "question": "ما تعريف علم النحو عند العلماء؟", "choices": ["العلم ببلاغة الكلام وفصاحته", "العلم بقواعد الصرف وتقاليب الكلمة", "العلم بالقواعد التي يعرف بها أحكام أواخر الكلمات العربية في حال تركيبها", "العلم بقواعد الإملاء والخط العربي"], "answer": "العلم بالقواعد التي يعرف بها أحكام أواخر الكلمات العربية في حال تركيبها", "answerIndex": 2, "explanation": "«العلم بالقواعد التي يعرف بها أحكام أواخر الكلمات العربية في حال تركيبها: من الإعراب والبناء وما يتبع ذلك».", "type": "mcq", "topic": "", "source": "https://usul.ai/ru/t/sharh-ajrumiyya"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-652", "question": "ما الكلام عند النحويين؟", "choices": ["الصوت المشتمل على بعض الحروف فقط", "كل لفظ مفيد ولو كان مفردا", "اللفظ المفرد ولو لم يفد", "اللفظ المركب المفيد بالوضع"], "answer": "اللفظ المركب المفيد بالوضع", "answerIndex": 3, "explanation": "«الكلام هو اللفظ المركب المفيد بالوضع».", "type": "mcq", "topic": "", "source": "https://usul.ai/ru/t/sharh-ajrumiyya"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-653", "question": "ما الشروط الثلاثة للكلام عند النحاة كما وردت في الكتاب المدرسي؟", "choices": ["أن يكون لفظا، وعربيا، ومفيدا فائدة تامة يكتفي بها السامع", "أن يكون مفردا ومركبا ومفيدا", "أن يكون مكتوبا ومنطوقا ومسموعا", "أن يكون اسما وفعلا وحرفا"], "answer": "أن يكون لفظا، وعربيا، ومفيدا فائدة تامة يكتفي بها السامع", "answerIndex": 0, "explanation": "«الكلام عند النحاة فهو ما اشتمل على ثلاثة شروط: أن يكون لفظا، عربيا، مفيدا فائدة تامة يكتفي بها السامع».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/285496"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-654", "question": "ما اللفظ المستعمل عند النحاة؟", "choices": ["الصوت المشتمل على بعض الحروف الهجائية التي تدل على معنى", "أي صوت يصدر من الإنسان", "الإشارة باليد الدالة على معنى", "الكتابة على الورق الدالة على معنى"], "answer": "الصوت المشتمل على بعض الحروف الهجائية التي تدل على معنى", "answerIndex": 0, "explanation": "«اللفظ المستعمل هو الصوت المشتمل على بعض الحروف الهجائية التي تدل على معنى».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/285496"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-655", "question": "ما الكلمة عند النحويين؟", "choices": ["اللفظ المركب المفيد", "اللفظ المفرد", "الصوت بلا معنى", "الجملة التامة المعنى"], "answer": "اللفظ المفرد", "answerIndex": 1, "explanation": "«الكلمة هي اللفظ المفرد».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/285496"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-656", "question": "أي مما يأتي كلام عند النحويين؟", "choices": ["غلام زيد", "إن قام زيد بلا جواب", "زيد وحدها", "قام زيد"], "answer": "قام زيد", "answerIndex": 3, "explanation": "«المركب: ما تركب من كلمتين فأكثر: كقام زيد، وزيد قائم» و«المفيد: ما أفاد فائدة يحسن السكوت عليها من المتكلم والسامع: كقام زيد، وزيد قائم»؛ أما «غلام زيد» و«إن قام زيد» بلا جواب فلا يحسن السكوت عليهما.", "type": "mcq", "topic": "", "source": "https://usul.ai/ru/t/sharh-ajrumiyya"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-657", "question": "لماذا لا تسمى الإشارة كلاما عند النحاة مع أنها مفيدة؟", "choices": ["لأنها ليست عربية", "لأنها لا تفيد السامع", "لأنها ليست لفظا، أي ليست صوتا مشتملا على بعض الحروف", "لأنها مركبة من كلمتين"], "answer": "لأنها ليست لفظا، أي ليست صوتا مشتملا على بعض الحروف", "answerIndex": 2, "explanation": "«فخرج باللفظ ما كان مفيدا ولم يكن لفظا: كالإشارة، والكتابة، والعقد، والنصب، فلا تسمى كلاما عند النحاة».", "type": "mcq", "topic": "", "source": "https://usul.ai/ru/t/sharh-ajrumiyya"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-658", "question": "ما معنى «بالوضع» في تعريف الكلام؟", "choices": ["أن تكون الألفاظ من الألفاظ التي وضعتها العرب للدلالة على معنى", "أن يكون الكلام مكتوبا", "أن يكون الكلام مقصودا فقط", "أن يكون الكلام مسموعا"], "answer": "أن تكون الألفاظ من الألفاظ التي وضعتها العرب للدلالة على معنى", "answerIndex": 0, "explanation": "«ومعنى كونه موضوعا بالوضع العربي: أن تكون الألفاظ المستعملة في الكلام من الألفاظ التي وضعتها العرب للدلالة على معنى من المعاني».", "type": "mcq", "topic": "", "source": "https://usul.ai/ru/t/sharh-ajrumiyya"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-659", "question": "كم عدد أجزاء الكلام؟ وما هي؟", "choices": ["اثنان: اسم وفعل", "أربعة: اسم وفعل وحرف وضمير", "خمسة: اسم وفعل وحرف وضمير واسم فعل", "ثلاثة: اسم وفعل وحرف"], "answer": "ثلاثة: اسم وفعل وحرف", "answerIndex": 3, "explanation": "«أقسامه ثلاثة اسم وفعل وحرف».", "type": "mcq", "topic": "", "source": "https://usul.ai/ru/t/sharh-ajrumiyya"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-660", "question": "ما علامات الاسم المميزة له عن الفعل والحرف؟", "choices": ["قد والسين وسوف", "الجزم والسكون", "الخفض والتنوين ودخول أل", "تاء التأنيث وياء المخاطبة"], "answer": "الخفض والتنوين ودخول أل", "answerIndex": 2, "explanation": "«يتميز الاسم بقبول علامات محددة وهي: الخفض (الجر)، والتنوين بجميع أشكاله، ودخول ألف واللام (أل) التعريفية عليه».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/285496"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-661", "question": "ما الخفض (الجر)؟", "choices": ["رفع آخر الكلمة بالضمة", "كسر الحرف الأخير من الكلمة بسبب عامل", "نون ساكنة تلحق آخر الاسم نطقا لا خطا", "الألف واللام في أول الكلمة"], "answer": "كسر الحرف الأخير من الكلمة بسبب عامل", "answerIndex": 1, "explanation": "«الخفض (الجر): وهو كسر الحرف الأخير من الكلمة بسبب عامل»؛ ومثاله: ذهبت إلى المسجد.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/281869"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-662", "question": "ما التنوين؟", "choices": ["كسر آخر الكلمة بسبب عامل", "نون ساكنة تلحق آخر الاسم نطقا لا خطا", "الألف واللام في أول الكلمة", "نون ساكنة تلحق آخر الفعل"], "answer": "نون ساكنة تلحق آخر الاسم نطقا لا خطا", "answerIndex": 1, "explanation": "«التنوين: وهو نون ساكنة تل swer": "قد، والسين وسوف، وتاء التأنيث الساكنة، وياء المخاطبة", "answerIndex": 0, "explanation": "«علامات الفعل أربعة»: قد، والسين وسوف، وتاء التأنيث الساكنة، وياء المخاطبة مع دلالته على الطلب.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/281869"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-668", "question": "على أي فعلين تدخل «قد»؟", "choices": ["على الماضي والمضارع", "على الأمر فقط", "على الماضي فقط", "على المضارع فقط"], "answer": "على الماضي والمضارع", "answerIndex": 0, "explanation": "«قد: وتدخل على الماضي والمضارع»؛ نحو: قد أفلح وقد تبلغ.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/281869"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-669", "question": "على أي فعل تدخل السين وسوف؟", "choices": ["على المضارع", "على الأمر", "على الماضي والمضارع", "على الماضي"], "answer": "على المضارع", "answerIndex": 0, "explanation": "«السين وسوف: وتدخلان على المضارع»؛ نحو: سيفوز وسوف أكافئ.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/281869"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-670", "question": "أين تتصل تاء التأنيث الساكنة؟", "choices": ["بأول الفعل الأمر", "بآخر الفعل الماضي", "بآخر الاسم", "بآخر الفعل المضارع"], "answer": "بآخر الفعل الماضي", "answerIndex": 1, "explanation": "«تاء التأنيث الساكنة: وتتصل بآخر الماضي»؛ نحو: أشرقت الشمس.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/281869"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-671", "question": "ما علامة فعل الأمر مع دلالته على الطلب؟", "choices": ["دخول قد", "قبول ياء المخاطبة", "دخول السين", "قبول تاء التأنيث"], "answer": "قبول ياء المخاطبة", "answerIndex": 1, "explanation": "«ياء المخاطبة مع دلالته على الطلب: في فعل الأمر»؛ نحو: ذاكري دروسك.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/281869"}, {"grade": 7, "subject": "النحو", "id": "h26-g7-672", "question": "بم يتميز الحرف عن الاسم والفعل؟", "choices": ["بقبوله قد", "بقبوله أل", "بأنه لا يقبل شيئا من علامات الاسم ولا شيئا من علامات ا on": "على أي أساس بنى القرآن الكريم الأسرة؟", "choices": ["على الجيرة", "على الصداقة", "على القرابة وحدها", "على الزواج"], "answer": "على الزواج", "answerIndex": 3, "explanation": "بنى القرآن الكريم الأسرة على الزواج، واعتبره نعمة من نعم الله على الإنسان.", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-703", "question": "ما الآية التي استدل بها الدرس على أن الزواج نعمة من نعم الله؟", "choices": ["﴿وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا لِتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُمْ مَوَدَّةً وَرَحْمَةً﴾", "﴿الطَّلَاقُ مَرَّتَانِ﴾", "﴿الرِّجَالُ قَوَّامُونَ عَلَى النِّسَاءِ﴾", "﴿وَيْلٌ لِلْمُطَفِّفِينَ﴾"], "answer": "﴿وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا لِتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُمْ مَوَدَّةً وَرَحْمَةً﴾", "answerIndex": 0, "explanation": "قال تعالى: ﴿وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا لِتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُمْ مَوَدَّةً وَرَحْمَةً﴾ (الروم: 21).", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-704", "question": "لمن جعل الإسلام قيادة الأسرة وتوجيهها؟", "choices": ["للرجل", "لأكبر أفراد الأسرة سنًا", "للمرأة", "للأولاد"], "answer": "للرجل", "answerIndex": 0, "explanation": "جعل الإسلام قيادة الأسرة للرجل، قال تعالى: ﴿الرِّجَالُ قَوَّامُونَ عَلَى النِّسَاءِ بِمَا فَضَّلَ اللَّهُ بَعْضَهُمْ عَلَى بَعْضٍ وَبِمَا أَنْفَقُوا مِنْ أَمْوَالِهِمْ﴾ (النساء: 34).", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-705", "question": "ما أدب دخول بيوت غير بيوتنا كما ورد في الدرس؟", "choices": ["الدخول دون استئذان", "الاستئذان والسلام على أهلها قبل الدخول", "الانتظار خارجًا دون سلام", "الدخول من النوافذ"], "answer": "الاستئذان والسلام على أهلها قبل الدخول", "answerIndex": 1, "explanation": "علم القرآن الناس أدب الاستئذان عند دخول بيوت غير بيوتهم، قال تعالى: ﴿لَا تَدْخُلُوا بُيُوتًا غَيْرَ بُيُوتِكُمْ حَتَّى تَسْتَأْنِسُوا وَتُسَلِّمُوا عَلَى أَهْلِهَا﴾ (النور: 27).", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-706", "question": "إلى ماذا دعا الإسلام عند وقوع الشقاق بين الزوجين؟", "choices": ["إلى هجر البيت", "إلى التحاكم للقبيلة", "إلى الطلاق فورًا", "إلى التحكيم بينهما"], "answer": "إلى التحكيم بينهما", "answerIndex": 3, "explanation": "دعا الإسلام إلى التحكيم بين الزوجين حتى لا تنقطع علاقة الزوجية لأوهى الأسباب، قال تعالى: ﴿وَإِنْ خِفْتُمْ شِقَاقَ بَيْنِهِمَا فَابْعَثُوا حَكَمًا مِنْ أَهْلِهِ وَحَكَمًا مِنْ أَهْلِهَا﴾ (النساء: 35).", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-707", "question": "ممن تتكون هيئة التحكيم بين الزوجين؟", "choices": ["حكمان من أهل الزوجة", "حكمان من أهل الزوج", "حكم من أهله وحكم من أهلها", "القاضي وحده"], "answer": "حكم من أهله وحكم من أهلها", "answerIndex": 2, "explanation": "قال تعالى: ﴿وَإِنْ خِفْتُمْ شِقَاقَ بَيْنِهِمَا فَابْعَثُوا حَكَمًا مِنْ أَهْلِهِ وَحَكَمًا مِنْ أَهْلِهَا﴾ (النساء: 35).", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-708", "question": "متى شرع الإسلام الطلاق؟", "choices": ["إذا لم يتفق الزوجان واستحالت العشرة بينهما", "عند أول خلاف", "إذا طلبت الزوجة ذلك دائمًا", "قبل محاولة الإصلاح"], "answer": "إذا لم يتفق الزوجان واستحالت العشرة بينهما", "answerIndex": 0, "explanation": "شرع الإسلام الطلاق إذا لم يتفق الزوجان، قال تعالى: ﴿الطَّلَاقُ مَرَّتَانِ فَإِمْسَاكٌ بِمَعْرُوفٍ أَوْ تَسْرِيحٌ بِإِحْسَانٍ﴾ (البقرة: 229).", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-709", "question": "ما الذي فرضه الإسلام على الآباء تجاه أولادهم؟", "choices": ["تركهم يختارون طريقهم بلا توجيه", "تعليمهم التجارة فقط", "الإنفاق عليهم دون تربية", "تربيتهم على الفضيلة ومكارم الأخلاق"], "answer": "تربيتهم على الفضيلة ومكارم الأخلاق", "answerIndex": 3, "explanation": "فرض الإسلام على الآباء تربية أولادهم على الفضيلة ومكارم الأخلاق، قال تعالى: ﴿قُوا أَنْفُسَكُمْ وَأَهْلِيكُمْ نَارًا وَقُودُهَا النَّاسُ وَالْحِجَارَةُ﴾ (التحريم: 6).", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-710", "question": "ما الطوائف التي أوصى القرآن بالإحسان إليهم في قوله تعالى: ﴿وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا وَبِالْوَالِدَيْنِ إِحْسَانًا وَبِذِي الْقُرْبَى وَالْيَتَامَى وَالْمَسَاكِينِ﴾؟", "choices": ["الأغنياء والتجار فقط", "الجيران دون غيرهم", "الوالدان وذوو القربى واليتامى والمساكين والجيران وابن السبيل", "الأقارب دون غيرهم"], "answer": "الوالدان وذوو القربى واليتامى والمساكين والجيران وابن السبيل", "answerIndex": 2, "explanation": "الآية (النساء: 36) أوصت بالوالدين والإحسان إليهما، والعطف على ذوي القربى واليتامى والمساكين وابن السبيل، ورعاية حقوق الجار.", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-711", "question": "كم نصيب الذكر من الميراث إذا تساوى مع الأنثى في القرابة؟", "choices": ["ربع الأنثى", "ضعف الأنثى", "مثل الأنثى", "نصف الأنثى"], "answer": "ضعف الأنثى", "answerIndex": 1, "explanation": "جعل الإسلام للذكر ضعف الأنثى إذا تساويا في القرابة، قال تعالى: ﴿لِلذَّكَرِ مِثْلُ حَظِّ الْأُنْثَيَيْنِ﴾ (النساء: 11).", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-712", "question": "ما أدب الإسلام في الإنفاق كما ورد في الدرس؟", "choices": ["الإنفاق بلا حساب", "التوسط والاعتدال، فلا تقتير ولا تبذير", "الإسراف والتبذير", "البخل والتقتير"], "answer": "التوسط والاعتدال، فلا تقتير ولا تبذير", "answerIndex": 1, "explanation": "حث القرآن على التوسط في الإنفاق والاعتدال، ونهى عن التقتير والتبذير، قال تعالى: ﴿وَلَا تَجْعَلْ يَدَكَ مَغْلُولَةً إِلَى عُنُقِكَ وَلَا تَبْسُطْهَا كُلَّ الْبَسْطِ فَتَقْعُدَ مَلُومًا مَحْسُورًا﴾ (الإسراء: 29).", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-713", "question": "من صاحب قصة «الصدق ينجيك» التي افتتح بها الدرس؟", "choices": ["إبراهيم بن أدهم", "عمر بن الخطاب", "أبو يزيد البسطامي", "سعيد بن عامر"], "answer": "أبو يزيد البسطامي", "answerIndex": 2, "explanation": "حكى الدرس أن أبا يزيد البسطامي الصوفي أراد الذهاب إلى بغداد لطلب العلم.", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-714", "question": "إلى أين أراد أبو يزيد البسطامي الذهاب؟ ولماذا؟", "choices": ["إلى مصر للسياحة", "إلى الشام للتجارة", "إلى بغداد لطلب العلم", "إلى مكة للحج"], "answer": "إلى بغداد لطلب العلم", "answerIndex": 2, "explanation": "أراد أبو يزيد البسطامي الذهاب إلى بغداد لطلب العلم، فأعطته أمه أربعين دينارًا ميراثًا من أبيه.", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-715", "question": "على أي شيء عاهد أبو يزيد أمه قبل سفره؟", "choices": ["على الصبر", "على الكتمان", "على الصدق", "على الصمت"], "answer": "على الصدق", "answerIndex": 2, "explanation": "عاهد أبو يزيد أمه على الصدق، فلم ينقض عهدها حتى مع اللصوص.", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-716", "question": "كم دينارًا كان مع أبي يزيد حين سأله اللصوص؟", "choices": ["عشرة دنانير", "أربعون دينارًا", "لا شيء", "مئة دينار"], "answer": "أربعون دينارًا", "answerIndex": 1, "explanation": "سأله اللصوص عما معه فقال: معي أربعون دينارًا، فأخرجها وسلمها لهم.", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-717", "question": "لماذا تاب كبير اللصوص وأمر برد ما أخذ من القافلة؟", "choices": ["لأن أبا يزيد خاف أن يخون عهد أمه، فاستحيا أن يخون هو عهد الله", "لأنه خاف من الشرطة", "لأن القافلة كانت فقيرة", "لأنه لم يجد مالًا"], "answer": "لأن أبا يزيد خاف أن يخون عهد أمه، فاستحيا أن يخون هو عهد الله", "answerIndex": 0, "explanation": "قال كبير اللصوص: أنت تخاف أن تخون عهد أمك، ونحن لا نخاف أن نخون عهد الله، ثم أمر برد جميع ما أخذ من القافلة، وتابوا جميعًا وحسنت توبتهم.", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-718", "question": "ما الحكمة التي قررها الدرس عن الصدق والكذب؟", "choices": ["الصدق ينجيك وإن خفته والكذب يرديك وإن أمنته", "الكذب ينجيك والصدق يرديك", "الكذب أول السعادة", "الصدق والكذب سواء"], "answer": "الصدق ينجيك وإن خفته والكذب يرديك وإن أمنته", "answerIndex": 0, "explanation": "قال بعض الحكماء: «الصدق ينجيك وإن خفته والكذب يرديك وإن أمنته».", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-719", "question": "ما أول السعادة كما ورد في الدرس؟", "choices": ["صدق اللسان", "الجاه والسلطان", "الغنى", "كثرة المال"], "answer": "صدق اللسان", "answerIndex": 0, "explanation": "قيل: «صدق اللسان أول السعادة والكذب جماع كل شر».", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-720", "question": "ما تتمة قول الشاعر: \"عوّد لسانك قول الصدق تحظ به\"؟", "choices": ["إن المال لما جمعت معتاد", "إن اللسان لما عودت معتاد", "إن الصمت لما لزمت معتاد", "إن الكذب لما عودت معتاد"], "answer": "إن اللسان لما عودت معتاد", "answerIndex": 1, "explanation": "«عوّد لسانك قول الصدق تحظ به إن اللسان لما عودت معتاد»؛ فمن تعود الصدق صار له عادة.", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-721", "question": "ما جزاء من يصدق ويتحرى الصدق كما ورد في الحديث الشريف؟", "choices": ["يكتب عند الله غنيًا", "يكتب عند الله صديقًا", "لا شيء", "يكتب عند الله كذابًا"], "answer": "يكتب عند الله صديقًا", "answerIndex": 1, "explanation": "قال ﷺ: «عليكم بالصدق فإن الصدق يهدي إلى البر وإن البر يهدي إلى الجنة وما يزال الرجل يصدق ويتحرى الصدق حتى يكتب عند الله صديقا».", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-722", "question": "هل يكون المؤمن كذابًا؟", "choices": ["أحيانًا", "إذا اضطر", "لا", "نعم"], "answer": "لا", "answerIndex": 2, "explanation": "قيل للنبي ﷺ: «أفيكون المؤمن كذابا؟ قال: لا»؛ فقد يكون المؤمن جبانًا أو بخيلًا، لكنه لا يكون كذابًا.", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-723", "question": "ما الرسول الذي امتدحه الله بقوله: ﴿وَاذْكُرْ فِي الْكِتَابِ إِسْمَاعِيلَ إِنَّهُ كَانَ صَادِقَ الْوَعْدِ وَكَانَ رَسُولًا نَبِيًّا﴾؟", "choices": ["إسماعيل عليه السلام", "يوسف عليه السلام", "إدريس عليه السلام", "إبراهيم عليه السلام"], "answer": "إسماعيل عليه السلام", "answerIndex": 0, "explanation": "امتدح الله إسماعيل عليه السلام بفضيلة الصدق، قال تعالى: ﴿وَاذْكُرْ فِي الْكِتَابِ إِسْمَاعِيلَ إِنَّهُ كَانَ صَادِقَ الْوَعْدِ وَكَانَ رَسُولًا نَبِيًّا﴾ (مريم: 54).", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-724", "question": "من الرسول الآخر الذي امتدحه الله بفضيلة الصدق في سورة مريم؟", "choices": ["إدريس عليه السلام", "هود عليه السلام", "نوح عليه السلام", "صالح عليه السلام"], "answer": "إدريس عليه السلام", "answerIndex": 0, "explanation": "قال تعالى: ﴿وَاذْكُرْ فِي الْكِتَابِ إِدْرِيسَ إِنَّهُ كَانَ صِدِّيقًا نَبِيًّا﴾ (مريم: 56).", "type": "mcq", "topic": "", "source": "https://archive.org/download/almutaleah-wannusoos/%D8%A7%D9%84%D9%85%D8%B7%D8%A7%D9%84%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D8%B5%D9%88%D8%B5_text.pdf"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-725", "question": "ما معنى الغش لغة؟", "choices": ["ضد البخل", "ضد النصح", "ضد الظلم", "ضد الكذب"], "answer": "ضد النصح", "answerIndex": 1, "explanation": "«الغش لغة: ضد النصح، يقال: غشه إذا لم ينصحه وزين له غير المصلحة، ولبن مغشوش مخلوط بالماء».", "type": "mcq", "topic": "", "source": "https://www.arabicjewel.net/2026/08/The-70-Most-Important-Questions-on-the-Lesson-Cheating-Its-Types-and-Remedies.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-726", "question": "ما تعريف الغش اصطلاحًا؟", "choices": ["النصح للغير", "البيع بثمن عادل", "ما يخلط من الرديء بالجيد", "ما يخلط من الجيد بالجيد"], "answer": "ما يخلط من الرديء بالجيد", "answerIndex": 2, "explanation": "«الغش اصطلاحا: ما يخلط من الرديء بالجيد، أي خلط الأشياء بغيرها، وبما هو أقل ثمنا منها».", "type": "mcq", "topic": "", "source": "https://www.arabicjewel.net/2026/08/The-70-Most-Important-Questions-on-the-Lesson-Cheating-Its-Types-and-Remedies.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-727", "question": "ما صور الغش الأربع الواردة في الدرس؟", "choices": ["الغش في الأكل والشرب والنوم واللعب", "الغش في القراءة والكتابة فقط", "الغش في الصلاة والصيام والحج والزكاة", "الغش في البيوع، وفي النصيحة، وفي المسئولية، وفي الامتحانات الدراسية"], "answer": "الغش في البيوع، وفي النصيحة، وفي المسئولية، وفي الامتحانات الدراسية", "answerIndex": 3, "explanation": "للغش صور متعددة تختلف باختلاف الزمان والمكان: الغش في البيوع وغيرها من المعاملات، والغش في النصيحة، والغش في المسئولية، والغش في الامتحانات الدراسية.", "type": "mcq", "topic": "", "source": "https://www.arabicjewel.net/2026/08/The-70-Most-Important-Questions-on-the-Lesson-Cheating-Its-Types-and-Remedies.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-728", "question": "ما التطفيف؟", "choices": ["الزيادة في المكيال والميزان", "البيع بثمن غال", "شراء السلعة الرخيصة", "الغش في المكيال والميزان بنقص الكيل والوزن"], "answer": "الغش في المكيال والميزان بنقص الكيل والوزن", "answerIndex": 3, "explanation": "التطفيف هو الغش في المكيال والميزان، عن طريق نقص المكيال والموازين وخسرانه، وقد توعد الله المطففين بقوله: ﴿وَيْلٌ لِلْمُطَفِّفِينَ﴾ (المطففين: 1).", "type": "mcq", "topic": "", "source": "https://www.arabicjewel.net/2026/08/The-70-Most-Important-Questions-on-the-Lesson-Cheating-Its-Types-and-Remedies.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-729", "question": "بم وصف الله المطففين في سورة المطففين؟", "choices": ["إذا كالوا للناس يزيدون", "إذا اكتالوا على الناس ينقصون", "يوفون الكيل والميزان", "إذا اكتالوا على الناس يستوفون، وإذا كالوهم أو وزنوهم يخسرون"], "answer": "إذا اكتالوا على الناس يستوفون، وإذا كالوهم أو وزنوهم يخسرون", "answerIndex": 3, "explanation": "قال تعالى: ﴿الَّذِينَ إِذَا اكْتَالُوا عَلَى النَّاسِ يَسْتَوْفُونَ﴾ (المطففين: 2) ﴿وَإِذَا كَالُوهُمْ أَوْ وَزَنُوهُمْ يُخْسِرُونَ﴾ (المطففين: 3).", "type": "mcq", "topic": "", "source": "https://www.arabicjewel.net/2026/08/The-70-Most-Important-Questions-on-the-Lesson-Cheating-Its-Types-and-Remedies.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-730", "question": "ماذا قال النبي ﷺ لصاحب الطعام الذي وجد بللًا في صبرته؟", "choices": ["زد ثمن الطعام", "بع الطعام كما هو", "أخف البلل عن الناس", "أفلا جعلته فوق الطعام كي يراه الناس"], "answer": "أفلا جعلته فوق الطعام كي يراه الناس", "answerIndex": 3, "explanation": "مر النبي ﷺ على صبرة طعام فأدخل يده فيها فنالت أصابعه بللًا، فقال: «أفلا جعلته فوق الطعام كي يراه الناس»، ثم قال: من غشنا فليس منا.", "type": "mcq", "topic": "", "source": "https://www.arabicjewel.net/2026/08/The-70-Most-Important-Questions-on-the-Lesson-Cheating-Its-Types-and-Remedies.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-731", "question": "ما المقصود بالغش في النصيحة؟", "choices": ["أن تنصح من طلب منك النصيحة بغير ما فيه الخير والمصلحة وأنت تعلم ذلك", "أن تنصحه بما فيه الخير", "أن ترفض نصحه", "أن تنصحه سرًا"], "answer": "أن تنصح من طلب منك النصيحة بغير ما فيه الخير والمصلحة وأنت تعلم ذلك", "answerIndex": 0, "explanation": "الغش في النصيحة: هو أن تنصح من طلب منك النصيحة بغير ما فيه الخير والمصلحة، وأنت تعلم ذلك؛ وقد قال ﷺ: «الدين النصيحة»، قلنا: لمن؟ قال: «لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم».", "type": "mcq", "topic": "", "source": "https://www.arabicjewel.net/2026/08/The-70-Most-Important-Questions-on-the-Lesson-Cheating-Its-Types-and-Remedies.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-732", "question": "ماذا قالت ابنة بائعة اللبن لأمها حين أمرتها أن تمذق اللبن بالماء؟", "choices": ["سأفعل ما تأمرين به يا أماه", "والله ما كنت لأطيعه في الملأ وأعصيه في الخلاء، إن كان أمير المؤمنين لا يرانا، فرب أمير المؤمنين يرانا", "سأخبر أمير المؤمنين بما فعلت", "لا أبالي بأمر أمير المؤمنين"], "answer": "والله ما كنت لأطيعه في الملأ وأعصيه في الخلاء، إن كان أمير المؤمنين لا يرانا، فرب أمير المؤمنين يرانا", "answerIndex": 1, "explanation": "قالت الصبية: «والله ما كنت لأطيعه في الملأ وأعصيه في الخلاء، إن كان أمير المؤمنين لا يرانا، فرب أمير المؤمنين يرانا»؛ فأعجب بها عمر بن الخطاب وزوجها ابنه عاصمًا، فصارت جدة الخليفة عمر بن عبد العزيز.", "type": "mcq", "topic": "", "source": "https://www.arabicjewel.net/2026/08/The-70-Most-Important-Questions-on-the-Lesson-Cheating-Its-Types-and-Remedies.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-733", "question": "ما المقصود بالغش في المسئولية؟", "choices": ["نصح الراعي لرعيته", "إكرام الراعي لرعيته", "غش الراعي للرعية بظلمهم", "عدل الراعي مع رعيته"], "answer": "غش الراعي للرعية بظلمهم", "answerIndex": 2, "explanation": "الغش في المسئولية: هو غش الراعي للرعية، ويكون ذلك بظلمه لهم، مثل أخذ أموالهم، وسفك دمائهم، وانتهاك أعراضهم، وحبس حقوقهم.", "type": "mcq", "topic": "", "source": "https://www.arabicjewel.net/2026/08/The-70-Most-Important-Questions-on-the-Lesson-Cheating-Its-Types-and-Remedies.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-734", "question": "ما جزاء من يسترعيه الله رعية فيموت وهو غاش لها؟", "choices": ["يغفر له", "لا شيء عليه", "يحرم الله عليه الجنة", "يدخل الجنة"], "answer": "يحرم الله عليه الجنة", "answerIndex": 2, "explanation": "قال رسول الله ﷺ: «ما من عبد يسترعيه الله رعية، يموت يوم يموت وهو غاش لرعيته، إلا حرم الله عليه الجنة».", "type": "mcq", "topic": "", "source": "https://www.arabicjewel.net/2026/08/The-70-Most-Important-Questions-on-the-Lesson-Cheating-Its-Types-and-Remedies.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-735", "question": "ما حكم الغش في الامتحانات الدراسية؟", "choices": ["مكروه فقط", "حرام، وهو خيانة للأمانة وليس من التعاون على البر والتقوى", "جائز إذا كان لمساعدة الزملاء", "مستحب"], "answer": "حرام، وهو خيانة للأمانة وليس من التعاون على البر والتقوى", "answerIndex": 1, "explanation": "من يلقن طلاب العلم إجابات الامتحان فهو غاش لهم مضيع للأمانة، وليس هذا من التعاون على البر والتقوى، قال تعالى: ﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَى وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ﴾ (المائدة: 2).", "type": "mcq", "topic": "", "source": "https://www.arabicjewel.net/2026/08/The-70-Most-Important-Questions-on-the-Lesson-Cheating-Its-Types-and-Remedies.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-736", "question": "ما أنجح وسيلة للقضاء على آفة الغش؟", "choices": ["كثرة العقوبات فقط", "إخفاء الغش عن الناس", "مراقبة الله عز وجل في السر والعلن", "ترك الغشاشين وشأنهم"], "answer": "مراقبة الله عز وجل في السر والعلن", "answerIndex": 2, "explanation": "أنجح علاج للغش هو مراقبة الله عز وجل في السر والعلن؛ لأن الغاش يعتمد على أن أحدًا لا يراه، فإذا راقب الله ارتدع، وتلك درجة الإحسان، قال ﷺ: «الإحسان أن تعبد الله كأنك تراه، فإن لم تكن تراه، فإنه يراك».", "type": "mcq", "topic": "", "source": "https://www.arabicjewel.net/2026/08/The-70-Most-Important-Questions-on-the-Lesson-Cheating-Its-Types-and-Remedies.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-737", "question": "من شاعر نص \"نصائح وحكم\"؟", "choices": ["محمود غنيم", "حافظ إبراهيم", "محمود سامي البارودي", "أحمد شوقي"], "answer": "محمود سامي البارودي", "answerIndex": 2, "explanation": "الشاعر محمود سامي البارودي، الملقب برب السيف والقلم.", "type": "mcq", "topic": "", "source": "https://www.mr-mas.com/2020/03/n9aE7.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-738", "question": "بم لقب محمود سامي البارودي؟", "choices": ["شاعر البحيرة", "رب السيف والقلم", "شاعر النيل", "أمير الشعراء"], "answer": "رب السيف والقلم", "answerIndex": 1, "explanation": "لقب البارودي برب السيف والقلم، وشارك في الثورة العرابية.", "type": "mcq", "topic": "", "source": "https://www.mr-mas.com/2020/03/n9aE7.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-739", "question": "ما معنى كلمة \"لدودًا\" في قول الشاعر: \"إذا شئت أن تحيا سعيدًا فلا تكن لدودًا\"؟", "choices": ["شديد الخصومة والعداوة", "سريع الغضب", "كثير المال", "شديد الكرم"], "answer": "شديد الخصومة والعداوة", "answerIndex": 0, "explanation": "«لدودا» نكرة تفيد التحقير، وتوحي بشدة الخصومة والعداوة؛ والنهي في البيت غرضه النصح والإرشاد.", "type": "mcq", "topic": "", "source": "https://www.mr-mas.com/2020/03/n9aE7.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-740", "question": "ما معنى كلمة \"الفاقة\"؟", "choices": ["الحاجة البسيطة", "الغنى", "الفقر الشديد", "المرض"], "answer": "الفقر الشديد", "answerIndex": 2, "explanation": "«الفاقة: الفقر»؛ ولذلك قال الشاعر: «ولا تحتقر ذا فاقة»؛ فالفاقة تدل على الفقر الشديد وليس مجرد الحاجة.", "type": "mcq", "topic": "", "source": "https://www.mr-mas.com/2020/03/n9aE7.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-741", "question": "ما الذي صوره الشاعر بقوله: «يملأ القلب حكمة»؟", "choices": ["صور القلب بنور ساطع", "صور القلب بحجر صلب", "صور الحكمة بسيف قاطع", "صور القلب بوعاء والحكمة بشراب صاف يملأ هذا الوعاء"], "answer": "صور القلب بوعاء والحكمة بشراب صاف يملأ هذا الوعاء", "answerIndex": 3, "explanation": "«يملأ القلب حكمة»: تصوير للقلب بوعاء، وللحكمة بشراب صاف يملا هذا الوعاء؛ و«حكمة» نكرة للتعظيم.", "type": "mcq", "topic": "", "source": "https://www.mr-mas.com/2020/03/n9aE7.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-742", "question": "ما الحكمة التي قررها الشاعر في آخر أبيات النص؟", "choices": ["الفقر مع عزة النفس خير من الغنى مع الذل", "الفقر شر كله", "الغنى مع الذل خير من الفقر مع العزة", "الغنى خير كله"], "answer": "الفقر مع عزة النفس خير من الغنى مع الذل", "answerIndex": 0, "explanation": "«إن الغنى في الذل شر من الفقر»؛ فالفقر مع الكرامة خير من الغنى مع المهانة.", "type": "mcq", "topic": "", "source": "https://www.mr-mas.com/2020/03/n9aE7.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-743", "question": "ما أسباب السعادة في الحياة كما وضحها الشاعر؟", "choices": ["الخصومة والعداوة", "احتقار الفقراء", "كثرة المال والجاه", "التسامح واللين في المعاملة، والتواضع والقناعة وحفظ الكرامة"], "answer": "التسامح واللين في المعاملة، والتواضع والقناعة وحفظ الكرامة", "answerIndex": 3, "explanation": "أسباب السعادة كما وضحها الشاعر: التسامح واللين في المعاملة، والتواضع والقناعة وحفظ الكرامة.", "type": "mcq", "topic": "", "source": "https://www.mr-mas.com/2020/03/n9aE7.html"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-744", "question": "من شاعر نص \"الأزهر الشريف في عيده الألفي\"؟", "choices": ["محمود سامي البارودي", "الدكتور حسن جاد", "حافظ إبراهيم", "أحمد شوقي"], "answer": "الدكتور حسن جاد", "answerIndex": 1, "explanation": "الشاعر الدكتور حسن جاد، وقد نشرت القصيدة في ديوانه بعنوان «الأزهر في عيده الألفي» (مارس 1983م).", "type": "mcq", "topic": "", "source": "https://kenanaonline.com/users/sabryfatma/posts/1065374"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-745", "question": "ما مطلع قصيدة حسن جاد في الأزهر؟", "choices": ["يا أزهر الماضي وكم في النفس من ذكرى", "قم في فم الدنيا وحي الأزهرا", "يكفيك أنك أنت مصر ومجدها", "أرأيت كيف طوى القرون الأزهر وأدال عمر الدهر وهو معمر"], "answer": "أرأيت كيف طوى القرون الأزهر وأدال عمر الدهر وهو معمر", "answerIndex": 3, "explanation": "مطلع القصيدة: «أرأيتَ كيف طوى القرونَ الأزهرُ وأدالَ عُمرَ الدهرِ وهْوَ مُعَمّرُ».", "type": "mcq", "topic": "", "source": "https://kenanaonline.com/users/sabryfatma/posts/1065374"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-746", "question": "على أي بحر جاءت قصيدة حسن جاد في الأزهر؟", "choices": ["البحر الطويل", "البحر البسيط", "البحر الوافر", "البحر الكامل التام"], "answer": "البحر الكامل التام", "answerIndex": 3, "explanation": "جاءت القصيدة على نسق البحر الكامل التام، مصرعة المطلع، قافيتها مطلقة بالضم، والراء رويًّا.", "type": "mcq", "topic": "", "source": "https://kenanaonline.com/users/sabryfatma/posts/1065374"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-747", "question": "كم عدد أبيات قصيدة حسن جاد في الأزهر في شكلها النهائي؟", "choices": ["مئة بيت", "ثلاثون بيتًا", "خمسون بيتًا", "أربعة وثمانون بيتًا"], "answer": "أربعة وثمانون بيتًا", "answerIndex": 3, "explanation": "كتبها الشاعر أول مرة بداية عام 1952م وكانت أقل من ثلاثين بيتًا، ثم أعاد كتابتها في العيد الميلادي الألفي للأزهر فوصلت إلى شكلها النهائي: أربعة وثمانون بيتًا.", "type": "mcq", "topic": "", "source": "https://kenanaonline.com/users/sabryfatma/posts/1065374"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-748", "question": "ما الفكرة التي يدور حولها صلب قصيدة حسن جاد (الأبيات 12–74)؟", "choices": ["الأزهر بين ماضٍ مشرق شريف وحاضر ممزق أسيف", "علاقة الشاعر بالأزهر فقط", "تاريخ مصر الحديث", "وصف الهرم ومقارنته بالأزهر"], "answer": "الأزهر بين ماضٍ مشرق شريف وحاضر ممزق أسيف", "answerIndex": 0, "explanation": "صلب القصيدة في اثنين وستين بيتًا، من البيت الثاني عشر حتى البيت الرابع والسبعين، ويدور حول فكرة: الأزهر بين ماضٍ مشرق شريف، وحاضر ممزق أسيف.", "type": "mcq", "topic": "", "source": "https://kenanaonline.com/users/sabryfatma/posts/1065374"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-749", "question": "ما ختام قصيدة حسن جاد في الأزهر؟", "choices": ["قم في فم الدنيا وحي الأزهرا", "يا أزهر الماضي وكم في النفس من ذكرى", "أرأيت كيف طوى القرون الأزهر", "يكفيك أنك أنت مصر ومجدها يوم الفخار وأن مصر الأزهر"], "answer": "يكفيك أنك أنت مصر ومجدها يوم الفخار وأن مصر الأزهر", "answerIndex": 3, "explanation": "ختام القصيدة: «يكفيكَ أنَّكَ أنتَ مصرُ ومجدُها يومَ الفَخارِ وأنَّ مصرَ الأزهرُ»؛ وفيه بيان العلاقة الأزلية بين أزهرنا ومصرنا.", "type": "mcq", "topic": "", "source": "https://kenanaonline.com/users/sabryfatma/posts/1065374"}, {"grade": 7, "subject": "المطالعة والنصوص", "id": "h26-g7-750", "question": "بأي قصيدة تشبه رائية حسن جاد في الأزهر؟", "choices": ["قصيدة حافظ إبراهيم في مصر", "رائية أحمد شوقي عن الأزهر وشيوخه", "قصيدة محمود غنيم في المحراث", "قصيدة البارودي في النصائح"], "answer": "رائية أحمد شوقي عن الأزهر وشيوخه", "answerIndex": 1, "explanation": "تشبه رائية حسن جاد رائية أحمد شوقي عن الأزهر وشيوخه، التي مطلعها: «قم في فم الدنيا وحي الأزهرا وانثر على سمع الزمان الجوهرا».", "type": "mcq", "topic": "", "source": "https://kenanaonline.com/users/sabryfatma/posts/1065374"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-751", "question": "ما نوعا الهمزة في أول الكلمة؟", "choices": ["همزة قطع فقط", "همزة وصل فقط", "همزة وصل وهمزة قطع", "همزة متوسطة وهمزة متطرفة"], "answer": "همزة وصل وهمزة قطع", "answerIndex": 2, "explanation": "«الهمزة أول الكلمة نوعان: همزة وصل، وهمزة قطع».", "type": "mcq", "topic": "", "source": "https://chss.ksu.edu.sa/en/node/4985"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-752", "question": "كيف تكتب همزة الوصل؟", "choices": ["همزة تحت الألف", "همزة فوق الألف", "ألفًا بعدها همزة", "ألفًا فقط دون رسم الهمزة عليها"], "answer": "ألفًا فقط دون رسم الهمزة عليها", "answerIndex": 3, "explanation": "«همزة الوصل: تنطق عند البدء بها، وتكتب ألفا فقط (ا)».", "type": "mcq", "topic": "", "source": "https://chss.ksu.edu.sa/en/node/4985"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-753", "question": "أي الأسماء الآتية همزته همزة وصل؟", "choices": ["ابن", "أحمد", "إنسان", "أمل"], "answer": "ابن", "answerIndex": 0, "explanation": "«كل الأسماء همزتها همزة قطع ما عدا عشرة أسماء هي: اسم، ابن، ابنة»؛ فـ(ابن) همزتها همزة وصل، أما إنسان وأحمد وأمل فهمزتها همزة قطع.", "type": "mcq", "topic": "", "source": "https://chss.ksu.edu.sa/en/node/4985"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-754", "question": "ما الحرف الوحيد الذي همزته همزة وصل؟", "choices": ["(ال) التعريف", "(إلى)", "(إنَّ)", "(أو)"], "answer": "(ال) التعريف", "answerIndex": 0, "explanation": "«كل الحروف همزتها همزة قطع ما عدا (ال) التي للتعريف، نحو: (الرجل، الكتاب، الرسول)».", "type": "mcq", "topic": "", "source": "https://chss.ksu.edu.sa/en/node/4985"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-755", "question": "أي فعل أمر همزته همزة وصل؟", "choices": ["أكرم", "اكتب", "أعطى", "أحسن"], "answer": "اكتب", "answerIndex": 1, "explanation": "«أمر الثلاثي الماضي غير المبدوء بهمزة، مثل: اعلم، اكتب»؛ فأمر الفعل الثلاثي همزته همزة وصل، أما أكرم وأحسن وأعطى فأفعال رباعية همزتها همزة قطع.", "type": "mcq", "topic": "", "source": "https://chss.ksu.edu.sa/en/node/4985"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-756", "question": "أي فعل ماضٍ همزته همزة وصل؟", "choices": ["أخذ", "أمر", "أكرم", "انتفع"], "answer": "انتفع", "answerIndex": 3, "explanation": "«ماضي الفعل الخماسي وأمره ومصدره، مثل: انتفع، انتفع، انتفاعا»؛ فماضي الفعل الخماسي همزته همزة وصل، أما أكرم وأخذ وأمر فهمزتها همزة قطع.", "type": "mcq", "topic": "", "source": "https://chss.ksu.edu.sa/en/node/4985"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-757", "question": "أي فعل ماضٍ همزته همزة قطع؟", "choices": ["انتفع", "استغفر", "أكرم", "اكتب"], "answer": "أكرم", "answerIndex": 2, "explanation": "«الماضي الرباعي (أحسن-أكرم-أعلم)، ومصدره (إحسانا-إكراما-إعلاما)، وأمره (أحسن، أنذر، أكرم)»؛ فماضي الفعل الرباعي همزته همزة قطع، أما استغفر وانتفع واكتب فهمزتها همزة وصل.", "type": "mcq", "topic": "", "source": "https://chss.ksu.edu.sa/en/node/4985"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-758", "question": "همزة الفعل المضارع للمتكلم المفرد، مثل: (أستغفرُ)، همزة وصل أم همزة قطع؟", "choices": ["همزة قطع", "همزة وصل", "ليست همزة أصلا", "همزة متوسطة"], "answer": "همزة قطع", "answerIndex": 0, "explanation": "«المضارع المتكلم المفرد، سواء أكان رباعيا أم خماسيا أم سداسيا، نحو: (أعطي-أنطلق- أستغفر)» همزته همزة قطع.", "type": "mcq", "topic": "", "source": "https://chss.ksu.edu.sa/en/node/4985"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-759", "question": "ما الترقيم في الكتابة؟", "choices": ["تزيين الصفحة بالرسوم والألوان", "كتابة الحروف بخط جميل", "حفظ النصوص وترديدها", "وضع علامات اصطلاحية بين أجزاء الكلام لإيضاح مواضع الوقف وتيسير الفهم والإفهام"], "answer": "وضع علامات اصطلاحية بين أجزاء الكلام لإيضاح مواضع الوقف وتيسير الفهم والإفهام", "answerIndex": 3, "explanation": "«الترقيم هو وضع علامات اصطلاحية معينة بين أجزاء الكلام أو الجمل أو الكلمات لإيضاح مواضع الوقف، وتيسير عملية الفهم والإفهام».", "type": "mcq", "topic": "", "source": "https://www.alloschool.com/element/139448"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-760", "question": "متى توضع النقطة (.)؟", "choices": ["بعد لفظ المنادى", "بعد فعل القول", "عند نهاية جملة تامة المعنى", "بعد جملة ما بعدها سبب لها"], "answer": "عند نهاية جملة تامة المعنى", "answerIndex": 2, "explanation": "«توضع عند نهاية تامة المعنى مثال : من جد وجد ومن زرع حصد».", "type": "mcq", "topic": "", "source": "https://www.alloschool.com/element/139448"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-761", "question": "متى توضع الفاصلة (،)؟", "choices": ["بعد فعل القول", "عند وقف قصير، مثل بعد لفظ المنادى", "عند نهاية جملة تامة المعنى", "بعد جملة ما بعدها سبب لها"], "answer": "عند وقف قصير، مثل بعد لفظ المنادى", "answerIndex": 1, "explanation": "«تكون عند وقف قصير وذلك في الحالات التالية : - بعد لفظ المنادى : يارب، اغفر ذنوبي. - بين جملتين مرتبطتين في المعنى والاعراب : احفظ الله، يحفظك».", "type": "mcq", "topic": "", "source": "https://www.alloschool.com/element/139448"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-762", "question": "متى توضع الفاصلة المنقوطة (؛)؟", "choices": ["بعد فعل القول", "بعد جملة ما بعدها سبب لها", "عند وقف قصير بعد المنادى", "عند نهاية جملة تامة المعنى"], "answer": "بعد جملة ما بعدها سبب لها", "answerIndex": 1, "explanation": "«تكتب بعد جملة ما بعدها سبب لها، أو جملتين مرتبطتين في المعنى دون الاعراب. مثال : نجحت ؛ لأنني اجتهدت».", "type": "mcq", "topic": "", "source": "https://www.alloschool.com/element/139448"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-763", "question": "متى توضع النقطتان (:)؟", "choices": ["بعد جملة ما بعدها سبب لها", "عند وقف قصير بعد المنادى", "بعد فعل القول، وبين الشيء وأقسامه", "عند نهاية جملة تامة المعنى"], "answer": "بعد فعل القول، وبين الشيء وأقسامه", "answerIndex": 2, "explanation": "«تستعملان في الأحوال الآتية : - بعد فعل القول» و«بين شيء وأقسامه : الكلمة هي : اسم وفعل وحرف».", "type": "mcq", "topic": "", "source": "https://www.alloschool.com/element/139448"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-764", "question": "ما الإنشاء؟", "choices": ["علم إعراب الجمل", "فن رسم الحروف وتزيينها", "فن التعبير عن الأفكار والمشاعر باستخدام اللغة بشكل واضح ومنظم", "فن حفظ النصوص وترديدها"], "answer": "فن التعبير عن الأفكار والمشاعر باستخدام اللغة بشكل واضح ومنظم", "answerIndex": 2, "explanation": "«الإنشاء هو فن التعبير عن الأفكار والمشاعر باستخدام اللغة بشكل واضح ومنظم».", "type": "mcq", "topic": "", "source": "https://eqqrae.com/%d8%b7%d8%b1%d9%8a%d9%82%d8%a9-%d9%83%d8%aa%d8%a7%d8%a8%d8%a9-%d8%a7%d9%84%d8%a5%d9%86%d8%b4%d8%a7%d8%a1/"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-765", "question": "ما خطوات التخطيط لموضوع إنشائي؟", "choices": ["البدء بالخاتمة ثم كتابة العرض", "جمع الأفكار دون ترتيب", "كتابة الأفكار ثم ترتيبها ترتيبًا منطقيًا ثم تقسيم الموضوع إلى مقدمة وعرض وخاتمة", "كتابة الموضوع دفعة واحدة دون تخطيط"], "answer": "كتابة الأفكار ثم ترتيبها ترتيبًا منطقيًا ثم تقسيم الموضوع إلى مقدمة وعرض وخاتمة", "answerIndex": 2, "explanation": "«رتب الأفكار ترتيبا منطقيا (من العام إلى الخاص، أو من الماضي إلى الحاضر، أو حسب الأهمية). حدد كيف ستقسم الموضوع: مقدمة – عرض – خاتمة».", "type": "mcq", "topic": "", "source": "https://eqqrae.com/%d8%b7%d8%b1%d9%8a%d9%82%d8%a9-%d9%83%d8%aa%d8%a7%d8%a8%d8%a9-%d8%a7%d9%84%d8%a5%d9%86%d8%b4%d8%a7%d8%a1/"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-766", "question": "كيف تكون مقدمة الموضوع الإنشائي؟", "choices": ["طويلة مفصلة تشرح كل الأفكار", "قصيرة وواضحة تمهد للقارئ الموضوع", "عرضًا للرأي النهائي", "تلخيصًا لما كتب في الموضوع"], "answer": "قصيرة وواضحة تمهد للقارئ الموضوع", "answerIndex": 1, "explanation": "«يجب أن تكون قصيرة وواضحة. تمهد للقارئ الموضوع».", "type": "mcq", "topic": "", "source": "https://eqqrae.com/%d8%b7%d8%b1%d9%8a%d9%82%d8%a9-%d9%83%d8%aa%d8%a7%d8%a8%d8%a9-%d8%a7%d9%84%d8%a5%d9%86%d8%b4%d8%a7%d8%a1/"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-767", "question": "ما العرض في الموضوع الإنشائي؟", "choices": ["الجزء الأكبر، يشرح الفكرة الرئيسية بتفاصيلها في فقرات", "جزء قصير يمهد للموضوع", "تلخيص موجز لما سبق", "قائمة بالأخطاء الإملائية"], "answer": "الجزء الأكبر، يشرح الفكرة الرئيسية بتفاصيلها في فقرات", "answerIndex": 0, "explanation": "«هو الجزء الأكبر، وفيه تشرح الفكرة الرئيسية بتفاصيلها. قسمه إلى فقرات، كل فقرة تتحدث عن فكرة واحدة».", "type": "mcq", "topic": "", "source": "https://eqqrae.com/%d8%b7%d8%b1%d9%8a%d9%82%d8%a9-%d9%83%d8%aa%d8%a7%d8%a8%d8%a9-%d8%a7%d9%84%d8%a5%d9%86%d8%b4%d8%a7%d8%a1/"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-768", "question": "ما وظيفة خاتمة الموضوع الإنشائي؟", "choices": ["تلخص ما كتب وتقدم الرأي النهائي أو نصيحة، وتكون موجزة وقوية", "تشرح الفكرة الرئيسية بتفاصيلها", "تسرد الأفكار دون ترتيب", "تمهد للقارئ الموضوع"], "answer": "تلخص ما كتب وتقدم الرأي النهائي أو نصيحة، وتكون موجزة وقوية", "answerIndex": 0, "explanation": "«تلخص ما كتبته. يمكن أن تقدم فيها رأيك النهائي أو نصيحة أو أملا للمستقبل. يجب أن تكون موجزة وقوية».", "type": "mcq", "topic": "", "source": "https://eqqrae.com/%d8%b7%d8%b1%d9%8a%d9%82%d8%a9-%d9%83%d8%aa%d8%a7%d8%a8%d8%a9-%d8%a7%d9%84%d8%a5%d9%86%d8%b4%d8%a7%d8%a1/"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-769", "question": "ما آخر خطوات كتابة الموضوع الإنشائي؟", "choices": ["المراجعة: قراءة الموضوع مرة أخرى وتصحيح الأخطاء والتأكد من وضوح الأفكار وترابطها", "حذف المقدمة والخاتمة", "إضافة أفكار جديدة غير مرتبطة", "كتابة الموضوع مرة أخرى من البداية"], "answer": "المراجعة: قراءة الموضوع مرة أخرى وتصحيح الأخطاء والتأكد من وضوح الأفكار وترابطها", "answerIndex": 0, "explanation": "«اقرأ الموضوع مرة أخرى بعد كتابته. صحح الأخطاء الإملائية والنحوية. تأكد من وضوح الأفكار وترابطها».", "type": "mcq", "topic": "", "source": "https://eqqrae.com/%d8%b7%d8%b1%d9%8a%d9%82%d8%a9-%d9%83%d8%aa%d8%a7%d8%a8%d8%a9-%d8%a7%d9%84%d8%a5%d9%86%d8%b4%d8%a7%d8%a1/"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-770", "question": "في أي سورة ورد حوار إبراهيم عليه السلام مع أبيه حين قال: ﴿يَا أَبَتِ لِمَ تَعْبُدُ مَا لَا يَسْمَعُ وَلَا يُبْصِرُ وَلَا يُغْنِي عَنْكَ شَيْئًا﴾؟", "choices": ["سورة يونس", "سورة مريم", "سورة يوسف", "سورة هود"], "answer": "سورة مريم", "answerIndex": 1, "explanation": "حوار إبراهيم عليه السلام مع أبيه في سورة مريم، قال تعالى: ﴿يَا أَبَتِ لِمَ تَعْبُدُ مَا لَا يَسْمَعُ وَلَا يُبْصِرُ وَلَا يُغْنِي عَنْكَ شَيْئًا﴾ (مريم: 42).", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/19:42/quran-simple"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-771", "question": "ما الحوار القرآني الذي بدأ بقوله تعالى: ﴿وَإِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي جَاعِلٌ فِي الْأَرْضِ خَلِيفَةً﴾؟", "choices": ["حوار نوح عليه السلام مع قومه", "حوار الله تعالى مع الملائكة", "حوار يوسف عليه السلام مع إخوته", "حوار موسى عليه السلام مع فرعون"], "answer": "حوار الله تعالى مع الملائكة", "answerIndex": 1, "explanation": "في سورة البقرة (الآية 30) حوار بين الله تعالى والملائكة حول خلق آدم عليه السلام، بدأ بقوله تعالى: ﴿وَإِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي جَاعِلٌ فِي الْأَرْضِ خَلِيفَةً﴾.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/ayah/2:30/quran-simple"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-772", "question": "ما الخط العربي؟", "choices": ["علم إعراب الكلمات", "فن إلقاء الشعر", "فن وتصميم الكتابة في مختلف اللغات التي تستعمل الحروف العربية", "فن رسم البشر والحيوان"], "answer": "فن وتصميم الكتابة في مختلف اللغات التي تستعمل الحروف العربية", "answerIndex": 2, "explanation": "«الخط العربي هو فن وتصميم الكتابة في مختلف اللغات التي تستعمل الحروف العربية».", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/%D8%AE%D8%B7_%D8%B9%D8%B1%D8%A8%D9%8A"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-773", "question": "من أي خط اشتق الخط العربي على رأي معظم مؤرخي العرب قديمًا؟", "choices": ["خط المسند", "الخط الهيروغليفي", "الخط الآرامي", "الخط اليوناني"], "answer": "خط المسند", "answerIndex": 0, "explanation": "«تبناه معظم مؤرخي العرب قديما ويقول بأنه مشتق من خط المسند»؛ والمسند خط أهل اليمن ومنه الصفوي والثمودي واللحياني والسبئي.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/%D8%AE%D8%B7_%D8%B9%D8%B1%D8%A8%D9%8A"}, {"grade": 7, "subject": "فنون الكتابة", "id": "h26-g7-774", "question": "من أي حلقة اشتق الخط العربي مباشرة على رأي البحث العلمي الحديث؟", "choices": ["حلقة الخط الآرامي", "الخط اليوناني", "خط المسند", "الخط الهيروغليفي"], "answer": "حلقة الخط الآرامي", "answerIndex": 0, "explanation": "«تبناه البحث العلمي الحديث ومعظم علماء اللغويات العرب والمستشرقون ويقول بأن الخط العربي مشتق من حلقة الخط الآرامي»؛ ومنه النبطي الذي أخذ منه الخط النسخي.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/%D8%AE%D8%B7_%D8%B9%D8%B1%D8%A8%D9%8A"}, {"grade": 7, "subject": "فنون الكتابة", " , "054036": {"a": 36, "text": "وَلَقَدْ أَنذَرَهُم بَطْشَتَنَا فَتَمَارَوْا۟ بِٱلنُّذُرِ"}, "066002": {"a": 2, "text": "قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْ ۚ وَٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ"}, "051026": {"a": 26, "text": "فَرَاغَ إِلَىٰٓ أَهْلِهِۦ فَجَآءَ بِعِجْلٍۢ سَمِينٍۢ"}, "055010": {"a": 10, "text": "وَٱلْأَرْضَ وَضَعَهَا لِلْأَنَامِ"}, "071006": {"a": 6, "text": "فَلَمْ يَزِدْهُمْ دُعَآءِىٓ إِلَّا فِرَارًۭا"}, "054010": {"a": 10, "text": "فَدَعَا رَبَّهُۥٓ أَنِّى مَغْلُوبٌۭ فَٱنتَصِرْ"}, "057001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ"}, "076023": {"a": 23, "text": "إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ ٱلْقُرْءَانَ تَنزِيلًۭا"}, "056091": {"a": 91, "text": "فَسَلَٰمٌۭ لَّكَ مِنْ أَصْحَٰبِ ٱلْيَمِينِ"}, "050004": {"a": 4, "text": "قَدْ عَلِمْنَا مَا تَنقُصُ ٱلْأَرْضُ مِنْهُمْ ۖ وَعِندَنَا كِتَٰبٌ حَفِيظٌۢ"}, "052015": {"a": 15, "text": "أَفَسِحْرٌ هَٰذَآ أَمْ أَنتُمْ لَا تُبْصِرُونَ"}, "082018": {"a": 18, "text": "ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ"}, "070038": {"a": 38, "text": "أَيَطْمَعُ كُلُّ ٱمْرِئٍۢ مِّنْهُمْ أَن يُدْخَلَ جَنَّةَ نَعِيمٍۢ"}, "079027": {"a": 27, "text": "ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا"}, "052016": {"a": 16, "text": "ٱصْلَوْهَا فَٱصْبِرُوٓا۟ أَوْ لَا تَصْبِرُوا۟ سَوَآءٌ عَلَيْكُمْ ۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ"}, "105001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ ٱلْفِيلِ"}, "052024": {"a": 24, "text": "۞ وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌۭ لَّهُمْ كَأَنَّهُمْ لُؤْلُؤٌۭ مَّكْنُونٌۭ"}, "069013": {"a": 13, "text": "فَإِذَا نُفِخَ فِى ٱلصُّورِ نَفْخَةٌۭ وَٰحِدَةٌۭ"}, "067005": {"a": 5, "text": "وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ"}, "054009": {"a": 9, "text": "۞ كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ فَكَذَّبُوا۟ عَبْدَنَا وَقَالُوا۟ مَجْنُونٌۭ وَٱزْدُجِرَ"}, "072027": {"a": 27, "text": "إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا"}, "051031": {"a": 31, "text": "۞ قَالَ فَمَا خَطْبُكُمْ أَيُّهَا ٱلْمُرْسَلُونَ"}, "055015": {"a": 15, "text": "وَخَلَقَ ٱلْجَآنَّ مِن مَّارِجٍۢ مِّن نَّارٍۢ"}, "085007": {"a": 7, "text": "وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌۭ"}, "047001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ أَضَلَّ أَعْمَٰلَهُمْ"}, "078036": {"a": 36, "text": "جَزَآءًۭ مِّن رَّبِّكَ عَطَآءً حِسَابًۭا"}, "056045": {"a": 45, "text": "إِنَّهُمْ كَانُوا۟ قَبْلَ ذَٰلِكَ مُتْرَفِينَ"}, "050012": {"a": 12, "text": "كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ وَأَصْحَٰبُ ٱلرَّسِّ وَثَمُودُ"}, "071017": {"a": 17, "text": "وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلْأَرْضِ نَبَاتًۭا"}, "091013": {"a": 13, "text": "فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا"}, "079040": {"a": 40, "text": "وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ"}, "053038": {"a": 38, "text": "أَلَّا تَزِرُ وَازِرَةٌۭ وِزْرَ أُخْرَىٰ"}, "050015": {"a": 15, "text": "أَفَعَيِينَا بِٱلْخَلْقِ ٱلْأَوَّلِ ۚ بَلْ هُمْ فِى لَبْسٍۢ مِّنْ خَلْقٍۢ جَدِيدٍۢ"}, "049018": {"a": 18, "text": "إِنَّ ٱللَّهَ يَعْلَمُ غَيْبَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَٱللَّهُ بَصِيرٌۢ بِمَا تَعْمَلُونَ"}, "052012": {"a": 12, "text": "ٱلَّذِينَ هُمْ فِى خَوْضٍۢ يَلْعَبُونَ"}, "075005": {"a": 5, "text": "بَلْ يُرِيدُ ٱلْإِنسَٰنُ لِيَفْجُرَ أَمَامَهُۥ"}, "067003": {"a": 3, "text": "ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا ۖ مَّا تَرَىٰ فِى خَلْقِ ٱلرَّحْمَٰنِ مِن تَفَٰوُتٍۢ ۖ فَٱرْجِعِ ٱلْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍۢ"}, "056060": {"a": 60, "text": "نَحْنُ قَدَّرْنَا بَيْنَكُمُ ٱلْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ"}, "091014": {"a": 14, "text": "فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا"}, "055074": {"a": 74, "text": "لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ"}, "073005": {"a": 5, "text": "إِنَّا سَنُلْقِى عَلَيْكَ قَوْلًۭا ثَقِيلًا"}, "050029": {"a": 29, "text": "مَا يُبَدَّلُ ٱلْقَوْلُ لَدَىَّ وَمَآ أَنَا۠ بِظَلَّٰمٍۢ لِّلْعَبِيدِ"}, "051053": {"a": 53, "text": "أَتَوَاصَوْا۟ بِهِۦ ۚ بَلْ هُمْ قَوْمٌۭ طَاغُونَ"}, "070014": {"a": 14, "text": "وَمَن فِى ٱلْأَرْضِ جَمِيعًۭا ثُمَّ يُنجِيهِ"}, "077048": {"a": 48, "text": "وَإِذَا قِيلَ لَهُمُ ٱرْكَعُوا۟ لَا يَرْكَعُونَ"}, "083014": {"a": 14, "text": "كَلَّا ۖ بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ"}, "047002": {"a": 2, "text": "وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَءَامَنُوا۟ بِمَا نُزِّلَ عَلَىٰ مُحَمَّدٍۢ وَهُوَ ٱلْحَقُّ مِن رَّبِّهِمْ ۙ كَفَّرَ عَنْهُمْ سَيِّـَٔاتِهِمْ وَأَصْلَحَ بَالَهُمْ"}, "055024": {"a": 24, "text": "وَلَهُ ٱلْجَوَارِ ٱلْمُنشَـَٔاتُ فِى ٱلْبَحْرِ كَٱلْأَعْلَٰمِ"}, "089008": {"a": 8, "text": "ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ"}, "048007": {"a": 7, "text": "وَلِلَّهِ جُنُودُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا"}, "061010": {"a": 10, "text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ هَلْ أَدُلُّكُمْ عَلَىٰ تِجَٰرَةٍۢ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍۢ"}, "050026": {"a": 26, "text": "ٱلَّذِى جَعَلَ مَعَ ٱللَّهِ إِلَٰهًا ءَاخَرَ فَأَلْقِيَاهُ فِى ٱلْعَذَابِ ٱلشَّدِيدِ"}, "054011": {"a": 11, "text": "فَفَتَحْنَآ أَبْوَٰبَ ٱلسَّمَآءِ بِمَآءٍۢ مُّنْهَمِرٍۢ"}, "056041": {"a": 41, "text": "وَأَصْحَٰبُ ٱلشِّمَالِ مَآ أَصْحَٰبُ ٱلشِّمَالِ"}, "055043": {"a": 43, "text": "هَٰذِهِۦ جَهَنَّمُ ٱلَّتِى يُكَذِّبُ بِهَا ٱلْمُجْرِمُونَ"}, "048028": {"a": 28, "text": "هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًۭا"}, "075040": {"a": 40, "text": "أَلَيْسَ ذَٰلِكَ بِقَٰدِرٍ عَلَىٰٓ أَن يُحْۦِىَ ٱلْمَوْتَىٰ"}, "077049": {"a": 49, "text": "وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"}, "079018": {"a": 18, "text": "فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ"}, "048008": {"a": 8, "text": "إِنَّآ أَرْسَلْنَٰكَ شَٰهِدًۭا وَمُبَشِّرًۭا وَنَذِيرًۭا"}, "075036": {"a": 36, "text": "أَيَحْسَبُ ٱلْإِنسَٰنُ أَن يُتْرَكَ سُدًى"}, "089021": {"a": 21, "text": "كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّۭا دَكًّۭا"}, "067002": {"a": 2, "text": "ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًۭا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ"}, "056076": {"a": 76, "text": "وَإِنَّهُۥ لَقَسَمٌۭ لَّوْ تَعْلَمُونَ عَظِيمٌ"}, "068033": {"a": 33, "text": "كَذَٰلِكَ ٱلْعَذَابُ ۖ وَلَعَذَابُ ٱلْءَاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ"}, "072010": {"a": 10, "text": "وَأَنَّا لَا نَدْرِىٓ أَشَرٌّ أُرِيدَ بِمَن فِى ٱلْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًۭا"}, "055009": {"a": 9, "text": "وَأَقِيمُوا۟ ٱلْوَزْنَ بِٱلْقِسْطِ وَلَا تُخْسِرُوا۟ ٱلْمِيزَانَ"}, "089006": {"a": 6, "text": "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ"}, "061011": {"a": 11, "text": "تُؤْمِنُونَ بِٱللَّهِ وَرَسُولِهِۦ وَتُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ"}, "089005": {"a": 5, "text": "هَلْ فِى ذَٰلِكَ قَسَمٌۭ لِّذِى حِجْرٍ"}, "066001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ"}, "051032": {"a": 32, "text": "قَالُوٓا۟ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٍۢ مُّجْرِمِينَ"}, "050027": {"a": 27, "text": "۞ قَالَ قَرِينُهُۥ رَبَّنَا مَآ أَطْغَيْتُهُۥ وَلَٰكِن كَانَ فِى ضَلَٰلٍۭ بَعِيدٍۢ"}, "054028": {"a": 28, "text": "وَنَبِّئْهُمْ أَنَّ ٱلْمَآءَ قِسْمَةٌۢ بَيْنَهُمْ ۖ كُلُّ شِرْبٍۢ مُّحْتَضَرٌۭ"}, "048009": {"a": 9, "text": "لِّتُؤْمِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَتُعَزِّرُوهُ وَتُوَقِّرُوهُ وَتُسَبِّحُوهُ بُكْرَةًۭ وَأَصِيلًا"}, "077031": {"a": 31, "text": "لَّا ظَلِيلٍۢ وَلَا يُغْنِى مِنَ ٱللَّهَبِ"}, "080023": {"a": 23, "text": "كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ"}, "089009": {"a": 9, "text": "وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ"}}, EXPL={"3|الرياضيات|عالم الجمع والطرح": [{"t": "عالم الجمع والطرح", "k": "", "lines": ["بص يا حبيبي، لما نجمع، بنحط الأرقام تحت بعض: آحاد تحت آحاد، وعشرات تحت عشرات، ومئات تحت مئات."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["نبدأ الجمع من اليمين، من الآحاد. لو الناتج 10 أو أكتر، نكتب الآحاد ونرفع العشرة للعمود اللي جنبه. اسمها الحمل."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["في الطرح كمان نبدأ من الآحاد. لو الرقم اللي فوق أصغر، نستلف عشرة من العمود اللي جنبه."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["مثال: 45 + 28. نجمع 5 + 8 = 13، نكتب 3 ونرفع 1. بعدين 4 + 2 + 1 = 7. الناتج 73."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["اتأكد من الحل: الجمع نختبره بالطرح، والطرح نختبره بالجمع. لو رجعنا للرقم الأصلي يبقى الحل صح. يلا يا بطل."]}], "3|الرياضيات|عالم الزمن": [{"t": "عالم الزمن", "k": "", "lines": ["بص يا حبيبي، الساعة فيها 60 دقيقة، واليوم فيه 24 ساعة، والأسبوع 7 أيام."]}, {"t": "عالم الزمن", "k": "", "lines": ["العقرب الصغير بيقول الساعة، والعقرب الكبير بيقول الدقايق. لما الكبير على 6 نقول والنصف، ولما يكون على 3 نقول والربع."]}, {"t": "عالم الزمن", "k": "", "lines": ["الزمن المنقضي هو الفرق بين وقت البداية ووقت النهاية. من 3:00 لحد 5:30 يبقى ساعتين ونص."]}, {"t": "عالم الزمن", "k": "", "lines": ["السنة فيها 12 شهر، والشهر ممكن يكون 30 أو 31 يوم، وفبراير أقل."]}, {"t": "عالم الزمن", "k": "", "lines": ["اقرأ السؤال وشوف بيسأل عن ساعة ولا دقيقة ولا يوم، وبعدين اختار الوحدة الصح. يلا يا بطل."]}], "3|الرياضيات|مملكة الضرب": [{"t": "مملكة الضرب", "k": "", "lines": ["بص يا حبيبي، الضرب هو جمع الرقم نفسه كذا مرة. 4 × 3 يعني 4 + 4 + 4 = 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["جدول الضرب لازم نحفظه. ممكن نتعلمه بالعد بالقفزات: 3، 6، 9، 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["الترتيب مش بيغير الناتج: 4 × 3 = 3 × 4."]}, {"t": "مملكة الضرب", "k": "", "lines": ["أي رقم × 1 يساوي نفسه. وأي رقم × 0 يساوي صفر."]}, {"t": "مملكة الضرب", "k": "", "lines": ["لو السؤال فيه مجموعات متساوية، اعرف عدد المجموعات وعدد كل مجموعة واضرب. يلا يا بطل."]}], "3|الرياضيات|مملكة ا  try{

 }catch(e){}

var PQ=null;
function pqPick(){
 try{
  var pool=(window.RAW||[]).filter(function(r){return r&&r.choices&&r.choices.length>=3&&r.explanation&&["القرآن","التربية الإسلامية","العربي"].indexOf(r.subject)>=0});

 }catch(e){return null}
}

   +'<div class="card"><h2>💬 أسئلة تفتح الكلام بعد اللعب</h2><p>· إيه أكتر سؤال عجبك النهاردة وليه؟<br>· إيه السؤال اللي غلطت فيه واتعلمت منه إيه؟<br>· لو هتعمل سؤال لبابا وماما، هيكون عن إيه؟<br>· إيه المادة اللي عايز تكسب فيها تلميحات زيادة؟</p></div>'

  render(h);

 }catch(e){}
