xplanation": "خُصصت للطلاب الأفارقة أروقة بالأزهر، مثل رواق الجبرتية الذي خُصص للطلاب الوافدين من بلاد الحبشة وسواحل البحر الأحمر، ورواق المغاربة ليضم طلاب شمال إفريقيا وبلاد المغرب العربي.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lecture/317392/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D8%B1%D8%AA%D8%A8%D8%B7%D8%AA-%D9%85%D8%B5%D8%B1-%D9%85%D8%B9-%D8%A7%D9%84%D8%AF%D9%88%D9%84-%D9%88%D8%A7%D9%84%D9%85%D9%85%D8%A7%D9%84%D9%83-%D8%A7%D9%84%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A9-%D8%AE%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D8%B5%D9%88%D8%B1-%D8%A7%D9%84%D9%88%D8%B3%D8%B7%D9%89"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-298", "question": "وفر الأزهر الشريف للطلاب الأفارقة ......... ليتفرغوا لطلب العلم", "choices": ["مناصب في الدولة", "إقامة مستقرة في أروقته ورواتب", "أراضٍ زراعية في مصر", "سفنًا للسفر إلى بلادهم"], "answer": "إقامة مستقرة في أروقته ورواتب", "answerIndex": 1, "explanation": "وفر لهم الأزهر إقامة مستقرة في أروقته وأعطى لهم الرواتب ليتفرغوا لطلب العلم، وبعد عودة هؤلاء الطلاب إلى بلادهم أقاموا بها المدارس والمساجد وحلقات العلم والتدريس.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lecture/317392/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D8%B1%D8%AA%D8%A8%D8%B7%D8%AA-%D9%85%D8%B5%D8%B1-%D9%85%D8%B9-%D8%A7%D9%84%D8%AF%D9%88%D9%84-%D9%88%D8%A7%D9%84%D9%85%D9%85%D8%A7%D9%84%D9%83-%D8%A7%D9%84%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A9-%D8%AE%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D8%B5%D9%88%D8%B1-%D8%A7%D9%84%D9%88%D8%B3%D8%B7%D9%89"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-299", "question": "كانت مصر تستورد من إفريقيا في العصور الوسطى .........", "choices": ["العاج وريش النعام والصمغ وبعض الجلود", "الأواني النحاسية والمصنوعات الحديدية", "أدوات الزينة ومصنوعات الزجاج", "الأقمشة والمنسوجات والسجاد"], "answer": "العاج وريش النعام والصمغ وبعض الجلود", "answerIndex": 0, "explanation": "كانت مصر الوسيط الوحيد في استيراد سلع الشرق ونقلها لإفريقيا، حيث حمل التجار المصريون مصنوعات راقية مثل الأواني النحاسية والمصنوعات الحديدية والفضية والذهبية وأدوات الزينة ومصنوعات الزجاج، كما كانت مصر تستورد من إفريقيا العديد من المنتجات مثل العاج وريش النعام والصمغ وبعض الجلود.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lecture/317392/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D8%B1%D8%AA%D8%A8%D8%B7%D8%AA-%D9%85%D8%B5%D8%B1-%D9%85%D8%B9-%D8%A7%D9%84%D8%AF%D9%88%D9%84-%D9%88%D8%A7%D9%84%D9%85%D9%85%D8%A7%D9%84%D9%83-%D8%A7%D9%84%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A9-%D8%AE%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D8%B5%D9%88%D8%B1-%D8%A7%D9%84%D9%88%D8%B3%D8%B7%D9%89"}, {"grade": 7, "subject": "الدراسات الاجتماعية", "id": "h26-g7-300", "question": "قال ابن خلدون عن مدينة القاهرة: «رأيت .........»", "choices": ["حاضرة الدنيا وبستان العلم ومحشر الأمم وإيوان الإسلام وكرسي الملك", "مدينة الذهب وبلد الحضارة", "أم المدن وعاصمة العواصم", "جوهرة الشرق وعروس النيل"], "answer": "حاضرة الدنيا وبستان العلم ومحشر الأمم وإيوان الإسلام وكرسي الملك", "answerIndex": 0, "explanation": "يقول ابن خلدون عن مكانة مصر والقاهرة الإسلامية: «رأيت حاضرة الدنيا وبستان العلم ومحشر الأمم وإيوان الإسلام وكرسي الملك»؛ فقد كانت القاهرة في القرنين 8–9هـ / 14–15م قلب الإسلام ومركز الحضارة الإسلامية.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lecture/317392/%D8%A3%D9%88%D9%84-%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A/%D8%A7%D9%84%D8%AF%D8%B1%D8%A7%D8%B3%D8%A7%D8%AA-%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%D9%8A%D8%A9/%D8%A7%D8%B1%D8%AA%D8%A8%D8%B7%D8%AA-%D9%85%D8%B5%D8%B1-%D9%85%D8%B9-%D8%A7%D9%84%D8%AF%D9%88%D9%84-%D9%88%D8%A7%D9%84%D9%85%D9%85%D8%A7%D9%84%D9%83-%D8%A7%D9%84%D8%A5%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A9-%D8%AE%D9%84%D8%A7%D9%84-%D8%A7%D9%84%D8%B9%D8%B5%D9%88%D8%B1-%D8%A7%D9%84%D9%88%D8%B3%D8%B7%D9%89"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-301", "question": "I use a ..................... to type letters and words on my computer.", "choices": ["camera", "printer", "keyboard", "microphone"], "answer": "keyboard", "answerIndex": 2, "explanation": "keyboard هي لوحة المفاتيح؛ نستخدمها لكتابة الحروف والكلمات على الحاسوب.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-302", "question": "To record your voice, you need a .....................", "choices": ["printer", "keyboard", "smartboard", "microphone"], "answer": "microphone", "answerIndex": 3, "explanation": "microphone هو الميكروفون؛ وظيفته تسجيل الصوت.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-303", "question": "The teacher uses a ..................... to show pictures and videos in class.", "choices": ["microphone", "smartboard", "keyboard", "printer"], "answer": "smartboard", "answerIndex": 1, "explanation": "smartboard هي السبورة الذكية؛ تعرض محتوى الدرس بصورة تفاعلية داخل الفصل.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-304", "question": "I need a ..................... to print my homework on paper.", "choices": ["smartboard", "keyboard", "printer", "microphone"], "answer": "printer", "answerIndex": 2, "explanation": "printer هي الطابعة؛ تطبع النص على الورق.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-305", "question": "We use a ..................... to make a video call with our teacher.", "choices": ["keyboard", "webcam", "printer", "smartboard"], "answer": "webcam", "answerIndex": 1, "explanation": "webcam هي كاميرا الويب؛ نستخدمها في مكالمة الفيديو مع المعلم.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-306", "question": "A ..................... is a page on the Internet that gives information or services.", "choices": ["keyboard", "printer", "website", "app"], "answer": "website", "answerIndex": 2, "explanation": "التعريف يشير إلى website أي موقع إلكتروني يقدم معلومات أو خدمات؛ أما app فهو تطبيق يُستخدم على الهاتف أو الجهاز. (تصويب: مفتاح المراجعة ذكر app خطأً لهذا التعريف.)", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-307", "question": "An ..................... is a book you can read on a screen.", "choices": ["smartboard", "printer", "microphone", "ebook"], "answer": "ebook", "answerIndex": 3, "explanation": "ebook هو الكتاب الإلكتروني؛ نقرؤه على الشاشة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-308", "question": "Click ..................... the icon to open the app.", "choices": ["for", "on", "of", "in"], "answer": "on", "answerIndex": 1, "explanation": "التعبير الصحيح click on أي انقر على الأيقونة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-309", "question": "You should take breaks ..................... your screen to rest your eyes.", "choices": ["on", "in", "from", "of"], "answer": "from", "answerIndex": 2, "explanation": "التعبير الصحيح take breaks from أي خذ فترات راحة من الشاشة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-310", "question": "I am interested ..................... learning new words with an app.", "choices": ["on", "of", "for", "in"], "answer": "in", "answerIndex": 3, "explanation": "التعبير الصحيح interested in أي مهتم بـ.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-311", "question": "My father is proud ..................... me because I study every day.", "choices": ["for", "of", "on", "in"], "answer": "of", "answerIndex": 1, "explanation": "التعبير الصحيح proud of أي فخور بـ.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-312", "question": "The word \"safe\" is the opposite of .....................", "choices": ["quick", "smart", "happy", "dangerous"], "answer": "dangerous", "answerIndex": 3, "explanation": "safe تعني آمن، وعكسها dangerous أي خطير.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-313", "question": "\"Smart\" is similar in meaning to .....................", "choices": ["slow", "lazy", "intelligent", "dangerous"], "answer": "intelligent", "answerIndex": 2, "explanation": "smart وintelligent مترادفان؛ كلاهما يعني ذكي.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-314", "question": "Add the correct ending to \"teach\" to get the word for a person who teaches: .....................", "choices": ["teaching", "teachable", "teacher", "teaches"], "answer": "teacher", "answerIndex": 2, "explanation": "نضيف اللاحقة -er إلى teach فتصبح teacher أي معلم.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-315", "question": "Add -ive to \"interact\" to make the adjective: .....................", "choices": ["interaction", "interacted", "interacts", "interactive"], "answer": "interactive", "answerIndex": 3, "explanation": "interact + ive = interactive أي تفاعلي؛ وهي صفة لا اسم.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-316", "question": "We should think ..................... to solve this problem.", "choices": ["creatively", "creative", "creation", "creates"], "answer": "creatively", "answerIndex": 0, "explanation": "نحتاج إلى ظرف يصف طريقة التفكير؛ فالصواب creatively لا الصفة creative.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-317", "question": "She ..................... her tablet every day.", "choices": ["uses", "used", "use", "using"], "answer": "uses", "answerIndex": 0, "explanation": "مع الفاعل المفرد الغائب (she) نضيف s إلى الفعل في المضارع البسيط: uses.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-318", "question": "..................... you usually read ebooks?", "choices": ["Is", "Do", "Does", "Are"], "answer": "Do", "answerIndex": 1, "explanation": "سؤال المضارع البسيط مع you يبدأ بـ Do، ويأتي الفعل بعده في المصدر: Do you usually read...؟", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-319", "question": "Which sentence uses \"usually\" correctly?", "choices": ["I read before I usually sleep.", "I usually read before I sleep.", "Usually I reads before I sleep.", "I read usually before I sleep."], "answer": "I usually read before I sleep.", "answerIndex": 1, "explanation": "ظرف التكرار usually يأتي قبل الفعل الأساسي؛ ومع I لا نضيف s إلى الفعل.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-320", "question": "Hana ..................... late for school.", "choices": ["never does", "never is", "does never", "is never"], "answer": "is never", "answerIndex": 3, "explanation": "مع الفعل be يأتي ظرف التكرار بعده: Hana is never late.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-321", "question": "Does Omar ..................... his homework every day?", "choices": ["do", "doing", "does", "did"], "answer": "do", "answerIndex": 0, "explanation": "بعد does يأتي الفعل الأساسي في المصدر؛ فلا نجمع بين does والفعل المضاف إليه s.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-322", "question": "..................... do you use the Internet?", "choices": ["How many", "How often", "How long", "How much"], "answer": "How often", "answerIndex": 1, "explanation": "السؤال عن التكرار يبدأ بـ How often أي كم مرة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-323", "question": "Ahmed ..................... to school by bus every morning.", "choices": ["went", "go", "going", "goes"], "answer": "goes", "answerIndex": 3, "explanation": "مع الفاعل المفرد الغائب (Ahmed) نضيف es إلى الفعل go في المضارع البسيط: goes.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-324", "question": "They ..................... watch TV in the morning; they watch it in the evening.", "choices": ["isn't", "don't", "aren't", "doesn't"], "answer": "don't", "answerIndex": 1, "explanation": "مع الفاعل الجمع (they) ننفي المضارع البسيط بـ don't ثم الفعل في المصدر.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-325", "question": "In the Unit 1 reading text, the writer talks about his future dreams, his plan and his .....................", "choices": ["trees", "talent", "garden", "teacher"], "answer": "talent", "answerIndex": 1, "explanation": "قطعة الوحدة الأولى تناقش أحلام المستقبل والتخطيط والموهبة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-326", "question": "— How often do you use your tablet? — .....................", "choices": ["With my friends", "At 7 o'clock", "In my room", "Every day"], "answer": "Every day", "answerIndex": 3, "explanation": "السؤال عن التكرار How often فتكون الإجابة بمدة متكررة مثل Every day.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-327", "question": "— Why do you sit in the front of the class? — ..................... the board well.", "choices": ["To see", "To hear", "To sleep", "To play"], "answer": "To see", "answerIndex": 0, "explanation": "الجلوس في المقدمة مرتبط برؤية السبورة جيدًا.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-328", "question": "A ..................... helps you show your ideas with pictures and lines.", "choices": ["mind map", "microphone", "printer", "smartboard"], "answer": "mind map", "answerIndex": 0, "explanation": "mind map هي الخريطة الذهنية؛ تعرض الأفكار بالصور والخطوط.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-329", "question": "Omar learns best when he listens to the teacher. Omar is a/an ..................... learner.", "choices": ["kinesthetic", "visual", "digital", "auditory"], "answer": "auditory", "answerIndex": 3, "explanation": "من يتعلم أفضل بالاستماع فهو متعلم سمعي auditory.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-330", "question": "Sara learns best when she sees pictures and charts. Sara is a/an ..................... learner.", "choices": ["auditory", "visual", "kinesthetic", "digital"], "answer": "visual", "answerIndex": 1, "explanation": "من تتعلم أفضل برؤية الصور والرسوم فهي متعلمة بصرية visual.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-331", "question": "Ali learns best when he does experiments with his hands. Ali is a/an ..................... learner.", "choices": ["digital", "visual", "auditory", "kinesthetic"], "answer": "kinesthetic", "answerIndex": 3, "explanation": "من يتعلم أفضل بالتجربة العملية باليدين فهو متعلم حركي kinesthetic.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-332", "question": "Working together and helping each other in class is called .....................", "choices": ["teamwork", "timetable", "homework", "classroom"], "answer": "teamwork", "answerIndex": 0, "explanation": "teamwork هو العمل الجماعي؛ أي العمل معًا ومساعدة بعضنا بعضًا.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2678/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-333", "question": "Emad ..................... repair his computer alone.", "choices": ["can to", "cans", "can", "is can"], "answer": "can", "answerIndex": 2, "explanation": "بعد can يأتي الفعل في المصدر مباشرة دون to أو s: can repair.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-334", "question": "He is able to swim very well. = He ..................... swim very well.", "choices": ["cans", "is can", "can", "could to"], "answer": "can", "answerIndex": 2, "explanation": "عند التحويل من is able to إلى can نحذف to؛ فالصواب He can swim.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-335", "question": "Last year, I ..................... read English stories, but now I can.", "choices": ["can", "am able to", "was able to", "will be able to"], "answer": "was able to", "answerIndex": 2, "explanation": "was able to تعبر عن قدرة في الماضي؛ أما can فتعبر عن قدرة في الحاضر.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-336", "question": "Layla ..................... an app to learn words at the moment.", "choices": ["uses", "used", "is using", "use"], "answer": "is using", "answerIndex": 2, "explanation": "at the moment تدل على حدث جارٍ؛ نستخدم is + الفعل + ing: is using.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-337", "question": "My brother ..................... his computer now.", "choices": ["is fixing", "fix", "fixes", "fixing"], "answer": "is fixing", "answerIndex": 0, "explanation": "now مع حدث جارٍ؛ نستخدم is + الفعل + ing: is fixing.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-338", "question": "I ..................... my lessons now, so please be quiet.", "choices": ["revises", "revise", "can revising", "am revising"], "answer": "am revising", "answerIndex": 3, "explanation": "now تدل على نشاط جارٍ؛ نستخدم am + الفعل + ing: am revising؛ وcan يتبعها المصدر لا ing.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2678/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-339", "question": "She ..................... a new bike, so she is saving money.", "choices": ["wants", "is wanting", "want", "wanting"], "answer": "wants", "answerIndex": 0, "explanation": "want من أفعال الحالة؛ لا نستخدمها في المضارع المستمر، فنقول wants لا is wanting.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-340", "question": "We visited our uncle .....................", "choices": ["last week", "now", "every day", "tomorrow"], "answer": "last week", "answerIndex": 0, "explanation": "last week تدل على الماضي البسيط؛ أما tomorrow وnow وevery day فلا تدل على الماضي.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-341", "question": "Ahmed ..................... to school yesterday.", "choices": ["went", "go", "goes", "going"], "answer": "went", "answerIndex": 0, "explanation": "yesterday تدل على الماضي؛ والماضي من go هو went.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-342", "question": "They did not ..................... to the club last Friday.", "choices": ["going", "goes", "go", "went"], "answer": "go", "answerIndex": 2, "explanation": "بعد did not يعود الفعل إلى المصدر؛ فلا نقول did not went.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-343", "question": "..................... Ali absent a week ago?", "choices": ["Is", "Were", "Was", "Did"], "answer": "Was", "answerIndex": 2, "explanation": "مع was وwere نبني السؤال بهما مباشرة دون did: Was Ali absent...؟", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-344", "question": "Did she ..................... the party last night?", "choices": ["enjoys", "enjoying", "enjoy", "enjoyed"], "answer": "enjoy", "answerIndex": 2, "explanation": "بعد did يأتي الفعل في المصدر: Did she enjoy...؟", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2678/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-345", "question": "Ahmed uses social media to ask people to help him plant trees in the garden. This shows that Ahmed is .....................", "choices": ["helpful", "shy", "angry", "lazy"], "answer": "helpful", "answerIndex": 0, "explanation": "استخدم أحمد وسائل التواصل لجمع الدعم وزراعة الأشجار؛ فهو متعاون يساعد مجتمعه.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-346", "question": "In the reading text, the word \"raise\" means to ..................... money for the trees.", "choices": ["lose", "spend", "borrow", "collect"], "answer": "collect", "answerIndex": 3, "explanation": "raise في سياق جمع المال تعني collect أي يجمع.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-347", "question": "— What did she study? — .....................", "choices": ["Physics", "1985", "At home", "In Egypt"], "answer": "Physics", "answerIndex": 0, "explanation": "الرد باسم مجال الدراسة (Physics) يقود إلى سؤال What did she study?؛ أما السنة فتسأل عنها When was she born?‏", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2663/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-348", "question": "In \"The First Challenge\", the children open the box by .....................", "choices": ["running away from school", "exchanging ideas and helping each other", "sleeping in the classroom", "fighting and shouting"], "answer": "exchanging ideas and helping each other", "answerIndex": 1, "explanation": "في التحدي الأول ارتبط فتح الصندوق بتبادل الأفكار والتعاون ومساعدة بعضهم بعضًا.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-349", "question": "In \"The Power of Unity\", the children cross the ..................... and open the golden door.", "choices": ["invisible bridge", "deep river", "high mountain", "dark cave"], "answer": "invisible bridge", "answerIndex": 0, "explanation": "في الفصل الثاني يظهر الجسر غير المرئي ثم الباب الذهبي.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-350", "question": "Omar was afraid of the bridge, but he tried again with his friends. This shows that Omar is .....................", "choices": ["brave", "angry", "lazy", "quiet"], "answer": "brave", "answerIndex": 0, "explanation": "الشجاعة في سياق الفصل لا تعني غياب الخوف؛ بل تعني المحاولة رغم الشعور به.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2492/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-351", "question": "A person who is admired for their courage or outstanding achievements is called a .....................", "choices": ["follower", "stranger", "hero", "student"], "answer": "hero", "answerIndex": 2, "explanation": "hero تعني بطلًا؛ وهو الشخص الذي يُعجَب به الناس لشجاعته أو إنجازاته المتميزة.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-352", "question": "To ..................... means to fill someone with the urge or ability to do or feel something, especially to do something creative.", "choices": ["discourage", "ignore", "bore", "inspire"], "answer": "inspire", "answerIndex": 3, "explanation": "inspire تعني يُلهِم؛ أي يملأ الشخص بالرغبة أو القدرة على فعل شيء، خاصة شيء إبداعي، وعكسها discourage أي يُثبّط.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-353", "question": "If someone is ....................., they are very brave and willing to take risks.", "choices": ["scared", "courageous", "cowardly", "shy"], "answer": "courageous", "answerIndex": 1, "explanation": "courageous تعني شجاع؛ وهو وصف من يُقدِم على المخاطرة بشجاعة، وعكسها cowardly أي جبان.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-354", "question": "Having a strong feeling about something or a strong belief in something is being .....................", "choices": ["quiet", "indifferent", "passionate", "bored"], "answer": "passionate", "answerIndex": 2, "explanation": "passionate تعني شغوف؛ أي صاحب شعور قوي أو إيمان راسخ بشيء ما.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-355", "question": "A group of people living in the same place or having a particular characteristic in common is a .....................", "choices": ["city", "community", "nation", "country"], "answer": "community", "answerIndex": 1, "explanation": "community تعني مجتمعًا؛ مجموعة من الناس يعيشون في المكان نفسه أو تجمعهم صفة مشتركة.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-356", "question": "The successful accomplishment of something is an .....................", "choices": ["failure", "mistake", "achievement", "attempt"], "answer": "achievement", "answerIndex": 2, "explanation": "achievement تعني إنجازًا؛ وهو إتمام شيء ما بنجاح، وعكسها failure أي فشل.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-357", "question": "If you are ....................., you are unable to see.", "choices": ["limping", "deaf", "mute", "blind"], "answer": "blind", "answerIndex": 3, "explanation": "blind تعني أعمى؛ أي غير قادر على الرؤية، بينما deaf تعني أصم وmute تعني أبكم.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-358", "question": "The quality of being honest and having strong moral principles is called .....................", "choices": ["apathy", "integrity", "dishonesty", "weakness"], "answer": "integrity", "answerIndex": 1, "explanation": "integrity تعني النزاهة؛ وهي صفة الصدق والتمسك بمبادئ أخلاقية قوية، وعكسها dishonesty.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-359", "question": "The capacity to have an effect on the character, development, or behavior of someone or something is .....................", "choices": ["disinterest", "isolation", "influence", "separation"], "answer": "influence", "answerIndex": 2, "explanation": "influence تعني تأثيرًا؛ وهي القدرة على التأثير في شخصية شخص ما أو سلوكه أو نموه.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-360", "question": "Important jobs or roles in an organization or company are called .....................", "choices": ["hobbies", "desires", "opinions", "positions"], "answer": "positions", "answerIndex": 3, "explanation": "positions تعني مناصب؛ وهي الوظائف أو الأدوار المهمة في منظمة أو شركة.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-361", "question": "A ..................... is a person who writes books and shares ideas about countries and their history.", "choices": ["musician", "geographer", "scientist", "builder"], "answer": "geographer", "answerIndex": 1, "explanation": "geographer تعني جغرافيًا؛ وهو من يكتب الكتب ويشارك الأفكار عن البلدان وتاريخها، مثل جمال حمدان صاحب كتاب «شخصية مصر».", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3l3.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-362", "question": "Omar took a deep ..................... before he started his speech.", "choices": ["decision", "ambition", "success", "breath"], "answer": "breath", "answerIndex": 3, "explanation": "التعبير الصحيح هو took a deep breath أي أخذ نفسًا عميقًا؛ وكلمة ambition لا تلائم هذا التعبير، وقد صحّحتها مراجعة Step Ahead نفسها في مفتاح الإجابات.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2678/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-363", "question": "Dr. Samira Moussa ..................... in Egypt in 1917.", "choices": ["will be born", "is born", "was born", "born"], "answer": "was born", "answerIndex": 2, "explanation": "was born هي صيغة الماضي البسيط من الفعل be born؛ فالحدث وقع في الماضي (1917).", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-364", "question": "Taha Hussein ..................... many books and articles.", "choices": ["writes", "write", "wrote", "is writing"], "answer": "wrote", "answerIndex": 2, "explanation": "wrote هي صيغة الماضي البسيط من write؛ فطه حسين كتب كثيرًا من الكتب والمقالات في الماضي.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-365", "question": "My brother ..................... a new job last month.", "choices": ["starts", "is starting", "start", "started"], "answer": "started", "answerIndex": 3, "explanation": "started هي صيغة الماضي البسيط من start؛ وكلمة last month تدل على زمن ماضٍ.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-366", "question": "I ..................... up late during the last summer vacation.", "choices": ["got", "gets", "get", "gotten"], "answer": "got", "answerIndex": 0, "explanation": "got هي صيغة الماضي البسيط من get؛ فالعبارة got up تعني استيقظ، والجملة عن عطلة الصيف الماضية.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3l3.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-367", "question": "Zeina never ..................... fast food when she was a child. She liked to be healthy.", "choices": ["ate", "eats", "eat", "eating"], "answer": "ate", "answerIndex": 0, "explanation": "ate هي صيغة الماضي البسيط من eat؛ فالجملة عن عادة في الماضي (when she was a child).", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3l3.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-368", "question": "Did Taha Hussein ..................... at Al-Azhar University in Cairo?", "choices": ["studies", "study", "studied", "studying"], "answer": "study", "answerIndex": 1, "explanation": "بعد did يعود الفعل إلى المصدر؛ فنقول Did he study? لا Did he studied? — وطه حسين درس في الأزهر ثم في فرنسا.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3l3.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-369", "question": "..................... Taha Hussein blind as a child?", "choices": ["Is", "Was", "Were", "Did"], "answer": "Was", "answerIndex": 1, "explanation": "عندما تصف الجملة حالة أو صفة نستخدم was أو were مباشرة دون did؛ فنقول Was he blind? لا Did he was blind?.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2678/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-370", "question": "When was Dr. Samira Moussa born?", "choices": ["1973", "1889", "1952", "1917"], "answer": "1917", "answerIndex": 3, "explanation": "وُلدت الدكتورة سميرة موسى في مصر عام 1917؛ أما 1889 فهو عام ميلاد طه حسين و1973 عام وفاته.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-371", "question": "What was Dr. Samira Moussa's main field of study?", "choices": ["Physics (atomic radiation)", "Biology", "Literature", "History"], "answer": "Physics (atomic radiation)", "answerIndex": 0, "explanation": "درست سميرة موسى الفيزياء وحصلت على الدكتوراه في الإشعاع الذري، وكانت من أوائل المصريات الحاصلات على الدكتوراه.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-372", "question": "What was Dr. Samira Moussa's wish?", "choices": ["To become a famous writer", "That cancer treatment would be as cheap as aspirin", "To be Minister of Education", "To study in France"], "answer": "That cancer treatment would be as cheap as aspirin", "answerIndex": 1, "explanation": "كانت أمنية سميرة موسى أن يكون علاج السرطان رخيصًا مثل الأسبرين؛ فإنجازاتها في العلم وروحها الشجاعة جعلتاها رمزًا للأمل.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-373", "question": "What physical challenge did Taha Hussein face from childhood?", "choices": ["He could not speak", "He was deaf", "He could not walk", "He was blind"], "answer": "He was blind", "answerIndex": 3, "explanation": "أصبح طه حسين أعمى وهو طفل صغير، لكن ذلك لم يمنعه أبدًا من تحقيق إنجازات عظيمة.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-374", "question": "What did Taha Hussein believe was important for everyone, especially for girls?", "choices": ["Travel", "Education", "Sports", "Money"], "answer": "Education", "answerIndex": 1, "explanation": "آمن طه حسين بأن التعليم مهم للجميع، وخاصة للبنات، وعمل بجد ليجعل التعليم متاحًا لكل المصريين.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3test.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-375", "question": "Why is Taha Hussein called 'The Dean of Arabic Literature'?", "choices": ["Because he studied in France", "Because of his great influence and writings", "Because he was a minister", "Because he was born in 1889"], "answer": "Because of his great influence and writings", "answerIndex": 1, "explanation": "لُقّب طه حسين بعميد الأدب العربي لعظيم تأثيره وكتاباته؛ فقد كتب كثيرًا عن المجتمع المصري والتاريخ والتعليم.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3l3.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-376", "question": "The book 'The Personality of Egypt' is about .....................", "choices": ["sports", "fashion", "movies", "the land and people of Egypt"], "answer": "the land and people of Egypt", "answerIndex": 3, "explanation": "كتاب «شخصية مصر» للجغرافي جمال حمدان يتحدث عن أرض مصر وشعبها.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/g7t1u3l3.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-377", "question": "A/An ..................... means something you want to achieve.", "choices": ["goal", "opinion", "situation", "problem"], "answer": "goal", "answerIndex": 0, "explanation": "goal تعني هدفًا؛ وهو شيء تريد تحقيقه، مثل النجاح في الامتحان.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-378", "question": "To get the opposite of the word 'honest', we add the prefix '.....................'", "choices": ["dis-", "un-", "ir-", "im-"], "answer": "dis-", "answerIndex": 0, "explanation": "عكس honest هو dishonest بإضافة البادئة dis-؛ أما un- فتأتي مع كلمات أخرى مثل unhappy.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-379", "question": "The word 'easy' has the same meaning as '.....................'", "choices": ["skillful", "smart", "difficult", "simple"], "answer": "simple", "answerIndex": 3, "explanation": "easy مرادفها simple أي سهل وبسيط؛ وعكسها difficult أي صعب.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-380", "question": "Mai is ..................... She is always late for her school.", "choices": ["responsible", "irresponsible", "careful", "organized"], "answer": "irresponsible", "answerIndex": 1, "explanation": "irresponsible تعني غير مسؤول؛ فمن يتأخر دائمًا عن مدرسته لا يتحمل مسؤولية وقته، وعكسها responsible.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-381", "question": "Adam listened carefully to his coach's advice and thought it was a wise ..................... to rest until he got better.", "choices": ["injured", "coach", "recover", "decision"], "answer": "decision", "answerIndex": 3, "explanation": "decision تعني قرارًا؛ وقرار آدم الحكيم كان الراحة حتى يتعافى، بينما coach تعني مدربًا وinjured تعني مصابًا.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-382", "question": "If you make a poor choice, it might lead to a bad .....................", "choices": ["consequence", "goal", "decision", "option"], "answer": "consequence", "answerIndex": 0, "explanation": "consequence تعني نتيجة؛ فالاختيار السيئ قد يؤدي إلى نتيجة سيئة، أما decision فهي القرار نفسه.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-383", "question": "If you want to make a smart choice, you should first think about all your .....................", "choices": ["accidents", "problems", "options", "mistakes"], "answer": "options", "answerIndex": 2, "explanation": "الخطوة الأولى للاختيار الذكي هي التفكير في كل الخيارات المتاحة options، ثم التفكير في النتائج المحتملة لكل خيار.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-384", "question": "If you study hard, you ..................... your exams.", "choices": ["pass", "passing", "will pass", "passed"], "answer": "will pass", "answerIndex": 2, "explanation": "في الشرط الأول نستخدم المضارع البسيط بعد if، وwill + المصدر في النتيجة؛ فالشرط study hard ونتيجته will pass.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2678/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-385", "question": "If it rains tomorrow, we ..................... to the park.", "choices": ["will go", "go", "won't go", "went"], "answer": "won't go", "answerIndex": 2, "explanation": "في الشرط الأول المنفي نستخدم won't + المصدر في النتيجة؛ فإذا أمطرت لن نذهب إلى الحديقة.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-386", "question": "If we arrive early, we ..................... the show.", "choices": ["see", "seeing", "will see", "saw"], "answer": "will see", "answerIndex": 2, "explanation": "إذا وصلنا مبكرًا فسنرى العرض؛ فبعد if يأتي المضارع البسيط arrive، وفي النتيجة will + المصدر see.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-387", "question": "If you choose to finish your homework before playing, it ..................... your grades.", "choices": ["will benefit", "benefited", "benefits", "benefiting"], "answer": "will benefit", "answerIndex": 0, "explanation": "من مثال القطعة: إنهاء الواجب قبل اللعب يفيد درجاتك؛ فالنتيجة will benefit بعد شرط في المضارع البسيط.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-388", "question": "If you don't finish your homework, your teacher ..................... happy.", "choices": ["is", "will be", "was", "won't be"], "answer": "won't be", "answerIndex": 3, "explanation": "عدم إنهاء الواجب نتيجته أن المعلم لن يكون سعيدًا؛ فنستخدم won't be في النتيجة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2678/"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-389", "question": "It is important to go to bed early on school days. — You ..................... go to bed early on school days.", "choices": ["should", "shouldn't", "won't", "don't"], "answer": "should", "answerIndex": 0, "explanation": "للنصيحة نستخدم should + المصدر؛ فالجملة تعني: يجب أن تنام مبكرًا في أيام الدراسة.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-390", "question": "It isn't good to skip breakfast. — You ..................... skip breakfast.", "choices": ["shouldn't", "will", "can", "should"], "answer": "shouldn't", "answerIndex": 0, "explanation": "للنصيحة بالنفي نستخدم shouldn't + المصدر؛ فتخطي الإفطار ليس جيدًا.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-391", "question": "You ..................... listen to your coach's advice; it helps you recover.", "choices": ["should", "won't", "shouldn't", "can't"], "answer": "should", "answerIndex": 0, "explanation": "يجب أن تستمع إلى نصيحة مدربك؛ فهي تساعدك على التعافي، والنصيحة الإيجابية تكون بـ should.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-392", "question": "You ..................... eat too much junk food; it is bad for your health.", "choices": ["can", "will", "shouldn't", "should"], "answer": "shouldn't", "answerIndex": 2, "explanation": "أكل الكثير من الطعام غير الصحي مضر بالصحة؛ فالنصيحة هنا بالنفي: shouldn't.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-393", "question": "What happened to Adam before the big race?", "choices": ["He stopped training", "He changed his coach", "He injured his foot during training", "He won the race"], "answer": "He injured his foot during training", "answerIndex": 2, "explanation": "آدم رياضي شاب أصيب في قدمه أثناء التدريب قبل السباق الكبير.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-394", "question": "What did Adam's coach advise him to do?", "choices": ["To change his shoes", "To train harder", "Not to take part in the race", "To run faster"], "answer": "Not to take part in the race", "answerIndex": 2, "explanation": "نصحه مدربه بعدم المشاركة في السباق، واستمع آدم للنصيحة وقرر الراحة حتى يتعافى.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-395", "question": "According to the reading text, what is the first step to make a smart choice?", "choices": ["Consider all your options", "Ask your friends", "Ignore the consequences", "Think about the past"], "answer": "Consider all your options", "answerIndex": 0, "explanation": "خطوات الاختيار الذكي في القطعة: أولًا فكّر في كل خياراتك، ثم فكّر في النتائج المحتملة لكل خيار، وركّز على الأهم لمستقبلك.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-396", "question": "In the text, the word 'lead to' means .....................", "choices": ["finish", "choose", "like", "cause"], "answer": "cause", "answerIndex": 3, "explanation": "lead to تعني يؤدي إلى؛ أي يسبب، كما في: الاختيار الذكي قد يؤدي إلى نتائج جيدة.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-397", "question": "In the text, the pronoun 'they' in 'they have consequences' refers to .....................", "choices": ["smart choices", "lives", "possible consequences", "options"], "answer": "smart choices", "answerIndex": 0, "explanation": "الضمير they في جملة «they have consequences» يعود على smart choices؛ أي أن الاختيارات الذكية لها نتائج.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-398", "question": "Why did Khaled stop eating junk food last month?", "choices": ["Because he moved to a new school", "Because junk food is bad for his health", "Because his coach told him to", "Because he won a prize"], "answer": "Because junk food is bad for his health", "answerIndex": 1, "explanation": "قال خالد في الحوار إنه توقف عن أكل الطعام غير الصحي لأن الطعام غير الصحي مضر بصحته، وأصبح يشعر بتحسن كبير.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-399", "question": "What did the Dream Team decide to build for the Invention Fair?", "choices": ["A water-saving machine", "A robot", "A new school", "A magic box"], "answer": "A water-saving machine", "answerIndex": 0, "explanation": "قرر فريق الأحلام (سارة وعمر وليلي وكريم) بناء آلة لتوفير المياه لمعرض الاختراعات.", "type": "mcq", "topic": "", "source": "https://ekhtebaraty.com/english-middle1-unit4-smart-choices.html"}, {"grade": 7, "subject": "اللغة الإنجليزية", "id": "h26-g7-400", "question": "Why didn't the Dream Team feel sad when they didn't win first prize?", "choices": ["Because they learned cooperation, fairness and empathy", "Because they didn't like the fair", "Because they won another prize", "Because the machine was broken"], "answer": "Because they learned cooperation, fairness and empathy", "answerIndex": 0, "explanation": "لم يشعر الفريق بالفشل رغم عدم الفوز؛ لأنهم تعلموا التعاون والعدل والتعاطف واحترام الأفكار، وهذه القيم أهم من الكأس وحدها.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2678/"}, {"grade": 7, "subject": "القرآن", "id": "h26-g7-401", "question": "يبدأ مقرر شهر ديسمبر من سورة يونس عند الآية ......", "choices": ["26", "27", "109", "25"], "answer": "26", "answerIndex": 0, "explanation": "يبدأ مقرر شهر ديسمبر من سورة يونس عند الآية 26: ﴿لِلَّذِينَ أَحْسَنُوا الْحُسْنَىٰ وَزِيَادَةٌ﴾، حسب توزيع قطاع المعاهد الأزهرية للعام الدراسي 2026/2027.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid02PK8z49owevLuNBcitU3ByP7g9SHG3x3eDRNnFNfpAJQttwpWjETTC2XLZJ6sPTQLl&id=61593522933193"}, {"grade": 7, "subject": "القرآن", "id": "h26-g7-402", "question": "ينتهي مقرر الترم الأول من الحفظ عند الآية ...... من سورة يونس", "choices": ["108", "100", "66", "109"], "answer": "109", "answerIndex": 3, "explanation": "ينتهي مقرر الترم الأول من الحفظ عند الآية 109 وهي آخر آيات سورة يونس: ﴿وَاتَّبِعْ مَا يُوحَىٰ إِلَيْكَ وَاصْبِرْ حَتَّىٰ يَحْكُمَ اللَّهُ ۚ وَهُوَ خَيْرُ الْحَاكِمِينَ﴾، حسب توزيع قطاع المعاهد الأزهرية للعام الدراسي 2026/2027.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid02PK8z49owevLuNBcitU3ByP7g9SHG3x3eDRNnFNfpAJQttwpWjETTC2XLZJ6sPTQLl&id=61593522933193"}, {"grade": 7, "subject": "القرآن", "id": "h26-g7-403", "question": "كم عدد آيات مقرر شهر ديسمبر من سورة يونس (من الآية 26 إلى آخر السورة)؟", "choices": ["83 آية", "84 آية", "109 آيات", "66 آية"], "answer": "84 آية", "answerIndex": 1, "explanation": "مقرر شهر ديسمبر من سورة يونس من الآية 26 إلى الآية 109، أي 84 آية (109 − 26 + 1).", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid02PK8z49owevLuNBcitU3ByP7g9SHG3x3eDRNnFNfpAJQttwpWjETTC2XLZJ6sPTQLl&id=61593522933193"}, {"grade": 7, "subject": "القرآن", "id": "h26-g7-404", "question": "في أي جزء من القرآن الكريم تقع سورة يونس كاملة؟", "choices": ["الجزء الحادي عشر", "الجزء العاشر", "الجزء الثالث عشر", "الجزء الثاني عشر"], "answer": "الجزء الحادي عشر", "answerIndex": 0, "explanation": "سورة يونس كلها في الجزء الحادي عشر؛ آياتها من 1 إلى 109 كلها في الجزء 11.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/surah/10/quran-simple"}, {"grade": 7, "subject": "القرآن", "id": "h26-g7-405", "question": "سُميت سورة يونس بهذا الاسم لأنها ذكرت قصة نبي الله ......", "choices": ["هود عليه السلام مع قوم عاد", "موسى عليه السلام مع فرعون", "يونس عليه السلام مع قومه", "يوسف عليه السلام مع إخوته"], "answer": "يونس عليه السلام مع قومه", "answerIndex": 2, "explanation": "سُميت سورة يونس بهذا الاسم لورود قصة يونس عليه السلام مع قومه فيها، قال تعالى في الآية 98: ﴿إِلَّا قَوْمَ يُونُسَ لَمَّا آمَنُوا كَشَفْنَا عَنْهُمْ عَذَابَ الْخِزْيِ فِي الْحَيَاةِ الدُّنْيَا وَمَتَّعْنَاهُمْ إِلَىٰ حِينٍ﴾.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/surah/10/quran-simple"}, {"grade": 7, "subject": "القرآن", "id": "h26-g7-406", "question": "أكمل الآية من سورة يونس (الآية 26): ﴿لِلَّذِينَ أَحْسَنُوا الْحُسْنَىٰ وَزِيَادَةٌ ۖ وَلَا يَرْهَقُ وُجُوهَهُمْ قَتَرٌ وَلَا ذِلَّةٌ ۚ أُولَٰئِكَ أَصْحَابُ الْجَنَّةِ ۖ هُمْ فِيهَا ......﴾", "choices": ["الْمُفْسِدِينَ", "الْخَاسِرِينَ", "الظَّالِمِينَ", "خَالِدُونَ"], "answer": "خَالِدُونَ", "answerIndex": 3, "explanation": "قال تعالى في الآية 26 من سورة يونس: ﴿لِلَّذِينَ أَحْسَنُوا الْحُسْنَىٰ وَزِيَادَةٌ ۖ وَلَا يَرْهَقُ وُجُوهَهُمْ قَتَرٌ وَلَا ذِلَّةٌ ۚ أُولَٰئِكَ أَصْحَابُ الْجَنَّةِ ۖ هُمْ فِيهَا خَالِدُونَ﴾.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/surah/10/quran-simple"}, {"grade": 7, "subject": "القرآن", "id": "h26-g7-407", "question": "أكمل الآية من سورة يونس (الآية 27): ﴿وَالَّذِينَ كَسَبُوا السَّيِّئَاتِ جَزَاءُ سَيِّئَةٍ بِمِثْلِهَا وَتَرْهَقُهُمْ ذِلَّةٌ ۖ مَا لَهُمْ مِنَ اللَّهِ مِنْ عَاصِمٍ ۖ كَأَنَّمَا أُغْشِيَتْ وُجُوهُهُمْ قِطَعًا مِنَ اللَّيْلِ ......﴾", "choices": ["عَظِيمًا", "شَدِيدًا", "مُبِينًا", "مُظْلِمًا"], "answer": "مُظْلِمًا", "answerIndex": 3, "explanation": "قال تعالى في الآية 27 من سورة يونس: ﴿وَالَّذِينَ كَسَبُوا السَّيِّئَاتِ جَزَاءُ سَيِّئَةٍ بِمِثْلِهَا وَتَرْهَقُهُمْ ذِلَّةٌ ۖ مَا لَهُمْ مِنَ اللَّهِ مِنْ عَاصِمٍ ۖ كَأَنَّمَا أُغْشِيَتْ وُجُوهُهُمْ قِطَعًا مِنَ اللَّيْلِ مُظْلِمًا ۚ أُولَٰئِكَ أَصْحَابُ الن , "subject": "القرآن", "id": "h26-g7-436", "question": "ما الآية التي تأتي مباشرة بعد قوله تعالى: ﴿لِلَّذِينَ أَحْسَنُوا الْحُسْنَىٰ وَزِيَادَةٌ﴾ (الآية 26 من سورة يونس)؟", "choices": ["فَكَفَىٰ بِاللَّهِ شَهِيدًا", "هُنَالِكَ تَبْلُو كُلُّ نَفْسٍ", "وَالَّذِينَ كَسَبُوا السَّيِّئَاتِ جَزَاءُ سَيِّئَةٍ بِمِثْلِهَا", "وَيَوْمَ نَحْشُرُهُمْ جَمِيعًا"], "answer": "وَالَّذِينَ كَسَبُوا السَّيِّئَاتِ جَزَاءُ سَيِّئَةٍ بِمِثْلِهَا", "answerIndex": 2, "explanation": "بعد الآية 26 تأتي الآية 27: ﴿وَالَّذِينَ كَسَبُوا السَّيِّئَاتِ جَزَاءُ سَيِّئَةٍ بِمِثْلِهَا وَتَرْهَقُهُمْ ذِلَّةٌ ۖ مَا لَهُمْ مِنَ اللَّهِ مِنْ عَاصِمٍ ۖ كَأَنَّمَا أُغْشِيَتْ وُجُوهُهُمْ قِطَعًا مِنَ اللَّيْلِ مُظْلِمًا ۚ أُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ﴾.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/surah/10/quran-simple"}, {"grade": 7, "subject": "القرآن", "id": "h26-g7-437", "question": "ما الآية التي تأتي مباشرة بعد قوله تعالى: ﴿يَا أَيُّهَا النَّاسُ قَدْ جَاءَتْكُمْ مَوْعِظَةٌ مِنْ رَبِّكُمْ وَشِفَاءٌ لِمَا فِي الصُّدُورِ وَهُدًى وَرَحْمَةٌ لِلْمُؤْمِنِينَ﴾ (الآية 57 من سورة يونس)؟", "choices": ["وَمَا ظَنُّ الَّذِينَ يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ", "قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ", "وَمَا تَكُونُ فِي شَأْنٍ", "قُلْ أَرَأَيْتُمْ مَا أَنْزَلَ اللَّهُ لَكُمْ مِنْ رِزْقٍ"], "answer": "قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ", "answerIndex": 1, "explanation": "بعد الآية 57 تأتي الآية 58: ﴿قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا هُوَ خَيْرٌ مِمَّا يَجْمَعُونَ﴾.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/surah/10/quran-simple"}, {"grade": 7, "subject": "القرآن", "id": "h26-g7-438", "question": "ما الآية التي تأتي مباشرة بعد قوله تعالى: ﴿وَاتْلُ عَلَيْهِمْ نَبَأَ نُوحٍ إِذْ قَالَ لِقَوْمِهِ يَا قَوْمِ إِنْ كَانَ كَبُرَ عَلَيْكُمْ مَقَامِي وَتَذْكِيرِي بِآيَاتِ اللَّهِ فَعَلَى اللَّهِ تَوَكَّلْتُ فَأَجْمِعُوا أَمْرَكُمْ وَشُرَكَاءَكُمْ ثُمَّ لَا يَكُنْ أَمْرُكُمْ عَلَيْكُمْ غُمَّةً ثُمَّ اقْضُوا إِلَيَّ
