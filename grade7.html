ود صفة نفسية؟", "choices": ["لأنها مشتركة بين الله وخلقه", "لأنها تدل على الذات نفسها وليست شيئًا غير الذات", "لأنها تدل على نفي نقص عن الله", "لأنها صفة حادثة بعد العدم"], "answer": "لأنها تدل على الذات نفسها وليست شيئًا غير الذات", "answerIndex": 1, "explanation": "صفة الوجود صفة نفسية؛ لأنها تدل على الذات نفسها، وليست شيئًا غير الذات، فهي متحققة في ذاته تعالى أزلًا وأبدًا.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-486", "question": "ما دليل الخلق على وجود الله تعالى؟", "choices": ["وجود المخلوق يدل على أنه خلق نفسه", "المخلوق وُجد من غير شيء", "وجود المخلوق يدل على وجود خالق خلقه", "الخلق لا يدل على شيء"], "answer": "وجود المخلوق يدل على وجود خالق خلقه", "answerIndex": 2, "explanation": "دليل الخلق: وجود المخلوق يدل على وجود خالق خلقه؛ قال تعالى: ﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ أَمْ هُمُ الْخَالِقُونَ﴾ [الطور: 35].", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-487", "question": "ما الآية التي استدل بها الكتاب على دليل الخلق في إثبات وجود الله؟", "choices": ["﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾", "﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾", "﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ أَمْ هُمُ الْخَالِقُونَ﴾", "﴿هُوَ الْأَوَّلُ وَالْآخِرُ﴾"], "answer": "﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ أَمْ هُمُ الْخَالِقُونَ﴾", "answerIndex": 2, "explanation": "استدل الكتاب على دليل الخلق بقوله تعالى: ﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ أَمْ هُمُ الْخَالِقُونَ﴾ [الطور: 35]؛ فكل من راجع نفسه يدرك أنه لم يكن موجودًا ثم وُجد، فلا بد له من خالق عليم حكيم.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-488", "question": "ما دليل النظام الكوني على وجود الله تعالى؟", "choices": ["أن الكون قديم لا خالق له", "إعمال العقل والنظر في النظام المتقن للكون يدل على خالق عالم حكيم يعتني به ويدبر شؤونه", "أن النظام الكوني لا يدل على شيء", "أن الكون وُجد صدفة بلا مدبر"], "answer": "إعمال العقل والنظر في النظام المتقن للكون يدل على خالق عالم حكيم يعتني به ويدبر شؤونه", "answerIndex": 1, "explanation": "دليل النظام الكوني: إعمال العقل والنظر في هذا النظام المتقن الذي اختاره الله تعالى للعالم يدل على وجود خالق عالم حكيم يعتني بهذا العالم ويدبر شؤونه؛ قال تعالى: ﴿إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ﴾ [البقرة: 164].", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-489", "question": "ما دليل الحدوث على وجود الله تعالى؟", "choices": ["العالم حادث وكل حادث لا بد له من محدث فوجب أن للعالم محدثًا وهو الله", "العالم وُجد من غير شيء", "العالم قديم لا أول له", "الحادث يوجد بلا محدث"], "answer": "العالم حادث وكل حادث لا بد له من محدث فوجب أن للعالم محدثًا وهو الله", "answerIndex": 0, "explanation": "دليل الحدوث: هذا العالم حادث؛ لأن كل الكائنات التي يحويها حادثة لكونها متغيرة، والتغير دليل الحدوث، وكل حادث لا بد له من محدث؛ فوجب أن للعالم محدثًا وهو الله تعالى.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-490", "question": "ما الحادث؟", "choices": ["ما لا أول له ولا آخر", "الموجود قبل العدم", "الموجود بعد العدم", "ما لا يقبل الوجود أبدًا"], "answer": "الموجود بعد العدم", "answerIndex": 2, "explanation": "الحادث هو الموجود بعد العدم؛ وكل الكائنات حادثة لأنها متغيرة، والتغير دليل الحدوث.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-491", "question": "ما الصفات السلبية؟", "choices": ["كل صفة حادثة بعد العدم", "كل صفة تدل على إثبات كمال لله", "كل صفة مشتركة بين الله وخلقه", "كل صفة تدل على نفي أمر لا يليق بالله سبحانه وتعالى"], "answer": "كل صفة تدل على نفي أمر لا يليق بالله سبحانه وتعالى", "answerIndex": 3, "explanation": "الصفات السلبية: كل صفة تدل على نفي أمر لا يليق بالله سبحانه وتعالى، وهي خمس صفات: القدم، والبقاء، والقيام بالنفس، والمخالفة للحوادث، والوحدانية.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-492", "question": "ما صفة القدم لله تعالى؟", "choices": ["أن الله سبحانه لا ابتداء لوجوده وأنه لم يسبقه عدم", "أن الله لا يماثل المخلوقات", "أن الله لا انتهاء لوجوده", "أن الله غني عن كل شيء"], "answer": "أن الله سبحانه لا ابتداء لوجوده وأنه لم يسبقه عدم", "answerIndex": 0, "explanation": "صفة القدم: أن الله سبحانه لا ابتداء لوجوده، وأنه لم يسبقه عدم.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-493", "question": "ما الدليل النقلي على صفة القدم؟", "choices": ["قوله تعالى: ﴿كُلُّ مَنْ عَلَيْهَا فَانٍ﴾", "قوله تعالى: ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾", "قوله تعالى: ﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾", "قوله تعالى: ﴿هُوَ الْأَوَّلُ وَالْآخِرُ﴾"], "answer": "قوله تعالى: ﴿هُوَ الْأَوَّلُ وَالْآخِرُ﴾", "answerIndex": 3, "explanation": "يدل على صفة القدم اسمه تعالى «الأول»؛ قال تعالى: ﴿هُوَ الْأَوَّلُ وَالْآخِرُ﴾ [الحديد: 3]، ومعنى «الأول»: الموجود قبل كل شيء، فلا بداية لوجوده.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-494", "question": "ما ضد صفة القدم؟", "choices": ["المماثلة للمخلوقات", "الحدوث وهو الوجود المسبوق بالعدم", "الاحتياج إلى الغير", "الفناء والعدم"], "answer": "الحدوث وهو الوجود المسبوق بالعدم", "answerIndex": 1, "explanation": "ضد القدم: الحدوث، وهو الوجود المسبوق بالعدم، وهو مستحيل على الله تعالى.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-495", "question": "ما صفة البقاء لله تعالى؟", "choices": ["أن الله لا يماثل المخلوقات", "أن الله لا ابتداء لوجوده", "أن الله لا يحتاج إلى موجد", "أن الله سبحانه لا انتهاء لوجوده وأنه لا يلحقه عدم أو موت في المستقبل إلى ما لا نهاية"], "answer": "أن الله سبحانه لا انتهاء لوجوده وأنه لا يلحقه عدم أو موت في المستقبل إلى ما لا نهاية", "answerIndex": 3, "explanation": "صفة البقاء: أن الله سبحانه لا انتهاء لوجوده، وأنه لا يلحقه عدم أو موت في المستقبل إلى ما لا نهاية.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-496", "question": "ما الآية التي تدل على بقاء الله تعالى بعد فناء كل شيء؟", "choices": ["﴿هُوَ الْأَوَّلُ وَالْآخِرُ﴾", "﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾", "﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ﴾", "﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ﴾"], "answer": "﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ﴾", "answerIndex": 3, "explanation": "قال تعالى: ﴿كُلُّ مَنْ عَلَيْهَا فَانٍ﴾ [الرحمن: 26] ﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ﴾ [الرحمن: 27]، وقال تعالى: ﴿كُلُّ شَيْءٍ هَالِكٌ إِلَّا وَجْهَهُ﴾ [القصص: 88]، والمقصود بالوجه: الذات المقدسة العلية.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-497", "question": "ما ضد صفة البقاء؟", "choices": ["الاحتياج", "الحدوث", "المماثلة", "الفناء والعدم"], "answer": "الفناء والعدم", "answerIndex": 3, "explanation": "ضد البقاء: الفناء والعدم، وكلاهما مستحيل على الله تعالى؛ لأن انعدام ذاته مستحيل في الماضي والحاضر والمستقبل لتناقضه مع وجوب الوجود.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-498", "question": "ما صفة المخالفة للحوادث؟", "choices": ["عدم مماثلة الله سبحانه للمخلوقات في الذات والصفات والأفعال", "احتياج الله إلى موجد", "انتهاء وجود الله في المستقبل", "مماثلة الله للمخلوقات في ذاته"], "answer": "عدم مماثلة الله سبحانه للمخلوقات في الذات والصفات والأفعال", "answerIndex": 0, "explanation": "صفة المخالفة للحوادث: عدم مماثلته سبحانه للمخلوقات في الذات والصفات والأفعال؛ فذاته ليست كذوات الخلق، وصفاته ليست كصفات الخلق، وأفعاله ليست كأفعال الخلق.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-499", "question": "ما الدليل النقلي على مخالفة الله تعالى للحوادث؟", "choices": ["قوله تعالى: ﴿كُلُّ مَنْ عَلَيْهَا فَانٍ﴾", "قوله تعالى: ﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ﴾", "قوله تعالى: ﴿هُوَ الْأَوَّلُ وَالْآخِرُ﴾", "قوله تعالى: ﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾"], "answer": "قوله تعالى: ﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾", "answerIndex": 3, "explanation": "قال تعالى: ﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾ [الشورى: 11]؛ والدليل العقلي: أنه تعالى لو لم يكن مخالفًا للمخلوقات في ذاته وصفاته لكان مماثلًا لها فيكون تعالى مخلوقًا، وكونه مخلوقًا باطل؛ لأنه ثبت قدمه، فاستحالت عليه المماثلة ووجبت المخالفة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التوحيد", "id": "h26-g7-500", "question": "ما معنى «اليد» في قوله تعالى: ﴿يَدُ اللَّهِ فَوْقَ أَيْدِيهِمْ﴾؟", "choices": ["النعمة فقط", "القدرة", "الملك فقط", "الجارحة والعضو"], "answer": "القدرة", "answerIndex": 1, "explanation": "ما ورد من نصوص الكتاب والسنة مما قد يوهم المشابهة للمخلوقات لا يؤخذ على ظاهره، وإنما يُفسَّر بمعنى يليق بذاته تعالى وكماله المطلق؛ فمعنى «اليد» في قوله تعالى: ﴿يَدُ اللَّهِ فَوْقَ أَيْدِيهِمْ﴾ [الفتح: 10]: القدرة، أي: قدرة الله فوق قدرتكم؛ ومعنى «الوجه» في ﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ﴾: الذات، ومعنى «الاستواء» في ﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾ [طه: 5]: الاستيلاء والملك، ومعنى «جاء» في ﴿وَجَاءَ رَبُّكَ﴾ [الفجر: 22]: جاء أمر ربك.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-501", "question": "ما الآيات التي يتناولها درس «الداعي إلى الخير ينبغي أن يوافق فعله قوله»؟", "choices": ["سورة البقرة، الآيات 1-3", "سورة آل عمران، الآيات 190-191", "سورة البقرة، الآيات 44-46", "سورة البقرة، الآيات 261-263"], "answer": "سورة البقرة، الآيات 44-46", "answerIndex": 2, "explanation": "يدرس هذا الدرس آيات سورة البقرة من الآية 44 إلى الآية 46، وفيها خطاب الله تعالى لعلماء اليهود الذين كانوا يأمرون غيرهم بالخير وينسون أنفسهم.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-502", "question": "ما معنى «البر» في قوله تعالى ﴿أَتَأْمُرُونَ النَّاسَ بِالْبِرِّ وَتَنْسَوْنَ أَنْفُسَكُم﴾؟", "choices": ["جماع الخير", "الزكاة وحدها", "الصلاة وحدها", "الصيام وحدها"], "answer": "جماع الخير", "answerIndex": 0, "explanation": "البر: جماع الخير، أي كل خير يجمعه الإنسان من طاعة الله تعالى.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-503", "question": "من الذين خاطبهم الله تعالى في قوله ﴿أَتَأْمُرُونَ النَّاسَ بِالْبِرِّ وَتَنْسَوْنَ أَنْفُسَكُمْ وَأَنْتُمْ تَتْلُونَ الْكِتَاب﴾؟", "choices": ["المنافقون في المدينة", "أهل المدينة جميعًا", "علماء اليهود", "مشركو قريش"], "answer": "علماء اليهود", "answerIndex": 2, "explanation": "خاطب الله تبارك وتعالى علماء اليهود، وسألهم سؤال توبيخ وتعجب من شأنهم؛ حيث كانوا يأمرون غيرهم بالخير وينسون أنفسهم، والحال أنهم يتلون الكتاب ويعلمون ما فيه من عقوبة من يقصر.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-504", "question": "بم شبّه الكتاب من يأمر الناس بالخير ولا يفعله هو في نفسه؟", "choices": ["بالقمر المنير الذي يهدي السائرين", "بالشجرة المثمرة التي يأكل الناس منها", "بالمصباح يضيء للناس ويحرق نفسه", "بالنهر الجاري الذي يسقي الزرع"], "answer": "بالمصباح يضيء للناس ويحرق نفسه", "answerIndex": 2, "explanation": "من كان على علم بالكتاب ثم يدعو الناس إليه ولا ينتفع هو بهداياته ولا يلتزم تعاليمه، فهو كالمصباح يضيء للناس ويحرق نفسه، فهو أبعد ما يكون عن حال العقلاء.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-505", "question": "ما معنى «الكتاب» في قوله تعالى ﴿وَأَنْتُمْ تَتْلُونَ الْكِتَاب﴾؟", "choices": ["القرآن الكريم", "الزبور", "الإنجيل", "التوراة"], "answer": "التوراة", "answerIndex": 3, "explanation": "الكتاب هنا: التوراة، وهو الكتاب الذي أنزله الله على موسى عليه السلام، وكان علماء اليهود يتلونه ويعلمون ما فيه.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-506", "question": "ماذا يفيد الاستفهام في قوله تعالى ﴿أَتَأْمُرُونَ النَّاسَ بِالْبِرِّ وَتَنْسَوْنَ أَنْفُسَكُم﴾؟", "choices": ["الترجي", "الاستفسار الحقيقي", "التمني", "التوبيخ"], "answer": "التوبيخ", "answerIndex": 3, "explanation": "الاستفهام في قوله تعالى ﴿أَتَأْمُرُونَ النَّاسَ بِالْبِرِّ وَتَنْسَوْنَ أَنْفُسَكُم﴾ للتوبيخ؛ لأن الله تعالى يوبخ علماء اليهود على أمرهم الناس بالخير ونسيانهم أنفسهم.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-507", "question": "ماذا يفيد الاستفهام في قوله تعالى ﴿أَفَلَا تَعْقِلُون﴾؟", "choices": ["الاستفسار", "التمني", "التوبيخ", "الإنكار عليهم"], "answer": "الإنكار عليهم", "answerIndex": 3, "explanation": "الاستفهام في قوله تعالى ﴿أَفَلَا تَعْقِلُون﴾ للإنكار عليهم؛ أي: كيف تأمرون الناس بالبر وتنسون أنفسكم وأنتم تتلون الكتاب، أفلا تعقلون قبح صنيعكم؟", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-508", "question": "ما معنى «الظن» في قوله تعالى ﴿الَّذِينَ يَظُنُّونَ أَنَّهُمْ مُلَاقُو رَبِّهِمْ وَأَنَّهُمْ إِلَيْهِ رَاجِعُون﴾؟", "choices": ["الجهل والغفلة", "العلم واليقين", "الشك والتردد", "الوهم والتخمين"], "answer": "العلم واليقين", "answerIndex": 1, "explanation": "يظنون هنا بمعنى يعتقدون ويعلمون؛ فالظن هنا بمعنى العلم واليقين، وملاقو ربهم: راجعون إليه يوم القيامة ومعروضون عليه بعد الموت.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-509", "question": "بم أمر الله تعالى عباده أن يستعينوا على مشاق الحياة في قوله ﴿وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاة﴾؟", "choices": ["بالمال والجاه", "بالحيلة والدهاء", "بالكثرة والعدد", "بالصبر والصلاة"], "answer": "بالصبر والصلاة", "answerIndex": 3, "explanation": "أمرهم الله تعالى أن يستعينوا بالصبر والصلاة؛ فالصبر هو الزاد الذي لا بد منه لمواجهة كل مشقة، والصلاة أكبر عون على الثبات في الأمر؛ ولذلك قال تعالى: ﴿وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى الْخَاشِعِين﴾.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-510", "question": "ماذا كان يفعل النبي صلى الله عليه وسلم إذا اشتد عليه أمر من أمور الدنيا؟", "choices": ["يفزع إلى الصلاة", "ينام حتى يزول الهم", "يجمع أصحابه للتشاور فقط", "يخرج إلى السوق"], "answer": "يفزع إلى الصلاة", "answerIndex": 0, "explanation": "كان النبي صلى الله عليه وسلم إذا اشتد عليه أمر فزع إلى الصلاة؛ ليجد فيها الراحة والزاد الذي يعينه على ما يلاقيه من شدائد، وكان يقول لبلال مؤذنه: «أرحنا بها يا بلال».", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-511", "question": "ما الآيات التي يتناولها درس «أجر الصدقة وآدابها»؟", "choices": ["سورة النساء، الآية 1", "سورة آل عمران، الآيات 190-191", "سورة البقرة، الآيات 261-263", "سورة البقرة، الآيات 44-46"], "answer": "سورة البقرة، الآيات 261-263", "answerIndex": 2, "explanation": "يدرس هذا الدرس آيات سورة البقرة من الآية 261 إلى الآية 263، وفيها فضل الإنفاق في سبيل الله وآداب الصدقة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-512", "question": "ما معنى «في سبيل الله» في قوله تعالى ﴿مَثَلُ الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّه﴾؟", "choices": ["في سبيل الشهرة بين الناس", "في سبيل القرابة فقط", "في سبيل التجارة والربح", "طلبًا لمرضاة الله"], "answer": "طلبًا لمرضاة الله", "answerIndex": 3, "explanation": "في سبيل الله: أي طلبًا لمرضاته؛ فالإنفاق المقصود هنا ما كان خالصًا لوجه الله تعالى.", "type": "mcq", "topic": "", "source": "http://shbabbek.com/show/200455"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-513", "question": "بم شبّه الله تعالى المنفقين في سبيله في قوله ﴿مَثَلُ الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّهِ كَمَثَلِ حَبَّةٍ أَنْبَتَتْ سَبْعَ سَنَابِلَ فِي كُلِّ سُنْبُلَةٍ مِائَةُ حَبَّة﴾؟", "choices": ["بنهر جار يسقي الزرع", "بحبة أنبتت سبع سنابل في كل سنبلة مائة حبة", "بشجرة واحدة مثمرة", "بجبل من ذهب"], "answer": "بحبة أنبتت سبع سنابل في كل سنبلة مائة حبة", "answerIndex": 1, "explanation": "شبّه الله المنفقين في سبيله بالحبة التي أنبتت سبع سنابل، في كل سنبلة مائة حبة، أي سبعمائة ضعف؛ وهذا تصوير وتمثيل للإضعاف والإضافة في الزيادة والأجر.", "type": "mcq", "topic": "", "source": "http://shbabbek.com/show/200455"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-514", "question": "ما معنى «المنّ» في قوله تعالى ﴿ثُمَّ لَا يُتْبِعُونَ مَا أَنْفَقُوا مَنًّا وَلَا أَذًى﴾؟", "choices": ["أن ينفق علانية لا سرًّا", "أن ينفق سرًّا لا علانية", "أن يتصدق بالقليل من ماله", "أن يذكر المحسن إحسانه لمن أحسن إليه"], "answer": "أن يذكر المحسن إحسانه لمن أحسن إليه", "answerIndex": 3, "explanation": "المنّ: أن يذكر المحسن إحسانه لمن أحسن إليه، فيمنّ عليه بما أعطاه؛ وهو مما يبطل ثواب الصدقة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-515", "question": "ما معنى «الأذى» في قوله تعالى ﴿ثُمَّ لَا يُتْبِعُونَ مَا أَنْفَقُوا مَنًّا وَلَا أَذًى﴾؟", "choices": ["أن يتحدث المتصدق للناس عن إحسانه إلى الفقير تشهيرًا به", "أن يمنع الصدقة أصلًا", "أن يسأل الفقير عن حاجته", "أن يتصدق بمال حرام"], "answer": "أن يتحدث المتصدق للناس عن إحسانه إلى الفقير تشهيرًا به", "answerIndex": 0, "explanation": "الأذى: أن يتحدث المتصدق للناس عن إحسانه إلى الفقير تشهيرًا به، أو أن يعيّره بإحسانه إليه؛ والصدقة التي يتبعها أذى لا تثمر الثمرة المرجوة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-516", "question": "ما معنى «قول معروف» في قوله تعالى ﴿قَوْلٌ مَعْرُوفٌ وَمَغْفِرَةٌ خَيْرٌ مِنْ صَدَقَةٍ يَتْبَعُهَا أَذًى﴾؟", "choices": ["الوعد بالصدقة ثم إخلاف الوعد", "قول طيب جميل للفقير مثل أن يدعو له", "السكوت عن الفقير وتجاهله", "قول فيه منّ وتعيير للفقير"], "answer": "قول طيب جميل للفقير مثل أن يدعو له", "answerIndex": 1, "explanation": "قول معروف: قول طيب جميل للفقير، مثل أن يدعو له، ومغفرة: أن يغفر للسائل إلحاحه في السؤال، ويستر عليه فقره واحتياجه؛ فالقول بالمعروف والمغفرة خير عند الله من الصدقة التي يتبعها أذى.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-517", "question": "لماذا ختمت الآية الأولى بقوله تعالى ﴿وَاللَّهُ وَاسِعٌ عَلِيم﴾؟", "choices": ["للدلالة على شدة عذابه", "للدلالة على عظيم فضله وأنه يكافئ المخلصين ويضاعف أجورهم", "لبيان عدد السنابل في التشبيه", "لبيان وجوب الزكاة على الأغنياء"], "answer": "للدلالة على عظيم فضله وأنه يكافئ المخلصين ويضاعف أجورهم", "answerIndex": 1, "explanation": "ختمت الآية الأولى بقوله تعالى ﴿وَاللَّهُ وَاسِعٌ عَلِيم﴾ للدلالة على عظيم فضله سبحانه؛ فهو واسع الفضل، الغني الكريم، العليم بكل شيء، يكافئ المخلصين على عملهم ويضاعف أجورهم أضعافًا لا تُحصى.", "type": "mcq", "topic": "", "source": "http://shbabbek.com/show/200455"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-518", "question": "ما الحكمة من الإنفاق والبذل كما بينها الكتاب؟", "choices": ["إظهار الغنى أمام الناس", "طلب الثناء من الفقراء", "التخلص من المال الزائد", "تهذيب النفوس وربط الغني والفقير برباط الحب في الله"], "answer": "تهذيب النفوس وربط الغني والفقير برباط الحب في الله", "answerIndex": 3, "explanation": "الحكمة من الإنفاق والبذل هي تهذيب النفوس وربط الغني والفقير برباط الحب في الله؛ فالقول بالمعروف والمغفرة يؤديان الوظيفة الأولى للصدقة وهي تهذيب النفوس وتأليف القلوب.", "type": "mcq", "topic": "", "source": "http://shbabbek.com/show/200455"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-519", "question": "ما حال أهل الطاعة يوم القيامة كما في قوله تعالى ﴿لَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُون﴾؟", "choices": ["يُحاسبون حسابًا عسيرًا", "يُمنعون من الجنة", "يخافون ويحزنون", "لا خوف عليهم ولا هم يحزنون"], "answer": "لا خوف عليهم ولا هم يحزنون", "answerIndex": 3, "explanation": "من التزم آداب الصدقة فاز بالأجر العظيم في الآخرة؛ فأهل الطاعة آمنون فرحون يوم القيامة، فلا يخافون إذا خاف الناس، ولا يحزنون إذا حزن الناس.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-520", "question": "ما الآيات التي يتناولها درس «دلائل قدرة الله تعالى في خلقه»؟", "choices": ["سورة آل عمران، الآيتان 190-191", "سورة النساء، الآية 1", "سورة المائدة، الآية 8", "سورة البقرة، الآيات 261-263"], "answer": "سورة آل عمران، الآيتان 190-191", "answerIndex": 0, "explanation": "يدرس هذا الدرس آيتي سورة آل عمران 190 و191، وفيهما دعوة إلى التأمل والتفكر في بديع صنع الله في الكون.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-521", "question": "ما معنى «الخلق» في قوله تعالى ﴿إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ لِأُولِي الْأَلْبَاب﴾؟", "choices": ["هدم الكائنات وإفناؤها", "جمع الكائنات بلا نظام", "تقدير الكائنات وترتيبها بنظام وإتقان", "ترك الكائنات بلا تدبير"], "answer": "تقدير الكائنات وترتيبها بنظام وإتقان", "answerIndex": 2, "explanation": "الخلق: تقدير الكائنات وترتيبها بنظام وإتقان؛ فهذا الكون البديع، وهذه السماء وارتفاعها بغير عمد، وهذه الأرض واتساعها وما فيها، كل ذلك يدل على أن لهذا الكون ربًّا يدبر أموره.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-522", "question": "ما معنى «الألباب» في قوله تعالى ﴿لَآيَاتٍ لِأُولِي الْأَلْبَاب﴾؟", "choices": ["الأموال", "القلوب", "العقول", "الأجساد"], "answer": "العقول", "answerIndex": 2, "explanation": "الألباب: جمع لبّ، وهو العقل؛ فهذه الآيات أدلة قاطعة وبراهين ساطعة ينتفع بها أصحاب العقول الذكية المستنيرة، وليسوا كأصحاب العقول المريضة الذين يشاهدون آيات الله ويمرون عليها وهم عنها معرضون.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-523", "question": "ما معنى «باطلًا» في قول أولي الألباب ﴿رَبَّنَا مَا خَلَقْتَ هَٰذَا بَاطِلًا سُبْحَانَكَ فَقِنَا عَذَابَ النَّار﴾؟", "choices": ["حقًّا وصدقًا", "سرًّا خفيًّا", "عبثًا لا فائدة منه", "جزاءً وعقابًا"], "answer": "عبثًا لا فائدة منه", "answerIndex": 2, "explanation": "باطلًا: عبثًا لا فائدة منه ولا نتيجة تترتب عليه؛ فهذا الكون بما فيه لم يخلقه الله سبحانه وتعالى عبثًا، بل لا بد لهذا الخلق من نهاية، يأخذ المطيع والعاصي فيها جزاءه.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-524", "question": "على ماذا يدل اختلاف الليل والنهار في الطول والقصر صيفًا وشتاءً؟", "choices": ["على أن الليل والنهار لا نظام لهما", "على أن لهذا الكون ربًّا يدبر أموره ويتصرف في شؤونه", "على أن الشمس تتحكم في القمر", "على أن الكون وُجد صدفة بلا خالق"], "answer": "على أن لهذا الكون ربًّا يدبر أموره ويتصرف في شؤونه", "answerIndex": 1, "explanation": "هذا الاختلاف القائم بين الليل والنهار في الطول والقصر، حيث يطول النهار ويقصر الليل صيفًا، ويطول الليل ويقصر النهار شتاءً، كل هذا يدل على أن لهذا الكون ربًّا يدبر أموره ويتصرف في شؤونه.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-525", "question": "ماذا يفيد التنكير في قوله تعالى ﴿لَآيَات﴾؟", "choices": ["التحديد والتقييد", "التفخيم؛ أي لآيات عظيمة كثيرة", "التقليل والتحقير", "النفي والإنكار"], "answer": "التفخيم؛ أي لآيات عظيمة كثيرة", "answerIndex": 1, "explanation": "التنكير في قوله تعالى ﴿لَآيَات﴾ للتفخيم؛ أي: لآيات عظيمة كثيرة، شاهدة على وجود الله وقدرته وعلمه وحكمته.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-526", "question": "ما حالات الإنسان الثلاث التي جمعها قوله تعالى ﴿يَذْكُرُونَ اللَّهَ قِيَامًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِم﴾؟", "choices": ["القيام والقعود والاضطجاع على الجنب", "القيام والركوع والسجود", "النوم واليقظة والمشي", "الصلاة والصيام والزكاة"], "answer": "القيام والقعود والاضطجاع على الجنب", "answerIndex": 0, "explanation": "جمع قوله تعالى ﴿يَذْكُرُونَ اللَّهَ قِيَامًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِم﴾ حالات الإنسان الثلاث في الصلاة والذكر، وهي: القيام والقعود والاضطجاع على الجنب؛ فذكر الله تعالى يكون على أي جهة وفي كل حال.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-527", "question": "ماذا قال النبي صلى الله عليه وسلم فيمن قرأ هاتين الآيتين ولم يتفكر فيهما؟", "choices": ["«ويل لمن قرأها ولم يتفكر فيها»", "«غفر الله لمن قرأها ولم يتفكر فيها»", "«طوبى لمن قرأها ولم يتفكر فيها»", "«كفاه الله شرها من قرأها»"], "answer": "«ويل لمن قرأها ولم يتفكر فيها»", "answerIndex": 0, "explanation": "رأى بلال رسول الله صلى الله عليه وسلم يبكي بكاءً شديدًا بعد أن نزلت عليه هاتان الآيتان، فقال له: يا رسول الله أتبكي وقد غفر الله لك ما تقدم من ذنبك وما تأخر؟ فقال: يا بلال، أفلا أكون عبدًا شكورًا! ثم قال: «ويل لمن قرأها ولم يتفكر فيها».", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-528", "question": "ما الدروس المستفادة من آيتي آل عمران 190-191؟", "choices": ["التفكر في الكون من صفات أهل الغفلة", "التفكر في الكون من صفات أصحاب العقول الذكية", "الكون وُجد بلا خالق ولا مدبر", "ذكر الله مقصور على الصلاة فقط"], "answer": "التفكر في الكون من صفات أصحاب العقول الذكية", "answerIndex": 1, "explanation": "من الدروس المستفادة: إبداع هذا الكون وانتظامه دليل على وجود الله وقدرته؛ والتفكر في الكون من صفات أصحاب العقول؛ وذكر الله تعالى يكون على أي جهة وفي كل حال؛ ولهذه الحياة نهاية يُجازى فيها المحسن والمسيء.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-529", "question": "ما الآية التي يتناولها درس «المساواة بين الناس في الخلق»؟", "choices": ["سورة المائدة، الآية 8", "سورة آل عمران، الآية 190", "سورة البقرة، الآية 44", "سورة النساء، الآية 1"], "answer": "سورة النساء، الآية 1", "answerIndex": 3, "explanation": "يدرس هذا الدرس آية سورة النساء الأولى، وفيها خطاب الله تعالى للناس جميعًا على اختلاف أزمانهم وأماكنهم وألوانهم، بأنهم جميعًا متساوون في الأصل والنشأة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-530", "question": "ما معنى «من نفس واحدة» في قوله تعالى ﴿خَلَقَكُمْ مِنْ نَفْسٍ وَاحِدَةٍ وَخَلَقَ مِنْهَا زَوْجَهَا﴾؟", "choices": ["من ماء مهين", "من نور واحد", "من شخص واحد وهو آدم عليه السلام", "من تراب الأرض مباشرة"], "answer": "من شخص واحد وهو آدم عليه السلام", "answerIndex": 2, "explanation": "من نفس واحدة: من شخص واحد، وهو آدم عليه السلام؛ فالناس جميعًا على اختلاف أزمانهم وأماكنهم وألوانهم خلقهم الله من جنس واحد وأصل واحد، فهم متساوون في الأصل والنسب.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-531", "question": "من «زوجها» التي خلقها الله من النفس الواحدة في قوله ﴿وَخَلَقَ مِنْهَا زَوْجَهَا﴾؟", "choices": ["خديجة رضي الله عنها", "حواء", "مريم", "آسية"], "answer": "حواء", "answerIndex": 1, "explanation": "خلق الله من النفس الواحدة زوجها حواء، وفي هذا تقرير لكرامة المرأة وقيمتها؛ فقد خُلقت هي والرجل من نفس واحدة، فهما سواء لا يفترقان.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-532", "question": "ما معنى «وبث منهما» في قوله تعالى ﴿وَبَثَّ مِنْهُمَا رِجَالًا كَثِيرًا وَنِسَاء﴾؟", "choices": ["فرّق وشتت بلا نظام", "أخفى وستر", "نشر؛ أي انتشروا في الأرض فسكنوها وعمروها", "جمع وحبس"], "answer": "نشر؛ أي انتشروا في الأرض فسكنوها وعمروها", "answerIndex": 2, "explanation": "وبث منهما: نشر؛ أي ذكورًا وإناثًا انتشروا في الأرض فسكنوها وعمروها؛ فالناس جميعًا متساوون في الأصل والنشأة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-533", "question": "ما معنى «الأرحام» في قوله تعالى ﴿وَاتَّقُوا اللَّهَ الَّذِي تَسَاءَلُونَ بِهِ وَالْأَرْحَام﴾؟", "choices": ["القرابة من جهة الأب أو الأم", "الجيران والأصدقاء", "الأموال والأولاد", "المساجد والمدارس"], "answer": "القرابة من جهة الأب أو الأم", "answerIndex": 0, "explanation": "الأرحام: جمع رحم، وهي القرابة من جهة الأب أو الأم؛ فاتقوا الأرحام: لا تقطعوها، بل أحسنوا إلى أقاربكم من جهة الأب أو الأم، وعاونوهم في كل ما يحتاجون إليه؛ فهذا يقوي أواصر المحبة بينكم.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-534", "question": "ماذا يفيد النداء في قوله تعالى ﴿يَا أَيُّهَا النَّاس﴾؟", "choices": ["التمني", "تنبيه المخاطبين ولفت أنظارهم", "التوبيخ", "الاستخفاف"], "answer": "تنبيه المخاطبين ولفت أنظارهم", "answerIndex": 1, "explanation": "النداء في قوله تعالى ﴿يَا أَيُّهَا النَّاس﴾ لتنبيه المخاطبين ولفت أنظارهم؛ لأن الخطاب موجه إلى الناس جميعًا على اختلاف أزمانهم وأماكنهم وألوانهم.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-535", "question": "على ماذا يدل خلق حواء من نفس آدم عليه السلام؟", "choices": ["على أن المرأة أقل من الرجل", "على أن الرجل لا يحتاج إلى المرأة", "على أن المرأة خُلقت للخدمة فقط", "على كرامة المرأة وقيمتها وأنها والرجل سواء"], "answer": "على كرامة المرأة وقيمتها وأنها والرجل سواء", "answerIndex": 3, "explanation": "خلق الله حواء من نفس آدم عليه السلام، وفي هذا تقرير لكرامة المرأة وقيمتها؛ فقد خُلقت هي والرجل من نفس واحدة، فهما سواء لا يفترقان.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-536", "question": "ما معنى «رقيبًا» في ختام الآية ﴿إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا﴾؟", "choices": ["ناسيًا لأعمالكم", "حافظًا لأعمالكم، الرقيب على خلقه العليم بأحوالهم", "بعيدًا عن خلقه", "غافلًا عن أعمالكم"], "answer": "حافظًا لأعمالكم، الرقيب على خلقه العليم بأحوالهم", "answerIndex": 1, "explanation": "ختم الله سبحانه وتعالى الآية بقوله ﴿إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا﴾؛ ليبين أنه الرقيب على خلقه، العليم بأحوالهم، وهو الذي سيجازيهم على أعمالهم.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-537", "question": "ما الآية التي يتناولها درس «آداب التحية في الإسلام»؟", "choices": ["سورة النساء، الآية 1", "سورة البقرة، الآية 44", "سورة النساء، الآية 86", "سورة المائدة، الآية 8"], "answer": "سورة النساء، الآية 86", "answerIndex": 2, "explanation": "يدرس هذا الدرس آية سورة النساء 86، وفيها يعلمنا الله سبحانه وتعالى نوعًا من آداب الإسلام وهو أدب التحية.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-538", "question": "ما معنى «التحية» في قوله تعالى ﴿وَإِذَا حُيِّيتُمْ بِتَحِيَّةٍ فَحَيُّوا بِأَحْسَنَ مِنْهَا أَوْ رُدُّوهَا﴾؟", "choices": ["أن يهدي المسلم هدية لمن يلقاه", "أن يدعو المسلم لمن يلقاه سرًّا", "أن يلقي المسلم السلام على من يلقاه، وهي: السلام عليكم ورحمة الله وبركاته", "أن يصافح المسلم من يلقاه فقط"], "answer": "أن يلقي المسلم السلام على من يلقاه، وهي: السلام عليكم ورحمة الله وبركاته", "answerIndex": 2, "explanation": "التحية: أن يلقي المسلم السلام على من يلقاه، وهي: السلام عليكم ورحمة الله وبركاته؛ وهذه التحية إشارة إلى أن الدين الإسلامي دين تعارف وإخاء وسلام.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-539", "question": "ما حكم رد التحية في الإسلام؟", "choices": ["واجب؛ إما بمثلها أو بأحسن منها", "مباح", "سنة فقط", "مكروه"], "answer": "واجب؛ إما بمثلها أو بأحسن منها", "answerIndex": 0, "explanation": "رد التحية واجب؛ إما بمثلها أو بأحسن منها؛ فمتى حيّانا أحد الناس بتحية وجب علينا أن نرد عليه بتحية مثلها أو بأحسن منها، والأفضل أن يردها بأحسن منها.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-540", "question": "ما حكم البدء بالسلام في الإسلام؟", "choices": ["سنة مؤكدة", "واجب", "محرم", "مباح"], "answer": "سنة مؤكدة", "answerIndex": 0, "explanation": "البدء بالسلام سنة مؤكدة، ورده واجب إما بمثله أو بأحسن منه؛ ونشر السلام بين الناس يحقق المحبة بينهم، وقد علق النبي صلى الله عليه وسلم دخول الجنة على الإيمان، وعلق الإيمان على المحبة، وعلق المحبة على نشر السلام.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-541", "question": "كم حسنة لمن قال «السلام عليكم» كاملة كما في حديث التحية؟", "choices": ["عشر حسنات", "مائة حسنة", "حسنة واحدة", "خمس حسنات"], "answer": "عشر حسنات", "answerIndex": 0, "explanation": "جاء رجل إلى النبي صلى الله عليه وسلم فقال: «السلام عليكم»، فرد عليه ثم جلس فقال: «عشر»؛ ثم جاء آخر فقال: السلام عليكم ورحمة الله، فرد عليه ثم جلس فقال: «عشرون»؛ ثم جاء آخر فقال: السلام عليكم ورحمة الله وبركاته، فرد عليه ثم جلس فقال: «ثلاثون».", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-542", "question": "كم حسنة لمن قال «السلام عليكم ورحمة الله وبركاته» كاملة؟", "choices": ["ثلاثون حسنة", "عشر حسنات", "عشرون حسنة", "خمسون حسنة"], "answer": "ثلاثون حسنة", "answerIndex": 0, "explanation": "الرد بأحسن منها قد يكون بزيادة الألفاظ: فمن قال «السلام عليكم» فله عشر حسنات، ومن زاد «ورحمة الله» فله عشرون، ومن زاد «وبركاته» فله ثلاثون حسنة؛ وقد يكون الرد بأحسن منها بزيادة معنوية كالبشاشة وحسن الاستقبال.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-543", "question": "أي مما يلي من آداب التحية كما في الدرس؟", "choices": ["يسلم الصغير على الكبير فقط", "يسلم الكبير على الصغير، والراكب على الماشي، والماشي على القاعد، والقليل على الكثير", "يسلم الماشي على الراكب", "يسلم القاعد على الماشي"], "answer": "يسلم الكبير على الصغير، والراكب على الماشي، والماشي على القاعد، والقليل على الكثير", "answerIndex": 1, "explanation": "من آداب التحية أن يسلم الكبير على الصغير، والراكب على الماشي، والماشي على القاعد، والقليل على الكثير.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-544", "question": "ما الآية التي يتناولها درس «العدل في الشهادة»؟", "choices": ["سورة المائدة، الآية 8", "سورة النساء، الآية 86", "سورة البقرة، الآية 44", "سورة آل عمران، الآية 190"], "answer": "سورة المائدة، الآية 8", "answerIndex": 0, "explanation": "يدرس هذا الدرس آية سورة المائدة 8، وفيها يأمر الله تعالى عباده المؤمنين أن يكونوا قوامين بالحق دائمًا لله، وأن يؤدوا الشهادة على وجهها الصحيح بالعدل.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-545", "question": "ما معنى «قوامين لله» في قوله تعالى ﴿كُونُوا قَوَّامِينَ لِلَّهِ شُهَدَاءَ بِالْقِسْط﴾؟", "choices": ["قائمين بالحق دائمًا لله", "متحيزين للأقارب", "قائمين بالحق لأجل الناس", "ساكتين عن الحق"], "answer": "قائمين بالحق دائمًا لله", "answerIndex": 0, "explanation": "قوامين لله: قائمين بالحق دائمًا لله، لا لأجل الناس؛ فالله تعالى يأمر عباده المؤمنين أن يكونوا قوامين بالحق دائمًا لله، وأن يؤدوا الشهادة على وجهها الصحيح.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-546", "question": "ما معنى «شهداء بالقسط» في الآية؟", "choices": ["شهداء بالقرابة", "شهداء بالعدل", "شهداء بالظلم", "شهداء بالهوى"], "answer": "شهداء بالعدل", "answerIndex": 1, "explanation": "شهداء بالقسط: أي بالعدل؛ فالشهادة يجب أن تُؤدى على وجهها الصحيح، دون محاباة أو مجاملة أو مراعاة لقرابة أو صداقة أو سمعة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-547", "question": "ما معنى «شنآن» في قوله تعالى ﴿وَلَا يَجْرِمَنَّكُمْ شَنَآنُ قَوْمٍ عَلَىٰ أَلَّا تَعْدِلُوا﴾؟", "choices": ["جهل ونسيان", "حب ومودة", "خوف ورهبة", "بغض وعداوة"], "answer": "بغض وعداوة", "answerIndex": 3, "explanation": "شنآن: بغض وعداوة؛ فلا يحملنكم بغض قوم على ترك العدل معهم، بل اعدلوا مع الصديق والعدو؛ لأن العدل أقرب للتقوى.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-548", "question": "ما معنى «لا يجرمنكم» في قوله تعالى ﴿وَلَا يَجْرِمَنَّكُمْ شَنَآنُ قَوْمٍ عَلَىٰ أَلَّا تَعْدِلُوا﴾؟", "choices": ["لا يأمرنكم", "لا ينجينكم", "لا يحملنكم", "لا يمنعنكم من الخير مطلقًا"], "answer": "لا يحملنكم", "answerIndex": 2, "explanation": "لا يجرمنكم: لا يحملنكم؛ أي لا يحملنكم بغض قوم على ترك العدل معهم، بل اعدلوا مع الصديق والعدو؛ لأن العدل أقرب للتقوى.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-549", "question": "لماذا كرر الله تعالى الأمر بالعدل في الآية؟", "choices": ["لأنه خاص بالأعداء فقط", "للتخفيف من شأنه", "لأنه أمر اختياري", "للتأكيد عليه والتشويق إليه"], "answer": "للتأكيد عليه والتشويق إليه", "answerIndex": 3, "explanation": "كرر الله الأمر بالعدل في الآية للتأكيد عليه والتشويق إليه؛ فأمر أولًا بقوله ﴿كُونُوا قَوَّامِينَ لِلَّهِ شُهَدَاءَ بِالْقِسْط﴾، ثم أمر ثانيًا بقوله ﴿اعْدِلُوا هُوَ أَقْرَبُ لِلتَّقْوَى﴾.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "التفسير", "id": "h26-g7-550", "question": "ما العلاقة بين العدل والتقوى كما في قوله تعالى ﴿اعْدِلُوا هُوَ أَقْرَبُ لِلتَّقْوَى﴾؟", "choices": ["التقوى تكون بلا عدل", "العدل خاص بالمؤمنين فقط", "العدل بعيد عن التقوى", "العدل أقرب الطرق الموصلة إلى تقوى الله"], "answer": "العدل أقرب الطرق الموصلة إلى تقوى الله", "answerIndex": 3, "explanation": "العدل أقرب الطرق الموصلة إلى تقوى الله عز وجل؛ ثم أمر سبحانه بالتقوى، فقال: ﴿وَاتَّقُوا اللَّهَ ۚ إِنَّ اللَّهَ خَبِيرٌ بِمَا تَعْمَلُون﴾، وحذر من مخالفة أوامره؛ لأنه عليم بكل أحوال عباده وسيجازيهم عليها.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-551", "question": "كم عدد أركان الإسلام التي بُني عليها دين الإسلام كما في الحديث؟", "choices": ["ثلاثة", "ستة", "خمسة", "أربعة"], "answer": "خمسة", "answerIndex": 2, "explanation": "بُني الإسلام على خمسة أركان، كما قال النبي صلى الله عليه وسلم: «بني الإسلام على خمس: شهادة أن لا إله إلا الله وأن محمدا رسول الله، وإقام الصلاة، وإيتاء الزكاة، والحج، وصوم رمضان».", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-552", "question": "أكمل حديث أركان الإسلام: «بني الإسلام على خمس: شهادة أن لا إله إلا الله وأن محمدا رسول الله، وإقام الصلاة، وإيتاء الزكاة»", "choices": ["والحج، وصوم رمضان", "والأمر بالمعروف، والنهي عن المنكر", "والجهاد، وبر الوالدين", "وصلة الرحم، وحسن الخلق"], "answer": "والحج، وصوم رمضان", "answerIndex": 0, "explanation": "تتمة الحديث: «والحج، وصوم رمضان»؛ فأركان الإسلام الخمسة هي: الشهادتان، وإقام الصلاة، وإيتاء الزكاة، والحج، وصوم رمضان.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-553", "question": "ما أهم أركان الإسلام كما في الدرس؟", "choices": ["ركن الزكاة", "ركن الصوم", "ركن الشهادتين", "ركن الصلاة"], "answer": "ركن الشهادتين", "answerIndex": 2, "explanation": "أهم أركان الإسلام هو ركن الشهادتين: شهادة أن لا إله إلا الله وأن محمدا رسول الله؛ فلا يكون المرء مسلما إلا إذا نطق بهاتين الشهادتين بقلبه ولسانه.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-554", "question": "ما معنى «إقام الصلاة» في حديث أركان الإسلام؟", "choices": ["الاكتفاء بصلاة الفجر", "تأخيرها عن وقتها", "أداؤها كاملة في أوقاتها", "أداؤها في جماعة فقط"], "answer": "أداؤها كاملة في أوقاتها", "answerIndex": 2, "explanation": "إقام الصلاة: أداؤها كاملة في أوقاتها بخشوع وسكينة وطمأنينة، مع مراعاة أركانها وشروطها.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-555", "question": "من راوي حديث أركان الإسلام؟", "choices": ["أنس بن مالك رضي الله عنه", "جابر بن عبد الله رضي الله عنهما", "أبو هريرة رضي الله عنه", "عبد الله بن عمر بن الخطاب رضي الله عنهما"], "answer": "عبد الله بن عمر بن الخطاب رضي الله عنهما", "answerIndex": 3, "explanation": "راوي الحديث عبد الله بن عمر بن الخطاب رضي الله عنهما؛ أسلم بمكة مع أبيه وهو صغير، وكان من فقهاء الصحابة وعبادهم، روى 1630 حديثا، وتوفي سنة 73هـ عن 84 عاما.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-556", "question": "أكمل الحديث: «لا يؤمن أحدكم حتى يحب لأخيه»", "choices": ["ما يملك من مال", "ما يحب لولده", "ما يكره لنفسه", "ما يحب لنفسه"], "answer": "ما يحب لنفسه", "answerIndex": 3, "explanation": "تتمة الحديث: «ما يحب لنفسه»؛ فالإيمان الكامل يقتضي أن يحب المؤمن لأخيه ما يحب لنفسه من أنواع الخير، ويكره له ما يكره لنفسه.", "type": "mcq", "topic": "", "source": "http://shbabbek.com/show/200455"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-557", "question": "ما معنى «لا يؤمن أحدكم» في حديث «لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه»؟", "choices": ["لا تصح صلاته", "لا يدخل الجنة أبدا", "لا يكون مسلما أصلا", "لا يستكمل خصال الإيمان"], "answer": "لا يستكمل خصال الإيمان", "answerIndex": 3, "explanation": "«لا يؤمن أحدكم»: أي لا يستكمل خصال الإيمان؛ فالنفي هنا للكمال والتمام، لا لأصل الإيمان.", "type": "mcq", "topic": "", "source": "http://shbabbek.com/show/200455"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-558", "question": "من المراد بـ«أخيه» في قوله ﷺ: «حتى يحب لأخيه ما يحب لنفسه»؟", "choices": ["صديقه فقط", "أخوه في الإسلام", "أخوه من أبيه وأمه فقط", "جاره فقط"], "answer": "أخوه في الإسلام", "answerIndex": 1, "explanation": "المراد بأخيه: أخوه في الإسلام، ولا مانع من إرادة أخيه في الإنسانية؛ فيحب له ما يحب لنفسه من أنواع الخير.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-559", "question": "ما الإيمان التام كما في الدرس؟", "choices": ["أن يصلي ويصوم فقط", "أن ينافس أخاه في أمور الدنيا", "أن يحب نفسه أكثر من أخيه", "أن يحب المؤمن لأخيه ما يحب لنفسه ويكره له ما يكره لنفسه"], "answer": "أن يحب المؤمن لأخيه ما يحب لنفسه ويكره له ما يكره لنفسه", "answerIndex": 3, "explanation": "الإيمان التام: هو الذي يحث المؤمن على عنايته بأخيه؛ فيحب له ما يحب لنفسه، ويكره له ما يكره لنفسه؛ وقد يرتقي الإيمان بصاحبه، فيحب لأخيه أفضل مما يحب لنفسه.", "type": "mcq", "topic": "", "source": "http://shbabbek.com/show/200455"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-560", "question": "لماذا عُدَّ حديث «لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه» من جوامع كلم النبي ﷺ في الخير؟", "choices": ["لأنه يحقق سلامة الصدور من الغل والحقد والحسد والأذى", "لأنه يذكر الصلاة فقط", "لأنه خاص بالأنصار وحدهم", "لأنه حديث طويل"], "answer": "لأنه يحقق سلامة الصدور من الغل والحقد والحسد والأذى", "answerIndex": 0, "explanation": "هذا الحديث من جوامع كلم النبي ﷺ في الخير؛ لأنه يحقق سلامة الصدور من الغل والحقد والحسد والأذى، ويحث على التواضع ومحاسن الأخلاق والتحاب والتواد والتراحم.", "type": "mcq", "topic": "", "source": "http://shbabbek.com/show/200455"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-561", "question": "أكمل الحديث: «يسروا ولا تعسروا»", "choices": ["واعملوا ولا تتكاسلوا", "وارحموا ولا تقسوا", "وبشروا ولا تنفروا", "واصبروا ولا تجزعوا"], "answer": "وبشروا ولا تنفروا", "answerIndex": 2, "explanation": "تتمة الحديث: «وبشروا ولا تنفروا»؛ فأمرنا النبي صلى الله عليه وسلم أن نلتزم التيسير في شؤوننا، ونتجنب التشديد على نفوسنا، وأن نبشر الناس ولا ننفرهم.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-562", "question": "ما معنى «يسروا» في حديث التيسير والتبشير؟", "choices": ["التعجيل", "التكثير", "التشديد", "التسهيل"], "answer": "التسهيل", "answerIndex": 3, "explanation": "«يسروا»: من اليسر، وهو التسهيل؛ وضدها «تعسروا»: أي لا تشددوا ولا تصعبوا على أنفسكم ولا على غيركم.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-563", "question": "ما معنى «تنفروا» في قوله ﷺ: «وبشروا ولا تنفروا»؟", "choices": ["لا تكلموا الناس", "لا تخبروا بما يثير في النفس الخوف والقلق", "لا تبشروا الناس أبدا", "لا تسألوا عن أحوال الناس"], "answer": "لا تخبروا بما يثير في النفس الخوف والقلق", "answerIndex": 1, "explanation": "«تنفروا»: أي لا تخبروا بما يثير في النفس الخوف والقلق؛ مما يجعلها تعرض عن الخير؛ أما التبشير فيشرح الصدر ويروح عن النفس.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-564", "question": "ما المثال الذي ذكره الكتاب على رفع المشقة والحرج في الشريعة؟", "choices": ["من مرض ترك الصيام بلا قضاء", "من وجد الماء ترك الصلاة", "من تعب ترك الزكاة", "من تعذر عليه استعمال الماء تيمم"], "answer": "من تعذر عليه استعمال الماء تيمم", "answerIndex": 3, "explanation": "من قواعد الشريعة رفع المشقة والحرج؛ فمن تعذر عليه استعمال الماء تيمم، ومن لا يستطيع الصيام لعذر أفطر وقضى هذا اليوم؛ فشريعة الله تعالى سمحة موافقة لطبيعة النفس البشرية.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-565", "question": "ماذا أمرنا النبي ﷺ أن نجعل منهج حياة في حديث التيسير والتبشير؟", "choices": ["التيسير والتبشير", "التشديد والتنفير", "كتمان الأخبار السارة", "الخوف والقلق"], "answer": "التيسير والتبشير", "answerIndex": 0, "explanation": "ينبغي على المسلم أن يجعل التيسير والتبشير منهج حياة؛ فاليسر مظهر من مظاهر الإسلام عقيدة وشريعة وأخلاقا، والتبشير يشرح الصدر ويسعد به الآخرون من حوله.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-566", "question": "أكمل الحديث: «رحم الله رجلا سمحا إذا باع»", "choices": ["وإذا سافر، وإذا أقام", "وإذا اشترى، وإذا اقتضى", "وإذا صلى، وإذا صام", "وإذا غضب، وإذا رضي"], "answer": "وإذا اشترى، وإذا اقتضى", "answerIndex": 1, "explanation": "تتمة الحديث: «وإذا اشترى، وإذا اقتضى»؛ فالنبي صلى الله عليه وسلم يدعو لمن كان سهلا كريما في معاملته بأن يرحمه الله تعالى ويغفر له ويحسن إليه.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-567", "question": "ما معنى «سمحا» في حديث السماحة في المعاملة؟", "choices": ["صعبا بخيلا", "سهلا كريما", "سريعا متعجلا", "غاضبا متشددا"], "answer": "سهلا كريما", "answerIndex": 1, "explanation": "«سمحا»: أي سهلا كريما؛ فالسماحة في البيع أن يكون البائع سهلا، وفي الشراء أن يكون المشتري كريما رفيقا بالبائع.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-568", "question": "ما معنى «اقتضى» في قوله ﷺ: «وإذا اقتضى»؟", "choices": ["أدى الحق الذي عليه", "ترك حقه كله", "سامح في حقه", "طلب الحق الذي له"], "answer": "طلب الحق الذي له", "answerIndex": 3, "explanation": "«اقتضى»: طلب الحق الذي له؛ والسماحة في طلب الحق أن يطالب صاحبه باللين والرفق من غير غلظة ولا عنف، وأن يتخير الأوقات المناسبة للطلب.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-569", "question": "ما السماحة في البيع كما في الدرس؟", "choices": ["أن يحلف البائع لترويج سلعته", "أن يخدع البائع المشتري", "أن يبالغ البائع في الثمن", "أن يكون البائع سهلا لا يبالغ في الثمن ولا يغش المشتري"], "answer": "أن يكون البائع سهلا لا يبالغ في الثمن ولا يغش المشتري", "answerIndex": 3, "explanation": "السماحة في البيع: أن يكون البائع سهلا، ولا يبالغ في الثمن، ولا يبخل بالسلعة، ولا يحلف لترويجها، ولا يخدع المشتري ولا يغشه.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-570", "question": "من راوي حديث السماحة في المعاملة؟", "choices": ["جابر بن عبد الله رضي الله عنهما", "أبو هريرة رضي الله عنه", "عبد الله بن عمر رضي الله عنهما", "أنس بن مالك رضي الله عنه"], "answer": "جابر بن عبد الله رضي الله عنهما", "answerIndex": 0, "explanation": "راوي الحديث جابر بن عبد الله بن عمرو بن حرام الأنصاري رضي الله عنهما؛ شهد مع النبي صلى الله عليه وسلم 19 غزوة، وروى 1540 حديثا، ومات سنة 73هـ عن 94 سنة، وهو آخر من مات من الصحابة بالمدينة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-571", "question": "من أحق الناس بحسن صحبة المسلم كما في حديث بر الوالدين؟", "choices": ["الأب", "الأخ", "الأم", "الصديق"], "answer": "الأم", "answerIndex": 2, "explanation": "سأل رجل النبي صلى الله عليه وسلم: من أحق الناس بحسن صحابتي؟ قال: «أمك»، ثم أمك، ثم أمك، ثم أبوك؛ فالأم أحق الناس بحسن المعاملة وجميل المصاحبة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-572", "question": "كم مرة ذكر النبي ﷺ الأم في حديث بر الوالدين؟", "choices": ["أربع مرات", "مرة واحدة", "ثلاث مرات", "مرتان"], "answer": "ثلاث مرات", "answerIndex": 2, "explanation": "ذكر النبي صلى الله عليه وسلم الأم ثلاث مرات، وذكر الأب مرة واحدة؛ فأوصى بالأم ثلاثا لما عانته من آلام الحمل والوضع والرضاعة والفطام.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-573", "question": "لماذا اختص النبي ﷺ الأم بالذكر ثلاث مرات في حديث بر الوالدين؟", "choices": ["لأن الأب لا حق له", "لأن الأم أقوى من الأب", "لما عانته من آلام الحمل والوضع والرضاعة والفطام", "لأن الأب غائب دائما"], "answer": "لما عانته من آلام الحمل والوضع والرضاعة والفطام", "answerIndex": 2, "explanation": "اختص النبي صلى الله عليه وسلم الأم بالذكر ثلاث مرات؛ لأنها عانت كثيرا من آلام الحمل والوضع والرضاعة والفطام؛ واستحق الأب الوصية أيضا لحرصه على إسعاد ولده والسعي ليجلب له الرزق والحياة الكريمة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-574", "question": "ما جزاء عقوق الوالدين كما في الدرس؟", "choices": ["عقوبته في الآخرة فقط", "سبب في تعجيل العقوبة لصاحبه في الدنيا", "يغفر له دائما", "لا عقوبة عليه"], "answer": "سبب في تعجيل العقوبة لصاحبه في الدنيا", "answerIndex": 1, "explanation": "عقوق الوالدين سبب في تعجيل العقوبة لصاحبه في الدنيا؛ فكما تدين تدان؛ ومن الواجب على الولد أن يحسن صحبة والديه، ويسارع إلى ما يرضيهما، ويتجنب ما يغضبهما أو يؤذي مشاعرهما بالقول أو بالفعل.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-575", "question": "من راوي حديث بر الوالدين؟", "choices": ["جابر بن عبد الله رضي الله عنهما", "أبو هريرة رضي الله عنه", "أنس بن مالك رضي الله عنه", "عبد الله بن عباس رضي الله عنهما"], "answer": "أبو هريرة رضي الله عنه", "answerIndex": 1, "explanation": "راوي الحديث أبو هريرة رضي الله عنه؛ هو عبد الرحمن بن صخر، كناه النبي صلى الله عليه وسلم بأبي هريرة حين رآه يحمل هرة في كمه، وكان أكثر الصحابة رواية للحديث؛ روى 5374 حديثا، وتوفي بالمدينة سنة 57هـ عن 78 عاما.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-576", "question": "أكمل الحديث: «تعاهدوا القرآن، فوالذي نفسي بيده»", "choices": ["لهو أشد تفصيا من الإبل في عقلها", "لهو أيسر حفظا من الشعر", "لهو أثبت في الصدر من الجبال", "لهو أنفع للناس من المطر"], "answer": "لهو أشد تفصيا من الإبل في عقلها", "answerIndex": 0, "explanation": "تتمة الحديث: «لهو أشد تفصيا من الإبل في عقلها»؛ فصاحب القرآن إن داوم على تلاوته واستذكاره ظل حافظا له، وإن غفل عن تلاوته وأهمل قراءته نسي ما حفظه.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-577", "question": "ما معنى «تعاهدوا» في حديث المداومة على قراءة القرآن؟", "choices": ["حافظوا عليه بمداومة تلاوته وتدبره", "احفظوه دون فهم", "اقرؤوه مرة واحدة", "اتركوه حتى تنسوه"], "answer": "حافظوا عليه بمداومة تلاوته وتدبره", "answerIndex": 0, "explanation": "«تعاهدوا القرآن»: أي حافظوا عليه بمداومة تلاوته وتدبره؛ فالقرآن الكريم كتاب الله الحكيم، وهو دستور هذه الأمة القويم الذي تستمد منه أحكامها.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-578", "question": "ما معنى «تفصيا» في قوله ﷺ: «لهو أشد تفصيا من الإبل في عقلها»؟", "choices": ["ثباتا واستقرارا", "تفلتا وانطلاقا", "حفظا وإتقانا", "قراءة وترتيلا"], "answer": "تفلتا وانطلاقا", "answerIndex": 1, "explanation": "«تفصيا»: أي تفلتا وانطلاقا؛ فالقرآن في صدر صاحبه كالجمل المقيد الذي يخشى منه الفرار؛ فما دام مقيدا ظل ممسوكا، وإن زال قيده انفلت وذهب.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-579", "question": "ما معنى «عقل» في قوله ﷺ: «من الإبل في عقلها»؟", "choices": ["أعناق الإبل", "أرجل الإبل", "جمع عقل، وهو الفهم", "جمع عقال، وهو الحبل الذي يقيد به البعير لكيلا يهرب"], "answer": "جمع عقال، وهو الحبل الذي يقيد به البعير لكيلا يهرب", "answerIndex": 3, "explanation": "«عقل»: جمع عقال، وهو الحبل الذي يقيد به البعير لكيلا يهرب؛ فشبه النبي صلى الله عليه وسلم القرآن في صدر صاحبه بالجمل المقيد الذي يخشى منه الفرار.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-580", "question": "بم شبه النبي ﷺ القرآن في صدر صاحبه في حديث المداومة على قراءته؟", "choices": ["بالكنز المدفون", "بالنهر الجاري", "بالجمل المقيد الذي إن زال قيده انفلت وذهب", "بالطائر في القفص"], "answer": "بالجمل المقيد الذي إن زال قيده انفلت وذهب", "answerIndex": 2, "explanation": "شبه النبي صلى الله عليه وسلم القرآن في صدر صاحبه بالجمل المقيد الذي يخشى منه الفرار؛ فما دام مقيدا ظل ممسوكا، وإن زال قيده ولم يراقب انفلت وذهب؛ والعمل بالقرآن وتطبيقه معين على حفظه.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-581", "question": "أكمل الحديث: «من لا يرحم»", "choices": ["لا يدخل الجنة", "لا يرحم", "لا يؤمن", "لا يغفر له"], "answer": "لا يرحم", "answerIndex": 1, "explanation": "تتمة الحديث: «لا يرحم»؛ فالرحمة خلق إسلامي رفيع حث عليه الإسلام؛ ومن لا يتصف بالرحمة شقي ولا يكون أهلا لأن تناله رحمة الله التي وسعت كل شيء.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-582", "question": "ما معنى الرحمة من الإنسان كما في الدرس؟", "choices": ["شدة الغضب", "كثرة المال", "رقة في قلبه تقتضي العطف والحنان", "قوة في البدن"], "answer": "رقة في قلبه تقتضي العطف والحنان", "answerIndex": 2, "explanation": "الرحمة من الله تعالى: صفة تقتضي تمام الإنعام والإحسان؛ والرحمة من الإنسان: رقة في قلبه تقتضي العطف والحنان؛ فالإنسان الرحيم هو الذي يشعر بآلام الآخرين ويراعي مشاعرهم ويسهم في معاونة من يحتاج المعونة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-583", "question": "أكمل قول النبي ﷺ: «لا تنزع الرحمة»", "choices": ["إلا من شقي", "إلا من غني", "إلا من مؤمن", "إلا من صغير"], "answer": "إلا من شقي", "answerIndex": 0, "explanation": "قال رسول الله صلى الله عليه وسلم: «لا تنزع الرحمة إلا من شقي»؛ فمن لا يتصف بالرحمة شقي، ولا يكون أهلا لأن تناله رحمة الله التي وسعت كل شيء.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-584", "question": "بمن تكون الرحمة شاملة عامة كما في الدرس؟", "choices": ["بالكبار فقط", "بالناس والحيوانات والطيور", "بالناس فقط", "بالمسلمين فقط"], "answer": "بالناس والحيوانات والطيور", "answerIndex": 1, "explanation": "يجب أن تكون الرحمة شاملة عامة؛ فيكون الإنسان رحيما بالناس والحيوانات والطيور؛ فالله سبحانه وتعالى يحب الرحمة والرحماء، ووصف نفسه بالرحمن، وأرسل خاتم النبيين رحمة للعالمين.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-585", "question": "أكمل الحديث: «المسلم من سلم المسلمون من لسانه ويده»", "choices": ["والمؤمن من صلى وصام", "والمؤمن من تصدق وزكى", "والمسلم من حج واعتمر", "والمؤمن من أمنه الناس على دمائهم وأموالهم"], "answer": "والمؤمن من أمنه الناس على دمائهم وأموالهم", "answerIndex": 3, "explanation": "تتمة الحديث: «والمؤمن من أمنه الناس على دمائهم وأموالهم»؛ فالمسلم الكامل هو الذي يسلم الناس من شر لسانه ويده، والمؤمن الكامل هو الذي يأمن الناس منه على دمائهم وأموالهم من أي شر وأذى.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-586", "question": "ما معنى «سلم» في قوله ﷺ: «المسلم من سلم المسلمون من لسانه ويده»؟", "choices": ["ابتعد عنه", "نجا من شره وأذاه", "خاصمه", "هلك من أذاه"], "answer": "نجا من شره وأذاه", "answerIndex": 1, "explanation": "«سلم»: أي نجا من شره وأذاه؛ فالمسلم الكامل هو الذي يسلم الناس من شر لسانه بالسب أو الشتم أو الغيبة وغيرها، ومن أذى يده بالاعتداء بالضرب أو القتل أو السرقة وغيرها.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-587", "question": "من المقصود بـ«الناس» في حديث «المسلم من سلم المسلمون من لسانه ويده»؟", "choices": ["أهل المدينة فقط", "المسلم فقط", "كل الناس لتشمل المسلم وغيره", "الأقارب فقط"], "answer": "كل الناس لتشمل المسلم وغيره", "answerIndex": 2, "explanation": "المقصود بالناس: كل الناس لتشمل المسلم وغيره؛ وقد عبر النبي صلى الله عليه وسلم بقوله: «الناس» ليشمل المسلم وغيره.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-588", "question": "لماذا خص النبي ﷺ اليد واللسان بالذكر في حديث «المسلم من سلم المسلمون من لسانه ويده»؟", "choices": ["لأن اليد واللسان لا يخطئان", "لأن الأذى مقصور عليهما", "لأنهما أسرع في الأذى وأشد من غيرهما", "لأن غيرهما لا يؤذي"], "answer": "لأنهما أسرع في الأذى وأشد من غيرهما", "answerIndex": 2, "explanation": "خص النبي صلى الله عليه وسلم اليد واللسان بالذكر؛ لأنهما أسرع في الأذى، وأشد من غيرهما؛ والكلمة الخبيثة تؤدي إلى أسوأ النتائج.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-589", "question": "من الذي روى حديث «المسلم من سلم المسلمون من لسانه ويده، والمؤمن من أمنه الناس على دمائهم وأموالهم»؟", "choices": ["الإمام النسائي في كتابه السنن", "الإمام مسلم في صحيحه", "الإمام البخاري في صحيحه", "الإمام أحمد في مسنده"], "answer": "الإمام النسائي في كتابه السنن", "answerIndex": 0, "explanation": "روى الحديث الإمام النسائي في كتابه السنن؛ وراويه عن النبي صلى الله عليه وسلم أبو هريرة رضي الله عنه.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-590", "question": "أكمل الحديث: «نعمتان مغبون فيهما كثير من الناس»", "choices": ["الصحة والفراغ", "المال والولد", "الشباب والقوة", "العلم والعمل"], "answer": "الصحة والفراغ", "answerIndex": 0, "explanation": "تتمة الحديث: «الصحة والفراغ»؛ فرأس مال الإنسان في الدنيا يعود إلى أمرين: الصحة، والوقت الخالي من الشواغل والهموم؛ فالصحة يستفاد منها بما فيه خير الدنيا والآخرة من الأعمال الصالحة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-591", "question": "ما معنى «مغبون» في حديث «نعمتان مغبون فيهما كثير من الناس: الصحة والفراغ»؟", "choices": ["الخسران فيهما لعدم الاستفادة منهما", "النسيان لهما", "الربح الكثير فيهما", "الفرح بهما"], "answer": "الخسران فيهما لعدم الاستفادة منهما", "answerIndex": 0, "explanation": "«مغبون فيهما»: أي في النعمتين، ومعناها الخسران فيهما لعدم الاستفادة منهما؛ فكثير من الناس لا يعرفون قدر هاتين النعمتين، فلا يكاد يشعر بالصحة إلا من فقدها، ولا بالوقت إلا من ضيعه.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-592", "question": "ما معنى «الفراغ» في حديث نعمة الصحة والوقت؟", "choices": ["الوقت الخالي من الشواغل", "كثرة الأعمال", "النوم الطويل", "السفر الكثير"], "answer": "الوقت الخالي من الشواغل", "answerIndex": 0, "explanation": "«الفراغ»: الوقت الخالي من الشواغل؛ وقد جمع النبي صلى الله عليه وسلم بين هاتين النعمتين؛ لأن الإنسان قد يكون صحيحا ولا يكون متفرغا للعبادة، وقد يكون متفرغا من الشواغل ولا يكون صحيحا، فإذا اجتمعا للعبد فاز بالسعادة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-593", "question": "أي مما يلي من مظاهر تضييع نعمة الصحة كما في الدرس؟", "choices": ["ممارسة الرياضة", "تعاطي المخدرات والمسكرات والتدخين", "الاعتناء بنظافة الطعام", "النوم المبكر"], "answer": "تعاطي المخدرات والمسكرات والتدخين", "answerIndex": 1, "explanation": "من مظاهر تضييع نعمة الصحة في حياتنا: تعاطي المخدرات، والمسكرات، والتدخين، وعدم الاعتناء بنظافة الطعام والشراب وغير ذلك.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-594", "question": "أي مما يلي من مظاهر تضييع الوقت كما في الدرس؟", "choices": ["الجلوس في الطرقات والمقاهي لغير حاجة", "طلب العلم", "قراءة القرآن الكريم", "زيارة الأقارب"], "answer": "الجلوس في الطرقات والمقاهي لغير حاجة", "answerIndex": 0, "explanation": "من مظاهر تضييع الوقت: الجلوس في الطرقات والمقاهي لغير حاجة، وكذا السهر في غير طاعة الله تعالى؛ والحديث يهدف إلى الجد والعمل وتقدير النعمة والحرص عليها والاستفادة منها.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-595", "question": "أكمل الحديث: «أيما رجل أمن رجلا على دمه ثم قتله»", "choices": ["فأنا من القاتل بريء، وإن كان المقتول كافرا", "فلا إثم عليه", "فأنا من القاتل راض", "فله الجنة"], "answer": "فأنا من القاتل بريء، وإن كان المقتول كافرا", "answerIndex": 0, "explanation": "تتمة الحديث: «فأنا من القاتل بريء، وإن كان المقتول كافرا»؛ ففي هذا الحديث براءة النبي صلى الله عليه وسلم من الغدر والخيانة، وأن يكون المؤمن وفيا لمن حوله.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-596", "question": "ما معنى «أمن رجلا» في حديث براءة النبي ﷺ من أهل الغدر والخيانة؟", "choices": ["أخفى عنه الحق", "أعطاه الأمان على نفسه وماله", "قاتله", "سرق ماله"], "answer": "أعطاه الأمان على نفسه وماله", "answerIndex": 1, "explanation": "«أمن رجلا»: أي أعطاه الأمان على نفسه وماله؛ فمن أمن رجلا على دمه ثم قتله فقد غدر به وخان الأمانة، والنبي صلى الله عليه وسلم بريء من القاتل الغادر؛ أي لا يرضى عمله؛ لأن المؤمن لا يغدر.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-597", "question": "ما الآية التي استشهد بها الكتاب على حرمة قتل النفس المعصومة؟", "choices": ["سورة النساء، الآية 86", "سورة البقرة، الآية 43", "سورة المائدة، الآية 8", "سورة الإسراء، الآية 33"], "answer": "سورة الإسراء، الآية 33", "answerIndex": 3, "explanation": "استشهد الكتاب بقوله تعالى ﴿وَلَا تَقْتُلُوا النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلَّا بِالْحَقِّ﴾ (سورة الإسراء، الآية 33)؛ فتحريم قتل النفس المعصومة لا يقتصر على المسلم، بل يشمل غير المسلم، فلا يجوز قتل الذمي ما دام في بلاد المسلمين، بل يجب على المسلمين حمايته في نفسه وماله وعرضه؛ والبر والإحسان والعدل حق لكل من لم يقاتل المسلمين، كما في قوله تعالى ﴿أَنْ تَبَرُّوهُمْ وَتُقْسِطُوا إِلَيْهِمْ﴾ (سورة الممتحنة، الآية 8).", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-598", "question": "أكمل الحديث: «آية المنافق ثلاث: إذا حدث كذب، وإذا وعد أخلف»", "choices": ["وإذا تصدق أخفى", "وإذا جاهد صبر", "وإذا اؤتمن خان", "وإذا صلى أخلص"], "answer": "وإذا اؤتمن خان", "answerIndex": 2, "explanation": "تتمة الحديث: «وإذا اؤتمن خان»؛ فأمارات المنافق ثلاث: إذا حدث كذب، وإذا وعد أخلف، وإذا اؤتمن خان؛ والخيانة: أن لم يصن الأمانة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-599", "question": "كم عدد أمارات المنافق في حديث «آية المنافق ثلاث»؟", "choices": ["خمس", "اثنتان", "أربع", "ثلاث"], "answer": "ثلاث", "answerIndex": 3, "explanation": "أمارات المنافق ثلاث: إذا حدث كذب، وإذا وعد أخلف، وإذا اؤتمن خان؛ فالكذب: أن يخبر بخلاف الحقيقة، والإخلاف: أن لم يف بالوعد، والخيانة: أن لم يصن الأمانة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "الحديث", "id": "h26-g7-600", "question": "ما نوعا النفاق كما في الدرس؟", "choices": ["نفاق في الظاهر ونفاق في الباطن", "نفاق في المال ونفاق في الجاه", "نفاق في القول ونفاق في الفعل", "نفاق في العقيدة ونفاق في العمل"], "answer": "نفاق في العقيدة ونفاق في العمل", "answerIndex": 3, "explanation": "النفاق نوعان: نفاق في العقيدة، وهم من يظهرون الإسلام ويخفون الكفر؛ ونفاق في العمل، وهم من يتظاهرون بأخلاق المؤمنين الكريمة ولا يتصفون بها على الحقيقة؛ وهذا الصنف الثاني هو المراد في الحديث.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-601", "question": "من والد النبي صلى الله عليه وسلم؟", "choices": ["عبد الله بن هاشم", "هاشم بن عبد مناف", "عبد الله بن عبد المطلب", "عبد مناف بن قصي"], "answer": "عبد الله بن عبد المطلب", "answerIndex": 2, "explanation": "والد النبي صلى الله عليه وسلم هو عبد الله بن عبد المطلب بن هاشم بن عبد مناف.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-602", "question": "من الجد الخامس للنبي صلى الله عليه وسلم؟", "choices": ["عبد مناف بن قصي", "قصي بن كلاب", "هاشم بن عبد مناف", "كلاب بن مرة"], "answer": "كلاب بن مرة", "answerIndex": 3, "explanation": "كلاب بن مرة هو الجد الخامس للنبي صلى الله عليه وسلم؛ فنسبه: محمد بن عبد الله بن عبد المطلب بن هاشم بن عبد مناف بن قصي بن كلاب بن مرة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-603", "question": "ما اسم أم النبي صلى الله عليه وسلم؟", "choices": ["آمنة بنت وهب", "ثويبة الأسلمية", "حليمة السعدية", "أم أيمن"], "answer": "آمنة بنت وهب", "answerIndex": 0, "explanation": "أم النبي صلى الله عليه وسلم هي آمنة بنت وهب بن عبد مناف بن زهرة بن كلاب.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-604", "question": "ما اسم جد أم النبي صلى الله عليه وسلم؟", "choices": ["وهب بن عبد مناف", "كلاب بن مرة", "زهرة بن كلاب", "عبد مناف بن زهرة"], "answer": "وهب بن عبد مناف", "answerIndex": 0, "explanation": "أم النبي صلى الله عليه وسلم آمنة بنت وهب بن عبد مناف بن زهرة بن كلاب.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-605", "question": "ما التاريخ المشهور لمولد النبي صلى الله عليه وسلم؟", "choices": ["فجر يوم الاثنين التاسع من ربيع الأول سنة 572م", "فجر يوم الاثنين الثاني عشر من ربيع الأول سنة 571م", "فجر يوم الاثنين السابع عشر من رمضان سنة 571م", "فجر يوم الخميس الثاني عشر من ربيع الأول سنة 571م"], "answer": "فجر يوم الاثنين الثاني عشر من ربيع الأول سنة 571م", "answerIndex": 1, "explanation": "اشتهر أن ولادة النبي صلى الله عليه وسلم كانت فجر يوم الاثنين الثاني عشر من ربيع الأول، الموافق لليوم العشرين من شهر أبريل سنة 571م، وهو العام الذي وقع فيه حادث الفيل.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-606", "question": "في أي عام ولد النبي صلى الله عليه وسلم؟", "choices": ["عام الوفود", "عام الفتح", "عام الحزن", "عام الفيل"], "answer": "عام الفيل", "answerIndex": 3, "explanation": "ولد النبي صلى الله عليه وسلم سنة 571م، وهو العام الذي وقع فيه حادث الفيل.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-607", "question": "ما التاريخ الذي حققه بعض العلماء أنه الصحيح لمولد النبي صلى الله عليه وسلم؟", "choices": ["يوم الخميس التاسع من ربيع الأول سنة 571م", "يوم الاثنين الثاني عشر من ربيع الأول سنة 571م", "يوم الاثنين التاسع من ربيع الأول سنة 572م", "يوم الاثنين السابع عشر من رمضان سنة 572م"], "answer": "يوم الاثنين التاسع من ربيع الأول سنة 572م", "answerIndex": 2, "explanation": "حقق بعض العلماء المسلمين أن ولادته صلى الله عليه وسلم كانت يوم الاثنين الموافق التاسع من ربيع الأول سنة 572م، والأول هو المشهور والثاني هو الصحيح.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-608", "question": "من التي استقبلت النبي صلى الله عليه وسلم عند ولادته؟", "choices": ["الشفاء بنت عوف", "حليمة السعدية", "ثويبة الأسلمية", "أم أيمن"], "answer": "الشفاء بنت عوف", "answerIndex": 0, "explanation": "استقبلته الشفاء بنت عوف عند ولادته صلى الله عليه وسلم.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-609", "question": "من أول من أرضع النبي صلى الله عليه وسلم؟", "choices": ["ثويبة الأسلمية", "حليمة السعدية", "أم أيمن", "أمه آمنة بنت وهب"], "answer": "أمه آمنة بنت وهب", "answerIndex": 3, "explanation": "أول من أرضعه صلى الله عليه وسلم أمه السيدة آمنة بنت وهب، ثم ثويبة الأسلمية جارية عمه أبي لهب، فأم أيمن جارية أبيه، ثم أرضعته السيدة حليمة السعدية.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-610", "question": "كم كان عمر النبي صلى الله عليه وسلم حين رحل مع أمه لزيارة أخوال أبيه في يثرب؟", "choices": ["أربع سنوات", "ثماني سنوات", "ست سنوات", "خمس سنوات"], "answer": "ست سنوات", "answerIndex": 2, "explanation": "رحل النبي صلى الله عليه وسلم مع أمه وهو في السادسة من عمره لزيارة أخوال أبيه في يثرب (المدينة المنورة).", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-611", "question": "من أخوال أبي النبي صلى الله عليه وسلم الذين زارهم في يثرب؟", "choices": ["بنو مخزوم بن يقظة", "بنو عدي بن النجار", "بنو هاشم بن عبد مناف", "بنو زهرة بن كلاب"], "answer": "بنو عدي بن النجار", "answerIndex": 1, "explanation": "زار النبي صلى الله عليه وسلم مع أمه أخوال أبيه من بني عدي بن النجار في يثرب.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-612", "question": "أين أدركت الوفاة أم النبي صلى الله عليه وسلم؟", "choices": ["في الشام أثناء التجارة", "في الطريق أثناء عودتها إلى مكة", "في يثرب عند أخوال أبيه", "في مكة المكرمة"], "answer": "في الطريق أثناء عودتها إلى مكة", "answerIndex": 1, "explanation": "بينما هي عائدة إلى مكة أدركتها الوفاة في الطريق، فرجع النبي صلى الله عليه وسلم مع جاريته أم أيمن إلى مكة.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-613", "question": "مع من رجع النبي صلى الله عليه وسلم إلى مكة بعد وفاة أمه؟", "choices": ["مع جده عبد المطلب", "مع حليمة السعدية", "مع جاريته أم أيمن", "مع عمه أبي طالب"], "answer": "مع جاريته أم أيمن", "answerIndex": 2, "explanation": "رجع النبي صلى الله عليه وسلم مع جاريته أم أيمن إلى مكة، إلى جده عبد المطلب الذي كان يحبه ويكرمه.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-614", "question": "من الذي تولى رعاية النبي صلى الله عليه وسلم بعد وفاة أمه؟", "choices": ["عمه حمزة", "عمه العباس", "جده عبد المطلب", "عمه أبو طالب"], "answer": "جده عبد المطلب", "answerIndex": 2, "explanation": "تولى جده عبد المطلب رعايته بعد وفاة أمه، ثم أدركته الوفاة والنبي صلى الله عليه وسلم لا يزال في الثامنة من عمره.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-615", "question": "كم كان عمر النبي صلى الله عليه وسلم حين توفي جده عبد المطلب؟", "choices": ["عشر سنوات", "اثنتا عشرة سنة", "ثماني سنوات", "ست سنوات"], "answer": "ثماني سنوات", "answerIndex": 2, "explanation": "توفي جده عبد المطلب والنبي صلى الله عليه وسلم في الثامنة من عمره، وبعد وفاته كفله عمه أبو طالب.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-616", "question": "من كفل النبي صلى الله عليه وسلم بعد وفاة جده عبد المطلب؟", "choices": ["عمه العباس بن عبد المطلب", "عمه أبو طالب", "جده قصي بن كلاب", "عمه حمزة بن عبد المطلب"], "answer": "عمه أبو طالب", "answerIndex": 1, "explanation": "بعد وفاة جده عبد المطلب كفله عمه أبو طالب.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-617", "question": "من الراهب الذي قابل النبي صلى الله عليه وسلم مع عمه أبي طالب في رحلة الشام؟", "choices": ["بحيرا الراهب", "ورقة بن نوفل", "عداس النصراني", "النجاشي أصحمة"], "answer": "بحيرا الراهب", "answerIndex": 0, "explanation": "أراد أبو طالب السفر في تجارة إلى الشام فأخذ معه النبي صلى الله عليه وسلم، وقد قابلهم بالقرب من بصرى راهب اسمه بحيرا.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-618", "question": "ماذا رأى بحيرا الراهب في النبي صلى الله عليه وسلم؟", "choices": ["خاتم النبوة بين كتفيه", "نورًا ساطعًا في وجهه", "خاتمًا من ذهب في إصبعه", "علامة في كفه اليمنى"], "answer": "خاتم النبوة بين كتفيه", "answerIndex": 0, "explanation": "نظر بحيرا إلى ظهر النبي صلى الله عليه وسلم فرأى خاتم النبوة بين كتفيه، فبشره بنبوته ونصح عمه أبا طالب ألا يدخل به بلاد الشام خوفًا عليه من اليهود.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-619", "question": "بماذا اشتغل النبي صلى الله عليه وسلم قبل البعثة؟", "choices": ["بالتجارة", "بالرعي فقط", "بالحدادة", "بالزراعة"], "answer": "بالتجارة", "answerIndex": 0, "explanation": "اشتغل النبي صلى الله عليه وسلم بالتجارة قبل البعثة، وعرفت السيدة خديجة صدقه وأمانته.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-620", "question": "من التي عرضت على النبي صلى الله عليه وسلم أن يخرج بتجارتها إلى الشام؟", "choices": ["حليمة السعدية", "السيدة خديجة بنت خويلد", "أم أيمن", "السيدة آمنة بنت وهب"], "answer": "السيدة خديجة بنت خويلد", "answerIndex": 1, "explanation": "عرفت السيدة خديجة بنت خويلد صدق رسول الله صلى الله عليه وسلم وأمانته، فعرضت عليه أن يخرج بتجارتها إلى الشام.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-621", "question": "من غلام السيدة خديجة الذي خرج مع النبي صلى الله عليه وسلم في تجارته إلى الشام؟", "choices": ["بلال بن رباح", "ميسرة", ا الصادقة في المنام", "answerIndex": 1, "explanation": "أول ما بدئ به رسول الله صلى الله عليه وسلم من الوحي الرؤيا الصادقة في المنام؛ فكان لا يرى رؤيا إلا تحققت كما رآها.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-626", "question": "أين كان النبي صلى الله عليه وسلم يخلو للتعبد قبل البعثة؟", "choices": ["في الكعبة المشرفة", "في جبل عرفات", "في غار حراء", "في غار ثور"], "answer": "في غار حراء", "answerIndex": 2, "explanation": "حبب إليه الخلوة فكان يخلو بغار حراء ليتعبد، وهو غار في أعلى جبل حراء يبعد عن مكة ساعة بالسير على الأقدام.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-627", "question": "كم كان عمر النبي صلى الله عليه وسلم حين نزل عليه الوحي؟", "choices": ["خمسون سنة", "خمس وعشرون سنة", "ثلاثون سنة", "أربعون سنة"], "answer": "أربعون سنة", "answerIndex": 3, "explanation": "لما بلغ النبي صلى الله عليه وسلم أربعين سنة جاءه جبريل في غار حراء.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-628", "question": "في أي يوم وشهر نزل الوحي على النبي صلى الله عليه وسلم؟", "choices": ["يوم الجمعة السابع عشر من رمضان", "يوم الاثنين الثاني عشر من ربيع الأول", "يوم الخميس السابع والعشرين من رجب", "يوم الاثنين السابع عشر من شهر رمضان"], "answer": "يوم الاثنين السابع عشر من شهر رمضان", "answerIndex": 3, "explanation": "جاءه جبريل في غار حراء يوم الاثنين السابع عشر من شهر رمضان، فضمه ضمة شديدة حتى أجهده وقال له: اقرأ.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-629", "question": "ماذا قال النبي صلى الله عليه وسلم لجبريل حين قال له: اقرأ؟", "choices": ["أقرأ عليك ما أنزل إليك", "سمعًا وطاعة", "لا أعرف من أنت", "«ما أنا بقارئ»"], "answer": "«ما أنا بقارئ»", "answerIndex": 3, "explanation": "قال له جبريل: اقرأ، فقال رسول الله صلى الله عليه وسلم: «ما أنا بقارئ»، أي لا أعرف القراءة، وتكرر هذا الأمر مرتين ثم قال له في الثالثة: اقرأ باسم ربك الذي خلق.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-630", "question": "كم مرة قال جبريل للنبي صلى الله عليه وسلم: اقرأ، قبل أن يقرأ عليه أول سورة العلق؟", "choices": ["أربع مرات", "مرة واحدة", "مرتان", "ثلاث مرات"], "answer": "ثلاث مرات", "answerIndex": 3, "explanation": "قال له جبريل: اقرأ، فقال: «ما أنا بقارئ»، وتكرر هذا الأمر مرتين ثم قال له في الثالثة: اقرأ باسم ربك الذي خلق.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-631", "question": "ماذا قال النبي صلى الله عليه وسلم للسيدة خديجة حين رجع إليها بعد نزول الوحي؟", "choices": ["«زملوني زملوني»", "أخبريني ما هذا", "ادعوا لي ورقة بن نوفل", "«ما أنا بقارئ»"], "answer": "«زملوني زملوني»", "answerIndex": 0, "explanation": "رجع رسول الله صلى الله عليه وسلم يرتجف ودخل على السيدة خديجة وقال: «زملوني زملوني»، أي لفونني في ثيابي، وذلك لشدة ما بلغه من الهول والفزع.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-632", "question": "إلى من انطلقت السيدة خديجة بالنبي صلى الله عليه وسلم بعد نزول الوحي؟", "choices": ["إلى عمه أبي طالب", "إلى ابن عمها ورقة بن نوفل", "إلى بحيرا الراهب", "إلى جده عبد المطلب"], "answer": "إلى ابن عمها ورقة بن نوفل", "answerIndex": 1, "explanation": "أخبر النبي صلى الله عليه وسلم خديجة بما وقع له، فانطلقت به إلى ابن عمها ورقة بن نوفل، وكان عنده علم بالكتب السماوية.", "type": "mcq", "topic": "", "source": "https://fliphtml5.com/oisyp/ujre/1_5/"}, {"grade": 7, "subject": "السيرة", "id": "h26-g7-633", "question": "بماذا بشر ورقة بن نوفل النبي صلى الله عليه وسلم؟", "choices": ["بأنه سيكون ملكًا على العرب", "بأنه سيفتح الشام", "بأنه سيكون نبي هذه الأمة", "بأنه سيهاجر إلى الحبشة"], "answer": "بأنه سيكون نبي هذه الأمة", "answerIndex": 2, "explanation": "فلما أخبره ا
