<style>

var RAW=[{"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-1", "question": "ما الذي يميّز «التعلّم العميق» عن شبكات عصبونية تقليدية أقدم؟", "choices": ["أنه لا يحتاج إلى أي بيانات للتدريب", "أنه يستخدم شبكات عصبونية ذات طبقات خفية كثيرة تتعلّم التمثيلات تدريجيًا من البيانات", "أنه يعتمد على قواعد منطقية يكتبها الإنسان سطرًا سطرًا", "أنه يعمل دون أي عمليات حسابية"], "answer": "أنه يستخدم شبكات عصبونية ذات طبقات خفية كثيرة تتعلّم التمثيلات تدريجيًا من البيانات", "answerIndex": 1, "explanation": "يقوم التعلّم العميق على شبكات عصبونية متعددة الطبقات؛ تتعلّم الطبقات الأولى سمات بسيطة مثل الحواف في الصور، وتبني الطبقات الأعمق فوقها سمات أكثر تعقيدًا. هذا التدرّج في تعلّم التمثيلات هو ما منحه تفوّقه في الصور والكلام واللغة.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_عميق"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-2", "question": "ما وظيفة «دالة التفعيل» غير الخطية داخل الخلية العصبية الاصطناعية؟", "choices": ["إدخال اللاخطية حتى تستطيع الشبكة تعلّم علاقات معقّدة لا يمكن تمثيلها بخطوط مستقيمة", "حذف الطبقات الزائدة من الشبكة تلقائيًا", "تحويل النصوص إلى صور", "تسريع اتصال الشبكة بالإنترنت"], "answer": "إدخال اللاخطية حتى تستطيع الشبكة تعلّم علاقات معقّدة لا يمكن تمثيلها بخطوط مستقيمة", "answerIndex": 0, "explanation": "من دون دوال تفعيل غير خطية تنهار الطبقات المتعددة رياضيًا إلى ما يعادل طبقة واحدة خطية، فتعجز الشبكة عن نمذجة العلاقات المعقّدة في البيانات. لذلك تُعدّ اللاخطية شرطًا أساسيًا لقدرة الشبكات العميقة التعبيرية.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/شبكة_عصبونية_اصطناعية"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-3", "question": "في خوارزمية «الانتشار الخلفي» (Backpropagation)، ما الذي يحدث فعليًا أثناء تدريب الشبكة؟", "choices": ["تُحذف البيانات الخاطئة من مجموعة التدريب", "تُعاد كتابة بنية الشبكة بعد كل مثال", "تُنسخ الشبكة عدة نسخ ويُختار أفضلها عشوائيًا", "تُحسَب مساهمة كل وزن في الخطأ عبر المشتقات، ثم تُعدَّل الأوزان تدريجيًا لتقليل الخطأ"], "answer": "تُحسَب مساهمة كل وزن في الخطأ عبر المشتقات، ثم تُعدَّل الأوزان تدريجيًا لتقليل الخطأ", "answerIndex": 3, "explanation": "يقيس الانتشار الخلفي خطأ التنبؤ ثم يوزّعه عكسيًا عبر الطبقات باستخدام قاعدة السلسلة في التفاضل، فيُعرف مقدار تعديل كل وزن. ومع تكرار العملية على أمثلة كثيرة عبر الانحدار التدرّجي تنخفض الخسارة تدريجيًا ويتحسّن أداء النموذج.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_عميق"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-4", "question": "لماذا تُعدّ الشبكات العصبية الالتفافية (CNN) مناسبة خصوصًا لمعالجة الصور؟", "choices": ["لأنها تحوّل الصورة إلى نص قبل تحليلها", "لأنها لا تستخدم أي أوزان قابلة للتعلّم", "لأنها تبحث عن الأنماط المحلية نفسها في كل مواضع الصورة بمشاركة الأوزان، فتتعرّف على السمة أينما ظهرت", "لأنها تعالج كل بكسل بمعزل تام دون أي علاقة بجواره"], "answer": "لأنها تبحث عن الأنماط المحلية نفسها في كل مواضع الصورة بمشاركة الأوزان، فتتعرّف على السمة أينما ظهرت", "answerIndex": 2, "explanation": "تستخدم الشبكات الالتفافية مرشّحات صغيرة تنساب على الصورة كلها بوزن واحد مشترك، فإذا تعلّم المرشّح رصد حافة أو عين في موضع ما رصدها في أي موضع آخر. هذه الخاصية تجعلها كفؤة وقوية في مهام الرؤية الحاسوبية كتصنيف الصور.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/شبكة_عصبونية_التفافية"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-5", "question": "ما المقصود بـ«فرط التخصيص» (Overfitting) في نموذج تعلّم آلي؟", "choices": ["أن يكون النموذج كبير الحجم من حيث عدد المعاملات", "أن يحفظ النموذج بيانات التدريب بضجيجها فيفشل في التعميم على بيانات جديدة لم يرها", "أن يستغرق التدريب وقتًا طويلًا", "أن تزيد دقة النموذج على بيانات الاختبار عن دقته على التدريب"], "answer": "أن يحفظ النموذج بيانات التدريب بضجيجها فيفشل في التعميم على بيانات جديدة لم يرها", "answerIndex": 1, "explanation": "يحدث فرط التخصيص حين يتعلّم النموذج تفاصيل بيانات التدريب وضجيجها بدل الأنماط العامة، فترتفع دقته عليها وتنخفض على البيانات الجديدة. يُكتشف بمقارنة الأداء على مجموعة اختبار منفصلة لم تدخل في التدريب.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_الآلة"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-6", "question": "طالب لاحظ أن نموذجه دقيق جدًا على بيانات التدريب لكنه ضعيف على بيانات جديدة. أي إجراء مما يأتي يعالج المشكلة مباشرة؟", "choices": ["زيادة حجم بيانات التدريب وتنويعها واستخدام تقنيات التنظيم مثل إسقاط بعض الخلايا أثناء التدريب (Dropout)", "حذف مجموعة الاختبار والاكتفاء بنتائج التدريب", "زيادة عدد الطبقات دون أي تغيير آخر", "تدريب النموذج مرات أكثر على البيانات نفسها حتى يحفظها تمامًا"], "answer": "زيادة حجم بيانات التدريب وتنويعها واستخدام تقنيات التنظيم مثل إسقاط بعض الخلايا أثناء التدريب (Dropout)", "answerIndex": 0, "explanation": "المشكلة فرط تخصيص، وعلاجها أن يتعلّم النموذج الأنماط العامة لا الحفظ: بيانات أكثر وأكثر تنوّعًا، وتقنيات تنظيم مثل «الدروب أوت» التي تعطّل خلايا عشوائية أثناء التدريب فتمنع الاعتماد المفرط على مسارات بعينها. أما مزيد من الحفظ فيفاقم المشكلة.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_عميق"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-7", "question": "ما المقصود بـ«معاملات» النموذج (Parameters) التي تُقاس بالمليارات في النماذج الحديثة؟", "choices": ["عدد المستخدمين الذين جرّبوا النموذج", "عدد الأسئلة التي يستطيع النموذج الإجابة عنها", "عدد لغات البرمجة المستخدمة في بنائه", "الأوزان والانحيازات التي تتعلّمها الشبكة أثناء التدريب وتخزّن فيها ما اكتسبته"], "answer": "الأوزان والانحيازات التي تتعلّمها الشبكة أثناء التدريب وتخزّن فيها ما اكتسبته", "answerIndex": 3, "explanation": "المعاملات هي الأعداد الداخلية التي تضبطها عملية التدريب، وهي التي تختزن «معرفة» النموذج المستخلصة من البيانات. كلما زاد عددها زادت عادة قدرة النموذج التعبيرية، لكن زادت أيضًا كلفة تدريبه وتشغيله حسابيًا.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_عميق"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-8", "question": "لماذا تتفوّق بنية المحوّلات على الشبكات التكرارية القديمة (RNN) في معالجة النصوص الطويلة؟", "choices": ["لأنها تقرأ النص من النهاية إلى البداية", "لأنها لا تحتاج إلى تدريب مسبق", "لأنها تعالج الكلمات كلها دفعة واحدة بالتوازي وتربط أي كلمة بأي كلمة أخرى مباشرة عبر الانتباه", "لأنها تحذف الكلمات غير المهمة من النص نهائيًا"], "answer": "لأنها تعالج الكلمات كلها دفعة واحدة بالتوازي وتربط أي كلمة بأي كلمة أخرى مباشرة عبر الانتباه", "answerIndex": 2, "explanation": "كانت الشبكات التكرارية تعالج النص كلمةً كلمة بالتسلسل، فيصعب تدريبها بالتوازي وتضعف ذاكرتها للعلاقات البعيدة. أما المحوّلات فتعالج التسلسل كله معًا، وتربط آلية الانتباه كل موضع بأي موضع آخر مباشرة مهما بَعُد.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/نموذج_لغوي_كبير"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-9", "question": "ما الفكرة الجوهرية في «آلية الانتباه» (Attention) داخل المحوّلات؟", "choices": ["أن يتجاهل النموذج الكلمات القصيرة ويركّز على الطويلة فقط", "أن يزن النموذج أهمية كل كلمة بالنسبة إلى سائر الكلمات في السياق قبل أن يبني فهمه للجملة", "أن يقرأ النموذج الكلمات بترتيب أبجدي", "أن يحفظ النموذج الجملة كاملة دون تحليل"], "answer": "أن يزن النموذج أهمية كل كلمة بالنسبة إلى سائر الكلمات في السياق قبل أن يبني فهمه للجملة", "answerIndex": 1, "explanation": "تسمح آلية الانتباه لكل كلمة بأن «تنظر» إلى بقية الكلمات وتأخذ من كل منها بقدر صلتها بها، فيتحدد معنى الكلمة بسياقها الفعلي. وبفضلها يميّز النموذج مثلًا بين معنيي كلمة واحدة في جملتين مختلفتين.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/نموذج_لغوي_كبير"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-10", "question": "في أي عام نُشرت الورقة البحثية «الانتباه هو كل ما تحتاجه» التي قدّمت بنية المحوّل؟", "choices": ["2017", "2012", "2020", "2007"], "answer": "2017", "answerIndex": 0, "explanation": "نشر ثمانية باحثين من جوجل الورقة سنة 2017 مقدّمين بنية المحوّل القائمة على الانتباه وحده دون تكرار أو التفاف. صارت هذه البنية أساس النماذج اللغوية الحديثة مثل بيرت وسلسلة جي بي تي.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ذكاء_اصطناعي"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-11", "question": "كيف يُدرَّب النموذج اللغوي الكبير في مرحلة «التدريب المسبق» أساسًا؟", "choices": ["على حفظ قاعدة بيانات من الأسئلة والأجوبة الصحيحة فقط", "ببرمجته يدويًا بقواعد النحو لكل لغة", "على تقليد أصوات البشر وحركاتهم", "على التنبؤ بالكلمة (أو الرمز) التالي في نصوص ضخمة، فيتعلّم اللغة والأنماط من هذا الهدف وحده"], "answer": "على التنبؤ بالكلمة (أو الرمز) التالي في نصوص ضخمة، فيتعلّم اللغة والأنماط من هذا الهدف وحده", "answerIndex": 3, "explanation": "الهدف التدريبي الأساسي هو التنبؤ بالرمز التالي في تسلسلات نصية هائلة من الكتب والمواقع وغيرها. ومن هذا الهدف البسيط ظاهريًا تنشأ قدرات واسعة: فهم السياق، والترجمة، والتلخيص، وحتى حل المسائل، لأن التنبؤ الجيد يقتضي فهمًا عميقًا للأنماط.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/نموذج_لغوي_كبير"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-12", "question": "ما المقصود بـ«الرمز» (Token) في النماذج اللغوية؟", "choices": ["كلمة المرور الخاصة بالنموذج", "وحدة قياس سرعة النموذج", "وحدة نصية صغيرة (كلمة أو جزء من كلمة أو علامة) يُقسَّم إليها النص قبل معالجته", "نوع من العملات الرقمية يدفع به المستخدم"], "answer": "وحدة نصية صغيرة (كلمة أو جزء من كلمة أو علامة) يُقسَّم إليها النص قبل معالجته", "answerIndex": 2, "explanation": "لا يقرأ النموذج النص حرفًا حرفًا ولا كلمات كاملة دائمًا، بل يقطّعه إلى رموز قد تكون كلمات أو مقاطع منها أو علامات ترقيم. عدد الرموز هو ما يُقاس به طول النص المدخل وحدود «نافذة السياق» في النموذج.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/نموذج_لغوي_كبير"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-13", "question": "ما المقصود بـ«نافذة السياق» (Context Window) في نموذج لغوي؟", "choices": ["الشاشة التي يرى فيها المستخدم المحادثة", "أقصى عدد من الرموز يستطيع النموذج أخذه في الاعتبار دفعة واحدة أثناء توليد إجابته", "المدة الزمنية التي يعمل فيها النموذج قبل إيقافه", "عدد المحادثات التي يمكن فتحها في وقت واحد"], "answer": "أقصى عدد من الرموز يستطيع النموذج أخذه في الاعتبار دفعة واحدة أثناء توليد إجابته", "answerIndex": 1, "explanation": "نافذة السياق هي «ذاكرة العمل» القصيرة للنموذج: كل ما يتجاوزها من بداية المحادثة أو المستند يخرج من حسابه أثناء التوليد. لذلك قد «ينسى» النموذج ما قيل في أول محادثة طويلة جدًا، وتوسيع النافذة هدف دائم لتطوير النماذج.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/نموذج_لغوي_كبير"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-14", "question": "لماذا قد يقدّم نموذج لغوي إجابة خاطئة بصياغة واثقة تمامًا، فيما يُعرف بـ«الهلوسة»؟", "choices": ["لأنه يولّد النص الأكثر احتمالًا لغويًا لا الأكثر صحة، فهو متنبّئ بالكلمات لا قاعدة حقائق موثّقة", "لأنه يتعمد خداع المستخدم", "لأن بياناته تُحذف كل يوم وتُستبدل عشوائيًا", "لأنه ينسخ إجاباته من موقع واحد غير موثوق"], "answer": "لأنه يولّد النص الأكثر احتمالًا لغويًا لا الأكثر صحة، فهو متنبّئ بالكلمات لا قاعدة حقائق موثّقة", "answerIndex": 0, "explanation": "النموذج اللغوي مدرّب على إنتاج نص متماسك محتمل، لا على التحقق من الحقائق؛ فحين تنقصه المعلومة قد «يملأ الفراغ» بنص سلس يبدو صحيحًا وهو مختلَق. لذلك تبقى مراجعة مخرجاته في المعلومات الحساسة ضرورة لا رفاهية.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/نموذج_لغوي_كبير"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-15", "question": "ما الفرق بين «التدريب المسبق» و«الضبط الدقيق» (Fine-tuning) لنموذج لغوي؟", "choices": ["التدريب المسبق يتم بعد طرح النموذج للجمهور، والضبط الدقيق قبله", "الضبط الدقيق يلغي كل ما تعلّمه النموذج في التدريب المسبق", "لا فرق بينهما؛ مصطلحان لمسمى واحد", "التدريب المسبق يبني القدرات العامة من نصوص ضخمة، والضبط الدقيق يكيّف النموذج بعد ذلك لمهمة أو أسلوب محدد ببيانات أصغر"], "answer": "التدريب المسبق يبني القدرات العامة من نصوص ضخمة، والضبط الدقيق يكيّف النموذج بعد ذلك لمهمة أو أسلوب محدد ببيانات أصغر", "answerIndex": 3, "explanation": "في التدريب المسبق يتعلّم النموذج اللغة والمعرفة العامة من كم هائل من النصوص بكلفة ضخمة. ثم يأتي الضبط الدقيق ببيانات أقل بكثير ليوجّه هذا الأساس نحو سلوك مطلوب، كالمحادثة المساعِدة أو أسلوب مؤسسة معينة.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/نموذج_لغوي_كبير"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-16", "question": "كم بلغ تقريبًا عدد معاملات نموذج «جي بي تي-3» الذي صدر سنة 2020؟", "choices": ["175 مليون معامل", "1.75 مليار معامل", "175 مليار معامل", "17.5 تريليون معامل"], "answer": "175 مليار معامل", "answerIndex": 2, "explanation": "بلغ جي بي تي-3 نحو 175 مليار معامل، وكان قفزة هائلة في الحجم وقتها. وأظهر قدرة لافتة على أداء مهام لم يُدرَّب عليها صراحة بمجرد إعطائه أمثلة قليلة داخل نص الطلب.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ذكاء_اصطناعي"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-17", "question": "في أي نمط تعلّم تُزوَّد الخوارزمية بأمثلة مصحوبة بإجاباتها الصحيحة (وسوم) أثناء التدريب؟", "choices": ["التعلّم دون إشراف", "التعلّم بالإشراف", "التعلّم المعزّز", "التعلّم بالمحاكاة الحرفية"], "answer": "التعلّم بالإشراف", "answerIndex": 1, "explanation": "في التعلّم بالإشراف يتعلّم النموذج من أزواج (مدخل، إجابة صحيحة) مثل صور موسومة بأسماء ما فيها. يقارن تنبؤه بالإجابة ويصحّح نفسه حتى يتقن المهمة، وهو النمط الغالب في التصنيف والتنبؤ.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_الآلة"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-18", "question": "ما مهمة «التعلّم دون إشراف» الأساسية؟", "choices": ["اكتشاف بنى وأنماط خفية في بيانات غير موسومة، كتجميع العناصر المتشابهة في عناقيد", "حفظ الإجابات الصحيحة عن ظهر قلب", "مكافأة النموذج ومعاقبته على أفعاله", "ترجمة النصوص بين اللغات"], "answer": "اكتشاف بنى وأنماط خفية في بيانات غير موسومة، كتجميع العناصر المتشابهة في عناقيد", "answerIndex": 0, "explanation": "لا توجد في التعلّم دون إشراف إجابات جاهزة؛ بل يبحث النموذج عن بنية داخلية في البيانات، كأن يجمّع العملاء في شرائح متشابهة أو يكتشف الموضوعات المتكررة في نصوص. يُستخدم حيث يصعب وسم البيانات أو يستحيل.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_الآلة"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-19", "question": "على ماذا يقوم «التعلّم المعزّز» (Reinforcement Learning)؟", "choices": ["مدرّب يشرح للآلة القواعد خطوة بخطوة", "قاعدة بيانات ثابتة من الحلول الجاهزة", "تصويت مجموعة من النماذج على الإجابة", "وكيل يتعلّم بالتجربة والخطأ مسترشدًا بإشارات مكافأة وعقاب يسعى لتعظيم مجموعها"], "answer": "وكيل يتعلّم بالتجربة والخطأ مسترشدًا بإشارات مكافأة وعقاب يسعى لتعظيم مجموعها", "answerIndex": 3, "explanation": "في التعلّم المعزّز يتصرّف وكيل داخل بيئة، فيتلقّى مكافأة أو عقابًا بحسب نتائج أفعاله، ويتعلّم تدريجيًا سياسة تزيد مكافآته على المدى الطويل. بهذه الطريقة أُتقنت ألعاب معقّدة ووُجّهت روبوتات وأنظمة تحكّم.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_معزز"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-20", "question": "كيف تعلّم نظام «ألفا غو زيرو» لعب «غو» حتى تفوّق على النسخة التي هزمت بطلًا بشريًا؟", "choices": ["بحفظ جميع المباريات البشرية المسجلة عبر التاريخ", "بتلقّي تعليمات مباشرة من أبطال اللعبة أثناء اللعب", "باللعب ضد نفسه ملايين المرات من الصفر دون الاطلاع على أي مباراة بشرية", "بالبحث الشامل في كل الأوضاع الممكنة للعبة"], "answer": "باللعب ضد نفسه ملايين المرات من الصفر دون الاطلاع على أي مباراة بشرية", "answerIndex": 2, "explanation": "بدأ ألفا غو زيرو بمعرفة قواعد اللعبة فقط، ثم واجه نفسه مرارًا متعلّمًا من نتائج مبارياته الذاتية بالتعلّم المعزّز. وخلال أيام تجاوز النسخة السابقة وهزمها بمئة مباراة مقابل لا شيء، دليلًا على قوة التعلّم من التجربة الذاتية.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ألفا_غو"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-21", "question": "لماذا صارت وحدات معالجة الرسوميات (GPU) عاملًا حاسمًا في طفرة التعلّم العميق بعد 2012؟", "choices": ["لأنها تعرض الصور بدقة أعلى على الشاشة", "لأنها تنفّذ آلاف العمليات الحسابية المتوازية التي تتطلبها مصفوفات الشبكات العصبية بسرعة تفوق المعالجات المركزية", "لأنها تخزّن بيانات التدريب بدل الأقراص الصلبة", "لأنها تتصل بالإنترنت أسرع من غيرها"], "answer": "لأنها تنفّذ آلاف العمليات الحسابية المتوازية التي تتطلبها مصفوفات الشبكات العصبية بسرعة تفوق المعالجات المركزية", "answerIndex": 1, "explanation": "تدريب الشبكات العميقة يعني في جوهره عمليات ضرب مصفوفات ضخمة متكررة، وهي عمليات قابلة للتوازي بامتياز. وحدات معالجة الرسوميات مصممة أصلًا لآلاف الحسابات المتزامنة، فاختصرت زمن التدريب من أسابيع إلى أيام ومهّدت لثورة 2012.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/وحدة_معالجة_الرسوميات"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-22", "question": "ما المقصود بـ«الضبط بالتعليم البشري» (RLHF) المستخدم في نماذج المحادثة الحديثة؟", "choices": ["تدريب إضافي يرتّب فيه بشرٌ مخرجات النموذج من الأفضل إلى الأسوأ، فيتعلّم النموذج تفضيل الإجابات المفيدة والآمنة", "أن يراجع البشر كل إجابة قبل إرسالها للمستخدم لحظة بلحظة", "أن يكتب البشر جميع إجابات النموذج بأنفسهم", "حذف النموذج وإعادة بنائه كلما أخطأ"], "answer": "تدريب إضافي يرتّب فيه بشرٌ مخرجات النموذج من الأفضل إلى الأسوأ، فيتعلّم النموذج تفضيل الإجابات المفيدة والآمنة", "answerIndex": 0, "explanation": "بعد التدريب المسبق والضبط الدقيق، يقارن مقيّمون بشر بين إجابات النموذج ويرتّبونها، فيتدرّب نموذج مكافأة على هذه التفضيلات ويُستخدم لتوجيه النموذج اللغوي نحو إجابات أجود وأسلم. هذه الخطوة من أسرار تحوّل النماذج الخام إلى مساعدات محادثة ناجحة.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/نموذج_لغوي_كبير"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-23", "question": "لماذا تحتاج النماذج الحديثة إلى بيانات تدريب ضخمة جدًا؟", "choices": ["لأن القانون يفرض حدًا أدنى لحجم البيانات", "لأن البيانات الكثيرة تجعل النموذج أبطأ وهو المطلوب", "لأنه لا يمكن تدريب أي نموذج بأقل من مليار مثال", "لأن الأنماط الدقيقة للغة والصور والعالم لا تُستخلص إلا من أمثلة هائلة التنوّع، وقلة البيانات تؤدي إلى تعميم ضعيف"], "answer": "لأن الأنماط الدقيقة للغة والصور والعالم لا تُستخلص إلا من أمثلة هائلة التنوّع، وقلة البيانات تؤدي إلى تعميم ضعيف", "answerIndex": 3, "explanation": "كلما تنوّعت الأمثلة التي يراها النموذج ازدادت قدرته على التقاط الأنماط العامة بدل خصوصيات أمثلة قليلة. لذلك تزامن تقدّم النماذج مع توفّر نصوص وصور الإنترنت الضخمة وقدرة حسابية توازيها.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_الآلة"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-24", "question": "شركة درّبت نظام فرز طلبات توظيف على بيانات قبول تاريخية كانت تميل لفئة معينة، فصار النظام يظلم فئات أخرى. ما اسم المشكلة وأصلها؟", "choices": ["فرط التخصيص: النموذج حفظ البيانات أكثر من اللازم", "الهلوسة: النموذج اختلق بيانات غير موجودة", "انحياز البيانات: النموذج تعلّم التحيّز الموجود في بيانات تدريبه وكرّره", "خطأ في وحدة معالجة الرسوميات"], "answer": "انحياز البيانات: النموذج تعلّم التحيّز الموجود في بيانات تدريبه وكرّره", "answerIndex": 2, "explanation": "النماذج تتعلّم ما في بياناتها بما فيه من تحيّزات تاريخية؛ فإذا كانت قرارات الماضي منحازة صار النموذج منحازًا ولو لم يقصد مصمموه. علاج ذلك يبدأ بفحص البيانات وتمثيلها العادل وقياس أداء النموذج على الفئات المختلفة قبل إطلاقه.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_الآلة"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-25", "question": "ما الفرق الدقيق بين «الحفظ» و«التعميم» في سلوك النموذج؟", "choices": ["الحفظ للصور والتعميم للنصوص فقط", "الحفظ استرجاع ما رآه في التدريب حرفيًا، والتعميم تطبيق ما تعلّمه بنجاح على حالات جديدة لم يرها", "التعميم أن يجيب النموذج بسرعة أكبر", "لا فرق؛ فكل إجابة صحيحة دليل تعميم"], "answer": "الحفظ استرجاع ما رآه في التدريب حرفيًا، والتعميم تطبيق ما تعلّمه بنجاح على حالات جديدة لم يرها", "answerIndex": 1, "explanation": "قيمة النموذج الحقيقية في التعميم: أن يستخلص قاعدة عامة تصلح لما لم يره من قبل. أما الحفظ وحده فينهار أمام أول اختلاف عن أمثلة التدريب، ولذلك تُقاس النماذج دائمًا على بيانات محتجبة عنها أثناء التدريب.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_الآلة"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-26", "question": "لماذا يفصل الباحثون «مجموعة اختبار» لا يطّلع عليها النموذج أثناء التدريب إطلاقًا؟", "choices": ["لقياس قدرته الحقيقية على التعميم على بيانات جديدة، لا قدرته على تذكّر ما تدرب عليه", "لإخفاء البيانات عن المنافسين فقط", "لأن النموذج يرفض التعلم من كل البيانات دفعة واحدة", "لتوفير مساحة التخزين"], "answer": "لقياس قدرته الحقيقية على التعميم على بيانات جديدة، لا قدرته على تذكّر ما تدرب عليه", "answerIndex": 0, "explanation": "لو قِيس النموذج على بيانات تدريبه لحصلنا على صورة مضللة متفائلة، إذ قد يكون حافظًا لها. مجموعة الاختبار المحتجبة تحاكي مواجهة العالم الحقيقي ببيانات لم يسبق رؤيتها، فتكشف فرط التخصيص والانحياز.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_الآلة"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-27", "question": "نظام تعرّف على الوجوه دقيق على فئة من الناس وضعيف على فئات أخرى. ما التفسير الأرجح؟", "choices": ["كاميرات التصوير كانت قديمة", "النموذج يحتاج إلى شاشة أكبر", "وجوه الفئات الأخرى تتغير أسرع من غيرها", "بيانات تدريبه لم تُمثّل الفئات الضعيفة الأداء تمثيلًا كافيًا ومتوازنًا"], "answer": "بيانات تدريبه لم تُمثّل الفئات الضعيفة الأداء تمثيلًا كافيًا ومتوازنًا", "answerIndex": 3, "explanation": "حين تنقص أمثلة فئة ما في بيانات التدريب يتعلّم النموذج سماتها بدرجة أقل فيخطئ عليها أكثر. هذه من أشهر صور انحياز البيانات، وتُعالج بجمع بيانات ممثِّلة لكل الفئات واختبار الأداء على كل فئة على حدة.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ذكاء_اصطناعي"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-28", "question": "ما المقصود بمقولة «نفايات تدخل، نفايات تخرج» (Garbage In, Garbage Out) في سياق الذكاء الاصطناعي؟", "choices": ["أن النماذج تولّد نفايات إلكترونية كثيرة", "أن حذف البيانات القديمة يحسّن النموذج دائمًا", "مهما بلغت قوة الخوارزمية، فإن بيانات تدريب رديئة أو خاطئة أو منحازة تنتج نموذجًا رديئًا بالضرورة", "أن البيانات يجب أن تكون نصية فقط"], "answer": "مهما بلغت قوة الخوارزمية، فإن بيانات تدريب رديئة أو خاطئة أو منحازة تنتج نموذجًا رديئًا بالضرورة", "answerIndex": 2, "explanation": "جودة النموذج سقفها جودة بياناته: أخطاء الوسم والتكرار والتحيّز وسوء التمثيل تنتقل كلها إلى سلوك النموذج. لذلك تُنفق فرق الذكاء الاصطناعي جهدًا ضخمًا في جمع البيانات وتنقيتها وتدقيقها قبل التدريب وبعده.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_الآلة"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-29", "question": "ما الفرق الجوهري بين الذكاء الاصطناعي «التوليدي» و«التمييزي»؟", "choices": ["التوليدي أقدم تاريخيًا من التمييزي دائمًا", "التوليدي ينشئ محتوى جديدًا كالنصوص والصور، والتمييزي يصنّف المدخلات أو يتنبأ بقيمة لها", "التمييزي يعمل بالنصوص فقط والتوليدي بالصور فقط", "لا فرق بينهما إلا في الاسم التجاري"], "answer": "التوليدي ينشئ محتوى جديدًا كالنصوص والصور، والتمييزي يصنّف المدخلات أو يتنبأ بقيمة لها", "answerIndex": 1, "explanation": "النموذج التمييزي يرسم حدودًا بين فئات، كأن يقرر أن هذه الصورة لقطّ أو كلب أو أن هذه الرسالة مزعجة. أما التوليدي فيتعلّم توزيع البيانات ذاته فيستطيع إنتاج أمثلة جديدة منها: فقرة مكتوبة أو صورة لم توجد من قبل.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ذكاء_اصطناعي_توليدي"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-30", "question": "كيف تولّد نماذج «الانتشار» (Diffusion) الصور من وصف نصي، بمفهوم مبسّط دقيق؟", "choices": ["تتعلّم عكس عملية التشويش: تبدأ من ضجيج عشوائي وتزيله تدريجيًا موجَّهة بالوصف حتى تتكوّن صورة متماسكة", "تبحث في الإنترنت عن أقرب صورة جاهزة وتنسخها", "ترسم الصورة خطًا خطًا كما يرسم الإنسان", "تجمع أجزاء من صور مخزنة وتلصقها معًا"], "answer": "تتعلّم عكس عملية التشويش: تبدأ من ضجيج عشوائي وتزيله تدريجيًا موجَّهة بالوصف حتى تتكوّن صورة متماسكة", "answerIndex": 0, "explanation": "أثناء التدريب تُفسَد الصور بإضافة ضجيج متدرج، ويتعلّم النموذج إزالته خطوة خطوة. عند التوليد ينطلق من ضجيج محض ويزيله موجَّهًا بالوصف النصي، فتنبثق صورة جديدة لم تكن موجودة في أي مصدر.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ذكاء_اصطناعي_توليدي"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-31", "question": "ما الذي يجعل نظامًا ما «وكيل ذكاء اصطناعي» (AI Agent) وليس مجرد نموذج محادثة؟", "choices": ["أنه يجيب بصوت بشري لا بنص", "أنه يعمل دون اتصال بالإنترنت", "أنه يملك حسابًا على مواقع التواصل", "قدرته على إدراك هدفه وتخطيط خطوات متسلسلة واستخدام أدوات خارجية وتنفيذ أفعال في العالم الرقمي أو الواقعي"], "answer": "قدرته على إدراك هدفه وتخطيط خطوات متسلسلة واستخدام أدوات خارجية وتنفيذ أفعال في العالم الرقمي أو الواقعي", "answerIndex": 3, "explanation": "النموذج اللغوي وحده يولّد نصًا؛ أما الوكيل فيغلّفه بنظام يدرك البيئة ويخطط ويستدعي أدوات كالبحث والحاسبة وتنفيذ الشيفرات ويتابع النتائج ليصحّح مساره نحو هدف. هذا الانتقال من «الإجابة» إلى «الإنجاز» هو جوهر موجة الوكلاء الحديثة.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ذكاء_اصطناعي"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-32", "question": "في أي عام أُطلق «تشات جي بي تي» وبدأت به طفرة الذكاء الاصطناعي التوليدي الجماهيرية؟", "choices": ["2017", "2012", "2022", "2019"], "answer": "2022", "answerIndex": 2, "explanation": "أطلقت شركة أوبن إيه آي روبوت المحادثة تشات جي بي تي في 30 نوفمبر 2022، وبلغ مستخدموه نحو مئة مليون خلال شهرين، أسرع نمو لتطبيق استهلاكي حتى ذلك الحين. وأشعل إطلاقه سباق الشركات الكبرى في النماذج التوليدية.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ذكاء_اصطناعي"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-33", "question": "مدرّس طلب من نموذج توليد صورة «مكتبة قديمة داخل شجرة عملاقة وقت الغروب»، فأنتج صورة لم توجد من قبل. ما الذي يفسّر قدرته على ذلك؟", "choices": ["بحث في أرشيفه فوجد صورة مطابقة التُقطت سابقًا", "تعلّم من ملايين الصور الموصوفة الربط بين المفاهيم البصرية والكلمات، فيركّب مشهدًا جديدًا من أنماط تعلّمها", "اتصل بفنان بشري رسمها له في الخلفية", "نسخ صورة واحدة وغيّر ألوانها فقط"], "answer": "تعلّم من ملايين الصور الموصوفة الربط بين المفاهيم البصرية والكلمات، فيركّب مشهدًا جديدًا من أنماط تعلّمها", "answerIndex": 1, "explanation": "النماذج التوليدية لا تستخرج صورًا جاهزة، بل تعلّمت توزيعات الأنماط البصرية وعلاقتها بالأوصاف اللغوية. عند التوليد تدمج هذه الأنماط بتركيب جديد يستجيب للوصف، فتخرج صورة أصلية التركيب وإن كانت مبنية على ما تعلّمته.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ذكاء_اصطناعي_توليدي"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-34", "question": "بمَ اشتهر نظام «ألفا فولد» (AlphaFold) الذي نال مطوّروه نصف جائزة نوبل في الكيمياء سنة 2024؟", "choices": ["التنبؤ بالبنية ثلاثية الأبعاد للبروتينات من تسلسل أحماضها الأمينية بدقة عالية", "اكتشاف عنصر كيميائي جديد", "هزيمة بطل العالم في الشطرنج", "ترجمة النصوص القديمة المسمارية"], "answer": "التنبؤ بالبنية ثلاثية الأبعاد للبروتينات من تسلسل أحماضها الأمينية بدقة عالية", "answerIndex": 0, "explanation": "شكل البروتين ثلاثي الأبعاد يحدد وظيفته، وكان التنبؤ به من التسلسل مشكلة عصية لعقود. حلّها ألفا فولد بدرجة أحدثت ثورة في البيولوجيا واكتشاف الأدوية، فاستحق مطوّروه من ديب مايند نصف نوبل الكيمياء 2024.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ألفافولد"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-35", "question": "كيف يختصر الذكاء الاصطناعي رحلة اكتشاف دواء جديد؟", "choices": ["يستغني تمامًا عن التجارب السريرية على البشر", "يصنع الدواء النهائي آليًا دون أي إشراف", "يخترع أمراضًا جديدة لتجربة الأدوية عليها", "يتنبأ بتفاعل ملايين المركّبات المرشّحة مع الهدف المرضي فيرشّح الواعدة منها للتجارب بدل فحص الكل مخبريًا"], "answer": "يتنبأ بتفاعل ملايين المركّبات المرشّحة مع الهدف المرضي فيرشّح الواعدة منها للتجارب بدل فحص الكل مخبريًا", "answerIndex": 3, "explanation": "الفحص المخبري لكل مركّب مرشّح بطيء ومكلف؛ أما النماذج فتتنبأ بالارتباط والسمّية والخواص لملايين الجزيئات حسابيًا وتقدّم قائمة قصيرة واعدة. يبقى التحقق المخبري والسريري واجبًا، لكن نقطة البداية صارت أذكى بكثير.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ذكاء_اصطناعي"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-36", "question": "ما الميزة التي أظهرتها نماذج الذكاء الاصطناعي الحديثة في التنبؤ بالطقس مقارنة بالنماذج الفيزيائية التقليدية؟", "choices": ["التنبؤ بالطقس لسنوات كاملة بدقة تامة", "الاستغناء عن بيانات الأقمار الصناعية نهائيًا", "تنبؤات بعشرة أيام بدقة تنافس التقليدية أو تفوقها، وبحوسبة أسرع وأرخص بكثير بعد التدريب", "التنبؤ بالزلازل قبل وقوعها بأشهر"], "answer": "تنبؤات بعشرة أيام بدقة تنافس التقليدية أو تفوقها، وبحوسبة أسرع وأرخص بكثير بعد التدريب", "answerIndex": 2, "explanation": "النماذج الفيزيائية تحلّ معادلات الغلاف الجوي على حواسيب عملاقة لساعات؛ أما نماذج تعلّم آلي مدرّبة على عقود من بيانات الطقس فتنتج تنبؤًا منافسًا في دقائق على عتاد أصغر. لا يعني ذلك نهاية النماذج التقليدية، لكنه تحوّل حقيقي في المجال.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ذكاء_اصطناعي"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-37", "question": "سيارة تساعد السائق بالتوجيه والسرعة لكنها تتطلب انتباهه الدائم واستعداده للتدخل فورًا. في أي مستوى من مستويات القيادة الذاتية (0–5) تقع؟", "choices": ["المستوى الخامس: قيادة ذاتية كاملة", "المستوى الثاني: أتمتة جزئية والسائق مسؤول ومراقب طوال الوقت", "المستوى الرابع: قيادة ذاتية عالية دون أي مراقبة في كل الظروف", "المستوى صفر: لا أتمتة إطلاقًا"], "answer": "المستوى الثاني: أتمتة جزئية والسائق مسؤول ومراقب طوال الوقت", "answerIndex": 1, "explanation": "في المستوى الثاني تجمع السيارة بين التحكم في التوجيه والسرعة، لكن السائق يظل مسؤولًا قانونيًا وعمليًا ويجب أن يراقب الطريق دائمًا. أما المستوى الخامس فهو القيادة الذاتية الكاملة في كل الظروف دون أي تدخل بشري، ولم يتحقق تجاريًا بعد.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/سيارة_ذاتية_القيادة"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-38", "question": "ماذا يعني بلوغ مركبة «المستوى الخامس» من القيادة الذاتية؟", "choices": ["أن تقود نفسها في جميع الظروف والأماكن دون أي تدخل أو مراقبة بشرية", "أن تسير بسرعة 500 كيلومتر في الساعة", "أن تعمل بالطاقة الشمسية فقط", "أن تستغني عن العجلات والمكابح"], "answer": "أن تقود نفسها في جميع الظروف والأماكن دون أي تدخل أو مراقبة بشرية", "answerIndex": 0, "explanation": "المستوى الخامس هو قمة سلّم الأتمتة: نظام يقود في كل سيناريو قد يواجهه سائق بشري، بلا مقود إلزامي ولا سائق احتياطي. ما يتوفر تجاريًا اليوم يقف عند المستويين الثاني والثالث تقريبًا، مع تجارب محدودة للمستوى الرابع في مناطق محددة.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/سيارة_ذاتية_القيادة"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-39", "question": "ما خطر «التزييف العميق» (Deepfake) الأساسي على المجتمع؟", "choices": ["أنه يجعل الصور أجمل من الواقع", "أنه يرفع جودة كاميرات الهواتف", "أنه يمنع الناس من التصوير نهائيًا", "تصنيع مقاطع صوت وصورة مزيفة مقنعة لأشخاص حقيقيين تُستخدم في الاحتيال والتضليل وتقويض الثقة بالمشاهدات"], "answer": "تصنيع مقاطع صوت وصورة مزيفة مقنعة لأشخاص حقيقيين تُستخدم في الاحتيال والتضليل وتقويض الثقة بالمشاهدات", "answerIndex": 3, "explanation": "تتيح تقنيات التوليد وضع كلام لم يُقَل على ألسنة أشخاص حقيقيين بإقناع متزايد، فتُستغل في الابتزاز والأخبار الزائفة والتأثير السياسي. ومع انتشارها ينشأ خطر معاكس أيضًا: أن يُنكَر كل دليل حقيقي بدعوى أنه مزيّف.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تزييف_عميق"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-40", "question": "لماذا تُعدّ «الخصوصية» قضية مركزية في تدريب النماذج الكبيرة؟", "choices": ["لأن النماذج تطلب كلمة مرور المستخدم دائمًا", "لأن البيانات الضخمة تحتاج إلى غرف مغلقة", "لأنها تُدرَّب على بيانات جُمعت من الإنترنت قد تتضمن معلومات شخصية، وقد تتسرّب في مخرجاتها أو تُستخدم بلا موافقة أصحابها", "لأن المستخدمين لا يحبون التكنولوجيا عمومًا"], "answer": "لأنها تُدرَّب على بيانات جُمعت من الإنترنت قد تتضمن معلومات شخصية، وقد تتسرّب في مخرجاتها أو تُستخدم بلا موافقة أصحابها", "answerIndex": 2, "explanation": "جُمعت بيانات التدريب من الويب على نطاق هائل، وفيها نصوص وصور قد تخص أفرادًا لم يوافقوا على هذا الاستخدام. وقد تحفظ النماذج أجزاء حرفية وتفصح عنها، لذا تشترط تشريعات حديثة أساسًا قانونيًا للمعالجة وحقوقًا للأفراد على بياناتهم.", "type": "mcq", "topic": "", "source": "https://www.unesco.org/en/artificial-intelligence/recommendation-ethics"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-41", "question": "ما القانون الأوروبي الذي يُعدّ أول تشريع شامل لتنظيم الذكاء الاصطناعي في العالم، وما منهجه؟", "choices": ["قانون حماية البيانات، ويمنع الإنترنت ليلًا", "قانون الذكاء الاصطناعي الأوروبي، ويصنّف التطبيقات بحسب درجة خطورتها فيفرض قيودًا أشد على الأخطر", "قانون براءات الاختراع، ويمنع النماذج مفتوحة المصدر", "قانون التجارة الإلكترونية، وينظّم الإعلانات فقط"], "answer": "قانون الذكاء الاصطناعي الأوروبي، ويصنّف التطبيقات بحسب درجة خطورتها فيفرض قيودًا أشد على الأخطر", "answerIndex": 1, "explanation": "اعتمد الاتحاد الأوروبي قانونه للذكاء الاصطناعي بمنهج قائم على المخاطر: ممارسات محظورة تمامًا كالتلاعب الخفي، ومتطلبات صارمة للتطبيقات عالية الخطورة كالتوظيف والتعليم، والتزامات أخف لما دونها. وهو نموذج تستلهم منه تشريعات كثيرة حول العالم.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ذكاء_اصطناعي"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-42", "question": "ما المكانة التاريخية لتوصية اليونسكو بشأن أخلاقيات الذكاء الاصطناعي الصادرة سنة 2021؟", "choices": ["أول معيار عالمي في المجال اعتمدته 193 دولة، يرتكز على حقوق الإنسان والشفافية والعدالة والإشراف البشري", "أول قانون يجرّم استخدام الحاسوب في المدارس", "أول اتفاقية لتجارة الرقائق الإلكترونية", "أول مسابقة عالمية للروبوتات"], "answer": "أول معيار عالمي في المجال اعتمدته 193 دولة، يرتكز على حقوق الإنسان والشفافية والعدالة والإشراف البشري", "answerIndex": 0, "explanation": "في نوفمبر 2021 اعتمدت الدول الأعضاء في اليونسكو وعددها 193 أول إطار عالمي لأخلاقيات الذكاء الاصطناعي. تقضي التوصية بأن يحترم الذكاء الاصطناعي كرامة الإنسان وحقوقه، وتجعل الشفافية والإنصاف والرقابة البشرية مبادئ حاكمة لتطويره واستخدامه.", "type": "mcq", "topic": "", "source": "https://www.unesco.org/en/artificial-intelligence/recommendation-ethics"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-43", "question": "كيف يصف التحليل المتوازن أثر الذكاء الاصطناعي في مستقبل الوظائف؟", "choices": ["سيُلغي جميع الوظائف خلال عام واحد", "لن يؤثر في أي وظيفة إطلاقًا", "سيخلق وظائف للروبوتات فقط دون البشر", "يؤتمت مهامّ بعينها داخل الوظائف فيغيّر طبيعتها ويخلق وظائف جديدة، أكثر من كونه إلغاءً شاملًا للعمل البشري"], "answer": "يؤتمت مهامّ بعينها داخل الوظائف فيغيّر طبيعتها ويخلق وظائف جديدة، أكثر من كونه إلغاءً شاملًا للعمل البشري", "answerIndex": 3, "explanation": "التقارير الدولية ترى أن الذكاء الاصطناعي يعيد تشكيل المهام: يختفي بعضها ويتغيّر معظمها وتولد أدوار جديدة في الإشراف والتطوير والتحقق. التحدي الحقيقي انتقالٌ منظم عبر التعليم والتدريب المستمر لا نهاية العمل نفسه.", "type": "mcq", "topic": "", "source": "https://www.unesco.org/en/artificial-intelligence/recommendation-ethics"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-44", "question": "تسبّب نظام ذكاء اصطناعي في قرار خاطئ أضرّ بشخص. ما الموقف الأخلاقي والقانوني السليم بشأن المسؤولية؟", "choices": ["يُحاسَب النموذج نفسه لأنه كيان مسؤول", "لا أحد مسؤول ما دام الخطأ آليًا", "لا تختفي المسؤولية: يتحمّلها البشر والمؤسسات التي طوّرت النظام أو نشرته أو استخدمته، لذا وجب الإشراف البشري وقابلية الطعن في القرار", "يتحمّل المستخدم المتضرر المسؤولية وحده دائمًا"], "answer": "لا تختفي المسؤولية: يتحمّلها البشر والمؤسسات التي طوّرت النظام أو نشرته أو استخدمته، لذا وجب الإشراف البشري وقابلية الطعن في القرار", "answerIndex": 2, "explanation": "النموذج ليس شخصًا قانونيًا ولا أخلاقيًا يُساءل؛ المسؤولية تقع على من صمّم ودرّب ونشر وشغّل. لذلك تشترط الأطر الأخلاقية إشرافًا بشريًا فعليًا على القرارات المصيرية وحقًا للمتضرر في التفسير والاعتراض.", "type": "mcq", "topic": "", "source": "https://www.unesco.org/en/artificial-intelligence/recommendation-ethics"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-45", "question": "ما مشكلة «الصندوق الأسود» في النماذج العميقة، ولماذا تهمّ في الطب والقضاء؟", "choices": ["أن لون أجهزة الحاسوب أسود غالبًا", "يصعب تفسير سبب وصول النموذج إلى قرار بعينه رغم دقته، وقرارات مصيرية بلا تفسير يصعب الوثوق بها والطعن فيها", "أن النماذج تتوقف عن العمل ليلًا", "أن بياناتها مشفّرة بكلمات مرور مجهولة"], "answer": "يصعب تفسير سبب وصول النموذج إلى قرار بعينه رغم دقته، وقرارات مصيرية بلا تفسير يصعب الوثوق بها والطعن فيها", "answerIndex": 1, "explanation": "داخل ملايين المعاملات المتشابكة لا يوجد «سبب» واحد قابل للقراءة البشرية لقرار النموذج. في مجالات كمصير مريض أو متهم يصبح غياب التفسير مشكلة عدالة وثقة، فتتنامى أبحاث «الذكاء الاصطناعي القابل للتفسير» ومتطلبات الشفافية التنظيمية.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/تعلم_عميق"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-46", "question": "من العالم الذي صاغ مصطلح «الذكاء الاصطناعي» سنة 1955 وتأسس المجال أكاديميًا في ورشة دارتموث 1956؟", "choices": ["جون مكارثي", "آلان تورنغ", "جيفري هينتون", "إيلون ماسك"], "answer": "جون مكارثي", "answerIndex": 0, "explanation": "صاغ جون مكارثي المصطلح في مقترح ورشة دارتموث التي انعقدت صيف 1956 وتُعدّ ميلاد المجال تخصصًا مستقلًا. جمعت الورشة روادًا مثل مينسكي ونيويل وسيمون الذين قادوا بحوث المجال لعقود بعدها.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ذكاء_اصطناعي"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-47", "question": "ماذا يختبر «اختبار تورنغ» الذي اقترحه آلان تورنغ سنة 1950؟", "choices": ["سرعة الحاسوب في إجراء العمليات الحسابية", "قدرة الروبوت على المشي دون سقوط", "ذاكرة الحاسوب مقارنة بذاكرة الإنسان", "ما إذا كانت محادثة آلة نصية لا تُميَّز عن محادثة إنسان، فيحكم المحاوِر أنه أمام إنسان"], "answer": "ما إذا كانت محادثة آلة نصية لا تُميَّز عن محادثة إنسان، فيحكم المحاوِر أنه أمام إنسان", "answerIndex": 3, "explanation": "في «لعبة المحاكاة» يتحاور حَكَم عبر نص مكتوب مع إنسان وآلة دون أن يراهما؛ فإذا عجز عن التمييز بينهما باستمرار عُدّت الآلة ناجحة في الاختبار. طرح تورنغ الفكرة في ورقته الشهيرة سنة 1950 وما زالت مرجعًا في نقاش معنى «التفكير» الآلي.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/اختبار_تورنغ"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-48", "question": "ما الحدث الذي أشعل ثورة التعلّم العميق سنة 2012؟", "choices": ["إطلاق أول هاتف ذكي", "اختراع شبكة الإنترنت العالمية", "فوز شبكة «أليكس نت» العميقة بمسابقة إيميج نت لتصنيف الصور بفارق كبير عن كل المنافسين", "فوز حاسوب على بطل العالم في الشطرنج"], "answer": "فوز شبكة «أليكس نت» العميقة بمسابقة إيميج نت لتصنيف الصور بفارق كبير عن كل المنافسين", "answerIndex": 2, "explanation": "في مسابقة إيميج نت 2012 خفّضت شبكة أليكس نت الالتفافية العميقة نسبة الخطأ إلى نحو 15% مقابل 26% لأقرب منافس. اعتمد نجاحها على وحدات معالجة الرسوميات وبيانات ضخمة، فاتجه المجال كله بعدها إلى التعلّم العميق.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ذكاء_اصطناعي"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-49", "question": "لماذا كان فوز «ألفا غو» على البطل الكوري لي سيدول سنة 2016 محطة فارقة تتجاوز فوز «ديب بلو» في الشطرنج 1997؟", "choices": ["لأن مباراة غو أطول زمنيًا من مباراة الشطرنج", "لأن أوضاع «غو» الممكنة تفوق عدد ذرات الكون المنظور فلا يحسمها البحث الشامل، فاحتاج الفوز إلى تعلّم و«حدس» آلي", "لأن ألفا غو أول حاسوب يلعب أي لعبة في التاريخ", "لأن لي سيدول لم يكن لاعبًا محترفًا"], "answer": "لأن أوضاع «غو» الممكنة تفوق عدد ذرات الكون المنظور فلا يحسمها البحث الشامل، فاحتاج الفوز إلى تعلّم و«حدس» آلي", "answerIndex": 1, "explanation": "هزم ديب بلو كاسباروف بقوة حسابية وبحث هائل في شجرة الشطرنج المحدودة نسبيًا. أما غو ففضاء أوضاعها فلكي الاتساع، فتطلّب فوز ألفا غو شبكات عميقة تتعلّم تقييم الأوضاع وتوجّه البحث، مقتربًا من «حدس» اللاعبين الكبار.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/ألفا_غو"}, {"grade": 13, "subject": "الذكاء الاصطناعي", "id": "h26-ai3-50", "question": "سائق يستخدم نظامًا متقدمًا لمساعدة القيادة فوقع حادث. وفق مبادئ السلامة والمسؤولية، ما التحليل الصحيح؟", "choices": ["في مستويات الأتمتة الجزئية يبقى السائق ملزمًا بالمراقبة والتدخل، فلا ينقل النظام المسؤولية عنه، ويتحمل المصنّع مسؤولية سلامة نظامه ووضوح حدوده", "النظام معفى من أي مسؤولية لأنه «ذكي»", "السائق معفى تمامًا ما دام النظام مفعّلًا", "لا يمكن تحليل الحوادث التي تشارك فيها تقنية"], "answer": "في مستويات الأتمتة الجزئية يبقى السائق ملزمًا بالمراقبة والتدخل، فلا ينقل النظام المسؤولية عنه، ويتحمل المصنّع مسؤولية سلامة نظامه ووضوح حدوده", "answerIndex": 0, "explanation": "أكثر ما يقع تجاريًا اليوم أتمتة جزئية (المستوى الثاني) يشترط فيها بقاء السائق منتبهًا مسؤولًا، وكثير من الحوادث ارتبط بثقة زائدة بالنظام. في المقابل يلتزم المصنّعون بتصميم آمن وإنذارات واضحة وعدم تسويق قدرات مضللة.", "type": "mcq", "topic": "", "source": "https://ar.wikipedia.org/wiki/سيارة_ذاتية_القيادة"}];

function ri(a,b){return a+Math.floor(RND()*(b-a+1))}
function pick(a){return a[Math.floor(RND()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(RND()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

 while(out.length<n&&tries++<300){var v=ans+ri(-sp,sp);if(v>0&&!s[v]){s[v]=1;out.push(v)}if(tries>60)sp+=2}
 return out}

var AYAH={"051057": {"a": 57, "text": "مَآ أُرِيدُ مِنْهُم مِّن رِّزْقٍۢ وَمَآ أُرِيدُ أَن يُطْعِمُونِ"}, "085008": {"a": 8, "text": "وَمَا نَقَمُوا۟ مِنْهُمْ إِلَّآ أَن يُؤْمِنُوا۟ بِٱللَّهِ ٱلْعَزِيزِ ٱلْحَمِيدِ"}, "052035": {"a": 35, "text": "أَمْ خُلِقُوا۟ مِنْ غَيْرِ شَىْءٍ أَمْ هُمُ ٱلْخَٰلِقُونَ"}, "054007": {"a": 7, "text": "خُشَّعًا أَبْصَٰرُهُمْ يَخْرُجُونَ مِنَ ٱلْأَجْدَاثِ كَأَنَّهُمْ جَرَادٌۭ مُّنتَشِرٌۭ"}, "051056": {"a": 56, "text": "وَمَا خَلَقْتُ ٱلْجِنَّ وَٱلْإِنسَ إِلَّا لِيَعْبُدُونِ"}, "096001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ"}, "083031": {"a": 31, "text": "وَإِذَا ٱنقَلَبُوٓا۟ إِلَىٰٓ أَهْلِهِمُ ٱنقَلَبُوا۟ فَكِهِينَ"}, "056077": {"a": 77, "text": "إِنَّهُۥ لَقُرْءَانٌۭ كَرِيمٌۭ"}, "104004": {"a": 4, "text": "كَلَّا ۖ لَيُنۢبَذَنَّ فِى ٱلْحُطَمَةِ"}, "084025": {"a": 25, "text": "إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۭ"}, "051028": {"a": 28, "text": "فَأَوْجَسَ مِنْهُمْ خِيفَةًۭ ۖ قَالُوا۟ لَا تَخَفْ ۖ وَبَشَّرُوهُ بِغُلَٰمٍ عَلِيمٍۢ"}, "050008": {"a": 8, "text": "تَبْصِرَةًۭ وَذِكْرَىٰ لِكُلِّ عَبْدٍۢ مُّنِيبٍۢ"}, "089015": {"a": 15, "text": "فَأَمَّا ٱلْإِنسَٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ"}, "071007": {"a": 7, "text": "وَإِنِّى كُلَّمَا دَعَوْتُهُمْ لِتَغْفِرَ لَهُمْ جَعَلُوٓا۟ أَصَٰبِعَهُمْ فِىٓ ءَاذَانِهِمْ وَٱسْتَغْشَوْا۟ ثِيَابَهُمْ وَأَصَرُّوا۟ وَٱسْتَكْبَرُوا۟ ٱسْتِكْبَارًۭا"}, "051027": {"a": 27, "text": "فَقَرَّبَهُۥٓ إِلَيْهِمْ قَالَ أَلَا تَأْكُلُونَ"}, "051055": {"a": 55, "text": "وَذَكِّرْ فَإِنَّ ٱلذِّكْرَىٰ تَنفَعُ ٱلْمُؤْمِنِينَ"}, "057024": {"a": 24, "text": "ٱلَّذِينَ يَبْخَلُونَ وَيَأْمُرُونَ ٱلنَّاسَ بِٱلْبُخْلِ ۗ وَمَن يَتَوَلَّ فَإِنَّ ٱللَّهَ هُوَ ٱلْغَنِىُّ ٱلْحَمِيدُ"}, "067004": {"a": 4, "text": "ثُمَّ ٱرْجِعِ ٱلْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ ٱلْبَصَرُ خَاسِئًۭا وَهُوَ حَسِيرٌۭ"}, "089010": {"a": 10, "text": "وَفِرْعَوْنَ ذِى ٱلْأَوْتَادِ"}, "054036": {"a": 36, "text": "وَلَقَدْ أَنذَرَهُم بَطْشَتَنَا فَتَمَارَوْا۟ بِٱلنُّذُرِ"}, "066002": {"a": 2, "text": "قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْ ۚ وَٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ"}, "051026": {"a": 26, "text": "فَرَاغَ إِلَىٰٓ أَهْلِهِۦ فَجَآءَ بِعِجْلٍۢ سَمِينٍۢ"}, "055010": {"a": 10, "text": "وَٱلْأَرْضَ وَضَعَهَا لِلْأَنَامِ"}, "071006": {"a": 6, "text": "فَلَمْ يَزِدْهُمْ دُعَآءِىٓ إِلَّا فِرَارًۭا"}, "054010": {"a": 10, "text": "فَدَعَا رَبَّهُۥٓ أَنِّى مَغْلُوبٌۭ فَٱنتَصِرْ"}, "057001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ"}, "076023": {"a": 23, "text": "إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ ٱلْقُرْءَانَ تَنزِيلًۭا"}, "056091": {"a": 91, "text": "فَسَلَٰمٌۭ لَّكَ مِنْ أَصْحَٰبِ ٱلْيَمِينِ"}, "050004": {"a": 4, "text": "قَدْ عَلِمْنَا مَا تَنقُصُ ٱلْأَرْضُ مِنْهُمْ ۖ وَعِندَنَا كِتَٰبٌ حَفِيظٌۢ"}, "052015": {"a": 15, "text": "أَفَسِحْرٌ هَٰذَآ أَمْ أَنتُمْ لَا تُبْصِرُونَ"}, "082018": {"a": 18, "text": "ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ"}, "070038": {"a": 38, "text": "أَيَطْمَعُ كُلُّ ٱمْرِئٍۢ مِّنْهُمْ أَن يُدْخَلَ جَنَّةَ نَعِيمٍۢ"}, "079027": {"a": 27, "text": "ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا"}, "052016": {"a": 16, "text": "ٱصْلَوْهَا فَٱصْبِرُوٓا۟ أَوْ لَا تَصْبِرُوا۟ سَوَآءٌ عَلَيْكُمْ ۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ"}, "105001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ ٱلْفِيلِ"}, "052024": {"a": 24, "text": "۞ وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌۭ لَّهُمْ كَأَنَّهُمْ لُؤْلُؤٌۭ مَّكْنُونٌۭ"}, "069013": {"a": 13, "text": "فَإِذَا نُفِخَ فِى ٱلصُّورِ نَفْخَةٌۭ وَٰحِدَةٌۭ"}, "067005": {"a": 5, "text": "وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ"}, "054009": {"a": 9, "text": "۞ كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ فَكَذَّبُوا۟ عَبْدَنَا وَقَالُوا۟ مَجْنُونٌۭ وَٱزْدُجِرَ"}, "072027": {"a": 27, "text": "إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا"}, "051031": {"a": 31, "text": "۞ قَالَ فَمَا خَطْبُكُمْ أَيُّهَا ٱلْمُرْسَلُونَ"}, "055015": {"a": 15, "text": "وَخَلَقَ ٱلْجَآنَّ مِن مَّارِجٍۢ مِّن نَّارٍۢ"}, "085007": {"a": 7, "text": "وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌۭ"}, "047001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ أَضَلَّ أَعْمَٰلَهُمْ"}, "078036": {"a": 36, "text": "جَزَآءًۭ مِّن رَّبِّكَ عَطَآءً حِسَابًۭا"}, "056045": {"a": 45, "text": "إِنَّهُمْ كَانُوا۟ قَبْلَ ذَٰلِكَ مُتْرَفِينَ"}, "050012": {"a": 12, "text": "كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ وَأَصْحَٰبُ ٱلرَّسِّ وَثَمُودُ"}, "071017": {"a": 17, "text": "وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلْأَرْضِ نَبَاتًۭا"}, "091013": {"a": 13, "text": "فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا"}, "079040": {"a": 40, "text": "وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ"}, "053038": {"a": 38, "text": "أَلَّا تَزِرُ وَازِرَةٌۭ وِزْرَ أُخْرَىٰ"}, "050015": {"a": 15, "text": "أَفَعَيِينَا بِٱلْخَلْقِ ٱلْأَوَّلِ ۚ بَلْ هُمْ فِى لَبْسٍۢ مِّنْ خَلْقٍۢ جَدِيدٍۢ"}, "049018": {"a": 18, "text": "إِنَّ ٱللَّهَ يَعْلَمُ غَيْبَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَٱللَّهُ بَصِيرٌۢ بِمَا تَعْمَلُونَ"}, "052012": {"a": 12, "text": "ٱلَّذِينَ هُمْ فِى خَوْضٍۢ يَلْعَبُونَ"}, "075005": {"a": 5, "text": "بَلْ يُرِيدُ ٱلْإِنسَٰنُ لِيَفْجُرَ أَمَامَهُۥ"}, "067003": {"a": 3, "text": "ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا ۖ مَّا تَرَىٰ فِى خَلْقِ ٱلرَّحْمَٰنِ مِن تَفَٰوُتٍۢ ۖ فَٱرْجِعِ ٱلْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍۢ"}, "056060": {"a": 60, "text": "نَحْنُ قَدَّرْنَا بَيْنَكُمُ ٱلْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ"}, "091014": {"a": 14, "text": "فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا"}, "055074": {"a": 74, "text": "لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ"}, "073005": {"a": 5, "text": "إِنَّا سَنُلْقِى عَلَيْكَ قَوْلًۭا ثَقِيلًا"}, "050029": {"a": 29, "text": "مَا يُبَدَّلُ ٱلْقَوْلُ لَدَىَّ وَمَآ أَنَا۠ بِظَلَّٰمٍۢ لِّلْعَبِيدِ"}, "051053": {"a": 53, "text": "أَتَوَاصَوْا۟ بِهِۦ ۚ بَلْ هُمْ قَوْمٌۭ طَاغُونَ"}, "070014": {"a": 14, "text": "وَمَن فِى ٱلْأَرْضِ جَمِيعًۭا ثُمَّ يُنجِيهِ"}, "077048": {"a": 48, "text": "وَإِذَا قِيلَ لَهُمُ ٱرْكَعُوا۟ لَا يَرْكَعُونَ"}, "083014": {"a": 14, "text": "كَلَّا ۖ بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ"}, "047002": {"a": 2, "text": "وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَءَامَنُوا۟ بِمَا نُزِّلَ عَلَىٰ مُحَمَّدٍۢ وَهُوَ ٱلْحَقُّ مِن رَّبِّهِمْ ۙ كَفَّرَ عَنْهُمْ سَيِّـَٔاتِهِمْ وَأَصْلَحَ بَالَهُمْ"}, "055024": {"a": 24, "text": "وَلَهُ ٱلْجَوَارِ ٱلْمُنشَـَٔاتُ فِى ٱلْبَحْرِ كَٱلْأَعْلَٰمِ"}, "089008": {"a": 8, "text": "ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ"}, "048007": {"a": 7, "text": "وَلِلَّهِ جُنُودُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا"}, "061010": {"a": 10, "text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ هَلْ أَدُلُّكُمْ عَلَىٰ تِجَٰرَةٍۢ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍۢ"}, "050026": {"a": 26, "text": "ٱلَّذِى جَعَلَ مَعَ ٱللَّهِ إِلَٰهًا ءَاخَرَ فَأَلْقِيَاهُ فِى ٱلْعَذَابِ ٱلشَّدِيدِ"}, "054011": {"a": 11, "text": "فَفَتَحْنَآ أَبْوَٰبَ ٱلسَّمَآءِ بِمَآءٍۢ مُّنْهَمِرٍۢ"}, "056041": {"a": 41, "text": "وَأَصْحَٰبُ ٱلشِّمَالِ مَآ أَصْحَٰبُ ٱلشِّمَالِ"}, "055043": {"a": 43, "text": "هَٰذِهِۦ جَهَنَّمُ ٱلَّتِى يُكَذِّبُ بِهَا ٱلْمُجْرِمُونَ"}, "048028": {"a": 28, "text": "هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًۭا"}, "075040": {"a": 40, "text": "أَلَيْسَ ذَٰلِكَ بِقَٰدِرٍ عَلَىٰٓ أَن يُحْۦِىَ ٱلْمَوْتَىٰ"}, "077049": {"a": 49, "text": "وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"}, "079018": {"a": 18, "text": "فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ"}, "048008": {"a": 8, "text": "إِنَّآ أَرْسَلْنَٰكَ شَٰهِدًۭا وَمُبَشِّرًۭا وَنَذِيرًۭا"}, "075036": {"a": 36, "text": "أَيَحْسَبُ ٱلْإِنسَٰنُ أَن يُتْرَكَ سُدًى"}, "089021": {"a": 21, "text": "كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّۭا دَكًّۭا"}, "067002": {"a": 2, "text": "ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًۭا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ"}, "056076": {"a": 76, "text": "وَإِنَّهُۥ لَقَسَمٌۭ لَّوْ تَعْلَمُونَ عَظِيمٌ"}, "068033": {"a": 33, "text": "كَذَٰلِكَ ٱلْعَذَابُ ۖ وَلَعَذَابُ ٱلْءَاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ"}, "072010": {"a": 10, "text": "وَأَنَّا لَا نَدْرِىٓ أَشَرٌّ أُرِيدَ بِمَن فِى ٱلْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًۭا"}, "055009": {"a": 9, "text": "وَأَقِيمُوا۟ ٱلْوَزْنَ بِٱلْقِسْطِ وَلَا تُخْسِرُوا۟ ٱلْمِيزَانَ"}, "089006": {"a": 6, "text": "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ"}, "061011": {"a": 11, "text": "تُؤْمِنُونَ بِٱللَّهِ وَرَسُولِهِۦ وَتُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ"}, "089005": {"a": 5, "text": "هَلْ فِى ذَٰلِكَ قَسَمٌۭ لِّذِى حِجْرٍ"}, "066001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ"}, "051032": {"a": 32, "text": "قَالُوٓا۟ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٍۢ مُّجْرِمِينَ"}, "050027": {"a": 27, "text": "۞ قَالَ قَرِينُهُۥ رَبَّنَا مَآ أَطْغَيْتُهُۥ وَلَٰكِن كَانَ فِى ضَلَٰلٍۭ بَعِيدٍۢ"}, "054028": {"a": 28, "text": "وَنَبِّئْهُمْ أَنَّ ٱلْمَآءَ قِسْمَةٌۢ بَيْنَهُمْ ۖ كُلُّ شِرْبٍۢ مُّحْتَضَرٌۭ"}, "048009": {"a": 9, "text": "لِّتُؤْمِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَتُعَزِّرُوهُ وَتُوَقِّرُوهُ وَتُسَبِّحُوهُ بُكْرَةًۭ وَأَصِيلًا"}, "077031": {"a": 31, "text": "لَّا ظَلِيلٍۢ وَلَا يُغْنِى مِنَ ٱللَّهَبِ"}, "080023": {"a": 23, "text": "كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ"}, "089009": {"a": 9, "text": "وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ"}}, EXPL={"3|الرياضيات|عالم الجمع والطرح": [{"t": "عالم الجمع والطرح", "k": "", "lines": ["بص يا حبيبي، لما نجمع، بنحط الأرقام تحت بعض: آحاد تحت آحاد، وعشرات تحت عشرات، ومئات تحت مئات."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["نبدأ الجمع من اليمين، من الآحاد. لو الناتج 10 أو أكتر، نكتب الآحاد ونرفع العشرة للعمود اللي جنبه. اسمها الحمل."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["في الطرح كمان نبدأ من الآحاد. لو الرقم اللي فوق أصغر، نستلف عشرة من العمود اللي جنبه."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["مثال: 45 + 28. نجمع 5 + 8 = 13، نكتب 3 ونرفع 1. بعدين 4 + 2 + 1 = 7. الناتج 73."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["اتأكد من الحل: الجمع نختبره بالطرح، والطرح نختبره بالجمع. لو رجعنا للرقم الأصلي يبقى الحل صح. يلا يا بطل."]}], "3|الرياضيات|عالم الزمن": [{"t": "عالم الزمن", "k": "", "lines": ["بص يا حبيبي، الساعة فيها 60 دقيقة، واليوم فيه 24 ساعة، والأسبوع 7 أيام."]}, {"t": "عالم الزمن", "k": "", "lines": ["العقرب الصغير بيقول الساعة، والعقرب الكبير بيقول الدقايق. لما الكبير على 6 نقول والنصف، ولما يكون على 3 نقول والربع."]}, {"t": "عالم الزمن", "k": "", "lines": ["الزمن المنقضي هو الفرق بين وقت البداية ووقت النهاية. من 3:00 لحد 5:30 يبقى ساعتين ونص."]}, {"t": "عالم الزمن", "k": "", "lines": ["السنة فيها 12 شهر، والشهر ممكن يكون 30 أو 31 يوم، وفبراير أقل."]}, {"t": "عالم الزمن", "k": "", "lines": ["اقرأ السؤال وشوف بيسأل عن ساعة ولا دقيقة ولا يوم، وبعدين اختار الوحدة الصح. يلا يا بطل."]}], "3|الرياضيات|مملكة الضرب": [{"t": "مملكة الضرب", "k": "", "lines": ["بص يا حبيبي، الضرب هو جمع الرقم نفسه كذا مرة. 4 × 3 يعني 4 + 4 + 4 = 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["جدول الضرب لازم نحفظه. ممكن نتعلمه بالعد بالقفزات: 3، 6، 9، 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["الترتيب مش بيغير الناتج: 4 × 3 = 3 × 4."]}, {"t": "مملكة الضرب", "k": "", "lines": ["أي رقم × 1 يساوي نفسه. وأي رقم × 0 يساوي صفر."]}, {"t": "مملكة الضرب", "k": "", "lines": ["لو السؤال فيه مجموعات متساوية، اعرف عدد المجموعات وعدد كل مجموعة واضرب. يلا يا بطل."]}], "3|الرياضيات|مملكة ا <script id="azhar-pro-js">
(function(){

function ageWord(a){if(!a)return"";return a===1?"سنة واحدة":a===2?"سنتان":a<=10?a+" سنين":a+" سنة"}
function greet(){
 try{
  if(typeof P==="undefined"||!P||!P.name)return;

  if(app.querySelector("#azparents"))return;

  var d=document.createElement("div");d.id="azhi";

  d.textContent="🌟 أهلًا بعودتك يا "+P.name+age+goal+" — يلا نكمل بطولاتك!";
  h1.parentNode.insertBefore(d,h1.nextSibling);

  pb.textContent="👨‍👩‍👧 ركن بابا وماما — سؤال للأهل ومساعدة لهم";
  pb.addEventListener("click",function(){window.__azParents()});
  d.parentNode.insertBefore(pb,d.nextSibling);
 }catch(e){}
}
var PQ=null;
function pqPick(){
 try{
  var pool=(window.RAW||[]).filter(function(r){return r&&r.choices&&r.choices.length>=3&&r.explanation&&["القرآن","التربية الإسلامية","العربي"].indexOf(r.subject)>=0});
  if(!pool.length)pool=(window.RAW||[]).filter(function(r){return r&&r.choices&&r.choices.length>=3&&r.explanation});
  if(!pool.length)return null;
  var q=pool[Math.floor(Math.random()*pool.length)];
  var ch=q.choices.slice();for(var i=ch.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ch[i];ch[i]=ch[j];ch[j]=t}
  return {q:q.question,ch:ch,ans:q.answer,exp:q.explanation,subj:q.subject};
 }catch(e){return null}
}

  var qhtml=PQ?('<div class="card"><h2>🧠 سؤال لبابا وماما</h2><p class="sync">من مادة '+PQ.subj+' — جاوبوا مع '+kid+' واتناقشوا في السبب:</p><div class="qtext">'+PQ.q+'</div><div id="azpq">'+PQ.ch.map(function(c,i){return '<button class="choice" data-azpq="'+i+'"><span>'+c+'</span></button>'}).join("")+'</div><div id="azpfb"></div><button class="btn small ghost" id="azpnew">🔄 سؤال جديد للأهل</button></div>'):'';
  var h='<div id="azparents"><h1>👨‍👩‍👧 ركن بابا وماما</h1>'

   +qhtml
   +'<div class="card"><h2>🤝 إزاي تساعدوا '+son+'؟</h2><p>'+ageTip+'</p><p>· اسألوه كل يوم: «اتعلمت إيه جديد؟» وخلوه يعلّمكم هو — أحلى تثبيت للمعلومة إنه يشرحها.<br>· شوفوا تقريره من زرار «تقريري» في اللعبة وقارنوا تقدمه أسبوع بأسبوع، وامدحوا الجهد مش الدرجة بس.<br>· لو سؤال صعب عليه، سيبوه يستخدم تلميح الأول قبل ما تقولوا الإجابة.</p></div>'
   +'<div class="card"><h2>💬 أسئلة تفتح الكلام بعد اللعب</h2><p>· إيه أكتر سؤال عجبك النهاردة وليه؟<br>· إيه السؤال اللي غلطت فيه واتعلمت منه إيه؟<br>· لو هتعمل سؤال لبابا وماما، هيكون عن إيه؟<br>· إيه المادة اللي عايز تكسب فيها تلميحات زيادة؟</p></div>'
   +'<button class="btn" data-a="home">🏠 رجوع للعبة '+kid+'</button></div>';
  render(h);
  var nb=document.getElementById("azpnew");if(nb)nb.addEventListener("click",function(){PQ=pqPick();window.__azParents()});
  var box=document.getElementById("azpq");
  if(box)box.addEventListener("click",function(e){var b=e.target.closest("[data-azpq]");if(!b||!PQ)return;var pick=PQ.ch[+b.getAttribute("data-azpq")];var fb=document.getElementById("azpfb");
   if(pick===PQ.ans){b.classList.add("ok");fb.innerHTML='<div class="warn" style="background:#e8f5e9">🎉 إجابة صح! '+PQ.exp+'<br>اتكلموا مع '+kid+': ليه دي الإجابة الصح؟</div>'}
   else{b.classList.add("bad");fb.innerHTML='<div class="warn">قربتوا! الإجابة الصح: <b>'+PQ.ans+'</b><br>'+PQ.exp+'</div>'}});
 }catch(e){}
};
