ation": "تأتي بعدها الآية 27 من سورة ق: ﴿۞ قَالَ قَرِينُهُۥ رَبَّنَا مَآ أَطْغَيْتُهُۥ وَلَٰكِن كَانَ فِى ضَلَٰلٍۭ بَعِيدٍۢ﴾.", "type": "puzzle", "scope": "current", "ref": "ق 26-27", "topic": "سورة ق", "ayahFiles": ["050026", "050027"]}, {"grade": 3, "subject": "القرآن", "id": "g3-quran-cur-46", "question": "أكمل الآية الكريمة: ﴿نَحْنُ قَدَّرْنَا بَيْنَكُمُ ...﴾", "choices": ["ٱلْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ", "رَبِّكَ ذِى ٱلْجَلَٰلِ وَٱلْإِكْرَامِ", "ٱلْيَمِينِ وَعَنِ ٱلشِّمَالِ قَعِيدٌۭ", "طُلُوعِ ٱلشَّمْسِ وَقَبْلَ ٱلْغُرُوبِ"], "answer": "ٱلْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ", "answerIndex": 0, "explanation": "الآية: ﴿نَحْنُ قَدَّرْنَا بَيْنَكُمُ ٱلْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ﴾ (الواقعة، الآية 60).", "type": "normal", "scope": "current", "ref": "الواقعة 60", "topic": "سورة الواقعة", "ayahFiles": ["056060"]}, {"grade": 3, "subject": "القرآن", "id": "g3-quran-cur-47", "question": "من أي سورة هذه الآية؟ ﴿لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ﴾", "choices": ["القمر", "الفتح", "الواقعة", "الرحمن"], "answer": "الرحمن", "answerIndex": 3, "explanation": "الآية رقم 74 من سورة الرحمن.", "type": "normal", "scope": "current", "ref": "الرحمن 74", "topic": "سورة الرحمن", "ayahFiles": ["055074"]}, {"grade": 3, "subject": "القرآن", "id": "g3-quran-cur-48", "question": "حكم النون الساكنة قبل حرف الهاء:", "choices": ["إدغام", "إقلاب", "إخفاء", "إظهار حلقي"], "answer": "إظهار حلقي", "answerIndex": 3, "explanation": "الهاء من حروف الحلق الستة.", "type": "normal", "scope": "current", "ref": "تجويد", "topic": "أحكام التجويد"}, {"grade": 3, "subject": "القرآن", "id": "g3-quran-cur-49", "question": "أكمل الآية الكريمة: ﴿سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ ...﴾", "choices": ["بِفَٰكِهَةٍۢ وَلَحْمٍۢ مِّمَّا يَشْتَهُونَ", "وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ", "كَيْدُهُمْ شَيْـًۭٔا وَلَا هُمْ يُنصَرُونَ", "وَلَن تَجِدَ لِسُنَّةِ ٱللَّهِ تَبْدِيلًۭا"], "answer": "وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ", "answerIndex": 1, "explanation": "الآية: ﴿سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ﴾ (الحديد، الآية 1).", "type": "normal", "scope": "current", "ref": "الحديد 1", "topic": "سورة الحديد", "ayahFiles": ["057001"]}, {"grade": 3, "subject": "القرآن", "id": "g3-quran-cur-50", "question": "ما الآية التي تأتي بعد قوله تعالى: ﴿۞ قَالَ فَمَا خَطْبُكُمْ أَيُّهَا ٱلْمُرْسَلُونَ﴾؟", "choices": ["وَفِى ثَمُودَ إِذْ قِيلَ لَهُمْ تَمَتَّعُوا۟ حَتَّىٰ حِينٍۢ", "وَٱلسَّمَآءَ بَنَيْنَٰهَا بِأَيْي۟دٍۢ وَإِنَّا لَمُوسِعُونَ", "وَفِىٓ أَمْوَٰلِهِمْ حَقٌّۭ لِّلسَّآئِلِ وَٱلْمَحْرُومِ", "قَالُوٓا۟ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٍۢ مُّجْرِمِينَ"], "answer": "قَالُوٓا۟ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٍۢ مُّجْرِمِينَ", "answerIndex": 3, "explanation": "تأتي بعدها الآية 32 من سورة الذاريات: ﴿قَالُوٓا۟ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٍۢ مُّجْرِمِينَ﴾.", "type": "puzzle", "scope": "current", "ref": "الذاريات 31-32", "topic": "سورة الذاريات", "ayahFiles": ["051031", "051032"]}, {"grade": 3, "subject": "القرآن", "id": "g3-quran-past-1", "question": "أكمل الآية الكريمة: ﴿وَٱللَّهُ أَنۢبَتَكُم مِّنَ ...﴾", "choices": ["حِسَابًۭا يَسِيرًۭا", "مُلَٰقٍ حِسَابِيَهْ", "هُمَزَةٍۢ لُّمَزَةٍ", "ٱلْأَرْضِ نَبَاتًۭا"], "answer": "ٱلْأَرْضِ نَبَاتًۭا", "answerIndex": 3, "explanation": "الآية: ﴿وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلْأَرْضِ نَبَاتًۭا﴾ (نوح، الآية 17).", "type": "normal", "scope": "past", "ref": "نوح 17", "topic": "سورة نوح", "ayahFiles": ["071017"]}, {"grade": 3, "subject": "القرآن", "id": "g3-quran-past-2", "question": "من أي سورة هذه الآية؟ ﴿وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ﴾", "choices": ["الجمعة", "المجادلة", "النازعات", "الهمزة"], "answer": "النازعات", "answerIndex": 2, "explanation": "الآية رقم 40 من سورة النازعات.", "type": "normal", "scope": "past", "ref": "النازعات 40", "topic": "سورة النازعات", "ayahFiles": ["079040"]}, {"grade": 3, "subject": "القرآن", "id": "g3-quran-past-3", "question": "كم عدد آيات سورة الفيل؟", "choices": ["15", "10", "4", "5"], "answer": "5", "answerIndex": 3, "explanation": "سورة الفيل عدد آياتها 5.", "type": "normal", "scope": "past", "ref": "الفيل", "topic": "أحكام التجويد"}, {"grade": 3, "subject": "القرآن", "id": "g3-quran-past-4", "question": "أكمل الآية الكريمة: ﴿إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ ...﴾", "choices": ["يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا", "تَكُن كَصَاحِبِ ٱلْحُوتِ إِذْ نَادَىٰ وَهُوَ مَكْظُومٌۭ", "ٱلْيَوْمَ ۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ", "ۖ ذَاقُوا۟ وَبَالَ أَمْرِهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌۭ"], "answer": "يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا", "answerIndex": 0, "explanation": "الآية: ﴿إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا﴾ (الجن، الآية 27).", "type": "normal", "scope": "past", "ref": "الجن 27", "topic": "سورة الجن", "ayahFiles": ["072027"]}, {"grade": 3, "subject": "القرآن", "id": "g3-quran-past-5", "question": "ما الآية التي تأتي بعد قوله تعالى: ﴿فَلَمْ يَزِدْهُمْ دُعَآءِىٓ إِلَّا فِرَارًۭا﴾؟", "choices": ["وَإِنِّى كُلَّمَا دَعَوْتُهُمْ لِتَغْفِرَ لَهُمْ جَعَلُوٓا۟ أَصَٰبِعَهُمْ فِىٓ ءَاذَانِهِمْ وَٱسْتَغْشَوْا۟ ثِيَابَهُمْ وَأَصَرُّوا۟ وَٱسْتَكْبَرُوا۟ ٱسْتِكْبَارًۭا", "وَقَالُوا۟ لَا تَذَرُنَّ ءَالِهَتَكُمْ وَلَا تَذَرُنَّ وَدًّۭا وَلَا سُوَاعًۭا وَلَا يَغُوثَ وَيَعُوقَ وَنَسْرًۭا", "وَيُمْدِدْكُم بِأَمْوَٰلٍۢ وَبَنِينَ وَيَجْعَل لَّكُمْ جَنَّٰتٍۢ وَيَجْعَل لَّكُمْ أَنْهَٰرًۭا", "قَالَ نُوحٌۭ رَّبِّ إِنَّهُمْ عَصَوْنِى وَٱتَّبَعُوا۟ مَن لَّمْ يَزِدْهُ مَالُهُۥ وَوَلَدُهُۥٓ إِلَّا خَسَارًۭا"], "answer": "وَإِنِّى كُلَّمَا دَعَوْتُهُمْ لِتَغْفِرَ لَهُمْ جَعَلُوٓا۟ أَصَٰبِعَهُمْ فِىٓ ءَاذَانِهِمْ وَٱسْتَغْشَوْا۟ ثِيَابَهُمْ وَأَصَرُّوا۟ وَٱسْتَكْبَرُوا۟ ٱسْتِكْبَارًۭا", "answerIndex": 0, "explanation": "تأتي بعدها الآية 7 من سورة نوح: ﴿وَإِنِّى كُلَّمَا دَعَوْتُهُمْ لِتَغْفِرَ لَهُمْ جَعَلُوٓا۟ أَصَٰبِعَهُمْ فِىٓ ءَاذَانِهِمْ وَٱسْتَغْشَوْا۟ ثِيَابَهُمْ وَأَصَرُّوا۟ وَٱسْتَكْبَرُوا۟ ٱسْتِكْبَارًۭا﴾.", "type": "puzzle", "scope": "past", "r tion": "ما الآية التي تأتي بعد قوله تعالى: ﴿ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ﴾؟", "choices": ["ٱرْجِعِىٓ إِلَىٰ رَبِّكِ رَاضِيَةًۭ مَّرْضِيَّةًۭ", "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ", "وَجَآءَ رَبُّكَ وَٱلْمَلَكُ صَفًّۭا صَفًّۭا", "وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ"], "answer": "وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ", "answerIndex": 3, "explanation": "تأتي بعدها الآية 9 من سورة الفجر: ﴿وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ﴾.", "type": "puzzle", "scope": "past", "ref": "الفجر 8-9", "topic": "سورة الفجر", "ayahFiles": ["089008", "089009"]}, {"grade": 3, "subject": "القرآن", "id": "g3-quran-past-11", "question": "أكمل الآية الكريمة: ﴿فَأَمَّا ٱلْإِنسَٰنُ إِذَا مَا ٱبْتَلَىٰهُ ...﴾", "choices": ["ٱلسَّمَآءَ فَوَجَدْنَٰهَا مُلِئَتْ حَرَسًۭا شَدِيدًۭا وَشُهُبًۭا", "تَوَلَّيْتُمْ فَإِنَّمَا عَلَىٰ رَسُولِنَا ٱلْبَلَٰغُ ٱلْمُبِينُ", "رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ", "أُقْسِمُ بِرَبِّ ٱلْمَشَٰرِقِ وَٱلْمَغَٰرِبِ إِنَّا لَقَٰدِرُونَ"], "answer": "رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ", "answerIndex": 2, "explanation": "الآية: ﴿فَأَمَّا ٱلْإِنسَٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ﴾ (الفجر، الآية 15).", "type": "normal", "scope": "past", "ref": "الفجر 15", "topic": "سورة الفجر", "ayahFiles": ["089015"]}, {"grade": 3, "subject": "القرآن", "id": "g3-quran-past-12", "question": "من أي سورة هذه الآية؟ ﴿فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ﴾", "choices": ["النازعات", "الضحى", "القارعة", "الكافرون"], "answer": "النازعات", "answerIndex": 0, "explanation": "الآية رقم 18 من سورة النازعات.", "type": "normal", "scope": "past", "ref": "النازعات 18", "topic": "سورة النازعات", "ayahFiles": ["079018"]}, {"grade": 3, "subject": "القرآن", "id": "g3-quran-past-13", "question": "كم عدد آيات سورة الغاشية؟", "choices": ["31", "25", "26", "24"], "answer": "26", "answerIndex": 2, "explanation": "سورة الغاشية عدد آياتها 26.", "question": "كم عدد ركعات صلاة الفجر؟", "choices": ["أربع ركعات", "ثلاث ركعات", "ركعتان", "خمس ركعات"], "answer": "ركعتان", "answerIndex": 2, "explanation": "صلاة الفجر ركعتان، والظهر والعصر والعشاء أربع ركعات، والمغرب ثلاث ركعات.", "type": "normal", "topic": "الصلاة"}, {"grade": 3, "subject": "التربية الإسلامية", "id": "n26-g3-5", "question": "في أي مدينة وُلد النبي محمد ﷺ؟", "choices": ["المدينة المنورة", "مكة المكرمة", "الطائف", "بيت المقدس"], "answer": "مكة المكرمة", "answerIndex": 1, "explanation": "وُلد النبي ﷺ في مكة المكرمة في عام الفيل، ونشأ فيها حتى هاجر إلى المدينة المنورة.", "type": "normal", "topic": "السيرة النبوية"}, {"grade": 3, "subject": "التربية الإسلامية", "id": "n26-g3-6", "question": "من هي مرضعة النبي ﷺ في طفولته؟", "choices": ["خديجة بنت خويلد", "آمنة بنت وهب", "حليمة السعدية", "فاطمة بنت أسد"], "answer": "حليمة السعدية", "answerIndex": 2, "explanation": "أرضعت النبيَّ ﷺ في طفولته حليمة السعدية من بني سعد، أما أمه فهي آمنة بنت وهب، وزوجته خديجة بنت خويلد رضي الله عنهن.", "type": "normal", "topic": "السيرة النبوية"}, {"grade": 3, "subject": "التربية الإسلامية", "id": "n26-g3-7", "question": "من هو جد النبي ﷺ الذي كفله بعد وفاة أمه؟", "choices": ["أبو طالب", "عبد المطلب", "حمزة بن عبد المطلب", "العباس بن عبد المطلب"], "answer": "عبد المطلب", "answerIndex": 1, "explanation": "كفل النبيَّ ﷺ بعد وفاة أمه جده عبد المطلب، ثم بعد وفاته كفله عمه أبو طالب.", "type": "normal", "topic": "السيرة النبوية"}, {"grade": 3, "subject": "التربية الإسلامية", "id": "n26-g3-8", "question": "ما معنى اسم الله «الرزّاق»؟", "choices": ["الذي يرزق عباده ويعطيهم", "الذي يعلم كل شيء", "الذي يسمع كل شيء", "الذي يرى كل شيء"], "answer": "الذي يرزق عباده ويعطيهم", "answerIndex": 0, "explanation": "الله هو الرزّاق؛ يرزق جميع خلقه من إنسان وحيوان وطير، قال تعالى: ﴿إن الله هو الرزاق ذو القوة المتين﴾.", "type": "normal", "topic": "أسماء الله الحسنى"}, {"grade": 3, "subject": "التربية الإسلامية", "id": "n26-g3-9", "question": "زميلك نسي قلمه، وأنت معك قلمان. ما التصرف الذي يحبه ال جيش عظيم ومعه الفيلة لهدم الكعبة، فحمى الله بيته وأهلك الجيش، كما قصّت علينا سورة الفيل.", "type": "normal", "topic": "سورة الفيل"}, {"grade": 3, "subject": "التربية الإسلامية", "id": "n26-g3-15", "question": "وُصف النبي ﷺ قبل البعثة بلقب ......", "choices": ["الصادق الأمين", "الفارس الشجاع", "التاجر الغني", "الشاعر البليغ"], "answer": "الصادق الأمين", "answerIndex": 0, "explanation": "عُرف النبي ﷺ بين قومه بالصادق الأمين؛ لصدقه في الكلام وأمانته في حفظ حقوق الناس.", "type": "normal", "topic": "الصدق والأمانة"}, {"grade": 3, "subject": "التربية الإسلامية", "id": "n26-g3-16", "question": "ما أول ركن من أركان الإسلام؟", "choices": ["الصيام", "الزكاة", "الشهادتان", "الحج"], "answer": "الشهادتان", "answerIndex": 2, "explanation": "أول ركن هو الشهادتان: شهادة أن لا إله إلا الله وأن محمدًا رسول الله، وهي مفتاح الدخول في الإسلام.", "type": "normal", "topic": "أركان الإسلام"}, {"grade": 3, "subject": "العربي", "id": "n26-g3-17", "question": "أكمل باسم إشارة مناسب: ...... ولدٌ مجتهدٌ.", "choices": ["هذه", "هذا", "هؤلاء", "تلك"], "answer": "هذا", "answerIndex": 1, "explanation": "«هذا» اسم إشارة للمفرد المذكر القريب، وكلمة «ولد» مفرد مذكر، فنقول: هذا ولدٌ مجتهدٌ.", "type": "normal", "topic": "أسماء الإشارة"}, {"grade": 3, "subject": "العربي", "id": "n26-g3-18", "question": "أكمل باسم إشارة مناسب: ...... بنتٌ مهذبةٌ.", "choices": ["هذا", "هذان", "هذه", "هؤلاء"], "answer": "هذه", "answerIndex": 2, "explanation": "«هذه» اسم إشارة للمفردة المؤنثة القريبة، وكلمة «بنت» مفردة مؤنثة.", "type": "normal", "topic": "أسماء الإشارة"}, {"grade": 3, "subject": "العربي", "id": "n26-g3-19", "question": "أي اسم إشارة نستخدمه مع جمع العقلاء في جملة: ...... تلاميذُ متفوقون؟", "choices": ["هذا", "هذه", "هؤلاء", "ذلك"], "answer": "هؤلاء", "answerIndex": 2, "explanation": "«هؤلاء» اسم إشارة لجمع العقلاء (المذكر والمؤنث) القريب.", "type": "normal", "topic": "أسماء الإشارة"}, {"grade": 3, "subject": "العربي", "id": "n26-g3-20", "question": "ما الضمير المناسب مكان النقط: ...... ألعبُ في الحديقةِ؟", "choices": ["هو", "أنا", "هم", "أنتَ"], "answer": "أنا", "answerIndex": 1, "explanation": "الفعل «ألعبُ» يدل على المتكلم، والضمير المناسب له هو «أنا».", "type": "normal", "topic": "الضمائر"}, {"grade": 3, "subject": "العربي", "id": "n26-g3-21", "question": "الضمير «هي» يدل على ......", "choices": ["المفرد المذكر الغائب", "المفردة المؤنثة الغائبة", "جمع الذكور", "المتكلم"], "answer": "المفردة المؤنثة الغائبة", "answerIndex": 1, "explanation": "«هي» ضمير غائب للمفردة المؤنثة، مثل: هي تلميذةٌ نشيطةٌ، أما «هو» فللمفرد المذكر.", "type": "normal", "topic": "الضمائر"}, {"grade": 3, "subject": "العربي", "id": "n26-g3-22", "question": "أكمل بالضمير المناسب: ...... نكتبُ الدرسَ.", "choices": ["نحن", "هو", "هي", "أنتِ"], "answer": "نحن", "answerIndex": 0, "explanation": "الفعل «نكتبُ» أوله نون تدل على الجماعة المتكلمة، والضمير المناسب هو «نحن».", "type": "normal", "topic": "الضمائر"}, {"grade": 3, "subject": "العربي", "id": "n26-g3-23", "question": "جملة «العلمُ نورٌ» جملة ......", "choices": ["فعلية", "اسمية", "طلبية", "خبرية منفية"], "answer": "اسمية", "answerIndex": 1, "explanation": "الجملة التي تبدأ باسم تسمى جملة اسمية، و«العلمُ» اسم بدأت به الجملة.", "type": "normal", "topic": "الجملة الاسمية والفعلية"}, {"grade": 3, "subject": "العربي", "id": "n26-g3-24", "question": "جملة «يكتبُ التلميذُ الدرسَ» جملة ......", "choices": ["اسمية", "فعلية", "لا تصح", "جملة ظرفية"], "answer": "فعلية", "answerIndex": 1, "explanation": "الجملة التي تبدأ بفعل تسمى جملة فعلية، و«يكتبُ» فعل مضارع بدأت به الجملة.", "type": "normal", "topic": "الجملة الاسمية والفعلية"}, {"grade": 3, "subject": "العربي", "id": "n26-g3-25", "question": "كلمة «في» في جملة «الكتابُ في الحقيبةِ» نوعها ......", "choices": ["اسم", "فعل", "حرف", "ضمير"], "answer": "حرف", "answerIndex": 2, "explanation": "الكلام ثلاثة أقسام: اسم وفعل وحرف. و«في» حرف جر يفيد الظرفية.", "type": "normal", "topic": "أقسام الكلام"}, {"grade": 3, "subject": "العربي", "id": "n26-g3-26", "question": "أي كلمة مما يلي فعلٌ ماضٍ؟", "choices": ["كتابٌ", "كتبَ", "في", "مكتبةٌ"], "answer": "كتبَ", "answerIndex": 1, "explanation": "«كتبَ» فعل ماضٍ يدل على حدث وقع وانتهى، أما «كتاب» و«مكتبة» فاسمان، و«في» حرف.", "type": "normal", "topic": "أقسام الكلام"}, {"grade": 3, "subject": "العربي", "id": "n26-g3-27", "question": "ما الفاعل في جملة «شربَ الولدُ الماءَ»؟", "choices": ["الماءَ", "شربَ", "الولدُ", "لا يوجد فاعل"], "answer": "الولدُ", "answerIndex": 2, "explanation": "الفاعل هو من قام بالفعل؛ فالذي شرب هو «الولدُ»، فهو الفاعل، و«الماءَ» مفعول به.", "type": "normal", "topic": "الجملة الفعلية"}, {"grade": 3, "subject": "العربي", "id": "n26-g3-28", "question": "اسم الإشارة «هذان» يدل على ......", "choices": ["المفرد المذكر", "المثنى المذكر", "جمع الإناث", "المفردة المؤنثة"], "answer": "المثنى المذكر", "answerIndex": 1, "explanation": "«هذان» للمثنى المذكر القريب، مثل: هذان كتابان جديدان، أما المثنى المؤنث فهو «هاتان».", "type": "normal", "topic": "أسماء الإشارة"}, {"grade": 3, "subject": "اللغة الإنجليزية", "id": "n26-g3-29", "question": "Choose: Good ______! See you tomorrow.", "choices": ["morning", "night", "hello", "name"], "answer": "night", "answerIndex": 1, "explanation": "نقول Good night عند الوداع في نهاية اليوم قبل النوم، أما في الصباح فنقول Good morning.", "type": "normal", "topic": "Greetings - Unit 1"}, {"grade": 3, "subject": "اللغة الإنجليزية", "id": "n26-g3-30", "question": "Choose: How many fingers do you have on two hands?", "choices": ["Five", "Eight", "Ten", "Twelve"], "answer": "Ten", "answerIndex": 2, "explanation": "في كل يد خمسة أصابع، وفي اليدين معًا عشرة: Ten.", "type": "normal", "topic": "Numbers - Unit 1"}, {"grade": 3, "subject": "اللغة الإنجليزية", "id": "n26-g3-31", "question": "Choose: My father's wife is my ______.", "choices": ["sister", "mother", "aunt", "grandma"], "answer": "mother", "answerIndex": 1, "explanation": "زوجة الأب في كلمات الأسرة هنا هي الأم: mother، والأخت sister، والعمة/الخالة aunt.", "type": "normal", "topic": "Family - Unit 2"}, {"grade": 3, "subject": "اللغة الإنجليزية", "id": "n26-g3-32", "question": "Choose: The sky is ______.", "choices": ["blue", "green", "red", "black"], "answer": "blue", "answerIndex": 0, "explanation": "لون السماء أزرق: blue، والأخضر green لون العشب.", "type": "normal", "topic": "Colors - Unit 2"}, {"grade": 3, "subject": "اللغة الإنجليزية", "id": "n26-g3-33", "question": "Choose: I write with my ______.", "choices": ["ruler", "pencil", "bag", "book"], "answer": "pencil", "answerIndex": 1, "explanation": "نكتب بالقلم الرصاص: pencil، والمسطرة ruler للقياس والرسم.", "type": "normal", "topic": "Classroom - Unit 3"}, {"grade": 3, "subject": "اللغة الإنجليزية", "id": "n26-g3-34", "question": "Choose: This ______ my friend, Adam.", "choices": ["are", "is", "am", "be"], "answer": "is", "answerIndex": 1, "explanation": "مع المفرد القريب This نستخدم is: This is my friend.", "type": "normal", "topic": "Grammar - Unit 3"}, {"grade": 3, "subject": "اللغة الإنجليزية", "id": "n26-g3-35", "question": "Choose: I ______ a pupil.", "choices": ["is", "are", "am", "be"], "answer": "am", "answerIndex": 2, "explanation": "الضمير I يأخذ دائمًا الفعل am: I am a pupil (أنا تلميذ).", "type": "normal", "topic": "Grammar - Unit 3"}, {"grade": 3, "subject": "اللغة الإنجليزية", "id": "n26-g3-36", "question": "Choose the odd word: apple - banana - orange - chair", "choices": ["apple", "banana", "orange", "chair"], "answer": "chair", "answerIndex": 3, "explanation": "apple وbanana وorange فواكه، أما chair فهو كرسي من الأثاث، فهو الكلمة الشاذة.", "type": "normal", "topic": "Vocabulary - Unit 2"}, {"grade": 3, "subject": "اللغة الإنجليزية", "id": "n26-g3-37", "question": "Choose: 7 + 5 = ______", "choices": ["eleven", "twelve", "thirteen", "ten"], "answer": "twelve", "answerIndex": 1, "explanation": "7 + 5 = 12، واثنا عشر بالإنجليزية: twelve.", "type": "normal", "topic": "Numbers - Unit 1"}, {"grade": 3, "subject": "اللغة الإنجليزية", "id": "n26-g3-38", "question": "Choose: I smell with my ______.", "choices": ["eye", "ear", "nose", "hand"], "answer": "nose", "answerIndex": 2, "explanation": "نشم بالأنف: nose، ونرى بالعين eye، ونسمع بالأذن ear.", "type": "normal", "topic": "Body - Unit 3"}, {"grade": 3, "subject": "الرياضيات", "id": "n26-g3-39", "question": "لغز: أنا عدد، إذا أضفت إليّ 5 صرت 12. من أنا؟", "choices": ["6", "7", "8", "17"], "answer": "7", "answerIndex": 1, "explanation": "نعكس العملية: 12 − 5 = 7.", "type": "puzzle", "topic": "لغز الأعداد"}, {"grade": 3, "subject": "الرياضيات", "id": "n26-g3-40", "question": "لغز: معك 3 أكياس، في كل كيس 4 برتقالات. كم برتقالة معك؟", "choices": ["7", "10", "12", "9"], "answer": "12", "answerIndex": 2, "explanation": "3 × 4 = 12 برتقالة.", "type": "puzzle", "topic": "لغز الأعداد"}, {"grade": 3, "subject": "الرياضيات", "id": "n26-g3-41", "question": "لغز: بدأ الدرس الساعة 9:00 واستمر ساعة ونصف. متى انتهى؟", "choices": ["10:00", "10:30", "11:00", "9:30"], "answer": "10:30", "answerIndex": 1, "explanation": "9:00 + ساعة = 10:00، + نصف ساعة = 10:30.", "type": "puzzle", "topic": "لغز الزمن"}, {"grade": 3, "subject": "الرياضيات", "id": "n26-g3-42", "question": "لغز: عدد زوجي بين 20 و24، ومجموع رقميه 4. ما العدد؟", "choices": ["20", "22", "24", "13"], "answer": "22", "answerIndex": 1, "explanation": "22 عدد زوجي بين 20 و24، ومجموع رقميه 2 + 2 = 4.", "type": "puzzle", "topic": "لغز الأعداد"}, {"grade": 3, "subject": "الرياضيات", "id": "n26-g3-43", "question": "لغز: وُزّعت 18 قطعة حلوى على 3 أصدقاء بالتساوي. كم نصيب كل صديق؟", "choices": ["5", "6", "7", "9"], "answer": "6", "answerIndex": 1, "explanation": "18 ÷ 3 = 6 قطع لكل صديق.", "type": "puzzle", "topic": "لغز القسمة"}, {"grade": 3, "subject": "الرياضيات", "id": "n26-g3-44", "question": "لغز: في الحافلة 27 راكبًا، نزل منهم 9 وركب 4. كم راكبًا الآن؟", "choices": ["22", "23", "24", "18"], "answer": "22", "answerIndex": 0, "explanation": "27 − 9 = 18، ثم 18 + 4 = 22 راكبًا.", "type": "puzzle", "topic": "لغز الجمع والطرح"}, {"grade": 3, "subject": "القرآن", "id": "n26-g3-45", "question": "حروف الإظهار الحلقي ستة، مجموعة في أوائل كلمات: «أخي هاك علمًا حازه غير خاسر». ما أول هذه الحروف؟", "choices": ["النون", "الهمزة", "الميم", "الباء"], "answer": "الهمزة", "answerIndex": 1, "explanation": "حروف الإظهار الحلقي: الهمزة والهاء والعين والحاء والغين والخاء، وتخرج من الحلق، فيُنطق بالنون الساكنة أو التنوين بوضوح قبلها.", "type": "normal", "topic": "أحكام التجويد - الإظهار الحلقي"}, {"grade": 3, "subject": "القرآن", "id": "n26-g3-46", "question": "النون الساكنة هي نون ......", "choices": ["عليها فتحة", "خالية من الحركة", "مشددة دائمًا", "لا تُنطق أبدًا"], "answer": "خالية من الحركة", "answerIndex": 1, "explanation": "النون الساكنة نون خالية من الحركة (عليها سكون)، ولها مع التنوين أربعة أحكام: الإظهار والإدغام والإقلاب والإخفاء.", "type": "normal", "topic": "أحكام التجويد - النون الساكنة"}, {"grade": 3, "subject": "القرآن", "id": "n26-g3-47", "question": "نبدأ قراءة القرآن الكريم بـ ......", "choices": ["الحمدلة", "الاستعاذة والبسملة", "التكبير", "الدعاء"], "answer": "الاستعاذة والبسملة", "answerIndex": 1, "explanation": "نبدأ القراءة بالاستعاذة: «أعوذ بالله من الشيطان الرجيم»، ثم البسملة: «بسم الله الرحمن الرحيم» في أول كل سورة عدا التوبة.", "type": "normal", "topic": "الاستعاذة والبسملة"}, {"grade": 3, "subject": "القرآن", "id": "n26-g3-48", "question": "تتكرر في سورة الرحمن آية «فبأي آلاء ربكما تكذبان». كلمة «آلاء» معناها ......", "choices": ["نِعَم", "جبال", "أنهار", "نجوم"], "answer": "نِعَم", "answerIndex": 0, "explanation": "الآلاء هي النِّعم؛ والآية تذكّر الإنس والجن بنعم الله عليهم وتدعوهم لشكرها وعدم تكذيبها.", "type": "normal", "topic": "سورة الرحمن"}, {"grade": 3, "subject": "القرآن", "id": "h26-g3-1", "question": "أكمل الآية الكريمة من سورة الحديد: ﴿آمِنُوا بِاللَّهِ وَرَسُولِهِ وَأَنفِقُوا مِمَّا جَعَلَكُم ...... فِيهِ﴾", "choices": ["مُّسْتَخْلَفِينَ", "مُّقَرَّبِينَ", "مُّسْتَضْعَفِينَ", "مُّكْرَمِينَ"], "answer": "مُّسْتَخْلَفِينَ", "answerIndex": 0, "explanation": "الآية 7 من سورة الحديد: ﴿وَأَنفِقُوا مِمَّا جَعَلَكُم مُّسْتَخْلَفِينَ فِيهِ﴾ أي جعلكم خلفاء , "054036": {"a": 36, "text": "وَلَقَدْ أَنذَرَهُم بَطْشَتَنَا فَتَمَارَوْا۟ بِٱلنُّذُرِ"}, "066002": {"a": 2, "text": "قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْ ۚ وَٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ"}, "051026": {"a": 26, "text": "فَرَاغَ إِلَىٰٓ أَهْلِهِۦ فَجَآءَ بِعِجْلٍۢ سَمِينٍۢ"}, "055010": {"a": 10, "text": "وَٱلْأَرْضَ وَضَعَهَا لِلْأَنَامِ"}, "071006": {"a": 6, "text": "فَلَمْ يَزِدْهُمْ دُعَآءِىٓ إِلَّا فِرَارًۭا"}, "054010": {"a": 10, "text": "فَدَعَا رَبَّهُۥٓ أَنِّى مَغْلُوبٌۭ فَٱنتَصِرْ"}, "057001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ"}, "076023": {"a": 23, "text": "إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ ٱلْقُرْءَانَ تَنزِيلًۭا"}, "056091": {"a": 91, "text": "فَسَلَٰمٌۭ لَّكَ مِنْ أَصْحَٰبِ ٱلْيَمِينِ"}, "050004": {"a": 4, "text": "قَدْ عَلِمْنَا مَا تَنقُصُ ٱلْأَرْضُ مِنْهُمْ ۖ وَعِندَنَا كِتَٰبٌ حَفِيظٌۢ"}, "052015": {"a": 15, "text": "أَفَسِحْرٌ هَٰذَآ أَمْ أَنتُمْ لَا تُبْصِرُونَ"}, "082018": {"a": 18, "text": "ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ"}, "070038": {"a": 38, "text": "أَيَطْمَعُ كُلُّ ٱمْرِئٍۢ مِّنْهُمْ أَن يُدْخَلَ جَنَّةَ نَعِيمٍۢ"}, "079027": {"a": 27, "text": "ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا"}, "052016": {"a": 16, "text": "ٱصْلَوْهَا فَٱصْبِرُوٓا۟ أَوْ لَا تَصْبِرُوا۟ سَوَآءٌ عَلَيْكُمْ ۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ"}, "105001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ ٱلْفِيلِ"}, "052024": {"a": 24, "text": "۞ وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌۭ لَّهُمْ كَأَنَّهُمْ لُؤْلُؤٌۭ مَّكْنُونٌۭ"}, "069013": {"a": 13, "text": "فَإِذَا نُفِخَ فِى ٱلصُّورِ نَفْخَةٌۭ وَٰحِدَةٌۭ"}, "067005": {"a": 5, "text": "وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ"}, "054009": {"a": 9, "text": "۞ كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ فَكَذَّبُوا۟ عَبْدَنَا وَقَالُوا۟ مَجْنُونٌۭ وَٱزْدُجِرَ"}, "072027": {"a": 27, "text": "إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا"}, "051031": {"a": 31, "text": "۞ قَالَ فَمَا خَطْبُكُمْ أَيُّهَا ٱلْمُرْسَلُونَ"}, "055015": {"a": 15, "text": "وَخَلَقَ ٱلْجَآنَّ مِن مَّارِجٍۢ مِّن نَّارٍۢ"}, "085007": {"a": 7, "text": "وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌۭ"}, "047001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ أَضَلَّ أَعْمَٰلَهُمْ"}, "078036": {"a": 36, "text": "جَزَآءًۭ مِّن رَّبِّكَ عَطَآءً حِسَابًۭا"}, "056045": {"a": 45, "text": "إِنَّهُمْ كَانُوا۟ قَبْلَ ذَٰلِكَ مُتْرَفِينَ"}, "050012": {"a": 12, "text": "كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ وَأَصْحَٰبُ ٱلرَّسِّ وَثَمُودُ"}, "071017": {"a": 17, "text": "وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلْأَرْضِ نَبَاتًۭا"}, "091013": {"a": 13, "text": "فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا"}, "079040": {"a": 40, "text": "وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ"}, "053038": {"a": 38, "text": "أَلَّا تَزِرُ وَازِرَةٌۭ وِزْرَ أُخْرَىٰ"}, "050015": {"a": 15, "text": "أَفَعَيِينَا بِٱلْخَلْقِ ٱلْأَوَّلِ ۚ بَلْ هُمْ فِى لَبْسٍۢ مِّنْ خَلْقٍۢ جَدِيدٍۢ"}, "049018": {"a": 18, "text": "إِنَّ ٱللَّهَ يَعْلَمُ غَيْبَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَٱللَّهُ بَصِيرٌۢ بِمَا تَعْمَلُونَ"}, "052012": {"a": 12, "text": "ٱلَّذِينَ هُمْ فِى خَوْضٍۢ يَلْعَبُونَ"}, "075005": {"a": 5, "text": "بَلْ يُرِيدُ ٱلْإِنسَٰنُ لِيَفْجُرَ أَمَامَهُۥ"}, "067003": {"a": 3, "text": "ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا ۖ مَّا تَرَىٰ فِى خَلْقِ ٱلرَّحْمَٰنِ مِن تَفَٰوُتٍۢ ۖ فَٱرْجِعِ ٱلْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍۢ"}, "056060": {"a": 60, "text": "نَحْنُ قَدَّرْنَا بَيْنَكُمُ ٱلْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ"}, "091014": {"a": 14, "text": "فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا"}, "055074": {"a": 74, "text": "لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ"}, "073005": {"a": 5, "text": "إِنَّا سَنُلْقِى عَلَيْكَ قَوْلًۭا ثَقِيلًا"}, "050029": {"a": 29, "text": "مَا يُبَدَّلُ ٱلْقَوْلُ لَدَىَّ وَمَآ أَنَا۠ بِظَلَّٰمٍۢ لِّلْعَبِيدِ"}, "051053": {"a": 53, "text": "أَتَوَاصَوْا۟ بِهِۦ ۚ بَلْ هُمْ قَوْمٌۭ طَاغُونَ"}, "070014": {"a": 14, "text": "وَمَن فِى ٱلْأَرْضِ جَمِيعًۭا ثُمَّ يُنجِيهِ"}, "077048": {"a": 48, "text": "وَإِذَا قِيلَ لَهُمُ ٱرْكَعُوا۟ لَا يَرْكَعُونَ"}, "083014": {"a": 14, "text": "كَلَّا ۖ بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ"}, "047002": {"a": 2, "text": "وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَءَامَنُوا۟ بِمَا نُزِّلَ عَلَىٰ مُحَمَّدٍۢ وَهُوَ ٱلْحَقُّ مِن رَّبِّهِمْ ۙ كَفَّرَ عَنْهُمْ سَيِّـَٔاتِهِمْ وَأَصْلَحَ بَالَهُمْ"}, "055024": {"a": 24, "text": "وَلَهُ ٱلْجَوَارِ ٱلْمُنشَـَٔاتُ فِى ٱلْبَحْرِ كَٱلْأَعْلَٰمِ"}, "089008": {"a": 8, "text": "ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ"}, "048007": {"a": 7, "text": "وَلِلَّهِ جُنُودُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا"}, "061010": {"a": 10, "text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ هَلْ أَدُلُّكُمْ عَلَىٰ تِجَٰرَةٍۢ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍۢ"}, "050026": {"a": 26, "text": "ٱلَّذِى جَعَلَ مَعَ ٱللَّهِ إِلَٰهًا ءَاخَرَ فَأَلْقِيَاهُ فِى ٱلْعَذَابِ ٱلشَّدِيدِ"}, "054011": {"a": 11, "text": "فَفَتَحْنَآ أَبْوَٰبَ ٱلسَّمَآءِ بِمَآءٍۢ مُّنْهَمِرٍۢ"}, "056041": {"a": 41, "text": "وَأَصْحَٰبُ ٱلشِّمَالِ مَآ أَصْحَٰبُ ٱلشِّمَالِ"}, "055043": {"a": 43, "text": "هَٰذِهِۦ جَهَنَّمُ ٱلَّتِى يُكَذِّبُ بِهَا ٱلْمُجْرِمُونَ"}, "048028": {"a": 28, "text": "هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًۭا"}, "075040": {"a": 40, "text": "أَلَيْسَ ذَٰلِكَ بِقَٰدِرٍ عَلَىٰٓ أَن يُحْۦِىَ ٱلْمَوْتَىٰ"}, "077049": {"a": 49, "text": "وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"}, "079018": {"a": 18, "text": "فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ"}, "048008": {"a": 8, "text": "إِنَّآ أَرْسَلْنَٰكَ شَٰهِدًۭا وَمُبَشِّرًۭا وَنَذِيرًۭا"}, "075036": {"a": 36, "text": "أَيَحْسَبُ ٱلْإِنسَٰنُ أَن يُتْرَكَ سُدًى"}, "089021": {"a": 21, "text": "كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّۭا دَكًّۭا"}, "067002": {"a": 2, "text": "ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًۭا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ"}, "056076": {"a": 76, "text": "وَإِنَّهُۥ لَقَسَمٌۭ لَّوْ تَعْلَمُونَ عَظِيمٌ"}, "068033": {"a": 33, "text": "كَذَٰلِكَ ٱلْعَذَابُ ۖ وَلَعَذَابُ ٱلْءَاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ"}, "072010": {"a": 10, "text": "وَأَنَّا لَا نَدْرِىٓ أَشَرٌّ أُرِيدَ بِمَن فِى ٱلْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًۭا"}, "055009": {"a": 9, "text": "وَأَقِيمُوا۟ ٱلْوَزْنَ بِٱلْقِسْطِ وَلَا تُخْسِرُوا۟ ٱلْمِيزَانَ"}, "089006": {"a": 6, "text": "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ"}, "061011": {"a": 11, "text": "تُؤْمِنُونَ بِٱللَّهِ وَرَسُولِهِۦ وَتُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ"}, "089005": {"a": 5, "text": "هَلْ فِى ذَٰلِكَ قَسَمٌۭ لِّذِى حِجْرٍ"}, "066001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ"}, "051032": {"a": 32, "text": "قَالُوٓا۟ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٍۢ مُّجْرِمِينَ"}, "050027": {"a": 27, "text": "۞ قَالَ قَرِينُهُۥ رَبَّنَا مَآ أَطْغَيْتُهُۥ وَلَٰكِن كَانَ فِى ضَلَٰلٍۭ بَعِيدٍۢ"}, "054028": {"a": 28, "text": "وَنَبِّئْهُمْ أَنَّ ٱلْمَآءَ قِسْمَةٌۢ بَيْنَهُمْ ۖ كُلُّ شِرْبٍۢ مُّحْتَضَرٌۭ"}, "048009": {"a": 9, "text": "لِّتُؤْمِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَتُعَزِّرُوهُ وَتُوَقِّرُوهُ وَتُسَبِّحُوهُ بُكْرَةًۭ وَأَصِيلًا"}, "077031": {"a": 31, "text": "لَّا ظَلِيلٍۢ وَلَا يُغْنِى مِنَ ٱللَّهَبِ"}, "080023": {"a": 23, "text": "كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ"}, "089009": {"a": 9, "text": "وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ"}}, EXPL={"3|الرياضيات|عالم الجمع والطرح": [{"t": "عالم الجمع والطرح", "k": "", "lines": ["بص يا حبيبي، لما نجمع، بنحط الأرقام تحت بعض: آحاد تحت آحاد، وعشرات تحت عشرات، ومئات تحت مئات."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["نبدأ الجمع من اليمين، من الآحاد. لو الناتج 10 أو أكتر، نكتب الآحاد ونرفع العشرة للعمود اللي جنبه. اسمها الحمل."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["في الطرح كمان نبدأ من الآحاد. لو الرقم اللي فوق أصغر، نستلف عشرة من العمود اللي جنبه."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["مثال: 45 + 28. نجمع 5 + 8 = 13، نكتب 3 ونرفع 1. بعدين 4 + 2 + 1 = 7. الناتج 73."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["اتأكد من الحل: الجمع نختبره بالطرح، والطرح نختبره بالجمع. لو رجعنا للرقم الأصلي يبقى الحل صح. يلا يا بطل."]}], "3|الرياضيات|عالم الزمن": [{"t": "عالم الزمن", "k": "", "lines": ["بص يا حبيبي، الساعة فيها 60 دقيقة، واليوم فيه 24 ساعة، والأسبوع 7 أيام."]}, {"t": "عالم الزمن", "k": "", "lines": ["العقرب الصغير بيقول الساعة، والعقرب الكبير بيقول الدقايق. لما الكبير على 6 نقول والنصف، ولما يكون على 3 نقول والربع."]}, {"t": "عالم الزمن", "k": "", "lines": ["الزمن المنقضي هو الفرق بين وقت البداية ووقت النهاية. من 3:00 لحد 5:30 يبقى ساعتين ونص."]}, {"t": "عالم الزمن", "k": "", "lines": ["السنة فيها 12 شهر، والشهر ممكن يكون 30 أو 31 يوم، وفبراير أقل."]}, {"t": "عالم الزمن", "k": "", "lines": ["اقرأ السؤال وشوف بيسأل عن ساعة ولا دقيقة ولا يوم، وبعدين اختار الوحدة الصح. يلا يا بطل."]}], "3|الرياضيات|مملكة الضرب": [{"t": "مملكة الضرب", "k": "", "lines": ["بص يا حبيبي، الضرب هو جمع الرقم نفسه كذا مرة. 4 × 3 يعني 4 + 4 + 4 = 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["جدول الضرب لازم نحفظه. ممكن نتعلمه بالعد بالقفزات: 3، 6، 9، 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["الترتيب مش بيغير الناتج: 4 × 3 = 3 × 4."]}, {"t": "مملكة الضرب", "k": "", "lines": ["أي رقم × 1 يساوي نفسه. وأي رقم × 0 يساوي صفر."]}, {"t": "مملكة الضرب", "k": "", "lines": ["لو السؤال فيه مجموعات متساوية، اعرف عدد المجموعات وعدد كل مجموعة واضرب. يلا يا بطل."]}], "3|الرياضيات|مملكة ا <script id="azhar-pro-js">
(function(){
"use strict";
document.addEventListener("keydown",function(e){
 if(!e.key)return;var tg=e.target;if(tg&&(tg.tagName==="INPUT"||tg.tagName==="SELECT"||tg.tagName==="TEXTAREA"))return;

function ageWord(a){if(!a)return"";return a===1?"سنة واحدة":a===2?"سنتان":a<=10?a+" سنين":a+" سنة"}
function greet(){
 try{
  if(typeof P==="undefined"||!P||!P.name)return;
  var app=document.getElementById("app");if(!app||app.querySelector("#azhi"))return;
  if(app.querySelector("#azparents"))return;
  var h1=app.querySelector("h1");if(!h1)return;
  var d=document.createElement("div");d.id="azhi";
  var age=P.age?(" · عمرك "+ageWord(P.age)):"";
  var goal=(P.set&&P.set.goal)?(" · هدفك اليوم "+P.set.goal+" أسئلة"):"";
  d.textContent="🌟 أهلًا بعودتك يا "+P.name+age+goal+" — يلا نكمل بطولاتك!";
  h1.parentNode.insertBefore(d,h1.nextSibling);
  var pb=document.createElement("button");pb.id="azpbtn";pb.className="btn gold";pb.style.cssText="width:100%;margin:6px 0 12px";
  pb.textContent="👨‍👩‍👧 ركن بابا وماما — سؤال للأهل ومساعدة ليهم";
  pb.addEventListener("click",function(){window.__azParents()});
  d.parentNode.insertBefore(pb,d.nextSibling);
 }catch(e){}
}
var PQ=null;
function pqPick(){
 try{
  var pool=(window.RAW||[]).filter(function(r){return r&&r.choices&&r.choices.length>=3&&r.explanation&&["القرآن","التربية الإسلامية","العربي"].indexOf(r.subject)>=0});
  if(!pool.length)return null;
  var q=pool[Math.floor(Math.random()*pool.length)];
  var ch=q.choices.slice();for(var i=ch.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ch[i];ch[i]=ch[j];ch[j]=t}
  return {q:q.question,ch:ch,ans:q.answer,exp:q.explanation,subj:q.subject};
 }catch(e){return null}
}
window.__azParents=function(){
 try{
  if(typeof P==="undefined"||!P)return;
  if(!PQ)PQ=pqPick();
  var girl=(typeof CFG!=="undefined"&&CFG.girl)||P.gender==="g";
  var kid=P.name, son=girl?"بنتكم":"ابنكم", his=girl?"ليها":"له";
  var ageTip=!P.age?"":P.age<=8?"في السن ده اللعب القصير المتكرر أفضل من الجلسات الطويلة: جولة واحدة (١٠ أسئلة) في اليوم كفاية، واحتفلوا بكل تقدم صغير.":P.age<=10?"في السن ده "+son+" يقدر يركز ٢٠ دقيقة: جولة أو جولتين يوميًا، وخلوه يشرح لكم إجابته بصوته — الشرح بصوت عالٍ بيثبّت المعلومة.":"في السن ده الاستعداد للامتحانات بيبدأ: شجعوه يحل جولة كاملة بدون تلميحات، ويراجع الشرح بعد كل غلطة — الغلطة اللي بتتصلح بنفسه ما بتتكررش.";
  var qhtml=PQ?('<div class="card"><h2>🧠 سؤال لبابا وماما</h2><p class="sync">من مادة '+PQ.subj+' — جاوبوا مع '+kid+' واتناقشوا في السبب:</p><div class="qtext">'+PQ.q+'</div><div id="azpq">'+PQ.ch.map(function(c,i){return '<button class="choice" data-azpq="'+i+'"><span>'+c+'</span></button>'}).join("")+'</div><div id="azpfb"></div><button class="btn small ghost" id="azpnew">🔄 سؤال جديد للأهل</button></div>'):'';
  var h='<div id="azparents"><h1>👨‍👩‍👧 ركن بابا وماما</h1>'
   +'<p class="card">أهلًا بيكم! الركن ده معمول عشان تساعدوا '+kid+' يستمتع ويتعلم. '+his+' في كل مادة <b>١٠ تلميحات</b> بس — التلميح بيشيل اختيارات غلط وبيخصم ٥ نقط، وبيكسب تلميحات جديدة لما يكسب جولات في المادة.</p>'
   +qhtml
   +'<div class="card"><h2>🤝 إزاي تساعدوا '+son+'؟</h2><p>'+ageTip+'</p><p>· اسألوه كل يوم: «اتعلمت إيه جديد؟» وخلوه يعلّمكم هو — أحلى تثبيت للمعلومة إنه يشرحها.<br>· شوفوا تقريره من زرار «تقريري» في اللعبة وقارنوا تقدمه أسبوع بأسبوع، وامدحوا الجهد مش الدرجة بس.<br>· لو سؤال صعب عليه، سيبوه يستخدم تلميح الأول قبل ما تقولوا الإجابة.</p></div>'
   +'<div class="card"><h2>💬 أسئلة تفتح الكلام بعد اللعب</h2><p>· إيه أكتر سؤال عجبك النهاردة وليه؟<br>· إيه السؤال اللي غلطت فيه واتعلمت منه إيه؟<br>· لو هتعمل سؤال لبابا وماما، هيكون عن إيه؟<br>· إيه المادة اللي عايز تكسب فيها تلميحات زيادة؟</p></div>'
   +'<button class="btn" data-a="home">🏠 رجوع للعبة '+kid+'</button></div>';
  render(h);
  var nb=document.getElementById("azpnew");if(nb)nb.addEventListener("click",function(){PQ=pqPick();window.__azParents()});
  var box=document.getElementById("azpq");
  if(box)box.addEventListener("click",function(e){var b=e.target.closest("[data-azpq]");if(!b||!PQ)return;var pick=PQ.ch[+b.getAttribute("data-azpq")];var fb=document.getElementById("azpfb");
   if(pick===PQ.ans){b.classList.add("ok");fb.innerHTML='<div class="warn" style="background:#e8f5e9">🎉 إجابة صح! '+PQ.exp+'<br>اتكلموا مع '+kid+': ليه دي الإجابة الصح؟</div>'}
   else{b.classList.add("bad");fb.innerHTML='<div class="warn">قربتوا! الإجابة الصح: <b>'+PQ.ans+'</b><br>'+PQ.exp+'</div>'}});
 }catch(e){}
};
