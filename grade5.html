.kid-root{--c1:#1e6fd9;--c2:#f08a00;--c3:#2b9348;--bg:#eaf3ff;--ink:#222;--card:#fff;--line:#e3e3e3;--fs:1;margin:0;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:calc(16px*var(--fs))}

.kid-root .lvl{font-size:.9em}

, "explanation": "في اليوم الآخر يبعث الله الناس ويحاسبهم على أعمالهم.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-118", "question": "الإيمان بالقدر خيره وشره ركن من أركان...", "choices": ["الإسلام", "الإيمان", "الوضوء", "الصلاة"], "answer": "الإيمان", "answerIndex": 1, "explanation": "الإيمان بالقدر هو الركن السادس من أركان الإيمان.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-119", "question": "من هو أول الرسل عليهم السلام؟", "choices": ["نوح عليه السلام", "إبراهيم عليه السلام", "آدم عليه السلام", "موسى عليه السلام"], "answer": "نوح عليه السلام", "answerIndex": 0, "explanation": "سيدنا نوح عليه السلام هو أول رسول أرسله الله إلى أهل الأرض.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-120", "question": "كم عدد أركان الإسلام؟", "choices": ["أربعة", "خمسة", "ستة", "سبعة"], "answer": "خمسة", "answerIndex": 1, "explanation": "أركان الإسلام خمسة: الشهادتان والصلاة والزكاة والصوم والحج.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-121", "question": "كم عدد الصلوات المفروضة في اليوم والليلة؟", "choices": ["ثلاث", "أربع", "خمس", "ست"], "answer": "خمس", "answerIndex": 2, "explanation": "فرض الله خمس صلوات: الفجر والظهر والعصر والمغرب والعشاء.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-122", "question": "ما أول ما يُحاسَب عليه العبد يوم القيامة؟", "choices": ["الصوم", "الصلاة", "الزكاة", "بر الوالدين"], "answer": "الصلاة", "answerIndex": 1, "explanation": "أول ما يحاسب عليه العبد يوم القيامة الصلاة، فإن صلحت صلح سائر عمله.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-123", "question": "ركعتا الفجر وصلاة الظهر أربع ركعات، فكم ركعة صلاة المغرب؟", "choices": ["ركعتان", "ثلاث ركعات", "أربع ركعات", "خمس ركعات"], "answer": "ثلاث ركعات", "answerIndex": 1, "explanation": "صلاة المغرب ثلاث ركعات، وهي أول صلاة الليل.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-124", "question": "ما الذي ينقض الوضوء؟", "choices": ["شرب الماء", "النوم العميق", "قراءة القرآن", "المشي"], "answer": "النوم العميق", "answerIndex": 1, "explanation": "النوم العميق من نواقض الوضوء، فيتوضأ المسلم بعده للصلاة.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-125", "question": "عند الوضوء نغسل الوجه واليدين ونمسح...", "choices": ["القدمين فقط", "الرأس", "الظهر", "البطن"], "answer": "الرأس", "answerIndex": 1, "explanation": "من أركان الوضوء مسح الرأس مرة واحدة.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-126", "question": "كم مرة نغسل أعضاء الوضوء في السنة؟", "choices": ["مرة واحدة فقط", "ثلاث مرات", "خمس مرات", "عشر مرات"], "answer": "ثلاث مرات", "answerIndex": 1, "explanation": "السنة غسل أعضاء الوضوء ثلاث مرات، والفرض مرة واحدة.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-127", "question": "الزكاة هي الركن ... من أركان الإسلام", "choices": ["الأول", "الثاني", "الثالث", "الخامس"], "answer": "الثالث", "answerIndex": 2, "explanation": "الزكاة الركن الثالث بعد الشهادتين والصلاة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-128", "question": "تُعطى الزكاة لـ...", "choices": ["الأغنياء فقط", "الفقراء والمساكين", "التجار فقط", "الأقارب الأغنياء"], "answer": "الفقراء والمساكين", "answerIndex": 1, "explanation": "الزكاة حق للفقراء والمساكين ومن حددهم الله في القرآن.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-129", "question": "في أي شهر يصوم المسلمون؟", "choices": ["شعبان", "رمضان", "شوال", "محرم"], "answer": "رمضان", "answerIndex": 1, "explanation": "صوم شهر رمضان فريضة وهو الركن الرابع من أركان الإسلام.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-130", "question": "ما الذي يفطر الصائم؟", "choices": ["النوم", "الأكل والشرب عمدًا", "الكلام", "القراءة"], "answer": "الأكل والشرب عمدًا", "answerIndex": 1, "explanation": "الأكل والشرب عمدًا في نهار رمضان يفطر الصائم.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-131", "question": "الحج هو الركن ... من أركان الإسلام", "choices": ["الثاني", "الثالث", "الرابع", "الخامس"], "answer": "الخامس", "answerIndex": 3, "explanation": "الحج الركن الخامس، ويجب مرة في العمر على المستطيع.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-132", "question": "يقف الحجاج يوم التاسع من ذي الحجة على جبل...", "choices": ["النور", "عرفات", "ثور", "أحد"], "answer": "عرفات", "answerIndex": 1, "explanation": "الوقوف بعرفة هو أعظم أركان الحج ويكون يوم التاسع من ذي الحجة.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-133", "question": "وُلد النبي محمد ﷺ في مدينة...", "choices": ["المدينة المنورة", "مكة المكرمة", "الطائف", "جدة"], "answer": "مكة المكرمة", "answerIndex": 1, "explanation": "وُلد النبي ﷺ في مكة المكرمة في عام الفيل.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-134", "question": "ما اسم أم النبي محمد ﷺ؟", "choices": ["خديجة رضي الله عنها", "آمنة بنت وهب", "فاطمة بنت أسد", "حليمة السعدية"], "answer": "آمنة بنت وهب", "answerIndex": 1, "explanation": "أم النبي ﷺ هي آمنة بنت وهب، ومرضعته حليمة السعدية.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-135", "question": "من أول من أسلم من النساء؟", "choices": ["عائشة رضي الله عنها", "خديجة رضي الله عنها", "فاطمة رضي الله عنها", "أسماء رضي الله عنها"], "answer": "خديجة رضي الله عنها", "answerIndex": 1, "explanation": "السيدة خديجة رضي الله عنها أول من آمن بالنبي ﷺ من النساء.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-136", "question": "هاجر النبي ﷺ من مكة إلى...", "choices": ["الطائف", "المدينة المنورة", "الشام", "اليمن"], "answer": "المدينة المنورة", "answerIndex": 1, "explanation": "هاجر النبي ﷺ إلى المدينة المنورة وأسس فيها الدولة.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-137", "question": "من صاحب النبي ﷺ في الهجرة؟", "choices": ["عمر بن الخطاب", "علي بن أبي طالب", "أبو بكر الصديق", "عثمان بن عفان"], "answer": "أبو بكر الصديق", "answerIndex": 2, "explanation": "رافق أبو بكر الصديق رضي الله عنه النبي ﷺ في هجرته.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-138", "question": "في أي غزوة انتصر المسلمون وكان عددهم أقل من المشركين؟", "choices": ["أحد", "بدر الكبرى", "الخندق", "حنين"], "answer": "بدر الكبرى", "answerIndex": 1, "explanation": "في بدر الكبرى نصر الله المسلمين رغم قلة عددهم.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-139", "question": "حدثت غزوة بدر الكبرى في السنة ... للهجرة", "choices": ["الأولى", "الثانية", "الخامسة", "العاشرة"], "answer": "الثانية", "answerIndex": 1, "explanation": "وقعت غزوة بدر الكبرى في السنة الثانية للهجرة في رمضان.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-140", "question": "في غزوة أحد استشهد عم النبي ﷺ وهو...", "choices": ["العباس", "حمزة بن عبد المطلب", "علي بن أبي طالب", "جعفر بن أبي طالب"], "answer": "حمزة بن عبد المطلب", "answerIndex": 1, "explanation": "استشهد حمزة رضي الله عنه في أحد ولُقب بسيد الشهداء.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-141", "question": "صلح الحديبية كان بين المسلمين و...", "choices": ["يهود المدينة", "قريش", "الروم", "الفرس"], "answer": "قريش", "answerIndex": 1, "explanation": "عقد النبي ﷺ صلح الحديبية مع قريش في السنة السادسة للهجرة.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-142", "question": "قال النبي ﷺ: «إنما بُعثت لأتمم مكارم...» أكمل الحديث", "choices": ["العبادات", "الأخلاق", "الأعمال", "الأقوال"], "answer": "الأخلاق", "answerIndex": 1, "explanation": "الحديث يبين أن من مقاصد بعثة النبي ﷺ إتمام الأخلاق الحسنة.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-143", "question": "بر الوالدين يعني...", "choices": ["طاعتهما والإحسان إليهما", "مخالفتهما", "ترك زيارتهما", "رفع الصوت عليهما"], "answer": "طاعتهما والإحسان إليهما", "answerIndex": 0, "explanation": "بر الوالدين طاعتهما في المعروف والإحسان إليهما بالقول والفعل.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-144", "question": "صلة الرحم تعني...", "choices": ["قطع الأقارب", "زيارة الأقارب والسؤال عنهم", "نسيان الأقارب", "معاداة الأقارب"], "answer": "زيارة الأقارب والسؤال عنهم", "answerIndex": 1, "explanation": "صلة الرحم زيارة الأقارب والإحسان إليهم والسؤال عنهم.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-145", "question": "من آداب الطعام أن نقول قبل الأكل...", "choices": ["الحمد لله", "بسم الله", "سبحان الله", "الله أكبر"], "answer": "بسم الله", "answerIndex": 1, "explanation": "نبدأ الطعام ببسم الله ونأكل باليد اليمنى ومما يلينا.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-146", "question": "من آداب دخول المسجد الدخول بالقدم...", "choices": ["اليسرى", "اليمنى", "الاثنتين معًا", "لا فرق"], "answer": "اليمنى", "answerIndex": 1, "explanation": "ندخل المسجد بالقدم اليمنى ونخرج باليسرى.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-147", "question": "قال النبي ﷺ: «المسلم من سلم المسلمون من لسانه و...» أكمل", "choices": ["ماله", "يده", "بيته", "عمله"], "answer": "يده", "answerIndex": 1, "explanation": "المسلم الحقيقي لا يؤذي غيره بلسانه ولا بيده.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-148", "question": "حديث «إنما الأعمال بالنيات» يعلمنا أن...", "choices": ["العمل بلا نية مقبول دائمًا", "النية أساس قبول العمل", "النية لا أهمية لها", "نكتم أعمالنا دائمًا"], "answer": "النية أساس قبول العمل", "answerIndex": 1, "explanation": "النية الصادقة لله هي أساس قبول الأعمال وثوابها.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-149", "question": "من هو النبي الذي بنى السفينة بأمر الله؟", "choices": ["هود عليه السلام", "نوح عليه السلام", "صالح عليه السلام", "لوط عليه السلام"], "answer": "نوح عليه السلام", "answerIndex": 1, "explanation": "بنى نوح عليه السلام السفينة ونجا بها المؤمنون من الطوفان.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-150", "question": "سيدنا إبراهيم عليه السلام لُقب بـ...", "choices": ["كليم الله", "خليل الله", "روح الله", "أمين الوحي"], "answer": "خليل الله", "answerIndex": 1, "explanation": "إبراهيم عليه السلام هو خليل الله، وموسى كليمه وعيسى روح الله.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-151", "question": "من النبي الذي أُلقي في النار فكانت بردًا وسلامًا؟", "choices": ["إسماعيل عليه السلام", "إبراهيم عليه السلام", "يعقوب عليه السلام", "إسحاق عليه السلام"], "answer": "إبراهيم عليه السلام", "answerIndex": 1, "explanation": "ألقى قوم إبراهيم به في النار فنجاه الله وجعلها بردًا وسلامًا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-152", "question": "سيدنا يوسف عليه السلام أُلقي في ... وهو صغير", "choices": ["النار", "البئر (الجب)", "البحر", "السجن مباشرة"], "answer": "البئر (الجب)", "answerIndex": 1, "explanation": "ألقى إخوة يوسف أخاهم في الجب حسدًا، ثم نجاه الله.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-153", "question": "ما المهنة التي عمل بها يوسف عليه السلام في مصر في النهاية؟", "choices": ["راعٍ", "عزيز مصر ومسؤول خزائنها", "نجار", "صياد"], "answer": "عزيز مصر ومسؤول خزائنها", "answerIndex": 1, "explanation": "أصبح يوسف عليه السلام مسؤولًا عن خزائن مصر بعد خروجه من السجن.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-154", "question": "من النبي الذي كلم الله تكليمًا؟", "choices": ["عيسى عليه السلام", "موسى عليه السلام", "يحيى عليه السلام", "هارون عليه السلام"], "answer": "موسى عليه السلام", "answerIndex": 1, "explanation": "موسى عليه السلام هو كليم الله، كلمه الله على جبل الطور.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-155", "question": "أغرق الله فرعون وجنوده في...", "choices": ["النيل", "البحر الأحمر", "نهر الفرات", "بئر عميقة"], "answer": "البحر الأحمر", "answerIndex": 1, "explanation": "شق الله البحر لموسى وقومه وأغرق فرعون وجنوده فيه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-156", "question": "عدد أجزاء القرآن الكريم...", "choices": ["عشرة", "عشرون", "ثلاثون", "ستون"], "answer": "ثلاثون", "answerIndex": 2, "explanation": "القرآن الكريم مقسم إلى ثلاثين جزءًا.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-157", "question": "أطول سورة في القرآن الكريم هي سورة...", "choices": ["آل عمران", "البقرة", "النساء", "المائدة"], "answer": "البقرة", "answerIndex": 1, "explanation": "سورة البقرة أطول سور القرآن وعدد آياتها 286 آية.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-158", "question": "أول سورة في المصحف هي سورة...", "choices": ["يس", "الفاتحة", "الإخلاص", "الكهف"], "answer": "الفاتحة", "answerIndex": 1, "explanation": "سورة الفاتحة أول سور المصحف وتسمى أم الكتاب.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-159", "question": "الصدق يهدي إلى...", "choices": ["الكذب", "البر والجنة", "الغضب", "الخوف"], "answer": "البر والجنة", "answerIndex": 1, "explanation": "قال النبي ﷺ: إن الصدق يهدي إلى البر وإن البر يهدي إلى الجنة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-160", "question": "الأمانة تعني...", "choices": ["أخذ أموال الناس", "حفظ حقوق الناس وردها", "إخفاء الحق", "التفاخر"], "answer": "حفظ حقوق الناس وردها", "answerIndex": 1, "explanation": "الأمين يحفظ ما اؤتمن عليه ويرده إلى أصحابه.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-161", "question": "ما حكم صلاة الجمعة على الرجل المسلم البالغ؟", "choices": ["سنة فقط", "فرض عين", "مستحبة", "مباحة"], "answer": "فرض عين", "answerIndex": 1, "explanation": "صلاة الجمعة فرض عين على كل مسلم ذكر بالغ مقيم.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-162", "question": "يُسن للمسلم عند سماع الأذان أن...", "choices": ["يتكلم كثيرًا", "يردد خلف المؤذن", "ينام", "يترك المكان"], "answer": "يردد خلف المؤذن", "answerIndex": 1, "explanation": "من السنة الترديد خلف المؤذن والدعاء بعد الأذان.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-163", "question": "التشهد يُقرأ في الصلاة عند...", "choices": ["الركوع", "السجود", "الجلوس بعد الركعتين وفي آخر الصلاة", "القيام فقط"], "answer": "الجلوس بعد الركعتين وفي آخر الصلاة", "answerIndex": 2, "explanation": "التشهد يكون في الجلوس للتشهد الأوسط والأخير.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-164", "question": "من سنن الصلاة...", "choices": ["ترك الفاتحة", "دعاء الاستفتاح", "الكلام", "الالتفات الكثير"], "answer": "دعاء الاستفتاح", "answerIndex": 1, "explanation": "دعاء الاستفتاح من سنن الصلاة يقال بعد تكبيرة الإحرام.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-165", "question": "تكبيرة الإحرام هي قول...", "choices": ["سبحان الله", "الله أكبر في أول الصلاة", "الحمد لله", "بسم الله"], "answer": "الله أكبر في أول الصلاة", "answerIndex": 1, "explanation": "نبدأ الصلاة بتكبيرة الإحرام وهي ركن لا تصح الصلاة بدونها.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-166", "question": "من مبطلات الصوم...", "choices": ["الاستحمام", "القيء عمدًا", "النوم نهارًا", "شم الطيب"], "answer": "القيء عمدًا", "answerIndex": 1, "explanation": "تعمّد القيء يبطل الصوم، أما من غلبه القيء فصومه صحيح.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-167", "question": "ليلة القدر تكون في شهر...", "choices": ["رجب", "شعبان", "رمضان", "ذو الحجة"], "answer": "رمضان", "answerIndex": 2, "explanation": "ليلة القدر في العشر الأواخر من رمضان وهي خير من ألف شهر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-168", "question": "أول من أسلم من الرجال الأحرار هو...", "choices": ["عمر بن الخطاب", "أبو بكر الصديق", "عثمان بن عفان", "طلحة بن عبيد الله"], "answer": "أبو بكر الصديق", "answerIndex": 1, "explanation": "أبو بكر الصديق رضي الله عنه أول من أسلم من الرجال الأحرار.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-169", "question": "كانت دار ... مقرًا سريًا للدعوة في مكة", "choices": ["الأرقم بن أبي الأرقم", "أبي بكر", "عمر", "حمزة"], "answer": "الأرقم بن أبي الأرقم", "answerIndex": 0, "explanation": "اجتمع النبي ﷺ بأصحابه سرًا في دار الأرقم بمكة.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/07/grade-5-islamic-education-first-term-2027-pdf.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-170", "question": "اسم الغار الذي اختبأ فيه النبي ﷺ وأبو بكر في الهجرة...", "choices": ["حراء", "ثور", "النور", "أحد"], "answer": "ثور", "answerIndex": 1, "explanation": "اختبأ النبي ﷺ وأبو بكر في غار ثور ثلاث ليال في الهجرة.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-171", "question": "نزل الوحي على النبي ﷺ أول مرة في غار...", "choices": ["ثور", "حراء", "نور", "الكهف"], "answer": "حراء", "answerIndex": 1, "explanation": "نزل جبريل عليه السلام بالوحي أول مرة على النبي ﷺ في غار حراء.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-172", "question": "كم كان عمر النبي ﷺ عندما نزل عليه الوحي؟", "choices": ["33 سنة", "40 سنة", "50 سنة", "25 سنة"], "answer": "40 سنة", "answerIndex": 1, "explanation": "بُعث النبي ﷺ وعمره أربعون سنة.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-173", "question": "قال النبي ﷺ:  "choices": ["إسحاق عليه السلام", "إسماعيل عليه السلام", "يعقوب عليه السلام", "يوسف عليه السلام"], "answer": "إسماعيل عليه السلام", "answerIndex": 1, "explanation": "إسماعيل عليه السلام هو الذبيح الذي فداه الله بذبح عظيم.", "type": "mcq", "topic": "", "source": "https://mozakira.com/prim-5-term-1-all-notes/"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-179", "question": "بنى إبراهيم وإسماعيل عليهما السلام...", "choices": ["المسجد الأقصى", "الكعبة المشرفة", "مسجد قباء", "قبة الصخرة"], "answer": "الكعبة المشرفة", "answerIndex": 1, "explanation": "رفع إبراهيم وإسماعيل قواعد الكعبة المشرفة بمكة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/212242"}, {"grade": 5, "subject": "تربية إسلامية", "id": "h26-g5-180", "question": "أم سيدنا موسى ألقته في اليم (النهر) خوفًا من...", "choices": ["قومه", "فرعون", "إخوته", "الروم"], "answer": "فرعون", "answerIndex": 1, "explanation": "أوحى الله إلى أم موسى أن تضعه في التابوت وتلقيه في اليم خوفًا من فرعون الذي كان يقتل الأطفال.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/islamic-education-grade-5-first-term-pdf-2026.html"}, {"grade": 5, "subject": "لغة عربية", "id": "h26-g5-181", "question": "الجملة التي تبدأ باسم تسمى جملة...", "choices": ["فعلية", "اسمية", "طلبية", "شرطية"], "answer": "اسمية", "answerIndex": 1, "explanation": "الجملة الاسمية تبدأ باسم مثل: العلمُ نافعٌ.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/287824"}, {"grade": 5, "subject": "لغة عربية", "id": "h26-g5-182", "question": "الجملة «كتب التلميذ الدرس» نوعها...", "choices": ["اسمية", "فعلية", "خبرية فقط", "إنشائية"], "answer": "فعلية", "answerIndex": 1, "explanation": "بدأت الجملة بفعل (كتب) فهي جملة فعلية.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/teacher/mr-gomaa-qorny-labib"}, {"grade": 5, "subject": "لغة عربية", "id": "h26-g5-183", "question": "في جملة «الحديقة واسعة» كلمة الحديقة...", "choices": ["خبر", "مبتدأ", "فاعل", "مفعول به"], "answer": "مبتدأ", د منها التربة والنباتات.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/285883"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-306", "question": "الشبكة الغذائية هي...؟", "choices": ["سلسلة غذائية واحدة", "تشابك وتداخل عدة سلاسل غذائية", "غذاء الإنسان فقط", "مكان يعيش فيه الحيوان"], "answer": "تشابك وتداخل عدة سلاسل غذائية", "answerIndex": 1, "explanation": "لأن الكائن الواحد يتغذى على أكثر من نوع ويأكله أكثر من نوع، تتداخل السلاسل مكوّنة شبكة غذائية.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-307", "question": "الأرنب الذي يأكل العشب والجزر يُصنف من الكائنات...؟", "choices": ["المفترسة", "المستهلكة آكلة العشب", "المنتجة", "المحللة"], "answer": "المستهلكة آكلة العشب", "answerIndex": 1, "explanation": "الأرنب يتغذى على النباتات فقط، فهو مستهلك من آكلي العشب (العواشب).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-308", "question": "الأسد الذي يأكل الغزال يُصنف من الكائنات...؟", "choices": ["المنتجة", "المستهلكة آكلة اللحوم", "المحللة", "آكلة العشب"], "answer": "المستهلكة آكلة اللحوم", "answerIndex": 1, "explanation": "الأسد يتغذى على لحوم الحيوانات الأخرى، فهو مستهلك من آكلي اللحوم (اللواحم).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-309", "question": "الدجاجة التي تأكل الحبوب والديدان معًا تُسمى كائنًا...؟", "choices": ["منتجًا", "قارتًا (يأكل النبات والحيوان)", "محللًا", "مفترسًا فقط"], "answer": "قارتًا (يأكل النبات والحيوان)", "answerIndex": 1, "explanation": "الكائن القارت يتغذى على النباتات والحيوانات معًا، مثل الدجاجة والإنسان.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-310", "question": "إذا اختفت الضفادع من نظام بيئي تكثر فيه الجراد، فماذا يحدث غالبًا؟", "choices": ["يقل الجراد", "يزيد الجراد ويأكل المحاصيل", "لا يتغير شيء", "يختفي العشب"], "answer": "يزيد الجراد ويأكل المحاصيل", "answerIndex": 1, "explanation": "الضفادع كانت تأكل الجراد وتحد من عدده، وباختفائها يزيد الجراد فيضر بالمحاصيل.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/285883"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-311", "question": "من أين تحصل النباتات الخضراء على الطاقة لصنع غذائها؟", "choices": ["من التربة مباشرة", "من ضوء الشمس", "من الحيوانات", "من الماء فقط"], "answer": "من ضوء الشمس", "answerIndex": 1, "explanation": "النبات يستخدم طاقة ضوء الشمس في عملية البناء الضوئي لصنع غذائه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-312", "question": "تنتقل الطاقة في السلسلة الغذائية من...؟", "choices": ["المستهلك إلى المنتج", "المنتج إلى المستهلكين", "المحلل إلى الشمس", "الحيوان إلى النبات دائمًا"], "answer": "المنتج إلى المستهلكين", "answerIndex": 1, "explanation": "الطاقة تبدأ من الشمس إلى المنتج (النبات)، ثم تنتقل إلى المستهلكات التي تأكله.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-313", "question": "عندما يأكل الأرنب العشب، فإنه يحصل منه على...؟", "choices": ["الطاقة اللازمة لحياته", "ضوء الشمس", "الأكسجين فقط", "الماء فقط"], "answer": "الطاقة اللازمة لحياته", "answerIndex": 0, "explanation": "الغذاء يمد الكائن الحي بالطاقة اللازمة للنمو والحركة والحياة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-314", "question": "ما مصدر الطاقة الرئيسي لكل السلاسل الغذائية على الأرض؟", "choices": ["القمر", "الشمس", "الرياح", "البحر"], "answer": "الشمس", "answerIndex": 1, "explanation": "الشمس هي المصدر الرئيسي للطاقة؛ يلتقطها النبات ليصنع غذاءه وتبدأ منها السلاسل الغذائية.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-315", "question": "لماذا تقل الطاقة كلما انتقلنا من كائن إلى آخر في السلسلة الغذائية؟", "choices": ["لأن الشمس تتوقف", "لأن جزءًا من الطاقة يُستهلك في الحركة والحرارة", "لأن النباتات تموت", "لا تقل الطاقة أبدًا"], "answer": "لأن جزءًا من الطاقة يُستهلك في الحركة والحرارة", "answerIndex": 1, "explanation": "كل كائن يستهلك جزءًا كبيرًا من الطاقة في أنشطته وحرارته، فيصل للكائن التالي جزء أقل.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-316", "question": "في هرم الطاقة، توجد أكبر كمية من الطاقة عند...؟", "choices": ["قمة الهرم (المفترسات)", "قاعدة الهرم (المنتجات)", "المحللات", "المستهلكات الثانية"], "answer": "قاعدة الهرم (المنتجات)", "answerIndex": 1, "explanation": "المنتجات في القاعدة تلتقط طاقة الشمس كلها تقريبًا، وتقل الطاقة كلما صعدنا في الهرم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286634"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-317", "question": "أي مما يلي يُعد مثالًا على سلسلة غذائية في الماء؟", "choices": ["عشب ← بقرة ← إنسان", "طحالب ← سمكة صغيرة ← سمكة كبيرة", "شجرة ← قرد ← نمر", "قمح ← فأر ← قطة"], "answer": "طحالب ← سمكة صغيرة ← سمكة كبيرة", "answerIndex": 1, "explanation": "الطحالب منتجة في الماء، تأكلها الأسماك الصغيرة، وتأكلها الأسماك الكبيرة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-318", "question": "ماذا يحدث للنظام البيئي إذا قطع الإنسان أشجار الغابة كلها؟", "choices": ["يتحسن النظام البيئي", "تفقد حيوانات كثيرة مأواها وغذاءها", "تزيد الأمطار دائمًا", "لا يحدث شيء"], "answer": "تفقد حيوانات كثيرة مأواها وغذاءها", "answerIndex": 1, "explanation": "الأشجار مأوى وغذاء لكائنات كثيرة، وقطعها يخل بتوازن النظام البيئي ويهدد الكائنات.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/285883"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-319", "question": "من أسباب تغير الأنظمة البيئية بفعل الإنسان...؟", "choices": ["نمو النباتات", "إلقاء المخلفات وتلويث الماء والهواء", "هطول المطر", "تعاقب الليل والنهار"], "answer": "إلقاء المخلفات وتلويث الماء والهواء", "answerIndex": 1, "explanation": "أنشطة الإنسان مثل التلويث وقطع الأشجار والصيد الجائر تغير الأنظمة البيئية وتضر بها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-320", "question": "الفيضانات والبراكين والجفاف أمثلة على تغيرات في النظام البيئي سببها...؟", "choices": ["الإنسان فقط", "عوامل طبيعية", "الحيوانات", "النباتات"], "answer": "عوامل طبيعية", "answerIndex": 1, "explanation": "هذه كوارث وظواهر طبيعية تحدث دون تدخل الإنسان وتغير شكل النظام البيئي.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-321", "question": "إذا زاد عدد الأرانب زيادة كبيرة في منطقة ما، فماذا قد يحدث للعشب؟", "choices": ["يزيد العشب", "يقل العشب لكثرة أكله", "لا يتأثر العشب", "يتحول العشب لأشجار"], "answer": "يقل العشب لكثرة أكله", "answerIndex": 1, "explanation": "زيادة المستهلكات آكلة العشب تعني أكل كميات أكبر من العشب فيقل.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-322", "question": "الصيد الجائر للأسماك يؤدي إلى...؟", "choices": ["زيادة الأسماك", "نقص أعداد الأسماك واختلال التوازن البيئي", "تحسين الماء", "زيادة الطحالب فقط دون ضرر"], "answer": "نقص أعداد الأسماك واختلال التوازن البيئي", "answerIndex": 1, "explanation": "الصيد الزائد يقلل أعداد الأسماك بشدة وقد يهددها بالانقراض ويخل بالسلسلة الغذائية.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286634"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-323", "question": "إنشاء المحميات الطبيعية يساعد على...؟", "choices": ["تلويث البيئة", "حماية الكائنات المهددة بالانقراض وبيئاتها", "قطع الأشجار", "صيد الحيوانات النادرة"], "answer": "حماية الكائنات المهددة بالانقراض وبيئاتها", "answerIndex": 1, "explanation": "المحمية منطقة محمية بالقانون تعيش فيها الكائنات بأمان بعيدًا عن الصيد والتلوث.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-324", "question": "أي مما يلي سلوك يحمي الموارد الطبيعية؟", "choices": ["ترك صنبور الماء مفتوحًا", "إعادة تدوير الورق والبلاستيك", "حرق القمامة في الشارع", "قطع الأشجار دون زراعة غيرها"], "answer": "إعادة تدوير الورق والبلاستيك", "answerIndex": 1, "explanation": "إعادة التدوير تقلل استهلاك الموارد الجديدة وتقلل كمية المخلفات الملوثة للبيئة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-325", "question": "ترشيد استهلاك الماء يعني...؟", "choices": ["استخدام الماء بإسراف", "استخدام الماء بقدر الحاجة دون إسراف", "منع استخدام الماء نهائيًا", "رش الشوارع بالماء يوميًا"], "answer": "استخدام الماء بقدر الحاجة دون إسراف", "answerIndex": 1, "explanation": "الترشيد هو الاستخدام الحكيم للمورد دون تبذير، مثل إغلاق الصنبور أثناء غسل الأسنان.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/10/grade-5-science-notes-term-1-2027.html"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-326", "question": "كيف نوفر الكهرباء في المنزل؟", "choices": ["ترك الأنوار مضاءة نهارًا", "إطفاء الأنوار والأجهزة عند عدم الحاجة إليها", "تشغيل كل الأجهزة معًا", "فتح الثلاجة طويلًا"], "answer": "إطفاء الأنوار والأجهزة عند عدم الحاجة إليها", "answerIndex": 1, "explanation": "إطفاء ما لا نحتاجه يوفر الكهرباء ويحمي الموارد ويقلل التلوث.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-327", "question": "إعادة تدوير الزجاجات البلاستيكية تعني...؟", "choices": ["رميها في النيل", "صنع منتجات جديدة منها بدل رميها", "حرقها في الهواء", "دفنها في الحديقة"], "answer": "صنع منتجات جديدة منها بدل رميها", "answerIndex": 1, "explanation": "التدوير يعيد تصنيع المخلفات إلى منتجات مفيدة جديدة فتقل النفايات ويُحفظ المورد.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-328", "question": "ما أخطر أسباب تلوث الهواء في المدن؟", "choices": ["زراعة الأشجار", "عوادم السيارات ودخان المصانع", "هطول الأمطار", "أصوات الطيور"], "answer": "عوادم السيارات ودخان المصانع", "answerIndex": 1, "explanation": "العوادم والدخان يحتويان غازات ومواد ضارة تلوث الهواء وتضر بصحة الإنسان.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-329", "question": "إلقاء مخلفات المصانع في مياه النيل يؤدي إلى...؟", "choices": ["تنقية الماء", "تلوث الماء وموت الأسماك والكائنات المائية", "زيادة الأسماك", "تحسين طعم الماء"], "answer": "تلوث الماء وموت الأسماك والكائنات المائية", "answerIndex": 1, "explanation": "المخلفات مواد سامة تلوث الماء فتمرض الكائنات المائية وتموت ويصبح الماء غير صالح.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/10/grade-5-science-notes-term-1-2027.html"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-330", "question": "زراعة الأشجار حول المدن تساعد على...؟", "choices": ["زيادة تلوث الهواء", "تنقية الهواء وإنتاج الأكسجين", "زيادة دخان المصانع", "تجفيف التربة"], "answer": "تنقية الهواء وإنتاج الأكسجين", "answerIndex": 1, "explanation": "الأشجار تمتص ثاني أكسيد الكربون وتطلق الأكسجين فتنقي الهواء.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-331", "question": "أي الموارد التالية مورد متجدد؟", "choices": ["الفحم", "البترول", "طاقة الشمس", "الغاز الطبيعي"], "answer": "طاقة الشمس", "answerIndex": 2, "explanation": "طاقة الشمس لا تنفد وتتجدد باستمرار، أما الفحم والبترول والغاز فموارد غير متجددة تنفد.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-332", "question": "الماء العذب الصالح للشرب على الأرض كميته...؟", "choices": ["لا تنتهي مهما أسرفنا", "محدودة ويجب الحفاظ عليها", "أكثر من ماء البحار المالح", "تزيد كل يوم تلقائيًا"], "answer": "محدودة ويجب الحفاظ عليها", "answerIndex": 1, "explanation": "معظم ماء الأرض مالح، والماء العذب قليل ومحدود، لذلك يجب ترشيده وحمايته من التلوث.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/10/grade-5-science-notes-term-1-2027.html"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-333", "question": "حالات المادة الثلاث هي...؟", "choices": ["صلبة وسائلة وغازية", "صلبة ومائية ونارية", "سائلة وحارة وباردة", "غازية وترابية ومعدنية"], "answer": "صلبة وسائلة وغازية", "answerIndex": 0, "explanation": "المادة توجد في ثلاث حالات: صلبة مثل الحديد، وسائلة مثل الماء، وغازية مثل الهواء.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-334", "question": "أي مما يلي مادة في حالة صلبة؟", "choices": ["الماء", "عصير البرتقال", "قطعة خشب", "بخار الماء"], "answer": "قطعة خشب", "answerIndex": 2, "explanation": "الخشب له شكل وحجم ثابتان، فهو مادة صلبة، أما الماء والعصير فسائلان والبخار غاز.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-335", "question": "من خواص المادة السائلة أنها...؟", "choices": ["لها شكل ثابت لا يتغير", "تأخذ شكل الإناء الذي توضع فيه وحجمها ثابت", "تنتشر وتملأ المكان كله", "لا يمكن قياس حجمها"], "answer": "تأخذ شكل الإناء الذي توضع فيه وحجمها ثابت", "answerIndex": 1, "explanation": "السائل حجمه ثابت لكن شكله يتغير بحسب شكل الإناء الذي يحتويه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-336", "question": "من خواص المادة الغازية أنها...؟", "choices": ["لها حجم وشكل ثابتان", "تنتشر وتملأ الفراغ الذي توجد فيه", "تأخذ شكل الإناء وحجمها ثابت", "صلبة وقاسية"], "answer": "تنتشر وتملأ الفراغ الذي توجد فيه", "answerIndex": 1, "explanation": "الغازات ليس لها شكل أو حجم ثابت، بل تنتشر لتملأ كل الفراغ المتاح لها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-337", "question": "عندما يتحول الماء السائل بالتبريد الشديد إلى ثلج، فهذا تغير في...؟", "choices": ["نوع المادة الكيميائي", "حالة المادة من سائلة إلى صلبة", "لون الماء فقط", "كتلة الماء فتختفي"], "answer": "حالة المادة من سائلة إلى صلبة", "answerIndex": 1, "explanation": "التجمد يحول الماء من الحالة السائلة إلى الصلبة، ويبقى ماءً كما هو دون تغير في تركيبه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/285883"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-338", "question": "انصهار الشمع بالحرارة مثال على تغير...؟", "choices": ["كيميائي", "فيزيائي", "بيئي", "غذائي"], "answer": "فيزيائي", "answerIndex": 1, "explanation": "الانصهار يغير حالة الشمع من صلب إلى سائل فقط ويبقى شمعًا، فهو تغير فيزيائي.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-339", "question": "احتراق الورق مثال على تغير...؟", "choices": ["فيزيائي", "كيميائي", "في حالة المادة فقط", "في الشكل فقط"], "answer": "كيميائي", "answerIndex": 1, "explanation": "الاحتراق ينتج مواد جديدة (رماد وغازات) لا يمكن إعادتها ورقًا، فهو تغير كيميائي.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-340", "question": "أي مما يلي تغير فيزيائي؟", "choices": ["صدأ الحديد", "تمزيق الورق إلى قطع صغيرة", "احتراق الخشب", "نضج الطعام وتحوله"], "answer": "تمزيق الورق إلى قطع صغيرة", "answerIndex": 1, "explanation": "التمزيق يغير شكل الورق وحجمه فقط ويبقى ورقًا، أما الصدأ والاحتراق فينتجان مواد جديدة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286634"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-341", "question": "صدأ الحديد الذي يظهر على المسامير القديمة تغير...؟", "choices": ["فيزيائي لأنه يغير اللون فقط", "كيميائي لأنه يكوّن مادة جديدة", "لا يعد تغيرًا", "فيزيائي يمكن عكسه بسهولة"], "answer": "كيميائي لأنه يكوّن مادة جديدة", "answerIndex": 1, "explanation": "الصدأ مادة جديدة تتكون من تفاعل الحديد مع الهواء والماء، فهو تغير كيميائي.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-342", "question": "المخلوط هو...؟", "choices": ["مادة نقية واحدة", "مادتان أو أكثر مختلطة دون أن تتكون مادة جديدة", "مادة تنتج من الاحتراق", "غاز فقط"], "answer": "مادتان أو أكثر مختلطة دون أن تتكون مادة جديدة", "answerIndex": 1, "explanation": "في المخلوط تحتفظ كل مادة بخواصها ويمكن فصلها بطرق بسيطة، مثل مخلوط الرمل والماء.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-343", "question": "كيف نفصل برادة الحديد عن الرمل؟", "choices": ["بالترشيح", "باستخدام المغناطيس", "بالتبخير", "بالتجميد"], "answer": "باستخدام المغناطيس", "answerIndex": 1, "explanation": "المغناطيس يجذب برادة الحديد ولا يجذب الرمل، فينفصل الحديد بسهولة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-344", "question": "كيف نفصل الرمل عن الماء؟", "choices": ["بالمغناطيس", "بالترشيح", "بالتبخير", "بالتسخين حتى الغليان فقط"], "answer": "بالترشيح", "answerIndex": 1, "explanation": "نصب المخلوط على ورقة ترشيح أو قماش فيمر الماء ويبقى الرمل لأنه لا يذوب.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-345", "question": "كيف نحصل على الملح بعد ذوبانه في الماء؟", "choices": ["بالترشيح", "بالمغناطيس", "بتبخير الماء", "بالتجميد"], "answer": "بتبخير الماء", "answerIndex": 2, "explanation": "الملح ذائب فلا يفصله الترشيح، لكن بتبخير الماء بالحرارة يبقى الملح في الإناء.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286634"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-346", "question": "مخلوط من الحصى وحبات الفول مختلفة الأحجام يمكن فصله بـ...؟", "choices": ["التبخير", "الالتقاط باليد أو الغربلة", "المغناطيس", "الترشيح بالماء"], "answer": "الالتقاط باليد أو الغربلة", "answerIndex": 1, "explanation": "الحبيبات الكبيرة المختلفة يمكن فصلها باليد أو بغربال مناسب لحجمها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-347", "question": "ذوبان السكر في الشاي مثال على تكون...؟", "choices": ["مادة صلبة جديدة", "مخلوط يمكن استرجاع السكر منه بالتبخير", "تغير كيميائي دائم", "غاز"], "answer": "مخلوط يمكن استرجاع السكر منه بالتبخير", "answerIndex": 1, "explanation": "السكر يذوب ويختفي في الشاي لكنه موجود، ويمكن استرجاعه بتبخير الماء.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-348", "question": "أي مما يلي لا يُعد من طرق حماية البيئة؟", "choices": ["تشجير الحدائق", "استخدام أكياس قماش بدل البلاستيك", "إلقاء القمامة في الترع والمصارف", "فصل المخلفات لإعادة تدويرها"], "answer": "إلقاء القمامة في الترع والمصارف", "answerIndex": 2, "explanation": "إلقاء القمامة في الماء يلوثه ويضر بالكائنات والإنسان، وهو سلوك ضار بالبيئة.", "type": "mcq", "topic": "", "source": "https://www.cursati.com/2026/10/grade-5-science-notes-term-1-2027.html"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-349", "question": "عندما تأكل البقرة العشب ثم يأكل الإنسان لحم البقرة، يكون الإنسان...؟", "choices": ["منتجًا", "مستهلكًا أول", "مستهلكًا ثانيًا", "محللًا"], "answer": "مستهلكًا ثانيًا", "answerIndex": 2, "explanation": "البقرة مستهلك أول لأنها تأكل المنتج (العشب)، والإنسان يأكل المستهلك الأول فهو مستهلك ثانٍ.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-350", "question": "الفطريات التي تنمو على الخبز القديم وتحلله تُعد كائنات...؟", "choices": ["منتجة", "مستهلكة مفترسة", "محللة", "قارتة"], "answer": "محللة", "answerIndex": 2, "explanation": "الفطريات تحلل بقايا الكائنات والمواد العضوية وتعيد عناصرها إلى البيئة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-351", "question": "أهمية المحللات للنباتات أنها...؟", "choices": ["تأكل أوراق النباتات", "تمد التربة بمواد بسيطة يمتصها النبات لينمو", "تمنع ضوء الشمس", "تصنع غذاء النبات بدلًا عنه"], "answer": "تمد التربة بمواد بسيطة يمتصها النبات لينمو", "answerIndex": 1, "explanation": "بتحليل البقايا تتحرر مواد غذائية بسيطة في التربة يمتصها النبات بجذوره فينمو.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-352", "question": "أي كائن يبدأ كل السلاسل الغذائية البرية تقريبًا؟", "choices": ["الحيوانات آكلة العشب", "النباتات الخضراء", "المفترسات", "المحللات"], "answer": "النباتات الخضراء", "answerIndex": 1, "explanation": "النباتات الخضراء هي المنتجات التي تصنع الغذاء، وتبدأ بها السلاسل الغذائية.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/285883"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-353", "question": "تحول العصير السائل إلى مصاصة مثلجة في المجمد (الفريزر) يسمى...؟", "choices": ["انصهارًا", "تجمدًا", "تبخرًا", "تكثفًا"], "answer": "تجمدًا", "answerIndex": 1, "explanation": "بالتبريد الشديد يتحول السائل إلى مادة صلبة، وهذا التحول يسمى التجمد.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-354", "question": "عند ترك كوب ماء في الشمس يقل الماء تدريجيًا بسبب...؟", "choices": ["التجمد", "التبخر", "التكثف", "الانصهار"], "answer": "التبخر", "answerIndex": 1, "explanation": "حرارة الشمس تحول جزءًا من الماء السائل إلى بخار ماء يتصاعد في الهواء، وهو التبخر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/284140"}, {"grade": 5, "subject": "العلوم", "id": "h26-g5-355", "question": "قطرات الماء التي تتكون على زجاج بارد في الشتاء ناتجة عن...؟", "choices": ["تبخر الماء", "تكثف بخار الماء", "تجمد الماء", "انصهار الثلج"], "answer": "تكثف بخار الماء", "answerIndex": 1, "explanation": "بخار الماء في الهواء يتحول عند ملامسته سطحًا باردًا إلى قطرات ماء سائلة، وهذا هو التكثف.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/286634"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-356", " tion": "الهرم الأكبر بالجيزة بناه الملك خوفو من ملوك مصر القديمة، وهو من عجائب الدنيا السبع القديمة الباقية.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/214565"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-388", "question": "ما أسماء أهرامات الجيزة الثلاثة المشهورة؟", "choices": ["خوفو وخفرع ومنقرع", "رمسيس وخوفو وزوسر", "حتشبسوت وتحتمس وخوفو", "منقرع وتوت وزوسر"], "answer": "خوفو وخفرع ومنقرع", "answerIndex": 0, "explanation": "أهرامات الجيزة الثلاثة للملوك خوفو وخفرع ومنقرع، وأكبرها هرم خوفو.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/214565"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-389", "question": "من صاحب أول هرم مدرج في التاريخ بسقارة؟", "choices": ["الملك زوسر", "الملك خوفو", "الملك خفرع", "الملك رمسيس الثاني"], "answer": "الملك زوسر", "answerIndex": 0, "explanation": "الهرم المدرج بسقارة بناه الملك زوسر، وصممه وزيره المهندس إمحوتب.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/259295"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-390", "question": "اشتهر الملك رمسيس الثاني ببناء معبد أين؟", "choices": ["معبد أبو سمبل في النوبة", "معبد الكرنك فقط", "هرم سقارة", "قصر المنتزه"], "answer": "معبد أبو سمبل في النوبة", "answerIndex": 0, "explanation": "رمسيس الثاني من أشهر ملوك مصر القديمة، وبنى معبد أبو سمبل جنوب مصر المنحوت في الصخر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/214565"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-391", "question": "يقع معبد الكرنك الشهير في أي مدينة؟", "choices": ["الأقصر", "أسوان", "الإسكندرية", "القاهرة"], "answer": "الأقصر", "answerIndex": 0, "explanation": "معبد الكرنك في الأقصر من أكبر معابد مصر القديمة، والأقصر غنية بمعابد الفراعنة ومقابرهم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/214565"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-392", "question": "ساعد نهر النيل على قيام الحضارة المصرية القديمة، لماذا؟", "choices": ["لأنه وفر الماء والتربة الخصبة والانتقال", "لأنه وفر الذهب فقط", "لأنه منع الزراعة", "لأنه كان بحرًا مالحًا"], "answer": "لأنه وفر الماء والتربة الخصبة والانتقال", "answerIndex": 0, "explanation": "قامت الحضارة حول النيل لأنه مصدر الماء والطمي الخصب وطريق للنقل بين الشمال والجنوب.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/259295"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-393", "question": "ما التلوث المائي؟", "choices": ["إلقاء المخلفات في المياه فتصبح غير صالحة", "زيادة مياه الفيضان فقط", "تجفيف الأنهار", "زراعة الأشجار حول النهر"], "answer": "إلقاء المخلفات في المياه فتصبح غير صالحة", "answerIndex": 0, "explanation": "تلوث المياه يحدث بإلقاء مخلفات المصانع والصرف والسفن فيها، ويضر الإنسان والأسماك.", "type": "mcq", "topic": "", "source": "https://www.slideshare.net/slideshow/ss-39982140/39982140"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-394", "question": "كيف نحافظ على مياه نهر النيل؟", "choices": ["بعدم إلقاء المخلفات وترشيد الاستهلاك", "بإهدار المياه في الزراعة", "بإلقاء القمامة فيه", "بغلق الترع كلها"], "answer": "بعدم إلقاء المخلفات وترشيد الاستهلاك", "answerIndex": 0, "explanation": "حماية النيل تكون بعدم تلويثه وترشيد استخدام المياه في البيت والزراعة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/214565"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-395", "question": "تطل مصر على بحرين مهمين، ما هما؟", "choices": ["البحر المتوسط والبحر الأحمر", "بحر قزوين والبحر الأسود", "البحر العربي وخليج عدن فقط", "بحر الشمال وبحر البلطيق"], "answer": "البحر المتوسط والبحر الأحمر", "answerIndex": 0, "explanation": "موقع مصر مميز؛ تطل شمالًا على البحر المتوسط وشرقًا على البحر الأحمر وتربطهما قناة السويس.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/259295"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-396", "question": "في أي قارة تقع مصر؟", "choices": ["قارة آسيا فقط", "قارة أفريقيا (وجزء منها سيناء في آسيا)", "قارة أوروبا", "قارة أمريكا"], "answer": "قارة أفريقيا (وجزء منها سيناء في آسيا)", "answerIndex": 1, "explanation": "تقع مصر في الركن الشمالي الشرقي من أفريقيا، وتقع شبه جزيرة سيناء منها في قارة آسيا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/259295"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-397", "question": "ما فائدة المياه المالحة في مصر؟", "choices": ["صيد الأسماك واستخراج الملح والبترول من قاع البحر", "الشرب المباشر دون معالجة", "ري القمح مباشرة", "توليد طاقة الرياح"], "answer": "صيد الأسماك واستخراج الملح والبترول من قاع البحر", "answerIndex": 0, "explanation": "البحار مصدر للأسماك والملح، ويُستخرج من قاعها البترول والغاز الطبيعي.", "type": "mcq", "topic": "", "source": "https://www.slideshare.net/slideshow/ss-39982140/39982140"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-398", "question": "يعمل كثير من سكان مصر في الزراعة، أين تتركز الأراضي الزراعية؟", "choices": ["في وادي النيل والدلتا", "في قلب الصحراء الغربية فقط", "في جبال البحر الأحمر", "في قاع البحر المتوسط"], "answer": "في وادي النيل والدلتا", "answerIndex": 0, "explanation": "الأراضي الزراعية تتركز حيث الماء والتربة الخصبة في وادي النيل والدلتا.", "type": "mcq", "topic": "", "source": "https://nabdapp.com/t/144864843-8c9226"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-399", "question": "ما أهمية الثروة السمكية في مصر؟", "choices": ["توفر غذاءً غنيًا بالبروتين للسكان", "تُستخدم في صناعة الملابس", "تُستخدم وقودًا للسيارات", "ليس لها أهمية"], "answer": "توفر غذاءً غنيًا بالبروتين للسكان", "answerIndex": 0, "explanation": "الأسماك غذاء مهم من النيل والبحار والبحيرات والمزارع السمكية في مصر.", "type": "mcq", "topic": "", "source": "https://nabdapp.com/t/144864843-8c9226"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-400", "question": "أي نشاط اقتصادي يعتمد على زيارة الأماكن الأثرية والشواطئ؟", "choices": ["السياحة", "التعدين", "الزراعة", "الصناعة الثقيلة"], "answer": "السياحة", "answerIndex": 0, "explanation": "السياحة نشاط يعتمد على زيارة الآثار والشواطئ والمنتجعات، وتوفر دخلًا وفرص عمل.", "type": "mcq", "topic": "", "source": "https://nabdapp.com/t/144864843-8c9226"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-401", "question": "ما الغاز الذي يُستخدم وقودًا نظيفًا في المنازل وبعض السيارات؟", "choices": ["الغاز الطبيعي", "غاز الأكسجين", "بخار الماء", "الهواء المضغوط"], "answer": "الغاز الطبيعي", "answerIndex": 0, "explanation": "الغاز الطبيعي يُستخدم في المنازل وتوليد الكهرباء وكوقود لبعض وسائل النقل، وهو أنظف من الفحم.", "type": "mcq", "topic": "", "source": "https://www.slideshare.net/slideshow/ss-39982140/39982140"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-402", "question": "لماذا يُعد الفحم أقل أهمية اقتصادية من البترول في مصر؟", "choices": ["لأنه يلوث البيئة وإنتاجه محدود", "لأنه أغلى من الذهب", "لأنه يوجد في النيل", "لأنه طاقة متجددة"], "answer": "لأنه يلوث البيئة وإنتاجه محدود", "answerIndex": 0, "explanation": "الفحم يلوث البيئة عند احتراقه وإنتاجه في مصر محدود، لذلك الاعتماد الأكبر على البترول والغاز.", "type": "mcq", "topic": "", "source": "https://www.slideshare.net/slideshow/ss-39982140/39982140"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-403", "question": "ما وسيلة النقل التي تربط مصر بالعالم وتنقل البضائع عبر قناة السويس؟", "choices": ["السفن", "القطارات فقط", "الطائرات فقط", "الجمال"], "answer": "السفن", "answerIndex": 0, "explanation": "السفن تنقل التجارة العالمية عبر البحرين المتوسط والأحمر وقناة السويس.", "type": "mcq", "topic": "", "source": "https://nabdapp.com/t/144864843-8c9226"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-404", "question": "محافظة أسوان مشهورة بوجود ماذا؟", "choices": ["السد العالي وبحيرة ناصر", "ميناء الإسكندرية", "أهرامات الجيزة", "قناة السويس"], "answer": "السد العالي وبحيرة ناصر", "answerIndex": 0, "explanation": "أسوان في جنوب مصر وبها السد العالي وبحيرة ناصر ومعبد أبو سمبل القريب منها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/214565"}, {"grade": 5, "subject": "دراسات اجتماعية", "id": "h26-g5-405", "question": "ما عاصمة محافظة البحر الأحمر السياحية المشهورة بالشعاب المرجانية؟", "choices": ["الغردقة", "المنصورة", "طنطا", "أسيوط"], "answer": "الغردقة", "answerIndex": 0, "explanation": "الغردقة على البحر الأحمر مقصد سياحي مشهور بالشواطئ والشعاب المرجانية والغوص.", "type": "mcq", "topic": "", "source": "https://nabdapp.com/t/144864843-8c9226"}, {"grade": 5, "subject": "لغة إنجليزية", "id": "h26-g5-406", "question": "Choose: Ali ___ to school every day.", "choices": ["go", "goes", "going", "went"], "answer": "goes", "answerIndex": 1, "explanation": "نستخدم present simple مع he/she/it ونضيف s للفعل: Ali goes. الشرح: المضارع البسيط للعادات اليومية.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/209797"}, {"grade": 5, "subject": "لغة إنجليزية", "id": "h26-g5-407", "question": "Choose: They ___ football on Fridays.", "choices": ["plays", "play", "playing", "played yesterday only"], "answer": "play", "answerIndex": 1, "explanation": "مع They نستخدم الفعل بدون s: They play. الشرح: المضارع البسيط مع الجمع بدون إضافة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/209797"}, {"grade": 5, "subject": "لغة إنجليزية", "id": "h26-g5-408", "question": "Choose: Look! Sara ___ now.", "choices": ["reads", "is reading", "read", "reading yesterday"], "answer": "is reading", "answerIndex": 1, "explanation": "كلمة now و Look تدلان على present continuous: is + verb-ing. الشرح: حدث يحدث الآن.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lecture/254753/%D8%AE%D8%A7%D9%85%D8%B3-%D8%A7%D8%A8%D8%AA%D8%AF%D8%A7%D8%A6%D9%8A/CONNECT-PRIMARY-Term/Language-focus"}, {"grade": 5, "subject": "لغة إنجليزية", "id": "h26-g5-409", "question": "Choose: We ___ TV at the moment.", "choices": ["are watching", "watch yesterday", "watches", "watching yesterday"], "answer": "are watching", "answerIndex": 0, "explanation": "at the moment تعني الآن، نستخدم are watching مع We. الشرح: مضارع مستمر للجمع.", "type": "mcq", "topic": "", "source": "https://sahl.io/eg/lecture/254753/%D8%AE%D8%A7%D9%85%D8%B3-%D8%A7%D8%A8%D8%AA%D8%AF%D8%A7%D8%A6%D9%8A/CONNECT-PRIMARY-Term/Language-focus"}, {"grade": 5, "subject": "لغة إنجليزية", "id": "h26-g5-410", "question": "Choose: Yesterday, I ___ my homework early.", "choices": ["finish", "finished", "finishes", "finishing"], "answer": "finished", "answerIndex": 1, "explanation": "Yesterday تدل على past simple، والفعل المنتظم finish يصبح finished بإضافة ed.", "type": "mcq", "topic": "", "source": "https://www.scribd.com/document/759113823/%D8%A7%D9%84%D8%A8%D8%A7%D9%87%D8%B1-%D9%83%D9%88%D9%86%D9%83%D8%AA-5-%D8%A7%D8%A8%D8%AA%D8%AF%D8%A7%D8%A6%D9%8A-%D8%AA%D8%B1%D9%85-1-%D8%B0%D8%A7%D9%83%D8%B1%D9%88%D9%84%D9%8A"}, {"grade": 5, "subject": "لغة إنجليزية", "id": "h26-g5-411", "question": "Choose: She ___ a story last night.", "choices": ["reads", "read", "reading", "is read"], "answer": "read", "answerIndex": 1, "explanation": "الماضي من read يُكتب read ويُنطق بشكل مختلف، و last night تدل على الماضي.", "type": "mcq", "topic": "", "source": "https://www.scribd.com/document/759113823/%D8%A7%D9%84%D8%A8%D8%A7%D9%87%D8%B1-%D9%83%D9%88%D9%86%D9%83%D8%AA-5-%D8%A7%D8%A8%D8%AA%D8%AF%D8%A7%D8%A6%D9%8A-%D8%AA%D8%B1%D9%85-1-%D8%B0%D8%A7%D9%83%D8%B1%D9%88%D9%84%D9%8A"}, {"grade": 5, "subject": "لغة إنجليزية", "id": "h26-g5-412", "question": "Choose: I ___ swim very well.", "choices": ["can", "cans", "am can", "have"], "answer": "can", "answerIndex": 0, "explanation": "can تعبر عن القدرة ويأتي بعدها الفعل بدون to: I can swim.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/209797"}, {"grade": 5, "subject": "لغة إنجليزية", "id": "h26-g5-413", "question": "Choose: Birds ___ fly, but fish ___.", "choices": ["can / can't", "can't / can", "can / can to", "are / is"], "answer": "can / can't", "answerIndex": 0, "explanation": "الطيور تستطيع الطيران can، والأسماك لا تستطيع can't. الشرح: can للقدرة و can't للنفي.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/209797"}, {"grade": 5, "subject": "لغة إنجليزية", "id": "h26-g5-414", "question": "Choose: You ___ wear a uniform at school. (obligation)", "choices": ["have to", "can to", "don't have", "is"], "answer": "have to", "answerIndex": 0, "explanation": "have to تعبر عن الالتزام والضرورة: You have to wear a uniform.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/best-primary-5-english-memorandum-term-1-pdf.html"}, {"grade": 5, "subject": "لغة إنجليزية", "id": "h26-g5-415", "question": "Choose: A car is ___ than a bike.", "choices": ["faster", "fast", "fastest only", "more fast"], "answer": "faster", "answerIndex": 0, "explanation": "للمقارنة بين شيئين نستخدم comparative: fast تصبح faster + than.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/best-primary-5-english-memorandum-term-1-pdf.html"}, {"grade": 5, "subject": "لغة إنجليزية", "id": "h26-g5-416", "question": "Choose: An elephant is ___ than a cat.", "choices": ["bigger", "big", "more big", "biggest yesterday"], "answer": "bigger", "answerIndex": 0, "explanation": "bigger هي صيغة المقارنة من big ونضاعف الحرف الأخير. الشرح: مقارنة بين شيئين.", "type": "mcq", "topic": "", "source": "https://www.ethalat.online/2026/07/best-primary-5-english-memorandum-term-1-pdf.html"}, {"grade": 5, "subject": "لغة إنجليزية", "id": "h26-g5-417", "question": "___ do you live? — In Cairo.", "choices": ["What", "Where", "When", "Why"], "answer": "Where", "answerIndex": 1, "explanation": "Where تسأل عن المكان. الشرح: أداة الاستفهام المناسبة للمكان هي Where.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/209797"}, {"grade": 5, "subject": "لغة إنجليزية", "id": "h26-g5-418", "question": "___ is your birthday? — In May.", "choices": ["Where", "When", "What colour", "How many books"], "answer": "When", "answerIndex": 1, "explanation": "When تسأل عن الوقت والزمان. الشرح: السؤال عن موعد عيد الميلاد يستخدم When.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/209797"}, {"g var AYAH={"051057": {"a": 57, "text": "مَآ أُرِيدُ مِنْهُم مِّن رِّزْقٍۢ وَمَآ أُرِيدُ أَن يُطْعِمُونِ"}, "085008": {"a": 8, "text": "وَمَا نَقَمُوا۟ مِنْهُمْ إِلَّآ أَن يُؤْمِنُوا۟ بِٱللَّهِ ٱلْعَزِيزِ ٱلْحَمِيدِ"}, "052035": {"a": 35, "text": "أَمْ خُلِقُوا۟ مِنْ غَيْرِ شَىْءٍ أَمْ هُمُ ٱلْخَٰلِقُونَ"}, "054007": {"a": 7, "text": "خُشَّعًا أَبْصَٰرُهُمْ يَخْرُجُونَ مِنَ ٱلْأَجْدَاثِ كَأَنَّهُمْ جَرَادٌۭ مُّنتَشِرٌۭ"}, "051056": {"a": 56, "text": "وَمَا خَلَقْتُ ٱلْجِنَّ وَٱلْإِنسَ إِلَّا لِيَعْبُدُونِ"}, "096001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ"}, "083031": {"a": 31, "text": "وَإِذَا ٱنقَلَبُوٓا۟ إِلَىٰٓ أَهْلِهِمُ ٱنقَلَبُوا۟ فَكِهِينَ"}, "056077": {"a": 77, "text": "إِنَّهُۥ لَقُرْءَانٌۭ كَرِيمٌۭ"}, "104004": {"a": 4, "text": "كَلَّا ۖ لَيُنۢبَذَنَّ فِى ٱلْحُطَمَةِ"}, "084025": {"a": 25, "text": "إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۭ"}, "051028": {"a": 28, "text": "فَأَوْجَسَ مِنْهُمْ خِيفَةًۭ ۖ قَالُوا۟ لَا تَخَفْ ۖ وَبَشَّرُوهُ بِغُلَٰمٍ عَلِيمٍۢ"}, "050008": {"a": 8, "text": "تَبْصِرَةًۭ وَذِكْرَىٰ لِكُلِّ عَبْدٍۢ مُّنِيبٍۢ"}, "089015": {"a": 15, "text": "فَأَمَّا ٱلْإِنسَٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ"}, "071007": {"a": 7, "text": "وَإِنِّى كُلَّمَا دَعَوْتُهُمْ لِتَغْفِرَ لَهُمْ جَعَلُوٓا۟ أَصَٰبِعَهُمْ فِىٓ ءَاذَانِهِمْ وَٱسْتَغْشَوْا۟ ثِيَابَهُمْ وَأَصَرُّوا۟ وَٱسْتَكْبَرُوا۟ ٱسْتِكْبَارًۭا"}, "051027": {"a": 27, "text": "فَقَرَّبَهُۥٓ إِلَيْهِمْ قَالَ أَلَا تَأْكُلُونَ"}, "051055": {"a": 55, "text": "وَذَكِّرْ فَإِنَّ ٱلذِّكْرَىٰ تَنفَعُ ٱلْمُؤْمِنِينَ"}, "057024": {"a": 24, "text": "ٱلَّذِينَ يَبْخَلُونَ وَيَأْمُرُونَ ٱلنَّاسَ بِٱلْبُخْلِ ۗ وَمَن يَتَوَلَّ فَإِنَّ ٱللَّهَ هُوَ ٱلْغَنِىُّ ٱلْحَمِيدُ"}, "067004": {"a": 4, "text": "ثُمَّ ٱرْجِعِ ٱلْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ ٱلْبَصَرُ خَاسِئًۭا وَهُوَ حَسِيرٌۭ"}, "089010": {"a": 10, "text": "وَفِرْعَوْنَ ذِى ٱلْأَوْتَادِ"}, "054036": {"a": 36, "text": "وَلَقَدْ أَنذَرَهُم بَطْشَتَنَا فَتَمَارَوْا۟ بِٱلنُّذُرِ"}, "066002": {"a": 2, "text": "قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْ ۚ وَٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ"}, "051026": {"a": 26, "text": "فَرَاغَ إِلَىٰٓ أَهْلِهِۦ فَجَآءَ بِعِجْلٍۢ سَمِينٍۢ"}, "055010": {"a": 10, "text": "وَٱلْأَرْضَ وَضَعَهَا لِلْأَنَامِ"}, "071006": {"a": 6, "text": "فَلَمْ يَزِدْهُمْ دُعَآءِىٓ إِلَّا فِرَارًۭا"}, "054010": {"a": 10, "text": "فَدَعَا رَبَّهُۥٓ أَنِّى مَغْلُوبٌۭ فَٱنتَصِرْ"}, "057001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ"}, "076023": {"a": 23, "text": "إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ ٱلْقُرْءَانَ تَنزِيلًۭا"}, "056091": {"a": 91, "text": "فَسَلَٰمٌۭ لَّكَ مِنْ أَصْحَٰبِ ٱلْيَمِينِ"}, "050004": {"a": 4, "text": "قَدْ عَلِمْنَا مَا تَنقُصُ ٱلْأَرْضُ مِنْهُمْ ۖ وَعِندَنَا كِتَٰبٌ حَفِيظٌۢ"}, "052015": {"a": 15, "text": "أَفَسِحْرٌ هَٰذَآ أَمْ أَنتُمْ لَا تُبْصِرُونَ"}, "082018": {"a": 18, "text": "ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ"}, "070038": {"a": 38, "text": "أَيَطْمَعُ كُلُّ ٱمْرِئٍۢ مِّنْهُمْ أَن يُدْخَلَ جَنَّةَ نَعِيمٍۢ"}, "079027": {"a": 27, "text": "ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا"}, "052016": {"a": 16, "text": "ٱصْلَوْهَا فَٱصْبِرُوٓا۟ أَوْ لَا تَصْبِرُوا۟ سَوَآءٌ عَلَيْكُمْ ۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ"}, "105001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ ٱلْفِيلِ"}, "052024": {"a": 24, "text": "۞ وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌۭ لَّهُمْ كَأَنَّهُمْ لُؤْلُؤٌۭ مَّكْنُونٌۭ"}, "069013": {"a": 13, "text": "فَإِذَا نُفِخَ فِى ٱلصُّورِ نَفْخَةٌۭ وَٰحِدَةٌۭ"}, "067005": {"a": 5, "text": "وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ"}, "054009": {"a": 9, "text": "۞ كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ فَكَذَّبُوا۟ عَبْدَنَا وَقَالُوا۟ مَجْنُونٌۭ وَٱزْدُجِرَ"}, "072027": {"a": 27, "text": "إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا"}, "051031": {"a": 31, "text": "۞ قَالَ فَمَا خَطْبُكُمْ أَيُّهَا ٱلْمُرْسَلُونَ"}, "055015": {"a": 15, "text": "وَخَلَقَ ٱلْجَآنَّ مِن مَّارِجٍۢ مِّن نَّارٍۢ"}, "085007": {"a": 7, "text": "وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌۭ"}, "047001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ أَضَلَّ أَعْمَٰلَهُمْ"}, "078036": {"a": 36, "text": "جَزَآءًۭ مِّن رَّبِّكَ عَطَآءً حِسَابًۭا"}, "056045": {"a": 45, "text": "إِنَّهُمْ كَانُوا۟ قَبْلَ ذَٰلِكَ مُتْرَفِينَ"}, "050012": {"a": 12, "text": "كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ وَأَصْحَٰبُ ٱلرَّسِّ وَثَمُودُ"}, "071017": {"a": 17, "text": "وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلْأَرْضِ نَبَاتًۭا"}, "091013": {"a": 13, "text": "فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا"}, "079040": {"a": 40, "text": "وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ"}, "053038": {"a": 38, "text": "أَلَّا تَزِرُ وَازِرَةٌۭ وِزْرَ أُخْرَىٰ"}, "050015": {"a": 15, "text": "أَفَعَيِينَا بِٱلْخَلْقِ ٱلْأَوَّلِ ۚ بَلْ هُمْ فِى لَبْسٍۢ مِّنْ خَلْقٍۢ جَدِيدٍۢ"}, "049018": {"a": 18, "text": "إِنَّ ٱللَّهَ يَعْلَمُ غَيْبَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَٱللَّهُ بَصِيرٌۢ بِمَا تَعْمَلُونَ"}, "052012": {"a": 12, "text": "ٱلَّذِينَ هُمْ فِى خَوْضٍۢ يَلْعَبُونَ"}, "075005": {"a": 5, "text": "بَلْ يُرِيدُ ٱلْإِنسَٰنُ لِيَفْجُرَ أَمَامَهُۥ"}, "067003": {"a": 3, "text": "ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا ۖ مَّا تَرَىٰ فِى خَلْقِ ٱلرَّحْمَٰنِ مِن تَفَٰوُتٍۢ ۖ فَٱرْجِعِ ٱلْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍۢ"}, "056060": {"a": 60, "text": "نَحْنُ قَدَّرْنَا بَيْنَكُمُ ٱلْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ"}, "091014": {"a": 14, "text": "فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا"}, "055074": {"a": 74, "text": "لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ"}, "073005": {"a": 5, "text": "إِنَّا سَنُلْقِى عَلَيْكَ قَوْلًۭا ثَقِيلًا"}, "050029": {"a": 29, "text": "مَا يُبَدَّلُ ٱلْقَوْلُ لَدَىَّ وَمَآ أَنَا۠ بِظَلَّٰمٍۢ لِّلْعَبِيدِ"}, "051053": {"a": 53, "text": "أَتَوَاصَوْا۟ بِهِۦ ۚ بَلْ هُمْ قَوْمٌۭ طَاغُونَ"}, "070014": {"a": 14, "text": "وَمَن فِى ٱلْأَرْضِ جَمِيعًۭا ثُمَّ يُنجِيهِ"}, "077048": {"a": 48, "text": "وَإِذَا قِيلَ لَهُمُ ٱرْكَعُوا۟ لَا يَرْكَعُونَ"}, "083014": {"a": 14, "text": "كَلَّا ۖ بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ"}, "047002": {"a": 2, "text": "وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَءَامَنُوا۟ بِمَا نُزِّلَ عَلَىٰ مُحَمَّدٍۢ وَهُوَ ٱلْحَقُّ مِن رَّبِّهِمْ ۙ كَفَّرَ عَنْهُمْ سَيِّـَٔاتِهِمْ وَأَصْلَحَ بَالَهُمْ"}, "055024": {"a": 24, "text": "وَلَهُ ٱلْجَوَارِ ٱلْمُنشَـَٔاتُ فِى ٱلْبَحْرِ كَٱلْأَعْلَٰمِ"}, "089008": {"a": 8, "text": "ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ"}, "048007": {"a": 7, "text": "وَلِلَّهِ جُنُودُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا"}, "061010": {"a": 10, "text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ هَلْ أَدُلُّكُمْ عَلَىٰ تِجَٰرَةٍۢ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍۢ"}, "050026": {"a": 26, "text": "ٱلَّذِى جَعَلَ مَعَ ٱللَّهِ إِلَٰهًا ءَاخَرَ فَأَلْقِيَاهُ فِى ٱلْعَذَابِ ٱلشَّدِيدِ"}, "054011": {"a": 11, "text": "فَفَتَحْنَآ أَبْوَٰبَ ٱلسَّمَآءِ بِمَآءٍۢ مُّنْهَمِرٍۢ"}, "056041": {"a": 41, "text": "وَأَصْحَٰبُ ٱلشِّمَالِ مَآ أَصْحَٰبُ ٱلشِّمَالِ"}, "055043": {"a": 43, "text": "هَٰذِهِۦ جَهَنَّمُ ٱلَّتِى يُكَذِّبُ بِهَا ٱلْمُجْرِمُونَ"}, "048028": {"a": 28, "text": "هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًۭا"}, "075040": {"a": 40, "text": "أَلَيْسَ ذَٰلِكَ بِقَٰدِرٍ عَلَىٰٓ أَن يُحْۦِىَ ٱلْمَوْتَىٰ"}, "077049": {"a": 49, "text": "وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"}, "079018": {"a": 18, "text": "فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ"}, "048008": {"a": 8, "text": "إِنَّآ أَرْسَلْنَٰكَ شَٰهِدًۭا وَمُبَشِّرًۭا وَنَذِيرًۭا"}, "075036": {"a": 36, "text": "أَيَحْسَبُ ٱلْإِنسَٰنُ أَن يُتْرَكَ سُدًى"}, "089021": {"a": 21, "text": "كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّۭا دَكًّۭا"}, "067002": {"a": 2, "text": "ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًۭا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ"}, "056076": {"a": 76, "text": "وَإِنَّهُۥ لَقَسَمٌۭ لَّوْ تَعْلَمُونَ عَظِيمٌ"}, "068033": {"a": 33, "text": "كَذَٰلِكَ ٱلْعَذَابُ ۖ وَلَعَذَابُ ٱلْءَاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ"}, "072010": {"a": 10, "text": "وَأَنَّا لَا نَدْرِىٓ أَشَرٌّ أُرِيدَ بِمَن فِى ٱلْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًۭا"}, "055009": {"a": 9, "text": "وَأَقِيمُوا۟ ٱلْوَزْنَ بِٱلْقِسْطِ وَلَا تُخْسِرُوا۟ ٱلْمِيزَانَ"}, "089006": {"a": 6, "text": "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ"}, "061011": {"a": 11, "text": "تُؤْمِنُونَ بِٱللَّهِ وَرَسُولِهِۦ وَتُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ"}, "089005": {"a": 5, "text": "هَلْ فِى ذَٰلِكَ قَسَمٌۭ لِّذِى حِجْرٍ"}, "066001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ"}, "051032": {"a": 32, "text": "قَالُوٓا۟ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٍۢ مُّجْرِمِينَ"}, "050027": {"a": 27, "text": "۞ قَالَ قَرِينُهُۥ رَبَّنَا مَآ أَطْغَيْتُهُۥ وَلَٰكِن كَانَ فِى ضَلَٰلٍۭ بَعِيدٍۢ"}, "054028": {"a": 28, "text": "وَنَبِّئْهُمْ أَنَّ ٱلْمَآءَ قِسْمَةٌۢ بَيْنَهُمْ ۖ كُلُّ شِرْبٍۢ مُّحْتَضَرٌۭ"}, "048009": {"a": 9, "text": "لِّتُؤْمِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَتُعَزِّرُوهُ وَتُوَقِّرُوهُ وَتُسَبِّحُوهُ بُكْرَةًۭ وَأَصِيلًا"}, "077031": {"a": 31, "text": "لَّا ظَلِيلٍۢ وَلَا يُغْنِى مِنَ ٱللَّهَبِ"}, "080023": {"a": 23, "text": "كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ"}, "089009": {"a": 9, "text": "وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ"}}, EXPL={"3|الرياضيات|عالم الجمع والطرح": [{"t": "عالم الجمع والطرح", "k": "", "lines": ["بص يا حبيبي، لما نجمع، بنحط الأرقام تحت بعض: آحاد تحت آحاد، وعشرات تحت عشرات، ومئات تحت مئات."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["نبدأ الجمع من اليمين، من الآحاد. لو الناتج 10 أو أكتر، نكتب الآحاد ونرفع العشرة للعمود اللي جنبه. اسمها الحمل."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["في الطرح كمان نبدأ من الآحاد. لو الرقم اللي فوق أصغر، نستلف عشرة من العمود اللي جنبه."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["مثال: 45 + 28. نجمع 5 + 8 = 13، نكتب 3 ونرفع 1. بعدين 4 + 2 + 1 = 7. الناتج 73."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["اتأكد من الحل: الجمع نختبره بالطرح، والطرح نختبره بالجمع. لو رجعنا للرقم الأصلي يبقى الحل صح. يلا يا بطل."]}], "3|الرياضيات|عالم الزمن": [{"t": "عالم الزمن", "k": "", "lines": ["بص يا حبيبي، الساعة فيها 60 دقيقة، واليوم فيه 24 ساعة، والأسبوع 7 أيام."]}, {"t": "عالم الزمن", "k": "", "lines": ["العقرب الصغير بيقول الساعة، والعقرب الكبير بيقول الدقايق. لما الكبير على 6 نقول والنصف، ولما يكون على 3 نقول والربع."]}, {"t": "عالم الزمن", "k": "", "lines": ["الزمن المنقضي هو الفرق بين وقت البداية ووقت النهاية. من 3:00 لحد 5:30 يبقى ساعتين ونص."]}, {"t": "عالم الزمن", "k": "", "lines": ["السنة فيها 12 شهر، والشهر ممكن يكون 30 أو 31 يوم، وفبراير أقل."]}, {"t": "عالم الزمن", "k": "", "lines": ["اقرأ السؤال وشوف بيسأل عن ساعة ولا دقيقة ولا يوم، وبعدين اختار الوحدة الصح. يلا يا بطل."]}], "3|الرياضيات|مملكة الضرب": [{"t": "مملكة الضرب", "k": "", "lines": ["بص يا حبيبي، الضرب هو جمع الرقم نفسه كذا مرة. 4 × 3 يعني 4 + 4 + 4 = 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["جدول الضرب لازم نحفظه. ممكن نتعلمه بالعد بالقفزات: 3، 6، 9، 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["الترتيب مش بيغير الناتج: 4 × 3 = 3 × 4."]}, {"t": "مملكة الضرب", "k": "", "lines": ["أي رقم × 1 يساوي نفسه. وأي رقم × 0 يساوي صفر."]}, {"t": "مملكة الضرب", "k": "", "lines": ["لو السؤال فيه مجموعات متساوية، اعرف عدد المجموعات وعدد كل مجموعة واضرب. يلا يا بطل."]}], "3|الرياضيات|مملكة ا window.__test={allTopics:allTopics,tkey:tkey,tStatus:tStatus,dailyPick:dailyPick,pickQs:pickQs,today:today,CLIPS:CLIPS,go:go,AYAH:AYAH,EXPL:EXPL,BANK:function(){return BANK},BYID:BYID,GEN:GEN,GEN_ORDER:GEN_ORDER,HEALTH:HEALTH,S:S,mem:function(){return mem},P:function(){return P},scoreFor:scoreFor,leitnerWrong:leitnerWrong,leitnerRight:leitnerRight,newProfile:newProfile,level:level,exportCode:exportCode,importCode:importCode,subjectList:subjectList,subjCount:subjCount,hash:hash,DLV:function(){return DLV},makePuzzle:makePuzzle,pickQs:pickQs,migrate:migrate,streakDays:streakDays,normSubj:normSubj,badgeOk:badgeOk,CFG:CFG};

<style id="azhar-pro-css">
.kid-root select{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff;margin:4px 0 12px;color:var(--ink)}

<script id="azhar-pro-js">
(function(){
"use strict";
document.addEventListener("keydown",function(e){
 if(!e.key)return;var tg=e.target;if(tg&&(tg.tagName==="INPUT"||tg.tagName==="SELECT"||tg.tagName==="TEXTAREA"))return;
 var k="١٢٣٤".indexOf(e.key);var n=k>=0?k+1:parseInt(e.key,10);
 if(n>=1&&n<=4){var ch=document.querySelectorAll("#chs button");if(ch&&ch[n-1]){ch[n-1].click();}}
});
function ageWord(a){if(!a)return"";return a===1?"سنة واحدة":a===2?"سنتان":a<=10?a+" سنين":a+" سنة"}
function greet(){
 try{
  if(typeof P==="undefined"||!P||!P.name)return;
  var app=document.getElementById("app");if(!app||app.querySelector("#azhi"))return;
  if(app.querySelector("#azparents"))return;
  var h1=app.querySelector("h1");if(!h1)return;
  var d=document.createElement("div");d.id="azhi";
  var age=P.age?(" · عمرك "+ageWord(P.age)):"";
  var goal=(P.set&&P.set.goal)?(" · هدفك اليوم "+P.set.goal+" أسئلة"):"";
  d.textContent="🌟 أهلًا بعودتك يا "+P.name+age+goal+" — يلا نكمل بطولاتك!";
  h1.parentNode.insertBefore(d,h1.nextSibling);
  var pb=document.createElement("button");pb.id="azpbtn";pb.className="btn gold";pb.style.cssText="width:100%;margin:6px 0 12px";
  pb.textContent="👨‍👩‍👧 ركن بابا وماما — سؤال للأهل ومساعدة لهم";
  pb.addEventListener("click",function(){window.__azParents()});
  d.parentNode.insertBefore(pb,d.nextSibling);
 }catch(e){}
}
var PQ=null;
function pqPick(){
 try{
  var pool=(window.RAW||[]).filter(function(r){return r&&r.choices&&r.choices.length>=3&&r.explanation&&["القرآن","التربية الإسلامية","العربي"].indexOf(r.subject)>=0});
  if(!pool.length)return null;
  var q=pool[Math.floor(Math.random()*pool.length)];
  var ch=q.choices.slice();for(var i=ch.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ch[i];ch[i]=ch[j];ch[j]=t}
  return {q:q.question,ch:ch,ans:q.answer,exp:q.explanation,subj:q.subject};
 }catch(e){return null}
}
window.__azParents=function(){
 try{
  if(typeof P==="undefined"||!P)return;
  if(!PQ)PQ=pqPick();
  var girl=(typeof CFG!=="undefined"&&CFG.girl)||P.gender==="g";
  var kid=P.name, son=girl?"بنتكم":"ابنكم", his=girl?"ليها":"له";
  var ageTip=!P.age?"":P.age<=8?"في هذه السن، اللعب القصير المتكرر أفضل من الجلسات الطويلة: جولة واحدة (١٠ أسئلة) في اليوم تكفي، واحتفلوا بكل تقدّم صغير.":P.age<=10?"في هذه السن، مدة التركيز تصل إلى ٢٠ دقيقة: جولة أو جولتان يوميًا، ودَعوه يشرح لكم إجابته بصوته — الشرح بصوت عالٍ يثبّت المعلومة.":"في هذه السن يبدأ الاستعداد للامتحانات: شجّعوه على حلّ جولة كاملة دون تلميحات، ومراجعة الشرح بعد كل خطأ — فالخطأ الذي يصحّحه بنفسه لا يتكرر.";
  var qhtml=PQ?('<div class="card"><h2>🧠 سؤال لبابا وماما</h2><p class="sync">من مادة '+PQ.subj+' — جاوبوا مع '+kid+' واتناقشوا في السبب:</p><div class="qtext">'+PQ.q+'</div><div id="azpq">'+PQ.ch.map(function(c,i){return '<button class="choice" data-azpq="'+i+'"><span>'+c+'</span></button>'}).join("")+'</div><div id="azpfb"></div><button class="btn small ghost" id="azpnew">🔄 سؤال جديد للأهل</button></div>'):'';
  var h='<div id="azparents"><h1>👨‍👩‍👧 ركن بابا وماما</h1>'
   +'<p class="card">أهلًا بيكم! الركن ده معمول عشان تساعدوا '+kid+' يستمتع ويتعلم. '+his+' في كل مادة <b>١٠ تلميحات</b> بس — التلميح بيشيل اختيارات غلط وبيخصم ٥ نقط، وبيكسب تلميحات جديدة لما يكسب جولات في المادة.</p>'
   +qhtml
   +'<div class="card"><h2>🤝 كيف تساعدون '+son+'؟</h2><p>'+ageTip+'</p><p>· اسألوه كل يوم: «ماذا تعلّمتَ اليوم؟» ودَعوه يعلّمكم هو — أفضل تثبيت للمعلومة أن يشرحها بنفسه.<br>· اطّلعوا على تقريره من زرّ «تقريري» في اللعبة، وقارنوا تقدّمه أسبوعًا بأسبوع، وامدحوا الجهد لا الدرجة فقط.<br>· إذا واجه سؤالًا صعبًا، دعوه يستخدم تلميحًا أولًا قبل أن تخبروه بالإجابة.</p></div>'
   +'<div class="card"><h2>💬 أسئلة تفتح الكلام بعد اللعب</h2><p>· إيه أكتر سؤال عجبك النهاردة وليه؟<br>· إيه السؤال اللي غلطت فيه واتعلمت منه إيه؟<br>· لو هتعمل سؤال لبابا وماما، هيكون عن إيه؟<br>· إيه المادة اللي عايز تكسب فيها تلميحات زيادة؟</p></div>'
   +'<button class="btn" data-a="home">🏠 رجوع للعبة '+kid+'</button></div>';
  render(h);
  var nb=document.getElementById("azpnew");if(nb)nb.addEventListener("click",function(){PQ=pqPick();window.__azParents()});
  var box=document.getElementById("azpq");
  if(box)box.addEventListener("click",function(e){var b=e.target.closest("[data-azpq]");if(!b||!PQ)return;var pick=PQ.ch[+b.getAttribute("data-azpq")];var fb=document.getElementById("azpfb");
   if(pick===PQ.ans){b.classList.add("ok");fb.innerHTML='<div class="warn" style="background:#e8f5e9">🎉 إجابة صح! '+PQ.exp+'<br>اتكلموا مع '+kid+': ليه دي الإجابة الصح؟</div>'}
   else{b.classList.add("bad");fb.innerHTML='<div class="warn">قربتوا! الإجابة الصح: <b>'+PQ.ans+'</b><br>'+PQ.exp+'</div>'}});
 }catch(e){}
};
var mo=new MutationObserver(function(){greet()});
window.addEventListener("load",function(){var a=document.getElementById("app");if(a)mo.observe(a,{childList:true,subtree:true});greet()});
})();
</script>
