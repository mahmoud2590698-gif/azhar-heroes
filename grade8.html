 "h26-g8-13", "question": "عند وضع رمل داخل محقن مغلق والضغط عليه بقوة، ماذا يحدث؟", "choices": ["يتحول إلى سائل", "يتبخر ويخرج من المحقن", "لا ينضغط تقريبًا لأن جسيماته متقاربة والمسافات البينية بينها صغيرة", "ينضغط كما ينضغط الهواء"], "answer": "لا ينضغط تقريبًا لأن جسيماته متقاربة والمسافات البينية بينها صغيرة", "answerIndex": 2, "explanation": "من اختبارات الشاطر: المواد الصلبة كالرمل لا تنضغط لأن جسيماتها متقاربة والمسافات البينية بينها صغيرة جدًا.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-14", "question": "أي مما يلي يصف جسيمات المادة الصلبة؟", "choices": ["بلا قوى تجاذب بينها", "تنزلق فوق بعضها بسهولة", "متقاربة وتهتز في مواضعها وقوى التجاذب بينها قوية", "متباعدة وتتحرك بحرية وقوى التجاذب بينها ضعيفة"], "answer": "متقاربة وتهتز في مواضعها وقوى التجاذب بينها قوية", "answerIndex": 2, "explanation": "جسيمات المادة الصلبة متقاربة جدًا وقوى التجاذب بينها قوية، فتهتز في مواضعها دون أن تغادرها، ولذلك يحتفظ الصلب بشكله وحجمه.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-15", "question": "يختلف انسياب السوائل حسب .........", "choices": ["لونها", "رائحتها", "لزوجتها", "كتلتها"], "answer": "لزوجتها", "answerIndex": 2, "explanation": "من بوكليت الأوائل: يختلف انسياب السوائل حسب لزوجتها؛ فالسائل الأكثر لزوجة يناب أبطأ من السائل الأقل لزوجة.", "type": "mcq", "topic": "", "source": "https://mozkratgahza.com/pdf/2191"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-16", "question": "ما اسم تحول المادة من الحالة الصلبة إلى الحالة السائلة؟", "choices": ["التجمد", "الانصهار", "التكاثف", "التبخر"], "answer": "الانصهار", "answerIndex": 1, "explanation": "الانصهار هو تحول المادة من الصلبة إلى السائلة عند اكتساب الطاقة الحرارية، كما ينصهر الجليد إلى ماء.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-17", "question": "ما اسم تحول المادة من الحالة السائلة إلى الحالة الصلبة؟", "choices": ["التجمد", "الانصهار", "التسامي", "التبخر"], "answer": "التجمد", "answerIndex": 0, "explanation": "التجمد هو تحول المادة من السائلة إلى الصلبة عند فقد الطاقة الحرارية، كما يتجمد الماء إلى جليد.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-18", "question": "ما اسم تحول المادة من الحالة الصلبة إلى الحالة الغازية مباشرة دون المرور بالحالة السائلة؟", "choices": ["التسامي", "الانصهار", "الغليان", "التكاثف"], "answer": "التسامي", "answerIndex": 0, "explanation": "التسامي تحول مباشر من الصلبة إلى الغازية دون المرور بالسائلة، كما يحدث لليود الصلب عند تسخينه.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-19", "question": "ما اسم العملية العكسية للتسامي؟", "choices": ["التساقط (الترسيب المباشر)", "التبخر", "التجمد", "الانصهار"], "answer": "التساقط (الترسيب المباشر)", "answerIndex": 0, "explanation": "التساقط أو الترسيب المباشر هو تحول المادة من الحالة الغازية إلى الصلبة مباشرة، وهو عكس التسامي.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-20", "question": "ما اسم تحول بخار الماء إلى ماء سائل؟", "choices": ["التسامي", "التكاثف", "الانصهار", "التبخر"], "answer": "التكاثف", "answerIndex": 1, "explanation": "التكاثف هو تحول المادة من الحالة الغازية إلى السائلة عند فقد الطاقة الحرارية، كما تتكاثف قطرات الماء على سطح بارد.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-21", "question": "يختفي اليود الصلب عند تسخينه ويتحول مباشرة إلى بخار؛ ما اسم هذه الظاهرة؟", "choices": ["التبخر", "التسامي", "التجمد", "الانصهار"], "answer": "التسامي", "answerIndex": 1, "explanation": "من اختبارات الشاطر: اليود الصلب يتسامى عند تسخينه فيتحول مباشرة إلى بخار دون المرور بالحالة السائلة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-22", "question": "لماذا تظل درجة حرارة الجليد ثابتة أثناء انصهاره رغم استمرار التسخين؟", "choices": ["لأن طاقة حركة الجسيمات تتوقف", "لأن الحرارة تتسرب كلها إلى الهواء", "لأن الطاقة المكتسبة تُستخدم في التغلب على قوى التجاذب بين الجسيمات وزيادة طاقة وضعها", "لأن الجليد لا يمتص الحرارة"], "answer": "لأن الطاقة المكتسبة تُستخدم في التغلب على قوى التجاذب بين الجسيمات وزيادة طاقة وضعها", "answerIndex": 2, "explanation": "من الاختبار الثاني للشاطر: الطاقة المكتسبة أثناء تغير الحالة تُستخدم في التغلب على قوى التجاذب وزيادة طاقة وضع الجسيمات، لا في زيادة متوسط طاقة حركتها، فتثبت درجة الحرارة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-23", "question": "ما الفرق بين التبخر والغليان من حيث مكان حدوث كل منهما؟", "choices": ["التبخر يحدث عند سطح السائل، والغليان يحدث في جميع أجزاء السائل", "كلاهما يحدث في جميع أجزاء السائل", "التبخر يحدث في جميع أجزاء السائل والغليان عند سطحه", "كلاهما يحدث عند السطح فقط"], "answer": "التبخر يحدث عند سطح السائل، والغليان يحدث في جميع أجزاء السائل", "answerIndex": 0, "explanation": "من اختبارات الشاطر: التبخر يحدث عند سطح السائل وفي أي درجة حرارة، بينما الغليان يحدث في جميع أجزاء السائل عند درجة الغليان.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-24", "question": "أي مما يلي يزيد من معدل تبخر سائل؟", "choices": ["ارتفاع درجة الحرارة وزيادة مساحة السطح وحركة الهواء", "تغطية السائل بإحكام", "انخفاض درجة الحرارة وزيادة الرطوبة", "تبريد السائل"], "answer": "ارتفاع درجة الحرارة وزيادة مساحة السطح وحركة الهواء", "answerIndex": 0, "explanation": "من الدرس الثاني: يزداد معدل التبخر بارتفاع درجة الحرارة وزيادة مساحة السطح المعرض وحركة الهواء وانخفاض الرطوبة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-25", "question": "لماذا يغ topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-29", "question": "أي مما يلي من العوامل المؤثرة في درجتي الانصهار والغليان؟", "choices": ["شكل الإناء فقط", "لون المادة فقط", "كتلة المادة فقط", "الضغط ونقاوة المادة"], "answer": "الضغط ونقاوة المادة", "answerIndex": 3, "explanation": "من الاختبار الثاني للشاطر: من العوامل المؤثرة في درجتي الانصهار والغليان الضغط الواقع على المادة ونقاوتها.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-30", "question": "ما تعريف الطاقة الداخلية لجسم؟", "choices": ["كمية الحرارة المفقودة فقط", "متوسط طاقة حركة الجسيمات فقط", "طاقة وضع الجسيمات فقط", "مجموع طاقتي الحركة والوضع لجسيمات النظام"], "answer": "مجموع طاقتي الحركة والوضع لجسيمات النظام", "answerIndex": 3, "explanation": "من اختبارات الشاطر: الطاقة الداخلية هي مجموع طاقتي الحركة والوضع لجسيمات النظام، وتمييزها عن درجة الحرارة مطلوب في الامتحان.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-31", "question": "درجة الحرارة مقياس لـ .........", "choices": ["متوسط طاقة حركة جسيمات المادة", "مجموع طاقتي الحركة والوضع للجسيمات", "كمية الحرارة في الجسم", "عدد جسيمات المادة"], "answer": "متوسط طاقة حركة جسيمات المادة", "answerIndex": 0, "explanation": "درجة الحرارة مقياس لمتوسط طاقة حركة الجسيمات، بينما الطاقة الداخلية مجموع طاقتي الحركة والوضع.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-32", "question": "ما الفرق بين الحرارة ودرجة الحرارة؟", "choices": ["الحرارة ودرجة الحرارة الشيء نفسه", "الحرارة طاقة تنتقل بسبب اختلاف درجة الحرارة، ودرجة الحرارة مقياس لمتوسط طاقة حركة الجسيمات", "درجة الحرارة طاقة وكمية الحرارة مقياس", "الحرارة تُقاس بالترمومتر ودرجة الحرارة بالجول"], "answer": "الحرارة طاقة تنتقل بسبب اختلاف درجة الحرارة، ودرجة الحرارة مقياس لمتوسط طاقة حركة الجسيمات", "answerIndex" ion": "ماذا يحدث للطاقة الداخلية للمادة عندما تكتسب طاقة حرارية؟", "choices": ["تظل طاقتها الداخلية ثابتة", "تقل طاقتها الداخلية", "تزداد طاقتها الداخلية", "تتحول طاقتها الداخلية إلى كتلة"], "answer": "تزداد طاقتها الداخلية", "answerIndex": 2, "explanation": "من اختبارات الشاطر: عندما تكتسب المادة طاقة حرارية تزداد طاقتها الداخلية، وعندما تفقد طاقة حرارية تنخفض درجة حرارة السائل مثلًا.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-41", "question": "ماذا يحدث لطاقة وضع الجسيمات عند تحول المادة من الحالة الصلبة إلى الحالة الغازية؟", "choices": ["تتحول طاقة الوضع إلى طاقة حركة فقط", "تقل طاقة وضع الجسيمات وتصبح شبه منعدمة", "تظل طاقة الوضع ثابتة", "تزداد طاقة وضع الجسيمات"], "answer": "تزداد طاقة وضع الجسيمات", "answerIndex": 3, "explanation": "تصحيح موثق في صفحة نذاكر: مفتاح الشاطر أخطأ فقال إن طاقة الوضع تقل؛ والصحيح أنها تزداد لأن المادة تكتسب طاقة تُستخدم في التغلب على قوى التجاذب والتباعد بين الجسيمات.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-42", "question": "ما طرق انتقال الحرارة الثلاث؟", "choices": ["التوصيل والحمل والإشعاع", "التوصيل والانصهار والغليان", "الانصهار والتجمد والتبخر", "الحمل والتكاثف والتسامي"], "answer": "التوصيل والحمل والإشعاع", "answerIndex": 0, "explanation": "تنتقل الحرارة بثلاث طرق: التوصيل في المواد الصلبة، والحمل في الموائع، والإشعاع دون وسط مادي.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-43", "question": "تنتقل الحرارة في المعادن أساسًا بطريقة .........", "choices": ["الإشعاع", "التسامي", "الحمل", "التوصيل"], "answer": "التوصيل", "answerIndex": 3, "explanation": "المعادن موصلة جيدة للحرارة، فتنتقل فيها الحرارة بالتوصيل من الجزء الأعلى حرارة إلى الجزء الأقل.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-44", " ين تفصلهما جبال الأورال تمامًا", "لأن القارتين متساويتان في المساحة"], "answer": "لأن قارة أوروبا تمتد كامتداد طبيعي لقارة آسيا من جهة الغرب", "answerIndex": 1, "explanation": "من مفكرة الامتحان: يُطلق مصطلح أوراسيا على القارتين لأن قارة أوروبا تمتد كامتداد طبيعي لقارة آسيا من جهة الغرب.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/280209"}, {"grade": 8, "subject": "الدراسات الاجتماعية", "id": "h26-g8-53", "question": "ما الهضبة التي تُعرف باسم «سقف العالم»؟", "choices": ["هضبة الدكن", "هضبة التبت", "هضبة الأناضول", "هضبة الميزيتا"], "answer": "هضبة التبت", "answerIndex": 1, "explanation": "من اختبار الوحدة الأولى على شبابيك: توجد هضبة التبت وسط قارة آسيا وتُعرف بسقف العالم لأنها أعلى هضبة في العالم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/287236"}, {"grade": 8, "subject": "الدراسات الاجتماعية", "id": "h26-g8-54", "question": "لماذا تُعرف هضبة التبت بسقف العالم؟", "choices": ["لأنها أصغر هضبة في العالم", "لأنها هضبة بركانية", "لأنها تقع في قارة أوروبا", "لأنها أعلى هضبة في العالم"], "answer": "لأنها أعلى هضبة في العالم", "answerIndex": 3, "explanation": "من مفكرة الامتحان: تُعرف هضبة التبت بسقف العالم لأنها تُعد أعلى هضبة في العالم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/280209"}, {"grade": 8, "subject": "الدراسات الاجتماعية", "id": "h26-g8-55", "question": "أين توجد هضبة التبت؟", "choices": ["شرق قارة أستراليا", "شمال قارة أوروبا", "وسط قارة آسيا", "جنوب قارة أفريقيا"], "answer": "وسط قارة آسيا", "answerIndex": 2, "explanation": "من اختبار الوحدة الأولى: توجد هضبة التبت وسط قارة آسيا وتُعرف بسقف العالم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/287236"}, {"grade": 8, "subject": "الدراسات الاجتماعية", "id": "h26-g8-56", "question": "ما المقصود بـ«أرخبيل»؟", "choices": ["مجموعة من الجبال المتصلة", "سهل فيضي واسع", "خليج ضيق بين قارتين", "مجموعة من الجزر المتجاورة"], "answer": "مجموعة من الجزر المتجاورة", "answerIndex": 3, "explanation": "من مفكرة الامتحان: الأرخبيل م  "topic": "", "source": "https://shbabbek.com/show/280209"}, {"grade": 8, "subject": "الدراسات الاجتماعية", "id": "h26-g8-98", "question": "ما النشاط الاقتصادي الذي يعتمد على استخراج المعادن الخام من باطن الأرض؟", "choices": ["النشاط التجاري", "النشاط الزراعي", "النشاط السياحي", "النشاط التعديني"], "answer": "النشاط التعديني", "answerIndex": 3, "explanation": "من اختبار الوحدة الأولى: النشاط التعديني هو استخراج المعادن الخام من باطن الأرض، وله أهمية اقتصادية في بعض دول قارتي آسيا وأوروبا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/287236"}, {"grade": 8, "subject": "الدراسات الاجتماعية", "id": "h26-g8-99", "question": "أي مما يلي من مصادر الطاقة التي لا تنفد مع الاستخدام في قارتي آسيا وأوروبا؟", "choices": ["الغاز الطبيعي", "الفحم", "البترول", "الطاقة الكهرومائية"], "answer": "الطاقة الكهرومائية", "answerIndex": 3, "explanation": "من درس المعادن ومصادر الطاقة: الطاقة الكهرومائية من مصادر الطاقة المتجددة في القارتين لأنها لا تنفد مع الاستخدام، أما البترول والفحم والغاز الطبيعي فمصادر أحفورية تنفد.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/287236"}, {"grade": 8, "subject": "الدراسات الاجتماعية", "id": "h26-g8-100", "question": "ما مصدر الطاقة الذي يُستخرج من باطن الأرض ويُستخدم وقودًا للسيارات والمصانع؟", "choices": ["البترول", "الطاقة الكهرومائية", "طاقة الرياح", "الطاقة الشمسية"], "answer": "البترول", "answerIndex": 0, "explanation": "من درس المعادن ومصادر الطاقة: البترول من مصادر الطاقة الأحفورية التي تُستخرج من باطن الأرض وتُستخدم وقودًا للسيارات والمصانع.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/280209"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-101", "question": "We should limit our ..................... to protect our eyes.", "choices": ["homework", "school time", "screen time", "free time"], "answer": "screen time", "answerIndex": 2, "explanation": "العبارة من فقرة «Your digital habits» في ملحق المعاصر: «I limit my screen time, so I don't hurt my eyes» — نحدّ من وقت الشا  أما جذر 11 وجذر 5 وجذر 2 فهي أعداد غير نسبية لأنها ليست مربعات كاملة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-152", "question": "بين أي عددين صحيحين يقع جذر 11؟", "choices": ["بين 2 و3", "بين 4 و5", "بين 3 و4", "بين 1 و2"], "answer": "بين 3 و4", "answerIndex": 2, "explanation": "من نماذج أكتوبر (نذاكر): 11 يقع بين 9 و16، أي بين جذر 9 وجذر 16، فيقع جذر 11 بين 3 و4.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-153", "question": "بين أي عددين صحيحين يقع سالب جذر 30؟", "choices": ["بين سالب 6 وسالب 5", "بين سالب 5 وسالب 4", "بين 5 و6", "بين سالب 4 وسالب 3"], "answer": "بين سالب 6 وسالب 5", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): 25 أصغر من 30 و30 أصغر من 36، فيقع جذر 30 بين 5 و6، وعند أخذ السالب ينعكس الترتيب فيقع سالب جذر 30 بين سالب 6 وسالب 5.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-154", "question": "ما التقريب العشري لجذر 5 إلى منزلتين عشريتين؟", "choices": ["2.50", "2.36", "2.10", "2.24"], "answer": "2.24", "answerIndex": 3, "explanation": "من نماذج أكتوبر (نذاكر): جذر 5 يقع بين 2 و3، وتقريبه 2.24، وهو ما يساعد على تعيينه على خط الأعداد ولا يحوله إلى عدد عشري منته.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-155", "question": "ما الترتيب التنازلي الصحيح للأعداد: جذر 50، 6.9، 6.888...، 6.8؟", "choices": ["جذر 50 ثم 6.9 ثم 6.888... ثم 6.8", "6.9 ثم جذر 50 ثم 6.8 ثم 6.888...", "6.888... ثم 6.9 ثم جذر 50 ثم 6.8", "6.8 ثم 6.888... ثم 6.9 ثم جذر 50"], "answer": "جذر 50 ثم 6.9 ثم 6.888... ثم 6.8", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): جذر 50 أكبر من 7 لأن 50 أكبر من 49، فيتقدم عند الترتيب التنازلي على 6.9، ثم يأتي العدد الدوري 6.888...، ثم 6.8.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-156", "question": "ما قيمة العدد 6 و4/5؟", "choices": ["6.45", "6.4", "6.8", "6.888..."], "answer": "6.8", "answerIndex": 2, "explanation": "من نماذج أكتوبر (نذاكر): العدد 6 و4 أخماس يساوي 6.8 المنتهي، أما العدد الذي تتكرر فيه الثمانية بعد العلامة فيساوي 6.888...؛ فلا تتساوى القيمتان.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-157", "question": "ما قيمة الجذر التكعيبي لسالب 81 مقسومًا على الجذر التكعيبي لـ 3؟", "choices": ["3", "سالب 3", "27", "سالب 27"], "answer": "سالب 3", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): قسمة الجذر التكعيبي لسالب 81 على الجذر التكعيبي لـ 3 تؤول إلى الجذر التكعيبي لسالب 27، أي سالب 3، لأن إشارة العدد السالب تبقى في ناتج الجذر التكعيبي الحقيقي.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-158", "question": "ما قيمة الجذر التكعيبي لـ 8؟", "choices": ["2", "4", "8", "سالب 2"], "answer": "2", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): تتحد الجذور التكعيبية في حاصل ضرب وقسمة ينتهي إلى الجذر التكعيبي لـ 8، أي 2، لأن 2×2×2 = 8.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-159", "question": "ما المعكوس الجمعي للعدد جذر 3 ناقص 2؟", "choices": ["جذر 3 ناقص 2", "جذر 3 زائد 2", "2 زائد جذر 3", "2 ناقص جذر 3"], "answer": "2 ناقص جذر 3", "answerIndex": 3, "explanation": "من نماذج أكتوبر (نذاكر): المعكوس الجمعي للعدد هو ما يجعل مجموعهما صفرًا، فالمعكوس الجمعي لجذر 3 ناقص 2 هو 2 ناقص جذر 3.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-160", "question": "ما المعكوس الجمعي للعدد (سالب جذر 5) مرفوعًا للأس صفر؟", "choices": ["1", "سالب 1", "جذر 5", "سالب جذر 5"], "answer": "سالب 1", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): يجب تنفيذ القوة أولًا؛ العدد سالب جذر 5 داخل قوس مرفوع للأس صفر يساوي 1، ثم يكون معكوسه الجمعي سالب 1.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-161", "question": "ما المعكوس الضربي للعدد جذر 7 ناقص جذر 6؟", "choices": ["جذر 7 زائد جذر 6", "جذر 7 ناقص جذر 6", "جذر 6 ناقص جذر 7", "1"], "answer": "جذر 7 زائد جذر 6", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): عند إيجاد المعكوس الضربي لجذر 7 ناقص جذر 6 يفيد المرافق جذر 7 زائد جذر 6، لأن حاصل ضربهما يساوي 7-6=1.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-162", "question": "ما المعكوس الضربي للعدد جذر 10 ناقص 3؟", "choices": ["جذر 10 ناقص 3", "3 ناقص جذر 10", "جذر 10 زائد 3", "1"], "answer": "جذر 10 زائد 3", "answerIndex": 2, "explanation": "من نماذج أكتوبر (نذاكر): معكوس جذر 10 ناقص 3 هو جذر 10 زائد 3، إذ يساوي فرق المربعين 10-9=1؛ فالمرافق يصلح معكوسًا ضربيًا هنا لأن حاصل الضرب تحديدًا يساوي الواحد.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-163", "question": "ما أبسط صورة للكسر 10 على جذر 5؟", "choices": ["5 جذر 2", "2 جذر 5", "جذر 10", "10 جذر 5"], "answer": "2 جذر 5", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): يظهر إنطاق المقام في تبسيط 10/جذر 5؛ نضرب البسط والمقام في الجذر نفسه، فنحصل على 10 جذر 5 / 5، ثم على 2 جذر 5.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-164", "question": "ما قيمة أي عدد غير صفري مرفوع للأس صفر؟", "choices": ["1", "0", "العدد نفسه", "سالب 1"], "answer": "1", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): رفع الكسر كله للأس صفر يعطي 1، لأن أي عدد غير صفري مرفوع للأس صفر يساوي 1.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-165", "question": "إذا كان 2 أس x يساوي 8، فما قيمة 2 أس x زائد 2 أس (x+2)؟", "choices": ["24", "16", "32", "40"], "answer": "40", "answerIndex": 3, "explanation": "من نماذج أكتوبر (نذاكر): عندما يعطينا النموذج أن 2 أس x تساوي 8، لا نحتاج إلى إيجاد x؛ الحد الثاني يساوي أربعة أمثال الحد الأول، فيكون المجموع خمسة أمثال 8، أي 40.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-166", "question": "إذا كان 3 أس x يساوي 5، فما قيمة 3 أس (x+3)؟", "choices": ["15", "125", "135", "45"], "answer": "135", "answerIndex": 2, "explanation": "من نماذج أكتوبر (نذاكر): زيادة الأس ثلاث وحدات تعني الضرب في 3 أس 3، ولذلك تصبح قيمة 3 أس (x+3) هي 5×27=135.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-167", "question": "ما قيمة (جذر 3) أس سالب 2؟", "choices": ["3", "1/3", "سالب 3", "9"], "answer": "1/3", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): حاصل قوى جذر 3 ينتهي إلى الأس سالب 2، فتكون القيمة مقلوب مربع جذر 3، أي 1/3.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-168", "question": "إذا كان تبسيط تعبير ما يساوي 3 أس (n+1)، فما قيمته عندما n=2؟", "choices": ["9", "81", "3", "27"], "answer": "27", "answerIndex": 3, "explanation": "من نماذج أكتوبر (نذاكر): بعد التبسيط يبقى 3 للقوة n+1، وبالتعويض بـ n=2 نحصل على 3 أس 3 = 27.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-169", "question": "إذا كان العدد 1 ينتمي إلى X ولا ينتمي إلى Y، فهل ينتمي إلى X-Y؟", "choices": ["نعم ينتمي إلى X-Y", "لا ينتمي إلى X-Y", "ينتمي فقط إذا كان 1 موجبًا", "لا يمكن تحديد ذلك"], "answer": "نعم ينتمي إلى X-Y", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): في الاختبار الأول ينتمي العدد 1 إلى X ولا ينتمي إلى Y؛ لذلك يبقى ضمن X-Y، رغم أن طرف Y عنده مفتوح، لأن الفرق يحتفظ بما يوجد في المجموعة الأولى ولا يوجد في الثانية.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-170", "question": "عند إيجاد تقاطع فترتين، متى يُستبعد طرف من الناتج؟", "choices": ["إذا كان مشمولًا في الفترتين معًا", "إذا كان العدد صحيحًا", "إذا كان مستبعدًا من إحدى الفترتين", "إذا كان العدد سالبًا"], "answer": "إذا كان مستبعدًا من إحدى الفترتين", "answerIndex": 2, "explanation": "من نماذج أكتوبر (نذاكر): التقاطع يحتاج انتماء العدد إلى الفترتين معًا، ولذلك يستبعد الطرف 1 في الاختبار الثاني؛ ففي التقاطع ينتهي الناتج إلى الفترة المفتوحة بين 1 و3 لأن كل طرف مستبعد من إحدى الفترتين.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-171", "question": "ما الصفة المميزة للفترة [3، 7)؟", "choices": ["x أكبر من 3 وأصغر من أو يساوي 7", "x أكبر من أو يساوي 3 وأصغر من 7", "x أكبر من أو يساوي 3 وأصغر من أو يساوي 7", "x أكبر من 3 وأصغر من 7"], "answer": "x أكبر من أو يساوي 3 وأصغر من 7", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): الفترة التي تبدأ من 3 مشمولة وتنتهي قبل 7 تصف أعدادًا حقيقية تحقق أن x أكبر من أو تساوي 3 وأصغر من 7.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-172", "question": "إذا كان اتحاد فترتين يبدأ من سالب 2 غير مشمولة وينتهي عند 4 مشمولة، فما رمز الفترة؟", "choices": ["(-2، 4)", "[-2، 4)", "[-2، 4]", "(-2، 4]"], "answer": "(-2، 4]", "answerIndex": 3, "explanation": "من نماذج أكتوبر (نذاكر): في الاتحاد يكفي الانتماء إلى إحداهما؛ فيتصل الاتحاد من سالب 2 غير مشمولة إلى 4 مشمولة، فيُكتب (-2، 4].", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-173", "question": "ما رمز الفترة المفتوحة بين 1 و3؟", "choices": ["(1، 3)", "[1، 3]", "(1، 3]", "[1، 3)"], "answer": "(1، 3)", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): التقاطع في الاختبار الثاني ينتهي إلى الفترة المفتوحة بين 1 و3، ورمزها (1، 3) لأن الطرفين مستبعدان.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-174", "question": "لماذا جذر 50 أكبر من 7؟", "choices": ["لأن 50 أصغر من 49", "لأن 7 أكبر من 50", "لأن 50 أكبر من 49", "لأن جذر 50 يساوي 7"], "answer": "لأن 50 أكبر من 49", "answerIndex": 2, "explanation": "من نماذج أكتوبر (نذاكر): جذر 50 أكبر من 7 لأن 50 أكبر من 49، فيتقدم عند الترتيب التنازلي على 6.9.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-175", "question": "أي العددين أكبر: 6.888... أم 6.8؟", "choices": ["6.8", "6.888...", "متساويان", "لا يمكن المقارنة"], "answer": "6.888...", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): العدد 6 و4 أخماس يساوي 6.8 المنتهي، بينما 6.888... أكبر منه لاستمرار الثمانيات.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-176", "question": "ما العامل المشترك الأكبر بين كثيرة الحدود 12x^2 - 8x؟", "choices": ["8x", "12x", "4x", "2x"], "answer": "4x", "answerIndex": 2, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): العامل المشترك الأكبر بين كثيرة الحدود 12x^2 - 8x هو 4x، لأن 4x(3x-2) = 12x^2 - 8x.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-177", "question": "ما العامل المشترك الأكبر للحدين 12x^3y^2 و18x^2y^3؟", "choices": ["6x^2y^2", "6x^3y^3", "18x^2y^2", "12x^2y^2"], "answer": "6x^2y^2", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): في العامل المشترك الأكبر نبحث عن أكبر عامل عددي وأقل قوة مشتركة لكل متغير؛ لذلك يكون العامل في 12x^3y^2 و18x^2y^3 هو 6x^2y^2، لا عاملًا يجمع أكبر الأسس في الحدين.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-178", "question": "ما ناتج تحليل المقدار 15x^2y - 10xy^2 تحليلًا تامًا؟", "choices": ["5xy(3x+2y)", "5xy(3x-2y)", "10xy(3x-2y)", "5x(3xy-2y^2)"], "answer": "5xy(3x-2y)", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): يحتاج التحليل التام للمقدار 15x^2y-10xy^2 إلى إخراج 5xy، فتتبقى داخل القوس 3x-2y؛ وإعادة التوزيع تكشف سقوط متغير أو تغير إشارة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-179", "question": "إذا كان a+b=5 وd+c=4، فما قيمة d(a+b)+c(a+b)؟", "choices": ["9", "5", "4", "20"], "answer": "20", "answerIndex": 3, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): بالتجميع d(a+b)+c(a+b) = (a+b)(d+c) = 5×4 = 20.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-180", "question": "إذا كان (x+3) أحد عاملي كثيرة الحدود 5x^2+8x-21، فما العامل الآخر؟", "choices": ["5x-7", "5x+7", "x-7", "5x-3"], "answer": "5x-7", "answerIndex": 0, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): العامل الآخر هو 5x-7 لأن (x+3)(5x-7) = 5x^2+8x-21.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-181", "question": "إذا كانت كثيرة الحدود 4x^2+kx+1 مربعًا كاملًا، فما قيمة k؟", "choices": ["4", "±4", "-4", "2"], "answer": "±4", "answerIndex": 1, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): قانون المربع الكامل k = ±2 جذر (الأول×الأخير) = ±2 جذر (4×1) = ±4.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-182", "question": "إذا كان x^2-b=(x+3)(x-3)، فما قيمة b؟", "choices": ["3", "سالب 9", "6", "9"], "answer": "9", "answerIndex": 3, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): لأن x^2-9 = (x+3)(x-3)، فتكون b=9.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-183", "question": "ما العامل الآخر للمقدار x^3+8 إذا كان أحد عامليه (x^2-2x+4)؟", "choices": ["x-2", "x^2+2", "x+2", "x+4"], "answer": "x+2", "answerIndex": 2, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): مجموع مكعبين x^3+2^3 = (x+2)(x^2-2x+4)، فالعامل الآخر هو x+2.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-184", "question": "إذا كانت كثيرة الحدود x^2+bx+15 قابلة للتحليل، فأي قيمة مما يأتي ممكنة لـ b؟", "choices": ["8", "3", "5", "15"], "answer": "8", "answerIndex": 0, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): لأن 15=3×5 ومجموعهما 8، فيمكن أن تكون b=8 (وكذلك -8)؛ أما 3 و5 و15 فلا تحقق شرط المجموع.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-185", "question": "عند إكمال المربع للمقدار x^2+9، ماذا نضيف إليه؟", "choices": ["6x", "سالب 6x", "±6x", "9x"], "answer": "±6x", "answerIndex": 2, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): عند إكمال المربع للمقدار x^2+9 نضيف إليه ±6x ليصبح x^2±6x+9 = (x±3)^2.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-186", "question": "ما مجموعة حل المعادلة 25x^2-30x+9=0 في Q؟", "choices": ["{-3/5}", "{3/5}", "{3/5، -3/5}", "{5/3}"], "answer": "{3/5}", "answerIndex": 1, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): لأن (5x-3)^2=0، فيكون x=3/5، فمجموعة الحل {3/5}.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-187", "question": "ما تحليل المقدار x^2-7x+10؟", "choices": ["(x+5)(x+2)", "(x-5)(x+2)", "(x-10)(x-1)", "(x-5)(x-2)"], "answer": "(x-5)(x-2)", "answerIndex": 3, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): x^2-7x+10 = (x-5)(x-2)، لأن حاصل ضرب -5 و-2 يساوي 10 ومجموعهما -7.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-188", "question": "ما تحليل المقدار -x^2-13x-36 تحليلًا تامًا؟", "choices": ["-(x+9)(x+4)", "(x+9)(x+4)", "-(x-9)(x-4)", "(x-9)(x+4)"], "answer": "-(x+9)(x+4)", "answerIndex": 0, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): -x^2-13x-36 = -(x^2+13x+36) = -(x+9)(x+4).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-189", "question": "ما تحليل المقدار 3x^2-7x-20؟", "choices": ["(3x-5)(x+4)", "(3x+4)(x-5)", "(3x+5)(x-4)", "(3x-4)(x+5)"], "answer": "(3x+5)(x-4)", "answerIndex": 2, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): 3x^2-7x-20 = (3x+5)(x-4)، وهو مقدار ثلاثي غير بسيط لأن معامل x^2 لا يساوي 1.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-190", "question": "ما تحليل المقدار x^2-10x+25؟", "choices": ["(x+5)^2", "(x-5)^2", "(x-5)(x+5)", "(x-10)(x+5)"], "answer": "(x-5)^2", "answerIndex": 1, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): x^2-10x+25 = (x-5)^2، وهو مربع كامل لأن 25 مربع 5 وضعف حاصل ضرب الطرفين 10x.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-191", "question": "ما تحليل المقدار 4x^2 - 1/100؟", "choices": ["(2x-1/10)^2", "(4x-1/10)(4x+1/10)", "(2x+1/10)^2", "(2x-1/10)(2x+1/10)"], "answer": "(2x-1/10)(2x+1/10)", "answerIndex": 3, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): 4x^2 - 1/100 = (2x-1/10)(2x+1/10)، لأنه فرق بين مربعين: (2x)^2 - (1/10)^2.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-192", "question": "ما تحليل المقدار 64x^3-125y^3؟", "choices": ["(4x-5y)(16x^2+20xy+25y^2)", "(4x+5y)(16x^2-20xy+25y^2)", "(4x-5y)(16x^2-20xy+25y^2)", "(4x-5y)(16x^2+20xy-25y^2)"], "answer": "(4x-5y)(16x^2+20xy+25y^2)", "answerIndex": 0, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): 64x^3-125y^3 = (4x-5y)(16x^2+20xy+25y^2)، لأنه فرق بين مكعبين: (4x)^3 - (5y)^3.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-193", "question": "ما قيمة (75)^2 - 2(75)(65) + (65)^2 باستخدام التحليل؟", "choices": ["1000", "10", "100", "140"], "answer": "100", "answerIndex": 2, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): (75)^2-2(75)(65)+(65)^2 = (75-65)^2 = 10^2 = 100.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-194", "question": "ما قيمة (64)^2 - (36)^2 باستخدام التحليل؟", "choices": ["1000", "2800", "280", "100"], "answer": "2800", "answerIndex": 1, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): (64)^2-(36)^2 = (64+36)(64-36) = 100×28 = 2800.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-195", "question": "ما قيمة (6)^3 + (4)^3 باستخدام التحليل؟", "choices": ["100", "216", "64", "280"], "answer": "280", "answerIndex": 3, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): (6)^3+(4)^3 = (6+4)(36-24+16) = 10×28 = 280.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-196", "question": "ما مجموعة حل المعادلة x^2+8x+16=0 في R؟", "choices": ["{-4}", "{4}", "{-4، 4}", "{8}"], "answer": "{-4}", "answerIndex": 0, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): x^2+8x+16=0 ← (x+4)^2=0، فمجموعة الحل {-4}، لأن المربع الكامل له حل وحيد مكرر.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-197", "question": "ما مجموعة حل المعادلة 9x^2-42x+49=0 في R؟", "choices": ["{-7/3}", "{7/3، -7/3}", "{7/3}", "{3/7}"], "answer": "{7/3}", "answerIndex": 2, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): 9x^2-42x+49=0 ← (3x-7)^2=0، فيكون x=7/3، فمجموعة الحل {7/3}.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-198", "question": "ما مجموعة حل المعادلة x^2=361 في R؟", "choices": ["{19}", "{19، -19}", "{-19}", "{361}"], "answer": "{19، -19}", "answerIndex": 1, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): x^2=361 ← x=±19، فمجموعة الحل {19، -19}.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-199", "question": "ما مجموعة حل المعادلة x^3=9x في R؟", "choices": ["{3، -3}", "{0، 3}", "{9}", "{0، 3، -3}"], "answer": "{0، 3، -3}", "answerIndex": 3, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): x^3=9x ← x^3-9x=0 ← x(x^2-9)=0 ← x(x-3)(x+3)=0، فمجموعة الحل {0، 3، -3}.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-200", "question": "ما مجموعة حل المعادلة x^2=3x في R؟", "choices": ["{0، 3}", "{3}", "{0}", "{-3، 3}"], "answer": "{0، 3}", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): في x^2=3x نحصل بعد النقل على x(x-3)=0، فتقبل المعادلة الصفر و3؛ والقسمة على x تفقد الحل الأول.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-201", "question": "أي مما يأتي ليس من حالات تطابق المثلثات؟", "choices": ["ثلاثة أضلاع متناظرة متساوية", "ضلعان والزاوية المحصورة بينهما", "زاويتان وضلع متناظر", "ضلعان وزاوية غير محصورة بينهما"], "answer": "ضلعان وزاوية غير محصورة بينهما", "answerIndex": 3, "explanation": "حالات تطابق المثلثات خمس: (ضلع، ضلع، ضلع)، (ضلع، زاوية، ضلع)، (زاوية، ضلع، زاوية)، (زاوية، زاوية، ضلع)، (وتر، ضلع قائمة)؛ أما ضلعان وزاوية غير محصورة بينهما فليست حالة تطابق.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-202", "question": "المثلث أ ب ج يطابق المثلث س ص ع، قياس زاوية أ = 50°، وقياس زاوية ب = 60°، فما قياس زاوية ع؟", "choices": ["50°", "60°", "70°", "110°"], "answer": "70°", "answerIndex": 2, "explanation": "قياس زاوية ج = 180 − 50 − 60 = 70°، وزاوية ع تناظر زاوية ج في المثلثين المتطابقين فقياسها 70°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-203", "question": "المثلث أ ب ج يطابق المثلث د هـ و، أ ب = 5 سم، ب ج = 7 سم، أ ج = 8 سم، فما طول د و؟", "choices": ["5 سم", "8 سم", "7 سم", "20 سم"], "answer": "8 سم", "answerIndex": 1, "explanation": "الضلع د و يناظر الضلع أ ج (د تناظر أ، هـ تناظر ب، و تناظر ج) فطوله 8 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-204", "question": "أي مما يأتي لا يكفي وحده لتطابق مثلثين قائمي الزاوية؟", "choices": ["الوتر وحده", "الوتر وأحد ضلعي القائمة", "ضلعا القائمة", "الوتر وزاوية حادة"], "answer": "الوتر وحده", "answerIndex": 0, "explanation": "الوتر وحده لا يحدد المثلث القائم؛ أما الوتر مع أحد ضلعي القائمة فحالة (وتر، ضلع)، وضلعا القائمة حالة (ضلع، زاوية، ضلع) لأن الزاوية بينهما 90°، والوتر مع زاوية حادة حالة (زاوية، زاوية، ضلع).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-205", "question": "المضلع أ ب ج د يطابق المضلع س ص ع ل، وقياس زاوية ب = 120°، فما قياس زاوية ص؟", "choices": ["60°", "90°", "120°", "180°"], "answer": "120°", "answerIndex": 2, "explanation": "زاوية ص تناظر زاوية ب في المضلعين المتطابقين، والزوايا المتناظرة في المضلعات المتطابقة متساوية في القياس، فقياسها 120°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-206", "question": "في المثلثين أ ب ج، د هـ و: أ ب = د هـ، ب ج = هـ و، وقياس زاوية ب = قياس زاوية هـ، فالمثلثان متطابقان بحالة...", "choices": ["ثلاثة أضلاع متناظرة", "ضلعان والزاوية المحصورة بينهما", "زاويتان وضلع متناظر", "ضلعان وزاوية غير محصورة"], "answer": "ضلعان والزاوية المحصورة بينهما", "answerIndex": 1, "explanation": "ضلعان متناظران متساويان والزاوية المحصورة بينهما متساوية، فهي حالة التطابق (ضلع، زاوية، ضلع).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-207", "question": "في مثلثين زاويتان متناظرتان متساويتان وضلع متناظر متساوٍ، فالمثلثان متطابقان بحالة...", "choices": ["ثلاثة أضلاع", "ضلعان والزاوية المحصورة", "وتر وضلع قائمة", "زاويتان وضلع"], "answer": "زاويتان وضلع", "answerIndex": 3, "explanation": "زاويتان متناظرتان متساويتان وضلع متناظر متساوٍ حالة تطابق (زاوية، ضلع، زاوية) أو (زاوية، زاوية، ضلع).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-208", "question": "في المثلثين ب ج د، ب هـ د: ب ج = ب هـ، والشعاع ب د ينصف زاوية أ ب ج، وب د ضلع مشترك، فالمثلثان متطابقان بحالة...", "choices": ["ضلع، زاوية، ضلع", "ضلع، ضلع، ضلع", "زاوية، ضلع، زاوية", "زاوية، زاوية، ضلع"], "answer": "ضلع، زاوية، ضلع", "answerIndex": 0, "explanation": "من اختبار الشاطر نوفمبر 2027 (شبابيك): ب ج = ب هـ (معطى)، وقياس زاوية ج ب د = قياس زاوية هـ ب د (لأن ب د منصف)، وب د ضلع مشترك، فهي حالة (ضلع، زاوية، ضلع).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-209", "question": "إذا تطابق مثلثان فإن مساحتيهما...", "choices": ["إحداهما ضعف الأخرى", "مجموعهما 180", "متساويتان", "لا ", "14 سم", "48 سم"], "answer": "10 سم", "answerIndex": 1, "explanation": "الوتر² = 6² + 8² = 36 + 64 = 100، فالوتر = 10 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-215", "question": "في مثلث قائم الزاوية طولا ضلعي القائمة 9 سم و12 سم، فما طول الوتر؟", "choices": ["15 سم", "21 سم", "12 سم", "18 سم"], "answer": "15 سم", "answerIndex": 0, "explanation": "الوتر² = 9² + 12² = 81 + 144 = 225، فالوتر = 15 سم (كما في حل اختبار الشاطر: جذر 225 = 15).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-216", "question": "في مثلث قائم الزاوية طولا ضلعي القائمة 5 سم و12 سم، فما طول الوتر؟", "choices": ["17 سم", "10 سم", "7 سم", "13 سم"], "answer": "13 سم", "answerIndex": 3, "explanation": "الوتر² = 5² + 12² = 25 + 144 = 169، فالوتر = 13 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-217", "question": "مثلث أطوال أضلاعه 6 سم و8 سم و10 سم، فما نوعه بالنسبة لزواياه؟", "choices": ["حاد الزوايا", "منفرج الزاوية", "قائم الزاوية", "متساوي الأضلاع"], "answer": "قائم الزاوية", "answerIndex": 2, "explanation": "6² + 8² = 36 + 64 = 100 = 10²، فيتحقق عكس نظرية فيثاغورس، فالمثلث قائم الزاوية.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-218", "question": "مثلث أطوال أضلاعه 6 سم و7 سم و8 سم، فما نوعه بالنسبة لزواياه؟", "choices": ["حاد الزوايا", "قائم الزاوية", "منفرج الزاوية", "متساوي الساقين"], "answer": "حاد الزوايا", "answerIndex": 0, "explanation": "من اختبار الشاطر نوفمبر 2027 (شبابيك): مربع أكبر ضلع 8² = 64 أصغر من مجموع مربعي الضلعين الآخرين 6² + 7² = 36 + 49 = 85، فالمثلث حاد الزوايا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-219", "question": "مثلث أطوال أضلاعه 5 سم و6 سم و8 سم، فما نوعه بالنسبة لزواياه؟", "choices": ["حاد الزوايا", "منفرج الزاوية", "قائم الزاوية", "متساوي الأضلاع"], "answer": "منفرج الزاوية", "answerIndex": 1, "explanation": "مربع أكبر ضلع 8² = 64 أكبر من مجموع مربعي الضلعين الآخرين 5² + 6² = 25 + 36 = 61، فالمثلث منفرج الزاوية.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-220", "question": "مثلث أطوال أضلاعه 7 سم و24 سم و25 سم، فما نوعه بالنسبة لزواياه؟", "choices": ["حاد الزوايا", "منفرج الزاوية", "متساوي الساقين", "قائم الزاوية"], "answer": "قائم الزاوية", "answerIndex": 3, "explanation": "7² + 24² = 49 + 576 = 625 = 25²، فيتحقق عكس نظرية فيثاغورس، فالمثلث قائم الزاوية.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-221", "question": "القطعة المستقيمة الواصلة بين منتصفي ضلعين في مثلث تساوي...", "choices": ["طول الضلع الثالث", "ضعف طول الضلع الثالث", "نصف طول الضلع الثالث", "ثلث طول الضلع الثالث"], "answer": "نصف طول الضلع الثالث", "answerIndex": 2, "explanation": "القطعة الواصلة بين منتصفي ضلعين في مثلث توازي الضلع الثالث وتساوي نصف طوله.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-222", "question": "في مثلث، القطعة الواصلة بين منتصفي ضلعين طولها 6 سم، فما طول الضلع الثالث الموازي لها؟", "choices": ["12 سم", "3 سم", "6 سم", "18 سم"], "answer": "12 سم", "answerIndex": 0, "explanation": "القطعة الواصلة بين منتصفي ضلعين تساوي نصف الضلع الثالث، فالضلع الثالث = 2 × 6 = 12 سم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-223", "question": "في مثلث أ ب ج، د منتصف أ ب، هـ منتصف أ ج، وكان ب ج = 16 سم، فما طول د هـ؟", "choices": ["4 سم", "16 سم", "32 سم", "8 سم"], "answer": "8 سم", "answerIndex": 3, "explanation": "د هـ واصلة بين منتصفي ضلعين في المثلث، فتساوي نصف طول الضلع الثالث ب ج = 16 ÷ 2 = 8 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-224", "question": "المستقيم المار بمنتصف أحد أضلاع المثلث والموازي لضلع آخر فيه، فإنه...", "choices": ["يساوي الضلع الثالث", "ينصف الضلع الثالث", "يمر برأس المثلث", "يعامد الضلع الثالث"], "answer": "ينصف الضلع الثالث", "answerIndex": 1, "explanation": "نظرية: المستقيم المار بمنتصف ضلع في مثلث وموازٍ لضلع آخر ينصف الضلع الثالث.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-225", "question": "إذا قطع قاطع مستقيمين متوازيين فإن الزاويتين المتبادلتين تكونان...", "choices": ["متساويتين في القياس", "متكاملتين", "مجموعهما 90°", "إحداهما ضعف الأخرى"], "answer": "متساويتين في القياس", "answerIndex": 0, "explanation": "من خواص التوازي: الزاويتان المتبادلتان الناتجتان عن قطع قاطع لمستقيمين متوازيين متساويتان في القياس.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-226", "question": "إذا قطع قاطع مستقيمين متوازيين، فإن مجموع قياسي الزاويتين الداخلتين في جهة واحدة من القاطع يساوي...", "choices": ["90°", "270°", "180°", "360°"], "answer": "180°", "answerIndex": 2, "explanation": "الزاويتان الداخلتان في جهة واحدة من القاطع (المتحالفتان) متكاملتان، فمجموع قياسيهما 180°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-227", "question": "في مثلث، قطعة مستقيمة واصلة بين منتصفي ضلعين، وطول الضلع الثالث فيها 20 سم، فما طول القطعة؟", "choices": ["5 سم", "20 سم", "40 سم", "10 سم"], "answer": "10 سم", "answerIndex": 3, "explanation": "القطعة الواصلة بين منتصفي ضلعين تساوي نصف طول الضلع الثالث = 20 ÷ 2 = 10 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-228", "question": "المتوسط في المثلث هو القطعة المستقيمة الواصلة بين...", "choices": ["منتصفي ضلعين في المثلث", "رأس المثلث ومنتصف الضلع المقابل له", "رأس المثلث ونقطة على الضلع المقابل ليست منتصفه", "منتصف ضلع ومنتصف الضلع المقابل له"], "answer": "رأس المثلث ومنتصف الضلع المقابل له", "answerIndex": 1, "explanation": "تعريف المتوسط: قطعة مستقيمة واصلة بين رأس المثلث ومنتصف الضلع المقابل له.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-229", "question": "نقطة تقاطع متوسطات المثلث تقسم كل متوسط بنسبة...", "choices": ["2 : 1 من جهة الرأس", "1 : 1", "1 : 2 من جهة الرأس", "3 : 1"], "answer": "2 : 1 من جهة الرأس", "answerIndex": 0, "explanation": "نقطة تقاطع متوسطات المثلث (مركز الثقل) تقسم كل متوسط بنسبة 2 : 1 من جهة الرأس.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-230", "question": "في مثلث، طول أحد المتوسطات 9 سم، فما طول القطعة من الرأس إلى نقطة تقاطع المتوسطات؟", "choices": ["3 سم", "4.5 سم", "9 سم", "6 سم"], "answer": "6 سم", "answerIndex": 3, "explanation": "القطعة من الرأس إلى نقطة تقاطع المتوسطات = ثلثي المتوسط = (2 ÷ 3) × 9 = 6 سم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-231", "question": "في مثلث، طول القطعة من نقطة تقاطع المتوسطات إلى منتصف أحد الأضلاع 4 سم، فما طول المتوسط كاملًا؟", "choices": ["6 سم", "8 سم", "12 سم", "16 سم"], "answer": "12 سم", "answerIndex": 2, "explanation": "القطعة من نقطة التقاطع إلى منتصف الضلع = ثلث المتوسط، فالمتوسط كاملًا = 3 × 4 = 12 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-232", "question": "في مثلث قائم الزاوية، المتوسط الخارج من رأس الزاوية القائمة يساوي...", "choices": ["طول الوتر", "نصف طول الوتر", "ضعف طول الوتر", "طول أحد ضلعي القائمة"], "answer": "نصف طول الوتر", "answerIndex": 1, "explanation": "المتوسط الخارج من رأس الزاوية القائمة في المثلث القائم يساوي نصف طول الوتر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-233", "question": "في مثلث قائم الزاوية طول الوتر 10 سم، فما طول المتوسط الخارج من رأس القائمة؟", "choices": ["5 سم", "10 سم", "20 سم", "2.5 سم"], "answer": "5 سم", "answerIndex": 0, "explanation": "المتوسط الخارج من رأس القائمة = نصف طول الوتر = 10 ÷ 2 = 5 سم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-234", "question": "كم عدد متوسطات المثلث؟", "choices": ["1", "2", "3", "4"], "answer": "3", "answerIndex": 2, "explanation": "لكل مثلث ثلاثة متوسطات، تتلاقى جميعًا في نقطة واحدة هي مركز ثقل المثلث.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-235", "question": "في مثلث، نقطة تقاطع المتوسطات تقسم أحد المتوسطات إلى جزأين، طول الجزء الأكبر 8 سم، فما طول المتوسط؟", "choices": ["8 سم", "10 سم", "16 سم", "12 سم"], "answer": "12 سم", "answerIndex": 3, "explanation": "الجزء الأكبر من المتوسط (من جهة الرأس) = ثلثا المتوسط، فالمتوسط = 8 × 3 ÷ 2 = 12 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-236", "question": "في المثلث المتساوي الساقين، زاويتا القاعدة تكونان...", "choices": ["مختلفتين", "قائمتين", "متساويتين في القياس", "مجموعهما 180°"], "answer": "متساويتين في القياس", "answerIndex": 2, "explanation": "في المثلث المتساوي الساقين زاويتا القاعدة متساويتان في القياس.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-237", "question": "مثلث متساوي الساقين قياس زاوية رأسه 40°، فما قياس كل من زاويتي القاعدة؟", "choices": ["70°", "40°", "100°", "140°"], "answer": "70°", "answerIndex": 0, "explanation": "مجموع زوايا المثلث 180°، فقياس كل زاوية قاعدة = (180 − 40) ÷ 2 = 70°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-238", "question": "مثلث متساوي الساقين قياس إحدى زاويتي قاعدته 50°، فما قياس زاوية رأسه؟", "choices": ["50°", "100°", "130°", "80°"], "answer": "80°", "answerIndex": 3, "explanation": "قياس زاوية الرأس = 180 − (50 + 50) = 80°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-239", "question": "في مثلث قائم الزاوية، طول الضلع المقابل للزاوية 30° يساوي...", "choices": ["طول الوتر", "نصف طول الوتر", "ضعف طول الوتر", "جذر طول الوتر"], "answer": "نصف طول الوتر", "answerIndex": 1, "explanation": "في المثلث القائم الزاوية، طول الضلع المقابل للزاوية 30° يساوي نصف طول الوتر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-240", "question": "في مثلث قائم الزاوية، طول الضلع المقابل للزاوية 30° هو 4 سم، فما طول الوتر؟", "choices": ["2 سم", "4 سم", "8 سم", "16 سم"], "answer": "8 سم", "answerIndex": 2, "explanation": "الوتر = ضعف الضلع المقابل للزاوية 30° = 2 × 4 = 8 سم (كما في حل اختبار الشاطر: الضلع 5 سم يقابله وتر 10 سم).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-241", "question": "مثلث قائم الزاوية زواياه 30° و60° و90°، وطول الوتر 12 سم، فما طول الضلع المقابل للزاوية 60°؟", "choices": ["6 جذر 3 سم", "6 سم", "12 جذر 3 سم", "3 جذر 3 سم"], "answer": "6 جذر 3 سم", "answerIndex": 0, "explanation": "الضلع المقابل للزاوية 60° = (جذر 3 ÷ 2) × طول الوتر = (جذر 3 ÷ 2) × 12 = 6 جذر 3 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-242", "question": "مثلث متساوي الساقين طول كل من ساقيه 5 سم وطول قاعدته 6 سم، فما محيطه؟", "choices": ["11 سم", "22 سم", "30 سم", "16 سم"], "answer": "16 سم", "answerIndex": 3, "explanation": "محيط المثلث = مجموع أطوال أضلاعه = 5 + 5 + 6 = 16 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-243", "question": "في شكل رباعي قياسات ثلاث من زواياه 90° و100° و80°، فما قياس الزاوية الرابعة؟", "choices": ["70°", "90°", "80°", "100°"], "answer": "90°", "answerIndex": 1, "explanation": "مجموع قياسات الزوايا الداخلة للشكل الرباعي = 360°، فالزاوية الرابعة = 360 − (90 + 100 + 80) = 90°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-244", "question": "في خماسي قياسات أربع من زواياه 100° و110° و120° و90°، فما قياس الزاوية الخامسة؟", "choices": ["120°", "100°", "140°", "160°"], "answer": "120°", "answerIndex": 0, "explanation": "مجموع قياسات الزوايا الداخلة للخماسي = (5 − 2) × 180 = 540°، فالزاوية الخامسة = 540 − (100 + 110 + 120 + 90) = 120°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-245", "question": "قياس كل زاوية من زوايا الخماسي المنتظم يساوي...", "choices": ["90°", "108°", "120°", "135°"], "answer": "108°", "answerIndex": 1, "explanation": "من اختبار الشاطر نوفمبر 2027 (شبابيك): قياس كل زاوية داخلة في الخماسي المنتظم = (5 − 2) × 180 ÷ 5 = 108°.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-246", "question": "مجموع قياسات الزوايا الخارجة عن أي مضلع محدب يساوي...", "choices": ["180°", "540°", "360°", "(ن − 2) × 180°"], "answer": "360°", "answerIndex": 2, "explanation": "من اختبار الشاطر نوفمبر 2027 (شبابيك): مجموع قياسات الزوايا الخارجة عن أي مضلع محدب = 360° دائمًا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-247", "question": "عدد أضلاع المضلع المحدب الذي له 20 قطرًا يساوي...", "choices": ["6 أضلاع", "8 أضلاع", "7 أضلاع", "10 أضلاع"], "answer": "8 أضلاع", "answerIndex": 1, "explanation": "من اختبار الشاطر نوفمبر 2027 (شبابيك): عدد الأقطار = ن × (ن − 3) ÷ 2 = 20، فـ ن² − 3ن − 40 = 0، ومنها ن = 8 أضلاع.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-248", "question": "عدد أقطار المضلع السداسي يساوي...", "choices": ["9", "6", "12", "15"], "answer": "9", "answerIndex": 0, "explanation": "عدد أقطار المضلع = ن × (ن − 3) ÷ 2 = 6 × 3 ÷ 2 = 9.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-249", "question": "قياس كل زاوية من زوايا السداسي المنتظم يساوي...", "choices": ["108°", "135°", "150°", "120°"], "answer": "120°", "answerIndex": 3, "explanation": "قياس كل زاوية داخلة في السداسي المنتظم = (6 − 2) × 180 ÷ 6 = 120°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-250", "question": "قياس كل زاوية خارجة عن الثماني المنتظم يساوي...", "choices": ["30°", "60°", "45°", "135°"], "answer": "45°", "answerIndex": 2, "explanation": "قياس كل زاوية خارجة عن مضلع منتظم = 360 ÷ عدد الأضلاع = 360 ÷ 8 = 45°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-251", "question": "We should face every ..................... with courage and determination.", "choices": ["tunnel", "monorail", "challenge", "clay"], "answer": "challenge", "answerIndex": 2, "explanation": "من منشور «How to face challenges» في ملحق المعاصر (الوحدة الثالثة): «Life is full of challenges, but we can face them with courage and determination» — نواجه كل تحدٍّ بشجاعة وتصميم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-252", "question": "You need ..................... to speak in front of people and face your fears.", "choices": ["courage", "clay", "tunnel", "mistake"], "answer": "courage", "answerIndex": 0, "explanation": "من إجابات مفردات الوحدة الثالثة في ملحق المعاصر (المجموعة B: courage)، ومن المنشور نفسه: نواجه التحديات «with courage» — الشجاعة هي ما نحتاجه لمواجهة مخاوفنا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-253", "question": "The new ..................... in our city is very fast; it runs on one rail.", "choices": ["tunnel", "challenge", "sculpture", "monorail"], "answer": "monorail", "answerIndex": 3, "explanation": "من إجابات مفردات الوحدة الثالثة في ملحق المعاصر (المجموعة B: monorail) — المونوريل قطار يسير على قضيب واحد.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-254", "question": "Cars pass through the ..................... under the mountain.", "choices": ["monorail", "tunnel", "challenge", "message"], "answer": "tunnel", "answerIndex": 1, "explanation": "من التمارين العامة على الوحدة الثالثة في ملحق المعاصر (Choose: tunnel) — النفق ممر تحت الجبل تمر منه السيارات.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-255", "question": "To stay ..................... , you should eat well and exercise every day.", "choices": ["nervous", "tired", "healthy", "sad"], "answer": "healthy", "answerIndex": 2, "explanation": "من تمرين إكمال النص على الوحدة الثالثة في ملحق المعاصر (healthy) — البقاء بصحة جيدة يحتاج طعامًا جيدًا ورياضة يومية.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-256", "question": "I feel ..................... before my exam, but I take a deep breath and calm down.", "choices": ["nervous", "healthy", "confident", "happy"], "answer": "nervous", "answerIndex": 0, "explanation": "من تمرين إكمال النص على الوحدة الثالثة في ملحق المعاصر (nervous) — الشعور بالتوتر قبل الامتحان، ومن المنشور: «stay calm, take a deep breath».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-257", "question": "I tried many times. ..................... , I solved the problem and felt happy.", "choices": ["Suddenly", "Quickly", "Sadly", "Finally"], "answer": "Finally", "answerIndex": 3, "explanation": "من تمرين إكمال النص على الوحدة الثالثة في ملحق المعاصر (Finally) — بعد محاولات متكررة تأتي «أخيرًا» خاتمةً للقصة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-258", "question": "The words «happy» and «sad» have opposite meanings. They are ..................... .", "choices": ["synonyms", "antonyms", "challenges", "sculptures"], "answer": "antonyms", "answerIndex": 1, "explanation": "من إجابات مفردات الوحدة الثالثة في ملحق المعاصر (المجموعة A: antonyms) — الكلمات المتضادة في المعنى تسمى antonyms.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-259", "question": "A: How ..................... is this dress? B: It is 200 pounds.", "choices": ["many", "long", "much", "often"], "answer": "much", "answerIndex": 2, "explanation": "من سؤال المحادثة على الوحدة الثالثة في ملحق المعاصر (much) — السؤال عن سعر شيء غير معدود يكون بـ How much.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-260", "question": "The prefix ..................... gives the opposite of «possible»: «impossible».", "choices": ["im-", "un-", "re-", "pre-"], "answer": "im-", "answerIndex": 0, "explanation": "من إجابات مفردات الوحدة الثالثة في ملحق المعاصر (المجموعة A: im-) — البادئة im- تعني النفي في impossible.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-261", "question": "A person with determination never ..................... when things are difficult.", "choices": ["runs away", "gives up", "makes mistakes", "asks for help"], "answer": "gives up", "answerIndex": 1, "explanation": "من منشور «How to face challenges» في ملحق المعاصر: «Practice a lot and never give up» — صاحب التصميم لا يستسلم أبدًا مهما صعبت الأمور.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-262", "question": "An ..................... is something that stops you from doing what you want.", "choices": ["tunnel", "sculpture", "message", "obstacle"], "answer": "obstacle", "answerIndex": 3, "explanation": "من شرح تقييمات Step Ahead للوحدة الثالثة: ترتبط المشكلات بمفردات مثل determination وobstacle وconfident — العقبة شيء يعيقك عن هدفك.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2679/"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-263", "question": "While I ..................... video games, she came.", "choices": ["played", "am playing", "was playing", "play"], "answer": "was playing", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة على الوحدة الثالثة في ملحق المعاصر: «While I was playing video games, she came» — الحدث المستمر (was playing) في الخلفية، والحدث القصير (came) قطعه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-264", "question": "As we ..................... , Ali broke his leg.", "choices": ["were running", "ran", "are running", "run"], "answer": "were running", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «As we were running, Ali broke his leg» — الجري مستمر، والكسر حدث قصير وقع أثناءه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-265", "question": "I ..................... to school when it rained.", "choices": ["walked", "was walking", "am walking", "walk"], "answer": "was walking", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «I was walking to school when it rained» — المشي خلفية مستمرة، والمطر حدث قصير؛ كما في شرح Step Ahead: المشي يمثل الخلفية المستمرة ورؤية الحادث حدث قصير.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-266", "question": "While they ..................... , it started to get dark.", "choices": ["played", "are playing", "play", "were playing"], "answer": "were playing", "answerIndex": 3, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «While they were playing, it started to get dark» — اللعب مستمر، وحلول الظلام حدث وقع أثناءه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-267", "question": "We ..................... the film when our father arrived.", "choices": ["watched", "are watching", "were watching", "watch"], "answer": "were watching", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «We were watching the film when our father arrived» — المشاهدة مستمرة، ووصول الأب حدث قصير قطعها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-268", "question": "I ..................... all the pizza for dinner yesterday.", "choices": ["ate", "was eating", "eat", "eats"], "answer": "ate", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «I ate all the pizza for dinner yesterday» — حدث مكتمل مع yesterday يأتي في الماضي البسيط.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-269", "question": "I ..................... a photo while my sister was smiling.", "choices": ["was taking", "took", "take", "takes"], "answer": "took", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «I took a photo while my sister was smiling» — التقاط الصورة حدث قصير مكتمل (ماضٍ بسيط)، والابتسام خلفية مستمرة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-270", "question": "As I ..................... a movie, I fell asleep.", "choices": ["watched", "am watching", "watch", "was watching"], "answer": "was watching", "answerIndex": 3, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «As I was watching a movie, I fell asleep» — المشاهدة مستمرة، والنوم حدث وقع أثناءها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-271", "question": "I ..................... when my mother called me.", "choices": ["read", "am reading", "was reading", "reads"], "answer": "was reading", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «I was reading when my mother called me» — القراءة مستمرة، والاتصال حدث قصير قطعها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-272", "question": "As she ..................... , they came.", "choices": ["was cooking", "cooked", "is cooking", "cook"], "answer": "was cooking", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «As she was cooking, they came» — الطبخ مستمر، ومجيئهم حدث وقع أثناءه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-273", "question": "How about ..................... a study plan to face your exams?", "choices": ["make", "making", "made", "to make"], "answer": "making", "answerIndex": 1, "explanation": "من شرح تقييمات Step Ahead للوحدة الثالثة: بعد How about يأتي الفعل مضافًا إليه ing، مثل «How about making a study plan?» — أما بعد should فيأتي المصدر.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2679/"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-274", "question": "I suggest ..................... to your teacher for help.", "choices": ["go", "went", "to go", "going"], "answer": "going", "answerIndex": 3, "explanation": "من شرح تقييمات Step Ahead للوحدة الثالثة: بعد suggest يأتي الفعل مضافًا إليه ing، مثل «I suggest going».", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2679/"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-275", "question": "You should ..................... calm and think positively.", "choices": ["staying", "stayed", "stay", "to stay"], "answer": "stay", "answerIndex": 2, "explanation": "من منشور «How to face challenges» في ملحق المعاصر: «stay calm, take a deep breath and think positively» — وبعد should يأتي الفعل في المصدر كما في شرح Step Ahead.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-276", "question": "Sculptures are made by shaping materials like stone, wood, metal or ..................... .", "choices": ["clay", "tunnel", "monorail", "challenge"], "answer": "clay", "answerIndex": 0, "explanation": "من إجابات مفردات الوحدة الرابعة في ملحق المعاصر (المجموعة A: Clay)، ومن فقرة «Your favorite type of art»: التماثيل تُصنع بتشكيل الحجر أو الخشب أو المعدن أو الطين.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-277", "question": "Art helps the artist ..................... his ideas and emotions.", "choices": ["discover", "express", "move", "run"], "answer": "express", "answerIndex": 1, "explanation": "من إجابات مفردات الوحدة الرابعة في ملحق المعاصر (المجموعة A: express)، ومن الفقرة: كل تمثال يساعد الفنان على التعبير عن أفكاره ومشاعره.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-278", "question": "Mahmoud Mokhtar's Nahdat Misr Statue is very ..................... ; it is a symbol of Egypt's history.", "choices": ["common", "nervous", "valuable", "healthy"], "answer": "valuable", "answerIndex": 2, "explanation": "من إجابات مفردات الوحدة الرابعة في ملحق المعاصر (المجموعة B: Valuable) — التمثال قيّم لأنه رمز لتاريخ مصر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-279", "question": "Farming and growing crops are called ..................... .", "choices": ["sculpture", "challenge", "message", "agriculture"], "answer": "agriculture", "answerIndex": 3, "explanation": "من التمارين العامة على الوحدة الرابعة في ملحق المعاصر (Choose: agriculture)، ومن الفقرة: تمثال نهضة مصر رمز لتاريخ مصر وزراعتها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-280", "question": "..................... are objects made by shaping stone, wood, metal or clay.", "choices": ["Sculptures", "Paintings", "Tunnels", "Challenges"], "answer": "Sculptures", "answerIndex": 0, "explanation": "من التمارين العامة على الوحدة الرابعة في ملحق المعاصر (Choose: Sculptures)، ومن فقرة «Your favorite type of art»: التماثيل أشياء تُصنع بتشكيل الحجر والخشب والمعدن والطين.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-281", "question": "The artist's message is very ..................... ; everyone should understand it.", "choices": ["common", "important", "nervous", "healthy"], "answer": "important", "answerIndex": 1, "explanation": "من إجابات مفردات الوحدة الرابعة في ملحق المعاصر (المجموعة B: important) — رسالة الفنان مهمة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-282", "question": "The suffix ..................... turns «active» into «activity».", "choices": ["-able", "-ive", "-ity", "-ion"], "answer": "-ity", "answerIndex": 2, "explanation": "من التمارين العامة على الوحدة الرابعة في ملحق المعاصر (Choose: -ity) — اللاحقة -ity تحوّل الصفة إلى اسم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-283", "question": "The suffix ..................... turns «enjoy» into «enjoyable».", "choices": ["-ive", "-ity", "-ion", "-able"], "answer": "-able", "answerIndex": 3, "explanation": "من إجابات مفردات الوحدة الرابعة في ملحق المعاصر (المجموعة A: -able) — اللاحقة -able تعني «قابل لـ».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-284", "question": "The suffix ..................... turns «act» into «active».", "choices": ["-ive", "-able", "-ity", "-ion"], "answer": "-ive", "answerIndex": 0, "explanation": "من إجابات مفردات الوحدة الرابعة في ملحق المعاصر (المجموعة B: -ive) — اللاحقة -ive تحوّل الفعل إلى صفة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-285", "question": "When you visit an art gallery, you can ..................... new artists and ideas.", "choices": ["express", "discover", "move", "run"], "answer": "discover", "answerIndex": 1, "explanation": "من تمرين إكمال النص على الوحدة الرابعة في ملحق المعاصر (discover)، ومن الفقرة: الفن يساعدنا على اكتشاف أفكار جديدة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-286", "question": "The museum has many beautiful ..................... on its walls.", "choices": ["sculptures", "tunnels", "paintings", "challenges"], "answer": "paintings", "answerIndex": 2, "explanation": "من تمرين إكمال النص على الوحدة الرابعة في ملحق المعاصر (paintings) — اللوحات الفنية هي ما يُعلَّق على جدران المتحف.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-287", "question": "Every sculpture tells a story and has a special ..................... .", "choices": ["tunnel", "monorail", "challenge", "message"], "answer": "message", "answerIndex": 3, "explanation": "من تمرين إكمال النص على الوحدة الرابعة في ملحق المعاصر (message)، ومن الفقرة: كل تمثال يحكي قصة وله رسالة خاصة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-288", "question": "Ali is facing many problems, ..................... he always smiles.", "choices": ["but", "because", "so", "although"], "answer": "but", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة على الوحدة الرابعة في ملحق المعاصر: «Ali is facing many problems, but he always smiles» — but تربط بين فكرتين متعارضتين.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-289", "question": "I woke up late, ..................... I missed the bus.", "choices": ["because", "so", "but", "although"], "answer": "so", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «I woke up late, so I missed the bus» — so تربط السبب بالنتيجة: الاستيقاظ متأخرًا سبب، وفوات الحافلة نتيجة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-290", "question": "I gain weight ..................... I eat unhealthy food.", "choices": ["so", "but", "because", "although"], "answer": "because", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «I gain weight because I eat unhealthy food» — because تأتي بعد النتيجة وتقدّم سببها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-291", "question": "..................... I slept late, I got up early.", "choices": ["Because", "So", "But", "Although"], "answer": "Although", "answerIndex": 3, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «Although I slept late, I got up early» — although تعني «بالرغم من»، ولا تُجمع مع but في جملة واحدة كما ينبّه شرح Step Ahead.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-292", "question": "They passed the test ..................... they studied hard.", "choices": ["because", "so", "but", "although"], "answer": "because", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «They passed the test because they studied hard» — النجاح نتيجة، والدراسة الجادة سببها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-293", "question": "He is thirsty, ..................... he drinks water.", "choices": ["because", "so", "but", "although"], "answer": "so", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «He is thirsty, so he drinks water» — العطش سبب، وشرب الماء نتيجته.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-294", "question": "..................... Omar didn't study, he passed the test.", "choices": ["Because", "So", "Although", "But"], "answer": "Although", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «Although Omar didn't study, he passed the test» — تعارض بين عدم الدراسة والنجاح.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-295", "question": "Salma was sick, ..................... she went to school.", "choices": ["because", "so", "although", "but"], "answer": "but", "answerIndex": 3, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «Salma was sick, but she went to school» — المرض والذهاب للمدرسة فكرتان متعارضتان.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-296", "question": "He is wearing new clothes ..................... he is rich.", "choices": ["because", "so", "but", "although"], "answer": "because", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «He is wearing new clothes because he is rich» — الغنى سبب ارتداء الملابس الجديدة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-297", "question": "He won the art competition, ..................... he felt happy.", "choices": ["because", "so", "but", "although"], "answer": "so", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «He won the art competition, so he felt happy» — الفوز سبب، والفرح نتيجته.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-298", "question": "What is Mahmoud Mokhtar's Nahdat Misr Statue a symbol of?", "choices": ["Egypt's sports and games", "Egypt's deserts and seas", "Egypt's history and agriculture", "Egypt's schools and hospitals"], "answer": "Egypt's history and agriculture", "answerIndex": 2, "explanation": "من فقرة «Your favorite type of art» في ملحق المعاصر: تمثال نهضة مصر للفنان محمود مختار رمز لتاريخ مصر وزراعتها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/sh
