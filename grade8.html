اء", "خنازير صاغرين", "طيورًا مهاجرة", "قردة خاسئين"], "answer": "قردة خاسئين", "answerIndex": 3, "explanation": "قال تعالى في الآية 166 من سورة الأعراف: ﴿فَلَمَّا عَتَوْا عَنْ مَا نُهُوا عَنْهُ قُلْنَا لَهُمْ كُونُوا قِرَدَةً خَاسِئِينَ﴾.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/surah/7/quran-simple"}, {"grade": 8, "subject": "القرآن الكريم", "id": "h26-g8-446", "question": "بماذا أشهد الله بني آدم على أنفسهم كما في الآية 172 من سورة الأعراف؟", "choices": ["ألست بخالقكم قالوا لا", "ألستم عبادي قالوا بلى", "ألست بإلهكم قالوا ما شهدنا", "ألست بربكم قالوا بلى شهدنا"], "answer": "ألست بربكم قالوا بلى شهدنا", "answerIndex": 3, "explanation": "قال تعالى في الآية 172 من سورة الأعراف: ﴿وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلَىٰ أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ ۖ قَالُوا بَلَىٰ ۛ شَهِدْنَا ۛ أَنْ تَقُولُوا يَوْمَ الْقِيَامَةِ إِنَّا كُنَّا عَنْ هَٰذَا غَافِلِينَ﴾.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/surah/7/quran-simple"}, {"grade": 8, "subject": "القرآن الكريم", "id": "h26-g8-447", "question": "بماذا وصف الله من لهم قلوب لا يفقهون بها وأعين لا يبصرون بها وآذان لا يسمعون بها كما في الآية 179 من سورة الأعراف؟", "choices": ["كالجبال بل هم أثبت", "كالملائكة بل هم أطهر", "كالطير بل هم أسرع", "كالأنعام بل هم أضل"], "answer": "كالأنعام بل هم أضل", "answerIndex": 3, "explanation": "قال تعالى في الآية 179 من سورة الأعراف: ﴿وَلَقَدْ ذَرَأْنَا لِجَهَنَّمَ كَثِيرًا مِنَ الْجِنِّ وَالْإِنْسِ ۖ لَهُمْ قُلُوبٌ لَا يَفْقَهُونَ بِهَا وَلَهُمْ أَعْيُنٌ لَا يُبْصِرُونَ بِهَا وَلَهُمْ آذَانٌ لَا يَسْمَعُونَ بِهَا ۚ أُولَٰئِكَ كَالْأَنْعَامِ بَلْ هُمْ أَضَلُّ ۚ أُولَٰئِكَ هُمُ الْغَافِلُونَ﴾.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/surah/7/quran-simple"}, {"grade": 8, "subject": "القرآن الكريم", "id": "h26-g8-448", "question": "علم الساعة عند من كما في الآية 187 من سورة الأعراف؟", "choices": ["عند الله وحده", "عند الرسل", "عند أهل الكتاب", "عند الملائكة"], "answer": "عند الله وحده", "answerIndex": 0, "explanation": "قال تعالى في الآية 187 من سورة الأعراف: ﴿يَسْأَلُونَكَ عَنِ السَّاعَةِ أَيَّانَ مُرْسَاهَا ۖ قُلْ إِنَّمَا عِلْمُهَا عِنْدَ رَبِّي ۖ لَا يُجَلِّيهَا لِوَقْتِهَا إِلَّا هُوَ ۚ ثَقُلَتْ فِي السَّمَاوَاتِ وَالْأَرْضِ ۚ لَا تَأْتِيكُمْ إِلَّا بَغْتَةً ۗ يَسْأَلُونَكَ كَأَنَّكَ حَفِيٌّ عَنْهَا ۖ قُلْ إِنَّمَا عِلْمُهَا عِنْدَ اللَّهِ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ﴾.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/surah/7/quran-simple"}, {"grade": 8, "subject": "القرآن الكريم", "id": "h26-g8-449", "question": "ما الوصية الجامعة التي أمر الله بها نبيه في الآية 199 من سورة الأعراف؟", "choices": ["خذ الغنيمة وأمر بالصبر وأعرض عن الكفار", "خذ الصدقة وأمر بالزكاة وأعرض عن الفقراء", "خذ المال وأمر بالقتال وأعرض عن المؤمنين", "خذ العفو وأمر بالعرف وأعرض عن الجاهلين"], "answer": "خذ العفو وأمر بالعرف وأعرض عن الجاهلين", "answerIndex": 3, "explanation": "قال تعالى في الآية 199 من سورة الأعراف: ﴿خُذِ الْعَفْوَ وَأْمُرْ بِالْعُرْفِ وَأَعْرِضْ عَنِ الْجَاهِلِينَ﴾.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/surah/7/quran-simple"}, {"grade": 8, "subject": "القرآن الكريم", "id": "h26-g8-450", "question": "ماذا يجب على المسلم عند قراءة القرآن كما في الآية 204 من سورة الأعراف؟", "choices": ["التلاوة معه بصوت عال", "الاستماع له والإنصات", "الكتابة عنه فورًا", "القيام له والركوع"], "answer": "الاستماع له والإنصات", "answerIndex": 1, "explanation": "قال تعالى في الآية 204 من سورة الأعراف: ﴿وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ وَأَنْصِتُوا لَعَلَّكُمْ تُرْحَمُونَ﴾.", "type": "mcq", "topic": "", "source": "https://api.alquran.cloud/v1/surah/7/quran-simple"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-451", "question": "ما تعريف «الفاعل» عند صاحب الأزهرية؟", "choices": ["الاسم المسند إلى المبتدأ ليتمم به فائدة الكلام", "كل اسم حذف فاعله، وأقيم هو مقامه", "الاسم المسند إليه فعل أو شبهه، مقدم عليه، على جهة قيامه به، أو وقوعه منه", "الاسم المرفوع المجرد عن العوامل اللفظية غير الزائدة للإسناد"], "answer": "الاسم المسند إليه فعل أو شبهه، مقدم عليه، على جهة قيامه به، أو وقوعه منه", "answerIndex": 2, "explanation": "«وهو الاسم المسند إليه فعل أو شبهه، مقدم عليه، على جهة قيامه به، أو وقوعه منه»؛ فالأول نحو: (علم زيد)، والثاني نحو: (قام زيد).", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-452", "question": "في أي مثال يكون الاسم المرفوع فاعلًا لوقوع الفعل منه؟", "choices": ["مصر منتصر جيشها", "انكسر المصباح", "محمد منكسر مصباحه", "انتصر الجيش"], "answer": "انتصر الجيش", "answerIndex": 3, "explanation": "«وكل اسم مرفوع سبقه فعل ووقع منه يكون فاعلًا»؛ فـ«الجيش» في «انتصر الجيش» سبقه فعل أحدثه ووقع منه، أما «انكسر المصباح» فالفعل اتصف به ولم يقع منه، و«مصر منتصر جيشها» سبقه اسم يشبه الفعل.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-453", "question": "ما الفاعل في قولنا: «يسرني أن تجتهد»؟", "choices": ["اجتهادك", "ضمير مستتر تقديره أنا", "أن تجتهد نفسها", "ياء المتكلم في يسرني"], "answer": "اجتهادك", "answerIndex": 0, "explanation": "«ففاعل (يسرني) الاسم المفهوم من مجموع (أن تجتهد) وهو اجتهادك»؛ «فالفاعل في هذين المثالين اسم مؤول بالصريح».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-454", "question": "ما حكم الفعل مع فاعله في الإفراد والتثنية والجمع؟", "choices": ["لا يختلف باختلاف الفاعل إفرادًا وتثنية وجمعًا", "يختلف باختلاف الفاعل في كل الأحوال", "يلحقه علامة التثنية إذا كان الفاعل مثنى", "يلحقه علامة الجمع إذا كان الفاعل جمعًا"], "answer": "لا يختلف باختلاف الفاعل إفرادًا وتثنية وجمعًا", "answerIndex": 0, "explanation": "«التنبيه الثاني الفعل لا يختلف باختلاف فاعله إفرادًا وتثنية وجمعًا؛ فلا تلحقه علامة تثنية ولا علامة جمع؛ فتقول: (حضر المحمدان، وحضر المحمدون)، كما تقول: (حضر محمد)، بلا تغيير في الفعل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-455", "question": "متى يجب تأنيث الفعل؟", "choices": ["إذا كان الفاعل جمع تكسير لمذكر أو لمؤنث", "إذا كان الفاعل اسمًا ظاهرًا حقيقي التأنيث متصلًا بالفعل، أو ضميرًا يعود على مؤنث", "إذا كان العامل (نعم أو بئس)", "إذا كان الفاعل ظاهرًا حقيقي التأنيث منفصلًا عن الفعل"], "answer": "إذا كان الفاعل اسمًا ظاهرًا حقيقي التأنيث متصلًا بالفعل، أو ضميرًا يعود على مؤنث", "answerIndex": 1, "explanation": "«فهو واجب في موضعين: أولًا إذا كان الفاعل اسمًا ظاهرًا حقيقي التأنيث متصلًا بالفعل وليس العامل (نعم أو بئس)، نحو: نجحت الفتاة. ثانيًا إذا كان الفاعل ضميرًا يعود على مؤنث حقيقي أو مجازي، نحو: الفتاة نجحت، العين فاضت بالدمع، الأبواب انفتحت»؛ أما الحالات الثلاث المذكورة في الخيارات الأخرى فتأنيث الفعل فيها جائز لا واجب.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-456", "question": "ما الفاعل في قوله تعالى: ﴿فبأي آلاء ربكما تكذبان﴾؟", "choices": ["ضمير مستتر تقديره أنتما", "كلمة آلاء", "ياء المتكلم", "ألف الاثنين"], "answer": "ألف الاثنين", "answerIndex": 3, "explanation": "في نموذج الإعراب: «فعل مضارع مرفوع؛ لتجرده من الناصب والجازم، وعلامة رفعه ثبوت النون؛ لأنه من الأفعال الخمسة»، «وألف الاثنين: ضمير مبني على السكون في محل رفع فاعل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-457", "question": "ما تعريف «نائب الفاعل»؟", "choices": ["الاسم المسند إليه فعل أو شبهه، مقدم عليه", "كل اسم مرفوع لم يسبقه عامل لفظي وجيء به للحديث عنه", "كل اسم مرفوع بعد فعل سواء أكان ماضيًا أم مضارعًا أو اسم يشبه الفعل بعد حذف فاعله", "كل اسم منصوب بعد فعل مبني للمعلوم"], "answer": "كل اسم مرفوع بعد فعل سواء أكان ماضيًا أم مضارعًا أو اسم يشبه الفعل بعد حذف فاعله", "answerIndex": 2, "explanation": "«وكل اسم مرفوع بعد فعل سواء أكان ماضيًا أم مضارعًا أو اسم يشبه الفعل بعد حذف فاعله، فهو نائب فاعل»؛ «أن النائب عن الفاعل صار كالفاعل مرفوعًا بعد أن كان منصوبًا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-458", "question": "كيف تتغير صورة الفعل الماضي عند بنائه للمجهول؟", "choices": ["بضم أوله، وكسر ما قبل آخره", "بفتح أوله، وضم ما قبل آخره", "بضم أوله، وفتح ما قبل آخره", "بكسر أوله، وضم ما قبل آخره"], "answer": "بضم أوله، وكسر ما قبل آخره", "answerIndex": 0, "explanation": "«تغيرت صورة الماضي بضم أوله، وكسر ما قبل آخره؛ تحقيقًا كما في (زرع وأكلت)، وتقديرًا كما في (بيع)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-459", "question": "كيف تتغير صورة الفعل المضارع عند بنائه للمجهول؟", "choices": ["بضم أوله، وكسر ما قبل آخره", "بفتح أوله، وضم ما قبل آخره", "بكسر أوله، وفتح ما قبل آخره", "بضم أوله، وفتح ما قبل آخره"], "answer": "بضم أوله، وفتح ما قبل آخره", "answerIndex": 3, "explanation": "«تغيرت صورة المضارع بضم أوله وفتح ما قبل آخره تحقيقًا كما في (تُنصح)، وتقديرًا كما في (يمد)»؛ «وكما في (يُطاع)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-460", "question": "ما نائب الفاعل في قولنا: «زُرع الحقل»؟", "choices": ["الفعل زُرع", "لا نائب فاعل في الجملة", "الحقل", "ضمير مستتر تقديره هو"], "answer": "الحقل", "answerIndex": 2, "explanation": "من أمثلة الكتاب: «زُرع الحقل، أُكلت التفاحة، بيع متاعهم»؛ فالحقل نائب فاعل مرفوع بعد حذف الفاعل وبناء الفعل للمجهول.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-461", "question": "ما إعراب كلمة الأرض في قوله تعالى: ﴿إذا زلزلت الأرض زلزالها﴾؟", "choices": ["مبتدأ مرفوع، وعلامة رفعه الضمة الظاهرة", "نائب فاعل مرفوع، وعلامة رفعه الضمة الظاهرة", "فاعل مرفوع، وعلامة رفعه الضمة الظاهرة", "مفعول به منصوب، وعلامة نصبه الفتحة الظاهرة"], "answer": "نائب فاعل مرفوع، وعلامة رفعه الضمة الظاهرة", "answerIndex": 1, "explanation": "الفعل (زلزلت) مبني للمجهول، و(الأرض) نائب فاعل مرفوع، وعلامة رفعه الضمة الظاهرة؛ قال تعالى: ﴿إذا زلزلت الأرض زلزالها﴾ [الزلزلة 1].", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-462", "question": "كم نوعًا للظاهر من نائب الفاعل؟", "choices": ["ستة أنواع", "ثمانية أنواع", "اثنا عشر نوعًا", "أربعة أنواع"], "answer": "ثمانية أنواع", "answerIndex": 1, "explanation": "«فالظاهر ثمانية أنواع؛ إما أن يكون مفردًا، أو مثنى، أو جمعًا سالمًا، أو جمعًا مكسرًا، وفي كل إما أن يكون مذكرًا أو مؤنثًا»؛ أما الاثنا عشر نوعًا فهي أقسام المضمر.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-463", "question": "ما تعريف «المبتدأ»؟", "choices": ["اسم مرفوع سبقه فعل أو شبهه على جهة وقوعه منه", "اسم منصوب بعد فعل ناسخ وجُعل اسمًا له", "اسم مرفوع مجرد عن العوامل اللفظية غير الزائدة، وقصد من الإتيان به الحديث عنه", "اسم مرفوع أسند إلى المبتدأ ليتمم به فائدة الكلام"], "answer": "اسم مرفوع مجرد عن العوامل اللفظية غير الزائدة، وقصد من الإتيان به الحديث عنه", "answerIndex": 2, "explanation": "«أن المبتدأ: اسم مرفوع مجرد عن العوامل اللفظية غير الزائدة، وقصد من الإتيان به الحديث عنه (الإسناد إليه)»؛ «المبتدأ هو الاسم المرفوع المجرد عن العوامل اللفظية غير الزائدة للإسناد».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-464", "question": "ما تعريف «الخبر»؟", "choices": ["اسم منصوب بعد حرف ناسخ وجُعل خبرًا له", "اسم مرفوع سبقه فعل مبني للمجهول", "اسم مرفوع أسند إلى المبتدأ؛ ليتمم به فائدة الكلام", "اسم مرفوع مجرد عن العوامل اللفظية غير الزائدة"], "answer": "اسم مرفوع أسند إلى المبتدأ؛ ليتمم به فائدة الكلام", "answerIndex": 2, "explanation": "«وأن الخبر: اسم مرفوع أسند إلى المبتدأ؛ ليتمم به فائدة الكلام»؛ «والخبر: هو الاسم المسند إلى المبتدأ، مثال المبتدأ والخبر: (زيد قائم)، فزيد: مبتدأ، وقائم: خبر».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-465", "question": "متى يجوز ألا يطابق الخبر المبتدأ في التذكير والتأنيث؟", "choices": ["إذا كان المبتدأ جمع مذكر سالمًا", "إذا كان المبتدأ مفردًا مؤنثًا", "إذا كان المبتدأ جمعًا لغير عاقل؛ فإن خبره يجوز أن يكون مفردًا مؤنثًا", "إذا كان المبتدأ مثنى مذكرًا"], "answer": "إذا كان المبتدأ جمعًا لغير عاقل؛ فإن خبره يجوز أن يكون مفردًا مؤنثًا", "answerIndex": 2, "explanation": "«أن الخبر مطابق للمبتدأ في الإفراد والتثنية والجمع، تذكيرًا وتأنيثًا إلا إذا كان المبتدأ جمعًا لغير عاقل؛ فإن خبره يجوز أن يكون مفردًا مؤنثًا»؛ ومثاله من الكتاب: «الشوارع نظيفة، النوافذ مفتوحة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-466", "question": "ما إعراب «حسب» في قولنا: «بحسبك حديث الآن»؟", "choices": ["خبر مرفوع بضمة مقدرة", "مبتدأ مرفوع بضمة مقدرة", "اسم مجرور بالباء", "فاعل مرفوع بضمة مقدرة"], "answer": "مبتدأ مرفوع بضمة مقدرة", "answerIndex": 1, "explanation": "«قد يأتي المبتدأ مسبوقًا بعامل لفظي زائد، نحو: «بحسبك حديث الآن»»؛ «فلا يخرج عن كونه مبتدأ؛ لأن العامل الزائد لا يعتد به، فكل من «حسب»، و«خالق»: مبتدأ مرفوع بضمة مقدرة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-467", "question": "ما نوع الخبر في قولنا: «الزهرة أوراقها ناضرة»؟", "choices": ["جملة اسمية", "خبر مفرد", "جملة فعلية", "جار ومجرور"], "answer": "جملة اسمية", "answerIndex": 0, "explanation": "من أمثلة الكتاب: «جملة اسمية: الزهرة أوراقها ناضرة، الطلاب مستقبلهم زاهر»؛ «ويشترط في جملة الخبر (اسمية أو فعلية) أن تشتمل على ضمير يربطها بالمبتدأ ويعود عليه».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-468", "question": "ما الرابط بين المبتدأ الأول وخبره في قولنا: «زيد أبوه قائم»؟", "choices": ["الهاء من «أبوه»", "الضمير المستتر في «قائم»", "لا رابط بينهما", "كلمة «أبوه» كلها"], "answer": "الهاء من «أبوه»", "answerIndex": 0, "explanation": "«الأول: الجملة الاسمية، نحو: (زيد أبوه قائم)، فـ(زيد) مبتدأ أول، و(أبوه) مبتدأ ثان، و(قائم) خبر المبتدأ الثاني، والمبتدأ الثاني وخبره خبر المبتدأ الأول، وهو (زيد)، والرابط بين المبتدأ الأول وخبره الهاء من «أبوه»».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-469", "question": "ما عمل «كان وأخواتها»؟", "choices": ["ترفع المبتدأ وتجعله اسمًا لها، وتنصب الخبر وتجعله خبرًا لها", "تنصب المبتدأ والخبر على أنهما مفعولان لها", "ترفع المبتدأ والخبر معًا", "تنصب المبتدأ وتجعله اسمًا لها، وترفع الخبر وتجعله خبرًا لها"], "answer": "ترفع المبتدأ وتجعله اسمًا لها، وتنصب الخبر وتجعله خبرًا لها", "answerIndex": 0, "explanation": "«أن كان وأخواتها أفعال ماضية، تدخل على المبتدأ والخبر، فترفع المبتدأ، وتجعله اسمًا لها، وتنصب الخبر وتجعله خبرًا لها، وهي ناسخة؛ لأنها غيرت حكم المبتدأ والخبر، وناقصة؛ لأنها لا تكتفي بالمرفوع».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-470", "question": "كم فعلًا «كان وأخواتها» عند صاحب الأزهرية؟", "choices": ["ثمانية أفعال", "ثلاثة عشر فعلًا", "أربعة عشر فعلًا", "ستة أفعال"], "answer": "ثلاثة عشر فعلًا", "answerIndex": 1, "explanation": "«وهي ثلاثة عشر فعلًا: كان، وأمسى، وأصبح، وأضحى، وظل، وبات، وصار، وليس، وما زال، وما فتئ، وما انفك، وما دام، وما برح».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-471", "question": "ما الأفعال التي تعمل بشرط تقدم نفي أو شبهه؟", "choices": ["ظل، وبات، وصار، وليس", "زال، وانفك، وفتئ، وبرح", "دام وحدها", "كان، وأمسى، وأصبح، وأضحى"], "answer": "زال، وانفك، وفتئ، وبرح", "answerIndex": 1, "explanation": "«(ب) ما يعمل بشرط تقدم نفي أو شبهه، وهي: (زال - انفك - فتئ - برح)»؛ ومن شواهد عمل مضارعها: ﴿لن نبرح عليه عاكفين﴾ [طه 91].", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-472", "question": "ما الأفعال التي تتصرف تصرفًا كاملًا فيأتي منها المضارع والأمر؟", "choices": ["ليس، ودام", "كان، وأمسى، وأصبح فقط", "كان، وأمسى، وأصبح، وأضحى، وظل، وبات، وصار", "زال، وانفك، وفتئ، وبرح"], "answer": "كان، وأمسى، وأصبح، وأضحى، وظل، وبات، وصار", "answerIndex": 2, "explanation": "«(أ) ما يتصرف تصرفًا كاملًا؛ فيأتي منه المضارع والأمر، وهو سبعة أفعال: (كان - أمسى - أصبح - أضحى - ظل - بات - صار)»؛ أما «زال - انفك - فتئ - برح» فتصرفها ناقص، و«ليس - دام» جامدان.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-473", "question": "ما الفعلان الجامدان الملازمان للماضي من «كان وأخواتها»؟", "choices": ["ليس، ودام", "ظل، وبات", "كان، وأصبح", "زال، وانفك"], "answer": "ليس، ودام", "answerIndex": 0, "explanation": "«(ج) ما لا يتصرف أبدًا، فهو جامد ملازم للماضي، وهو فعلان: (ليس - دام)»؛ «(ج) ما لا يتصرف أصلًا وهو جامد؛ لأنه ملازم للماضي، وهو: (ليس - دام)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-474", "question": "ما إعراب «أحكم» في قوله تعالى: ﴿أليس الله بأحكم الحاكمين﴾؟", "choices": ["خبر ليس منصوب، وعلامة نصبه الفتحة المقدرة", "مفعول به منصوب، وعلامة نصبه الفتحة الظاهرة", "اسم ليس مرفوع، وعلامة رفعه الضمة الظاهرة", "نعت مجرور، وعلامة جره الكسرة الظاهرة"], "answer": "خبر ليس منصوب، وعلامة نصبه الفتحة المقدرة", "answerIndex": 0, "explanation": "«خبر ليس منصوب وعلامة نصبه الفتحة المقدرة منع من ظهورها حركة حرف الجر الزائد»؛ و«ليس» في الآية «فعل ماض جامد ناسخ مبني على الفتح».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-475", "question": "ما أقسام «كاد وأخواتها» من حيث المعنى؟", "choices": ["أفعال الشروع، وأفعال النفي، وأفعال التوكيد", "أفعال المقاربة، وأفعال الرجاء، وأفعال الشروع", "أفعال المقاربة، وأفعال التمني، وأفعال الترجي", "أفعال التوكيد، وأفعال التشبيه، وأفعال الاستدراك"], "answer": "أفعال المقاربة، وأفعال الرجاء، وأفعال الشروع", "answerIndex": 1, "explanation": "«أن هذه الأفعال من حيث المعنى ثلاثة أقسام: (أ) أفعال المقاربة: وتدل على قرب وقوع الخبر. (ب) أفعال الرجاء: وتدل على الرغبة في الخبر المحبوب. (ج) أفعال الشروع: وتدل على بدء وقوع الخبر».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-476", "question": "ما أفعال المقاربة؟", "choices": ["ظن، وحسب، وزعم، وخال", "أنشأ، وطفق، وعلق، وجعل", "كاد، وكرب، وأوشك", "حرى، واخلولق، وعسى"], "answer": "كاد، وكرب، وأوشك", "answerIndex": 2, "explanation": "«ما وضع للدلالة على قرب الخبر، وهو ثلاثة: كاد، وكرب، وأوشك»؛ ومثالها من الكتاب: «كادت الشمس تشرق» و«كرب الشتاء ينقضي» و«أوشك الغمام أن ينقشع».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-477", "question": "ما حكم اقتران خبر «عسى وأوشك» بـ«أن»؟", "choices": ["يقل اقترانه بأن", "يمتنع اقترانه بأن", "يجب اقترانه بأن", "يغلب اقترانه بأن"], "answer": "يغلب اقترانه بأن", "answerIndex": 3, "explanation": "«يغلب اقترانه بأن مع «عسى وأوشك»»؛ أما «كاد وكرب» فيقل، و«حرى واخلولق» فيجب، وأفعال الشروع فيمتنع.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-478", "question": "ما حكم اقتران خبر «حرى واخلولق» بـ«أن»؟", "choices": ["يغلب اقترانه بأن", "يقل اقترانه بأن", "يمتنع اقترانه بأن", "يجب اقترانه بأن"], "answer": "يجب اقترانه بأن", "answerIndex": 3, "explanation": "«ويجب اقترانه بأن مع «حرى واخلولق»»؛ ومثالاهما من الكتاب: «حرّى الهواء أن يعتدل» و«اخلولقت السماء أن تمطر».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-479", "question": "ما إعراب «يكاد» في قوله تعالى: ﴿يكاد زيتها يضيء﴾؟", "choices": ["حرف توكيد ونصب مبني على الفتح", "فعل ماض ناقص ناسخ مبني على الفتح", "فعل مضارع تام مرفوع", "فعل مضارع ناقص ناسخ مرفوع"], "answer": "فعل مضارع ناقص ناسخ مرفوع", "answerIndex": 3, "explanation": "«فعل مضارع ناقص ناسخ مرفوع؛ لتجرده من الناصب والجازم، وعلامة رفعه الضمة الظاهرة»؛ واسم «يكاد» مرفوع، وجملة «يضيء» في محل نصب خبر «يكاد».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-480", "question": "ما عمل «ما» الحجازية؟", "choices": ["ترفع المبتدأ والخبر معًا", "تنصب المبتدأ وترفع الخبر", "تنصب المبتدأ والخبر على أنهما مفعولان", "ترفع المبتدأ وتنصب الخبر"], "answer": "ترفع المبتدأ وتنصب الخبر", "answerIndex": 3, "explanation": "«أن «ما» الحجازية تدخل على المبتدأ والخبر، فترفع المبتدأ، وتنصب الخبر، ويصير المبتدأ اسمها، والخبر خبرها، فهي حرف نفي ناسخ يعمل عمل «ليس» في لغة أهل الحجاز».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-481", "question": "في أي لغة تعمل «ما» عمل «ليس»؟", "choices": ["في لغة أهل الحجاز", "في لغة تميم", "في لغة قريش وحدها", "في كل لغات العرب"], "answer": "في لغة أهل الحجاز", "answerIndex": 0, "explanation": "«فهي حرف نفي ناسخ يعمل عمل «ليس» في لغة أهل الحجاز»؛ «أما في لغة تميم فلا تعمل شيئًا؛ ولذلك تسمى ما الناسخة (الحجازية)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-482", "question": "ما شروط إعمال «ما» عمل «ليس»؟", "choices": ["أن يكون اسمها معرفة، وأن يكون خبرها معرفة", "ألا يقترن اسمها بـ«إن» الزائدة، وألا ينتقض نفي خبرها بـ«إلا»، وألا يتقدم خبرها على اسمها", "أن تقترن بـ«إن» الزائدة، وأن يكون خبرها جملة", "أن يتقدم خبرها على اسمها، وأن ينتقض نفيها بـ«إلا»"], "answer": "ألا يقترن اسمها بـ«إن» الزائدة، وألا ينتقض نفي خبرها بـ«إلا»، وألا يتقدم خبرها على اسمها", "answerIndex": 1, "explanation": "«أنه يشترط لعمل «ما» عمل «ليس»: ألا يقترن اسمها بـ«إن» الزائدة. وألا ينتقض نفي خبرها بـ«إلا». وألا يتقدم خبرها على اسمها»؛ فإذا تخلف شرط منها «أهملت ولم تعمل شيئًا في المبتدأ أو الخبر».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-483", "question": "ما حكم «ما» إذا اقترن اسمها بـ«إن» الزائدة؟", "choices": ["تعمل عمل «ليس» كما هي", "تصير حرف جر", "تهمل ولا تعمل شيئًا في المبتدأ والخبر", "تنصب المبتدأ وترفع الخبر"], "answer": "تهمل ولا تعمل شيئًا في المبتدأ والخبر", "answerIndex": 2, "explanation": "«فإن تخلف شرط من هذه الشروط الثلاثة، فاقترن اسمها بـ«إن» الزائدة، أو انتقض نفي خبرها بـ(إلا)، أو تقدم خبرها على اسمها، أهملت ولم تعمل شيئًا في المبتدأ أو الخبر»؛ ومثاله من الكتاب: «ما إن الشارع مزدحمٌ» فالشارع مبتدأ والمزدحم خبره.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-484", "question": "ما إعراب «بشرًا» في قوله تعالى: ﴿ما هذا بشرا﴾؟", "choices": ["نعت منصوب، وعلامة نصبه الفتحة الظاهرة", "مفعول به منصوب، وعلامة نصبه الفتحة الظاهرة", "خبر (ما) منصوب، وعلامة نصبه الفتحة الظاهرة", "اسم (ما) مرفوع، وعلامة رفعه الضمة الظاهرة"], "answer": "خبر (ما) منصوب، وعلامة نصبه الفتحة الظاهرة", "answerIndex": 2, "explanation": "«خبر (ما) منصوب، وعلامة نصبه الفتحة الظاهرة»؛ و«ما» في الآية «نافية تعمل عمل ليس في لغة أهل الحجاز، وهي مبنية على السكون»، و«هذا» اسم إشارة «في محل رفع اسم «ما»».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-485", "question": "كم حرفًا «إن وأخواتها»؟", "choices": ["أربعة أحرف", "ستة أحرف", "ثلاثة عشر فعلًا", "سبعة أحرف"], "answer": "ستة أحرف", "answerIndex": 1, "explanation": "«الأحرف الناسخة ستة، وهي: «إنَّ، وأنَّ، وكأنَّ، ولكنَّ، وليتَ، ولعلَّ»».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-486", "question": "ما عمل «إن وأخواتها»؟", "choices": ["ترفع المبتدأ وتجعله اسمًا لها، وتنصب الخبر وتجعله خبرًا لها", "تنصب المبتدأ والخبر على أنهما مفعولان لها", "تنصب المبتدأ وتجعله اسمًا لها، وترفع الخبر وتجعله خبرًا لها", "ترفع المبتدأ والخبر معًا"], "answer": "تنصب المبتدأ وتجعله اسمًا لها، وترفع الخبر وتجعله خبرًا لها", "answerIndex": 2, "explanation": "«وأن هذه الأحرف الستة تدخل على المبتدأ والخبر؛ فتنصب المبتدأ وتجعله اسمها، وترفع الخبر وتجعله خبرها، فهي ناسخة»؛ ومن أمثلتها: ﴿إن الإنسان لفي خسر﴾ [العصر 2].", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-487", "question": "ما الفرق بين «إنَّ» المكسورة و«أنَّ» المفتوحة؟", "choices": ["لا فرق بينهما في المعنى والعمل", "المكسورة للتشبيه، والمفتوحة للتمني", "المكسورة تكون في أول الكلام، وأما المفتوحة فلابد أن يسبقها كلام", "المكسورة تنصب المبتدأ، والمفتوحة ترفعه"], "answer": "المكسورة تكون في أول الكلام، وأما المفتوحة فلابد أن يسبقها كلام", "answerIndex": 2, "explanation": "«والفرق بين (إنَّ) المكسورة، و(أنَّ) المفتوحة، أن المكسورة تكون في أول الكلام، وأما المفتوحة فلابد أن يسبقها كلام»؛ وكلتاهما «تفيدان التوكيد، وهو تقوية إثبات الخبر للمبتدأ».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-488", "question": "ما معنى «لكنَّ»؟", "choices": ["التمني", "الاستدراك", "التشبيه", "التوكيد"], "answer": "الاستدراك", "answerIndex": 1, "explanation": "«و(لكنَّ) تفيد الاستدراك، وهو نفي ما يتوهم ثبوته، أو إثبات ما يتوهم نفيه بسبب كلام سابق»؛ ومثالها من الكتاب: «الشمس مشرقة لكنَّ الجوَّ باردٌ».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-489", "question": "ما معنى «ليتَ»؟", "choices": ["التمني", "التشبيه", "الترجي", "التوكيد"], "answer": "التمني", "answerIndex": 0, "explanation": "«و(ليتَ) تفيد التمني، وهو طلب الأمر المحبوب البعيد الحصول لاستحالته أو عسره»؛ ومثالها من الكتاب: «ليتَ الشبابَ دائمٌ».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-490", "question": "ما إعراب «ربهم» في قوله تعالى: ﴿إن ربهم بهم يومئذ لخبير﴾؟", "choices": ["مبتدأ مرفوع، وعلامة رفعه الضمة الظاهرة", "خبر إن مرفوع، وعلامة رفعه الضمة الظاهرة", "اسم إن منصوب، وعلامة نصبه الفتحة الظاهرة", "فاعل مرفوع، وعلامة رفعه الضمة الظاهرة"], "answer": "اسم إن منصوب، وعلامة نصبه الفتحة الظاهرة", "answerIndex": 2, "explanation": "«اسم إن منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف»؛ و«هم» ضمير مبني على السكون في محل جر مضاف إليه؛ و«إنَّ» في الآية «حرف توكيد ونصب، مبني على الفتح».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-491", "question": "متى تكون «لا» نافية للجنس؟", "choices": ["إذا جاء بعدها اسم معرفة", "إذا دخلت على اسم معرفة وخبر معرفة", "إذا دخلت على فعل مضارع فقط", "إذا دخلت على اسمين نكرتين الأول اسمها والثاني خبرها"], "answer": "إذا دخلت على اسمين نكرتين الأول اسمها والثاني خبرها", "answerIndex": 3, "explanation": "«أن «لا» تكون نافية للجنس: إذا دخلت على اسمين نكرتين الأول اسمها والثاني خبرها».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-492", "question": "ما حكم اسم «لا» النافية للجنس إذا كان مفردًا؟", "choices": ["يبنى على ما ينصب به", "يرفع دائمًا", "ينصب دائمًا", "يجر دائمًا"], "answer": "يبنى على ما ينصب به", "answerIndex": 0, "explanation": "«أن اسم «لا» النافية للجنس: يبنى على ما ينصب به إذا كان مفردًا، وهو ما ليس مضافًا، ولا شبيهًا بالمضاف»؛ فـ«لا مجتهدَ نادمٌ» مبني على الفتح، و«لا مهملينِ ناجحانِ» مبني على الياء.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-493", "question": "ما حكم اسم «لا» النافية للجنس إذا كان مضافًا أو شبيهًا بالمضاف؟", "choices": ["يرفع", "يجر", "يبنى على ما ينصب به", "ينصب"], "answer": "ينصب", "answerIndex": 3, "explanation": "«وينصب إذا كان مضافًا أو شبيهًا بالمضاف، والشبيه بالمضاف هو ما اتصل به شيء من تمام معناه، والمتمم له مرفوع أو منصوب أو مخفوض»؛ ومثاله: «لا كتابَ مجتهدٍ ضائعٌ» و«لا كريمًا خلقُه مكروهٌ».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-494", "question": "ما شروط عمل «لا» النافية للجنس؟", "choices": ["أن يتقدم خبرها على اسمها، وأن تكون نافية للوحدة", "أن يكون اسمها نكرة، وأن يكون خبرها نكرة، وألا يتقدم خبرها على اسمها، وأن تكون نافية للجنس وليس للوحدة", "أن يكون اسمها مفردًا دائمًا، وأن يكون خبرها جملة", "أن يكون اسمها معرفة، وأن يكون خبرها معرفة"], "answer": "أن يكون اسمها نكرة، وأن يكون خبرها نكرة، وألا يتقدم خبرها على اسمها، وأن تكون نافية للجنس وليس للوحدة", "answerIndex": 1, "explanation": "«أن شروط عمل «لا» النافية للجنس: 1- أن يكون اسمها نكرة، فإن جاء بعدها معرفة وجب إهمالها وتكرارها، نحو: لا سعيد مجتهد، ولا خالد. 2- أن يكون خبرها نكرة، مثل: لا ناجح كسول. 3- ألا يتقدم خبرها على اسمها، فإن تقدم الخبر على الاسم وجب إهمالها، نحو: ﴿لا فيها غول﴾ [الصافات 47]. 4- أن تكون نافية للجنس وليس للوحدة، مثل: لا رجل في الدار بل رجلان».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-495", "question": "ما إعراب «ضرر» في حديث «لا ضرر ولا ضرار»؟", "choices": ["فاعل مرفوع، وعلامة رفعه الضمة الظاهرة", "خبر «لا» مرفوع، وعلامة رفعه الضمة الظاهرة", "مبتدأ مرفوع، وعلامة رفعه الضمة الظاهرة", "اسم «لا» مبني على الفتح في محل نصب"], "answer": "اسم «لا» مبني على الفتح في محل نصب", "answerIndex": 3, "explanation": "«اسم «لا» مبني على الفتح في محل نصب»؛ «خبر «لا» محذوف، وتقديره: «لا ضرر موجود»».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-496", "question": "ما عمل «ظن وأخواتها»؟", "choices": ["ترفع المبتدأ وتنصب الخبر", "تنصب المبتدأ وترفع الخبر", "ترفع المبتدأ والخبر معًا", "تنصب المبتدأ والخبر على أنهما مفعولان لها"], "answer": "تنصب المبتدأ والخبر على أنهما مفعولان لها", "answerIndex": 3, "explanation": "«أن ظن وأخواتها أفعال ناسخة تدخل على المبتدأ والخبر؛ فتنصبهما على أنهما مفعولان لها: المبتدأ مفعول أول، والخبر مفعول ثان».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-497", "question": "ما أفعال ترجيح حصول الخبر؟", "choices": ["حرى، واخلولق، وعسى", "علم، ورأى، ووجد", "كاد، وكرب، وأوشك", "ظن، وحسب، وزعم، وخال"], "answer": "ظن، وحسب، وزعم، وخال", "answerIndex": 3, "explanation": "«(أ) أفعال تفيد ترجيح حصول الخبر، وهي: (ظن، وحسب، وزعم، وخال)»؛ ومثالها من الكتاب: «ظننتُ الفرجَ قريبًا» و«حسبتُ العملَ شاقًا» و«زعمتُ الامتحانَ سهلًا» و«خلتُ محمدًا ناجحًا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-498", "question": "ما أفعال تيقن حصول الخبر؟", "choices": ["علم، ورأى، ووجد", "أنشأ، وطفق، وعلق، وجعل", "كان، وأمسى، وأصبح، وأضحى", "ظن، وحسب، وزعم، وخال"], "answer": "علم، ورأى، ووجد", "answerIndex": 0, "explanation": "«(ب) أفعال تفيد تيقن حصول الخبر، وهي: (علم، ورأى، ووجد)»؛ ومثالها من الكتاب: «علمتُ الصديقَ وفيًا» و«رأيتُ الحياةَ كفاحًا» و«وجدتُ محمدًا أمينًا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-499", "question": "ما إعراب «الفرجَ» في قولنا: «ظننتُ الفرجَ قريبًا»؟", "choices": ["فاعل مرفوع", "اسم «ظن» مرفوع", "مفعول ثان منصوب", "مفعول أول منصوب"], "answer": "مفعول أول منصوب", "answerIndex": 3, "explanation": "«أنَّ هذه الكلمات: (ظنَّ، وحسبَ، وزعمَ، وخالَ، وعلمَ، ورأى، ووجدَ) أفعال ماضية دخلت على المبتدأ والخبر، فنصبت المبتدأ وجعلته مفعولًا أولًا لها، ونصبت الخبر أيضًا، وجعلته مفعولًا ثانيًا لها»؛ فـ«الفرجَ» مفعول أول، و«قريبًا» مفعول ثان.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "النحو", "id": "h26-g8-500", "question": "هل يعمل المضارع والأمر من «ظن وأخواتها» عمل الماضي؟", "choices": ["يعمل المضارع ولا يعمل الأمر", "نعم، يعمل المضارع والأمر عمل الماضي", "يعمل الأمر ولا يعمل المضارع", "لا، لا يعملان إلا في الماضي فقط"], "answer": "نعم، يعمل المضارع والأمر عمل الماضي", "answerIndex": 1, "explanation": "«التنبيه الأول: المضارع والأمر من هذه الأفعال يعمل عمل الماضي، تقول في المضارع: (أظن الجو صحوًا، وأحسب الفرج قريبًا، وأحسب الامتحان سهلًا)، وهكذا، وتقول في الأمر: ظن العمل شاقًا، وهكذا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-501", "question": "ما تعريف «الصرف» لغة؟", "choices": ["الجمع والتثنية", "الإعراب والبناء", "التغيير والتحويل", "الثبات والاستقرار"], "answer": "التغيير والتحويل", "answerIndex": 2, "explanation": "«الصرف: ويقال له التصريف، لغة: التغيير والتحويل»؛ ومنه قوله تعالى: ﴿وَتَصْرِيفِ الرِّيَاحِ﴾ [الجاثية: 5].", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-502", "question": "ما تعريف «الصرف» في الاصطلاح؟", "choices": ["ثبات الكلمة على صورة واحدة", "تغيير في إعراب الكلمة وآخرها فقط", "تغيير حروف الكلمة دون معناها", "تغيير في بنية الكلمة وأصولها ينتج عنه تغيير في الصيغة والمعنى"], "answer": "تغيير في بنية الكلمة وأصولها ينتج عنه تغيير في الصيغة والمعنى", "answerIndex": 3, "explanation": "«وفي الاصطلاح: تغيير في بنية الكلمة وأصولها ينتج عنه تغيير في الصيغة والمعنى».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-503", "question": "ما أولى ثمرات علم الصرف؟", "choices": ["صون اللسان عن الخطأ في صوغ المفردات", "حفظ القرآن الكريم", "صون اللسان عن الخطأ في الإعراب", "تعلم الخط العربي"], "answer": "صون اللسان عن الخطأ في صوغ المفردات", "answerIndex": 0, "explanation": "«ثمرة علم الصرف: 1- صون اللسان عن الخطأ في صوغ المفردات. 2- مراعاة ضوابط اللغة في الكتابة. 3- معرفة الحرف الزائد والحرف الأصلي في الكلمة. 4- تنويع الصيغ والأساليب التي تُعين الخطباء والكُتَّاب والشعراء وغيرهم في توضيح ما يقصدون إليه من المعاني».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-504", "question": "ما موضوع علم الصرف؟", "choices": ["الأسماء المعربة والأفعال المتصرفة", "الأفعال الجامدة والحروف", "الأسماء المبنية والأفعال الجامدة", "الحروف والأسماء المبنية"], "answer": "الأسماء المعربة والأفعال المتصرفة", "answerIndex": 0, "explanation": "«لا يدخل الصرف إلا الأسماء المُعربة، والأفعال المتصرفة؛ لأن الصرف تغيير وتحويل فلا يدخل إلا على ما يقبل التغيير».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-505", "question": "من أول من أفرد مسائل علم الصرف بالبحث والتأليف؟", "choices": ["الخليل بن أحمد الفراهيدي", "معاذ بن مسلم الهراء", "ابن مالك", "سيبويه"], "answer": "معاذ بن مسلم الهراء", "answerIndex": 1, "explanation": "«ثم أُفردت مسائل الصرف بالبحث والتأليف على يد معاذ بن مسلم الهرَّاء».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-506", "question": "ما تعريف «الحرف الأصلي»؟", "choices": ["ما يسقط من بعض تصاريف الكلمة", "ما لا يظهر إلا في صيغة واحدة", "ما يزيد على أصول الكلمة ويصح حذفه دون علة", "ما يبقى في كل تصاريف الكلمة ولا يُحذف في واحد منها إلا لعلة تصريفية"], "answer": "ما يبقى في كل تصاريف الكلمة ولا يُحذف في واحد منها إلا لعلة تصريفية", "answerIndex": 3, "explanation": "«1- الحرف الأصلي: هو ما يبقى في كل تصاريف الكلمة ولا يُحذف في واحد منها إلا لعلة تصريفية كـ(العين واللام والميم) في (عِلْم)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-507", "question": "ما تعريف «الحرف الزائد»؟", "choices": ["ما لا يسقط أبدًا من الكلمة", "ما يبقى في كل تصاريف الكلمة", "ما يزيد على أصول الكلمة، ويصح حذفه في بعض تصاريفها دون علة تصريفية", "ما يلزم صورة واحدة لا تتغير"], "answer": "ما يزيد على أصول الكلمة، ويصح حذفه في بعض تصاريفها دون علة تصريفية", "answerIndex": 2, "explanation": "«2- الحرف الزائد: هو ما يزيد على أصول الكلمة، ويصح حذفه في بعض تصاريفها دون علة تصريفية كالألف في (عالم)، والميم والواو في (معلوم)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-508", "question": "ما أصل كلمة (أب)؟", "choices": ["أبو", "أبي", "أبا", "أب"], "answer": "أبو", "answerIndex": 0, "explanation": "«وبتأمل المثال الثالث نلاحظ أن (أب) أصلها: (أبو)، و(يد) أصلها: (يدي) وقد حذفت الواو والياء منهما من غير علَّة صرفية، وهذا قليل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-509", "question": "ما أصل الفعل (يقف)؟", "choices": ["يقف", "وقف", "أوقف", "يوقف"], "answer": "يوقف", "answerIndex": 3, "explanation": "«وبالنظر في المثال الثاني نلاحظ أن الفعل (يقف) أصله (يَوْقُف) وحذف منه الواو وهو حرف أصلي وهذا الحذف لعلة صرفية».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-510", "question": "ما نوعا الزيادة؟", "choices": ["زيادة حرف من أصول الكلمة، وتكرير حرف زائد", "تكرير حرف زائد، وحذف حرف أصلي", "تكرير حرف من أصول الكلمة، وزيادة حرف من حروف (سألتمونيها)", "حذف حرف من الأصول، وزيادة حرف من الفروع"], "answer": "تكرير حرف من أصول الكلمة، وزيادة حرف من حروف (سألتمونيها)", "answerIndex": 2, "explanation": "«القاعدة: الزيادة نوعان: 1- ما كان بتكرير حرف من أصول الكلمة، مثل: (قَوْم بهلل، أي: عظم). 2- ما كان بزيادة حرف من حروف (سألتمونيها)، مثل: (أخبر اغتنم تطاول)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-511", "question": "في قوله تعالى: ﴿وَقَطَّعْنَاهُمُ اثْنَتَيْ عَشْرَةَ أَسْبَاطًا أُمَمًا﴾ [الأعراف: 160]، ما نوع الزيادة في كلمة (قطع)؟", "choices": ["لا زيادة فيها", "تكرير حرف من أصول الكلمة", "زيادة حرف من حروف (سألتمونيها)", "حذف حرف من أصول الكلمة"], "answer": "تكرير حرف من أصول الكلمة", "answerIndex": 1, "explanation": "«(قطَّع) وتتكون من أربعة أحرف هي: (ق ط ط ع)، وأصلها ثلاثة أحرف: (ق ط ع)؛ لذلك يُعد مزيدًا، حيث تكرر فيه أصل من أصول الكلمة بالتضعيف، وهو (الطاء) وسط الكلمة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-512", "question": "ما الأحرف الزائدة في الفعل (استغفر)؟", "choices": ["السين والتاء والألف", "الهمزة والسين والتاء", "الهمزة والنون", "الألف والتاء"], "answer": "الهمزة والسين والتاء", "answerIndex": 1, "explanation": "«(حاسب استغفر انطلق تنافسوا) يشتمل على أحرف زائدة، هي: الألف في (حاسب)، والهمزة والسين والتاء في (استغفر)، والهمزة والنون في (انطلق)، والتاء والألف في (تنافسوا)؛ لذلك يُعد مزيدًا، وهذه الأحرف الزائدة من حروف (سألتمونيها)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-513", "question": "كم عدد أشهر أدلة الزيادة؟", "choices": ["أربعة", "ستة", "خمسة", "ثلاثة"], "answer": "خمسة", "answerIndex": 2, "explanation": "«القاعدة: أشهر أدلة الزيادة: 1- سقوط الحرف من الأصل، كما في ألف (عالم) من (عِلْم). 2- سقوطه من فرعه كسقوط الألف من (كتاب)، والواو من (عمود) في الجمع (كُتُب أعمدة). 3- سقوط الحرف الزائد في بعض استعمالات الكلمة، مثل: (أيطل إطل) و(حنظل حظل). 4- عدم وجود النظير في الأوزان العربية، مثل: (قَرَنْفُل). 5- دلالة الحرف على معنى، كأحرف المضارعة التي تدل على التكلم أو الخطاب أو الغيبة، وألف اسم الفاعل التي تدل على الفاعل، والهمزة والسين والتاء التي تدل على الطلب».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-514", "question": "ما دليل زيادة الألف في كلمة (عالم)؟", "choices": ["دلالة الحرف على معنى", "عدم وجود النظير", "سقوط الحرف من الأصل", "سقوط الحرف من الفرع"], "answer": "سقوط الحرف من الأصل", "answerIndex": 2, "explanation": "«1- سقوط الحرف من الأصل، كما في ألف (عالم) من (عِلْم)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-515", "question": "ما دليل زيادة النون في كلمة (قرنفل)؟", "choices": ["سقوط الحرف من الفرع", "دلالة الحرف على معنى", "عدم وجود النظير في الأوزان العربية", "سقوط الحرف من الأصل"], "answer": "عدم وجود النظير في الأوزان العربية", "answerIndex": 2, "explanation": "«كلمة: (قَرَنْفُل) مزيدة بالنون ودليل زيادته عدم النظير؛ فلو أننا اعتبرنا النون أصلية لكانت الكلمة على وزن (فَعْلُل) وهو ليس من أوزان الخماسي المجرد».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-516", "question": "هل تُعد أحرف المضارعة من حروف الزيادة في هذا المحتوى؟", "choices": ["نعم، فهي من حروف الزيادة", "لا، فلا نعد أحرف المضارعة من حروف الزيادة في هذا المحتوى", "تُعد زائدة في الماضي فقط", "نعم، لأنها من حروف (سألتمونيها)"], "answer": "لا، فلا نعد أحرف المضارعة من حروف الزيادة في هذا المحتوى", "answerIndex": 1, "explanation": "«اختُلف في عَدِّ أحرف المضارعة من حروف الزيادة والراجح أنها من اللواحق التي أشبهت حروف الزيادة في شدة اتصالها بالكلمة وقوة ارتباطها بالصيغة، وعليه فلا نُعِدُّ أحرف المضارعة من حروف الزيادة في هذا المحتوى فوزن يضرب: يفعله، وهو ثلاثي مجرد».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-517", "question": "ما تعريف «المجرد»؟", "choices": ["ما كانت حروفه كلها أصلية لا تسقط إلا لعلة صرفية", "ما زيد فيه حرف أو أكثر على حروفه الأصلية", "ما كانت حروفه كلها زائدة", "ما لزم صورة واحدة لا تتغير"], "answer": "ما كانت حروفه كلها أصلية لا تسقط إلا لعلة صرفية", "answerIndex": 0, "explanation": "«1- المجرد: ما كانت حروفه كلها أصلية لا تسقط إلا لعلة صرفية».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-518", "question": "ما تعريف «المزيد»؟", "choices": ["ما زيد فيه حرف أو أكثر على حروفه الأصلية", "ما كانت حروفه كلها أصلية", "ما حذف منه حرف من أصوله", "ما لزم صورة واحدة"], "answer": "ما زيد فيه حرف أو أكثر على حروفه الأصلية", "answerIndex": 0, "explanation": "«2- المزيد: ما زيد فيه حرف أو أكثر على حروفه الأصلية، مثل: (أخرج اعتمد استقام اقشعر)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-519", "question": "أي فعل مما يأتي مجرد رباعي؟", "choices": ["سلسل", "تنافس", "أعطى", "انضم"], "answer": "سلسل", "answerIndex": 0, "explanation": "«والفعل: (سلسل)، يتكون من أربعة أحرف ليس بينها حرف زائد؛ لذا فهو مجرد رباعي».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-520", "question": "أي فعل مما يأتي مزيد رباعي؟", "choices": ["حث", "اطمأن", "سلسل", "سمع"], "answer": "اطمأن", "answerIndex": 1, "explanation": "«أما الفعل: (اطمأن)، فأصله: (طمان)، وزيد فيه حرفان هما الهمزة وتضعيف النون؛ لذا فهو رباعي مزيد».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-521", "question": "كم وزنًا للفعل الماضي الثلاثي المجرد؟", "choices": ["أربعة أوزان", "ثلاثة أوزان", "ستة أوزان", "وزنان"], "answer": "ثلاثة أوزان", "answerIndex": 1, "explanation": "«وعليه فالفعل الماضي الثلاثي المجرد له ثلاثة أوزان: 1- (فَعَل) بفتح الفاء والعين، ويأتي مضارعه على: (أ) (يَفْعُل) بضم العين، مثل: نَصَرَ يَنْصُر، جال يجول. (ب) (يَفْعِل) بكسر العين، مثل: ضَرَبَ يَضْرِب، باع يبيع. (ج) (يَفْعَل) بفتح العين، مثل: فَتَحَ يَفْتَح، ذهب يذهب. 2- (فَعِل) بفتح الفاء وكسر العين، ويأتي مضارعه على: (أ) (يَفْعَل) بفتح العين، مثل: فرح يفرح، ظل يظل. (ب) (يَفْعِل) بكسر العين، مثل: حَسِبَ يَحْسِب، ورث يرث. 3- (فَعُل) بفتح الفاء وضم العين، ويأتي مضارعه على: يَفْعُل، مثل: شَرُفَ يَشْرُف، كَرُمَ يَكْرُم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-522", "question": "ما مضارع الفعل (ضرب)؟", "choices": ["يفتح", "يفرح", "يضرب", "ينصر"], "answer": "يضرب", "answerIndex": 2, "explanation": "«(ب) (يَفْعِل) بكسر العين، مثل: ضَرَبَ يَضْرِب، باع يبيع».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-523", "question": "كم بابًا للفعل الثلاثي المجرد مع مضارعه؟", "choices": ["ستة أبواب", "خمسة أبواب", "ثلاثة أبواب", "أربعة أبواب"], "answer": "ستة أبواب", "answerIndex": 0, "explanation": "«القاعدة: الفعل الثلاثي المجرد له مع مضارعه ستة أبواب: 1- فإن كان مفتوح العين له مع مضارعه ثلاث صور: ضم العين، وكسرها، وفتحها. 2- وإن كان مكسور العين له مع مضارعه صورتان: فتح العين وكسرها. 3- وإن كان مضموم العين لا يأتي منه إلا مضارع واحد مضموم العين».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-524", "question": "ما مضارع الفعل (فرح)؟", "choices": ["يفرح", "يشرف", "يحسب", "يضرب"], "answer": "يفرح", "answerIndex": 0, "explanation": "«(أ) (يَفْعَل) بفتح العين، مثل: فرح يفرح، ظل يظل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-525", "question": "ما مضارع الفعل (كرم)؟", "choices": ["يضرب", "يكرم", "يحسب", "يفرح"], "answer": "يكرم", "answerIndex": 1, "explanation": "«3- (فَعُل) بفتح الفاء وضم العين، ويأتي مضارعه على: يَفْعُل، مثل: شَرُفَ يَشْرُف، كَرُمَ يَكْرُم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-526", "question": "الفعل الناقص اليائي مفتوح العين من أي باب؟", "choices": ["باب (فرح يفرح)", "باب (فتح يفتح)", "باب (ضرب يضرب)", "باب (نصر ينصر)"], "answer": "باب (ضرب يضرب)", "answerIndex": 2, "explanation": "«(أ) إذا كان ناقصًا يائيًا أو أجوف يائيًا؛ فهو من باب: (ضَرَبَ يَضْرِب) مكسور العين في المضارع. مثال الناقص: (قضى يقضي)، ومثال الأجوف: (سار يسير)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-527", "question": "الفعل الناقص الواوي مفتوح العين من أي باب؟", "choices": ["باب (فتح يفتح)", "باب (كرم يكرم)", "باب (ضرب يضرب)", "باب (نصر ينصر)"], "answer": "باب (نصر ينصر)", "answerIndex": 3, "explanation": "«(ب) إذا كان ناقصًا واويًا، أو أجوف واويًا؛ فهو من باب: (نَصَرَ يَنْصُر) مضموم العين في المضارع. مثال الناقص الواوي: (دنا يدنو)، ومثال الأجوف الواوي: (جار يجور)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-528", "question": "الفعل المضعف المتعدي مفتوح العين من أي باب؟", "choices": ["باب (ضرب يضرب)", "باب (فتح يفتح)", "باب (فرح يفرح)", "باب (نصر ينصر)"], "answer": "باب (نصر ينصر)", "answerIndex": 3, "explanation": "«(ج) أما إذا كان مضعفًا، فإن كان متعديًا؛ فهو من باب: (نَصَرَ يَنْصُر)، مثل: (مَدَّ يَمُدُّ)، وإن كان لازمًا؛ فهو من باب: (ضَرَبَ يَضْرِب)، مثل: (عَفَّ يَعِفُّ)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-529", "question": "ما أحرف الحلق؟", "choices": ["الفاء والقاف والكاف واللام والميم والنون", "الهمزة والباء والتاء والثاء والجيم والحاء", "السين والشين والصاد والضاد والطاء والظاء", "الهمزة والخاء والحاء والعين والغين والهاء"], "answer": "الهمزة والخاء والحاء والعين والغين والهاء", "answerIndex": 3, "explanation": "«وأحرف الحلق هي: (الهمزة الخاء الحاء العين الغين الهاء)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-530", "question": "على ماذا تدل أفعال باب (كرم)؟", "choices": ["الامتلاء والخلو", "الفرح والحزن والطرب", "الحركة والاضطراب", "الغرائز والطبائع التي تلازم صاحبها"], "answer": "الغرائز والطبائع التي تلازم صاحبها", "answerIndex": 3, "explanation": "«7- الأفعال التي من باب: (كرم) مضموم العين في المضارع لازمة، وتدل على الغرائز والطبائع التي تلازم صاحبها مثل: (طهر يطهر)، و(شرف يشرف)، أو ما يجري مجراها مثل: (عظم يعظم)، و(صغر يصغر)، و(فحش يفحش)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-531", "question": "كم وزنًا لمزيد الثلاثي بحرف؟", "choices": ["ثلاثة أوزان", "وزنان", "أربعة أوزان", "خمسة أوزان"], "answer": "ثلاثة أوزان", "answerIndex": 0, "explanation": "«القاعدة: لمزيد الثلاثي بحرف ثلاثة أوزان: (أَفْعَلَ فاعَلَ فَعَّلَ)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-532", "question": "ما وزن الفعل (أحسن)؟", "choices": ["فاعل", "أفعل", "انفعل", "فعل"], "answer": "أفعل", "answerIndex": 1, "explanation": "«فالأفعال: (أحسن أعطى أقام) في المثال الأول، وزنها: (أَفْعَل)، وكل منها مزيد بالهمزة في أوله قبل فاء الكلمة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-533", "question": "ما وزن الفعل (شارك)؟", "choices": ["أفعل", "تفاعل", "فاعل", "فعل"], "answer": "فاعل", "answerIndex": 2, "explanation": "«والفعلان (شارك نادى) في المثال الثاني، وزنهما: (فاعل) وكلاهما مزيد بالألف بعد فاء الكلمة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-534", "question": "كم وزنًا لمزيد الثلاثي بحرفين؟", "choices": ["ستة أوزان", "أربعة أوزان", "خمسة أوزان", "ثلاثة أوزان"], "answer": "خمسة أوزان", "answerIndex": 2, "explanation": "«القاعدة: لمزيد الثلاثي بحرفين خمسة أوزان: (انفعل افتعل افعل تفاعل تفعل)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-535", "question": "ما وزن الفعل (انطلق)؟", "choices": ["تفاعل", "انفعل", "افتعل", "افعل"], "answer": "انفعل", "answerIndex": 1, "explanation": "«فالأفعال: (انطلق انقاد انجلى)، في المثال الأول وزنها: (انفعل) زاد فيها حرفان هما همزة الوصل والنون قبل فاء الكلمة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-536", "question": "كم وزنًا للثلاثي المزيد بثلاثة أحرف؟", "choices": ["ثلاثة أوزان", "خمسة أوزان", "أربعة أوزان", "ستة أوزان"], "answer": "أربعة أوزان", "answerIndex": 2, "explanation": "«القاعدة: للثلاثي المزيد بثلاثة أحرف أربعة أوزان، هي: 1- اِسْتَفْعَلَ، مثل: (استظهر استعاذ استشرى). 2- اِفْعَوْعَلَ، مثل: (اخضوضر اعشوشب اخشوشن). 3- اِفْعَوَّلَ، مثل: (اجلوَّذ اعلوَّط). 4- اِفْعَالَّ، مثل: (احمارَّ اصفارَّ اخضارَّ)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-537", "question": "كم وزنًا للرباعي المجرد؟", "choices": ["أربعة أوزان", "ثلاثة أوزان", "وزن واحد", "وزنان"], "answer": "وزن واحد", "answerIndex": 2, "explanation": "«القاعدة: للرباعي المجرد وزن واحد، هو: (فَعْلَلَ)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-538", "question": "ما وزن الفعل (زلزل) في قوله تعالى: ﴿إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا﴾ [الزلزلة: 1]؟", "choices": ["افعلل", "فعلل", "تفعلل", "فعل"], "answer": "فعلل", "answerIndex": 1, "explanation": "«بتأمل ما تحته خط في المثالين السابقين نلاحظ أن الفعل: (زلزل) في الآية الكريمة، مكون من أربعة أحرف أصلية لا زيادة فيها، وفي المثال الثاني الفعل: (زخرف) يتكون من أربعة أحرف أصلية لا زيادة فيها، وهذا ما نسميه مجرد الرباعي، ووزنهما (فَعْلَلَ)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-539", "question": "ما وزن الرباعي المزيد بحرف؟", "choices": ["تفعلل", "افعنلل", "فعلل", "افعلل"], "answer": "تفعلل", "answerIndex": 0, "explanation": "«1- للرباعي المزيد بحرف وزن واحد، هو (تَفَعْلَلَ)، مثل: (تبعثر توسوس)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-540", "question": "كم وزنًا للرباعي المزيد بحرفين؟", "choices": ["ثلاثة أوزان", "وزن واحد", "وزنان", "أربعة أوزان"], "answer": "وزنان", "answerIndex": 2, "explanation": "«2- للرباعي المزيد بحرفين وزنان: (أ) اِفْعَلَلَّ، مثل: (اطمأنَّ اقشعرَّ اكفهرَّ). (ب) اِفْعَنْلَلَ، مثل: (احرنجم افرنقع)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-541", "question": "ما مادة «الميزان الصرفي»؟", "choices": ["ف ع ل ل ل", "ف ع ل ل", "س أ ل", "ف ع ل"], "answer": "ف ع ل", "answerIndex": 3, "explanation": "«واختار الصرفيون لهذا الميزان الصرفي مادة: (ف ع ل) الثلاثية: لأن أقل ما تتكون منه أبنية الأفعال والأسماء المعربة ثلاثة أحرف».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-542", "question": "ماذا يسمى الأصل الأول من أصول الكلمة؟", "choices": ["فاء الكلمة", "لام الكلمة", "عين الكلمة", "ميم الكلمة"], "answer": "فاء الكلمة", "answerIndex": 0, "explanation": "«وكل أصل من أصول الكلمة يأخذ اسمًا حسب مركزه فيها، فالأصل الأول يُسمى: (فاء الكلمة)، والأصل الثاني يُسمى: (عين الكلمة)، والأصل الثالث يُسمى: (لام الكلمة)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-543", "question": "ما وزن الاسم الخماسي المجرد (سفرجل)؟", "choices": ["فَعَل", "فَعْلَلَل", "فَعْلَل", "فَعَلَّل"], "answer": "فَعَلَّل", "answerIndex": 3, "explanation": "«لا يكون المجرد الخماسي إلا اسمًا، وتزاد له لامان على أحرف الميزان الثلاثة، وتُشكَّل فاء الكلمة وعينها واللام الأولى والثانية بشكل أحرف الموزون، ويُترك الحرف الأخير (لام الكلمة الثالثة) لحركة الإعراب أو البناء، مثل: (سَفَرْجَل) وزنه: (فَعَلَّل)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-544", "question": "ما وزن الفعل (قِ)؟", "choices": ["فَعِل", "عِ", "عِل", "فِع"], "answer": "عِ", "answerIndex": 1, "explanation": "«ما حذف منه أحد أصوله يُنظر إلى الحرف المحذوف من الكلمة الموزونة، ويُحذف الحرف المقابل له في الميزان، فنقول في وزن: (يعد): (يَعِل) بحذف فاء الكلمة، وفي وزن: (لم يسع): (لم يَفَع) بحذف لام الكلمة، وفي وزن: (قِ): (عِ) بحذف فاء الكلمة ولامها، وهكذا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-545", "question": "بماذا يُصاغ المضارع من الماضي؟", "choices": ["بزيادة همزة وصل في أول الفعل الماضي", "بحذف حرف من آخر الفعل الماضي", "بتضعيف عين الفعل الماضي", "بزيادة أحد أحرف المضارعة (أنيت) في أول الفعل الماضي"], "answer": "بزيادة أحد أحرف المضارعة (أنيت) في أول الفعل الماضي", "answerIndex": 3, "explanation": "«وبذلك يُمكن تحويل الماضي إلى مضارع بزيادة أحد أحرف المضارعة (أنيت) في أول الفعل الماضي».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-546", "question": "ما حكم حرف المضارعة مع الفعل الرباعي؟", "choices": ["يُفتح", "يُكسر", "يُسكن", "يُضم"], "answer": "يُضم", "answerIndex": 3, "explanation": "«1- يُصاغ المضارع من الماضي بزيادة أحد أحرف المضارعة مفتوحًا إلا مع الرباعي فإنه يُضم».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-547", "question": "كيف يُصاغ فعل الأمر من المضارع؟", "choices": ["بحذف آخر الفعل", "بزيادة حرف المضارعة في أوله", "بتضعيف عين الفعل", "بحذف حرف المضارعة من أوله"], "answer": "بحذف حرف المضارعة من أوله", "answerIndex": 3, "explanation": "«1- أن فعل الأمر يُصاغ من المضارع بحذف حرف المضارعة من أوله إذا كان أوله متحركًا، فتقول في (يقوم يتعلم يشارك): (قم تعلم شارك): فإن كان أول الباقي بعد حذف حرف المضارعة ساكنًا جئنا بهمزة الوصل مكسورة فتقول في (يسمع يستقيم يستغفر): (اسمع استقم استغفر): إلا في الأمر الثلاثي المضموم العين في المضارع فتكون همزة الوصل مضمومة، فتقول في (ينصر يدعو): (انصر ادع)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-548", "question": "ما تعريف «الفعل الجامد»؟", "choices": ["ما لزم صورة واحدة", "ما يجيء منه الماضي والمضارع والأمر", "ما يجيء منه الماضي والمضارع فقط", "ما لا يلزم صورة واحدة"], "answer": "ما لزم صورة واحدة", "answerIndex": 0, "explanation": "«ينقسم الفعل إلى جامد ومتصرف، فالجامد ما لزم صورة واحدة، والمتصرف ما لا يلزم صورة واحدة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-549", "question": "أي فعل مما يأتي جامد لازم صيغة الماضي؟", "choices": ["لعب", "وقف", "كتب", "ليس"], "answer": "ليس", "answerIndex": 3, "explanation": "«من الأفعال الجامدة ما لزم صيغة الماضي، مثل: (تبارك طالما قلما ليس مادام)، وكذلك: (عسى حرى اخلولق أنشأ أخذ)، من أفعال المقاربة، و(نعم بئس حبذا ساء)، وكل أفعال المدح والذم والاستثناء والتعجب».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "الصرف", "id": "h26-g8-550", "question": "ما «تام التصرف»؟", "choices": ["الفعل الذي يجيء منه المضارع والأمر ويتخلف الماضي", "الفعل الذي يجيء منه الماضي والمضارع والأمر", "الفعل الذي لزم صورة واحدة", "الفعل الذي يجيء منه الماضي والمضارع ويتخلف الأمر"], "answer": "الفعل الذي يجيء منه الماضي والمضارع والأمر", "answerIndex": 1, "explanation": "«(أ) تام التصرف: وهو الفعل الذي يجيء منه الماضي والمضارع والأمر، وهو أكثر الأفعال دورانًا في اللغة العربية، مثل: (كتب - لعب - وقف - سأل - صام - قال - قضى - سعى)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-551", "question": "ما تعريف «الإيمان» لغةً؟", "choices": ["الاقتناع والخضوع والقبول والتسليم القلبي", "الامتثال والإذعان الظاهري", "التصديق مطلقًا", "الخضوع والانقياد والاستسلام"], "answer": "التصديق مطلقًا", "answerIndex": 2, "explanation": "«الإيمان في اللغة: التصديق مطلقًا»؛ ومنه قوله تعالى: ﴿وَمَا أَنتَ بِمُؤْمِنٍ لَّنَا﴾ [يوسف: 17] أي: بمصدِّق.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-552", "question": "ما المراد بالتصديق في تعريف الإيمان اصطلاحًا؟", "choices": ["الخضوع والانقياد والاستسلام", "التصديق مطلقًا", "الامتثال والإذعان الظاهري", "الاقتناع والخضوع والقبول والتسليم القلبي"], "answer": "الاقتناع والخضوع والقبول والتسليم القلبي", "answerIndex": 3, "explanation": "«والمراد بالتصديق: الاقتناع والخضوع والقبول والتسليم القلبي لما جاء به النبي ﷺ من الدين واشتهر بين أهل الإسلام».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-553", "question": "ما تعريف «الإيمان» في الاصطلاح؟", "choices": ["التصديق القلبي بكل ما جاء به النبي ﷺ، وعُلِم من الدين بالضرورة", "الامتثال والإذعان الظاهري لكل ما جاء به النبي ﷺ", "التصديق مطلقًا", "الخضوع والانقياد والاستسلام"], "answer": "التصديق القلبي بكل ما جاء به النبي ﷺ، وعُلِم من الدين بالضرورة", "answerIndex": 0, "explanation": "«واصطلاحًا: التصديق القلبي بكل ما جاء به النبي ﷺ، وعُلِم من الدين بالضرورة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-554", "question": "ما محلُّ التصديق؟", "choices": ["القلب", "العقل", "اللسان", "الجوارح"], "answer": "القلب", "answerIndex": 0, "explanation": "«ومحلُّ التصديق القلب»؛ قال تعالى: ﴿أُولَٰئِكَ كَتَبَ فِي قُلُوبِهِمُ الْإِيمَانَ﴾ [المجادلة: 22]، وقال سبحانه: ﴿وَقَلْبُهُ مُطْمَئِنٌّ بِالْإِيمَانِ﴾ [النحل: 106].", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-555", "question": "في قوله تعالى: ﴿وَمَا أَنتَ بِمُؤْمِنٍ لَّنَا﴾ [يوسف: 17]، ما معنى «مؤمن»؟", "choices": ["بخاضع", "بمصدِّق", "بمطيع", "بممتثل"], "answer": "بمصدِّق", "answerIndex": 1, "explanation": "«ومنه قوله تعالى: ﴿وَمَا أَنتَ بِمُؤْمِنٍ لَّنَا﴾ [يوسف: 17] أي: بمصدِّق».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-556", "question": "ما المراد بـ«الحائط» في قوله ﷺ: «اذهب بنعلي هاتين فمن لقيت وراء هذا الحائط يشهد أن لا إله إلا الله مستيقنًا بها قلبه فبشره بالجنة»؟", "choices": ["البيت", "السوق", "المسجد", "البستان"], "answer": "البستان", "answerIndex": 3, "explanation": "قال رسول الله ﷺ: «اذهب بنعلي هاتين فمن لقيت وراء هذا الحائط يشهد أن لا إله إلا الله مستيقنًا بها قلبه فبشره بالجنة»، والمراد بالحائط البستان.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-557", "question": "هل الإيمان والإسلام معناهما واحد؟", "choices": ["نعم؛ إلا في حق المنافق", "نعم؛ معناهما واحد تمامًا", "لا؛ الإيمان هو التصديق القلبي، والإسلام هو الامتثال والإذعان الظاهري", "لا؛ الإسلام هو التصديق والإيمان هو الامتثال"], "answer": "لا؛ الإيمان هو التصديق القلبي، والإسلام هو الامتثال والإذعان الظاهري", "answerIndex": 2, "explanation": "«الإيمان والإسلام يتفقان ويتلازمان فيمن صدَّق بقلبه بكل عقائد الإيمان، وانقاد بظاهره لكل شرائع الإسلام»؛ فالإيمان في الاصطلاح: «التصديق القلبي بكل ما جاء به النبي ﷺ»؛ والإسلام في الاصطلاح: «هو الامتثال والإذعان الظاهري لكل ما جاء به النبي ﷺ»؛ وأركان الإيمان ستة: الإيمان بالله، والملائكة، والكتب السماوية، والرسل، واليوم الآخر، والقدر.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-558", "question": "ما حكم النطق بالشهادتين؟", "choices": ["شرطٌ لإجراء الأحكام الدنيوية", "شرط كمال للإيمان", "ركن من أركان الإيمان", "سنة مستحبة"], "answer": "شرطٌ لإجراء الأحكام الدنيوية", "answerIndex": 0, "explanation": "«النطق بالشهادتين شرطٌ لإجراء الأحكام الدنيوية»؛ وهو علامة على التصديق القلبي.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-559", "question": "من صدَّق بقلبه ولم ينطق بالشهادتين من غير رفضٍ منه للنطق، فما حكمه عند الله؟", "choices": ["كافر مخلَّد في النار", "مؤمن كامل الإيمان", "منافق", "مؤمن عند الله تعالى، ناجٍ من الخلود في النار"], "answer": "مؤمن عند الله تعالى، ناجٍ من الخلود في النار", "answerIndex": 3, "explanation": "«فمن صدَّق بقلبه ولم ينطق بلسانه، من غير رفضٍ منه للنطق، بحيث لو طُلِب منه النطق بالشهادتين لفعل؛ فهو مؤمن عند الله تعالى، ناجٍ من الخلود في النار»؛ لكننا لا نعامله معاملة المسلمين إلا إذا علمنا أنه نطق بالشهادتين.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-560", "question": "ما علاقة العمل بالإيمان؟", "choices": ["جزء من الإيمان", "لا علاقة له بالإيمان", "شرط كمال للإيمان", "شرط صحة للإيمان"], "answer": "شرط كمال للإيمان", "answerIndex": 2, "explanation": "«الإتيان بالأعمال الصالحة من صلاةٍ وزكاةٍ وصومٍ وحجٍّ وغير ذلك، والابتعاد عن المعاصي كالسرقة والكذب ومثل ذلك شرط كمال للإيمان»؛ فمن أدى هذه الأعمال فقد ازداد إيمانه، ومن لم يمتثل فهو مؤمن عاصٍ ينقص من كمال إيمانه بقدر معصيته.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": ام الأمثل لحياتهم في جوانبها المختلفة", "معرفة الغيبيات والأخلاق", "الإجابة عن أسئلة الوجود", "صيانة الفطرة من الانحراف"], "answer": "بيان النظام الأمثل لحياتهم في جوانبها المختلفة", "answerIndex": 0, "explanation": "«ثانيًا: الإنسان في حاجة إلى من يبين له النظام الأمثل لحياته في جوانبها المختلفة، من عبادات تقربه من ربه، ومن تشريعات: سياسية، واجتماعية، واقتصادية، وأخلاقية، تحقق له السعادة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-574", "question": "ما الحاجة الثالثة للبشر إلى الرسالات؟", "choices": ["صيانة الفطرة من الانحراف وتقويمها إذا اعوجت وعلاجها إذا انحرفت", "الإجابة عن أسئلة الوجود", "بيان النظام الأمثل للحياة", "تعليم البشر الكتابة"], "answer": "صيانة الفطرة من الانحراف وتقويمها إذا اعوجت وعلاجها إذا انحرفت", "answerIndex": 0, "explanation": "«ثالثًا: والفطرة البشرية قد تنحرف عن الصراط السوي بسبب التنشئة الخاطئة، والبيئة الفاسدة؛ فكانت الرسالات لصيانة الفطرة من الانحراف، ولتقويمها إذا اعوجت، وعلاجها إذا انحرفت».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-575", "question": "ماذا تدرك حواس الإنسان؟", "choices": ["أسئلة الوجود", "الأمور المادية فقط", "كل شيء في الوجود", "الغيبيات والأخلاق"], "answer": "الأمور المادية فقط", "answerIndex": 1, "explanation": "«إن وسائل المعرفة لدى الإنسان من: حواس – سمع، وبصر، وذوق، وشم، ولمس – تدرك الأمور المادية فقط»؛ «وأما الغيبيات، والأخلاق، فلا بد لمعرفتها من الوحي السماوي عن طريق الرسالات».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/educat lanation": "«والفرق هو تكليف الرسول بالبلاغ، دون النبي الذي يكون مثلًا أعلى وقدوة طيبة للناس».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-579", "question": "ما الذي يُشترط في النبي والرسول؟", "choices": ["أن يكون ذكرًا أو أنثى", "أن يكون من الملائكة", "أن يكون غنيًا من أهل المال", "أن يكون من بني البشر، وأن يكون ذكرًا، وأن يكون معصومًا من الأمراض المعدية والمنفرة والأخلاق الرديئة"], "answer": "أن يكون من بني البشر، وأن يكون ذكرًا، وأن يكون معصومًا من الأمراض المعدية والمنفرة والأخلاق الرديئة", "answerIndex": 3, "explanation": "«ما يُشترط في النبي والرسول: 1- النبي أو الرسول لا بد أن يكون من بني البشر. 2- وأن يكون ذكرًا وليس امرأة»؛ «3- كما يجب أن يكون النبي معصومًا من الأمراض المُعدية والمُنفِّرة، والأخلاق الرديئة التي تتنافى مع مهمة التبليغ عن الله».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-580", "question": "لماذا لا تكون النبوة في امرأة؟", "choices": ["لأن المرأة لا تستطيع حفظ القرآن", "لأن النساء لا يؤمنَّ بالرسل", "لأن الوحي لا ينزل إلا على الرجال الأغنياء", "لأن النبوة إمامة وقيادة، وتقتضي مباشرة أمور تصعب على النساء"], "answer": "لأن النبوة إمامة وقيادة، وتقتضي مباشرة أمور تصعب على النساء", "answerIndex": 3, "explanation": "«وأن يكون ذكرًا وليس امرأة؛ لأن النبوة إمامة وقيادة، وتقتضي مباشرة أمور تصعب على النساء، أو تستدعي مواقف تحظر على النساء».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%2 D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-595", "question": "ما تعريف «التبليغ» في حق الرسل؟", "choices": ["تبليغ الرسل ما يختارونه من الرسالة", "إيصال الرسل بعض ما أمرهم الله بتبليغه فقط", "تبليغ الرسل لأقوامهم دون غيرهم", "إيصال الرسل جميعَ ما أمرهم الله بتبليغه إلى من أُرسلوا إليهم، ولا يكتمون أو يخفون منه شيئًا قط"], "answer": "إيصال الرسل جميعَ ما أمرهم الله بتبليغه إلى من أُرسلوا إليهم، ولا يكتمون أو يخفون منه شيئًا قط", "answerIndex": 3, "explanation": "«ومعناه: إيصال الرسل جميعَ ما أمرهم الله بتبليغه إلى من أُرسلوا إليهم، ولا يكتمون أو يخفون منه شيئًا قط، فيجب الإيمان بأنهم بلَّغوا ما أُمروا بتبليغه».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-596", "question": "ما الدليل على وجوب التبليغ للرسل؟", "choices": ["أن الرسل بلَّغوا رسالاتهم كاملة", "أن التبليغ من أركان الإيمان", "أن كتمان العلم جائز للرسل", "أن الله أمرهم بالتبليغ، وكتمان شيءٍ مما أُمروا بتبليغه خيانة"], "answer": "أن الله أمرهم بالتبليغ، وكتمان شيءٍ مما أُمروا بتبليغه خيانة", "answerIndex": 3, "explanation": "«ودليل وجوب التبليغ: أن الله أمرهم بالتبليغ، وكتمانُ شيءٍ مما أُمروا بتبليغه خيانة، وقد ثبتت أمانتهم وعدم خيانتهم، فاستحال عليهم كتمان شيءٍ مما أُمروا به، ووجب لهم التبليغ»؛ قال تعالى: ﴿يَا أَيُّهَا الرَّسُولُ بَلِّغْ مَا أُنزِلَ إِلَيْكَ مِن رَّبِّكَ ۖ وَإِن لَّمْ تَفْعَلْ فَمَا بَلَّغْتَ رِسَالَتَهُ﴾ [المائدة: 67].", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التوحيد", "id": "h26-g8-597", "question": "ما معنى قوله تعالى: ﴿وَمَا ه ": 8, "subject": "التفسير", "id": "h26-g8-613", "question": "ما جزاء من يفعل هذه الأعمال الثلاثة ابتغاء مرضات الله؟", "choices": ["يدخله الجنة بغير حساب", "يكتب له عشر حسنات", "فسوف يؤتيه الله أجرًا عظيمًا", "يغفر له ما تقدم من ذنبه"], "answer": "فسوف يؤتيه الله أجرًا عظيمًا", "answerIndex": 2, "explanation": "قال تعالى: ﴿وَمَن يَفْعَلْ ذَٰلِكَ ابْتِغَاءَ مَرْضَاتِ اللَّهِ فَسَوْفَ نُؤْتِيهِ أَجْرًا عَظِيمًا﴾ [النساء: 114]؛ «أجرًا عظيمًا: لا يعرف مقداره إلا الله تعالى».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التفسير", "id": "h26-g8-614", "question": "ما معنى «ابتغاء مرضات الله»؟", "choices": ["طلب الثواب العاجل", "طلب رضا الناس", "طلب رضا الله لا غيره من أمور الدنيا", "طلب الجنة دون رضا الله"], "answer": "طلب رضا الله لا غيره من أمور الدنيا", "answerIndex": 2, "explanation": "«ابتغاء مرضات الله: طلب رضا الله لا غيره من أمور الدنيا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التفسير", "id": "h26-g8-615", "question": "ما حكم تناجي اثنين دون صاحبهما إذا كانوا ثلاثة؟", "choices": ["مستحب", "واجب", "منهي عنه؛ لأنه يحزن صاحبهما", "جائز مطلقًا"], "answer": "منهي عنه؛ لأنه يحزن صاحبهما", "answerIndex": 2, "explanation": "قال النبي ﷺ: «إذا كنتم ثلاثة، فلا يتناجى اثنان دون صاحبهما، فإن ذلك يحزنه».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%
