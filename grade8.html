, "id": "h26-g8-219", "question": "مثلث أطوال أضلاعه 5 سم و6 سم و8 سم، فما نوعه بالنسبة لزواياه؟", "choices": ["حاد الزوايا", "منفرج الزاوية", "قائم الزاوية", "متساوي الأضلاع"], "answer": "منفرج الزاوية", "answerIndex": 1, "explanation": "مربع أكبر ضلع 8² = 64 أكبر من مجموع مربعي الضلعين الآخرين 5² + 6² = 25 + 36 = 61، فالمثلث منفرج الزاوية.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-220", "question": "مثلث أطوال أضلاعه 7 سم و24 سم و25 سم، فما نوعه بالنسبة لزواياه؟", "choices": ["حاد الزوايا", "منفرج الزاوية", "متساوي الساقين", "قائم الزاوية"], "answer": "قائم الزاوية", "answerIndex": 3, "explanation": "7² + 24² = 49 + 576 = 625 = 25²، فيتحقق عكس نظرية فيثاغورس، فالمثلث قائم الزاوية.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-221", "question": "القطعة المستقيمة الواصلة بين منتصفي ضلعين في مثلث تساوي...", "choices": ["طول الضلع الثالث", "ضعف طول الضلع الثالث", "نصف طول الضلع الثالث", "ثلث طول الضلع الثالث"], "answer": "نصف طول الضلع الثالث", "answerIndex": 2, "explanation": "القطعة الواصلة بين منتصفي ضلعين في مثلث توازي الضلع الثالث وتساوي نصف طوله.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-222", "question": "في مثلث، القطعة الواصلة بين منتصفي ضلعين طولها 6 سم، فما طول الضلع الثالث الموازي لها؟", "choices": ["12 سم", "3 سم", "6 سم", "18 سم"], "answer": "12 سم", "answerIndex": 0, "explanation": "القطعة الواصلة بين منتصفي ضلعين تساوي نصف الضلع الثالث، فالضلع الثالث = 2 × 6 = 12 سم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-223", "question": "في مثلث أ ب ج، د منتصف أ ب، هـ منتصف أ ج، وكان ب ج = 16 سم، فما طول د هـ؟", "choices": ["4 سم", "16 سم", "32 سم", "8 سم"], "answer": "8 سم", "answerIndex": 3, "explanation": "د هـ واصلة بين منتصفي ضلعين في المثلث، فتساوي نصف طول الضلع الثالث ب ج = 16 ÷ 2 = 8 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-224", "question": "المستقيم المار بمنتصف أحد أضلاع المثلث والموازي لضلع آخر فيه، فإنه...", "choices": ["يساوي الضلع الثالث", "ينصف الضلع الثالث", "يمر برأس المثلث", "يعامد الضلع الثالث"], "answer": "ينصف الضلع الثالث", "answerIndex": 1, "explanation": "نظرية: المستقيم المار بمنتصف ضلع في مثلث وموازٍ لضلع آخر ينصف الضلع الثالث.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-225", "question": "إذا قطع قاطع مستقيمين متوازيين فإن الزاويتين المتبادلتين تكونان...", "choices": ["متساويتين في القياس", "متكاملتين", "مجموعهما 90°", "إحداهما ضعف الأخرى"], "answer": "متساويتين في القياس", "answerIndex": 0, "explanation": "من خواص التوازي: الزاويتان المتبادلتان الناتجتان عن قطع قاطع لمستقيمين متوازيين متساويتان في القياس.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-226", "question": "إذا قطع قاطع مستقيمين متوازيين، فإن مجموع قياسي الزاويتين الداخلتين في جهة واحدة من القاطع يساوي...", "choices": ["90°", "270°", "180°", "360°"], "answer": "180°", "answerIndex": 2, "explanation": "الزاويتان الداخلتان في جهة واحدة من القاطع (المتحالفتان) متكاملتان، فمجموع قياسيهما 180°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-227", "question": "في مثلث، قطعة مستقيمة واصلة بين منتصفي ضلعين، وطول الضلع الثالث فيها 20 سم، فما طول القطعة؟", "choices": ["5 سم", "20 سم", "40 سم", "10 سم"], "answer": "10 سم", "answerIndex": 3, "explanation": "القطعة الواصلة بين منتصفي ضلعين تساوي نصف طول الضلع الثالث = 20 ÷ 2 = 10 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-228", "question": "المتوسط في المثلث هو القطعة المستقيمة الواصلة بين...", "choices": ["منتصفي ضلعين في المثلث", "رأس المثلث ومنتصف الضلع المقابل له", "رأس المثلث ونقطة على الضلع المقابل ليست منتصفه", "منتصف ضلع ومنتصف الضلع المقابل له"], "answer": "رأس المثلث ومنتصف الضلع المقابل له", "answerIndex": 1, "explanation": "تعريف المتوسط: قطعة مستقيمة واصلة بين رأس المثلث ومنتصف الضلع المقابل له.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-229", "question": "نقطة تقاطع متوسطات المثلث تقسم كل متوسط بنسبة...", "choices": ["2 : 1 من جهة الرأس", "1 : 1", "1 : 2 من جهة الرأس", "3 : 1"], "answer": "2 : 1 من جهة الرأس", "answerIndex": 0, "explanation": "نقطة تقاطع متوسطات المثلث (مركز الثقل) تقسم كل متوسط بنسبة 2 : 1 من جهة الرأس.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-230", "question": "في مثلث، طول أحد المتوسطات 9 سم، فما طول القطعة من الرأس إلى نقطة تقاطع المتوسطات؟", "choices": ["3 سم", "4.5 سم", "9 سم", "6 سم"], "answer": "6 سم", "answerIndex": 3, "explanation": "القطعة من الرأس إلى نقطة تقاطع المتوسطات = ثلثي المتوسط = (2 ÷ 3) × 9 = 6 سم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-231", "question": "في مثلث، طول القطعة من نقطة تقاطع المتوسطات إلى منتصف أحد الأضلاع 4 سم، فما طول المتوسط كاملًا؟", "choices": ["6 سم", "8 سم", "12 سم", "16 سم"], "answer": "12 سم", "answerIndex": 2, "explanation": "القطعة من نقطة التقاطع إلى منتصف الضلع = ثلث المتوسط، فالمتوسط كاملًا = 3 × 4 = 12 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-232", "question": "في مثلث قائم الزاوية، المتوسط الخارج من رأس الزاوية القائمة يساوي...", "choices": ["طول الوتر", "نصف طول الوتر", "ضعف طول الوتر", "طول أحد ضلعي القائمة"], "answer": "نصف طول الوتر", "answerIndex": 1, "explanation": "المتوسط الخارج من رأس الزاوية القائمة في المثلث القائم يساوي نصف طول الوتر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-233", "question": "في مثلث قائم الزاوية طول الوتر 10 سم، فما طول المتوسط الخارج من رأس القائمة؟", "choices": ["5 سم", "10 سم", "20 سم", "2.5 سم"], "answer": "5 سم", "answerIndex": 0, "explanation": "المتوسط الخارج من رأس القائمة = نصف طول الوتر = 10 ÷ 2 = 5 سم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-234", "question": "كم عدد متوسطات المثلث؟", "choices": ["1", "2", "3", "4"], "answer": "3", "answerIndex": 2, "explanation": "لكل مثلث ثلاثة متوسطات، تتلاقى جميعًا في نقطة واحدة هي مركز ثقل المثلث.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-235", "question": "في مثلث، نقطة تقاطع المتوسطات تقسم أحد المتوسطات إلى جزأين، طول الجزء الأكبر 8 سم، فما طول المتوسط؟", "choices": ["8 سم", "10 سم", "16 سم", "12 سم"], "answer": "12 سم", "answerIndex": 3, "explanation": "الجزء الأكبر من المتوسط (من جهة الرأس) = ثلثا المتوسط، فالمتوسط = 8 × 3 ÷ 2 = 12 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-236", "question": "في المثلث المتساوي الساقين، زاويتا القاعدة تكونان...", "choices": ["مختلفتين", "قائمتين", "متساويتين في القياس", "مجموعهما 180°"], "answer": "متساويتين في القياس", "answerIndex": 2, "explanation": "في المثلث المتساوي الساقين زاويتا القاعدة متساويتان في القياس.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-237", "question": "مثلث متساوي الساقين قياس زاوية رأسه 40°، فما قياس كل من زاويتي القاعدة؟", "choices": ["70°", "40°", "100°", "140°"], "answer": "70°", "answerIndex": 0, "explanation": "مجموع زوايا المثلث 180°، فقياس كل زاوية قاعدة = (180 − 40) ÷ 2 = 70°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-238", "question": "مثلث متساوي الساقين قياس إحدى زاويتي قاعدته 50°، فما قياس زاوية رأسه؟", "choices": ["50°", "100°", "130°", "80°"], "answer": "80°", "answerIndex": 3, "explanation": "قياس زاوية الرأس = 180 − (50 + 50) = 80°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-239", "question": "في مثلث قائم الزاوية، طول الضلع المقابل للزاوية 30° يساوي...", "choices": ["طول الوتر", "نصف طول الوتر", "ضعف طول الوتر", "جذر طول الوتر"], "answer": "نصف طول الوتر", "answerIndex": 1, "explanation": "في المثلث القائم الزاوية، طول الضلع المقابل للزاوية 30° يساوي نصف طول الوتر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-240", "question": "في مثلث قائم الزاوية، طول الضلع المقابل للزاوية 30° هو 4 سم، فما طول الوتر؟", "choices": ["2 سم", "4 سم", "8 سم", "16 سم"], "answer": "8 سم", "answerIndex": 2, "explanation": "الوتر = ضعف الضلع المقابل للزاوية 30° = 2 × 4 = 8 سم (كما في حل اختبار الشاطر: الضلع 5 سم يقابله وتر 10 سم).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-241", "question": "مثلث قائم الزاوية زواياه 30° و60° و90°، وطول الوتر 12 سم، فما طول الضلع المقابل للزاوية 60°؟", "choices": ["6 جذر 3 سم", "6 سم", "12 جذر 3 سم", "3 جذر 3 سم"], "answer": "6 جذر 3 سم", "answerIndex": 0, "explanation": "الضلع المقابل للزاوية 60° = (جذر 3 ÷ 2) × طول الوتر = (جذر 3 ÷ 2) × 12 = 6 جذر 3 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-242", "question": "مثلث متساوي الساقين طول كل من ساقيه 5 سم وطول قاعدته 6 سم، فما محيطه؟", "choices": ["11 سم", "22 سم", "30 سم", "16 سم"], "answer": "16 سم", "answerIndex": 3, "explanation": "محيط المثلث = مجموع أطوال أضلاعه = 5 + 5 + 6 = 16 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-243", "question": "في شكل رباعي قياسات ثلاث من زواياه 90° و100° و80°، فما قياس الزاوية الرابعة؟", "choices": ["70°", "90°", "80°", "100°"], "answer": "90°", "answerIndex": 1, "explanation": "مجموع قياسات الزوايا الداخلة للشكل الرباعي = 360°، فالزاوية الرابعة = 360 − (90 + 100 + 80) = 90°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-244", "question": "في خماسي قياسات أربع من زواياه 100° و110° و120° و90°، فما قياس الزاوية الخامسة؟", "choices": ["120°", "100°", "140°", "160°"], "answer": "120°", "answerIndex": 0, "explanation": "مجموع قياسات الزوايا الداخلة للخماسي = (5 − 2) × 180 = 540°، فالزاوية الخامسة = 540 − (100 + 110 + 120 + 90) = 120°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-245", "question": "قياس كل زاوية من زوايا الخماسي المنتظم يساوي...", "choices": ["90°", "108°", "120°", "135°"], "answer": "108°", "answerIndex": 1, "explanation": "من اختبار الشاطر نوفمبر 2027 (شبابيك): قياس كل زاوية داخلة في الخماسي المنتظم = (5 − 2) × 180 ÷ 5 = 108°.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-246", "question": "مجموع قياسات الزوايا الخارجة عن أي مضلع محدب يساوي...", "choices": ["180°", "540°", "360°", "(ن − 2) × 180°"], "answer": "360°", "answerIndex": 2, "explanation": "من اختبار الشاطر نوفمبر 2027 (شبابيك): مجموع قياسات الزوايا الخارجة عن أي مضلع محدب = 360° دائمًا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-247", "question": "عدد أضلاع المضلع المحدب الذي له 20 قطرًا يساوي...", "choices": ["6 أضلاع", "8 أضلاع", "7 أضلاع", "10 أضلاع"], "answer": "8 أضلاع", "answerIndex": 1, "explanation": "من اختبار الشاطر نوفمبر 2027 (شبابيك): عدد الأقطار = ن × (ن − 3) ÷ 2 = 20، فـ ن² − 3ن − 40 = 0، ومنها ن = 8 أضلاع.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-248", "question": "عدد أقطار المضلع السداسي يساوي...", "choices": ["9", "6", "12", "15"], "answer": "9", "answerIndex": 0, "explanation": "عدد أقطار المضلع = ن × (ن − 3) ÷ 2 = 6 × 3 ÷ 2 = 9.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-249", "question": "قياس كل زاوية من زوايا السداسي المنتظم يساوي...", "choices": ["108°", "135°", "150°", "120°"], "answer": "120°", "answerIndex": 3, "explanation": "قياس كل زاوية داخلة في السداسي المنتظم = (6 − 2) × 180 ÷ 6 = 120°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-250", "question": "قياس كل زاوية خارجة عن الثماني المنتظم يساوي...", "choices": ["30°", "60°", "45°", "135°"], "answer": "45°", "answerIndex": 2, "explanation": "قياس كل زاوية خارجة عن مضلع منتظم = 360 ÷ عدد الأضلاع = 360 ÷ 8 = 45°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-251", "question": "We should face every ..................... with courage and determination.", "choices": ["tunnel", "monorail", "challenge", "clay"], "answer": "challenge", "answerIndex": 2, "explanation": "من منشور «How to face challenges» في ملحق المعاصر (الوحدة الثالثة): «Life is full of challenges, but we can face them with courage and determination» — نواجه كل تحدٍّ بشجاعة وتصميم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-252", "question": "You need ..................... to speak in front of people and face your fears.", "choices": ["courage", "clay", "tunnel", "mistake"], "answer": "courage", "answerIndex": 0, "explanation": "من إجابات مفردات الوحدة الثالثة في ملحق المعاصر (المجموعة B: courage)، ومن المنشور نفسه: نواجه التحديات «with courage» — الشجاعة هي ما نحتاجه لمواجهة مخاوفنا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-253", "question": "The new ..................... in our city is very fast; it runs on one rail.", "choices": ["tunnel", "challenge", "sculpture", "monorail"], "answer": "monorail", "answerIndex": 3, "explanation": "من إجابات مفردات الوحدة الثالثة في ملحق المعاصر (المجموعة B: monorail) — المونوريل قطار يسير على قضيب واحد.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-254", "question": "Cars pass through the ..................... under the mountain.", "choices": ["monorail", "tunnel", "challenge", "message"], "answer": "tunnel", "answerIndex": 1, "explanation": "من التمارين العامة على الوحدة الثالثة في ملحق المعاصر (Choose: tunnel) — النفق ممر تحت الجبل تمر منه السيارات.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-255", "question": "To stay ..................... , you should eat well and exercise every day.", "choices": ["nervous", "tired", "healthy", "sad"], "answer": "healthy", "answerIndex": 2, "explanation": "من تمرين إكمال النص على الوحدة الثالثة في ملحق المعاصر (healthy) — البقاء بصحة جيدة يحتاج طعامًا جيدًا ورياضة يومية.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-256", "question": "I feel ..................... before my exam, but I take a deep breath and calm down.", "choices": ["nervous", "healthy", "confident", "happy"], "answer": "nervous", "answerIndex": 0, "explanation": "من تمرين إكمال النص على الوحدة الثالثة في ملحق المعاصر (nervous) — الشعور بالتوتر قبل الامتحان، ومن المنشور: «stay calm, take a deep breath».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-257", "question": "I tried many times. ..................... , I solved the problem and felt happy.", "choices": ["Suddenly", "Quickly", "Sadly", "Finally"], "answer": "Finally", "answerIndex": 3, "explanation": "من تمرين إكمال النص على الوحدة الثالثة في ملحق المعاصر (Finally) — بعد محاولات متكررة تأتي «أخيرًا» خاتمةً للقصة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-258", "question": "The words «happy» and «sad» have opposite meanings. They are ..................... .", "choices": ["synonyms", "antonyms", "challenges", "sculptures"], "answer": "antonyms", "answerIndex": 1, "explanation": "من إجابات مفردات الوحدة الثالثة في ملحق المعاصر (المجموعة A: antonyms) — الكلمات المتضادة في المعنى تسمى antonyms.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-259", "question": "A: How ..................... is this dress? B: It is 200 pounds.", "choices": ["many", "long", "much", "often"], "answer": "much", "answerIndex": 2, "explanation": "من سؤال المحادثة على الوحدة الثالثة في ملحق المعاصر (much) — السؤال عن سعر شيء غير معدود يكون بـ How much.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-260", "question": "The prefix ..................... gives the opposite of «possible»: «impossible».", "choices": ["im-", "un-", "re-", "pre-"], "answer": "im-", "answerIndex": 0, "explanation": "من إجابات مفردات الوحدة الثالثة في ملحق المعاصر (المجموعة A: im-) — البادئة im- تعني النفي في impossible.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-261", "question": "A person with determination never ..................... when things are difficult.", "choices": ["runs away", "gives up", "makes mistakes", "asks for help"], "answer": "gives up", "answerIndex": 1, "explanation": "من منشور «How to face challenges» في ملحق المعاصر: «Practice a lot and never give up» — صاحب التصميم لا يستسلم أبدًا مهما صعبت الأمور.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-262", "question": "An ..................... is something that stops you from doing what you want.", "choices": ["tunnel", "sculpture", "message", "obstacle"], "answer": "obstacle", "answerIndex": 3, "explanation": "من شرح تقييمات Step Ahead للوحدة الثالثة: ترتبط المشكلات بمفردات مثل determination وobstacle وconfident — العقبة شيء يعيقك عن هدفك.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2679/"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-263", "question": "While I ..................... video games, she came.", "choices": ["played", "am playing", "was playing", "play"], "answer": "was playing", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة على الوحدة الثالثة في ملحق المعاصر: «While I was playing video games, she came» — الحدث المستمر (was playing) في الخلفية، والحدث القصير (came) قطعه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-264", "question": "As we ..................... , Ali broke his leg.", "choices": ["were running", "ran", "are running", "run"], "answer": "were running", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «As we were running, Ali broke his leg» — الجري مستمر، والكسر حدث قصير وقع أثناءه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-265", "question": "I ..................... to school when it rained.", "choices": ["walked", "was walking", "am walking", "walk"], "answer": "was walking", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «I was walking to school when it rained» — المشي خلفية مستمرة، والمطر حدث قصير؛ كما في شرح Step Ahead: المشي يمثل الخلفية المستمرة ورؤية الحادث حدث قصير.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-266", "question": "While they ..................... , it started to get dark.", "choices": ["played", "are playing", "play", "were playing"], "answer": "were playing", "answerIndex": 3, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «While they were playing, it started to get dark» — اللعب مستمر، وحلول الظلام حدث وقع أثناءه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-267", "question": "We ..................... the film when our father arrived.", "choices": ["watched", "are watching", "were watching", "watch"], "answer": "were watching", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «We were watching the film when our father arrived» — المشاهدة مستمرة، ووصول الأب حدث قصير قطعها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-268", "question": "I ..................... all the pizza for dinner yesterday.", "choices": ["ate", "was eating", "eat", "eats"], "answer": "ate", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «I ate all the pizza for dinner yesterday» — حدث مكتمل مع yesterday يأتي في الماضي البسيط.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-269", "question": "I ..................... a photo while my sister was smiling.", "choices": ["was taking", "took", "take", "takes"], "answer": "took", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «I took a photo while my sister was smiling» — التقاط الصورة حدث قصير مكتمل (ماضٍ بسيط)، والابتسام خلفية مستمرة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-270", "question": "As I ..................... a movie, I fell asleep.", "choices": ["watched", "am watching", "watch", "was watching"], "answer": "was watching", "answerIndex": 3, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «As I was watching a movie, I fell asleep» — المشاهدة مستمرة، والنوم حدث وقع أثناءها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-271", "question": "I ..................... when my mother called me.", "choices": ["read", "am reading", "was reading", "reads"], "answer": "was reading", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «I was reading when my mother called me» — القراءة مستمرة، والاتصال حدث قصير قطعها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-272", "question": "As she ..................... , they came.", "choices": ["was cooking", "cooked", "is cooking", "cook"], "answer": "was cooking", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «As she was cooking, they came» — الطبخ مستمر، ومجيئهم حدث وقع أثناءه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-273", "question": "How about ..................... a study plan to face your exams?", "choices": ["make", "making", "made", "to make"], "answer": "making", "answerIndex": 1, "explanation": "من شرح تقييمات Step Ahead للوحدة الثالثة: بعد How about يأتي الفعل مضافًا إليه ing، مثل «How about making a study plan?» — أما بعد should فيأتي المصدر.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2679/"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-274", "question": "I suggest ..................... to your teacher for help.", "choices": ["go", "went", "to go", "going"], "answer": "going", "answerIndex": 3, "explanation": "من شرح تقييمات Step Ahead للوحدة الثالثة: بعد suggest يأتي الفعل مضافًا إليه ing، مثل «I suggest going».", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2679/"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-275", "question": "You should ..................... calm and think positively.", "choices": ["staying", "stayed", "stay", "to stay"], "answer": "stay", "answerIndex": 2, "explanation": "من منشور «How to face challenges» في ملحق المعاصر: «stay calm, take a deep breath and think positively» — وبعد should يأتي الفعل في المصدر كما في شرح Step Ahead.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-276", "question": "Sculptures are made by shaping materials like stone, wood, metal or ..................... .", "choices": ["clay", "tunnel", "monorail", "challenge"], "answer": "clay", "answerIndex": 0, "explanation": "من إجابات مفردات الوحدة الرابعة في ملحق المعاصر (المجموعة A: Clay)، ومن فقرة «Your favorite type of art»: التماثيل تُصنع بتشكيل الحجر أو الخشب أو المعدن أو الطين.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-277", "question": "Art helps the artist ..................... his ideas and emotions.", "choices": ["discover", "express", "move", "run"], "answer": "express", "answerIndex": 1, "explanation": "من إجابات مفردات الوحدة الرابعة في ملحق المعاصر (المجموعة A: express)، ومن الفقرة: كل تمثال يساعد الفنان على التعبير عن أفكاره ومشاعره.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-278", "question": "Mahmoud Mokhtar's Nahdat Misr Statue is very ..................... ; it is a symbol of Egypt's history.", "choices": ["common", "nervous", "valuable", "healthy"], "answer": "valuable", "answerIndex": 2, "explanation": "من إجابات مفردات الوحدة الرابعة في ملحق المعاصر (المجموعة B: Valuable) — التمثال قيّم لأنه رمز لتاريخ مصر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-279", "question": "Farming and growing crops are called ..................... .", "choices": ["sculpture", "challenge", "message", "agriculture"], "answer": "agriculture", "answerIndex": 3, "explanation": "من التمارين العامة على الوحدة الرابعة في ملحق المعاصر (Choose: agriculture)، ومن الفقرة: تمثال نهضة مصر رمز لتاريخ مصر وزراعتها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-280", "question": "..................... are objects made by shaping stone, wood, metal or clay.", "choices": ["Sculptures", "Paintings", "Tunnels", "Challenges"], "answer": "Sculptures", "answerIndex": 0, "explanation": "من التمارين العامة على الوحدة الرابعة في ملحق المعاصر (Choose: Sculptures)، ومن فقرة «Your favorite type of art»: التماثيل أشياء تُصنع بتشكيل الحجر والخشب والمعدن والطين.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-281", "question": "The artist's message is very ..................... ; everyone should understand it.", "choices": ["common", "important", "nervous", "healthy"], "answer": "important", "answerIndex": 1, "explanation": "من إجابات مفردات الوحدة الرابعة في ملحق المعاصر (المجموعة B: important) — رسالة الفنان مهمة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-282", "question": "The suffix ..................... turns «active» into «activity».", "choices": ["-able", "-ive", "-ity", "-ion"], "answer": "-ity", "answerIndex": 2, "explanation": "من التمارين العامة على الوحدة الرابعة في ملحق المعاصر (Choose: -ity) — اللاحقة -ity تحوّل الصفة إلى اسم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-283", "question": "The suffix ..................... turns «enjoy» into «enjoyable».", "choices": ["-ive", "-ity", "-ion", "-able"], "answer": "-able", "answerIndex": 3, "explanation": "من إجابات مفردات الوحدة الرابعة في ملحق المعاصر (المجموعة A: -able) — اللاحقة -able تعني «قابل لـ».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-284", "question": "The suffix ..................... turns «act» into «active».", "choices": ["-ive", "-able", "-ity", "-ion"], "answer": "-ive", "answerIndex": 0, "explanation": "من إجابات مفردات الوحدة الرابعة في ملحق المعاصر (المجموعة B: -ive) — اللاحقة -ive تحوّل الفعل إلى صفة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-285", "question": "When you visit an art gallery, you can ..................... new artists and ideas.", "choices": ["express", "discover", "move", "run"], "answer": "discover", "answerIndex": 1, "explanation": "من تمرين إكمال النص على الوحدة الرابعة في ملحق المعاصر (discover)، ومن الفقرة: الفن يساعدنا على اكتشاف أفكار جديدة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-286", "question": "The museum has many beautiful ..................... on its walls.", "choices": ["sculptures", "tunnels", "paintings", "challenges"], "answer": "paintings", "answerIndex": 2, "explanation": "من تمرين إكمال النص على الوحدة الرابعة في ملحق المعاصر (paintings) — اللوحات الفنية هي ما يُعلَّق على جدران المتحف.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-287", "question": "Every sculpture tells a story and has a special ..................... .", "choices": ["tunnel", "monorail", "challenge", "message"], "answer": "message", "answerIndex": 3, "explanation": "من تمرين إكمال النص على الوحدة الرابعة في ملحق المعاصر (message)، ومن الفقرة: كل تمثال يحكي قصة وله رسالة خاصة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-288", "question": "Ali is facing many problems, ..................... he always smiles.", "choices": ["but", "because", "so", "although"], "answer": "but", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة على الوحدة الرابعة في ملحق المعاصر: «Ali is facing many problems, but he always smiles» — but تربط بين فكرتين متعارضتين.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-289", "question": "I woke up late, ..................... I missed the bus.", "choices": ["because", "so", "but", "although"], "answer": "so", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «I woke up late, so I missed the bus» — so تربط السبب بالنتيجة: الاستيقاظ متأخرًا سبب، وفوات الحافلة نتيجة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-290", "question": "I gain weight ..................... I eat unhealthy food.", "choices": ["so", "but", "because", "although"], "answer": "because", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «I gain weight because I eat unhealthy food» — because تأتي بعد النتيجة وتقدّم سببها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-291", "question": "..................... I slept late, I got up early.", "choices": ["Because", "So", "But", "Although"], "answer": "Although", "answerIndex": 3, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «Although I slept late, I got up early» — although تعني «بالرغم من»، ولا تُجمع مع but في جملة واحدة كما ينبّه شرح Step Ahead.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-292", "question": "They passed the test ..................... they studied hard.", "choices": ["because", "so", "but", "although"], "answer": "because", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «They passed the test because they studied hard» — النجاح نتيجة، والدراسة الجادة سببها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-293", "question": "He is thirsty, ..................... he drinks water.", "choices": ["because", "so", "but", "although"], "answer": "so", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «He is thirsty, so he drinks water» — العطش سبب، وشرب الماء نتيجته.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-294", "question": "..................... Omar didn't study, he passed the test.", "choices": ["Because", "So", "Although", "But"], "answer": "Although", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «Although Omar didn't study, he passed the test» — تعارض بين عدم الدراسة والنجاح.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-295", "question": "Salma was sick, ..................... she went to school.", "choices": ["because", "so", "although", "but"], "answer": "but", "answerIndex": 3, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «Salma was sick, but she went to school» — المرض والذهاب للمدرسة فكرتان متعارضتان.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-296", "question": "He is wearing new clothes ..................... he is rich.", "choices": ["because", "so", "but", "although"], "answer": "because", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «He is wearing new clothes because he is rich» — الغنى سبب ارتداء الملابس الجديدة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-297", "question": "He won the art competition, ..................... he felt happy.", "choices": ["because", "so", "but", "although"], "answer": "so", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة في ملحق المعاصر: «He won the art competition, so he felt happy» — الفوز سبب، والفرح نتيجته.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-298", "question": "What is Mahmoud Mokhtar's Nahdat Misr Statue a symbol of?", "choices": ["Egypt's sports and games", "Egypt's deserts and seas", "Egypt's history and agriculture", "Egypt's schools and hospitals"], "answer": "Egypt's history and agriculture", "answerIndex": 2, "explanation": "من فقرة «Your favorite type of art» في ملحق المعاصر: تمثال نهضة مصر للفنان محمود مختار رمز لتاريخ مصر وزراعتها.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/sh
