 يصلحكم به من أمر دينه؛ لأنه سبب الحياة الأبدية».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التفسير", "id": "h26-g8-633", "question": "ما معنى «يحول بين المرء وقلبه»؟", "choices": ["يمنع المرء من التفكير", "يفرق بين المرء وأهله", "يقلب الأمور من حال إلى حال", "يحجب القلب عن صاحبه"], "answer": "يقلب الأمور من حال إلى حال", "answerIndex": 2, "explanation": "«يحول بين المرء وقلبه: يقلب الأمور من حال إلى حال»؛ فسبحانه «يقلب الأمور كيف شاء من حال إلى حال، وهو المتصرف في جميع الأشياء، يصرف القلوب بما لا يقدر عليه صاحبها».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التفسير", "id": "h26-g8-634", "question": "ما الدعاء الذي كان النبي ﷺ يكثر أن يقوله لثبات القلب؟", "choices": ["يا مقلب القلوب والأبصار ثبت قلبي", "اللهم ثبت قلبي على الإيمان", "يا مقلب القلوب ثبت قلبي على دينك", "يا مصرف القلوب صرف قلبي إلى طاعتك"], "answer": "يا مقلب القلوب ثبت قلبي على دينك", "answerIndex": 2, "explanation": "كان النبي ﷺ يكثر أن يقول: «يا مقلب القلوب ثبت قلبي على دينك»، فقلنا: يا رسول الله، آمنا بك وبما جئت به، فهل تخاف علينا؟ قال: «نعم، إن القلوب بين أصبعين من أصابع الله تعالى يقلبها».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التفسير", "id": "h26-g8-635", "question": "ما الفتنة التي حذر الله المؤمنين من الوقوع فيها في الآية 25 من الأنفال؟", "choices": ["ترك الجهاد", "الاختبار والمحنة التي يعم بلاؤها الصالح والفاسد", "الشرك بالله", "القتال بين المسلمين"], "answer": "الاختبار والمحنة التي يعم بلاؤها الصالح والفاسد", "answerIndex": 1, "explanation": "قال تعالى: ﴿وَاتَّقُوا فِتْنَةً لَّا تُصِيبَنَّ الَّذِينَ ظَلَمُوا مِنكُمْ خَاصَّةً ۖ وَاعْلَمُوا أَنَّ اللَّهَ شَدِيدُ الْعِقَابِ﴾ [الأنفال: 25]؛ «الفتنة وهي الاختبار والمحنة، لأن عدم الحذر يترتب عليه أن: يعم البلاء المسيء وغيره، ولا يقتصر على أهل المعاصي».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التفسير", "id": "h26-g8-636", "question": "ما النعم الأربع التي أكمل الله بها نعمته على المؤمنين في الآية 26 من الأنفال؟", "choices": ["آواهم، وأغناهم، وعلمهم، وهداهم", "نصرهم، وأمنهم، ورزقهم، وعافاهم", "آواهم، وأعانهم وقواهم يوم بدر، ورزقهم من الطيبات، وأحل لهم الغنائم", "آواهم، وكثرهم، وأغناهم، وأعزهم"], "answer": "آواهم، وأعانهم وقواهم يوم بدر، ورزقهم من الطيبات، وأحل لهم الغنائم", "answerIndex": 2, "explanation": "قال تعالى: ﴿فَآوَاكُمْ وَأَيَّدَكُم بِنَصْرِهِ وَرَزَقَكُم مِّنَ الطَّيِّبَاتِ لَعَلَّكُمْ تَشْكُرُونَ﴾ [الأنفال: 26]؛ «فآواكم الله، وجعل لكم مأوى تتحصنون به في المدينة»، وأعانكم وقواكم يوم بدر وغيره من الغزوات بنصره وعونه، ورزقكم من الطيبات رزقًا حسنًا مباركًا فيه، وأحل لكم الغنائم؛ كي تشكروا هذه النعم الجليلة.", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التفسير", "id": "h26-g8-637", "question": "ما الآيات التي موضوعها «أوصاف أولياء الله وجزاؤهم»؟", "choices": ["النور 55–56", "الأنبياء 103–104", "يونس 62–64", "يونس 62–63"], "answer": "يونس 62–64", "answerIndex": 2, "explanation": "قال تعالى: ﴿أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ﴾ [يونس: 62].", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التفسير", "id": "h26-g8-638", "question": "من هم أولياء الله كما بين الكتاب؟", "choices": ["الصحابة فقط", "الذين آمنوا بالله وملائكته وكتبه ورسله واليوم الآخر، وكانوا يتقون الله", "من لا يخطئ أبدًا", "الأنبياء والرسل فقط"], "answer": "الذين آمنوا بالله وملائكته وكتبه ورسله واليوم الآخر، وكانوا يتقون الله", "answerIndex": 1, "explanation": "قال تعالى: ﴿الَّذِينَ آمَنُوا وَكَانُوا يَتَّقُونَ﴾ [يونس: 63]؛ «الذين آمنوا بالله، وملائكته وكتبه، ورسله، واليوم الآخر، وكانوا يتقون الله بفعل ما أمر به، وترك ما نهى عنه، هم أولياء الله حقًّا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التفسير", "id": "h26-g8-639", "question": "هل من شرط الولي أن يكون معصومًا لا يغلط ولا يخطئ؟", "choices": ["لا؛ وليس من شرط الولي أن يكون معصومًا", "لا؛ بل الولي لا يذنب أصلًا", "نعم؛ فالولي معصوم كالأنبياء", "نعم؛ إلا من الصغائر"], "answer": "لا؛ وليس من شرط الولي أن يكون معصومًا", "answerIndex": 0, "explanation": "«وليس من شرط الولي أن يكون معصومًا لا يغلط ولا يخطئ».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التفسير", "id": "h26-g8-640", "question": "ما معنى «البشرى» في قوله تعالى: ﴿لَهُمُ الْبُشْرَىٰ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ﴾؟", "choices": ["الجنة في الآخرة فقط", "الفرح الدائم في الدنيا", "الخبر السار، وسُمِّي بذلك؛ لأن أثره يظهر على البشرة", "الرؤيا الصالحة فقط"], "answer": "الخبر السار، وسُمِّي بذلك؛ لأن أثره يظهر على البشرة", "answerIndex": 2, "explanation": "«البشرى: الخبر السار، وسُمِّي بذلك؛ لأن أثره يظهر على البشرة».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التفسير", "id": "h26-g8-641", "question": "ما الفرق بين الخوف والحزن كما بين الكتاب؟", "choices": ["لا فرق بينهما", "الخوف في الدنيا والحزن في الآخرة", "الخوف من الله والحزن على الدنيا", "الخوف من مكروه يتوقع حصوله، والحزن على مكروه قد وقع فعلًا"], "answer": "الخوف من مكروه يتوقع حصوله، والحزن على مكروه قد وقع فعلًا", "answerIndex": 3, "explanation": "«الخوف يكون من أجل مكروه يتوقع حصوله، بينما الحزن يكون من أجل مكروه قد وقع فعلًا».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "التفسير", "id": "h26-g8-642", "question": "بماذا فسر النبي ﷺ قوله تعالى: ﴿لَهُمُ الْبُشْرَىٰ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ﴾؟", "choices": ["هي الرؤيا الصالحة، يراها المسلم أو تُرى له", "هي المغفرة والرحمة", "هي النصر في الدنيا والجنة في الآخرة", "هي الاستخلاف في الأرض"], "answer": "هي الرؤيا الصالحة، يراها المسلم أو تُرى له", "answerIndex": 0, "explanation": "قال النبي ﷺ في قوله: ﴿لَهُمُ الْبُشْرَىٰ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ﴾: قال: «هي الرؤيا الصالحة، يراها المسلم أو تُرى له».", "type": " .eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "السيرة", "id": "h26-g8-745", "question": "ما رأي كبار الصحابة حين استشارهم النبي صلى الله عليه وسلم قبل أحد؟", "choices": ["عدم الخروج من المدينة والبقاء فيها", "الهجرة إلى الحبشة", "الخروج لقتال المشركين خارج المدينة", "الصلح مع قريش"], "answer": "عدم الخروج من المدينة والبقاء فيها", "answerIndex": 0, "explanation": "«فكان رأي كبار الصحابة عدم الخروج من المدينة، غير أن كثيرا من شباب الصحابة، قالوا: (يا رسول الله، اخرج بنا على أعدائنا، لا يرون أنا جبنا عنهم وضعفنا)».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "السيرة", "id": "h26-g8-746", "question": "كم كان عدد جيش قريش في غزوة أحد؟", "choices": ["ثلاثمئة وثلاثة عشر", "ثلاثة آلاف مقاتل", "ألف مقاتل", "سبعمائة مقاتل"], "answer": "ثلاثة آلاف مقاتل", "answerIndex": 1, "explanation": "«خرجت قريش من مكة في شوال من السنة الثالثة من الهجرة مع حلفائهم في ثلاثة آلاف مقاتل».", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%A7%D8%B5%D9%88%D9%84%20%D8%A7%D9%84%D8%AF%D9%8A%D9%86%20-%20%D8%A7%D9%84%D8%B5%D9%81%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B9%D8%AF%D8%A7%D8%AF%D9%8A.pdf"}, {"grade": 8, "subject": "السيرة", "id": "h26-g8-747", "question": "كم بقي مع رسول الله صلى الله عليه وسلم بعد أن رجع عبد الله بن أبي بن سلول بثلث الجيش في أحد؟", "choices": ["ثلاثة آلاف رجل", "ألف رجل", "ثلاثمئة وثلاثة عشر رجلا", "سبعمائة رجل من المؤمنين المخلصين"], "answer": "سبعمائة رجل من المؤمنين المخلصين", "answerIndex": 3, "explanation": "«حتى إذا كانوا بين المدينة وأحد رجع عبد الله ة 970م", "answerIndex": 1, "explanation": "«أرسى جوهر الصقلي قائد جيوش المعز لدين الله الفاطمي حجر أساس الجامع الأزهر بمدينة القاهرة في 24 جمادى الأولى سنة 359هـ/ أبريل سنة 970م، واستغرق بناؤه عامين»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-762", "question": "لماذا سُمي الأزهر بهذا الاسم؟", "choices": ["نسبة إلى صلاح الدين الأيوبي", "نسبة إلى السيدة فاطمة الزهراء البتول بنت رسول الله ﷺ", "نسبة إلى مدينة القاهرة", "نسبة إلى جوهر الصقلي مؤسسه"], "answer": "نسبة إلى السيدة فاطمة الزهراء البتول بنت رسول الله ﷺ", "answerIndex": 1, "explanation": "«وسُمي الأزهر بهذا الاسم على أرجح الروايات التاريخية نسبة إلى السيدة فاطمة الزهراء البتول بنت رسول الله ﷺ»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-763", "question": "من الذي أغلق الجامع الأزهر؟", "choices": ["الظاهر بيبرس", "السلطان سليم الأول", "صلاح الدين الأيوبي", "جوهر الصقلي"], "answer": "صلاح الدين الأيوبي", "answerIndex": 2, "explanation": "«حتى جاء صلاح الدين الأيوبي (532–589هـ) الذي كان سنيًّا، فأغلقه، وظل الجامع الأزهر مغلقًا أكثر من قرن من الزمان، حتى أعيد افتتاحه في عهد الظاهر بيبرس (625–676هـ)»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-764", "question": "من أول من تولى مشيخة الأزهر؟", "choices": ["جوهر الصقلي", "الشيخ أحمد الطيب", "الشيخ محمد عبد الله الخراشي عام 1679م", "الشيخ محمود شلتوت"], "answer": "الشيخ محمد عبد الله الخراشي عام 1679م", "answerIndex": 2, "explanation": "«ويُجمع معظم المؤرخين على أن أول من تولى مشيخة الأزهر هو الشيخ محمد عبد الله الخراشي عام 1679م»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-765", "question": "على ماذا كانت الدراسة في الأزهر مقصورة في بادئ الأمر؟", "choices": ["على الرياضيات والطبيعة والكيمياء", "على علوم التربية وعلم النفس", "على العلوم الدينية واللغوية", "على علوم الفلك والحساب والطب"], "answer": "على العلوم الدينية واللغوية", "answerIndex": 2, "explanation": "«وكانت الدراسة فيه في بادئ الأمر مقصورة على العلوم الدينية واللغوية، ثم ما لبث أن دُرست فيه علوم الفلك والحساب والطب والجغرافيا»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-766", "question": "ما الذي صار إليه الأزهر في العلوم الدينية والعربية والثقافية؟", "choices": ["أول جامعة في العالم", "كعبة العلوم الدينية والعربية والثقافية في مصر والعالم الإسلامي أجمع", "أقدم مكتبة في العالم الإسلامي", "أكبر مسجد في مصر"], "answer": "كعبة العلوم الدينية والعربية والثقافية في مصر والعالم الإسلامي أجمع", "answerIndex": 1, "explanation": "«حتى صار كعبة العلوم الدينية والعربية والثقافية في مصر والعالم الإسلامي أجمع»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-767", "question": "من العلماء الأجلاء الذين تخرجوا في الأزهر وذُكروا في الدرس؟", "choices": ["الحافظ ابن حجر، وجلال الدين السيوطي، وجمال الدين ابن منظور", "الخوارزمي وابن الهيثم والرازي", "ابن خلدون وابن سينا والفارابي", "الشافعي ومالك وأبو حنيفة"], "answer": "الحافظ ابن حجر، وجلال الدين السيوطي، وجمال الدين ابن منظور", "answerIndex": 0, "explanation": "«وقد تخرج في الأزهر الشريف منذ نشأته كثير من العلماء الأجلاء الذين ما زلنا ننهل من علمهم الزاخر، ومؤلفاتهم الثمينة حتى يومنا هذا، منهم: (الحافظ ابن حجر، وجلال الدين السيوطي، وجمال الدين ابن منظور)»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-768", "question": "من أول من نادى بالإصلاح والتجديد في العالم العربي؟", "choices": ["الشيخ حسن العطار (1766–1835م)", "الشيخ رفاعة الطهطاوي", "الزعيم سعد زغلول", "الشيخ محمد عبده"], "answer": "الشيخ حسن العطار (1766–1835م)", "answerIndex": 0, "explanation": "«الشيخ حسن العطار (1766–1835م) الذي يُعد أول من نادى بالإصلاح والتجديد في العالم العربي»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-769", "question": "من أول من لُقب بـ«الإمام الأكبر» في العصر الحديث؟", "choices": ["الشيخ محمود شلتوت (1893–1963م)", "الشيخ أحمد الطيب", "السلطان سليم الأول", "الشيخ محمد عبد الله الخراشي"], "answer": "الشيخ محمود شلتوت (1893–1963م)", "answerIndex": 0, "explanation": "«وأول من لُقب بـ(الإمام الأكبر) في العصر الحديث هو الشيخ محمود شلتوت (1893–1963م)»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-770", "question": "ما القيمة المكتسبة من درس «الأزهر الشريف حصن الدين واللغة»؟", "choices": ["الأزهر اقتصر على العلوم الدينية", "يعد الأزهر الشريف حصنًا للدين واللغة", "الأزهر أغلق نهائيًا بعد صلاح الدين", "الأزهر أقدم جامعة في أوروبا"], "answer": "يعد الأزهر الشريف حصنًا للدين واللغة", "answerIndex": 1, "explanation": "«من القيم المكتسبة لموضوع (الأزهر حصن الدين واللغة): 1- يعد الأزهر الشريف حصنًا للدين واللغة. 2- للأزهر الشريف مكانة عظمى ومرموقة في نفوس المسلمين»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-771", "question": "من لُقب بأبي الكيمياء؟", "choices": ["الحسن بن الهيثم", "جابر بن حيان", "محمد بن موسى الخوارزمي", "أبو بكر الرازي"], "answer": "جابر بن حيان", "answerIndex": 1, "explanation": "«هو أبو عبد الله جابر بن حيان بن عبد الله الكوفي (ت 198هـ = 813م) لُقب بأبي الكيمياء التي غدت على يديه علمًا قائمًا على التجربة»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-772", "question": "بمَ عبر جابر بن حيان عن منهجه؟", "choices": ["عليك بالتقليد لتصل إلى المعرفة", "عليك بالسفر لتصل إلى المعرفة", "عليك بالتجربة لتصل إلى المعرفة", "عليك بالحفظ لتصل إلى المعرفة"], "answer": "عليك بالتجربة لتصل إلى المعرفة", "answerIndex": 2, "explanation": "«وقد عبر عن منهجه هذا بقوله: (عليك بالتجربة لتصل إلى المعرفة)»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-773", "question": "ما أشهر مؤلفات جابر بن حيان؟", "choices": ["الخواص الكبير", "المختصر في الجبر والمقابلة", "الحاوي", "المناظر"], "answer": "الخواص الكبير", "answerIndex": 0, "explanation": "«ومن أهم مؤلفات جابر بن حيان كتاب: (الخواص الكبير) وكتاب: (الاستتمام)، وكتاب: (الاستيفاء)»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-774", "question": "ما أشهر كتب الرازي في الطب؟", "choices": ["الحاوي", "المناظر", "الخواص الكبير", "المختصر في الجبر والمقابلة"], "answer": "الحاوي", "answerIndex": 0, "explanation": "«ويعتبر كتابه «الحاوي» من أجلّ كتبه، وأعظمها في مجال الطب، وظل الحاوي المرجع الأساسي في أوروبا لمدة تزيد على أربعمائة عام»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-775", "question": "من أول من أدخل المركبات الكيميائية في العلاج الطبي؟", "choices": ["الخوارزمي", "الرازي", "ابن الهيثم", "جابر بن حيان"], "answer": "الرازي", "answerIndex": 1, "explanation": "«وكان الرازي أول من أدخل المركبات الكيميائية في العلاج الطبي»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-776", "question": "ما الذي صححه ابن الهيثم في فكرة الإبصار؟", "choices": ["أن الرؤية لا تحتاج إلى عدسة العين", "أن الإبصار يتم بانعكاس الضوء من العين إلى الأجسام", "أن الإبصار يتم بواسطة سقوط الضوء على الأجسام، ومن ثم انعكاسه على عدسة العين", "أن العين ترى ذاتيًا دون ضوء"], "answer": "أن الإبصار يتم بواسطة سقوط الضوء على الأجسام، ومن ثم انعكاسه على عدسة العين", "answerIndex": 2, "explanation": "«ولكن الحسن كشف عن طريق نظرية انعكاس الضوء أن الإبصار يتم بواسطة سقوط الضوء على الأجسام، ومن ثم انعكاسه على عدسة العين ما يمكنها من الرؤية للأجسام»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-777", "question": "ما أعظم مؤلفات ابن الهيثم؟", "choices": ["الخواص الكبير", "المختصر في الجبر والمقابلة", "الحاوي", "المناظر"], "answer": "المناظر", "answerIndex": 3, "explanation": "«ومن أعظم مؤلفاته كتاب (المناظر) لما يجمعه من اعتبارات رياضية وفيزيائية وتجريبية، وفسيولوجية، وسيكولوجية بطريق متكاملة»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-778", "question": "ما المنهج الذي أخذ به ابن الهيثم؟", "choices": ["التقليد والمحاكاة", "الحدس والتخمين", "الحفظ والتلقين", "الاستقراء والمشاهدة والاستنتاج"], "answer": "الاستقراء والمشاهدة والاستنتاج", "answerIndex": 3, "explanation": "«فقد أخذ بمنهج الاستقراء والمشاهدة والاستنتاج؛ مما وضعه في مقدمة علماء الطبيعة النظرية»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-779", "question": "من أول عربي وأقدم مؤلف في علم الجبر؟", "choices": ["ابن الهيثم", "جابر بن حيان", "الرازي", "الخوارزمي"], "answer": "الخوارزمي", "answerIndex": 3, "explanation": "«وإليه ينسب علم الجبر، فهو أول عربي وأقدم مؤلف في علم الجبر»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-780", "question": "ما القيمة المكتسبة من درس «من رواد الحضارة الإسلامية»؟", "choices": ["رواد الحضارة اقتصروا على علم واحد", "العلماء المسلمون نقلوا العلوم دون إضافة", "الحضارة الإسلامية لم تعرف المنهج العلمي", "أثرى العلماء المسلمون الأوائل الحياة العلمية بشتى العلوم"], "answer": "أثرى العلماء المسلمون الأوائل الحياة العلمية بشتى العلوم", "answerIndex": 3, "explanation": "«من القيم المكتسبة لموضوع (من رواد الحضارة الإسلامية): 1- أثرى العلماء المسلمون الأوائل الحياة العلمية بشتى العلوم. 2- استخدم العلماء المسلمون عدة مناهج في دراساتهم منها: العلمي، والوصفي، والاستنباطي»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-781", "question": "من قائل نص «الكتاب»؟", "choices": ["أحمد شوقي", "إسماعيل صبري باشا", "ابن الرومي", "الأصمعي"], "answer": "أحمد شوقي", "answerIndex": 0, "explanation": "«الكتاب للشاعر أحمد شوقي»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-782", "question": "بمَ لُقب أحمد شوقي؟", "choices": ["شيخ الشعراء", "أمير الشعراء", "والد الجبر", "أبو الكيمياء"], "answer": "أمير الشعراء", "answerIndex": 1, "explanation": "«وُلد الشاعر أحمد شوقي في القاهرة سنة 1868م، ولُقب بـ(أمير الشعراء سخرية والاستهزاء من أولئك الكسالى"], "answer": "السخرية والاستهزاء من أولئك الكسالى", "answerIndex": 3, "explanation": "««كن حجرًا في مجاهل البيداء»: أمر، غرضه: السخرية والاستهزاء من أولئك الكسالى، وهو تعبير يصور الخاملين والكسالى القاعدين عن طلب العلم أو الرزق بحجر مهمل في صحراء مقفرة بعيدة»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "المطالعة والنصوص", "id": "h26-g8-800", "question": "ما الشطر الثاني من بيت «إنما الأرض والفضاء كتاب»؟", "choices": ["رتبة العارفين والحكماء", "فاقرءوه معاشر الأذكياء", "لم تحزه قرائح العلماء", "وصل الصبح دائبًا بالمساء"], "answer": "فاقرءوه معاشر الأذكياء", "answerIndex": 1, "explanation": "«إنما الأرض والفضاء كتاب * فاقرءوه معاشر الأذكياء»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-801", "question": "ما أركان موضوع الإنشاء الثلاثة؟", "choices": ["المقدمة والصلب والعنوان", "الفكرة والأسلوب والعنوان", "مقدمة الموضوع، وصلب الموضوع، وخاتمة الموضوع", "المقدمة والخاتمة فقط"], "answer": "مقدمة الموضوع، وصلب الموضوع، وخاتمة الموضوع", "answerIndex": 2, "explanation": "«موضوع الإنشاء يتكون من: 1- مقدمة الموضوع. 2- صلب الموضوع. 3- خاتمة الموضوع»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-802", "question": "ماذا يُذكر في مقدمة موضوع الإنشاء؟", "choices": ["الحديث عن كل فكرة من الأفكار الجزئية", "ملخص الموضوع والمقترحات", "انتقاء الألفاظ وتصويب الأخطاء", "التعريف بالموضوع، وتحديد الفكرة التي سيتناول الموضوع من خلالها"], "answer": "التعريف بالموضوع، وتحديد الفكرة التي سيتناول الموضوع من خلالها", "answerIndex": 3, "explanation": "«وفي المقدمة يُذكر: التعريف بالموضوع، وتحديد الفكرة التي سيتناول الموضوع من خلالها»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-803", "question": "ماذا يكون في صلب موضوع الإنشاء؟", "choices": ["الحديث عن كل فكرة من الأفكار الجزئية", "ملخص الموضوع والمقترحات", "التعريف بالموضوع وتحديد الفكرة", "القراءة المتأنية الواعية عن الموضوع"], "answer": "الحديث عن كل فكرة من الأفكار الجزئية", "answerIndex": 0, "explanation": "«فيكون الحديث فيه عن كل فكرة من الأفكار الجزئية، وذلك عن طريق الجمل التي تنظم لتشكل الفقرة، ومن مجموع الفقرات يتكون الموضوع»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-804", "question": "ماذا يتم التركيز عليه في خاتمة موضوع الإنشاء؟", "choices": ["ملخص الموضوع، والمقترحات", "تبادل الأفكار مع الزملاء", "التعريف بالموضوع", "الحديث عن الأفكار الجزئية"], "answer": "ملخص الموضوع، والمقترحات", "answerIndex": 0, "explanation": "«في الخاتمة: يتم التركيز على ملخص الموضوع، والمقترحات»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-805", "question": "أي مما يأتي من الأمور التي تُعين على الإنشاء؟", "choices": ["كثرة الكلام", "تقوى الله", "تجاهل علامات الترقيم", "الإسراع في الكتابة"], "answer": "تقوى الله", "answerIndex": 1, "explanation": "«ومن الأمور التي تُعين على الإنشاء» «6- تقوى الله، قال تعالى:» ﴿وَاتَّقُوا اللَّهَ وَيُعَلِّمُكُمُ اللَّهُ﴾ [البقرة: 282]", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-806", "question": "إلى كم قسم ينقسم التعبير الكتابي من حيث الغرض منه؟", "choices": ["أربعة أقسام", "قسم واحد", "ثلاثة أقسام", "قسمان: الإبداعي والوظيفي"], "answer": "قسمان: الإبداعي والوظيفي", "answerIndex": 3, "explanation": "«ينقسم التعبير الكتابي من حيث الغرض منه إلى: التعبير الكتابي الإبداعي، والتعبير الكتابي الوظيفي»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-807", "question": "ما المقصود بالتعبير الكتابي الإبداعي؟", "choices": ["النوع الذي يعبر عن الحقائق العلمية فقط", "النوع الذي ينقل الأخبار والمعلومات بأسلوب مباشر", "ذلك النوع الذي يعبر عن الأفكار والخواطر النفسية، وينقلها إلى الآخرين بأسلوب أدبي مشوق ومثير", "النوع الذي يقتصر على كتابة الرسائل الرسمية"], "answer": "ذلك النوع الذي يعبر عن الأفكار والخواطر النفسية، وينقلها إلى الآخرين بأسلوب أدبي مشوق ومثير", "answerIndex": 2, "explanation": "«يقصد بالتعبير الكتابي الإبداعي ذلك النوع الذي يعبر عن الأفكار والخواطر النفسية، وينقلها إلى الآخرين بأسلوب أدبي مشوق ومثير»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-808", "question": "بمَ يتسم التعبير الإبداعي في العرض والأداء؟", "choices": ["بالفنية؛ فأسلوبه مصقول، وعبارته منتقاة", "بالجفاف والاختصار الشديد", "بالاعتماد على الأرقام والإحصاءات", "بغياب الصور والتخيل"], "answer": "بالفنية؛ فأسلوبه مصقول، وعبارته منتقاة", "answerIndex": 0, "explanation": "«ويتسم هذا النوع بالفنية في العرض والأداء؛ فأسلوبه مصقول، وعبارته منتقاة، وفيه الرغبة في التأثير على السامع باصطناع الصور والتخيل»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-809", "question": "أي مما يأتي من مجالات التعبير الإبداعي؟", "choices": ["كتابة التقارير الرسمية", "ملء الاستمارات الحكومية", "كتابة محاضر الاجتماعات", "كتابة القصة"], "answer": "كتابة القصة", "answerIndex": 3, "explanation": "«ومن مجالاته: كتابة القصة، والمسرحية، وفن المقال الأدبي، وفن التراجم، وكتابة القصيدة، والوصف، وإعداد المقالات، والخطب»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-810", "question": "ما التعبير الحواري؟", "choices": ["هو الذي يقدم صورة حية لما يقع تحت الحواس", "هو الذي ينقل الأخبار بأسلوب مباشر", "هو الذي يُؤدى عن طريق الكلمات والجمل من خلال حوار قائم بين اثنين أو أكثر", "هو الذي يعبر عن الأفكار بأسلوب أدبي مشوق"], "answer": "هو الذي يُؤدى عن طريق الكلمات والجمل من خلال حوار قائم بين اثنين أو أكثر", "answerIndex": 2, "explanation": "«التعبير الحواري هو الذي يُؤدى عن طريق الكلمات والجمل من خلال حوار قائم بين اثنين أو أكثر»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-811", "question": "ما أول ما يراعى في التعبير الحواري؟", "choices": ["التعصب لرأي معين", "الالتزام باللغة العربية الفصحى", "استخدام العامية", "تسفيه الرأي الآخر"], "answer": "الالتزام باللغة العربية الفصحى", "answerIndex": 1, "explanation": "«(أ) الالتزام باللغة العربية الفصحى»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-812", "question": "ما موضوع الحوار بين الأستاذ وطلابه في الكتاب؟", "choices": ["آداب الطعام", "تأخير الأعمال عن أوقاتها", "فضل العلم", "أهمية القراءة"], "answer": "تأخير الأعمال عن أوقاتها", "answerIndex": 1, "explanation": "«وفيما يلي حوار بين أستاذ وطلابه عن: تأخير الأعمال عن أوقاتها»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-813", "question": "ما أول الأسباب التي تؤدي إلى تأخير الأعمال عن أوقاتها كما ذكرها عبد الرحمن؟", "choices": ["سوء استعمال وسائل الاتصال الحديثة", "عدم احترام التخصص", "الصحبة السيئة", "مجالس اللهو"], "answer": "الصحبة السيئة", "answerIndex": 2, "explanation": "«قال عبد الرحمن: من الأسباب التي تؤدي إلى تأخير الأعمال عن أوقاتها: الصحبة السيئة» ويحذرنا الشاعر من هذه الصحبة فيقول: «واحذر مؤاخاة الدنيء لأنه يعدي كما يعدي الصحيح الأجرب»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-814", "question": "بمَ نبه المعلم طلابه في ختام الحوار؟", "choices": ["أن الطلاب لم يذكروا أي سبب", "أن الحوار لم يلتزم بالفصحى", "أن بعض الأقوال خلطت بين السبب وأثره", "أن كل الأقوال كانت أسبابًا صحيحة"], "answer": "أن بعض الأقوال خلطت بين السبب وأثره", "answerIndex": 2, "explanation": "«ولكنها خلطت بين السبب وأثره، فغضب الله، وجزاء من تتبع عورات الناس، وجزاء من يؤذي الناس بلسانه، من قبيل الآثار وليس من قبيل الأسباب»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-815", "question": "ما التعبير الوصفي؟", "choices": ["يعبر فيه الكاتب عن الحقائق العلمية", "ينقل فيه الكاتب الأخبار بأسلوب مباشر", "يقدم فيه الكاتب صورة حية لما يقع تحت حواسه، وما يمر بخاطره", "يقدم فيه الكاتب حوارًا بين اثنين أو أكثر"], "answer": "يقدم فيه الكاتب صورة حية لما يقع تحت حواسه، وما يمر بخاطره", "answerIndex": 2, "explanation": "«وفيه يقدم الكاتب صورة حية لما يقع تحت حواسه، وما يمر بخاطره»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-816", "question": "أي مما يأتي من الأوصاف التي تقع تحت الحواس؟", "choices": ["صادق", "طويل", "طيب القلب", "حزين"], "answer": "طويل", "answerIndex": 1, "explanation": "«فمن الأوصاف التي تقع تحت الحواس: طويل قصير أبيض أسود»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-817", "question": "أي مما يأتي من الأوصاف التي تدرك بالعقل؟", "choices": ["صادق", "أبيض", "قصير", "أسود"], "answer": "صادق", "answerIndex": 0, "explanation": "«ومن الأوصاف التي تمر بالخاطر، وهي الأوصاف التي تدرك بالعقل: صادق حزين طيب القلب هادئ»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-818", "question": "ما أول ما ينبغي أن يراعى في التعبير الوصفي؟", "choices": ["استخدام الأساليب الفصيحة", "الغلو والإسراف في استعمال الألفاظ", "تجاهل التشبيهات", "استخدام العامية"], "answer": "استخدام الأساليب الفصيحة", "answerIndex": 0, "explanation": "«1- استخدام الأساليب الفصيحة»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-819", "question": "ما حكم رسم الهمزة في كلمة «هيئة»؟", "choices": ["على نبرة؛ لأنها مسبوقة بياء ساكنة", "على الواو", "مفردة على السطر", "على الألف"], "answer": "على نبرة؛ لأنها مسبوقة بياء ساكنة", "answerIndex": 0, "explanation": "«إذا سبقت الهمزة بياء ساكنة رسمت على نبرة سواء أكانت الهمزة» ومثل: «هيئة، وبيئة، وخطيئة، ويجيئك، وجيئل»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-820", "question": "ما حركة همزة الوصل في الحرف (أل)؟", "choices": ["الضم", "الفتح", "السكون", "الكسر"], "answer": "الفتح", "answerIndex": 1, "explanation": "«1- الحرف (أل) وحركتها الفتح»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-821", "question": "ما حركة همزة الوصل في الأسماء العشرة المسموعة؟", "choices": ["الضم دائمًا", "الكسر إلا في «ايمن» ففيها الفتح", "السكون دائمًا", "الفتح دائمًا"], "answer": "الكسر إلا في «ايمن» ففيها الفتح", "answerIndex": 1, "explanation": "«2- الأسماء العشرة المسموعة، وهي: اسم است ابن ابنة ابنم امرؤ امرأة اثنان اثنتان ايمن في القسم، وحركتها الكسر إلا في»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-822", "question": "كيف ترسم الهمزة المتوسطة الساكنة إذا كان ما قبلها مفتوحًا؟", "choices": ["على واو", "مفردة على السطر", "على ألف", "على نبرة"], "answer": "على ألف", "answerIndex": 2, "explanation": "«فترسم على ألف إذا كان ما قبلها مفتوحا، مثل: رأى رأس كأس بأس»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-823", "question": "ما حكم رسم الهمزة في كلمة «أسئلة»؟", "choices": ["على نبرة؛ لأنها مكسورة", "مفردة على السطر", "على الألف", "على الواو"], "answer": "على نبرة؛ لأنها مكسورة", "answerIndex": 0, "explanation": "«إذا كانت الهمزة مكسورة رسمت على نبرة مطلقًا، سواء كان ما قبلها ساكنًا، مثل: أسئلة مسائل»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-824", "question": "كيف ترسم الهمزة المتطرفة إذا كان ما قبلها مكسورًا؟", "choices": ["على نبرة", "على واو", "على ألف", "مفردة على السطر"], "answer": "على نبرة", "answerIndex": 0, "explanation": "«فإن كان ما قبلها مكسورا: رسمت على نبرة، مثل: المبتدئ، المستهزئ القارئ»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-825", "question": "أين توضع الفصلة (،)؟", "choices": ["في نهاية الجمل المستفهم بها", "بين المفردات التي تذكر لبيان أقسام الشيء", "بين القول ومقوله", "في نهاية الجملة تامة المعنى"], "answer": "بين المفردات التي تذكر لبيان أقسام الشيء", "answerIndex": 1, "explanation": "«1- بين المفردات التي تذكر لبيان أقسام الشيء»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-826", "question": "أين توضع الفصلة المنقوطة (؛)؟", "choices": ["بين العدد والمعدود إذا وقعا عنوانًا", "في نهاية الجملة تامة المعنى", "بين جملتين تكون الثانية منهما سببًا في الأولى", "بعد المنادى"], "answer": "بين جملتين تكون الثانية منهما سببًا في الأولى", "answerIndex": 2, "explanation": "«2- بين جملتين تكون الثانية منهما سببًا في الأولى، أو تكون الجملة الثانية مسببة عن الأولى»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-827", "question": "أين توضع النقطة (.)؟", "choices": ["في نهاية الجمل المستفهم بها", "مكان المحذوف من الكلام", "بين القول ومقوله", "في نهاية الجملة تامة المعنى"], "answer": "في نهاية الجملة تامة المعنى", "answerIndex": 3, "explanation": "«توضع في نهاية الجملة تامة المعنى»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-828", "question": "أين توضع علامة الاستفهام (؟)؟", "choices": ["في نهاية الجملة تامة المعنى", "بين الشيء وأقسامه", "للجملة المعترضة", "في نهاية الجمل المستفهم بها"], "answer": "في نهاية الجمل المستفهم بها", "answerIndex": 3, "explanation": "«توضع في نهاية الجمل المستفهم بها»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-829", "question": "أين توضع علامة التأثر (!)؟", "choices": ["بين العدد والمعدود", "في نهاية الجمل المستفهم بها", "مكان المحذوف من الكلام", "في آخر الجمل التي يعبر بها عن فرح أو حزن أو تعجب أو استنكار أو دعاء"], "answer": "في آخر الجمل التي يعبر بها عن فرح أو حزن أو تعجب أو استنكار أو دعاء", "answerIndex": 3, "explanation": "«توضع في آخر الجمل التي يعبر بها عن فرح، أو حزن، أو تعجب، أو استنكار أو دعاء»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-830", "question": "ما الألف اللينة؟", "choices": ["هي الحرف التاسع والعشرون من حروف الهجاء", "هي الحرف الأول من حروف الهجاء", "هي ألف لا تكون إلا متحركة", "هي الحرف الثامن والعشرون من حروف الهجاء، ولا تكون إلا ساكنة مفتوحًا ما قبلها"], "answer": "هي الحرف الثامن والعشرون من حروف الهجاء، ولا تكون إلا ساكنة مفتوحًا ما قبلها", "answerIndex": 3, "explanation": "«الألف اللينة، هي الحرف الثامن والعشرون من حروف الهجاء، ولا تكون إلا ساكنة مفتوحا ما قبلها»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-831", "question": "كيف ترسم الألف المتوسطة حقيقة أو حكمًا؟", "choices": ["بالألف", "بالياء دائمًا", "بالواو", "تحذف"], "answer": "بالألف", "answerIndex": 0, "explanation": "«كل ألف وقعت متوسطة حقيقة أو حكما ترسم بالألف»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-832", "question": "كيف ترسم ألف الاسم المبني المختوم بالألف اللينة؟", "choices": ["بالياء دائمًا", "بالألف إلا في: أنى، ومتى، ولدى، وأولى، والألى فترسم ياء", "تحذف", "بالواو"], "answer": "بالألف إلا في: أنى، ومتى، ولدى، وأولى، والألى فترسم ياء", "answerIndex": 1, "explanation": "«كل اسم مبني مختوم بالألف اللينة ترسم ألفه ألفًا إلا في الأسماء الآتية: أنى، ومتى، ولدى وأولى والألى فترسم ياء»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-833", "question": "كيف ترسم الألف إذا أتت ثالثة في اسم معرب وكان أصلها الياء؟", "choices": ["بالألف", "تحذف", "بالياء", "بالواو"], "answer": "بالياء", "answerIndex": 2, "explanation": "«أن الألف في فتى رسمت بالياء؛ لأنها ثالثة، وأصلها الياء، بدليل تثنيتها على فتيان»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-834", "question": "كيف ترسم الألف الرابعة في اسم معرب إذا لم تسبق بياء؟", "choices": ["تحذف", "بالواو", "بالياء", "بالألف"], "answer": "بالياء", "answerIndex": 2, "explanation": "«أن الألف في: أعلى رسمت ياء؛ لأنها رابعة، وهي في اسم معرب ولم تسبق بياء»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-835", "question": "كيف ترسم الألف إذا وقعت رابعة فأكثر في اسم أعجمي؟", "choices": ["تحذف", "بالألف إلا في: موسى، وعيسى، وكسرى، وبخارى، ومتى فترسم بالياء", "بالياء دائمًا", "بالواو"], "answer": "بالألف إلا في: موسى، وعيسى، وكسرى، وبخارى، ومتى فترسم بالياء", "answerIndex": 1, "explanation": "«إذا وقعت الألف رابعة فأكثر في اسم أعجمي رسمت بالألف، إلا في: موسى، وعيسى، وكسرى، وبخارى، ومتى فترسم بالياء»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-836", "question": "كيف ترسم الألف في الفعل إذا كانت ثالثة وكان أصلها الواو؟", "choices": ["بالياء", "بالواو", "بالألف", "تحذف"], "answer": "بالألف", "answerIndex": 2, "explanation": "«ورسمت بالألف في: دعا؛ لأن أصلها الواو، بدليل مجيئها واوا في يدعو محمد أخاه دعوة»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-837", "question": "كيف ترسم الألف اللينة في الحروف؟", "choices": ["تحذف", "بالواو", "بالألف إلا في: إلى، وبلى، وحتى، وعلى فترسم بالياء", "بالياء دائمًا"], "answer": "بالألف إلا في: إلى، وبلى، وحتى، وعلى فترسم بالياء", "answerIndex": 2, "explanation": "«ترسم الحروف كلها بالألف، كما في: ألا، وإلا، وما، ولولا، لأصالة الألف بجمودها. ويستثنى من ذلك: إلى، وبلى، وحتى، وعلى فإنها ترسم بالياء»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-838", "question": "ما الحسد كما عرفته القطعة الثانية من قطع الإملاء؟", "choices": ["أن تساعد غيرك على الخير", "أن تكره الآلاء التي من الله بها على غيرك، وتحب زوالها عنه", "أن ترضى بما قضى الله", "أن تحب الخير لغيرك"], "answer": "أن تكره الآلاء التي من الله بها على غيرك، وتحب زوالها عنه", "answerIndex": 1, "explanation": "«الحسد: هو أن تكره الآلاء التي من الله بها على غيرك، وتحب زوالها عنه» وقد نعى القرآن على قوم محبتهم للمؤمنين البلايا بقوله: ﴿إِن تَمْسَسْكُمْ حَسَنَةٌ تَسُؤْهُمْ وَإِن تُصِبْكُمْ سَيِّئَةٌ يَفْرَحُوا بِهَا﴾ [آل عمران: 120]", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-839", "question": "ما المقصود بالخط؟", "choices": ["كتابة حروف اللغة منفصلة أو متصلة وفق معايير خاصة", "حفظ النصوص", "كتابة الحروف متصلة فقط", "رسم الصور والأشكال"], "answer": "كتابة حروف اللغة منفصلة أو متصلة وفق معايير خاصة", "answerIndex": 0, "explanation": "«الخط يقصد به: كتابة حروف اللغة منفصلة، أو متصلة، وفق معايير خاصة، إذا طبقت هذه المعايير تطبيقًا دقيقًا أصبحت الكتابة واضحة جميلة تسهل قراءتها»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-840", "question": "إلى كم فرع ترجع أنواع الخطوط في الدنيا؟", "choices": ["خمسة فروع", "ثلاثة فروع", "أربعة فروع: المسماري، والحبشي، والصيني، والمصري", "ستة فروع"], "answer": "أربعة فروع: المسماري، والحبشي، والصيني، والمصري", "answerIndex": 2, "explanation": "«أنواع الخطوط في الدنيا ترجع لأربعة فروع هي: (أ) الخط المسماري. (ب) الخط الحبشي. (ج) الخط الصيني. (د) الخط المصري»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-841", "question": "كم طورًا مرت بها الكتابة في العالم؟", "choices": ["ستة أطوار", "ثلاثة أطوار", "أربعة أطوار", "خمسة أطوار: التصويرية، والرمزية، والمقطعية، والصوتية، والهجائية"], "answer": "خمسة أطوار: التصويرية، والرمزية، والمقطعية، والصوتية، والهجائية", "answerIndex": 3, "explanation": "«الكتابة في العالم مرت بأطوار خمسة، هي: (أ) الكتابة التصويرية. (ب) الكتابة الرمزية. (ج) الكتابة المقطعية. (د) الكتابة الصوتية. (هـ) الكتابة الهجائية»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-842", "question": "ما العلاقة بين قلم الثلث وقلم الطومار في العرض؟", "choices": ["عرض رأس قلم الثلث ثلث عرض قلم الطومار", "قلم الثلث أعرض من قلم الطومار", "عرضهما متساوٍ", "قلم الثلث نصف عرض قلم الطومار"], "answer": "عرض رأس قلم الثلث ثلث عرض قلم الطومار", "answerIndex": 0, "explanation": "«لأنه يكتب بقلم عرض رأسه ثلث عرض قلم الطومار»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-843", "question": "كم شعرة يبلغ عرض قلم الطومار؟", "choices": ["اثنتا عشرة شعرة", "ست وثلاثون شعرة", "ثماني شعرات", "أربع وعشرون شعرة من شعر الفرس"], "answer": "أربع وعشرون شعرة من شعر الفرس", "answerIndex": 3, "explanation": "«وقلم الطومار يبلغ عرضه أربعًا وعشرين شعرة من شعر الفرس، وقلم الثلث منه بمقدار ثلثه أي ثمان شعرات»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-844", "question": "لماذا سمي خط النسخ بهذا الاسم؟", "choices": ["لأنه أول خط عربي", "لأن القرآن الكريم نسخ به", "لأنه يكتب بسرعة", "لأنه ينسخ من خط الثلث"], "answer": "لأن القرآن الكريم نسخ به", "answerIndex": 1, "explanation": "«وسمي بالنسخ؛ لأن القرآن الكريم نسخ به، وكذلك الكتب الدراسية، والصحف والمجلات»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-845", "question": "لماذا سمي خط الرقعة بهذا الاسم؟", "choices": ["لأنه يكتب على الرقاع الكبيرة", "لأنه يرقع الكتب القديمة", "لأنه خط صعب الكتابة", "لكثرة كتابته في الرقاع الصغيرة من الورق"], "answer": "لكثرة كتابته في الرقاع الصغيرة من الورق", "answerIndex": 3, "explanation": "«سمي الرقعة بذلك؛ لكثرة كتابته في الرقاع الصغيرة من الورق»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-846", "question": "من الذي ابتكر نقط الإعراب؟", "choices": ["نصر بن عاصم", "الخليل بن أحمد الفراهيدي", "يحيى بن يعمر", "أبو الأسود الدؤلي"], "answer": "أبو الأسود الدؤلي", "answerIndex": 3, "explanation": "«ففكر أبو الأسود الدؤلي في هذا الأمر» و«وبهذا يكون أبو الأسود الدؤلي وضع مقياسا للنطق السليم»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-847", "question": "من الذي ابتكر نقط الإعجام؟", "choices": ["عبد الملك بن مروان", "أبو الأسود الدؤلي", "الخليل بن أحمد الفراهيدي", "نصر بن عاصم ويحيى بن يعمر"], "answer": "نصر بن عاصم ويحيى بن يعمر", "answerIndex": 3, "explanation": "«فدعا الحجاج بن يوسف الثقفي: نصر بن عاصم، ويحيى ابن يعمر وسألهما أن يضعا علامات تمنع التحريف والتصحيف؛ فقررا إعجام بعض الحروف، وإهمال بعضها»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-848", "question": "من الذي طور نقط الإعراب وحوله إلى الشكل المعروف الآن؟", "choices": ["الخليل بن أحمد الفراهيدي", "نصر بن عاصم", "يحيى بن يعمر", "أبو الأسود الدؤلي"], "answer": "الخليل بن أحمد الفراهيدي", "answerIndex": 0, "explanation": "«فجاء الخليل بن أحمد الفراهيدي ففكر في طريقة تزيل هذا اللبس فاختار الطريقة المتبعة الآن في الشكل»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-849", "question": "كم عدد الحروف المعجمة؟", "choices": ["عشرة أحرف", "ثمانية وعشرون حرفًا", "أربعة أحرف", "أربعة عشر حرفًا"], "answer": "أربعة عشر حرفًا", "answerIndex": 3, "explanation": "«القسم الأول: معجم وينحصر في أربعة عشر حرفًا، هي: الباء، والتاء، والثاء، والجيم، والخاء، والذال، والزاي، والشين، والضاد، والظاء، والغين، والفاء، والقاف، والنون»", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "فنون الكتابة", "id": "h26-g8-850", "question": "ما معنى كلمة «الروح» إذا نطقت بضم الراء؟", "choices": ["البستان", "النفس، أو ما به الحياة", "الجنون", "الراحة"], "answer": "النفس، أو ما به الحياة", "answerIndex": 1, "explanation": "«فكلمة الروح إن نطقت بضم الراء، كان معناها النفس، أو ما به الحياة، وإن نطقت بفتحها كان معناها الراحة. ومن الأول قوله تعالى:» ﴿وَيَسْأَلُونَكَ عَنِ الرُّوحِ قُلِ الرُّوحُ مِنْ أَمْرِ رَبِّي﴾ [الإسراء: 85]، ومن الثاني قوله تعالى: ﴿فَرَوْحٌ وَرَيْحَانٌ وَجَنَّتُ نَعِيمٍ﴾ [الواقعة: 89]", "type": "mcq", "topic": "", "source": "https://mtrl.azhar.gov.eg/education/books-2026/prep/%D8%B9%D8%B1%D8%A8%D9%8A2%D8%B9%20-%201.pdf"}, {"grade": 8, "subject": "التجويد", "id": "h26-g8-851", "question": "ما عدد أنواع اللامات الساكنة الواردة في القرآن الكريم؟", "choices": ["ثلاثة أنواع", "خمسة أنواع", "ستة أنواع", "أربعة أنواع"], "answer": "خمسة أنواع", "answerIndex": 1, "explanation": "«الساكن منها لا يخرج عن خمسة أنواع وهي: (1) لام أل التعريفية (2) لام الاسم (3) لام الفعل (4) لام الأمر (5) لام الحرف»", "type": "mcq", "topic": "", "source": "https://archive.org/download/bughyatut-tholibin-tajwid/Bughyatut%20Tholibin%20%28Tajwid%29_djvu.txt"}, {"grade": 8, "subject": "التجويد", "id": "h26-g8-852", "question": "ما تعريف لام أل التعريفية؟", "choices": ["اللام الواقعة في حرفي هل وبل", "اللام الساكنة الواقعة في فعل", "اللام الواقعة في كلمة اسمية وتكون حرفا من حروفها الأصلية", "اللام الساكنة التي يعبر عنها بلام التعريف، وهي زائدة على الكلمة التي تدخل عليها"], "answer": "اللام الساكنة التي يعبر عنها بلام التعريف، وهي زائدة على الكلمة التي تدخل عليها", "answerIndex": 3, "explanation": "«هي اللام الساكنة التي يعبر عنها بلام التعريف. وهي زائدة على الكلمة التي تدخل عليها نحو: الحكيم - المؤمنين»", "type": "mcq", "topic": "", "source": "https://archive.org/download/bughyatut-tholibin-tajwid/Bughyatut%20Tholibin%20%28Tajwid%29_djvu.txt"}, {"grade": 8, "subject": "التجويد", "id": "h26-g8-853", "question": "ما حكما لام أل قبل حروف الهجاء؟", "choices": ["الإخفاء والإدغام", "الإظهار فقط", "الإظهار والإدغام", "الإدغام فقط"], "answer": "الإظهار والإدغام", "answerIndex": 2, "explanation": "«ولها قبل حروف الهجاء حكمان هما: الإظهار والإدغام»", "type": "mcq", "topic": "", "source": "https://archive.org/download/bughyatut-tholibin-tajwid/Bughyatut%20Tholibin%20%28Tajwid%29_djvu.txt"}, {"grade": 8, "subject": "التجويد", "id": "h26-g8-854", "question": "كم حرفا تظهر لام أل قبلها؟", "choices": ["ستة عشر حرفا", "اثنا عشر حرفا", "أربعة عشر حرفا مجموعة في قول صاحب التحفة «ابغ حجك وخف عقيمه»", "عشرة أحرف"], "answer": "أربعة عشر حرفا مجموعة في قول صاحب التحفة «ابغ حجك وخف عقيمه»", "answerIndex": 2, "explanation": "«الحكم الأول: الإظهار. ويكون بوقوعها قبل أربعة عشر حرفا من حروف الهجاء جمعها صاحب التحفة في قوله: (ابغ حجك وخف عقيمه)»", "type": "mcq", "topic": "", "source": "https://archive.org/download/bughyatut-tholibin-tajwid/Bughyatut%20Tholibin%20%28Tajwid%29_djvu.txt"}, {"grade": 8, "subject": "التجويد", "id": "h26-g8-855", "question": "ما حكم لام أل في قوله تعالى ﴿وهو الغفور الرحيم﴾؟", "choices": ["إخفاء حقيقي", "إظهار قمري", "إدغام شمسي", "إقلاب"], "answer": "إظهار قمري", "answerIndex": 1, "explanation": "اللام في «الغفور» قبل الغين، والغين من حروف الإظهار الأربعة عشر في «ابغ حجك وخف عقيمه»، فيجب إظهارها ويسمى «إظهارا قمريا وتسمى اللام قمرية»", "type": "mcq", "topic": "", "source": "https://archive.org/download/bughyatut-tholibin-tajwid/Bughyatut%20Tholibin%20%28Tajwid%29_djvu.txt"}, {"grade": 8, "subject": "التجويد", "id": "h26-g8-856", "question": "ما حكم لام أل في قوله تعالى ﴿والسماء والطارق﴾؟", "choices": ["إدغام شمسي", "إظهار قمري", "إخفاء حقيقي", "إدغام بغنة"], "answer": "إدغام شمسي", "answerIndex": 0, "explanation": "اللام في «الطارق» قبل الطاء، والطاء من حروف الإدغام في «طب ثم صل رحما تفز ضف ذا نعم»، فيجب إدغامها ويسمى «إدغاما شمسيا وتسمى اللام شمسية»", "type": "mcq", "topic": "", "source": "https://archive.org/download/bughyatut-tholibin-tajwid/Bughyatut%20Tholibin%20%28Tajwid%29_djvu.txt"}, {"grade": 8, "subject": "التجويد", "id": "h26-g8-857", "question": "كم حرفا تدغم لام أل قبلها؟", "choices": ["اثنا عشر حرفا", "أربعة عشر حرفا أولها في «طب ثم صل رحما تفز ضف ذا نعم»", "عشرة أحرف", "ثمانية عشر حرفا"], "answer": "أربعة عشر حرفا أولها في «طب ثم صل رحما تفز ضف ذا نعم»", "answerIndex": 1, "explanation": "«الحكم الثاني: الإدغام: ويكون بوقوعها قبل أربعة عشر حرفا من حروف الهجاء جمعها صاحب التحفة في أوائل كلمات هذا البيت: طب ثم صل رحما تفز ضف ذا نعم»", "type": "mcq", "topic": "", "source": "https://archive.org/download/bughyatut-tholibin-tajwid/Bughyatut%20Tholibin%20%28Tajwid%29_djvu.txt"}, {"grade": 8, "subject": "التجويد", "id": "h26-g8-858", "question": "ما تعريف لام الاسم؟", "choices": ["اللام الواقعة في كلمة اسمية وتكون حرفا من حروفها الأصلية", "اللام الساكنة الزائدة عن بنية الكلمة وبعدها فعل مضارع", "اللام الساكنة الواقعة في فعل", "اللام الساكنة التي يعبر عنها بلام التعريف"], "answer": "اللام الواقعة في كلمة اسمية وتكون حرفا من حروفها الأصلية", "answerIndex": 0, "explanation": "«هي اللام الواقعة في كلمة اسمية وتكون حرفا من حروفها الأصلية»", "type": "mcq", "topic": "", "source": "https://archive.org/download/bughyatut-tholibin-tajwid/Bughyatut%20Tholibin%20%28Tajwid%29_djvu.txt"}, {"grade": 8, "subject": "التجويد", "id": "h26-g8-859", "question": "ما حكم لام الاسم؟", "choices": ["الإخفاء مطلقا", "وجوب الإدغام مطلقا", "وجوب الإظهار مطلقا", "الإظهار قبل حروف والإدغام قبل حروف"], "answer": "وجوب الإظهار مطلقا", "answerIndex": 2, "explanation": "«حكمها: وجوب الإظهار مطلقا، أمثلتها: ألسنتكم وألوانكم، سلطانا، ألفافا»", "type": "mcq", "topic": "", "source": "https://archive.org/download/bughyatut-tholibin-tajwid/Bughyatut%20Tholibin%20%28Tajwid%29_djvu.txt"}, {"grade": 8, "subject": "التجويد", "id": "h26-g8-860", "question": "ما مثال لام الاسم في القرآن الكريم؟", "choices": ["﴿قل هو الله أحد﴾", "﴿بل هم في شك يلعبون﴾", "﴿والسماء والطارق﴾", "﴿وجنات ألفافا﴾"], "answer": "﴿وجنات ألفافا﴾", "answerIndex": 3, "explanation": "«ألفافا: لام اسم حكمها الإظهار مطلقا»", "type": "mcq", "topic": "", "source": "https://archive.org/download/bughyatut-tholibin-tajwid/Bughyatut%20Tholibin%20%28Tajwid%29_djvu.txt"}, {"grade": 8, "subject": "التجويد", "id": "h26-g8-861", "question": "ما تعريف لام الفعل؟", "choices": ["اللام الساكنة الواقعة في فعل، سواء كان ماضيا أو مضارعا أو أمرا", "اللام الساكنة الزائدة عن بنية الكلمة وبعدها فعل مضارع", "اللام الواقعة في حرفي هل وبل", "اللام الساكنة التي يعبر عنها بلام التعريف"], "answer": "اللام الساكنة الواقعة في فعل، سواء كان ماضيا أو مضارعا أو أمرا", "answerIndex": 0, "explanation": "«هي اللام الساكنة الواقعة ف , "054036": {"a": 36, "text": "وَلَقَدْ أَنذَرَهُم بَطْشَتَنَا فَتَمَارَوْا۟ بِٱلنُّذُرِ"}, "066002": {"a": 2, "text": "قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْ ۚ وَٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ"}, "051026": {"a": 26, "text": "فَرَاغَ إِلَىٰٓ أَهْلِهِۦ فَجَآءَ بِعِجْلٍۢ سَمِينٍۢ"}, "055010": {"a": 10, "text": "وَٱلْأَرْضَ وَضَعَهَا لِلْأَنَامِ"}, "071006": {"a": 6, "text": "فَلَمْ يَزِدْهُمْ دُعَآءِىٓ إِلَّا فِرَارًۭا"}, "054010": {"a": 10, "text": "فَدَعَا رَبَّهُۥٓ أَنِّى مَغْلُوبٌۭ فَٱنتَصِرْ"}, "057001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ"}, "076023": {"a": 23, "text": "إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ ٱلْقُرْءَانَ تَنزِيلًۭا"}, "056091": {"a": 91, "text": "فَسَلَٰمٌۭ لَّكَ مِنْ أَصْحَٰبِ ٱلْيَمِينِ"}, "050004": {"a": 4, "text": "قَدْ عَلِمْنَا مَا تَنقُصُ ٱلْأَرْضُ مِنْهُمْ ۖ وَعِندَنَا كِتَٰبٌ حَفِيظٌۢ"}, "052015": {"a": 15, "text": "أَفَسِحْرٌ هَٰذَآ أَمْ أَنتُمْ لَا تُبْصِرُونَ"}, "082018": {"a": 18, "text": "ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ"}, "070038": {"a": 38, "text": "أَيَطْمَعُ كُلُّ ٱمْرِئٍۢ مِّنْهُمْ أَن يُدْخَلَ جَنَّةَ نَعِيمٍۢ"}, "079027": {"a": 27, "text": "ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا"}, "052016": {"a": 16, "text": "ٱصْلَوْهَا فَٱصْبِرُوٓا۟ أَوْ لَا تَصْبِرُوا۟ سَوَآءٌ عَلَيْكُمْ ۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ"}, "105001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ ٱلْفِيلِ"}, "052024": {"a": 24, "text": "۞ وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌۭ لَّهُمْ كَأَنَّهُمْ لُؤْلُؤٌۭ مَّكْنُونٌۭ"}, "069013": {"a": 13, "text": "فَإِذَا نُفِخَ فِى ٱلصُّورِ نَفْخَةٌۭ وَٰحِدَةٌۭ"}, "067005": {"a": 5, "text": "وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ"}, "054009": {"a": 9, "text": "۞ كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ فَكَذَّبُوا۟ عَبْدَنَا وَقَالُوا۟ مَجْنُونٌۭ وَٱزْدُجِرَ"}, "072027": {"a": 27, "text": "إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا"}, "051031": {"a": 31, "text": "۞ قَالَ فَمَا خَطْبُكُمْ أَيُّهَا ٱلْمُرْسَلُونَ"}, "055015": {"a": 15, "text": "وَخَلَقَ ٱلْجَآنَّ مِن مَّارِجٍۢ مِّن نَّارٍۢ"}, "085007": {"a": 7, "text": "وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌۭ"}, "047001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ أَضَلَّ أَعْمَٰلَهُمْ"}, "078036": {"a": 36, "text": "جَزَآءًۭ مِّن رَّبِّكَ عَطَآءً حِسَابًۭا"}, "056045": {"a": 45, "text": "إِنَّهُمْ كَانُوا۟ قَبْلَ ذَٰلِكَ مُتْرَفِينَ"}, "050012": {"a": 12, "text": "كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ وَأَصْحَٰبُ ٱلرَّسِّ وَثَمُودُ"}, "071017": {"a": 17, "text": "وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلْأَرْضِ نَبَاتًۭا"}, "091013": {"a": 13, "text": "فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا"}, "079040": {"a": 40, "text": "وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ"}, "053038": {"a": 38, "text": "أَلَّا تَزِرُ وَازِرَةٌۭ وِزْرَ أُخْرَىٰ"}, "050015": {"a": 15, "text": "أَفَعَيِينَا بِٱلْخَلْقِ ٱلْأَوَّلِ ۚ بَلْ هُمْ فِى لَبْسٍۢ مِّنْ خَلْقٍۢ جَدِيدٍۢ"}, "049018": {"a": 18, "text": "إِنَّ ٱللَّهَ يَعْلَمُ غَيْبَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَٱللَّهُ بَصِيرٌۢ بِمَا تَعْمَلُونَ"}, "052012": {"a": 12, "text": "ٱلَّذِينَ هُمْ فِى خَوْضٍۢ يَلْعَبُونَ"}, "075005": {"a": 5, "text": "بَلْ يُرِيدُ ٱلْإِنسَٰنُ لِيَفْجُرَ أَمَامَهُۥ"}, "067003": {"a": 3, "text": "ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا ۖ مَّا تَرَىٰ فِى خَلْقِ ٱلرَّحْمَٰنِ مِن تَفَٰوُتٍۢ ۖ فَٱرْجِعِ ٱلْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍۢ"}, "056060": {"a": 60, "text": "نَحْنُ قَدَّرْنَا بَيْنَكُمُ ٱلْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ"}, "091014": {"a": 14, "text": "فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا"}, "055074": {"a": 74, "text": "لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ"}, "073005": {"a": 5, "text": "إِنَّا سَنُلْقِى عَلَيْكَ قَوْلًۭا ثَقِيلًا"}, "050029": {"a": 29, "text": "مَا يُبَدَّلُ ٱلْقَوْلُ لَدَىَّ وَمَآ أَنَا۠ بِظَلَّٰمٍۢ لِّلْعَبِيدِ"}, "051053": {"a": 53, "text": "أَتَوَاصَوْا۟ بِهِۦ ۚ بَلْ هُمْ قَوْمٌۭ طَاغُونَ"}, "070014": {"a": 14, "text": "وَمَن فِى ٱلْأَرْضِ جَمِيعًۭا ثُمَّ يُنجِيهِ"}, "077048": {"a": 48, "text": "وَإِذَا قِيلَ لَهُمُ ٱرْكَعُوا۟ لَا يَرْكَعُونَ"}, "083014": {"a": 14, "text": "كَلَّا ۖ بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ"}, "047002": {"a": 2, "text": "وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَءَامَنُوا۟ بِمَا نُزِّلَ عَلَىٰ مُحَمَّدٍۢ وَهُوَ ٱلْحَقُّ مِن رَّبِّهِمْ ۙ كَفَّرَ عَنْهُمْ سَيِّـَٔاتِهِمْ وَأَصْلَحَ بَالَهُمْ"}, "055024": {"a": 24, "text": "وَلَهُ ٱلْجَوَارِ ٱلْمُنشَـَٔاتُ فِى ٱلْبَحْرِ كَٱلْأَعْلَٰمِ"}, "089008": {"a": 8, "text": "ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ"}, "048007": {"a": 7, "text": "وَلِلَّهِ جُنُودُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا"}, "061010": {"a": 10, "text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ هَلْ أَدُلُّكُمْ عَلَىٰ تِجَٰرَةٍۢ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍۢ"}, "050026": {"a": 26, "text": "ٱلَّذِى جَعَلَ مَعَ ٱللَّهِ إِلَٰهًا ءَاخَرَ فَأَلْقِيَاهُ فِى ٱلْعَذَابِ ٱلشَّدِيدِ"}, "054011": {"a": 11, "text": "فَفَتَحْنَآ أَبْوَٰبَ ٱلسَّمَآءِ بِمَآءٍۢ مُّنْهَمِرٍۢ"}, "056041": {"a": 41, "text": "وَأَصْحَٰبُ ٱلشِّمَالِ مَآ أَصْحَٰبُ ٱلشِّمَالِ"}, "055043": {"a": 43, "text": "هَٰذِهِۦ جَهَنَّمُ ٱلَّتِى يُكَذِّبُ بِهَا ٱلْمُجْرِمُونَ"}, "048028": {"a": 28, "text": "هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًۭا"}, "075040": {"a": 40, "text": "أَلَيْسَ ذَٰلِكَ بِقَٰدِرٍ عَلَىٰٓ أَن يُحْۦِىَ ٱلْمَوْتَىٰ"}, "077049": {"a": 49, "text": "وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"}, "079018": {"a": 18, "text": "فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ"}, "048008": {"a": 8, "text": "إِنَّآ أَرْسَلْنَٰكَ شَٰهِدًۭا وَمُبَشِّرًۭا وَنَذِيرًۭا"}, "075036": {"a": 36, "text": "أَيَحْسَبُ ٱلْإِنسَٰنُ أَن يُتْرَكَ سُدًى"}, "089021": {"a": 21, "text": "كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّۭا دَكًّۭا"}, "067002": {"a": 2, "text": "ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًۭا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ"}, "056076": {"a": 76, "text": "وَإِنَّهُۥ لَقَسَمٌۭ لَّوْ تَعْلَمُونَ عَظِيمٌ"}, "068033": {"a": 33, "text": "كَذَٰلِكَ ٱلْعَذَابُ ۖ وَلَعَذَابُ ٱلْءَاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ"}, "072010": {"a": 10, "text": "وَأَنَّا لَا نَدْرِىٓ أَشَرٌّ أُرِيدَ بِمَن فِى ٱلْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًۭا"}, "055009": {"a": 9, "text": "وَأَقِيمُوا۟ ٱلْوَزْنَ بِٱلْقِسْطِ وَلَا تُخْسِرُوا۟ ٱلْمِيزَانَ"}, "089006": {"a": 6, "text": "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ"}, "061011": {"a": 11, "text": "تُؤْمِنُونَ بِٱللَّهِ وَرَسُولِهِۦ وَتُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ"}, "089005": {"a": 5, "text": "هَلْ فِى ذَٰلِكَ قَسَمٌۭ لِّذِى حِجْرٍ"}, "066001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ"}, "051032": {"a": 32, "text": "قَالُوٓا۟ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٍۢ مُّجْرِمِينَ"}, "050027": {"a": 27, "text": "۞ قَالَ قَرِينُهُۥ رَبَّنَا مَآ أَطْغَيْتُهُۥ وَلَٰكِن كَانَ فِى ضَلَٰلٍۭ بَعِيدٍۢ"}, "054028": {"a": 28, "text": "وَنَبِّئْهُمْ أَنَّ ٱلْمَآءَ قِسْمَةٌۢ بَيْنَهُمْ ۖ كُلُّ شِرْبٍۢ مُّحْتَضَرٌۭ"}, "048009": {"a": 9, "text": "لِّتُؤْمِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَتُعَزِّرُوهُ وَتُوَقِّرُوهُ وَتُسَبِّحُوهُ بُكْرَةًۭ وَأَصِيلًا"}, "077031": {"a": 31, "text": "لَّا ظَلِيلٍۢ وَلَا يُغْنِى مِنَ ٱللَّهَبِ"}, "080023": {"a": 23, "text": "كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ"}, "089009": {"a": 9, "text": "وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ"}}, EXPL={"3|الرياضيات|عالم الجمع والطرح": [{"t": "عالم الجمع والطرح", "k": "", "lines": ["بص يا حبيبي، لما نجمع، بنحط الأرقام تحت بعض: آحاد تحت آحاد، وعشرات تحت عشرات، ومئات تحت مئات."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["نبدأ الجمع من اليمين، من الآحاد. لو الناتج 10 أو أكتر، نكتب الآحاد ونرفع العشرة للعمود اللي جنبه. اسمها الحمل."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["في الطرح كمان نبدأ من الآحاد. لو الرقم اللي فوق أصغر، نستلف عشرة من العمود اللي جنبه."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["مثال: 45 + 28. نجمع 5 + 8 = 13، نكتب 3 ونرفع 1. بعدين 4 + 2 + 1 = 7. الناتج 73."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["اتأكد من الحل: الجمع نختبره بالطرح، والطرح نختبره بالجمع. لو رجعنا للرقم الأصلي يبقى الحل صح. يلا يا بطل."]}], "3|الرياضيات|عالم الزمن": [{"t": "عالم الزمن", "k": "", "lines": ["بص يا حبيبي، الساعة فيها 60 دقيقة، واليوم فيه 24 ساعة، والأسبوع 7 أيام."]}, {"t": "عالم الزمن", "k": "", "lines": ["العقرب الصغير بيقول الساعة، والعقرب الكبير بيقول الدقايق. لما الكبير على 6 نقول والنصف، ولما يكون على 3 نقول والربع."]}, {"t": "عالم الزمن", "k": "", "lines": ["الزمن المنقضي هو الفرق بين وقت البداية ووقت النهاية. من 3:00 لحد 5:30 يبقى ساعتين ونص."]}, {"t": "عالم الزمن", "k": "", "lines": ["السنة فيها 12 شهر، والشهر ممكن يكون 30 أو 31 يوم، وفبراير أقل."]}, {"t": "عالم الزمن", "k": "", "lines": ["اقرأ السؤال وشوف بيسأل عن ساعة ولا دقيقة ولا يوم، وبعدين اختار الوحدة الصح. يلا يا بطل."]}], "3|الرياضيات|مملكة الضرب": [{"t": "مملكة الضرب", "k": "", "lines": ["بص يا حبيبي، الضرب هو جمع الرقم نفسه كذا مرة. 4 × 3 يعني 4 + 4 + 4 = 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["جدول الضرب لازم نحفظه. ممكن نتعلمه بالعد بالقفزات: 3، 6، 9، 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["الترتيب مش بيغير الناتج: 4 × 3 = 3 × 4."]}, {"t": "مملكة الضرب", "k": "", "lines": ["أي رقم × 1 يساوي نفسه. وأي رقم × 0 يساوي صفر."]}, {"t": "مملكة الضرب", "k": "", "lines": ["لو السؤال فيه مجموعات متساوية، اعرف عدد المجموعات وعدد كل مجموعة واضرب. يلا يا بطل."]}], "3|الرياضيات|مملكة ا <script id="azhar-pro-js">
(function(){
"use strict";
document.addEventListener("keydown",function(e){
 if(!e.key)return;var tg=e.target;if(tg&&(tg.tagName==="INPUT"||tg.tagName==="SELECT"||tg.tagName==="TEXTAREA"))return;
 var k="١٢٣٤".indexOf(e.key);var n=k>=0?k+1:parseInt(e.key,10);
 if(n>=1&&n<=4){var ch=document.querySelectorAll("#chs button");if(ch&&ch[n-1]){ch[n-1].click();}}
});
function ageWord(a){if(!a)return"";return a===1?"سنة واحدة":a===2?"سنتان":a<=10?a+" سنين":a+" سنة"}
function greet(){
 try{
  if(typeof P==="undefined"||!P||!P.name)return;
  var app=document.getElementById("app");if(!app||app.querySelector("#azhi"))return;
  if(app.querySelector("#azparents"))return;
  var h1=app.querySelector("h1");if(!h1)return;
  var d=document.createElement("div");d.id="azhi";
  var age=P.age?(" · عمرك "+ageWord(P.age)):"";
  var goal=(P.set&&P.set.goal)?(" · هدفك اليوم "+P.set.goal+" أسئلة"):"";
  d.textContent="🌟 أهلًا بعودتك يا "+P.name+age+goal+" — يلا نكمل بطولاتك!";
  h1.parentNode.insertBefore(d,h1.nextSibling);
  var pb=document.createElement("button");pb.id="azpbtn";pb.className="btn gold";pb.style.cssText="width:100%;margin:6px 0 12px";
  pb.textContent="👨‍👩‍👧 ركن بابا وماما — سؤال للأهل ومساعدة لهم";
  pb.addEventListener("click",function(){window.__azParents()});
  d.parentNode.insertBefore(pb,d.nextSibling);
 }catch(e){}
}
var PQ=null;
function pqPick(){
 try{
  var pool=(window.RAW||[]).filter(function(r){return r&&r.choices&&r.choices.length>=3&&r.explanation&&["القرآن","التربية الإسلامية","العربي"].indexOf(r.subject)>=0});
  if(!pool.length)pool=(window.RAW||[]).filter(function(r){return r&&r.choices&&r.choices.length>=3&&r.explanation});
  if(!pool.length)return null;
  var q=pool[Math.floor(Math.random()*pool.length)];
  var ch=q.choices.slice();for(var i=ch.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ch[i];ch[i]=ch[j];ch[j]=t}
  return {q:q.question,ch:ch,ans:q.answer,exp:q.explanation,subj:q.subject};
 }catch(e){return null}
}
window.__azParents=function(){
 try{
  if(typeof P==="undefined"||!P)return;
  if(!PQ)PQ=pqPick();
  var girl=(typeof CFG!=="undefined"&&CFG.girl)||P.gender==="g";
  var kid=P.name, son=girl?"بنتكم":"ابنكم", his=girl?"ليها":"له";
  var ageTip=!P.age?"":P.age<=8?"في هذه السن، اللعب القصير المتكرر أفضل من الجلسات الطويلة: جولة واحدة (١٠ أسئلة) في اليوم تكفي، واحتفلوا بكل تقدّم صغير.":P.age<=10?"في هذه السن، مدة التركيز تصل إلى ٢٠ دقيقة: جولة أو جولتان يوميًا، ودَعوه يشرح لكم إجابته بصوته — الشرح بصوت عالٍ يثبّت المعلومة.":"في هذه السن يبدأ الاستعداد للامتحانات: شجّعوه على حلّ جولة كاملة دون تلميحات، ومراجعة الشرح بعد كل خطأ — فالخطأ الذي يصحّحه بنفسه لا يتكرر.";
  var qhtml=PQ?('<div class="card"><h2>🧠 سؤال لبابا وماما</h2><p class="sync">من مادة '+PQ.subj+' — جاوبوا مع '+kid+' واتناقشوا في السبب:</p><div class="qtext">'+PQ.q+'</div><div id="azpq">'+PQ.ch.map(function(c,i){return '<button class="choice" data-azpq="'+i+'"><span>'+c+'</span></button>'}).join("")+'</div><div id="azpfb"></div><button class="btn small ghost" id="azpnew">🔄 سؤال جديد للأهل</button></div>'):'';
  var h='<div id="azparents"><h1>👨‍👩‍👧 ركن بابا وماما</h1>'
   +'<p class="card">أهلًا بيكم! الركن ده معمول عشان تساعدوا '+kid+' يستمتع ويتعلم. '+his+' في كل مادة <b>١٠ تلميحات</b> بس — التلميح بيشيل اختيارات غلط وبيخصم ٥ نقط، وبيكسب تلميحات جديدة لما يكسب جولات في المادة.</p>'
   +qhtml
   +'<div class="card"><h2>🤝 كيف تساعدون '+son+'؟</h2><p>'+ageTip+'</p><p>· اسألوه كل يوم: «ماذا تعلّمتَ اليوم؟» ودَعوه يعلّمكم هو — أفضل تثبيت للمعلومة أن يشرحها بنفسه.<br>· اطّلعوا على تقريره من زرّ «تقريري» في اللعبة، وقارنوا تقدّمه أسبوعًا بأسبوع، وامدحوا الجهد لا الدرجة فقط.<br>· إذا واجه سؤالًا صعبًا، دعوه يستخدم تلميحًا أولًا قبل أن تخبروه بالإجابة.</p></div>'
   +'<div class="card"><h2>💬 أسئلة تفتح الكلام بعد اللعب</h2><p>· إيه أكتر سؤال عجبك النهاردة وليه؟<br>· إيه السؤال اللي غلطت فيه واتعلمت منه إيه؟<br>· لو هتعمل سؤال لبابا وماما، هيكون عن إيه؟<br>· إيه المادة اللي عايز تكسب فيها تلميحات زيادة؟</p></div>'
   +'<button class="btn" data-a="home">🏠 رجوع للعبة '+kid+'</button></div>';
  render(h);
  var nb=document.getElementById("azpnew");if(nb)nb.addEventListener("click",function(){PQ=pqPick();window.__azParents()});
  var box=document.getElementById("azpq");
  if(box)box.addEventListener("click",function(e){var b=e.target.closest("[data-azpq]");if(!b||!PQ)return;var pick=PQ.ch[+b.getAttribute("data-azpq")];var fb=document.getElementById("azpfb");
   if(pick===PQ.ans){b.classList.add("ok");fb.innerHTML='<div class="warn" style="background:#e8f5e9">🎉 إجابة صح! '+PQ.exp+'<br>اتكلموا مع '+kid+': ليه دي الإجابة الصح؟</div>'}
   else{b.classList.add("bad");fb.innerHTML='<div class="warn">قربتوا! الإجابة الصح: <b>'+PQ.ans+'</b><br>'+PQ.exp+'</div>'}});
 }catch(e){}
};
var mo=new MutationObserver(function(){greet()});
window.addEventListener("load",function(){var a=document.getElementById("app");if(a)mo.observe(a,{childList:true,subtree:true});greet()});
})();
</script>
