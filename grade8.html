e": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-5", "question": "أي الحالات التالية تحتفظ بشكلها وحجمها معًا عند نقلها من إناء إلى آخر؟", "choices": ["الحالة السائلة", "الحالة الصلبة", "حالة البلازما", "الحالة الغازية"], "answer": "الحالة الصلبة", "answerIndex": 1, "explanation": "المادة الصلبة لها شكل وحجم ثابتان لأن قوى التجاذب بين جسيماتها قوية وجسيماتها تهتز في مواضعها.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-6", "question": "لماذا تتخذ السوائل شكل الإناء الذي توضع فيه؟", "choices": ["لأن جسيماتها ثابتة لا تتحرك", "لأن السوائل بلا حجم ثابت", "لأن قوى التجاذب بين جسيماتها قوية جدًا", "لأن جسيماتها تنزلق وتتحرك وقوى التجاذب بينها متوسطة"], "answer": "لأن جسيماتها تنزلق وتتحرك وقوى التجاذب بينها متوسطة", "answerIndex": 3, "explanation": "من الدرس الأول: جسيمات السائل تستطيع الانزلاق فوق بعضها، فقوى التجاذب متوسطة لا تثبتها في مواضعها، فيأخذ السائل شكل الإناء مع بقاء حجمه ثابتًا.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-7", "question": "أي المواد التالية يمكن ضغطها بسهولة؟", "choices": ["الماء", "الحديد", "الهواء", "ملح الطعام"], "answer": "الهواء", "answerIndex": 2, "explanation": "الغازات قابلة للانضغاط لأن المسافات البينية بين جسيماتها كبيرة، أما المواد الصلبة والسائلة فجسيماتها متقاربة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-8", "question": "لماذا تنتشر جسيمات الغازات أسرع من جسيمات السوائل؟", "choices": ["لأن المسافات البينية بين جسيماتها أكبر وقوى التجاذب بينها أضعف", "لأن جسيمات الغاز أثقل", "لأن الغاز أبرد من السائل", "لأن جسيمات الغاز لا تتحرك"], "answer": "لأن المسافات البينية بين جسيماتها أكبر وقوى التجاذب بينها أضعف", "answerIndex": 0, "explanation": "من اختبارات الشاطر: انتشار الغازات أسرع لأن جسيماتها متباعدة وقوى التجاذب بينها ضعيفة، وتزداد سرعة الانتشار بارتفاع درجة الحرارة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-9", "question": "ما الحالة الرابعة للمادة؟", "choices": ["البخار", "الضباب", "الهلام", "البلازما"], "answer": "البلازما", "answerIndex": 3, "explanation": "من اختبارات الشاطر: البلازما هي الحالة الرابعة للمادة، وهي غاز متأين توجد فيه جسيمات مشحونة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-10", "question": "أي مما يلي من أمثلة البلازما في الطبيعة؟", "choices": ["الجليد والثلج", "الرمل والصخور", "البرق والشفق القطبي", "بخار الماء والضباب"], "answer": "البرق والشفق القطبي", "answerIndex": 2, "explanation": "من إجابات الشاطر: البرق والشفق القطبي مثالان على البلازما لارتباطهما بجسيمات مشحونة وحالات تأين في الغازات.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-11", "question": "ماذا يحدث لسرعة حركة جسيمات المادة عند ارتفاع درجة حرارتها؟", "choices": ["لا يتغير شيء في حركتها", "تزداد سرعة حركتها", "تقل سرعة حركتها", "تتوقف جسيماتها عن الحركة"], "answer": "تزداد سرعة حركتها", "answerIndex": 1, "explanation": "من اختبارات الشاطر: تزداد سرعة حركة الجسيمات بارتفاع درجة الحرارة، ولذلك ينتشر عبير الزهور أسرع في الجو الحار.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-12", "question": "ما وجه الشبه بين الزجاج والهواء رغم اختلاف حالتيهما؟", "choices": ["كلاهما بلا كتلة", "كلاهما مادة: له كتلة ويشغل حيزًا من الفراغ", "كلاهما سائل", "كلاهما غاز"], "answer": "كلاهما مادة: له كتلة ويشغل حيزًا من الفراغ", "answerIndex": 1, "explanation": "من الاختبار الأول للشاطر: الزجاج صلب والهواء غاز، لكن كليهما مادة لأن كل مادة لها كتلة وتشغل حيزًا من الفراغ.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-13", "question": "عند وضع رمل داخل محقن مغلق والضغط عليه بقوة، ماذا يحدث؟", "choices": ["يتحول إلى سائل", "يتبخر ويخرج من المحقن", "لا ينضغط تقريبًا لأن جسيماته متقاربة والمسافات البينية بينها صغيرة", "ينضغط كما ينضغط الهواء"], "answer": "لا ينضغط تقريبًا لأن جسيماته متقاربة والمسافات البينية بينها صغيرة", "answerIndex": 2, "explanation": "من اختبارات الشاطر: المواد الصلبة كالرمل لا تنضغط لأن جسيماتها متقاربة والمسافات البينية بينها صغيرة جدًا.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-14", "question": "أي مما يلي يصف جسيمات المادة الصلبة؟", "choices": ["بلا قوى تجاذب بينها", "تنزلق فوق بعضها بسهولة", "متقاربة وتهتز في مواضعها وقوى التجاذب بينها قوية", "متباعدة وتتحرك بحرية وقوى التجاذب بينها ضعيفة"], "answer": "متقاربة وتهتز في مواضعها وقوى التجاذب بينها قوية", "answerIndex": 2, "explanation": "جسيمات المادة الصلبة متقاربة جدًا وقوى التجاذب بينها قوية، فتهتز في مواضعها دون أن تغادرها، ولذلك يحتفظ الصلب بشكله وحجمه.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-15", "question": "يختلف انسياب السوائل حسب .........", "choices": ["لونها", "رائحتها", "لزوجتها", "كتلتها"], "answer": "لزوجتها", "answerIndex": 2, "explanation": "من بوكليت الأوائل: يختلف انسياب السوائل حسب لزوجتها؛ فالسائل الأكثر لزوجة يناب أبطأ من السائل الأقل لزوجة.", "type": "mcq", "topic": "", "source": "https://mozkratgahza.com/pdf/2191"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-16", "question": "ما اسم تحول المادة من الحالة الصلبة إلى الحالة السائلة؟", "choices": ["التجمد", "الانصهار", "التكاثف", "التبخر"], "answer": "الانصهار", "answerIndex": 1, "explanation": "الانصهار هو تحول المادة من الصلبة إلى السائلة عند اكتساب الطاقة الحرارية، كما ينصهر الجليد إلى ماء.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-17", "question": "ما اسم تحول المادة من الحالة السائلة إلى الحالة الصلبة؟", "choices": ["التجمد", "الانصهار", "التسامي", "التبخر"], "answer": "التجمد", "answerIndex": 0, "explanation": "التجمد هو تحول المادة من السائلة إلى الصلبة عند فقد الطاقة الحرارية، كما يتجمد الماء إلى جليد.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-18", "question": "ما اسم تحول المادة من الحالة الصلبة إلى الحالة الغازية مباشرة دون المرور بالحالة السائلة؟", "choices": ["التسامي", "الانصهار", "الغليان", "التكاثف"], "answer": "التسامي", "answerIndex": 0, "explanation": "التسامي تحول مباشر من الصلبة إلى الغازية دون المرور بالسائلة، كما يحدث لليود الصلب عند تسخينه.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-19", "question": "ما اسم العملية العكسية للتسامي؟", "choices": ["التساقط (الترسيب المباشر)", "التبخر", "التجمد", "الانصهار"], "answer": "التساقط (الترسيب المباشر)", "answerIndex": 0, "explanation": "التساقط أو الترسيب المباشر هو تحول المادة من الحالة الغازية إلى الصلبة مباشرة، وهو عكس التسامي.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-20", "question": "ما اسم تحول بخار الماء إلى ماء سائل؟", "choices": ["التسامي", "التكاثف", "الانصهار", "التبخر"], "answer": "التكاثف", "answerIndex": 1, "explanation": "التكاثف هو تحول المادة من الحالة الغازية إلى السائلة عند فقد الطاقة الحرارية، كما تتكاثف قطرات الماء على سطح بارد.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-21", "question": "يختفي اليود الصلب عند تسخينه ويتحول مباشرة إلى بخار؛ ما اسم هذه الظاهرة؟", "choices": ["التبخر", "التسامي", "التجمد", "الانصهار"], "answer": "التسامي", "answerIndex": 1, "explanation": "من اختبارات الشاطر: اليود الصلب يتسامى عند تسخينه فيتحول مباشرة إلى بخار دون المرور بالحالة السائلة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-22", "question": "لماذا تظل درجة حرارة الجليد ثابتة أثناء انصهاره رغم استمرار التسخين؟", "choices": ["لأن طاقة حركة الجسيمات تتوقف", "لأن الحرارة تتسرب كلها إلى الهواء", "لأن الطاقة المكتسبة تُستخدم في التغلب على قوى التجاذب بين الجسيمات وزيادة طاقة وضعها", "لأن الجليد لا يمتص الحرارة"], "answer": "لأن الطاقة المكتسبة تُستخدم في التغلب على قوى التجاذب بين الجسيمات وزيادة طاقة وضعها", "answerIndex": 2, "explanation": "من الاختبار الثاني للشاطر: الطاقة المكتسبة أثناء تغير الحالة تُستخدم في التغلب على قوى التجاذب وزيادة طاقة وضع الجسيمات، لا في زيادة متوسط طاقة حركتها، فتثبت درجة الحرارة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-23", "question": "ما الفرق بين التبخر والغليان من حيث مكان حدوث كل منهما؟", "choices": ["التبخر يحدث عند سطح السائل، والغليان يحدث في جميع أجزاء السائل", "كلاهما يحدث في جميع أجزاء السائل", "التبخر يحدث في جميع أجزاء السائل والغليان عند سطحه", "كلاهما يحدث عند السطح فقط"], "answer": "التبخر يحدث عند سطح السائل، والغليان يحدث في جميع أجزاء السائل", "answerIndex": 0, "explanation": "من اختبارات الشاطر: التبخر يحدث عند سطح السائل وفي أي درجة حرارة، بينما الغليان يحدث في جميع أجزاء السائل عند درجة الغليان.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-24", "question": "أي مما يلي يزيد من معدل تبخر سائل؟", "choices": ["ارتفاع درجة الحرارة وزيادة مساحة السطح وحركة الهواء", "تغطية السائل بإحكام", "انخفاض درجة الحرارة وزيادة الرطوبة", "تبريد السائل"], "answer": "ارتفاع درجة الحرارة وزيادة مساحة السطح وحركة الهواء", "answerIndex": 0, "explanation": "من الدرس الثاني: يزداد معدل التبخر بارتفاع درجة الحرارة وزيادة مساحة السطح المعرض وحركة الهواء وانخفاض الرطوبة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-25", "question": "لماذا يغلي الماء عند درجة حرارة أقل فوق قمم الجبال؟", "choices": ["لأن الجاذبية تضعف فوق الجبال", "لأن الضغط الجوي يقل كلما ارتفعنا فيقل معه درجة غليان الماء", "لأن الماء فوق الجبال أنقى", "لأن الهواء فوق الجبال أبرد فيمنع الغليان"], "answer": "لأن الضغط الجوي يقل كلما ارتفعنا فيقل معه درجة غليان الماء", "answerIndex": 1, "explanation": "من اختبارات الشاطر: الضغط الجوي يقل كلما ارتفعنا عن سطح البحر، فينخفض معه درجة غليان الماء.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-26", "question": "ما درجة غليان الماء التقريبية عند ارتفاع 1200 متر فوق سطح البحر؟", "choices": ["110 درجات مئوية", "90 درجة مئوية", "96 درجة مئوية", "100 درجة مئوية"], "answer": "96 درجة مئوية", "answerIndex": 2, "explanation": "من إجابات الاختبار الثاني للشاطر: عند ارتفاع 1200 متر تبلغ درجة غليان الماء نحو 96 درجة مئوية وفق العلاقة التقريبية المستخدمة في التدريب.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-27", "question": "لماذا يساعد القدر الكاتم (حلة الضغط) على طهي الطعام في زمن أقل؟", "choices": ["لأنه يمنع وصول الحرارة للطعام", "لأنه يبرد الماء بسرعة", "لأن الضغط داخله يخفض درجة غليان الماء", "لأن ارتفاع الضغط داخله يزيد درجة غليان الماء"], "answer": "لأن ارتفاع الضغط داخله يزيد درجة غليان الماء", "answerIndex": 3, "explanation": "من اختبارات الشاطر: ارتفاع الضغط داخل القدر الكاتم يزيد درجة غليان الماء، فيُطهى الطعام عند درجة حرارة أعلى وفي زمن أقل.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-28", "question": "أي العمليتين التاليتين تحدثان عند اكتساب المادة للطاقة الحرارية؟", "choices": ["التجمد والتكاثف", "التجمد والتبخر", "الانصهار والتكاثف", "الانصهار والتبخر"], "answer": "الانصهار والتبخر", "answerIndex": 3, "explanation": "الانصهار والتبخر والتسامي والغليان عمليات اكتساب للطاقة الحرارية، أما التجمد والتكاثف والتساقط فعمليات فقد لها.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-29", "question": "أي مما يلي من العوامل المؤثرة في درجتي الانصهار والغليان؟", "choices": ["شكل الإناء فقط", "لون المادة فقط", "كتلة المادة فقط", "الضغط ونقاوة المادة"], "answer": "الضغط ونقاوة المادة", "answerIndex": 3, "explanation": "من الاختبار الثاني للشاطر: من العوامل المؤثرة في درجتي الانصهار والغليان الضغط الواقع على المادة ونقاوتها.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-30", "question": "ما تعريف الطاقة الداخلية لجسم؟", "choices": ["كمية الحرارة المفقودة فقط", "متوسط طاقة حركة الجسيمات فقط", "طاقة وضع الجسيمات فقط", "مجموع طاقتي الحركة والوضع لجسيمات النظام"], "answer": "مجموع طاقتي الحركة والوضع لجسيمات النظام", "answerIndex": 3, "explanation": "من اختبارات الشاطر: الطاقة الداخلية هي مجموع طاقتي الحركة والوضع لجسيمات النظام، وتمييزها عن درجة الحرارة مطلوب في الامتحان.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-31", "question": "درجة الحرارة مقياس لـ .........", "choices": ["متوسط طاقة حركة جسيمات المادة", "مجموع طاقتي الحركة والوضع للجسيمات", "كمية الحرارة في الجسم", "عدد جسيمات المادة"], "answer": "متوسط طاقة حركة جسيمات المادة", "answerIndex": 0, "explanation": "درجة الحرارة مقياس لمتوسط طاقة حركة الجسيمات، بينما الطاقة الداخلية مجموع طاقتي الحركة والوضع.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-32", "question": "ما الفرق بين الحرارة ودرجة الحرارة؟", "choices": ["الحرارة ودرجة الحرارة الشيء نفسه", "الحرارة طاقة تنتقل بسبب اختلاف درجة الحرارة، ودرجة الحرارة مقياس لمتوسط طاقة حركة الجسيمات", "درجة الحرارة طاقة وكمية الحرارة مقياس", "الحرارة تُقاس بالترمومتر ودرجة الحرارة بالجول"], "answer": "الحرارة طاقة تنتقل بسبب اختلاف درجة الحرارة، ودرجة الحرارة مقياس لمتوسط طاقة حركة الجسيمات", "answerIndex": 1, "explanation": "من الدرس الثالث: الحرارة طاقة حرارية تنتقل من الجسم الأعلى درجة حرارة إلى الأقل، ودرجة الحرارة مقياس لمتوسط طاقة حركة الجسيمات.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-33", "question": "ما النظام الذي يتبادل المادة والطاقة مع الوسط المحيط؟", "choices": ["النظام المغلق", "النظام الثابت", "النظام المفتوح", "النظام المعزول"], "answer": "النظام المفتوح", "answerIndex": 2, "explanation": "من اختبارات الشاطر: النظام المفتوح يسمح بتبادل المادة والطاقة مع الوسط المحيط.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-34", "question": "ما النظام الذي يتبادل الطاقة مع الوسط المحيط دون تبادل المادة؟", "choices": ["النظام الماص", "النظام المعزول", "النظام المغلق", "النظام المفتوح"], "answer": "النظام المغلق", "answerIndex": 2, "explanation": "من اختبارات الشاطر: النظام المغلق يسمح بتبادل الطاقة دون المادة مع الوسط المحيط.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-35", "question": "ما النظام الذي لا يتبادل المادة ولا الطاقة مع الوسط المحيط؟", "choices": ["النظام المتزن", "النظام المعزول", "النظام المفتوح", "النظام المغلق"], "answer": "النظام المعزول", "answerIndex": 1, "explanation": "من اختبارات الشاطر: النظام المعزول لا يتبادل المادة أو الطاقة مع الوسط المحيط في النموذج المثالي.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-36", "question": "أي مما يلي مثال تقريبي عملي للنظام المعزول؟", "choices": ["كوب ماء مكشوف", "إناء طهي بلا غطاء", "الترمس (حافظ الحرارة)", "زجاجة مفتوحة"], "answer": "الترمس (حافظ الحرارة)", "answerIndex": 2, "explanation": "من إجابات الشاطر: الترمس مثال تقريبي للنظام المعزول لأنه يقلل انتقال الحرارة بين محتوياته والوسط المحيط.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-37", "question": "ما معنى أن الحرارة النوعية للحديد تساوي 450 جول لكل كيلوجرام لكل درجة مئوية؟", "choices": ["صهر كيلوجرام من الحديد يتطلب 450 جول", "تبريد كيلوجرام من الحديد يحرر 4500 جول", "رفع درجة حرارة كيلوجرام واحد من الحديد درجة مئوية واحدة يتطلب 450 جول", "رفع درجة حرارة جرام واحد من الحديد يتطلب 450 جول"], "answer": "رفع درجة حرارة كيلوجرام واحد من الحديد درجة مئوية واحدة يتطلب 450 جول", "answerIndex": 2, "explanation": "من الاختبار الثاني للشاطر: الحرارة النوعية 450 جول/كجم·°م تعني أن رفع حرارة 1 كجم من الحديد درجة واحدة يتطلب اكتساب 450 جول عند ثبات حالته.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-38", "question": "لماذا يُستخدم الماء في تبريد محركات السيارات (الردياتير)؟", "choices": ["لأن الماء أخف من المعادن", "لأن حرارته النوعية مرتفعة فيمتص طاقة كبيرة مع تغير أقل في درجة حرارته", "لأن الماء موصل رديء للحرارة", "لأن الماء يغلي عند درجة منخفضة"], "answer": "لأن حرارته النوعية مرتفعة فيمتص طاقة كبيرة مع تغير أقل في درجة حرارته", "answerIndex": 1, "explanation": "من اختبارات الشاطر: الحرارة النوعية المرتفعة للماء تجعله يمتص كميات كبيرة من الطاقة الحرارية مع تغير أقل نسبيًا في درجة حرارته.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-39", "question": "لماذا ترتفع درجة حرارة رمال الشاطئ أسرع من مياه البحر في يوم مشمس؟", "choices": ["لأن الحرارة النوعية للرمل أقل من الحرارة النوعية للماء", "لأن الرمل موصل رديء للحرارة", "لأن الرمل يمتص حرارة أقل من الماء", "لأن مياه البحر أعمق من الرمال"], "answer": "لأن الحرارة النوعية للرمل أقل من الحرارة النوعية للماء", "answerIndex": 0, "explanation": "من الاختبار الثالث للشاطر: الحرارة النوعية للرمل أقل، فيرتفع معدل ارتفاع درجة حرارته عند اكتساب كميات مماثلة من الطاقة الحرارية.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-40", "question": "ماذا يحدث للطاقة الداخلية للمادة عندما تكتسب طاقة حرارية؟", "choices": ["تظل طاقتها الداخلية ثابتة", "تقل طاقتها الداخلية", "تزداد طاقتها الداخلية", "تتحول طاقتها الداخلية إلى كتلة"], "answer": "تزداد طاقتها الداخلية", "answerIndex": 2, "explanation": "من اختبارات الشاطر: عندما تكتسب المادة طاقة حرارية تزداد طاقتها الداخلية، وعندما تفقد طاقة حرارية تنخفض درجة حرارة السائل مثلًا.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-41", "question": "ماذا يحدث لطاقة وضع الجسيمات عند تحول المادة من الحالة الصلبة إلى الحالة الغازية؟", "choices": ["تتحول طاقة الوضع إلى طاقة حركة فقط", "تقل طاقة وضع الجسيمات وتصبح شبه منعدمة", "تظل طاقة الوضع ثابتة", "تزداد طاقة وضع الجسيمات"], "answer": "تزداد طاقة وضع الجسيمات", "answerIndex": 3, "explanation": "تصحيح موثق في صفحة نذاكر: مفتاح الشاطر أخطأ فقال إن طاقة الوضع تقل؛ والصحيح أنها تزداد لأن المادة تكتسب طاقة تُستخدم في التغلب على قوى التجاذب والتباعد بين الجسيمات.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-42", "question": "ما طرق انتقال الحرارة الثلاث؟", "choices": ["التوصيل والحمل والإشعاع", "التوصيل والانصهار والغليان", "الانصهار والتجمد والتبخر", "الحمل والتكاثف والتسامي"], "answer": "التوصيل والحمل والإشعاع", "answerIndex": 0, "explanation": "تنتقل الحرارة بثلاث طرق: التوصيل في المواد الصلبة، والحمل في الموائع، والإشعاع دون وسط مادي.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-43", "question": "تنتقل الحرارة في المعادن أساسًا بطريقة .........", "choices": ["الإشعاع", "التسامي", "الحمل", "التوصيل"], "answer": "التوصيل", "answerIndex": 3, "explanation": "المعادن موصلة جيدة للحرارة، فتنتقل فيها الحرارة بالتوصيل من الجزء الأعلى حرارة إلى الجزء الأقل.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-44", "question": "أي مما يلي من المواد الموصلة للحرارة؟", "choices": ["البلاستيك", "النحاس", "الزجاج", "الخشب"], "answer": "النحاس", "answerIndex": 1, "explanation": "من اختبارات الشاطر: المعادن كالنحاس والألومنيوم والحديد موصلة جيدة للحرارة، أما الخشب والبلاستيك والزجاج فعازلة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-45", "question": "أي مما يلي من المواد العازلة للحرارة؟", "choices": ["الألومنيوم", "النحاس", "الحديد", "الخشب"], "answer": "الخشب", "answerIndex": 3, "explanation": "من اختبارات الشاطر: الخشب والبلاستيك والزجاج والهواء مواد عازلة للحرارة، ولذلك تُصنع مقابض أواني الطهي من مواد عازلة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-46", "question": "تنتقل الحرارة من المصباح الكهربائي إلى اليد بطريقة .........", "choices": ["التوصيل", "الحمل", "الانصهار", "الإشعاع"], "answer": "الإشعاع", "answerIndex": 3, "explanation": "من اختبارات الشاطر: تنتقل الحرارة من المصباح إلى اليد بالإشعاع الحراري دون حاجة إلى وسط مادي.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-47", "question": "لماذا توضع المدفأة بالقرب من أرض الغرفة لا في جزئها العلوي؟", "choices": ["لأن الحمل يحدث في المواد الصلبة فقط", "لأن الهواء الساخن يهبط لأسفل", "لأن المدفأة لا تعمل في الأعلى", "لأن الهواء الساخن يصعد لأعلى بالحمل فيوزع الحرارة على الغرفة كلها"], "answer": "لأن الهواء الساخن يصعد لأعلى بالحمل فيوزع الحرارة على الغرفة كلها", "answerIndex": 3, "explanation": "من اختبارات الشاطر: وضع المدفأة قرب الأرض يجعل الهواء الساخن يصعد بالحمل الحراري فيدفئ الغرفة كلها، أما وضعها في الأعلى فيحبس الهواء الساخن فوق.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-48", "question": "ما طريقة انتقال الحرارة في السوائل والغازات أساسًا؟", "choices": ["الحمل الحراري", "الإشعاع", "التسامي", "التوصيل"], "answer": "الحمل الحراري", "answerIndex": 0, "explanation": "في الموائع (السوائل والغازات) تنتقل الحرارة أساسًا بالحمل؛ فالأجزاء الساخنة تقل كثافتها وتصعد، والباردة تهبط.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-49", "question": "أي طرق انتقال الحرارة التالية لا يحتاج إلى وسط مادي؟", "choices": ["الحمل", "كل الطرق تحتاج وسطًا", "التوصيل", "الإشعاع"], "answer": "الإشعاع", "answerIndex": 3, "explanation": "الإشعاع هو انتقال الحرارة على هيئة موجات كهرومغناطيسية دون حاجة إلى وسط مادي، ولذلك تصلنا حرارة الشمس عبر الفراغ.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "العلوم", "id": "h26-g8-50", "question": "عند تلامس جسمين لهما درجة الحرارة نفسها، ماذا يحدث؟", "choices": ["تنتقل الحرارة من الأبرد إلى الأسخن", "لا تنتقل الحرارة بينهما ويكونان في اتزان حراري", "تتساوى كتلتاهما فورًا", "تنتقل الحرارة من الأصغر إلى الأكبر"], "answer": "لا تنتقل الحرارة بينهما ويكونان في اتزان حراري", "answerIndex": 1, "explanation": "من الاختبار الثالث للشاطر: لا تنتقل حرارة بين جسمين متساويي درجة الحرارة؛ فانتقال الحرارة يحتاج اختلافًا في درجة الحرارة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2539/"}, {"grade": 8, "subject": "الدراسات الاجتماعية", "id": "h26-g8-51", "question": "ما المصطلح الذي يُطلق على قارتي آسيا وأوروبا معًا؟", "choices": ["أوراسيا", "أوقيانوسيا", "أفروآسيا", "أمريكا الشمالية"], "answer": "أوراسيا", "answerIndex": 0, "explanation": "من مفكرة الامتحان: يُطلق مصطلح أوراسيا على قارتي آسيا وأوروبا معًا، لأن قارة أوروبا تمتد كامتداد طبيعي لقارة آسيا من جهة الغرب.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/280209"}, {"grade": 8, "subject": "الدراسات الاجتماعية", "id": "h26-g8-52", "question": "لماذا يُطلق مصطلح «أوراسيا» على قارتي آسيا وأوروبا؟", "choices": ["لأن القارتين تقعان في نصف الكرة الجنوبي", "لأن قارة أوروبا تمتد كامتداد طبيعي لقارة آسيا من جهة الغرب", "لأن القارت شة حتى لا نؤذي أعيننا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-102", "question": "Gen Alpha is the ..................... that grew up with digital technology.", "choices": ["generation", "country", "family", "school"], "answer": "generation", "answerIndex": 0, "explanation": "من تمرين إكمال النص على الوحدة الأولى في ملحق المعاصر: (1) generation — جيل ألفا هو الجيل الذي نشأ مع التكنولوجيا الرقمية.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-103", "question": "We use technology to ..................... with people around the world.", "choices": ["fight", "sleep", "communicate", "hide"], "answer": "communicate", "answerIndex": 2, "explanation": "من تمرين إكمال النص على الوحدة الأولى: (2) communicate — نستخدم التكنولوجيا للتواصل مع الناس حول العالم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-104", "question": "Young people follow the latest ..................... in fashion and technology.", "choices": ["books", "trends", "lessons", "exams"], "answer": "trends", "answerIndex": 1, "explanation": "من تمرين إكمال النص على الوحدة الأولى: (4) trends — يتابع الشباب أحدث الصيحات (الاتجاهات) في الموضة والتكنولوجيا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-105", "question": "A smartphone is a ..................... device.", "choices": ["digital", "plastic", "paper", "wooden"], "answer": "digital", "answerIndex": 0, "explanation": "من التمارين العامة على الوحدة الأولى: (1) a) digital — الهاتف الذكي جهاز رقمي.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-106", "question": "You should ..................... to give your password to strangers online.", "choices": ["agree", "accept", "decide", "refuse"], "answer": "refuse", "answerIndex": 3, "explanation": "من التمارين العامة على الوحدة الأولى: (2) b) refuse — يجب أن ترفض إعطاء كلمة مرورك للغرباء على الإنترنت.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-107", "question": "Unit 1 ..................... six lessons about Gen Alpha.", "choices": ["forgets", "includes", "excludes", "refuses"], "answer": "includes", "answerIndex": 1, "explanation": "من التمارين العامة على الوحدة الأولى: (4) b) include — الوحدة الأولى تشتمل على ستة دروس عن جيل ألفا.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-108", "question": "The words 'big' and 'large' have the same meaning. They are .....................", "choices": ["verbs", "synonyms", "antonyms", "pronouns"], "answer": "synonyms", "answerIndex": 1, "explanation": "من إجابات المفردات للوحدة الأولى: (3) c) synonyms — الكلمتان المترادفتان لهما المعنى نفسه.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-109", "question": "The words 'hot' and 'cold' have opposite meanings. They are .....................", "choices": ["adjectives", "nouns", "antonyms", "synonyms"], "answer": "antonyms", "answerIndex": 2, "explanation": "من إجابات المفردات للوحدة الأولى: (2) d) antonym — الكلمتان المتضادتان لهما معنيان متعاكسان.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-110", "question": "They live in a ..................... village far from the city.", "choices": ["modern", "remote", "busy", "near"], "answer": "remote", "answerIndex": 1, "explanation": "من إجابات المفردات للوحدة الأولى: (3) d) remote — remote تعني بعيد/ناءٍ، فالقرية البعيدة عن المدينة قرية نائية.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-111", "question": "An ..................... is a word that describes a noun, like 'happy' or 'big'.", "choices": ["adjective", "adverb", "pronoun", "verb"], "answer": "adjective", "answerIndex": 0, "explanation": "من التمارين العامة على الوحدة الأولى: (3) b) adjective — الصفة كلمة تصف الاسم.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-112", "question": "The word 'action' is formed from the verb 'act' by adding the suffix .....................", "choices": ["-ion", "-ior", "-ment", "-al"], "answer": "-ion", "answerIndex": 0, "explanation": "من إجابات المفردات للوحدة الأولى: (4) a) -ion — اللاحقة -ion تحوّل الفعل act إلى الاسم action.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-113", "question": "They ..................... for the final match now.", "choices": ["is training", "trains", "train", "are training"], "answer": "are training", "answerIndex": 3, "explanation": "من إجابات إعادة الكتابة للوحدة الأولى: «They are training for the final match now» — مع now نستخدم المضارع المستمر: are + فعل + ing.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-114", "question": "He ..................... his tasks at the moment.", "choices": ["is doing", "are doing", "does", "do"], "answer": "is doing", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة للوحدة الأولى: «He is doing his tasks at the moment» — مع at the moment نستخدم المضارع المستمر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-115", "question": "They ..................... to the theater tomorrow.", "choices": ["goes", "is going", "are going", "go"], "answer": "are going", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة للوحدة الأولى: «They are going to the theater tomorrow» — المضارع المستمر مع tomorrow يعبّر عن ترتيب قريب.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-116", "question": "I ..................... to Alexandria next week.", "choices": ["travel", "am traveling", "travels", "is traveling"], "answer": "am traveling", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة للوحدة الأولى: «I am traveling to Alexandria next week» — مع I نستخدم am + فعل + ing.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-117", "question": "He ..................... a big party next week.", "choices": ["has", "are having", "have", "is having"], "answer": "is having", "answerIndex": 3, "explanation": "من إجابات إعادة الكتابة للوحدة الأولى: «He is having a big party next week» — المضارع المستمر يعبّر عن خطة قريبة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-118", "question": "The child ..................... in the garden just now.", "choices": ["plays", "are playing", "is playing", "play"], "answer": "is playing", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة للوحدة الأولى: «The child is playing in the garden just now» — مع just now نستخدم المضارع المستمر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-119", "question": "Look! The boys ..................... in the garden.", "choices": ["are playing", "is playing", "plays", "play"], "answer": "are playing", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة للوحدة الأولى: «Look! The boys are playing in the garden» — مع Look! نستخدم المضارع المستمر لحدث يحدث الآن.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-120", "question": "She ..................... the house at the moment.", "choices": ["clean", "cleans", "are cleaning", "is cleaning"], "answer": "is cleaning", "answerIndex": 3, "explanation": "من إجابات إعادة الكتابة للوحدة الأولى: «She is cleaning the house at the moment» — الفاعل المفرد she يأخذ is + فعل + ing.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-121", "question": "They ..................... in protecting the environment.", "choices": ["volunteers", "are volunteering", "volunteer", "is volunteering"], "answer": "are volunteering", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة للوحدة الأولى: «They are volunteering in protecting the environment» — الفاعل الجمع they يأخذ are + فعل + ing.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-122", "question": "He ..................... a play next week.", "choices": ["watches", "watch", "is watching", "are watching"], "answer": "is watching", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة للوحدة الأولى: «He is watching a play next week» — المضارع المستمر مع next week يعبّر عن ترتيب قريب.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-123", "question": "..................... you ..................... your homework now?", "choices": ["Does / doing", "Do / do", "Is / doing", "Are / doing"], "answer": "Are / doing", "answerIndex": 3, "explanation": "سؤال في المضارع المستمر: Are you doing...؟ — نستخدم Are مع you ثم فعل + ing.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-124", "question": "We use the present continuous with '.....................' to talk about a plan in the near future.", "choices": ["last week", "next week", "ago", "yesterday"], "answer": "next week", "answerIndex": 1, "explanation": "المضارع المستمر يُستخدم مع تعبيرات المستقبل القريب مثل next week للحديث عن خطة أو ترتيب؛ أما yesterday وlast week وago فتدل على الماضي.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-125", "question": "I like reading, .....................", "choices": ["to", "tow", "two", "too"], "answer": "too", "answerIndex": 3, "explanation": "من إجابات المحادثة على الوحدة الأولى: (1) too — too في نهاية الجملة تعني «أيضًا».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-126", "question": "— ..................... is your school? — Near my house.", "choices": ["When", "What", "Where", "Who"], "answer": "Where", "answerIndex": 2, "explanation": "من إجابات المحادثة على الوحدة الأولى: (2) Where — نسأل عن المكان بـ Where.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-127", "question": "— ..................... you watch the film yesterday? — Yes, I did.", "choices": ["Does", "Did", "Do", "Are"], "answer": "Did", "answerIndex": 1, "explanation": "من إجابات المحادثة على الوحدة الأولى: (3) did — السؤال عن الماضي البسيط يبدأ بـ Did وتكون الإجابة Yes, I did.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-128", "question": "— ..................... are you today? — I'm fine, thanks.", "choices": ["When", "What", "How", "Where"], "answer": "How", "answerIndex": 2, "explanation": "من إجابات المحادثة على الوحدة الأولى: (4) How — نسأل عن الحال بـ How are you?", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-129", "question": "I spend about four hours a day ..................... my smartphone and laptop.", "choices": ["of", "on", "at", "in"], "answer": "on", "answerIndex": 1, "explanation": "من فقرة «Your digital habits» في ملحق المعاصر: «I spend about four hours a day on my smartphone and laptop».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-130", "question": "Good digital habits help me stay safe, ..................... and creative.", "choices": ["tired", "healthy", "ill", "weak"], "answer": "healthy", "answerIndex": 1, "explanation": "من فقرة «Your digital habits» في ملحق المعاصر: «Good digital habits help me stay safe, healthy and creative».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-131", "question": "You should use a strong ..................... to protect your account.", "choices": ["color", "picture", "password", "name"], "answer": "password", "answerIndex": 2, "explanation": "من إجابات المفردات للوحدة الثانية: (1) c) password — كلمة المرور القوية تحمي حسابك.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-132", "question": "Sharing your address online is a .....................", "choices": ["game", "hobby", "danger", "joke"], "answer": "danger", "answerIndex": 2, "explanation": "من إجابات المفردات للوحدة الثانية: (2) d) danger — مشاركة عنوانك على الإنترنت خطر.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-133", "question": "Your personal information should be .....................", "choices": ["sold", "posted", "shared", "protected"], "answer": "protected", "answerIndex": 3, "explanation": "من إجابات المفردات للوحدة الثانية: (3) d) protected — يجب أن تكون معلوماتك الشخصية محمية لا منشورة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-134", "question": "Don't ..................... your photos with strangers online.", "choices": ["share", "delete", "keep", "hide"], "answer": "share", "answerIndex": 0, "explanation": "من إجابات المفردات للوحدة الثانية: (1) a) share — لا تشارك صورك مع الغرباء على الإنترنت.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-135", "question": "A ..................... is a small piece of information that helps you solve a problem.", "choices": ["footprint", "danger", "Clue", "password"], "answer": "Clue", "answerIndex": 2, "explanation": "من إجابات المفردات للوحدة الثانية: (3) a) Clue — الدليل (clue) معلومة صغيرة تساعدك على حل مشكلة.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-136", "question": "Your account is ..................... when no one can open it without your password.", "choices": ["weak", "secure", "public", "dangerous"], "answer": "secure", "answerIndex": 1, "explanation": "من التمارين العامة على الوحدة الثانية: (1) c) Secure — الحساب الآمن (secure) لا يستطيع أحد فتحه دون كلمة المرور.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-137", "question": "You should only talk to ..................... adults online.", "choices": ["new", "strange", "trusted", "unknown"], "answer": "trusted", "answerIndex": 2, "explanation": "من التمارين العامة على الوحدة الثانية: (2) d) trusted — تحدث فقط مع بالغين موثوق بهم على الإنترنت.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-138", "question": "The word '.....................' means bad or harmful.", "choices": ["happy", "safe", "negative", "positive"], "answer": "negative", "answerIndex": 2, "explanation": "من التمارين العامة على الوحدة الثانية: (3) b) negative — كلمة negative تعني سلبي/ضار.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-139", "question": "Your ..................... is everything you do online; it stays forever.", "choices": ["digital footprint", "digital photo", "digital book", "digital game"], "answer": "digital footprint", "answerIndex": 0, "explanation": "من تمرين إكمال النص على الوحدة الثانية: (3) footprints — ومن فقرة «How to stay safe online»: «your digital footprint stays forever».", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-140", "question": "Your name, address and phone number are personal .....................", "choices": ["information", "videos", "photos", "games"], "answer": "information", "answerIndex": 0, "explanation": "من تمرين إكمال النص على الوحدة الثانية: (4) information — الاسم والعنوان ورقم الهاتف معلومات شخصية.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-141", "question": "The adjective 'personal' is formed from the noun 'person' by adding the suffix .....................", "choices": ["-ion", "-ior", "-ment", "-al"], "answer": "-al", "answerIndex": 3, "explanation": "من إجابات المفردات للوحدة الثانية: (4) a) -al — اللاحقة -al تحوّل الاسم person إلى الصفة personal.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-142", "question": "The noun 'enjoyment' is formed from the verb 'enjoy' by adding the suffix .....................", "choices": ["-ment", "-ior", "-ion", "-al"], "answer": "-ment", "answerIndex": 0, "explanation": "من إجابات المفردات للوحدة الثانية: (4) c) -ment — اللاحقة -ment تحوّل الفعل enjoy إلى الاسم enjoyment.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-143", "question": "The room ..................... every day.", "choices": ["should clean", "should be cleaned", "should cleaned", "should be clean"], "answer": "should be cleaned", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة للوحدة الثانية: «The room should be cleaned» — المبني للمجهول مع should يكون should be + التصريف الثالث.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-144", "question": "Different goods ..................... in our town.", "choices": ["produce", "produced", "are produced", "is produced"], "answer": "are produced", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة للوحدة الثانية: «Different goods are produced in our town» — الفاعل الجمع يأخذ are + التصريف الثالث.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-145", "question": "My homework ..................... every day.", "choices": ["is done", "are done", "does", "is do"], "answer": "is done", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة للوحدة الثانية: «My homework is done every day» — المبني للمجهول في المضارع: is + التصريف الثالث.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-146", "question": "The dishes ..................... by Salma after dinner.", "choices": ["washed", "is washed", "are washed", "wash"], "answer": "are washed", "answerIndex": 2, "explanation": "من إجابات إعادة الكتابة للوحدة الثانية: «The dishes are washed by Salma after dinner» — الفاعل الجمع يأخذ are + التصريف الثالث.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-147", "question": "Cameras ..................... to take photos.", "choices": ["use", "are used", "used", "is used"], "answer": "are used", "answerIndex": 1, "explanation": "من إجابات إعادة الكتابة للوحدة الثانية: «Cameras are used to take photos» — المبني للمجهول: are + التصريف الثالث.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-148", "question": "The village ..................... by Amira every year.", "choices": ["is visited", "visit", "are visited", "visits"], "answer": "is visited", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة للوحدة الثانية: «The village is visited by Amira every year» — الفاعل المفرد يأخذ is + التصريف الثالث.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-149", "question": "A hand ..................... to your family.", "choices": ["should be given", "should give", "should be give", "should gave"], "answer": "should be given", "answerIndex": 0, "explanation": "من إجابات إعادة الكتابة للوحدة الثانية: «A hand should be given to your family» — المبني للمجهول مع should يكون should be + التصريف الثالث.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "اللغة الإنجليزية", "id": "h26-g8-150", "question": "We should ..................... the use of social media.", "choices": ["limiting", "limited", "limits", "limit"], "answer": "limit", "answerIndex": 3, "explanation": "من إجابات إعادة الكتابة للوحدة الثانية: «We should limit the use of social media» — بعد should يأتي الفعل في المصدر دون إضافات.", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288406"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-151", "question": "أي مما يأتي عدد نسبي؟", "choices": ["جذر 11", "جذر 36", "جذر 5", "جذر 2"], "answer": "جذر 36", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): جذر 36 يساوي 6، ويمكن كتابته على صورة كسر مقامه 1 فهو عدد نسبي، أما جذر 11 وجذر 5 وجذر 2 فهي أعداد غير نسبية لأنها ليست مربعات كاملة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-152", "question": "بين أي عددين صحيحين يقع جذر 11؟", "choices": ["بين 2 و3", "بين 4 و5", "بين 3 و4", "بين 1 و2"], "answer": "بين 3 و4", "answerIndex": 2, "explanation": "من نماذج أكتوبر (نذاكر): 11 يقع بين 9 و16، أي بين جذر 9 وجذر 16، فيقع جذر 11 بين 3 و4.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-153", "question": "بين أي عددين صحيحين يقع سالب جذر 30؟", "choices": ["بين سالب 6 وسالب 5", "بين سالب 5 وسالب 4", "بين 5 و6", "بين سالب 4 وسالب 3"], "answer": "بين سالب 6 وسالب 5", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): 25 أصغر من 30 و30 أصغر من 36، فيقع جذر 30 بين 5 و6، وعند أخذ السالب ينعكس الترتيب فيقع سالب جذر 30 بين سالب 6 وسالب 5.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-154", "question": "ما التقريب العشري لجذر 5 إلى منزلتين عشريتين؟", "choices": ["2.50", "2.36", "2.10", "2.24"], "answer": "2.24", "answerIndex": 3, "explanation": "من نماذج أكتوبر (نذاكر): جذر 5 يقع بين 2 و3، وتقريبه 2.24، وهو ما يساعد على تعيينه على خط الأعداد ولا يحوله إلى عدد عشري منته.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-155", "question": "ما الترتيب التنازلي الصحيح للأعداد: جذر 50، 6.9، 6.888...، 6.8؟", "choices": ["جذر 50 ثم 6.9 ثم 6.888... ثم 6.8", "6.9 ثم جذر 50 ثم 6.8 ثم 6.888...", "6.888... ثم 6.9 ثم جذر 50 ثم 6.8", "6.8 ثم 6.888... ثم 6.9 ثم جذر 50"], "answer": "جذر 50 ثم 6.9 ثم 6.888... ثم 6.8", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): جذر 50 أكبر من 7 لأن 50 أكبر من 49، فيتقدم عند الترتيب التنازلي على 6.9، ثم يأتي العدد الدوري 6.888...، ثم 6.8.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-156", "question": "ما قيمة العدد 6 و4/5؟", "choices": ["6.45", "6.4", "6.8", "6.888..."], "answer": "6.8", "answerIndex": 2, "explanation": "من نماذج أكتوبر (نذاكر): العدد 6 و4 أخماس يساوي 6.8 المنتهي، أما العدد الذي تتكرر فيه الثمانية بعد العلامة فيساوي 6.888...؛ فلا تتساوى القيمتان.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-157", "question": "ما قيمة الجذر التكعيبي لسالب 81 مقسومًا على الجذر التكعيبي لـ 3؟", "choices": ["3", "سالب 3", "27", "سالب 27"], "answer": "سالب 3", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): قسمة الجذر التكعيبي لسالب 81 على الجذر التكعيبي لـ 3 تؤول إلى الجذر التكعيبي لسالب 27، أي سالب 3، لأن إشارة العدد السالب تبقى في ناتج الجذر التكعيبي الحقيقي.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-158", "question": "ما قيمة الجذر التكعيبي لـ 8؟", "choices": ["2", "4", "8", "سالب 2"], "answer": "2", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): تتحد الجذور التكعيبية في حاصل ضرب وقسمة ينتهي إلى الجذر التكعيبي لـ 8، أي 2، لأن 2×2×2 = 8.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-159", "question": "ما المعكوس الجمعي للعدد جذر 3 ناقص 2؟", "choices": ["جذر 3 ناقص 2", "جذر 3 زائد 2", "2 زائد جذر 3", "2 ناقص جذر 3"], "answer": "2 ناقص جذر 3", "answerIndex": 3, "explanation": "من نماذج أكتوبر (نذاكر): المعكوس الجمعي للعدد هو ما يجعل مجموعهما صفرًا، فالمعكوس الجمعي لجذر 3 ناقص 2 هو 2 ناقص جذر 3.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-160", "question": "ما المعكوس الجمعي للعدد (سالب جذر 5) مرفوعًا للأس صفر؟", "choices": ["1", "سالب 1", "جذر 5", "سالب جذر 5"], "answer": "سالب 1", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): يجب تنفيذ القوة أولًا؛ العدد سالب جذر 5 داخل قوس مرفوع للأس صفر يساوي 1، ثم يكون معكوسه الجمعي سالب 1.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-161", "question": "ما المعكوس الضربي للعدد جذر 7 ناقص جذر 6؟", "choices": ["جذر 7 زائد جذر 6", "جذر 7 ناقص جذر 6", "جذر 6 ناقص جذر 7", "1"], "answer": "جذر 7 زائد جذر 6", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): عند إيجاد المعكوس الضربي لجذر 7 ناقص جذر 6 يفيد المرافق جذر 7 زائد جذر 6، لأن حاصل ضربهما يساوي 7-6=1.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-162", "question": "ما المعكوس الضربي للعدد جذر 10 ناقص 3؟", "choices": ["جذر 10 ناقص 3", "3 ناقص جذر 10", "جذر 10 زائد 3", "1"], "answer": "جذر 10 زائد 3", "answerIndex": 2, "explanation": "من نماذج أكتوبر (نذاكر): معكوس جذر 10 ناقص 3 هو جذر 10 زائد 3، إذ يساوي فرق المربعين 10-9=1؛ فالمرافق يصلح معكوسًا ضربيًا هنا لأن حاصل الضرب تحديدًا يساوي الواحد.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-163", "question": "ما أبسط صورة للكسر 10 على جذر 5؟", "choices": ["5 جذر 2", "2 جذر 5", "جذر 10", "10 جذر 5"], "answer": "2 جذر 5", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): يظهر إنطاق المقام في تبسيط 10/جذر 5؛ نضرب البسط والمقام في الجذر نفسه، فنحصل على 10 جذر 5 / 5، ثم على 2 جذر 5.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-164", "question": "ما قيمة أي عدد غير صفري مرفوع للأس صفر؟", "choices": ["1", "0", "العدد نفسه", "سالب 1"], "answer": "1", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): رفع الكسر كله للأس صفر يعطي 1، لأن أي عدد غير صفري مرفوع للأس صفر يساوي 1.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-165", "question": "إذا كان 2 أس x يساوي 8، فما قيمة 2 أس x زائد 2 أس (x+2)؟", "choices": ["24", "16", "32", "40"], "answer": "40", "answerIndex": 3, "explanation": "من نماذج أكتوبر (نذاكر): عندما يعطينا النموذج أن 2 أس x تساوي 8، لا نحتاج إلى إيجاد x؛ الحد الثاني يساوي أربعة أمثال الحد الأول، فيكون المجموع خمسة أمثال 8، أي 40.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-166", "question": "إذا كان 3 أس x يساوي 5، فما قيمة 3 أس (x+3)؟", "choices": ["15", "125", "135", "45"], "answer": "135", "answerIndex": 2, "explanation": "من نماذج أكتوبر (نذاكر): زيادة الأس ثلاث وحدات تعني الضرب في 3 أس 3، ولذلك تصبح قيمة 3 أس (x+3) هي 5×27=135.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-167", "question": "ما قيمة (جذر 3) أس سالب 2؟", "choices": ["3", "1/3", "سالب 3", "9"], "answer": "1/3", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): حاصل قوى جذر 3 ينتهي إلى الأس سالب 2، فتكون القيمة مقلوب مربع جذر 3، أي 1/3.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-168", "question": "إذا كان تبسيط تعبير ما يساوي 3 أس (n+1)، فما قيمته عندما n=2؟", "choices": ["9", "81", "3", "27"], "answer": "27", "answerIndex": 3, "explanation": "من نماذج أكتوبر (نذاكر): بعد التبسيط يبقى 3 للقوة n+1، وبالتعويض بـ n=2 نحصل على 3 أس 3 = 27.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-169", "question": "إذا كان العدد 1 ينتمي إلى X ولا ينتمي إلى Y، فهل ينتمي إلى X-Y؟", "choices": ["نعم ينتمي إلى X-Y", "لا ينتمي إلى X-Y", "ينتمي فقط إذا كان 1 موجبًا", "لا يمكن تحديد ذلك"], "answer": "نعم ينتمي إلى X-Y", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): في الاختبار الأول ينتمي العدد 1 إلى X ولا ينتمي إلى Y؛ لذلك يبقى ضمن X-Y، رغم أن طرف Y عنده مفتوح، لأن الفرق يحتفظ بما يوجد في المجموعة الأولى ولا يوجد في الثانية.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-170", "question": "عند إيجاد تقاطع فترتين، متى يُستبعد طرف من الناتج؟", "choices": ["إذا كان مشمولًا في الفترتين معًا", "إذا كان العدد صحيحًا", "إذا كان مستبعدًا من إحدى الفترتين", "إذا كان العدد سالبًا"], "answer": "إذا كان مستبعدًا من إحدى الفترتين", "answerIndex": 2, "explanation": "من نماذج أكتوبر (نذاكر): التقاطع يحتاج انتماء العدد إلى الفترتين معًا، ولذلك يستبعد الطرف 1 في الاختبار الثاني؛ ففي التقاطع ينتهي الناتج إلى الفترة المفتوحة بين 1 و3 لأن كل طرف مستبعد من إحدى الفترتين.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-171", "question": "ما الصفة المميزة للفترة [3، 7)؟", "choices": ["x أكبر من 3 وأصغر من أو يساوي 7", "x أكبر من أو يساوي 3 وأصغر من 7", "x أكبر من أو يساوي 3 وأصغر من أو يساوي 7", "x أكبر من 3 وأصغر من 7"], "answer": "x أكبر من أو يساوي 3 وأصغر من 7", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): الفترة التي تبدأ من 3 مشمولة وتنتهي قبل 7 تصف أعدادًا حقيقية تحقق أن x أكبر من أو تساوي 3 وأصغر من 7.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-172", "question": "إذا كان اتحاد فترتين يبدأ من سالب 2 غير مشمولة وينتهي عند 4 مشمولة، فما رمز الفترة؟", "choices": ["(-2، 4)", "[-2، 4)", "[-2، 4]", "(-2، 4]"], "answer": "(-2، 4]", "answerIndex": 3, "explanation": "من نماذج أكتوبر (نذاكر): في الاتحاد يكفي الانتماء إلى إحداهما؛ فيتصل الاتحاد من سالب 2 غير مشمولة إلى 4 مشمولة، فيُكتب (-2، 4].", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-173", "question": "ما رمز الفترة المفتوحة بين 1 و3؟", "choices": ["(1، 3)", "[1، 3]", "(1، 3]", "[1، 3)"], "answer": "(1، 3)", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): التقاطع في الاختبار الثاني ينتهي إلى الفترة المفتوحة بين 1 و3، ورمزها (1، 3) لأن الطرفين مستبعدان.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-174", "question": "لماذا جذر 50 أكبر من 7؟", "choices": ["لأن 50 أصغر من 49", "لأن 7 أكبر من 50", "لأن 50 أكبر من 49", "لأن جذر 50 يساوي 7"], "answer": "لأن 50 أكبر من 49", "answerIndex": 2, "explanation": "من نماذج أكتوبر (نذاكر): جذر 50 أكبر من 7 لأن 50 أكبر من 49، فيتقدم عند الترتيب التنازلي على 6.9.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-175", "question": "أي العددين أكبر: 6.888... أم 6.8؟", "choices": ["6.8", "6.888...", "متساويان", "لا يمكن المقارنة"], "answer": "6.888...", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): العدد 6 و4 أخماس يساوي 6.8 المنتهي، بينما 6.888... أكبر منه لاستمرار الثمانيات.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-176", "question": "ما العامل المشترك الأكبر بين كثيرة الحدود 12x^2 - 8x؟", "choices": ["8x", "12x", "4x", "2x"], "answer": "4x", "answerIndex": 2, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): العامل المشترك الأكبر بين كثيرة الحدود 12x^2 - 8x هو 4x، لأن 4x(3x-2) = 12x^2 - 8x.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-177", "question": "ما العامل المشترك الأكبر للحدين 12x^3y^2 و18x^2y^3؟", "choices": ["6x^2y^2", "6x^3y^3", "18x^2y^2", "12x^2y^2"], "answer": "6x^2y^2", "answerIndex": 0, "explanation": "من نماذج أكتوبر (نذاكر): في العامل المشترك الأكبر نبحث عن أكبر عامل عددي وأقل قوة مشتركة لكل متغير؛ لذلك يكون العامل في 12x^3y^2 و18x^2y^3 هو 6x^2y^2، لا عاملًا يجمع أكبر الأسس في الحدين.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-178", "question": "ما ناتج تحليل المقدار 15x^2y - 10xy^2 تحليلًا تامًا؟", "choices": ["5xy(3x+2y)", "5xy(3x-2y)", "10xy(3x-2y)", "5x(3xy-2y^2)"], "answer": "5xy(3x-2y)", "answerIndex": 1, "explanation": "من نماذج أكتوبر (نذاكر): يحتاج التحليل التام للمقدار 15x^2y-10xy^2 إلى إخراج 5xy، فتتبقى داخل القوس 3x-2y؛ وإعادة التوزيع تكشف سقوط متغير أو تغير إشارة.", "type": "mcq", "topic": "", "source": "https://www.nezakr.net/edu/p/2641/"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-179", "question": "إذا كان a+b=5 وd+c=4، فما قيمة d(a+b)+c(a+b)؟", "choices": ["9", "5", "4", "20"], "answer": "20", "answerIndex": 3, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): بالتجميع d(a+b)+c(a+b) = (a+b)(d+c) = 5×4 = 20.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-180", "question": "إذا كان (x+3) أحد عاملي كثيرة الحدود 5x^2+8x-21، فما العامل الآخر؟", "choices": ["5x-7", "5x+7", "x-7", "5x-3"], "answer": "5x-7", "answerIndex": 0, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): العامل الآخر هو 5x-7 لأن (x+3)(5x-7) = 5x^2+8x-21.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-181", "question": "إذا كانت كثيرة الحدود 4x^2+kx+1 مربعًا كاملًا، فما قيمة k؟", "choices": ["4", "±4", "-4", "2"], "answer": "±4", "answerIndex": 1, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): قانون المربع الكامل k = ±2 جذر (الأول×الأخير) = ±2 جذر (4×1) = ±4.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-182", "question": "إذا كان x^2-b=(x+3)(x-3)، فما قيمة b؟", "choices": ["3", "سالب 9", "6", "9"], "answer": "9", "answerIndex": 3, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): لأن x^2-9 = (x+3)(x-3)، فتكون b=9.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-183", "question": "ما العامل الآخر للمقدار x^3+8 إذا كان أحد عامليه (x^2-2x+4)؟", "choices": ["x-2", "x^2+2", "x+2", "x+4"], "answer": "x+2", "answerIndex": 2, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): مجموع مكعبين x^3+2^3 = (x+2)(x^2-2x+4)، فالعامل الآخر هو x+2.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-184", "question": "إذا كانت كثيرة الحدود x^2+bx+15 قابلة للتحليل، فأي قيمة مما يأتي ممكنة لـ b؟", "choices": ["8", "3", "5", "15"], "answer": "8", "answerIndex": 0, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): لأن 15=3×5 ومجموعهما 8، فيمكن أن تكون b=8 (وكذلك -8)؛ أما 3 و5 و15 فلا تحقق شرط المجموع.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-185", "question": "عند إكمال المربع للمقدار x^2+9، ماذا نضيف إليه؟", "choices": ["6x", "سالب 6x", "±6x", "9x"], "answer": "±6x", "answerIndex": 2, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): عند إكمال المربع للمقدار x^2+9 نضيف إليه ±6x ليصبح x^2±6x+9 = (x±3)^2.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-186", "question": "ما مجموعة حل المعادلة 25x^2-30x+9=0 في Q؟", "choices": ["{-3/5}", "{3/5}", "{3/5، -3/5}", "{5/3}"], "answer": "{3/5}", "answerIndex": 1, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): لأن (5x-3)^2=0، فيكون x=3/5، فمجموعة الحل {3/5}.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-187", "question": "ما تحليل المقدار x^2-7x+10؟", "choices": ["(x+5)(x+2)", "(x-5)(x+2)", "(x-10)(x-1)", "(x-5)(x-2)"], "answer": "(x-5)(x-2)", "answerIndex": 3, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): x^2-7x+10 = (x-5)(x-2)، لأن حاصل ضرب -5 و-2 يساوي 10 ومجموعهما -7.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-188", "question": "ما تحليل المقدار -x^2-13x-36 تحليلًا تامًا؟", "choices": ["-(x+9)(x+4)", "(x+9)(x+4)", "-(x-9)(x-4)", "(x-9)(x+4)"], "answer": "-(x+9)(x+4)", "answerIndex": 0, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): -x^2-13x-36 = -(x^2+13x+36) = -(x+9)(x+4).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-189", "question": "ما تحليل المقدار 3x^2-7x-20؟", "choices": ["(3x-5)(x+4)", "(3x+4)(x-5)", "(3x+5)(x-4)", "(3x-4)(x+5)"], "answer": "(3x+5)(x-4)", "answerIndex": 2, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): 3x^2-7x-20 = (3x+5)(x-4)، وهو مقدار ثلاثي غير بسيط لأن معامل x^2 لا يساوي 1.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-190", "question": "ما تحليل المقدار x^2-10x+25؟", "choices": ["(x+5)^2", "(x-5)^2", "(x-5)(x+5)", "(x-10)(x+5)"], "answer": "(x-5)^2", "answerIndex": 1, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): x^2-10x+25 = (x-5)^2، وهو مربع كامل لأن 25 مربع 5 وضعف حاصل ضرب الطرفين 10x.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-191", "question": "ما تحليل المقدار 4x^2 - 1/100؟", "choices": ["(2x-1/10)^2", "(4x-1/10)(4x+1/10)", "(2x+1/10)^2", "(2x-1/10)(2x+1/10)"], "answer": "(2x-1/10)(2x+1/10)", "answerIndex": 3, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): 4x^2 - 1/100 = (2x-1/10)(2x+1/10)، لأنه فرق بين مربعين: (2x)^2 - (1/10)^2.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-192", "question": "ما تحليل المقدار 64x^3-125y^3؟", "choices": ["(4x-5y)(16x^2+20xy+25y^2)", "(4x+5y)(16x^2-20xy+25y^2)", "(4x-5y)(16x^2-20xy+25y^2)", "(4x-5y)(16x^2+20xy-25y^2)"], "answer": "(4x-5y)(16x^2+20xy+25y^2)", "answerIndex": 0, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): 64x^3-125y^3 = (4x-5y)(16x^2+20xy+25y^2)، لأنه فرق بين مكعبين: (4x)^3 - (5y)^3.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-193", "question": "ما قيمة (75)^2 - 2(75)(65) + (65)^2 باستخدام التحليل؟", "choices": ["1000", "10", "100", "140"], "answer": "100", "answerIndex": 2, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): (75)^2-2(75)(65)+(65)^2 = (75-65)^2 = 10^2 = 100.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-194", "question": "ما قيمة (64)^2 - (36)^2 باستخدام التحليل؟", "choices": ["1000", "2800", "280", "100"], "answer": "2800", "answerIndex": 1, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): (64)^2-(36)^2 = (64+36)(64-36) = 100×28 = 2800.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-195", "question": "ما قيمة (6)^3 + (4)^3 باستخدام التحليل؟", "choices": ["100", "216", "64", "280"], "answer": "280", "answerIndex": 3, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): (6)^3+(4)^3 = (6+4)(36-24+16) = 10×28 = 280.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/10/2027_01389300243.html"}, {"grade": 8, "subject": "الجبر", "id": "h26-g8-196", "question": "ما مجموعة حل المعادلة x^2+8x+16=0 في R؟", "choices": ["{-4}", "{4}", "{-4، 4}", "{8}"], "answer": "{-4}", "answerIndex": 0, "explanation": "من امتحان الوحدة الثانية (الرياضياتي): x^2+8x+16=0 ← (x+4)^2=0، فمجموعة الحل {-4}، لأن المربع الكامل له حل وحيد مكرر.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/ ن، والزوايا المتناظرة في المضلعات المتطابقة متساوية في القياس، فقياسها 120°.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-206", "question": "في المثلثين أ ب ج، د هـ و: أ ب = د هـ، ب ج = هـ و، وقياس زاوية ب = قياس زاوية هـ، فالمثلثان متطابقان بحالة...", "choices": ["ثلاثة أضلاع متناظرة", "ضلعان والزاوية المحصورة بينهما", "زاويتان وضلع متناظر", "ضلعان وزاوية غير محصورة"], "answer": "ضلعان والزاوية المحصورة بينهما", "answerIndex": 1, "explanation": "ضلعان متناظران متساويان والزاوية المحصورة بينهما متساوية، فهي حالة التطابق (ضلع، زاوية، ضلع).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-207", "question": "في مثلثين زاويتان متناظرتان متساويتان وضلع متناظر متساوٍ، فالمثلثان متطابقان بحالة...", "choices": ["ثلاثة أضلاع", "ضلعان والزاوية المحصورة", "وتر وضلع قائمة", "زاويتان وضلع"], "answer": "زاويتان وضلع", "answerIndex": 3, "explanation": "زاويتان متناظرتان متساويتان وضلع متناظر متساوٍ حالة تطابق (زاوية، ضلع، زاوية) أو (زاوية، زاوية، ضلع).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-208", "question": "في المثلثين ب ج د، ب هـ د: ب ج = ب هـ، والشعاع ب د ينصف زاوية أ ب ج، وب د ضلع مشترك، فالمثلثان متطابقان بحالة...", "choices": ["ضلع، زاوية، ضلع", "ضلع، ضلع، ضلع", "زاوية، ضلع، زاوية", "زاوية، زاوية، ضلع"], "answer": "ضلع، زاوية، ضلع", "answerIndex": 0, "explanation": "من اختبار الشاطر نوفمبر 2027 (شبابيك): ب ج = ب هـ (معطى)، وقياس زاوية ج ب د = قياس زاوية هـ ب د (لأن ب د منصف)، وب د ضلع مشترك، فهي حالة (ضلع، زاوية، ضلع).", "type": "mcq", "topic": "", "source": "https://shbabbek.com/show/288652"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-209", "question": "إذا تطابق مثلثان فإن مساحتيهما...", "choices": ["إحداهما ضعف الأخرى", "مجموعهما 180", "متساويتان", "لا علاقة بينهما"], "answer": "متساويتان", "answerIndex": 2, "explanation": "التطابق يعني تساوي جميع العناصر المتناظرة، ومنها المساحتان والمحيطان.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-210", "question": "كم عدد حالات تطابق المثلثات؟", "choices": ["3", "5", "4", "6"], "answer": "5", "answerIndex": 1, "explanation": "حالات تطابق المثلثات خمس: (ضلع، ضلع، ضلع)، (ضلع، زاوية، ضلع)، (زاوية، ضلع، زاوية)، (زاوية، زاوية، ضلع)، (وتر، ضلع قائمة).", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-211", "question": "في مثلث قائم الزاوية طولا ضلعي القائمة 3 سم و4 سم، فما طول الوتر؟", "choices": ["5 سم", "6 سم", "7 سم", "12 سم"], "answer": "5 سم", "answerIndex": 0, "explanation": "الوتر² = 3² + 4² = 9 + 16 = 25، فالوتر = 5 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-212", "question": "في مثلث قائم الزاوية طول الوتر 13 سم وأحد ضلعي القائمة 5 سم، فما طول الضلع الآخر؟", "choices": ["8 سم", "10 سم", "18 سم", "12 سم"], "answer": "12 سم", "answerIndex": 3, "explanation": "الضلع² = 13² − 5² = 169 − 25 = 144، فالضلع = 12 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-213", "question": "في مثلث قائم الزاوية طول الوتر 10 سم وأحد ضلعي القائمة 6 سم، فما طول الضلع الآخر؟", "choices": ["4 سم", "6 سم", "8 سم", "14 سم"], "answer": "8 سم", "answerIndex": 2, "explanation": "الضلع² = 10² − 6² = 100 − 36 = 64، فالضلع = 8 سم.", "type": "mcq", "topic": "", "source": "https://www.elriydyaty.com/2026/11/2027_01052661481.html"}, {"grade": 8, "subject": "الهندسة", "id": "h26-g8-214", "question": "في مثلث قائم الزاوية طولا ضلعي القائمة 6 سم و8 سم، فما طول الوتر؟", "choices": ["12 سم", "10 سم
