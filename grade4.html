rIndex": 0, "explanation": "صحيحة: معالج الكلمات يتيح إدراج روابط تشعبية تصل تقريرك بمواقع إلكترونية أخرى.", "type": "normal", "topic": "معالجة الكلمات والبحث الرقمي"}, {"grade": 4, "subject": "تكنولوجيا المعلومات", "id": "b3-6", "question": "يمكنك إجراء مكالمات الفيديو مع صديقك من خلال ......", "choices": ["الماسح الضوئي", "التليفون المحمول", "الطابعة"], "answer": "التليفون المحمول", "answerIndex": 1, "explanation": "التليفون المحمول مزوّد بكاميرا واتصال بالإنترنت، فيمكنك من إجراء مكالمات الفيديو مع صديقك.", "type": "normal", "topic": "الإنترنت والاتصال"}, {"grade": 4, "subject": "تكنولوجيا المعلومات", "id": "b3-7", "question": "عند إجراء بحث رقمي يجب أن يتضمن مخططك ......", "choices": ["مقدمة لموضوع البحث", "تفاصيل بعيدة عن الموضوع", "معلومات غير موثوقة"], "answer": "مقدمة لموضوع البحث", "answerIndex": 0, "explanation": "أي بحث رقمي منظم يبدأ بمقدمة تمهّد لموضوع البحث وتوضح فكرته قبل عرض التفاصيل.", "type": "normal", "topic": "معالجة الكلمات والبحث الرقمي"}, {"grade": 4, "subject": "تكنولوجيا المعلومات", "id": "b3-8", "question": "البرامج التعليمية المسجلة من أشكال الاتصال ......", "choices": ["المتزامن", "غير المتزامن", "كلاهما صحيح"], "answer": "غير المتزامن", "answerIndex": 1, "explanation": "الاتصال غير المتزامن لا يحدث في اللحظة نفسها، مثل مشاهدة درس مسجل في الوقت الذي يناسبك.", "type": "normal", "topic": "الشبكات"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-1", "question": "ثعلب الفنك يعيش في الصحراء، وأذناه كبيرتان. فائدة أذنيه الكبيرتين هي ......", "choices": ["الطيران", "فقد حرارة الجسم وسماع الأصوات الضعيفة", "السباحة", "حفر الجحور"], "answer": "فقد حرارة الجسم وسماع الأصوات الضعيفة", "answerIndex": 1, "explanation": "أذنا الفنك الكبيرتان تكيف يساعده على التخلص من حرارة الجسم الزائدة وسماع حركة فرائسه في رمال الصحراء.", "type": "normal", "topic": "التكيف والبقاء"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-2", "question": "يخزّن الجمل الدهون في ...... ليستخدمها عند قلة الغذاء.", "choices": ["الذيل", "السنام", "الأذن", "الرقبة"], "answer": "السنام", "answerIndex": 1, "explanation": "سنام الجمل مخزن للدهون يمدّه بالطاقة عند ندرة الطعام والماء في الصحراء، لذلك لُقّب بسفينة الصحراء.", "type": "normal", "topic": "التكيف والبقاء"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-3", "question": "خُف الجمل عريض ومسطح. هذا التكيف يساعده على ......", "choices": ["المشي على الرمال دون أن يغوص فيها", "السباحة في الماء", "تسلق الأشجار", "الإمساك بالفريسة"], "answer": "المشي على الرمال دون أن يغوص فيها", "answerIndex": 0, "explanation": "الخف العريض يوزع وزن الجمل على مساحة أكبر فلا يغوص في الرمال الناعمة.", "type": "normal", "topic": "التكيف والبقاء"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-4", "question": "ريش البطريق الكثيف وطبقة الدهن تحت جلده تكيف يساعده على ......", "choices": ["العيش في المناطق شديدة البرودة", "العيش في الصحراء الحارة", "الطيران لمسافات طويلة", "العيش في الماء العذب"], "answer": "العيش في المناطق شديدة البرودة", "answerIndex": 0, "explanation": "البطريق يعيش في القارة القطبية، وريشه الكثيف ودهنه السميك يحفظان حرارة جسمه من البرد القارس.", "type": "normal", "topic": "التكيف والبقاء"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-5", "question": "نبات الصبار له أشواك بدلًا من الأوراق العريضة. الهدف من هذا التكيف هو ......", "choices": ["تقليل فقد الماء", "جذب الحشرات", "زيادة فقد الماء", "إنتاج الثمار"], "answer": "تقليل فقد الماء", "answerIndex": 0, "explanation": "تحوّرت أوراق الصبار إلى أشواك فقلّت مساحة فقد الماء، كما أنها تحميه من الحيوانات، وساقه السميكة تخزن الماء.", "type": "normal", "topic": "التكيف والبقاء"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-6", "question": "الحيوانات الليلية في الصحراء تنشط ليلًا وتنام نهارًا في الجحور. سبب ذلك هو ......", "choices": ["الهرب من حرارة النهار الشديدة", "حب الظلام", "البحث عن الماء في البحر", "الهجرة"], "answer": "الهرب من حرارة النهار الشديدة", "answerIndex": 0, "explanation": "النشاط الليلي تكيف سلوكي؛ فجو الصحراء ليلًا ألطف، فيخرج الحيوان للصيد ويختبئ نهارًا من الحرارة.", "type": "normal", "topic": "التكيف والبقاء"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-7", "question": "أي مما يلي مثال على التكيف السلوكي؟", "choices": ["أذن الفنك الكبيرة", "هجرة الطيور في الشتاء", "سنام الجمل", "أشواك الصبار"], "answer": "هجرة الطيور في الشتاء", "answerIndex": 1, "explanation": "الهجرة سلوك يفعله الكائن الحي، فهي تكيف سلوكي، أما الأذن والسنام والأشواك فتراكيب في الجسم: تكيف تركيبي.", "type": "normal", "topic": "التكيف والبقاء"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-8", "question": "إذا انتقل كائن حي إلى بيئة لا يناسبها تكيفه، فإنه قد ......", "choices": ["يتكاثر بسرعة", "يموت أو يهاجر", "يتحول إلى نبات", "يكبر حجمه فورًا"], "answer": "يموت أو يهاجر", "answerIndex": 1, "explanation": "الكائن الذي لا يستطيع التكيف مع بيئته الجديدة ولا يجد غذاءه ومأواه قد يهاجر إلى بيئة مناسبة أو يموت.", "type": "normal", "topic": "التكيف والبقاء"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-9", "question": "الجزء الذي يمتص الماء والأملاح من التربة هو ......", "choices": ["الورقة", "الجذر", "الزهرة", "الثمرة"], "answer": "الجذر", "answerIndex": 1, "explanation": "الجذر يثبّت النبات في التربة ويمتص الماء والأملاح المعدنية اللازمة لنموه.", "type": "normal", "topic": "أجزاء النبات ووظائفها"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-10", "question": "تصنع الورقة غذاء النبات في عملية تسمى ......", "choices": ["التلقيح", "البناء الضوئي", "الإنبات", "التنفس فقط"], "answer": "البناء الضوئي", "answerIndex": 1, "explanation": "في البناء الضوئي تستخدم الورقة ضوء الشمس والماء وثاني أكسيد الكربون لصنع الغذاء وإطلاق الأكسجين.", "type": "normal", "topic": "أجزاء النبات ووظائفها"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-11", "question": "وظيفة الساق الأساسية هي ......", "choices": ["امتصاص الماء فقط", "حمل الأوراق والأزهار ونقل الماء والغذاء", "صنع البذور", "حماية البذرة"], "answer": "حمل الأوراق والأزهار ونقل الماء والغذاء", "answerIndex": 1, "explanation": "الساق تحمل الأوراق والأزهار وتنقل الماء من الجذر إلى باقي النبات، والغذاء من الأوراق إلى باقي أجزائه.", "type": "normal", "topic": "أجزاء النبات ووظائفها"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-12", "question": "الجزء المسؤول عن التكاثر في النبات هو ......", "choices": ["الجذر", "الساق", "الزهرة", "الورقة"], "answer": "الزهرة", "answerIndex": 2, "explanation": "الزهرة عضو التكاثر في النباتات المزهرة؛ وبعد تلقيحها تتحول إلى ثمرة تحتوي على البذور.", "type": "normal", "topic": "الأزهار والثمار"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-13", "question": "انتقال حبوب اللقاح من زهرة إلى أخرى يسمى ......", "choices": ["الإنبات", "التلقيح", "الري", "الحصاد"], "answer": "التلقيح", "answerIndex": 1, "explanation": "التلقيح انتقال حبوب اللقاح إلى الجزء المؤنث في الزهرة، ويتم بوساطة الرياح أو الحشرات مثل النحل.", "type": "normal", "topic": "الأزهار والثمار"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-14", "question": "داخل الثمرة توجد ...... التي تنبت منها نباتات جديدة.", "choices": ["الأوراق", "البذور", "الجذور", "الأغصان"], "answer": "البذور", "answerIndex": 1, "explanation": "الثمرة تحمي البذور وتساعد على انتشارها، والبذرة إذا توفر لها الماء والهواء والحرارة المناسبة تنبت نباتًا جديدًا.", "type": "normal", "topic": "الأزهار والثمار"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-15", "question": "النحل يساعد النباتات المزهرة على ......", "choices": ["امتصاص الماء", "نقل حبوب اللقاح بين الأزهار", "صنع التربة", "قطع الأوراق"], "answer": "نقل حبوب اللقاح بين الأزهار", "answerIndex": 1, "explanation": "عندما يتنقل النحل بين الأزهار لجمع الرحيق تلتصق حبوب اللقاح بجسمه فتنتقل من زهرة لأخرى ويحدث التلقيح.", "type": "normal", "topic": "الأزهار والثمار"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-16", "question": "شروط إنبات البذرة هي توفر ......", "choices": ["الماء والهواء والحرارة المناسبة", "الضوء القوي فقط", "الظلام التام فقط", "الماء المالح"], "answer": "الماء والهواء والحرارة المناسبة", "answerIndex": 0, "explanation": "تحتاج البذرة للإنبات إلى الماء والهواء (الأكسجين) ودرجة حرارة مناسبة، ثم يخرج منها الجذير والساق الصغيرة.", "type": "normal", "topic": "الأزهار والثمار"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-17", "question": "يبدأ هضم الطعام في ......", "choices": ["المعدة", "الفم", "الأمعاء الغليظة", "الكبد"], "answer": "الفم", "answerIndex": 1, "explanation": "في الفم تُقطّع الأسنان الطعام ويختلط باللعاب، ثم يكمل الهضم في المعدة والأمعاء الدقيقة.", "type": "normal", "topic": "أجهزة جسم الإنسان"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-18", "question": "يتم امتصاص الغذاء المهضوم في ......", "choices": ["الأمعاء الدقيقة", "المريء", "البلعوم", "الأمعاء الغليظة"], "answer": "الأمعاء الدقيقة", "answerIndex": 0, "explanation": "الأمعاء الدقيقة هي مكان اكتمال الهضم وامتصاص الغذاء إلى الدم، أما الغليظة فتمتص الماء والأملاح.", "type": "normal", "topic": "أجهزة جسم الإنسان"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-19", "question": "أي مما يلي مصدر طبيعي للطاقة؟", "choices": ["الشمس", "البطارية", "المصباح", "المحرك"], "answer": "الشمس", "answerIndex": 0, "explanation": "الشمس مصدر طبيعي أساسي للضوء والحرارة، أما البطارية والمصباح والمحرك فمن صنع الإنسان.", "type": "normal", "topic": "الطاقة والحركة"}, {"grade": 4, "subject": "العلوم", "id": "n26-g4-20", "question": "عند فرك اليدين بسرعة نشعر بالحرارة؛ لأن طاقة الحركة تتحول إلى ......", "choices": ["طاقة صوتية", "طاقة حرارية", "طاقة ضوئية", "طاقة كيميائية"], "answer": "طاقة حرارية", "answerIndex": 1, "explanation": "الاحتكاك يحوّل طاقة الحركة إلى طاقة حرارية، لذلك تسخن اليدان عند فركهما.", "type": "normal", "topic": "الطاقة والحركة"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-21", "question": "الجزء من الخريطة الذي يوضح معاني الرموز والألوان هو ......", "choices": ["العنوان", "مفتاح الخريطة", "مقياس الرسم", "سهم الشمال"], "answer": "مفتاح الخريطة", "answerIndex": 1, "explanation": "مفتاح الخريطة (الدليل) يشرح ما تدل عليه الرموز والألوان المستخدمة فيها.", "type": "normal", "topic": "الخريطة وعناصرها"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-22", "question": "سهم الشمال على الخريطة يدل على ......", "choices": ["اتجاه الرياح", "اتجاه الشمال والجهات الأصلية", "أماكن المدن", "حدود الدولة"], "answer": "اتجاه الشمال والجهات الأصلية", "answerIndex": 1, "explanation": "سهم الشمال يساعدنا على تحديد الاتجاهات الأصلية: الشمال والجنوب والشرق والغرب على الخريطة.", "type": "normal", "topic": "الخريطة وعناصرها"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-23", "question": "الجهات الأصلية أربع هي: الشمال والجنوب و......", "choices": ["الأمام والخلف", "الشرق والغرب", "الأعلى والأسفل", "اليمين واليسار"], "answer": "الشرق والغرب", "answerIndex": 1, "explanation": "الجهات الأصلية: الشمال والجنوب والشرق والغرب، وبينها جهات فرعية مثل الشمال الشرقي.", "type": "normal", "topic": "الخريطة وعناصرها"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-24", "question": "وظيفة مقياس الرسم على الخريطة هي ......", "choices": ["توضيح الرموز", "معرفة المسافات الحقيقية على الأرض", "تحديد الشمال", "كتابة اسم الخريطة"], "answer": "معرفة المسافات الحقيقية على الأرض", "answerIndex": 1, "explanation": "مقياس الرسم هو النسبة بين المسافة على الخريطة والمسافة الحقيقية على سطح الأرض.", "type": "normal", "topic": "الخريطة وعناصرها"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-25", "question": "عاصمة جمهورية مصر العربية هي مدينة ......", "choices": ["الإسكندرية", "القاهرة", "الجيزة", "أسوان"], "answer": "القاهرة", "answerIndex": 1, "explanation": "القاهرة هي عاصمة مصر وأكبر مدنها، وتقع على ضفتي نهر النيل.", "type": "normal", "topic": "مصرنا الحبيبة"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-26", "question": "أطول أنهار العالم ويجري في مصر من الجنوب إلى الشمال هو نهر ......", "choices": ["الفرات", "النيل", "الأمازون", "الدجلة"], "answer": "النيل", "answerIndex": 1, "explanation": "نهر النيل شريان الحياة في مصر؛ تقوم على ضفافه الزراعة وتتركز حوله المدن والقرى.", "type": "normal", "topic": "مصرنا الحبيبة"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-27", "question": "توجد أهرامات الجيزة وتمثال أبو الهول في محافظة ......", "choices": ["الأقصر", "الجيزة", "أسوان", "الإسكندرية"], "answer": "الجيزة", "answerIndex": 1, "explanation": "أهرامات الجيزة الثلاثة (خوفو وخفرع ومنقرع) وتمثال أبو الهول من أعظم آثار الحضارة المصرية القديمة.", "type": "normal", "topic": "مصرنا الحبيبة"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-28", "question": "ألوان علم مصر من أعلى إلى أسفل هي ......", "choices": ["أخضر وأبيض وأسود", "أحمر وأبيض وأسود", "أزرق وأبيض وأحمر", "أصفر وأبيض وأسود"], "answer": "أحمر وأبيض وأسود", "answerIndex": 1, "explanation": "علم مصر ثلاثة ألوان أفقية: الأحمر ثم الأبيض (وفي وسطه نسر صلاح الدين) ثم الأسود.", "type": "normal", "topic": "رموز الوطن"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-29", "question": "البيئة التي تقوم على ضفاف النيل وفي الدلتا وتعتمد على الري الدائم هي البيئة ......", "choices": ["الصحراوية", "الزراعية", "الساحلية", "الصناعية"], "answer": "الزراعية", "answerIndex": 1, "explanation": "البيئة الزراعية في وادي النيل ودلتاه؛ تربتها طينية خصبة وتروى بمياه النيل طوال العام.", "type": "normal", "topic": "البيئات المصرية"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-30", "question": "تتميز البيئة الصحراوية في مصر بـ ......", "choices": ["كثرة الأمطار", "ندرة المياه وقلة السكان", "كثافة الغابات", "فيضانات الأنهار"], "answer": "ندرة المياه وقلة السكان", "answerIndex": 1, "explanation": "البيئة الصحراوية جافة قليلة المطر، ويتركز سكانها في الواحات حيث توجد المياه الجوفية.", "type": "normal", "topic": "البيئات المصرية"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-31", "question": "الواحات مناطق خضراء توجد داخل ......", "choices": ["البحر", "الصحراء", "الدلتا", "الجبال الثلجية"], "answer": "الصحراء", "answerIndex": 1, "explanation": "الواحات مثل سيوة والخارجة والداخلة تعتمد على المياه الجوفية والعيون وسط الصحراء.", "type": "normal", "topic": "البيئات المصرية"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-32", "question": "مدينة الإسكندرية مثال على البيئة ...... لأنها تطل على البحر المتوسط.", "choices": ["الساحلية", "الصحراوية", "الزراعية", "الجبلية"], "answer": "الساحلية", "answerIndex": 0, "explanation": "البيئة الساحلية تقع على شواطئ البحار، ويعمل كثير من سكانها بالصيد والتجارة والملاحة.", "type": "normal", "topic": "البيئات المصرية"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-33", "question": "إذا وقفتَ في الصباح ووجهك نحو الشمس، فإن الشمس تكون في جهة ......", "choices": ["الغرب", "الشرق", "الجنوب", "الشمال"], "answer": "الشرق", "answerIndex": 1, "explanation": "تشرق الشمس من جهة الشرق، فإذا واجهتها صباحًا كان الشرق أمامك والغرب خلفك.", "type": "normal", "topic": "الخريطة وعناصرها"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-34", "question": "يقسّم نهر النيل شمال القاهرة إلى فرعين هما ......", "choices": ["فرعا النيل الأزرق والأبيض", "فرعا دمياط ورشيد", "ترعة ومصرف", "فرعا النيل والفرات"], "answer": "فرعا دمياط ورشيد", "answerIndex": 1, "explanation": "عند القناطر الخيرية يتفرع النيل إلى فرع دمياط شرقًا وفرع رشيد غربًا، وبينهما تقع دلتا النيل.", "type": "normal", "topic": "مصرنا الحبيبة"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-35", "question": "يعمل الفلاح في البيئة الزراعية بزراعة المحاصيل مثل ......", "choices": ["القطن والقمح", "الحديد والصلب", "البترول", "الأسماك فقط"], "answer": "القطن والقمح", "answerIndex": 0, "explanation": "من محاصيل البيئة الزراعية المصرية: القطن والقمح والأرز وقصب السكر والخضراوات والفاكهة.", "type": "normal", "topic": "الموارد والمهن"}, {"grade": 4, "subject": "الدراسات الاجتماعية", "id": "n26-g4-36", "question": "يتوسط علمَ مصر في اللون الأبيض شعارُ ......", "choices": ["الهلال", "نسر صلاح الدين", "زهرة اللوتس", "الشمس"], "answer": "نسر صلاح الدين", "answerIndex": 1, "explanation": "في وسط الشريط الأبيض من علم مصر يوجد نسر صلاح الدين الأيوبي، وهو شعار الجمهورية.", "type": "normal", "topic": "رموز الوطن"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-37", "question": "ما المبتدأ في جملة «الحديقةُ جميلةٌ»؟", "choices": ["جميلةٌ", "الحديقةُ", "لا يوجد مبتدأ", "الجملة كلها"], "answer": "الحديقةُ", "answerIndex": 1, "explanation": "المبتدأ هو الاسم الذي نبدأ به الجملة الاسمية ونخبر عنه، وهو «الحديقةُ»، و«جميلةٌ» هي الخبر.", "type": "normal", "topic": "الجملة الاسمية: المبتدأ والخبر"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-38", "question": "ما الخبر في جملة «التلميذُ نشيطٌ»؟", "choices": ["التلميذُ", "نشيطٌ", "لا يوجد خبر", "حرف الجر"], "answer": "نشيطٌ", "answerIndex": 1, "explanation": "الخبر هو ما نخبر به عن المبتدأ ويتمم معنى الجملة؛ فـ«نشيطٌ» خبر يخبرنا عن حال التلميذ.", "type": "normal", "topic": "الجملة الاسمية: المبتدأ والخبر"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-39", "question": "المبتدأ والخبر يكونان دائمًا ......", "choices": ["منصوبين", "مجرورين", "مرفوعين", "مبنيين"], "answer": "مرفوعين", "answerIndex": 2, "explanation": "المبتدأ والخبر مرفوعان: بالضمة مع المفرد، وبالألف مع المثنى، وبالواو مع جمع المذكر السالم.", "type": "normal", "topic": "الجملة الاسمية: المبتدأ والخبر"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-40", "question": "مثنى كلمة «كتاب» هو ......", "choices": ["كتب", "كتابان", "كاتبان", "مكتبات"], "answer": "كتابان", "answerIndex": 1, "explanation": "المثنى يدل على اثنين بزيادة ألف ونون: كتاب + ان = كتابان، أما «كتب» فجمع تكسير.", "type": "normal", "topic": "المفرد والمثنى والجمع"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-41", "question": "جمع كلمة «معلمة» جمع مؤنث سالم هو ......", "choices": ["معلمون", "معلمات", "معلمان", "علماء"], "answer": "معلمات", "answerIndex": 1, "explanation": "جمع المؤنث السالم يُكوَّن بزيادة ألف وتاء: معلمة ← معلمات.", "type": "normal", "topic": "المفرد والمثنى والجمع"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-42", "question": "كلمة «مهندسون» نوعها ......", "choices": ["مفرد", "مثنى", "جمع مذكر سالم", "جمع تكسير"], "answer": "جمع مذكر سالم", "answerIndex": 2, "explanation": "«مهندسون» جمع مذكر سالم؛ زيدت فيه الواو والنون على المفرد «مهندس» دون تغيير في بنيته.", "type": "normal", "topic": "المفرد والمثنى والجمع"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-43", "question": "أي كلمة مما يلي جمع تكسير؟", "choices": ["مسلمون", "أقلام", "طالبان", "معلمات"], "answer": "أقلام", "answerIndex": 1, "explanation": "جمع التكسير تتغير فيه صورة المفرد: قلم ← أقلام، أما مسلمون فجمع مذكر سالم ومعلمات جمع مؤنث سالم وطالبان مثنى.", "type": "normal", "topic": "المفرد والمثنى والجمع"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-44", "question": "الضمير «أنتما» يدل على ......", "choices": ["المثنى المخاطب", "جمع الذكور", "المفردة المؤنثة", "الغائب"], "answer": "المثنى المخاطب", "answerIndex": 0, "explanation": "«أنتما» ضمير مخاطب للمثنى (مذكرًا كان أو مؤنثًا)، مثل: أنتما مجتهدان.", "type": "normal", "topic": "الضمائر"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-45", "question": "ما الفاعل في جملة «نجحَ المجتهدُ»؟", "choices": ["نجحَ", "المجتهدُ", "لا يوجد", "الحرف"], "answer": "المجتهدُ", "answerIndex": 1, "explanation": "نسأل: من الذي نجح؟ المجتهدُ، فهو الفاعل، وهو مرفوع وعلامة رفعه الضمة.", "type": "normal", "topic": "الجملة الفعلية والفاعل"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-46", "question": "أكمل بخبر مناسب: السماءُ ......", "choices": ["صافيةٌ", "في", "من", "كتابٌ"], "answer": "صافيةٌ", "answerIndex": 0, "explanation": "الجملة الاسمية تحتاج إلى خبر يتمم معناها؛ «صافيةٌ» خبر مرفوع يخبر عن السماء.", "type": "normal", "topic": "الجملة الاسمية: المبتدأ والخبر"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-47", "question": "أي جملة فيها ضمير غائب؟", "choices": ["أنا أكتب", "نحن نلعب", "هو يقرأ", "أنتَ تذاكر"], "answer": "هو يقرأ", "answerIndex": 2, "explanation": "«هو» ضمير غائب للمفرد المذكر، أما «أنا» و«نحن» فضميرا متكلم، و«أنتَ» ضمير مخاطب.", "type": "normal", "topic": "الضمائر"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-48", "question": "مفرد كلمة «أشجار» هو ......", "choices": ["شجرتان", "شجرة", "مشجرة", "شجيرات"], "answer": "شجرة", "answerIndex": 1, "explanation": "«أشجار» جمع تكسير، ومفرده «شجرة»، ومثناه «شجرتان».", "type": "normal", "topic": "المفرد والمثنى والجمع"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-49", "question": "في جملة «المعلمان مخلصان» علامة رفع المبتدأ هي ......", "choices": ["الضمة", "الألف", "الواو", "الفتحة"], "answer": "الألف", "answerIndex": 1, "explanation": "«المعلمان» مثنى، والمثنى يُرفع بالألف، وينصب ويجر بالياء.", "type": "normal", "topic": "الجملة الاسمية: المبتدأ والخبر"}, {"grade": 4, "subject": "العربي", "id": "n26-g4-50", "question": "في جملة «المسلمون متعاونون» علامة رفع الخبر هي ......", "choices": ["الضمة", "الألف", "الواو", "الياء"], "answer": "الواو", "answerIndex": 2, "explanation": "«متعاونون» جمع مذكر سالم، وجمع المذكر السالم يُرفع بالواو، وينصب ويجر بالياء.", "type": "normal", "topic": "الجملة الاسمية: المبتدأ والخبر"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "n26-g4-51", "question": "أول الرسل عليهم السلام هو سيدنا ......", "choices": ["إبراهيم", "نوح", "محمد", "موسى"], "answer": "نوح", "answerIndex": 1, "explanation": "سيدنا نوح عليه السلام هو أول الرسل، دعا قومه إلى عبادة الله وحده زمنًا طويلًا، أما أول الأنبياء فهو سيدنا آدم عليه السلام.", "type": "normal", "topic": "العقيدة: الإيمان بالرسل"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "n26-g4-52", "question": "الزكاة هي ......", "choices": ["صيام شهر في السنة", "مقدار معلوم من المال يعطى للفقراء والمحتاجين", "زيارة بيت الله الحرام", "الصلاة في المسجد"], "answer": "مقدار معلوم من المال يعطى للفقراء والمحتاجين", "answerIndex": 1, "explanation": "الزكاة ركن من أركان الإسلام: نصيب معلوم من مال الغني يعطيه لمستحقيه من الفقراء والمساكين وغيرهم.", "type": "normal", "topic": "العبادات: الزكاة"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "n26-g4-53", "question": "أول عمل قام به النبي ﷺ عند وصوله إلى المدينة المنورة هو ......", "choices": ["حفر الخندق", "بناء المسجد النبوي", "فتح مكة", "غزوة بدر"], "answer": "بناء المسجد النبوي", "answerIndex": 1, "explanation": "بدأ النبي ﷺ ببناء المسجد النبوي ليكون مركزًا للعبادة والتعليم واجتماع المسلمين.", "type": "normal", "topic": "السيرة: بناء المسجد النبوي"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "n26-g4-54", "question": "المؤاخاة التي أقامها النبي ﷺ في المدينة كانت بين ......", "choices": ["المهاجرين والأنصار", "المسلمين والمشركين", "الأغنياء فقط", "الصغار والكبار"], "answer": "المهاجرين والأنصار", "answerIndex": 0, "explanation": "آخى النبي ﷺ بين المهاجرين الذين تركوا أموالهم في مكة والأنصار أهل المدينة، فتقاسموا المال والمسكن بمحبة.", "type": "normal", "topic": "السيرة: المؤاخاة"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "n26-g4-55", "question": "الصحابي الذي نزل النبي ﷺ في بيته عند وصوله المدينة هو ......", "choices": ["عمر بن الخطاب", "أبو أيوب الأنصاري", "علي بن أبي طالب", "طلحة بن عبيد الله"], "answer": "أبو أيوب الأنصاري", "answerIndex": 1, "explanation": "استضاف أبو أيوب الأنصاري رضي الله عنه النبيَّ ﷺ في بيته حين قدم المدينة، وأكرم ضيافته غاية الإكرام.", "type": "normal", "topic": "السير والشخصيات"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "n26-g4-56", "question": "الصحابي الجليل عبد الرحمن بن عوف رضي الله عنه كان مشهورًا بـ ......", "choices": ["حفظ الشعر", "التجارة والأمانة والكرم", "صناعة السيوف", "قيادة الأسطول"], "answer": "التجارة والأمانة والكرم", "answerIndex": 1, "explanation": "عبد الرحمن بن عوف من العشرة المبشرين بالجنة، وكان تاجرًا أمينًا كريمًا ينفق ماله في سبيل الله.", "type": "normal", "topic": "السير والشخصيات"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "n26-g4-57", "question": "لام «أل» في كلمة «الشمس» تسمى لامًا ......", "choices": ["قمرية", "شمسية", "ساكنة", "مشددة أصلية"], "answer": "شمسية", "answerIndex": 1, "explanation": "اللام الشمسية تُكتب ولا تُنطق وتدغم في الحرف الشمسي بعدها مثل: الشمس والقمر؟ لا، القمر لامها قمرية تُنطق. من الحروف الشمسية: ت ث د ذ ر ز س ش ص ض ط ظ ل ن.", "type": "normal", "topic": "التجويد: لام أل"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "n26-g4-58", "question": "لام «أل» في كلمة «القمر» تسمى لامًا ......", "choices": ["شمسية", "قمرية", "مخففة", "مدغمة"], "answer": "قمرية", "answerIndex": 1, "explanation": "اللام القمرية تُكتب وتُنطق بوضوح، ومن حروفها: أ ب ج ح خ ع غ ف ق ك م هـ و ي، مثل: القمر والكتاب.", "type": "normal", "topic": "التجويد: لام أل"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "n26-g4-59", "question": "تتحدث أوائل سورة الانفطار عن أحداث تقع ......", "choices": ["يوم القيامة", "في غزوة بدر", "عند بناء الكعبة", "في قصة يوسف"], "answer": "يوم القيامة", "answerIndex": 0, "explanation": "تبدأ السورة بقوله تعالى: ﴿إذا السماء انفطرت﴾ وتصف أهوال يوم القيامة وانشقاق السماء وانتثار الكواكب.", "type": "normal", "topic": "القرآن والتفسير: سورة الانفطار"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "n26-g4-60", "question": "من إكرام الضيف الذي حثّنا عليه الإسلام ......", "choices": ["تجاهله", "استقباله بوجه بشوش وتقديم الطعام له", "تأخير الطعام عنه", "السخرية منه"], "answer": "استقباله بوجه بشوش وتقديم الطعام له", "answerIndex": 1, "explanation": "قال النبي ﷺ: «من كان يؤمن بالله واليوم الآخر فليكرم ضيفه»، وإكرامه بحسن الاستقبال والضيافة.", "type": "normal", "topic": "القيم: إكرام الضيف"}, {"grade": 4, "subject": "الرياضيات", "id": "n26-g4-61", "question": "لغز: أنا عدد من 3 أرقام: مئاتي 5، وعشراتي ضعف آحادي، وآحادي 3. من أنا؟", "choices": ["563", "536", "356", "653"], "answer": "563", "answerIndex": 0, "explanation": "الآحاد 3، والعشرات ضعفها 6، والمئات 5، فالعدد 563.", "type": "puzzle", "topic": "لغز القيمة المكانية"}, {"grade": 4, "subject": "الرياضيات", "id": "n26-g4-62", "question": "لغز: حديقة مربعة الشكل طول ضلعها 7 أمتار. ما محيطها؟", "choices": ["21 مترًا", "28 مترًا", "49 مترًا", "14 مترًا"], "answer": "28 مترًا", "answerIndex": 1, "explanation": "محيط المربع = طول الضلع × 4 = 7 × 4 = 28 مترًا. (أما 49 فهي المساحة).", "type": "puzzle", "topic": "لغز المساحة والمحيط"}, {"grade": 4, "subject": "الرياضيات", "id": "n26-g4-63", "question": "لغز: عدد عوامله: 1، 2، 3، 6 فقط. ما العدد؟", "choices": ["12", "6", "9", "8"], "answer": "6", "answerIndex": 1, "explanation": "عوامل 6 هي 1 و2 و3 و6 فقط؛ لأن 6 = 1×6 = 2×3 ولا يقبل القسمة على غيرها.", "type": "puzzle", "topic": "لغز العوامل"}, {"grade": 4, "subject": "الرياضيات", "id": "n26-g4-64", "question": "لغز: ما ناتج: 5 + 3 × 2 ؟", "choices": ["16", "11", "13", "10"], "answer": "11", "answerIndex": 1, "explanation": "الضرب قبل الجمع: 3 × 2 = 6، ثم 5 + 6 = 11.", "type": "puzzle", "topic": "لغز ترتيب العمليات"}, {"grade": 4, "subject": "القرآن", "id": "h26-g4-1", "question": "أكمل الآية الكريمة: ﴿إِنَّ الَّذِينَ قَالُوا رَبُّنَا اللَّهُ ثُمَّ اسْتَقَامُوا تَتَنَزَّلُ عَلَيْهِمُ ......﴾", "choices": ["الملائكة", "السكينة", "الرحمة", "الآيات"], "answer": "الملائكة", "answerIndex": 0, "explanation": "من سورة فصلت، الآية 30: تتنزل عليهم الملائكة ألا تخافوا ولا تحزنوا.", "type": "mcq", "topic": "سورة فصلت – إكمال", "source": "https://api.alquran.cloud/v1/ayah/41:30/quran-uthmani"}, {"grade": 4, "subject": "القرآن", "id": "h26-g4-2", "question": "أكمل الآية الكريمة: ﴿وَلَا تَسْتَوِي الْحَسَنَةُ وَلَا السَّيِّئَةُ ۚ ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ فَإِذَا الَّذِي بَيْنَكَ وَبَيْنَهُ عَدَاوَةٌ كَأَنَّهُ ......﴾", "choices": ["وليٌّ حميم", "عدوٌّ مبين", "أخٌ قريب", "جارٌ صالح"], "answer": "وليٌّ حميم", "answerIndex": 0, "explanation": "من سورة فصلت، الآية 34: فإذا الذي بينك وبينه عداوة كأنه ولي حميم.", "type": "mcq", "topic": "سورة فصلت – إكمال", "source": "https://api.alquran.cloud/v1/ayah/41:34/quran-uthmani"}, {"grade": 4, "subject": "القرآن", "id": "h26-g4-3", "question": "أكمل الآية الكريمة: ﴿وَقَالَ رَبُّكُمُ ادْعُونِي ...... لَكُمْ﴾", "choices": ["أستجب", "أغفر", "أرزق", "أهدي"], "answer": "أستجب", "answerIndex": 0, "explanation": "من سورة غافر، الآية 60: وقال ربكم ادعوني أستجب لكم.", "type": "mcq", "topic": "سورة غافر – إكمال", "source": "https://api.alquran.cloud/v1/ayah/40:60/quran-uthmani"}, {"grade": 4, "subject": "القرآن", "id": "h26-g4-4", "question": "أكمل الآية الكريمة: ﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنْفُسِهِمْ لَا تَقْنَطُوا مِنْ ...... اللَّهِ﴾", "choices": ["رحمة", "عذاب", "فضل", "نعمة"], "answer": "رحمة", "answerIndex": 0, "explanation": "من سورة الزمر، الآية 53: الى: ﴿مَنْ يَعْمَلْ﴾؟", "choices": ["إدغام بغنة", "إدغام بغير غنة", "إظهار حلقي", "إقلاب"], "answer": "إدغام بغنة", "answerIndex": 0, "explanation": "جاء بعد النون الساكنة حرف الياء، وهو من حروف (ينمو)، فالحكم إدغام بغنة.", "type": "mcq", "topic": "التجويد: أحكام النون والميم", "source": "https://t.me/s/togetherwelearn3"}, {"grade": 4, "subject": "القرآن", "id": "h26-g4-39", "question": "ما حكم النون الساكنة في قوله تعالى: ﴿مِنْ خَيْرٍ﴾؟", "choices": ["إظهار حلقي", "إخفاء حقيقي", "إدغام بغنة", "إقلاب"], "answer": "إظهار حلقي", "answerIndex": 0, "explanation": "جاء بعد النون الساكنة حرف الخاء، وهو من حروف الحلق، فالحكم إظهار حلقي.", "type": "mcq", "topic": "التجويد: أحكام النون والميم", "source": "https://t.me/s/togetherwelearn3"}, {"grade": 4, "subject": "القرآن", "id": "h26-g4-40", "question": "عدد حروف الإخفاء الحقيقي هو:", "choices": ["15 حرفًا", "6 حروف", "4 حروف", "28 حرفًا"], "answer": "15 حرفًا", "answerIndex": 0, "explanation": "حروف الإخفاء الحقيقي خمسة عشر حرفًا، وهي باقي الحروف بعد حروف الإظهار والإدغام والإقلاب.", "type": "mcq", "topic": "التجويد: أحكام النون والميم", "source": "https://t.me/s/togetherwelearn3"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-41", "question": "الركن الرابع من أركان الإيمان أن نؤمن بـ ......", "choices": ["الرسل", "الملائكة", "الكتب السماوية", "اليوم الآخر"], "answer": "الرسل", "answerIndex": 0, "explanation": "أركان الإيمان: الإيمان بالله وملائكته وكتبه ورسله واليوم الآخر والقدر، فالرابع هو الإيمان بالرسل.", "type": "mcq", "topic": "العقيدة: الإيمان بالرسل", "source": "https://archive.org/download/Primary_Stage_Books_Term1_2026_DrMohamedRezk/DrMORazksit_3_8.pdf"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-42", "question": "وظيفة الرسل عليهم السلام هي ......", "choices": ["تبليغ الناس رسالة الله وهدايتهم", "جمع الأموال للناس", "بناء المدن والقصور", "الحكم بين الدول"], "answer": "تبليغ الناس رسالة الله وهدايتهم", "answerIndex": 0, "explanation": "أرسل الله الرسل ليبلغوا الناس دين الله ويهدوهم إلى عبادته وحده.", "type": "mcq", "topic": "العقيدة: الإيمان بالرسل", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-43", "question": "من صفات الرسل عليهم السلام ......", "choices": ["الصدق والأمانة والفطانة", "الكذب عند الحاجة", "النسيان والخطأ في التبليغ", "حب الدنيا والمال"], "answer": "الصدق والأمانة والفطانة", "answerIndex": 0, "explanation": "الرسل صادقون أمناء أذكياء، لا يكذبون ولا يخونون في تبليغ رسالة الله.", "type": "mcq", "topic": "العقيدة: الإيمان بالرسل", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-44", "question": "الرسل جميعهم جاءوا برسالة واحدة، وهي ......", "choices": ["توحيد الله وعبادته وحده", "بناء المساجد الكبيرة", "تعليم الناس التجارة", "جمع الكتب القديمة"], "answer": "توحيد الله وعبادته وحده", "answerIndex": 0, "explanation": "دعوة جميع الرسل واحدة: أن يعبد الناس الله وحده لا شريك له.", "type": "mcq", "topic": "العقيدة: الإيمان بالرسل", "source": "https://archive.org/download/Primary_Stage_Books_Term1_2026_DrMohamedRezk/DrMORazksit_3_8.pdf"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-45", "question": "خاتم الأنبياء والمرسلين هو ......", "choices": ["سيدنا محمد ﷺ", "سيدنا عيسى عليه السلام", "سيدنا موسى عليه السلام", "سيدنا إبراهيم عليه السلام"], "answer": "سيدنا محمد ﷺ", "answerIndex": 0, "explanation": "سيدنا محمد ﷺ هو آخر الأنبياء والمرسلين، لا نبي بعده.", "type": "mcq", "topic": "العقيدة: الإيمان بالرسل", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-46", "question": "المستحقون للزكاة ...... أصناف.", "choices": ["ثمانية", "سبعة", "ستة", "خمسة"], "answer": "ثمانية", "answerIndex": 0, "explanation": "ذكر الله في سورة التوبة ثمانية أصناف يستحقون الزكاة، أولهم الفقراء والمساكين.", "type": "mcq", "topic": "العبادات: الزكاة", "source": "https://archive.org/download/Primary_Stage_Books_Term1_2026_DrMohamedRezk/DrMORazksit_3_8.pdf"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-47", "question": "تُخرج زكاة الزروع والثمار ......", "choices": ["بعد الحصاد مباشرة", "بعد مرور عام كامل", "قبل الزراعة", "في شهر رمضان فقط"], "answer": "بعد الحصاد مباشرة", "answerIndex": 0, "explanation": "زكاة الزروع لا يشترط لها الحول، بل تخرج يوم الحصاد.", "type": "mcq", "topic": "العبادات: الزكاة", "source": "https://archive.org/download/Primary_Stage_Books_Term1_2026_DrMohamedRezk/DrMORazksit_3_8.pdf"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-48", "question": "النصاب هو ......", "choices": ["القدر الذي إذا بلغه المال وجبت فيه الزكاة", "نصف المال الذي يملكه الغني", "المال الذي ينفقه الفقير", "أجر العامل في جمع الزكاة"], "answer": "القدر الذي إذا بلغه المال وجبت فيه الزكاة", "answerIndex": 0, "explanation": "النصاب حد معلوم من المال، إذا بلغه المال وجب إخراج الزكاة منه.", "type": "mcq", "topic": "العبادات: الزكاة", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-49", "question": "نصاب الزكاة من الذهب يعادل ...... جرامًا.", "choices": ["85", "58", "100", "40"], "answer": "85", "answerIndex": 0, "explanation": "نصاب الذهب في منهجنا يعادل 85 جرامًا من الذهب.", "type": "mcq", "topic": "العبادات: الزكاة", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-50", "question": "أي مما يلي من شروط وجوب الزكاة؟", "choices": ["بلوغ المال النصاب", "كثرة عدد الأولاد", "السفر إلى بلد بعيد", "امتلاك بيت كبير"], "answer": "بلوغ المال النصاب", "answerIndex": 0, "explanation": "من شروط الزكاة: الإسلام، وبلوغ المال النصاب، ومرور الحول على المال النقدي.", "type": "mcq", "topic": "العبادات: الزكاة", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-51", "question": "أكمل الحديث الشريف: قال رسول الله ﷺ: «لا زكاة في مالٍ حتى ......»", "choices": ["يحول عليه الحول", "يزيد عن حاجة صاحبه", "يُنفق في سبيل الله", "يُدّخر سنة في البيت"], "answer": "يحول عليه الحول", "answerIndex": 0, "explanation": "الحديث: لا زكاة في مال حتى يحول عليه الحول، أي يمر عليه عام هجري كامل.", "type": "mcq", "topic": "العبادات: الزكاة", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-52", "question": "الصحابي الذي كان اسمه قبل الإسلام «عبد عمرو» هو ......", "choices": ["عبد الرحمن بن عوف", "أبو بكر الصديق", "عمر بن الخطاب", "عثمان بن عفان"], "answer": "عبد الرحمن بن عوف", "answerIndex": 0, "explanation": "كان اسم عبد الرحمن بن عوف في الجاهلية عبد عمرو، فسماه النبي ﷺ عبد الرحمن.", "type": "mcq", "topic": "السير والشخصيات: عبد الرحمن بن عوف", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-53", "question": "توفي الصحابي الجليل عبد الرحمن بن عوف رضي الله عنه سنة ...... هجرية.", "choices": ["32", "23", "40", "13"], "answer": "32", "answerIndex": 0, "explanation": "توفي عبد الرحمن بن عوف سنة 32 هجرية ودفن بالبقيع في المدينة المنورة.", "type": "mcq", "topic": "السير والشخصيات: عبد الرحمن بن عوف", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-54", "question": "كان عبد الرحمن بن عوف رضي الله عنه مثالًا في ......", "choices": ["العمل والاعتماد على النفس", "الكسل والاتكال على الآخرين", "طلب المساعدة من الناس", "ترك التجارة والعمل"], "answer": "العمل والاعتماد على النفس", "answerIndex": 0, "explanation": "رفض عبد الرحمن أن يأخذ نصف مال أخيه، وعمل في التجارة حتى أغناه الله.", "type": "mcq", "topic": "السير والشخصيات: عبد الرحمن بن عوف", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-55", "question": "من قيم المؤاخاة بين المهاجرين والأنصار ......", "choices": ["الإيثار", "التكاسل", "التواكل", "الأنانية"], "answer": "الإيثار", "answerIndex": 0, "explanation": "الإيثار أن يقدم المسلم أخاه على نفسه، وهو من أعظم قيم المؤاخاة.", "type": "mcq", "topic": "السيرة: المؤاخاة", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-56", "question": "نصّت وثيقة المدينة على أن المهاجرين والأنصار ......", "choices": ["أمة واحدة متساوون في الحقوق والواجبات", "المهاجرون أعلى مرتبة من الأنصار", "الأنصار أعلى مرتبة من المهاجرين", "لكل فريق دولة منفصلة"], "answer": "أمة واحدة متساوون في الحقوق والواجبات", "answerIndex": 0, "explanation": "جعلت الوثيقة أهل المدينة أمة واحدة متعاونة، لا فضل لفريق على آخر.", "type": "mcq", "topic": "السيرة: وثيقة المدينة", "source": "https://archive.org/download/Primary_Stage_Books_Term1_2026_DrMohamedRezk/DrMORazksit_3_8.pdf"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-57", "question": "من بنود وثيقة المدينة ......", "choices": ["الدفاع المشترك عن المدينة ضد أي عدوان", "منع الأنصار من التجارة", "هجرة المسلمين من المدينة", "إلغاء جميع الأسواق"], "answer": "الدفاع المشترك عن المدينة ضد أي عدوان", "answerIndex": 0, "explanation": "تعاهد أهل المدينة في الوثيقة على التعاون والدفاع المشترك عن مدينتهم.", "type": "mcq", "topic": "السيرة: وثيقة المدينة", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-58", "question": "أكمل الحديث الشريف: قال رسول الله ﷺ: «من كان يؤمن بالله واليوم الآخر فليكرم ......»", "choices": ["ضيفه", "جاره فقط", "نفسه", "ماله"], "answer": "ضيفه", "answerIndex": 0, "explanation": "الحديث كاملًا: من كان يؤمن بالله واليوم الآخر فليكرم ضيفه.", "type": "mcq", "topic": "القيم: إكرام الضيف", "source": "https://archive.org/download/Primary_Stage_Books_Term1_2026_DrMohamedRezk/DrMORazksit_3_8.pdf"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-59", "question": "الضيافة المشروعة للضيف ...... أيام.", "choices": ["ثلاثة", "واحد", "سبعة", "ثلاثون"], "answer": "ثلاثة", "answerIndex": 0, "explanation": "قال ﷺ: الضيافة ثلاثة أيام، فما زاد فهو صدقة على الضيف.", "type": "mcq", "topic": "القيم: إكرام الضيف", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-60", "question": "لام «أل» في كلمة «النيل» ......", "choices": ["شمسية لا تُنطق", "قمرية تُنطق", "مخففة تُنطق أحيانًا", "ساكنة دائمًا"], "answer": "شمسية لا تُنطق", "answerIndex": 0, "explanation": "النون من الحروف الشمسية، فلام أل في «النيل» لا تُنطق وتدغم في النون.", "type": "mcq", "topic": "التجويد: لام أل", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-61", "question": "لام «أل» في كلمة «البحر» ......", "choices": ["قمرية تُنطق", "شمسية لا تُنطق", "مدغمة في الباء", "محذوفة من الكلمة"], "answer": "قمرية تُنطق", "answerIndex": 0, "explanation": "الباء من الحروف القمرية، فلام أل في «البحر» تُنطق وتظهر.", "type": "mcq", "topic": "التجويد: لام أل", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-62", "question": "عندما تدخل «أل» على كلمة تبدأ بحرف شمسي، فإن اللام ......", "choices": ["لا تُنطق وتُدغم في الحرف الذي بعدها", "تُنطق بوضوح تام", "تُقلب ميمًا", "تُحذف الكلمة كلها"], "answer": "لا تُنطق وتُدغم في الحرف الذي بعدها", "answerIndex": 0, "explanation": "في اللام الشمسية تدغم اللام في الحرف الشمسي بعدها وينطق الحرف مشددًا.", "type": "mcq", "topic": "التجويد: لام أل", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-63", "question": "معنى «انتثرت» في قوله تعالى: ﴿وَإِذَا الْكَوَاكِبُ انتَثَرَتْ﴾ هو:", "choices": ["تفرقت وتساقطت", "تجملت وتزينت", "بسطت ومُهدت", "اجتمعت والتأمت"], "answer": "تفرقت وتساقطت", "answerIndex": 0, "explanation": "انتثرت الكواكب أي تفرقت وتساقطت من أماكنها يوم القيامة.", "type": "mcq", "topic": "القرآن والتفسير: سورة الانفطار", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-64", "question": "معنى «فُجّرت» في قوله تعالى: ﴿وَإِذَا الْبِحَارُ فُجِّرَتْ﴾ هو:", "choices": ["فاضت واختلط ماؤها بعضه ببعض", "جفت وذهب ماؤها", "تجمدت من شدة البرد", "هدأت وسكنت أمواجها"], "answer": "فاضت واختلط ماؤها بعضه ببعض", "answerIndex": 0, "explanation": "فجرت البحار أي فاضت واختلط عذبها بمالحها يوم القيامة.", "type": "mcq", "topic": "القرآن والتفسير: سورة الانفطار", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-65", "question": "أكمل الآية الكريمة من سورة الانفطار: ﴿عَلِمَتْ نَفْسٌ مَا قَدَّمَتْ وَ......﴾", "choices": ["أخرت", "نسيت", "أخفت", "كسبت"], "answer": "أخرت", "answerIndex": 0, "explanation": "الآية 5 من سورة الانفطار: علمت نفس ما قدمت وأخرت.", "type": "mcq", "topic": "القرآن والتفسير: سورة الانفطار", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-66", "question": "أكمل الآية الكريمة من سورة الانفطار: ﴿يَا أَيُّهَا الْإِنْسَانُ مَا غَرَّكَ بِرَبِّكَ ......﴾", "choices": ["الكريم", "العظيم", "الرحيم", "الحكيم"], "answer": "الكريم", "answerIndex": 0, "explanation": "الآية 6 من سورة الانفطار: ما غرك بربك الكريم.", "type": "mcq", "topic": "القرآن والتفسير: سورة الانفطار", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-67", "question": "الاسم الحقيقي للصحابي أبي أيوب الأنصاري رضي الله عنه هو ......", "choices": ["خالد بن زيد", "زيد بن حارثة", "خالد بن الوليد", "سعد بن معاذ"], "answer": "خالد بن زيد", "answerIndex": 0, "explanation": "أبو أيوب الأنصاري اسمه خالد بن زيد بن كليب من بني النجار.", "type": "mcq", "topic": "السير والشخصيات: أبو أيوب الأنصاري", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-68", "question": "دُفن أبو أيوب الأنصاري رضي الله عنه عند أسوار ......", "choices": ["القسطنطينية", "دمشق", "القاهرة", "بغداد"], "answer": "القسطنطينية", "answerIndex": 0, "explanation": "أوصى أبو أيوب أن يدفن عند أسوار القسطنطينية، فدفن هناك رضي الله عنه.", "type": "mcq", "topic": "السير والشخصيات: أبو أيوب الأنصاري", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-69", "question": "أول مسجد بُني في الإسلام هو ......", "choices": ["مسجد قباء", "المسجد النبوي", "المسجد الحرام", "المسجد الأقصى"], "answer": "مسجد قباء", "answerIndex": 0, "explanation": "أسس النبي ﷺ مسجد قباء عند وصوله مشارف المدينة، وهو أول مسجد في الإسلام.", "type": "mcq", "topic": "السيرة: بناء المسجد النبوي", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-70", "question": "كانت أرض المسجد النبوي ملكًا لـ ......", "choices": ["غلامين يتيمين من الأنصار", "أبي أيوب الأنصاري", "أبي بكر الصديق", "تجار من قريش"], "answer": "غلامين يتيمين من الأنصار", "answerIndex": 0, "explanation": "كانت الأرض لغلامين يتيمين (سهل وسهيل)، فاشتراها النبي ﷺ منهما لبناء المسجد.", "type": "mcq", "topic": "السيرة: بناء المسجد النبوي", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-71", "question": "آخى النبي ﷺ بين عبد الرحمن بن عوف و ...... من الأنصار.", "choices": ["سعد بن الربيع", "أبو أيوب الأنصاري", "سعد بن معاذ", "زيد بن حارثة"], "answer": "سعد بن الربيع", "answerIndex": 0, "explanation": "آخى النبي ﷺ بين عبد الرحمن بن عوف وسعد بن الربيع الأنصاري رضي الله عنهما.", "type": "mcq", "topic": "السيرة: المؤاخاة", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "التربية الإسلامية", "id": "h26-g4-72", "question": "عندما عرض سعد بن الربيع نصف ماله على عبد الرحمن بن عوف، طلب عبد الرحمن بدلًا من ذلك أن ......", "choices": ["يدله على السوق", "يبني له بيتًا", "يعطيه جملًا", "يسافر معه"], "answer": "يدله على السوق", "answerIndex": 0, "explanation": "قال عبد الرحمن: بارك الله لك في أهلك ومالك، دلني على السوق، فعمل وتاجر حتى أغناه الله.", "type": "mcq", "topic": "السيرة: المؤاخاة", "source": "https://www.modrsbook.com/pdf/25287/preview"}, {"grade": 4, "subject": "ال var AYAH={"036028": {"a": 28, "text": "۞ وَمَآ أَنزَلْنَا عَلَىٰ قَوْمِهِۦ مِنۢ بَعْدِهِۦ مِن جُندٍۢ مِّنَ ٱلسَّمَآءِ وَمَا كُنَّا مُنزِلِينَ"}, "045012": {"a": 12, "text": "۞ ٱللَّهُ ٱلَّذِى سَخَّرَ لَكُمُ ٱلْبَحْرَ لِتَجْرِىَ ٱلْفُلْكُ فِيهِ بِأَمْرِهِۦ وَلِتَبْتَغُوا۟ مِن فَضْلِهِۦ وَلَعَلَّكُمْ تَشْكُرُونَ"}, "043010": {"a": 10, "text": "ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ مَهْدًۭا وَجَعَلَ لَكُمْ فِيهَا سُبُلًۭا لَّعَلَّكُمْ تَهْتَدُونَ"}, "038059": {"a": 59, "text": "هَٰذَا فَوْجٌۭ مُّقْتَحِمٌۭ مَّعَكُمْ ۖ لَا مَرْحَبًۢا بِهِمْ ۚ إِنَّهُمْ صَالُوا۟ ٱلنَّارِ"}, "043008": {"a": 8, "text": "فَأَهْلَكْنَآ أَشَدَّ مِنْهُم بَطْشًۭا وَمَضَىٰ مَثَلُ ٱلْأَوَّلِينَ"}, "035006": {"a": 6, "text": "إِنَّ ٱلشَّيْطَٰنَ لَكُمْ عَدُوٌّۭ فَٱتَّخِذُوهُ عَدُوًّا ۚ إِنَّمَا يَدْعُوا۟ حِزْبَهُۥ لِيَكُونُوا۟ مِنْ أَصْحَٰبِ ٱلسَّعِيرِ"}, "041033": {"a": 33, "text": "وَمَنْ أَحْسَنُ قَوْلًۭا مِّمَّن دَعَآ إِلَى ٱللَّهِ وَعَمِلَ صَٰلِحًۭا وَقَالَ إِنَّنِى مِنَ ٱلْمُسْلِمِينَ"}, "040051": {"a": 51, "text": "إِنَّا لَنَنصُرُ رُسُلَنَا وَٱلَّذِينَ ءَامَنُوا۟ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَيَوْمَ يَقُومُ ٱلْأَشْهَٰدُ"}, "042010": {"a": 10, "text": "وَمَا ٱخْتَلَفْتُمْ فِيهِ مِن شَىْءٍۢ فَحُكْمُهُۥٓ إِلَى ٱللَّهِ ۚ ذَٰلِكُمُ ٱللَّهُ رَبِّى عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ أُنِيبُ"}, "036051": {"a": 51, "text": "وَنُفِخَ فِى ٱلصُّورِ فَإِذَا هُم مِّنَ ٱلْأَجْدَاثِ إِلَىٰ رَبِّهِمْ يَنسِلُونَ"}, "040030": {"a": 30, "text": "وَقَالَ ٱلَّذِىٓ ءَامَنَ يَٰقَوْمِ إِنِّىٓ أَخَافُ عَلَيْكُم مِّثْلَ يَوْمِ ٱلْأَحْزَابِ"}, "062004": {"a": 4, "text": "ذَٰلِكَ فَضْلُ ٱللَّهِ يُؤْتِيهِ مَن يَشَآءُ ۚ وَٱللَّهُ ذُو ٱلْفَضْلِ ٱلْعَظِيمِ"}, "050019": {"a": 19, "text": "وَجَآءَتْ سَكْرَةُ ٱلْمَوْتِ بِٱلْحَقِّ ۖ ذَٰلِكَ مَا كُنتَ مِنْهُ تَحِيدُ"}, "067022": {"a": 22, "text": "أَفَمَن يَمْشِى مُكِبًّا عَلَىٰ وَجْهِهِۦٓ أَهْدَىٰٓ أَمَّن يَمْشِى سَوِيًّا عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ"}, "041046": {"a": 46, "text": "مَّنْ عَمِلَ صَٰلِحًۭا فَلِنَفْسِهِۦ ۖ وَمَنْ أَسَآءَ فَعَلَيْهَا ۗ وَمَا رَبُّكَ بِظَلَّٰمٍۢ لِّلْعَبِيدِ"}, "044019": {"a": 19, "text": "وَأَن لَّا تَعْلُوا۟ عَلَى ٱللَّهِ ۖ إِنِّىٓ ءَاتِيكُم بِسُلْطَٰنٍۢ مُّبِينٍۢ"}, "064004": {"a": 4, "text": "يَعْلَمُ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَيَعْلَمُ مَا تُسِرُّونَ وَمَا تُعْلِنُونَ ۚ وَٱللَّهُ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ"}, "038032": {"a": 32, "text": "فَقَالَ إِنِّىٓ أَحْبَبْتُ حُبَّ ٱلْخَيْرِ عَن ذِكْرِ رَبِّى حَتَّىٰ تَوَارَتْ بِٱلْحِجَابِ"}, "044058": {"a": 58, "text": "فَإِنَّمَا يَسَّرْنَٰهُ بِلِسَانِكَ لَعَلَّهُمْ يَتَذَكَّرُونَ"}, "071027": {"a": 27, "text": "إِنَّكَ إِن تَذَرْهُمْ يُضِلُّوا۟ عِبَادَكَ وَلَا يَلِدُوٓا۟ إِلَّا فَاجِرًۭا كَفَّارًۭا"}, "041041": {"a": 41, "text": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِٱلذِّكْرِ لَمَّا جَآءَهُمْ ۖ وَإِنَّهُۥ لَكِتَٰبٌ عَزِيزٌۭ"}, "055011": {"a": 11, "text": "فِيهَا فَٰكِهَةٌۭ وَٱلنَّخْلُ ذَاتُ ٱلْأَكْمَامِ"}, "043069": {"a": 69, "text": "ٱلَّذِينَ ءَامَنُوا۟ بِـَٔايَٰتِنَا وَكَانُوا۟ مُسْلِمِينَ"}, "067016": {"a": 16, "text": "ءَأَمِنتُم مَّن فِى ٱلسَّمَآءِ أَن يَخْسِفَ بِكُمُ ٱلْأَرْضَ فَإِذَا هِىَ تَمُورُ"}, "041023": {"a": 23, "text": "وَذَٰلِكُمْ ظَنُّكُمُ ٱلَّذِى ظَنَنتُم بِرَبِّكُمْ أَرْدَىٰكُمْ فَأَصْبَحْتُم مِّنَ ٱلْخَٰسِرِينَ"}, "040069": {"a": 69, "text": "أَلَمْ تَرَ إِلَى ٱلَّذِينَ يُجَٰدِلُونَ فِىٓ ءَايَٰتِ ٱللَّهِ أَنَّىٰ يُصْرَفُونَ"}, "036061": {"a": 61, "text": "وَأَنِ ٱعْبُدُونِى ۚ هَٰذَا صِرَٰطٌۭ مُّسْتَقِيمٌۭ"}, "071009": {"a": 9, "text": "ثُمَّ إِنِّىٓ أَعْلَنتُ لَهُمْ وَأَسْرَرْتُ لَهُمْ إِسْرَارًۭا"}, "038029": {"a": 29, "text": "كِتَٰبٌ أَنزَلْنَٰهُ إِلَيْكَ مُبَٰرَكٌۭ لِّيَدَّبَّرُوٓا۟ ءَايَٰتِهِۦ وَلِيَتَذَكَّرَ أُو۟لُوا۟ ٱلْأَلْبَٰبِ"}, "053018": {"a": 18, "text": "لَقَدْ رَأَىٰ مِنْ ءَايَٰتِ رَبِّهِ ٱلْكُبْرَىٰٓ"}, "041034": {"a": 34, "text": "وَلَا تَسْتَوِى ٱلْحَسَنَةُ وَلَا ٱلسَّيِّئَةُ ۚ ٱدْفَعْ بِٱلَّتِى هِىَ أَحْسَنُ فَإِذَا ٱلَّذِى بَيْنَكَ وَبَيْنَهُۥ عَدَٰوَةٌۭ كَأَنَّهُۥ وَلِىٌّ حَمِيمٌۭ"}, "051054": {"a": 54, "text": "فَتَوَلَّ عَنْهُمْ فَمَآ أَنتَ بِمَلُومٍۢ"}, "037143": {"a": 143, "text": "فَلَوْلَآ أَنَّهُۥ كَانَ مِنَ ٱلْمُسَبِّحِينَ"}, "040057": {"a": 57, "text": "لَخَلْقُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ أَكْبَرُ مِنْ خَلْقِ ٱلنَّاسِ وَلَٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَعْلَمُونَ"}, "037006": {"a": 6, "text": "إِنَّا زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِزِينَةٍ ٱلْكَوَاكِبِ"}, "038036": {"a": 36, "text": "فَسَخَّرْنَا لَهُ ٱلرِّيحَ تَجْرِى بِأَمْرِهِۦ رُخَآءً حَيْثُ أَصَابَ"}, "043024": {"a": 24, "text": "۞ قَٰلَ أَوَلَوْ جِئْتُكُم بِأَهْدَىٰ مِمَّا وَجَدتُّمْ عَلَيْهِ ءَابَآءَكُمْ ۖ قَالُوٓا۟ إِنَّا بِمَآ أُرْسِلْتُم بِهِۦ كَٰفِرُونَ"}, "038048": {"a": 48, "text": "وَٱذْكُرْ إِسْمَٰعِيلَ وَٱلْيَسَعَ وَذَا ٱلْكِفْلِ ۖ وَكُلٌّۭ مِّنَ ٱلْأَخْيَارِ"}, "076022": {"a": 22, "text": "إِنَّ هَٰذَا كَانَ لَكُمْ جَزَآءًۭ وَكَانَ سَعْيُكُم مَّشْكُورًا"}, "036020": {"a": 20, "text": "وَجَآءَ مِنْ أَقْصَا ٱلْمَدِينَةِ رَجُلٌۭ يَسْعَىٰ قَالَ يَٰقَوْمِ ٱتَّبِعُوا۟ ٱلْمُرْسَلِينَ"}, "044025": {"a": 25, "text": "كَمْ تَرَكُوا۟ مِن جَنَّٰتٍۢ وَعُيُونٍۢ"}, "043025": {"a": 25, "text": "فَٱنتَقَمْنَا مِنْهُمْ ۖ فَٱنظُرْ كَيْفَ كَانَ عَٰقِبَةُ ٱلْمُكَذِّبِينَ"}, "040022": {"a": 22, "text": "ذَٰلِكَ بِأَنَّهُمْ كَانَت تَّأْتِيهِمْ رُسُلُهُم بِٱلْبَيِّنَٰتِ فَكَفَرُوا۟ فَأَخَذَهُمُ ٱللَّهُ ۚ إِنَّهُۥ قَوِىٌّۭ شَدِيدُ ٱلْعِقَابِ"}, "059019": {"a": 19, "text": "وَلَا تَكُونُوا۟ كَٱلَّذِينَ نَسُوا۟ ٱللَّهَ فَأَنسَىٰهُمْ أَنفُسَهُمْ ۚ أُو۟لَٰٓئِكَ هُمُ ٱلْفَٰسِقُونَ"}, "035005": {"a": 5, "text": "يَٰٓأَيُّهَا ٱلنَّاسُ إِنَّ وَعْدَ ٱللَّهِ حَقٌّۭ ۖ فَلَا تَغُرَّنَّكُمُ ٱلْحَيَوٰةُ ٱلدُّنْيَا ۖ وَلَا يَغُرَّنَّكُم بِٱللَّهِ ٱلْغَرُورُ"}, "038031": {"a": 31, "text": "إِذْ عُرِضَ عَلَيْهِ بِٱلْعَشِىِّ ٱلصَّٰفِنَٰتُ ٱلْجِيَادُ"}, "050028": {"a": 28, "text": "قَالَ لَا تَخْتَصِمُوا۟ لَدَىَّ وَقَدْ قَدَّمْتُ إِلَيْكُم بِٱلْوَعِيدِ"}, "037057": {"a": 57, "text": "وَلَوْلَا نِعْمَةُ رَبِّى لَكُنتُ مِنَ ٱلْمُحْضَرِينَ"}, "037115": {"a": 115, "text": "وَنَجَّيْنَٰهُمَا وَقَوْمَهُمَا مِنَ ٱلْكَرْبِ ٱلْعَظِيمِ"}, "038009": {"a": 9, "text": "أَمْ عِندَهُمْ خَزَآئِنُ رَحْمَةِ رَبِّكَ ٱلْعَزِيزِ ٱلْوَهَّابِ"}, "037171": {"a": 171, "text": "وَلَقَدْ سَبَقَتْ كَلِمَتُنَا لِعِبَادِنَا ٱلْمُرْسَلِينَ"}, "044020": {"a": 20, "text": "وَإِنِّى عُذْتُ بِرَبِّى وَرَبِّكُمْ أَن تَرْجُمُونِ"}, "051052": {"a": 52, "text": "كَذَٰلِكَ مَآ أَتَى ٱلَّذِينَ مِن قَبْلِهِم مِّن رَّسُولٍ إِلَّا قَالُوا۟ سَاحِرٌ أَوْ مَجْنُونٌ"}, "040041": {"a": 41, "text": "۞ وَيَٰقَوْمِ مَا لِىٓ أَدْعُوكُمْ إِلَى ٱلنَّجَوٰةِ وَتَدْعُونَنِىٓ إِلَى ٱلنَّارِ"}, "068032": {"a": 32, "text": "عَسَىٰ رَبُّنَآ أَن يُبْدِلَنَا خَيْرًۭا مِّنْهَآ إِنَّآ إِلَىٰ رَبِّنَا رَٰغِبُونَ"}, "041027": {"a": 27, "text": "فَلَنُذِيقَنَّ ٱلَّذِينَ كَفَرُوا۟ عَذَابًۭا شَدِيدًۭا وَلَنَجْزِيَنَّهُمْ أَسْوَأَ ٱلَّذِى كَانُوا۟ يَعْمَلُونَ"}, "079046": {"a": 46, "text": "كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوٓا۟ إِلَّا عَشِيَّةً أَوْ ضُحَىٰهَا"}, "051053": {"a": 53, "text": "أَتَوَاصَوْا۟ بِهِۦ ۚ بَلْ هُمْ قَوْمٌۭ طَاغُونَ"}, "039072": {"a": 72, "text": "قِيلَ ٱدْخُلُوٓا۟ أَبْوَٰبَ جَهَنَّمَ خَٰلِدِينَ فِيهَا ۖ فَبِئْسَ مَثْوَى ٱلْمُتَكَبِّرِينَ"}, "050036": {"a": 36, "text": "وَكَمْ أَهْلَكْنَا قَبْلَهُم مِّن قَرْنٍ هُمْ أَشَدُّ مِنْهُم بَطْشًۭا فَنَقَّبُوا۟ فِى ٱلْبِلَٰدِ هَلْ مِن مَّحِيصٍ"}, "036027": {"a": 27, "text": "بِمَا غَفَرَ لِى رَبِّى وَجَعَلَنِى مِنَ ٱلْمُكْرَمِينَ"}, "078040": {"a": 40, "text": "إِنَّآ أَنذَرْنَٰكُمْ عَذَابًۭا قَرِيبًۭا يَوْمَ يَنظُرُ ٱلْمَرْءُ مَا قَدَّمَتْ يَدَاهُ وَيَقُولُ ٱلْكَافِرُ يَٰلَيْتَنِى كُنتُ تُرَٰبًۢا"}, "038030": {"a": 30, "text": "وَوَهَبْنَا لِدَاوُۥدَ سُلَيْمَٰنَ ۚ نِعْمَ ٱلْعَبْدُ ۖ إِنَّهُۥٓ أَوَّابٌ"}, "038047": {"a": 47, "text": "وَإِنَّهُمْ عِندَنَا لَمِنَ ٱلْمُصْطَفَيْنَ ٱلْأَخْيَارِ"}, "041011": {"a": 11, "text": "ثُمَّ ٱسْتَوَىٰٓ إِلَى ٱلسَّمَآءِ وَهِىَ دُخَانٌۭ فَقَالَ لَهَا وَلِلْأَرْضِ ٱئْتِيَا طَوْعًا أَوْ كَرْهًۭا قَالَتَآ أَتَيْنَا طَآئِعِينَ"}, "093003": {"a": 3, "text": "مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ"}, "038012": {"a": 12, "text": "كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ وَعَادٌۭ وَفِرْعَوْنُ ذُو ٱلْأَوْتَادِ"}, "053019": {"a": 19, "text": "أَفَرَءَيْتُمُ ٱللَّٰتَ وَٱلْعُزَّىٰ"}, "040072": {"a": 72, "text": "فِى ٱلْحَمِيمِ ثُمَّ فِى ٱلنَّارِ يُسْجَرُونَ"}, "047030": {"a": 30, "text": "وَلَوْ نَشَآءُ لَأَرَيْنَٰكَهُمْ فَلَعَرَفْتَهُم بِسِيمَٰهُمْ ۚ وَلَتَعْرِفَنَّهُمْ فِى لَحْنِ ٱلْقَوْلِ ۚ وَٱللَّهُ يَعْلَمُ أَعْمَٰلَكُمْ"}, "039026": {"a": 26, "text": "فَأَذَاقَهُمُ ٱللَّهُ ٱلْخِزْىَ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَلَعَذَابُ ٱلْءَاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ"}, "038013": {"a": 13, "text": "وَثَمُودُ وَقَوْمُ لُوطٍۢ وَأَصْحَٰبُ لْـَٔيْكَةِ ۚ أُو۟لَٰٓئِكَ ٱلْأَحْزَابُ"}, "049004": {"a": 4, "text": "إِنَّ ٱلَّذِينَ يُنَادُونَكَ مِن وَرَآءِ ٱلْحُجُرَٰتِ أَكْثَرُهُمْ لَا يَعْقِلُونَ"}, "040038": {"a": 38, "text": "وَقَالَ ٱلَّذِىٓ ءَامَنَ يَٰقَوْمِ ٱتَّبِعُونِ أَهْدِكُمْ سَبِيلَ ٱلرَّشَادِ"}, "038075": {"a": 75, "text": "قَالَ يَٰٓإِبْلِيسُ مَا مَنَعَكَ أَن تَسْجُدَ لِمَا خَلَقْتُ بِيَدَىَّ ۖ أَسْتَكْبَرْتَ أَمْ كُنتَ مِنَ ٱلْعَالِينَ"}, "068038": {"a": 38, "text": "إِنَّ لَكُمْ فِيهِ لَمَا تَخَيَّرُونَ"}, "072009": {"a": 9, "text": "وَأَنَّا كُنَّا نَقْعُدُ مِنْهَا مَقَٰعِدَ لِلسَّمْعِ ۖ فَمَن يَسْتَمِعِ ٱلْءَانَ يَجِدْ لَهُۥ شِهَابًۭا رَّصَدًۭا"}, "042053": {"a": 53, "text": "صِرَٰطِ ٱللَّهِ ٱلَّذِى لَهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ أَلَآ إِلَى ٱللَّهِ تَصِيرُ ٱلْأُمُورُ"}, "078014": {"a": 14, "text": "وَأَنزَلْنَا مِنَ ٱلْمُعْصِرَٰتِ مَآءًۭ ثَجَّاجًۭا"}, "037170": {"a": 170, "text": "فَكَفَرُوا۟ بِهِۦ ۖ فَسَوْفَ يَعْلَمُونَ"}, "068033": {"a": 33, "text": "كَذَٰلِكَ ٱلْعَذَابُ ۖ وَلَعَذَابُ ٱلْءَاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ"}, "037140": {"a": 140, "text": "إِذْ أَبَقَ إِلَى ٱلْفُلْكِ ٱلْمَشْحُونِ"}, "047008": {"a": 8, "text": "وَٱلَّذِينَ كَفَرُوا۟ فَتَعْسًۭا لَّهُمْ وَأَضَلَّ أَعْمَٰلَهُمْ"}, "039012": {"a": 12, "text": "وَأُمِرْتُ لِأَنْ أَكُونَ أَوَّلَ ٱلْمُسْلِمِينَ"}, "073004": {"a": 4, "text": "أَوْ زِدْ عَلَيْهِ وَرَتِّلِ ٱلْقُرْءَانَ تَرْتِيلًا"}, "039011": {"a": 11, "text": "قُلْ إِنِّىٓ أُمِرْتُ أَنْ أَعْبُدَ ٱللَّهَ مُخْلِصًۭا لَّهُ ٱلدِّينَ"}, "043077": {"a": 77, "text": "وَنَادَوْا۟ يَٰمَٰلِكُ لِيَقْضِ عَلَيْنَا رَبُّكَ ۖ قَالَ إِنَّكُم مَّٰكِثُونَ"}, "068037": {"a": 37, "text": "أَمْ لَكُمْ كِتَٰبٌۭ فِيهِ تَدْرُسُونَ"}, "067023": {"a": 23, "text": "قُلْ هُوَ ٱلَّذِىٓ أَنشَأَكُمْ وَجَعَلَ لَكُمُ ٱلسَّمْعَ وَٱلْأَبْصَٰرَ وَٱلْأَفْـِٔدَةَ ۖ قَلِيلًۭا مَّا تَشْكُرُونَ"}, "054020": {"a": 20, "text": "تَنزِعُ ٱلنَّاسَ كَأَنَّهُمْ أَعْجَازُ نَخْلٍۢ مُّنقَعِرٍۢ"}, "037005": {"a": 5, "text": "رَّبُّ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَمَا بَيْنَهُمَا وَرَبُّ ٱلْمَشَٰرِقِ"}, "053052": {"a": 52, "text": "وَقَوْمَ نُوحٍۢ مِّن قَبْلُ ۖ إِنَّهُمْ كَانُوا۟ هُمْ أَظْلَمَ وَأَطْغَىٰ"}, "050027": {"a": 27, "text": "۞ قَالَ قَرِينُهُۥ رَبَّنَا مَآ أَطْغَيْتُهُۥ وَلَٰكِن كَانَ فِى ضَلَٰلٍۭ بَعِيدٍۢ"}, "050018": {"a": 18, "text": "مَّا يَلْفِظُ مِن قَوْلٍ إِلَّا لَدَيْهِ رَقِيبٌ عَتِيدٌۭ"}, "040084": {"a": 84, "text": "فَلَمَّا رَأَوْا۟ بَأْسَنَا قَالُوٓا۟ ءَامَنَّا بِٱللَّهِ وَحْدَهُۥ وَكَفَرْنَا بِمَا كُنَّا بِهِۦ مُشْرِكِينَ"}, "038010": {"a": 10, "text": "أَمْ لَهُم مُّلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَمَا بَيْنَهُمَا ۖ فَلْيَرْتَقُوا۟ فِى ٱلْأَسْبَٰبِ"}, "038074": {"a": 74, "text": "إِلَّآ إِبْلِيسَ ٱسْتَكْبَرَ وَكَانَ مِنَ ٱلْكَٰفِرِينَ"}, "040085": {"a": 85, "text": "فَلَمْ يَكُ يَنفَعُهُمْ إِيمَٰنُهُمْ لَمَّا رَأَوْا۟ بَأْسَنَا ۖ سُنَّتَ ٱللَّهِ ٱلَّتِى قَدْ خَلَتْ فِى عِبَادِهِۦ ۖ وَخَسِرَ هُنَالِكَ ٱلْكَٰفِرُونَ"}, "050037": {"a": 37, "text": "إِنَّ فِى ذَٰلِكَ لَذِكْرَىٰ لِمَن كَانَ لَهُۥ قَلْبٌ أَوْ أَلْقَى ٱلسَّمْعَ وَهُوَ شَهِيدٌۭ"}}, EXPL={"4|الرياضيات|القيمة المكانية": [{"t": "القيمة المكانية", "k": "", "lines": ["بص يا حبيبي، كل رقم في العدد له قيمة حسب مكانه: آحاد، عشرات، مئات، آلاف وهكذا."]}, {"t": "القيمة المكانية", "k": "", "lines": ["في العدد 3,482 الرقم 4 في خانة المئات، يعني قيمته 400، والرقم 3 قيمته 3000."]}, {"t": "القيمة المكانية", "k": "", "lines": ["نقرأ العدد من اليسار لليمين، ونفصل كل 3 خانات بفاصلة."]}, {"t": "القيمة المكانية", "k": "", "lines": ["الشكل الممتد للعدد 3,482 هو 3000 + 400 + 80 + 2."]}, {"t": "القيمة المكانية", "k": "" var TIPS=["اقرأ السؤال مرتين قبل أن تجيب.","إن لم تكن متأكدًا، فاستبعد الاختيارات الخاطئة أولًا.","خذ نفسًا عميقًا قبل السؤال الصعب.","الخطأ يعلّمك أكثر من الإجابة السهلة.","راجع أخطاءك كل يوم خمس دقائق.","اشرب ماءً وارتح بين الجولات.","جرّب أن تشرح الدرس لغيرك، ستفهمه أفضل.","ابدأ بالمادة التي تحبها، ثم الأصعب.","اكتب الحل على ورقة قبل أن تختار.","النوم مبكرًا يجعل المذاكرة أسهل.","شاهد الشرح المتحرك إذا أخطأت في موضوع أكثر من مرة.","التكرار القليل كل يوم خير من يوم واحد طويل.","اسأل معلمك عن أي شيء لا تفهمه.","عندما تتعب، خذ استراحة ضحك.","ابدأ طعامَك ببسم الله، وكُل بيمينك، وكُل مما يليك؛ فهكذا علّمنا النبيُّ ﷺ.","فكِّر قبل أن تتكلم؛ فالكلمةُ الطيبة صدقة، والكلمة الجارحة لا تُنسى.","العب بروحٍ رياضية: افرح بالفوز بتواضع، وتقبّل الخسارة بابتسامة؛ فاللعبُ يجمع ولا يفرِّق.","ادخل المسجدَ بيمينك وقل دعاءَ الدخول، واجلس بأدبٍ وهدوء؛ فأنت في بيت الله.","قبل أن تدخل غرفةَ غيرك، اطرق البابَ بلطفٍ واستأذن؛ فالاستئذانُ أدبٌ رفيعٌ يحفظ الخصوصية.","ابدأ يومَك بذكر الله، واختمه بحمده؛ فالقلبُ الذي يذكر اللهَ قلبٌ مطمئن.","ساعد من يحتاج حولك: أخاك الصغير، وجارَك الكبير، وصديقَك المتعثر؛ فالمساعدةُ تُسعد قلبين.","ابدأ يومَك بالسلام على أهل بيتك؛ فالسلامُ يُدخل المحبةَ والطمأنينةَ إلى القلوب.","كن صادقًا دائمًا، حتى لو كان الصدقُ صعبًا؛ فالصدقُ يهدي إلى البرِّ والجنة.","حافظ على صلواتك الخمس في أوقاتها؛ فالصلاةُ راحةُ القلب ونورُ اليوم.","ابدأ مذاكرتَك بدعاءٍ قصير ونيةٍ صالحة؛ فطلبُ العلم عبادةٌ يُحبها الله.","النظافةُ من الإيمان؛ حافظ على نظافة جسدك وثيابك ومكانك دائمًا.","برُّ الوالدين طريقُك إلى رضا الله؛ كلمةٌ طيبةٌ وابتسامةٌ صادقةٌ تُسعد قلبَ أمِّك وأبيك.","زُر أقاربَك واسأل عنهم ولو بمكالمة؛ فصلةُ الرحم تُبارك في العمر والرزق.","اشكر اللهَ بعد الطعام بقول: الحمد لله؛ فالشكرُ يزيد النعمَ ويبارك فيها.","استمع إلى من يحدِّثك حتى يُكمل كلامَه، ولا تقاطعه؛ فحُسنُ الاستماع من حُسن الخُلق.","لا تسخر من صديقٍ أخطأ أو خسر؛ فاليوم تضحك وغدًا قد تكون مكانه.","حافظ على وردٍ يوميٍّ من القرآن ولو آياتٍ قليلة؛ فخيرُ الأعمال أدومُها وإن قلّت.","استأذن ثلاثَ مرات؛ فإن لم يُؤذَن لك، فارجع بقلبٍ راضٍ ولا تغضب.","ادعُ لوالديك وأهلك وأصدقائك بظهر الغيب؛ فدعوتُك لهم تعود عليك بمثلها.","كن رفيقًا بالحيوانات؛ اسقِها وأطعمها ولا تؤذِها، ففي كلِّ كبدٍ رطبةٍ أجر.","حين تدخل بيتَك أو بيتَ غيرك، قل: السلام عليكم، بصوتٍ واضحٍ وابتسامةٍ جميلة.","الأمانةُ أن تحفظ ما اؤتمنتَ عليه: مالًا كان أو سرًّا أو وعدًا قطعته.","توضأ بإتقانٍ وأحسن وضوءَك؛ فالوضوءُ طهارةٌ ونور.","قسِّم واجباتِك إلى أجزاءٍ صغيرة، وأنجزها واحدةً تلو الأخرى؛ فالجبلُ يُصعَد خطوةً خطوة.","رتِّب غرفتَك وأدواتَك بعد استعمالها؛ فالنظامُ يوفِّر وقتَك ويريح قلبَك.","حين تطلب منك أمُّك شيئًا، فلبِّ طلبَها بفرح؛ فخدمةُ الوالدين شرفٌ وبركة.","احترم كبارَ السن: قف لهم، وقدِّمهم في المجلس، واستمع إلى حكاياتهم بحب.","لا تعبْ طعامًا قُدِّم إليك؛ إن اشتهيتَه أكلتَ، وإن لم تشتهِه تركتَه بلا تعليق.","تكلّم بصوتٍ هادئٍ واضح؛ فرفعُ الصوت لا يجعل الحقَّ أقوى.","شارك ألعابَك مع أصدقائك؛ فالمشاركةُ تزيد الفرحَ ولا تُنقصه.","استمع إلى القرآن بقلبٍ حاضرٍ حين يُتلى؛ ففي سماعه رحمةٌ وطمأنينة.","حتى في بيتك، استأذن قبل دخول غرفة والديك أو إخوتك؛ فالأدبُ يبدأ من البيت.","اشكر من أحسن إليك بقول: جزاك الله خيرًا؛ فمن لا يشكر الناسَ لا يشكر الله.","تبسُّمُك في وجه أخيك صدقة؛ فلا تبخل بابتسامتك على أحد.","ردُّ السلام فضلٌ عظيم؛ رُدَّه بأحسنَ منه أو بمثلِه، وبوجهٍ بشوش.","إن وعدتَ فأوفِ بوعدك؛ فالوفاءُ بالوعد علامةُ المؤمن الصادق.","صلِّ بخشوعٍ وحضور قلب، وتذكّر أنك تقف بين يدي الله؛ فالصلاةُ لقاءٌ جميل.","راجع دروسَك أولًا بأول، ولا تؤجِّل عملَ اليوم إلى الغد.","اغسل يديك قبل الطعام وبعده، وبعد اللعب؛ فالصحةُ نعمةٌ عظيمةٌ تستحق الشكر.","قبِّل يدَ والديك وادعُ لهما كلَّ يوم؛ فدعاؤهما لك بابٌ من أبواب التوفيق.","معلِّمُك بمنزلة والدك في التربية؛ فاحترمه واشكره وادعُ له بالخير.","شارك إخوتَك وأصدقاءَك طعامَك إن استطعت؛ فالطعامُ المشترك ألذُّ وأبرك.","إن لم يكن عندك كلامٌ نافع، فالصمتُ أجمل؛ قال رسول الله ﷺ: «من كان يؤمن بالله واليوم الآخر فليقل خيرًا أو ليصمت».","اختر صديقَك بعناية؛ فالصديقُ الصالح يُعينك على الخير ويُبعدك عن الشر.","احترم مصحفَك: ضعه في مكانٍ نظيفٍ مرتفع، ولا تضع فوقه شيئًا.","لا تنظر من ثقب الباب أو النافذة قبل أن تدخل؛ فاحترامُ خصوصية الناس من كمال الخُلق.","افرح لفرح غيرك وادعُ له بالبركة؛ فالقلبُ الذي يحب الخيرَ للناس قلبٌ عظيم.","إن رأيتَ صديقًا حزينًا، اجلس بجواره واسأله عن حاله؛ فالكلمةُ الحانية دواء.","إفشاءُ السلام بين الناس من أحبِّ الأعمال إلى الله؛ فكن سبّاقًا إليه دائمًا.","اعترف بخطئك بشجاعة إن أخطأت؛ فالاعتذارُ قوةٌ لا ضعف.","جهِّز سجادتَك ومصحفَك في مكانٍ تحبه؛ فالمكانُ الجميل يُعينك على العبادة.","اسأل معلِّمَك عما لا تفهمه ولا تخجل؛ فالسؤالُ مفتاحُ العلم.","حافظ على نظافة مدرستك وشارعك؛ فإماطةُ الأذى عن الطريق من أخلاق المؤمن.","استمع إلى نصيحة والديك بصدرٍ رحب؛ فهما أكثرُ من يحبُّك ويخاف عليك في الدنيا.","خاطب الكبيرَ بألفاظٍ مهذبة، ولا ترفع صوتَك فوق صوته أبدًا.","حين تدخل بيتك، قل: «بسم الله ولجنا، وبسم الله خرجنا، وعلى ربنا توكلنا»، ثم سلّم على أهلك.","حين تخرج من بيتك، قل: «بسم الله، توكلت على الله، ولا حول ولا قوة إلا بالله» — تُكفى وتُهدى وتُوقى.","قبل أن تأكل، سمِّ الله وقل: «بسم الله»؛ فإن نسيت في أوله فقل: «بسم الله في أوله وآخره».","بعد أن تفرغ من طعامك، قل: «الحمد لله الذي أطعمني هذا ورزقنيه من غير حول مني ولا قوة».","حين تدخل المسجد، قدّم رجلك اليمنى وقل: «اللهم افتح لي أبواب رحمتك».","حين تخرج من المسجد، قدّم رجلك اليسرى وقل: «اللهم إني أسألك من فضلك».","حين تستيقظ من نومك، قل: «الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور».","قبل أن تنام، قل: «باسمك اللهم أموت وأحيا»، ونم على وضوء إن استطعت.","حين تركب السيارة أو الحافلة، قل: «سبحان الذي سخّر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون».","إذا لبست ثوبًا جديدًا، فقل: «الحمد لله الذي كساني هذا ورزقنيه من غير حول مني ولا قوة».","بعد الوضوء، قل: «أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدًا عبده ورسوله» — تُفتح لك أبواب الجنة.","حين تسمع الأذان، ردّد مع المؤذن كلمة كلمة، ثم صلِّ على النبي ﷺ واسأل الله له الوسيلة.","قبل دخول الخلاء قل: «اللهم إني أعوذ بك من الخبث والخبائث»، وحين تخرج قل: «غفرانك».","حين ترى المطر ينزل، قل: «اللهم صيّبًا نافعًا»، وادعُ بما تحب؛ فالدعاء عند المطر مستجاب.","حين تقوم من مجلس، قل كفارة المجلس: «سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك».","إذا عطست فقل: «الحمد لله»، وإذا قال لك أخوك: «يرحمك الله»، فقل: «يهديكم الله ويصلح بالكم».","الصدق منجاة: من صدق نجا ولو بعد حين؛ فاجعل لسانك لا يعرف إلا الحق، وستجد أثره في قلبك وحياتك.","الكذب حبله قصير: كذبة واحدة تحتاج عشر كذبات لتغطيتها، وفي النهاية يخسر صاحبها ثقة الناس ورضا الله.","احترام الكبير بركة: من وقّر الكبير في صغره وقّره الناس في كبره؛ فقم للكبير، وقدّمه في المجلس، واستمع إليه بأدب.","اعطف على أخيك الصغير: خذ بيده وعلّمه برفق واصبر عليه؛ فأنت قدوته الأولى بعد والديك، وهو يقلّد ما تفعله.","الشيطان يسعى جاهدًا ليجعلك جاهلًا كسولًا؛ فإذا وسوس لك بترك الصلاة والمذاكرة فاستعذ بالله وقم إلى عملك — فالعلم والعمل أعداء الشيطان.","صلاتك نجاتك: من حافظ على الصلوات الخمس كانت له نورًا وبرهانًا ونجاة يوم القيامة؛ فلا تؤخّر صلاة عن وقتها أبدًا.","علاقتك بالله هي النجاة الحقيقية: كلما ضاقت بك الدنيا فافزع إلى الصلاة والدعاء؛ فباب الله لا يُغلق في وجه من طرقه.","لا تؤجّل عمل اليوم إلى الغد؛ فالتسويف لصّ الوقت. ابدأ الآن ولو بخطوة صغيرة، وستندهش مما تنجزه.","قبل أن تتكلم، اسأل نفسك ثلاثة أسئلة: هل كلامي حق؟ هل هو نافع؟ هل هو لطيف؟ فإن لم يكن كذلك فالصمت أجمل.","اجعل القرآن صاحبك لا ضيفك: صفحة واحدة كل يوم بعد الفجر تجعلك تختم وتتدبر، وخير الأعمال أدومها وإن قلّت.","احفظ سرّ أخيك كما تحفظ سرّك؛ فمن ستر مسلمًا ستره الله، والسر أمانة لا تُذاع ولو اختلفت مع صاحبه.","كن أول من يبدأ بالخير: بادر بالسلام، وبادر بالصلح إذا اختلفت مع صديق، وبادر بالمساعدة قبل أن تُطلب منك.","وقتك أمانة ستُسأل عنها: ساعة جدّ وساعة لعب باعتدال؛ فمن حفظ وقته في الصغر بنى مستقبله في الكبر.","ادعُ لأخيك بظهر الغيب؛ فحين تدعو له يقول الملك الموكّل بك: آمين، ولك بمثل ما دعوت.","ساعد أمك في أعمال البيت من نفسك قبل أن تطلب منك؛ فالبرّ الحقيقي أن تبادر لا أن تنتظر الطلب.","إذا غضبت فاسكت قليلًا وعدّ في سرّك إلى عشرة؛ فأكثر الكلام الذي نندم عليه قلناه ونحن غاضبون.","حافظ على أذكار الصباح والمساء؛ فهي حصنك من كل سوء، وبداية يومك ونهايته بذكر الله بركة.","التمس لأخيك عذرًا إذا رأيت منه ما لا يعجبك؛ فحسن الظن راحة لقلبك وحفظ لمحبتك للناس.","علّم صديقك شيئًا تعلمته اليوم؛ فزكاة العلم تعليمه، وما علّمته غيرك ثبت في ذهنك أكثر.","إذا وجدت قلمًا أو شيئًا ضائعًا من زميلك فسلّمه لمعلمك؛ فالأمانة أن يرجع الحق لصاحبه ولو كان صغيرًا.","زُر قريبًا مريضًا أو اتصل به واسأل عنه؛ فعيادة المريض تخفف عنه وتُدخل السرور على قلبه.","لا تُسرف في الماء وأنت تتوضأ أو تستحم؛ فالماء نعمة عظيمة، والنبي ﷺ كان يتوضأ بالقليل.","اغتنم وقت فراغك في حفظ سورة قصيرة أو مراجعة درس؛ فالدقائق الصغيرة تصنع إنجازات كبيرة.","اعتنِ بنظافة أسنانك بالفرشاة كل يوم؛ ففم نظيف وابتسامة جميلة من تمام النظافة التي يحبها الله.","لا تتكلم عن غائب بما يكره أن يسمعه؛ فالغيبة تأكل الحسنات كما تأكل النار الحطب.","اتصل بجدك وجدتك واسأل عن صحتهما وادعُ لهما؛ فصوتك يسعدهما أكثر مما تتصور.","ضع جنيهًا صغيرًا في حصالة صدقة كل أسبوع؛ فالصدقة ولو قليلة تطفئ غضب الرب وتزيد البركة.","إذا جاء زميل جديد إلى فصلك فكن أول من يرحب به ويعرّفه بالمكان؛ فالغريب يحتاج قلبًا قريبًا.","ابدأ كل عمل باسم الله: المذاكرة واللعب والأكل؛ فما بُدئ ببسم الله تمّت بركته.","ألقِ السلام على من تعرف ومن لا تعرف؛ فإفشاء السلام ينشر المحبة بين الناس.","استغفر الله كل يوم ولو عشر مرات بقلب حاضر؛ فالاستغفار يفتح أبواب الرزق ويفرّج الهموم.","اخفض صوتك في المسجد والمكتبة والأماكن الهادئة؛ فمراعاة مشاعر الآخرين من كمال الأدب.","اشكر الله كل صباح على نعم صغيرة: بصرك وسمعك وصحتك وأهلك؛ فمن شكر على القليل رزقه الله الكثير.","إذا لعبت مع أصدقائك فالعب بنزاهة: لا غش ولا ظلم؛ فالفوز الشريف وحده هو الذي يُفرح القلب.","رتّب حذاءك وأغراضك عند الباب؛ فالبيت المرتب يبدأ من عادات صغيرة مرتبة.","ادعُ لوالديك في سجودك؛ فأقرب ما يكون العبد من ربه وهو ساجد، ودعاؤك لهما من أعظم البر.","إذا رأيت عامل نظافة أو رجلًا يكدح في الشارع فسلّم عليه وادعُ له؛ فكل عمل شريف يستحق الاحترام.","نم مبكرًا بعد صلاة العشاء وقراءة ما تيسر من القرآن؛ فجسمك أمانة، والنوم الكافي يجعلك أقوى وأذكى في يومك."];
function tipOfDay(){var d=new Date(today()),n=Math.floor(d/864e5);return TIPS[n%TIPS.length]}
