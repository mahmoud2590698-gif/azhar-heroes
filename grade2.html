ect": "التربية الإسلامية", "id": "h26-g2-127", "question": "عندما ننتهي من الصلاة نسلّم...", "choices": ["إِلَى الْأَمَامِ", "عَنِ الْيَمِينِ فَقَطْ", "إِلَى الْخَلْفِ", "عَنِ الْيَمِينِ وَعَنِ الشِّمَالِ"], "answer": "عَنِ الْيَمِينِ وَعَنِ الشِّمَالِ", "answerIndex": 3, "explanation": "نختم الصلاة بالتسليم عن اليمين وعن الشمال: السلام عليكم ورحمة الله.", "type": "mcq", "topic": "", "source": "http://toptalim.blogspot.com/2026/10/islamic-ans-w7-p2-2027.html"}, {"grade": 2, "subject": "التربية الإسلامية", "id": "h26-g2-128", "question": "المسلم النظيف يحافظ على...", "choices": ["نَظَافَةِ جِسْمِهِ وَثِيَابِهِ وَمَكَانِهِ", "أَلْعَابِهِ فَقَطْ", "كُتُبِهِ فَقَطْ", "غُرْفَتِهِ فَقَطْ"], "answer": "نَظَافَةِ جِسْمِهِ وَثِيَابِهِ وَمَكَانِهِ", "answerIndex": 0, "explanation": "النظافة من الإيمان، والمسلم نظيف الجسم والثياب والمكان.", "type": "mcq", "topic": "", "source": "http://toptalim.blogspot.com/2026/10/islamic-ans-w7-p2-2027.html"}, {"grade": 2, "subject": "التربية الإسلامية", "id": "h26-g2-129", "question": "ماذا نقول إذا عطس أحدنا؟", "choices": ["يَرْحَمُكَ اللَّهُ", "الْحَمْدُ لِلَّهِ", "جَزَاكَ اللَّهُ خَيْرًا", "بَارَكَ اللَّهُ فِيكَ"], "answer": "الْحَمْدُ لِلَّهِ", "answerIndex": 1, "explanation": "من عطس حمد الله، ومن سمعه يقول له: يرحمك الله.", "type": "mcq", "topic": "", "source": "http://toptalim.blogspot.com/2026/10/islamic-ans-w7-p2-2027.html"}, {"grade": 2, "subject": "التربية الإسلامية", "id": "h26-g2-130", "question": "إذا دخلنا بيتًا أو قابلنا أحدًا نبدأ بـ...", "choices": ["أَهْلًا وَسَهْلًا", "صَبَاحُ الْخَيْرِ", "مَعَ السَّلَامَةِ", "السَّلَامُ عَلَيْكُمْ"], "answer": "السَّلَامُ عَلَيْكُمْ", "answerIndex": 3, "explanation": "نلقي السلام عند دخول البيت ولقاء الناس، وهو تحية الإسلام.", "type": "mcq", "topic": "", "source": "http://toptalim.blogspot.com/2026/10/islamic-ans-w7-p2-2027.html"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-131", "question": "ما معنى كلمة «بُسْتَان»؟", "choices": ["سُوقٌ مَزْدَحِمٌ", "بَيْتٌ كَبِيرٌ", "حَدِيقَةٌ فِ : "mcq", "topic": "", "source": "https://ia903102.us.archive.org/18/items/rytest3/testw4_text.pdf"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-159", "question": "أي كلمة فيها لام شمسية؟", "choices": ["الْمَاءُ", "الْبَحْرُ", "الْجَبَلُ", "النَّهْرُ"], "answer": "النَّهْرُ", "answerIndex": 3, "explanation": "في «النهر» اللام شمسية لا تنطق، أما البحر والجبل والماء فلامها قمرية.", "type": "mcq", "topic": "", "source": "https://ia903102.us.archive.org/18/items/rytest3/testw4_text.pdf"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-160", "question": "أي كلمة فيها لام قمرية؟", "choices": ["الْبَابُ", "التُّفَّاحُ", "الصَّدِيقُ", "الشَّجَرَةُ"], "answer": "الْبَابُ", "answerIndex": 0, "explanation": "في «الباب» اللام قمرية تنطق، أما الشجرة والصديق والتفاح فلامها شمسية.", "type": "mcq", "topic": "", "source": "https://ia903102.us.archive.org/18/items/rytest3/testw4_text.pdf"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-161", "question": "ما نوع المد في كلمة «قَالَ»؟", "choices": ["مَدٌّ بِالْيَاءِ", "لَا يُوجَدُ مَدٌّ", "مَدٌّ بِالْأَلِفِ", "مَدٌّ بِالْوَاوِ"], "answer": "مَدٌّ بِالْأَلِفِ", "answerIndex": 2, "explanation": "في كلمة «قال» ألف ساكنة قبلها فتحة، فهي مد بالألف.", "type": "mcq", "topic": "", "source": "https://ia903102.us.archive.org/18/items/rytest3/testw4_text.pdf"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-162", "question": "ما نوع المد في كلمة «نُور»؟", "choices": ["مَدٌّ بِالْوَاوِ", "مَدٌّ بِالْأَلِفِ", "مَدٌّ بِالْيَاءِ", "لَا يُوجَدُ مَدٌّ"], "answer": "مَدٌّ بِالْوَاوِ", "answerIndex": 0, "explanation": "في كلمة «نور» واو ساكنة قبلها ضمة، فهي مد بالواو.", "type": "mcq", "topic": "", "source": "https://ia903102.us.archive.org/18/items/rytest3/testw4_text.pdf"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-163", "question": "ما نوع المد في كلمة «سَعِيد»؟", "choices": ["مَدٌّ بِالْوَاوِ", "مَدٌّ بِالْيَاءِ", "لَا يُوجَدُ مَدٌّ", "مَدٌّ بِالْأَلِفِ"], "answer": "مَدٌّ بِالْيَاءِ", "answerIndex": 1, "explanation": "في كلمة «سعيد» ياء ", "source": "https://ia903102.us.archive.org/18/items/rytest3/testw4_text.pdf"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-169", "question": "رتّب الكلمات لتكوين جملة مفيدة: (فِي ـ يَلْعَبُ ـ الْوَلَدُ ـ الْحَدِيقَةِ)", "choices": ["فِي الْوَلَدُ يَلْعَبُ الْحَدِيقَةِ", "الْوَلَدُ الْحَدِيقَةِ فِي يَلْعَبُ", "الْحَدِيقَةِ فِي يَلْعَبُ الْوَلَدُ", "يَلْعَبُ الْوَلَدُ فِي الْحَدِيقَةِ"], "answer": "يَلْعَبُ الْوَلَدُ فِي الْحَدِيقَةِ", "answerIndex": 3, "explanation": "نبدأ بالفعل ثم الفاعل: يلعب الولد في الحديقة.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-170", "question": "رتّب الكلمات لتكوين جملة مفيدة: (أَسْنَانَهُ ـ يُنَظِّفُ ـ أَحْمَدُ ـ بِالْفُرْشَاةِ)", "choices": ["بِالْفُرْشَاةِ أَسْنَانَهُ أَحْمَدُ يُنَظِّفُ", "أَحْمَدُ بِالْفُرْشَاةِ أَسْنَانَهُ يُنَظِّفُ", "يُنَظِّفُ أَحْمَدُ أَسْنَانَهُ بِالْفُرْشَاةِ", "أَسْنَانَهُ يُنَظِّفُ بِالْفُرْشَاةِ أَحْمَدُ"], "answer": "يُنَظِّفُ أَحْمَدُ أَسْنَانَهُ بِالْفُرْشَاةِ", "answerIndex": 2, "explanation": "الجملة الصحيحة: ينظف أحمد أسنانه بالفرشاة، وهي عادة صحية جميلة.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-171", "question": "اقرأ: «يَسْتَيْقِظُ سَالِمٌ مُبَكِّرًا، يَغْسِلُ وَجْهَهُ وَيُنَظِّفُ أَسْنَانَهُ، ثُمَّ يَتَنَاوَلُ فَطُورَهُ وَيَذْهَبُ إِلَى الْمَدْرَسَةِ». ماذا يفعل سالم بعد الاستيقاظ؟", "choices": ["يَلْعَبُ بِالْكُرَةِ", "يُشَاهِدُ التِّلْفَازَ", "يَغْسِلُ وَجْهَهُ وَيُنَظِّفُ أَسْنَانَهُ", "يَنَامُ مَرَّةً أُخْرَى"], "answer": "يَغْسِلُ وَجْهَهُ وَيُنَظِّفُ أَسْنَانَهُ", "answerIndex": 2, "explanation": "ذكر النص أن سالم يغسل وجهه وينظف أسنانه بعد الاستيقاظ مباشرة.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-172", "question": "من العادات الصحية في النص السابق...", "choices": ["أَكْلُ الْحَلْوَى كَثِيرًا", "تَنَاوُلُ الْفَطُورِ قَبْلَ الذَّهَابِ إِلَى الْمَدْرَسَةِ", "تَرْكُ غَسْلِ الْيَدَيْنِ", "السَّهَرُ طَوَالَ اللَّيْلِ"], "answer": "تَنَاوُلُ الْفَطُورِ قَبْلَ الذَّهَابِ إِلَى الْمَدْرَسَةِ", "answerIndex": 1, "explanation": "الفطور الصباحي عادة صحية تعطينا النشاط والتركيز في المدرسة.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-173", "question": "اقرأ: «زَرَعَ الْفَلَّاحُ شَجَرَةً صَغِيرَةً، وَظَلَّ يَسْقِيهَا كُلَّ يَوْمٍ حَتَّى كَبُرَتْ وَأَعْطَتْ ثِمَارًا لَذِيذَةً». لماذا كبرت الشجرة؟", "choices": ["لِأَنَّهَا كَانَتْ فِي الظِّلِّ", "لِأَنَّ الْمَطَرَ لَمْ يَنْزِلْ", "لِأَنَّ الْفَلَّاحَ كَانَ يَسْقِيهَا كُلَّ يَوْمٍ", "لِأَنَّ أَحَدًا لَمْ يَقْتَرِبْ مِنْهَا"], "answer": "لِأَنَّ الْفَلَّاحَ كَانَ يَسْقِيهَا كُلَّ يَوْمٍ", "answerIndex": 2, "explanation": "اهتمام الفلاح وسقيه الشجرة كل يوم جعلها تكبر وتثمر.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-174", "question": "أي جملة صحيحة؟", "choices": ["الطَّالِبُ الْمُجْتَهِدُ يَنْجَحُ", "يَنْجَحُ الْمُجْتَهِدُ الطَّالِبُ فِي", "الطَّالِبُ يَنْجَحُ الْمُجْتَهِدُ", "فِي يَنْجَحُ الطَّالِبُ الْمُجْتَهِدُ"], "answer": "الطَّالِبُ الْمُجْتَهِدُ يَنْجَحُ", "answerIndex": 0, "explanation": "الجملة المرتبة ترتيبًا صحيحًا هي: الطالب المجتهد ينجح.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-175", "question": "نضع في نهاية الجملة الخبرية...", "choices": ["عَلَامَةَ تَعَجُّبٍ (!)", "فَاصِلَةً (،)", "عَلَامَةَ اسْتِفْهَامٍ (؟)", "نُقْطَةً (.)"], "answer": "نُقْطَةً (.)", "answerIndex": 3, "explanation": "تنتهي الجملة الخبرية بنقطة، أما السؤال فينتهي بعلامة استفهام.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-176", "question": "نضع في نهاية سؤال: «أَيْنَ كِتَابُكَ»...", "choices": ["فَاصِلَةً (،)", "عَلَامَةَ اسْتِفْهَامٍ (؟)", "نُقْطَةً (.)", "نُقْطَتَيْنِ (:)"], "answer": "عَلَامَةَ اسْتِفْهَامٍ (؟)", "answerIndex": 1, "explanation": "أي جملة تبدأ بأداة استفهام تنتهي بعلامة استفهام.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-177", "question": "أي كلمة تبدأ بحرف الشين؟", "choices": ["أَسَدٌ", "شَجَرَةٌ", "قَمَرٌ", "بَحْرٌ"], "answer": "شَجَرَةٌ", "answerIndex": 1, "explanation": "شجرة تبدأ بحرف الشين، وقمر بالقاف، وبحر بالباء، وأسد بالألف.", "type": "mcq", "topic": "", "source": "https://ia903102.us.archive.org/18/items/rytest3/testw4_text.pdf"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-178", "question": "الحرف الذي يأتي بعد حرف «س» في ترتيب الحروف الهجائية هو...", "choices": ["ش", "ر", "ز", "ص"], "answer": "ش", "answerIndex": 0, "explanation": "ترتيب الحروف: ... س ثم ش ثم ص. نرتب: س ـ ش ـ ص ـ ض.", "type": "mcq", "topic": "", "source": "https://ia903102.us.archive.org/18/items/rytest3/testw4_text.pdf"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-179", "question": "أي كلمة على وزن «فَاعِل»؟", "choices": ["مَكْتَبٌ", "كِتَابٌ", "كَاتِبٌ", "كَتَبَ"], "answer": "كَاتِبٌ", "answerIndex": 2, "explanation": "كاتب على وزن فاعل: كَاتِب = فَاعِل، وهو من يكتب.", "type": "mcq", "topic": "", "source": "https://ia903102.us.archive.org/18/items/rytest3/testw4_text.pdf"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-180", "question": "أكمل الجملة: أُحِبُّ أَنْ أَقْرَأَ ..... مُفِيدَةً.", "choices": ["قِصَصٌ", "قِصَّتِي", "قِصَّةً", "الْقِصَّةَ"], "answer": "قِصَّةً", "answerIndex": 2, "explanation": "بعد «أن أقرأ» نحتاج مفعولًا به منصوبًا: قصةً مفيدةً.", "type": "mcq", "topic": "", "source": "https://ia903102.us.archive.org/18/items/rytest3/testw4_text.pdf"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-181", "question": "أيُّ كلمة معناها «المكان الذي نتعلم فيه»؟", "choices": ["الْمَلْعَبُ", "الْمَسْجِدُ", "الْمَدْرَسَةُ", "السُّوقُ"], "answer": "الْمَدْرَسَةُ", "answerIndex": 2, "explanation": "المدرسة هي مكان التعلم، والملعب مكان اللعب والرياضة.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-182", "question": "نستخدم الحاسوب في...", "choices": ["الْبَحْثِ وَالتَّعَلُّمِ", "قَطْعِ الْخُضَارِ", "صَيْدِ السَّمَكِ", "زِرَاعَةِ الْأَرْضِ"], "answer": "الْبَحْثِ وَالتَّعَلُّمِ", "answerIndex": 0, "explanation": "من دروس التكنولوجيا: نستخدم الحاسوب للبحث والتعلم ومشاهدة الدروس المفيدة.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-183", "question": "من فوائد الرياضة أنها...", "choices": ["تُقَوِّي الْجِسْمَ وَتُحَافِظُ عَلَى الصِّحَّةِ", "تُبْعِدُنَا عَنِ الْأَصْدِقَاءِ", "تُضْعِفُ الْجِسْمَ", "تَجْعَلُنَا نَنَامُ كَثِيرًا"], "answer": "تُقَوِّي الْجِسْمَ وَتُحَافِظُ عَلَى الصِّحَّةِ", "answerIndex": 0, "explanation": "الرياضة تقوي الجسم وتحافظ على الصحة وتمنحنا النشاط.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-184", "question": "أكمل: أُمَارِسُ الرِّيَاضَةَ كُلَّ يَوْمٍ ..... أَكُونَ قَوِيًّا.", "choices": ["أَوْ", "لِكَيْ", "لَكِنَّ", "ثُمَّ"], "answer": "لِكَيْ", "answerIndex": 1, "explanation": "«لكي» تفيد التعليل: أمارس الرياضة لكي أكون قويًا.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-185", "question": "ما الكلمة المختلفة عن الباقي؟ (قَمَرٌ ـ شَمْسٌ ـ نُجُومٌ ـ كِتَابٌ)", "choices": ["قَمَرٌ", "شَمْسٌ", "كِتَابٌ", "نُجُومٌ"], "answer": "كِتَابٌ", "answerIndex": 2, "explanation": "القمر والشمس والنجوم في السماء، أما الكتاب فليس منها.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-186", "question": "ما الكلمة المختلفة؟ (تُفَّاحٌ ـ مَوْزٌ ـ عِنَبٌ ـ كُرْسِيٌّ)", "choices": ["كُرْسِيٌّ", "تُفَّاحٌ", "عِنَبٌ", "مَوْزٌ"], "answer": "كُرْسِيٌّ", "answerIndex": 0, "explanation": "التفاح والموز والعنب فواكه، أما الكرسي فهو أثاث.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-187", "question": "اختر الكلمة التي فيها حرف مضعّف (مشدّد):", "choices": ["كِتَابٌ", "مَدْرَسَةٌ", "مُعَلِّمٌ", "قَلَمٌ"], "answer": "مُعَلِّمٌ", "answerIndex": 2, "explanation": "في كلمة «معلّم» اللام مشددة، ونسمع صوتها قويًا.", "type": "mcq", "topic": "", "source": "https://ia903102.us.archive.org/18/items/rytest3/testw4_text.pdf"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-188", "question": "اختر الجملة التي تدل على المفرد:", "choices": ["هَذَانِ طَبِيبَانِ مُخْلِصَانِ", "هَذَا طَبِيبٌ مُخْلِصٌ", "هَؤُلَاءِ أَطِبَّاءُ مُخْلِصُونَ", "الطَّبِيبَاتُ مُخْلِصَاتٌ"], "answer": "هَذَا طَبِيبٌ مُخْلِصٌ", "answerIndex": 1, "explanation": "«هذا طبيب مخلص» تدل على مفرد واحد، والباقي مثنى وجمع.", "type": "mcq", "topic": "", "source": "https://ia903102.us.archive.org/18/items/rytest3/testw4_text.pdf"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-189", "question": "ما جمع كلمة «وَلَد»؟", "choices": ["وَلَدَانِ", "أَبْنَاءُ عُمُومَةٍ", "وَالِدُونَ", "أَوْلَادٌ"], "answer": "أَوْلَادٌ", "answerIndex": 3, "explanation": "جمع ولد: أولاد، أما ولدان فهي مثنى.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-190", "question": "ما مفرد كلمة «أَقْلَام»؟", "choices": ["قَلْمٌ", "مِقْلَمَةٌ", "قَلَمٌ", "أَقْلَمٌ"], "answer": "قَلَمٌ", "answerIndex": 2, "explanation": "أقلام جمع، ومفردها قلم.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-191", "question": "أكمل بالضمير المناسب: ..... يَشْرَبَانِ الْحَلِيبَ (للولدين).", "choices": ["أَنْتُمَا", "هُمْ", "هُوَ", "هُمَا"], "answer": "هُمَا", "answerIndex": 3, "explanation": "هما ضمير للمثنى الغائب: هما يشربان الحليب.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-192", "question": "أي كلمة تدل على اسم مكان؟", "choices": ["فِي", "يُصَلِّي", "جَمِيلٌ", "الْمَسْجِدُ"], "answer": "الْمَسْجِدُ", "answerIndex": 3, "explanation": "المسجد اسم مكان، و«يصلي» فعل، و«في» حرف جر.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-193", "question": "اختر الكلمة التي آخرها ألف لينة (ى):", "choices": ["قَلَمٌ", "مُوسَى", "كِتَابٌ", "مَدْرَسَةٌ"], "answer": "مُوسَى", "answerIndex": 1, "explanation": "موسى تنتهي بألف لينة على صورة الياء (ى).", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-194", "question": "أكمل: ذَهَبْتُ إِلَى حَدِيقَةِ الْحَيَوَانِ وَرَأَيْتُ ..... كَبِيرًا يَأْكُلُ الْعُشْبَ.", "choices": ["كِتَابًا", "قَمَرًا", "أَسَدًا", "شَجَرَةً"], "answer": "أَسَدًا", "answerIndex": 2, "explanation": "نرى في حديقة الحيوان حيوانات مثل الأسد، ولا نرى كتابًا أو قمرًا هناك.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "العربي", "id": "h26-g2-195", "question": "ما نوع الكلمة التي تحتها خط: «الْجَوُّ (صَافٍ) الْيَوْمَ»؟", "choices": ["اسْمٌ", "حَرْفٌ", "فِعْلٌ", "ضَمِيرٌ"], "answer": "اسْمٌ", "answerIndex": 0, "explanation": "صافٍ اسم يدل على صفة الجو، والاسم يقبل «ال» والتنوين.", "type": "mcq", "topic": "", "source": "https://www.facebook.com/permalink.php?story_fbid=pfbid0U6dM186ugyjSTzfgTWR5G9bqBRaGr3ypQpcRbGgbSFUBKx9txT27PxACAHKQCmJtl&id=61550026537929"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-196", "question": "ما القيمة المكانية للرقم ٥ في العدد ٥٣٢؟", "choices": ["٥٠٠٠", "٥٠٠", "٥", "٥٠"], "answer": "٥٠٠", "answerIndex": 1, "explanation": "الرقم ٥ في منزلة المئات، فقيمته ٥٠٠.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-197", "question": "ما القيمة المكانية للرقم ٧ في العدد ٤٧١؟", "choices": ["٧٠٠", "٧٠", "٧", "١٧"], "answer": "٧٠", "answerIndex": 1, "explanation": "الرقم ٧ في منزلة العشرات، فقيمته ٧٠.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-198", "question": "العدد ٦٤٨ يتكون من...", "choices": ["٦ مئات و٤ عشرات و٨ آحاد", "٦ مئات و٤ آحاد و٨ عشرات", "٦ عشرات و٤ مئات و٨ آحاد", "٦ آحاد و٤ عشرات و٨ مئات"], "answer": "٦ مئات و٤ عشرات و٨ آحاد", "answerIndex": 0, "explanation": "نقرأ العدد من اليسار: ٦ في المئات، و٤ في العشرات، و٨ في الآحاد.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-199", "question": "أي عدد يساوي ٣٠٠ + ٤٠ + ٩؟", "choices": ["٣٤٩", "٤٣٩", "٩٤٣", "٣٠٤٩"], "answer": "٣٤٩", "answerIndex": 0, "explanation": "نجمع: ٣٠٠ + ٤٠ + ٩ = ٣٤٩.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-200", "question": "كيف نقرأ العدد ٧٠٥؟", "choices": ["سَبْعُونَ وَخَمْسَةٌ", "سَبْعُمِائَةٍ وَخَمْسُونَ", "خَمْسُمِائَةٍ وَسَبْعَةٌ", "سَبْعُمِائَةٍ وَخَمْسَةٌ"], "answer": "سَبْعُمِائَةٍ وَخَمْسَةٌ", "answerIndex": 3, "explanation": "العدد ٧٠٥: سبعمائة في المئات وصفر في العشرات وخمسة في الآحاد.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-201", "question": "ما العدد الذي يأتي بعد ٢٩٩ مباشرة؟", "choices": ["٣٠٠", "٢٩٨", "٢١٠", "٣٠١"], "answer": "٣٠٠", "answerIndex": 0, "explanation": "بعد ٢ ": "h26-g2-246", "question": "كم عدد شهور السنة؟", "choices": ["٧ شهور", "٣٦٥ شهرًا", "١٢ شهرًا", "١٠ شهور"], "answer": "١٢ شهرًا", "answerIndex": 2, "explanation": "السنة فيها اثنا عشر شهرًا، أما ٣٦٥ فهو عدد أيام السنة.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-247", "question": "معي ورقة نقدية بـ١٠ جنيهات. كم تساوي من الجنيهات المعدنية؟", "choices": ["جنيهًا واحدًا", "٥ جنيهات", "٢٠ جنيهًا", "١٠ جنيهات"], "answer": "١٠ جنيهات", "answerIndex": 3, "explanation": "الورقة بعشرة جنيهات تساوي عشرة جنيهات معدنية.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-248", "question": "اشترى عمر لعبة بـ٢٠ جنيهًا ودفع ٥٠ جنيهًا. كم الباقي؟", "choices": ["٧٠ جنيهًا", "٢٥ جنيهًا", "٤٠ جنيهًا", "٣٠ جنيهًا"], "answer": "٣٠ جنيهًا", "answerIndex": 3, "explanation": "الباقي = ٥٠ − ٢٠ = ٣٠ جنيهًا.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-249", "question": "قُسّمت البرتقالة إلى جزأين متساويين. كل جزء يسمى...", "choices": ["النصف", "الربع", "الثلث", "الكل"], "answer": "النصف", "answerIndex": 0, "explanation": "الجزء الواحد من جزأين متساويين يسمى النصف.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-250", "question": "إذا قسمنا الفطيرة إلى ٤ أجزاء متساوية، فكل جزء يسمى...", "choices": ["الثلث", "الخمس", "النصف", "الربع"], "answer": "الربع", "answerIndex": 3, "explanation": "الجزء الواحد من أربعة أجزاء متساوية يسمى الربع.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-251", "question": "أي كسر أكبر؟", "choices": ["النصف", "هما متساويان", "الربع", "لا يمكن المقارنة"], "answer": "النصف", "answerIndex": 0, "explanation": "النصف أكبر من الربع؛ فكلما قلّت الأجزاء كبر الجزء الواحد.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-252", "question": "كم نصفًا في الواحد الصحيح؟", "choices": ["نصفان", "٣ أنصاف", "٤ أنصاف", "نصف واحد"], "answer": "نصفان", "answerIndex": 0, "explanation": "الواحد الصحيح = نصف + نصف = نصفان.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-253", "question": "أكمل النمط: ١٠٠، ٢٠٠، ٣٠٠، .....", "choices": ["٣٥٠", "٤٠٠", "٣١٠", "٥٠٠"], "answer": "٤٠٠", "answerIndex": 1, "explanation": "نعد بالمئات: ١٠٠، ٢٠٠، ٣٠٠، ٤٠٠.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-254", "question": "أكمل النمط الهندسي: △ ○ △ ○ △ .....", "choices": ["□", "△", "○ أخرى", "○"], "answer": "○", "answerIndex": 3, "explanation": "النمط يتناوب: مثلث ثم دائرة، فبعد المثلث تأتي الدائرة.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-255", "question": "مع مريم ٣ أكياس في كل كيس ١٠ كرات. كم كرة معها؟ (تلميح: اجمع)", "choices": ["١٣ كرة", "٣ كرات", "١٠٣ كرات", "٣٠ كرة"], "answer": "٣٠ كرة", "answerIndex": 3, "explanation": "١٠ + ١٠ + ١٠ = ٣٠ كرة.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-256", "question": "ما ناتج: ٤٦ + ٤٦ = ؟", "choices": ["٩٢", "٨٢", "٨٦", "٩٦"], "answer": "٩٢", "answerIndex": 0, "explanation": "٤٦ + ٤٦: الآحاد ٦+٦=١٢، والعشرات ٤+٤+١=٩، فالناتج ٩٢.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-257", "question": "ما ناتج: ٢٠٠ − ٧٥ = ؟", "choices": ["١٧٥", "١٣٥", "١٢٥", "٢٧٥"], "answer": "١٢٥", "answerIndex": 2, "explanation": "٢٠٠ − ٧٥ = ١٢٥.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-258", "question": "عدد آحاده ٩ وعشراته ٤ ومئاته ٢ هو...", "choices": ["٤٩٢", "٩٢٤", "٢٤٩", "٢٩٤"], "answer": "٢٤٩", "answerIndex": 2, "explanation": "نكتب المئات ثم العشرات ثم الآحاد: ٢ ـ ٤ ـ ٩ فيكون ٢٤٩.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-259", "question": "ما ناتج: ٣٠٠ + ٣٠٠ = ؟", "choices": ["٥٠٠", "٦٠٠", "٦٠", "٣٣٠"], "answer": "٦٠٠", "answerIndex": 1, "explanation": "٣ مئات + ٣ مئات = ٦ مئات = ٦٠٠.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lbtdyy-pdf-2027"}, {"grade": 2, "subject": "الرياضيات", "id": "h26-g2-260", "question": "ساعة ونصف تساوي كم دقيقة؟", "choices": ["٣٠ دقيقة", "١٠٠ دقيقة", "٦٠ دقيقة", "٩٠ دقيقة"], "answer": "٩٠ دقيقة", "answerIndex": 3, "explanation": "الساعة ٦٠ دقيقة، ونصف الساعة ٣٠ دقيقة، والمجموع ٩٠ دقيقة.", "type": "mcq", "topic": "", "source": "https://www.modrsbook.com/primary-2/term-1/math/mrj-at-math-lshhr-nwfmbr-bljbt-lsf-lthny-lb function migrate(p){var n=newProfile(p.name,p.avatar,p.pin);for(var k in n)if(p[k]===undefined)p[k]=n[k];for(k in n.set)if(p.set[k]===undefined)p.set[k]=n.set[k];
 if(Array.isArray(p.wrong)){var w={};p.wrong.forEach(function(id){w[id]={b:1,due:0}});p.wrong=w}
 if(Array.isArray(p.days)){var d={};p.days.forEach(function(x){d[x]={q:0,c:0,sec:0,p:0}});p.days=d}
 p.v=2;return p}
function trimProfile(p){var ks=Object.keys(p.days).sort();while(ks.length>45)delete p.days[ks.shift()];if(p.seen.length>260)p.seen=p.seen.slice(-260);if(p.history.length>15)p.history=p.history.slice(-15);return p}
function scoreFor(o){var base=o.puzzle?30:10;if(!o.puzzle&&o.secs<10)base+=2;if(o.streak>=5)base+=10;else if(o.streak>=3)base+=5;if(o.hint)base=Math.max(5,base-5);if(o.retry)base=Math.max(5,Math.round(base/2));return base}
function leitnerWrong(p,id){p.wrong[id]={b:1,due:Date.now(),n:((p.wrong[id]&&p.wrong[id].n)||0)+1}}
function leitnerRight(p,id){var w=p.wrong[id];if(!w)return false;w.b++;if(w.b>3){delete p.wrong[id];p.fixed=(p.fixed||0)+1;return true}w.due=Date.now()+INT[w.b-1];return false}
function dueIds(p){var n=Date.now();return Object.keys(p.wrong).filter(function(id){return BYID[id]&&p.wrong[id].due<=n})}
function wrongIds(p){return Object.keys(p.wrong).filter(function(id){return BYID[id]})}
function dayRec(p,k){k=k||today();if(!p.days[k])p.days[k]={q:0,c:0,sec:0,p:0};return p.days[k]}
function streakDays(p){var n=0;for(var i=0;i<400;i++){if(p.days[dayKey(i)]&&p.days[dayKey(i)].q>0)n++;else if(i>0)break;else if(i===0)continue}return n}
function weekCorrect(p){var c=0;for(var i=0;i<7;i++){var d=p.days[dayKey(i)];if(d)c+=d.c}return c}
function subjStat(p,s){var t=p.stats[s]||{a:0,c:0};return{a:t.a,c:t.c,pct:t.a?Math.round(t.c/t.a*100):0}}
function subjStars(p,s){var t=subjStat(p,s);if(t.a<10)return 0;return t.pct>=85?3:t.pct>=65?2:1}

 if(mode==="quran"){pool=BANK.filter(function(b){return !b.puzzle&&b.subject==="القرآن"&&(scope==="all"||b.scope===scope)})}

 shuffle(pool.filter(function(b){return P.seen.indexOf(b.id)<0})).forEach(add);
 shuffle(pool).forEach(add);
 return out}

function badgeOk(id,P,s){var st=P.stats;function sc(x){return st[x]?st[x].c:0}
 switch(id){case"first":return P.sessions>=1;case"puz5":return P.puzzlesOk>=5;case"puz10":return P.puzzlesOk>=10;case"puz25":return P.puzzlesOk>=25;case"streak5":return P.bestStreak>=5;case"streak10":return P.bestStreak>=10;case"perfect":return s&&s.right===s.list.length&&s.list.length>=5;
 case"p500":return P.points>=500;case"p1000":return P.points>=1000;case"p2500":return P.points>=2500;case"days3":return streakDays(P)>=3;case"days7":return streakDays(P)>=7;case"q100":return P.tot.q>=100;case"q300":return P.tot.q>=300;
 case"fix5":return (P.fixed||0)>=5;case"fast":return (P.fast||0)>=5;case"math":return sc("الرياضيات")>=10;case"arabic":return sc("العربي")>=10;case"quran":return sc("القرآن")>=10;case"islam":return sc("التربية الإسلامية")>=10;case"science":return sc("العلوم")>=10;case"allr":return Object.keys(st).filter(function(k){return st[k].a>=3}).length>=3;case"week":return weekCorrect(P)>=50}return false}

var AYAH={"051057": {"a": 57, "text": "مَآ أُرِيدُ مِنْهُم مِّن رِّزْقٍۢ وَمَآ أُرِيدُ أَن يُطْعِمُونِ"}, "085008": {"a": 8, "text": "وَمَا نَقَمُوا۟ مِنْهُمْ إِلَّآ أَن يُؤْمِنُوا۟ بِٱللَّهِ ٱلْعَزِيزِ ٱلْحَمِيدِ"}, "052035": {"a": 35, "text": "أَمْ خُلِقُوا۟ مِنْ غَيْرِ شَىْءٍ أَمْ هُمُ ٱلْخَٰلِقُونَ"}, "054007": {"a": 7, "text": "خُشَّعًا أَبْصَٰرُهُمْ يَخْرُجُونَ مِنَ ٱلْأَجْدَاثِ كَأَنَّهُمْ جَرَادٌۭ مُّنتَشِرٌۭ"}, "051056": {"a": 56, "text": "وَمَا خَلَقْتُ ٱلْجِنَّ وَٱلْإِنسَ إِلَّا لِيَعْبُدُونِ"}, "096001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ"}, "083031": {"a": 31, "text": "وَإِذَا ٱنقَلَبُوٓا۟ إِلَىٰٓ أَهْلِهِمُ ٱنقَلَبُوا۟ فَكِهِينَ"}, "056077": {"a": 77, "text": "إِنَّهُۥ لَقُرْءَانٌۭ كَرِيمٌۭ"}, "104004": {"a": 4, "text": "كَلَّا ۖ لَيُنۢبَذَنَّ فِى ٱلْحُطَمَةِ"}, "084025": {"a": 25, "text": "إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۭ"}, "051028": {"a": 28, "text": "فَأَوْجَسَ مِنْهُمْ خِيفَةًۭ ۖ قَالُوا۟ لَا تَخَفْ ۖ وَبَشَّرُوهُ بِغُلَٰمٍ عَلِيمٍۢ"}, "050008": {"a": 8, "text": "تَبْصِرَةًۭ وَذِكْرَىٰ لِكُلِّ عَبْدٍۢ مُّنِيبٍۢ"}, "089015": {"a": 15, "text": "فَأَمَّا ٱلْإِنسَٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ"}, "071007": {"a": 7, "text": "وَإِنِّى كُلَّمَا دَعَوْتُهُمْ لِتَغْفِرَ لَهُمْ جَعَلُوٓا۟ أَصَٰبِعَهُمْ فِىٓ ءَاذَانِهِمْ وَٱسْتَغْشَوْا۟ ثِيَابَهُمْ وَأَصَرُّوا۟ وَٱسْتَكْبَرُوا۟ ٱسْتِكْبَارًۭا"}, "051027": {"a": 27, "text": "فَقَرَّبَهُۥٓ إِلَيْهِمْ قَالَ أَلَا تَأْكُلُونَ"}, "051055": {"a": 55, "text": "وَذَكِّرْ فَإِنَّ ٱلذِّكْرَىٰ تَنفَعُ ٱلْمُؤْمِنِينَ"}, "057024": {"a": 24, "text": "ٱلَّذِينَ يَبْخَلُونَ وَيَأْمُرُونَ ٱلنَّاسَ بِٱلْبُخْلِ ۗ وَمَن يَتَوَلَّ فَإِنَّ ٱللَّهَ هُوَ ٱلْغَنِىُّ ٱلْحَمِيدُ"}, "067004": {"a": 4, "text": "ثُمَّ ٱرْجِعِ ٱلْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ ٱلْبَصَرُ خَاسِئًۭا وَهُوَ حَسِيرٌۭ"}, "089010": {"a": 10, "text": "وَفِرْعَوْنَ ذِى ٱلْأَوْتَادِ"}, "054036": {"a": 36, "text": "وَلَقَدْ أَنذَرَهُم بَطْشَتَنَا فَتَمَارَوْا۟ بِٱلنُّذُرِ"}, "066002": {"a": 2, "text": "قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْ ۚ وَٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ"}, "051026": {"a": 26, "text": "فَرَاغَ إِلَىٰٓ أَهْلِهِۦ فَجَآءَ بِعِجْلٍۢ سَمِينٍۢ"}, "055010": {"a": 10, "text": "وَٱلْأَرْضَ وَضَعَهَا لِلْأَنَامِ"}, "071006": {"a": 6, "text": "فَلَمْ يَزِدْهُمْ دُعَآءِىٓ إِلَّا فِرَارًۭا"}, "054010": {"a": 10, "text": "فَدَعَا رَبَّهُۥٓ أَنِّى مَغْلُوبٌۭ فَٱنتَصِرْ"}, "057001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ"}, "076023": {"a": 23, "text": "إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ ٱلْقُرْءَانَ تَنزِيلًۭا"}, "056091": {"a": 91, "text": "فَسَلَٰمٌۭ لَّكَ مِنْ أَصْحَٰبِ ٱلْيَمِينِ"}, "050004": {"a": 4, "text": "قَدْ عَلِمْنَا مَا تَنقُصُ ٱلْأَرْضُ مِنْهُمْ ۖ وَعِندَنَا كِتَٰبٌ حَفِيظٌۢ"}, "052015": {"a": 15, "text": "أَفَسِحْرٌ هَٰذَآ أَمْ أَنتُمْ لَا تُبْصِرُونَ"}, "082018": {"a": 18, "text": "ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ"}, "070038": {"a": 38, "text": "أَيَطْمَعُ كُلُّ ٱمْرِئٍۢ مِّنْهُمْ أَن يُدْخَلَ جَنَّةَ نَعِيمٍۢ"}, "079027": {"a": 27, "text": "ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا"}, "052016": {"a": 16, "text": "ٱصْلَوْهَا فَٱصْبِرُوٓا۟ أَوْ لَا تَصْبِرُوا۟ سَوَآءٌ عَلَيْكُمْ ۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ"}, "105001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ ٱلْفِيلِ"}, "052024": {"a": 24, "text": "۞ وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌۭ لَّهُمْ كَأَنَّهُمْ لُؤْلُؤٌۭ مَّكْنُونٌۭ"}, "069013": {"a": 13, "text": "فَإِذَا نُفِخَ فِى ٱلصُّورِ نَفْخَةٌۭ وَٰحِدَةٌۭ"}, "067005": {"a": 5, "text": "وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ"}, "054009": {"a": 9, "text": "۞ كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ فَكَذَّبُوا۟ عَبْدَنَا وَقَالُوا۟ مَجْنُونٌۭ وَٱزْدُجِرَ"}, "072027": {"a": 27, "text": "إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا"}, "051031": {"a": 31, "text": "۞ قَالَ فَمَا خَطْبُكُمْ أَيُّهَا ٱلْمُرْسَلُونَ"}, "055015": {"a": 15, "text": "وَخَلَقَ ٱلْجَآنَّ مِن مَّارِجٍۢ مِّن نَّارٍۢ"}, "085007": {"a": 7, "text": "وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌۭ"}, "047001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ أَضَلَّ أَعْمَٰلَهُمْ"}, "078036": {"a": 36, "text": "جَزَآءًۭ مِّن رَّبِّكَ عَطَآءً حِسَابًۭا"}, "056045": {"a": 45, "text": "إِنَّهُمْ كَانُوا۟ قَبْلَ ذَٰلِكَ مُتْرَفِينَ"}, "050012": {"a": 12, "text": "كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ وَأَصْحَٰبُ ٱلرَّسِّ وَثَمُودُ"}, "071017": {"a": 17, "text": "وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلْأَرْضِ نَبَاتًۭا"}, "091013": {"a": 13, "text": "فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا"}, "079040": {"a": 40, "text": "وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ"}, "053038": {"a": 38, "text": "أَلَّا تَزِرُ وَازِرَةٌۭ وِزْرَ أُخْرَىٰ"}, "050015": {"a": 15, "text": "أَفَعَيِينَا بِٱلْخَلْقِ ٱلْأَوَّلِ ۚ بَلْ هُمْ فِى لَبْسٍۢ مِّنْ خَلْقٍۢ جَدِيدٍۢ"}, "049018": {"a": 18, "text": "إِنَّ ٱللَّهَ يَعْلَمُ غَيْبَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَٱللَّهُ بَصِيرٌۢ بِمَا تَعْمَلُونَ"}, "052012": {"a": 12, "text": "ٱلَّذِينَ هُمْ فِى خَوْضٍۢ يَلْعَبُونَ"}, "075005": {"a": 5, "text": "بَلْ يُرِيدُ ٱلْإِنسَٰنُ لِيَفْجُرَ أَمَامَهُۥ"}, "067003": {"a": 3, "text": "ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا ۖ مَّا تَرَىٰ فِى خَلْقِ ٱلرَّحْمَٰنِ مِن تَفَٰوُتٍۢ ۖ فَٱرْجِعِ ٱلْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍۢ"}, "056060": {"a": 60, "text": "نَحْنُ قَدَّرْنَا بَيْنَكُمُ ٱلْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ"}, "091014": {"a": 14, "text": "فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا"}, "055074": {"a": 74, "text": "لَمْ يَطْمِثْهُنَّ إِنسٌۭ قَبْلَهُمْ وَلَا جَآنٌّۭ"}, "073005": {"a": 5, "text": "إِنَّا سَنُلْقِى عَلَيْكَ قَوْلًۭا ثَقِيلًا"}, "050029": {"a": 29, "text": "مَا يُبَدَّلُ ٱلْقَوْلُ لَدَىَّ وَمَآ أَنَا۠ بِظَلَّٰمٍۢ لِّلْعَبِيدِ"}, "051053": {"a": 53, "text": "أَتَوَاصَوْا۟ بِهِۦ ۚ بَلْ هُمْ قَوْمٌۭ طَاغُونَ"}, "070014": {"a": 14, "text": "وَمَن فِى ٱلْأَرْضِ جَمِيعًۭا ثُمَّ يُنجِيهِ"}, "077048": {"a": 48, "text": "وَإِذَا قِيلَ لَهُمُ ٱرْكَعُوا۟ لَا يَرْكَعُونَ"}, "083014": {"a": 14, "text": "كَلَّا ۖ بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ"}, "047002": {"a": 2, "text": "وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَءَامَنُوا۟ بِمَا نُزِّلَ عَلَىٰ مُحَمَّدٍۢ وَهُوَ ٱلْحَقُّ مِن رَّبِّهِمْ ۙ كَفَّرَ عَنْهُمْ سَيِّـَٔاتِهِمْ وَأَصْلَحَ بَالَهُمْ"}, "055024": {"a": 24, "text": "وَلَهُ ٱلْجَوَارِ ٱلْمُنشَـَٔاتُ فِى ٱلْبَحْرِ كَٱلْأَعْلَٰمِ"}, "089008": {"a": 8, "text": "ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ"}, "048007": {"a": 7, "text": "وَلِلَّهِ جُنُودُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا"}, "061010": {"a": 10, "text": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ هَلْ أَدُلُّكُمْ عَلَىٰ تِجَٰرَةٍۢ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍۢ"}, "050026": {"a": 26, "text": "ٱلَّذِى جَعَلَ مَعَ ٱللَّهِ إِلَٰهًا ءَاخَرَ فَأَلْقِيَاهُ فِى ٱلْعَذَابِ ٱلشَّدِيدِ"}, "054011": {"a": 11, "text": "فَفَتَحْنَآ أَبْوَٰبَ ٱلسَّمَآءِ بِمَآءٍۢ مُّنْهَمِرٍۢ"}, "056041": {"a": 41, "text": "وَأَصْحَٰبُ ٱلشِّمَالِ مَآ أَصْحَٰبُ ٱلشِّمَالِ"}, "055043": {"a": 43, "text": "هَٰذِهِۦ جَهَنَّمُ ٱلَّتِى يُكَذِّبُ بِهَا ٱلْمُجْرِمُونَ"}, "048028": {"a": 28, "text": "هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًۭا"}, "075040": {"a": 40, "text": "أَلَيْسَ ذَٰلِكَ بِقَٰدِرٍ عَلَىٰٓ أَن يُحْۦِىَ ٱلْمَوْتَىٰ"}, "077049": {"a": 49, "text": "وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"}, "079018": {"a": 18, "text": "فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ"}, "048008": {"a": 8, "text": "إِنَّآ أَرْسَلْنَٰكَ شَٰهِدًۭا وَمُبَشِّرًۭا وَنَذِيرًۭا"}, "075036": {"a": 36, "text": "أَيَحْسَبُ ٱلْإِنسَٰنُ أَن يُتْرَكَ سُدًى"}, "089021": {"a": 21, "text": "كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّۭا دَكًّۭا"}, "067002": {"a": 2, "text": "ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًۭا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ"}, "056076": {"a": 76, "text": "وَإِنَّهُۥ لَقَسَمٌۭ لَّوْ تَعْلَمُونَ عَظِيمٌ"}, "068033": {"a": 33, "text": "كَذَٰلِكَ ٱلْعَذَابُ ۖ وَلَعَذَابُ ٱلْءَاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ"}, "072010": {"a": 10, "text": "وَأَنَّا لَا نَدْرِىٓ أَشَرٌّ أُرِيدَ بِمَن فِى ٱلْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًۭا"}, "055009": {"a": 9, "text": "وَأَقِيمُوا۟ ٱلْوَزْنَ بِٱلْقِسْطِ وَلَا تُخْسِرُوا۟ ٱلْمِيزَانَ"}, "089006": {"a": 6, "text": "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ"}, "061011": {"a": 11, "text": "تُؤْمِنُونَ بِٱللَّهِ وَرَسُولِهِۦ وَتُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ"}, "089005": {"a": 5, "text": "هَلْ فِى ذَٰلِكَ قَسَمٌۭ لِّذِى حِجْرٍ"}, "066001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ"}, "051032": {"a": 32, "text": "قَالُوٓا۟ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٍۢ مُّجْرِمِينَ"}, "050027": {"a": 27, "text": "۞ قَالَ قَرِينُهُۥ رَبَّنَا مَآ أَطْغَيْتُهُۥ وَلَٰكِن كَانَ فِى ضَلَٰلٍۭ بَعِيدٍۢ"}, "054028": {"a": 28, "text": "وَنَبِّئْهُمْ أَنَّ ٱلْمَآءَ قِسْمَةٌۢ بَيْنَهُمْ ۖ كُلُّ شِرْبٍۢ مُّحْتَضَرٌۭ"}, "048009": {"a": 9, "text": "لِّتُؤْمِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَتُعَزِّرُوهُ وَتُوَقِّرُوهُ وَتُسَبِّحُوهُ بُكْرَةًۭ وَأَصِيلًا"}, "077031": {"a": 31, "text": "لَّا ظَلِيلٍۢ وَلَا يُغْنِى مِنَ ٱللَّهَبِ"}, "080023": {"a": 23, "text": "كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ"}, "089009": {"a": 9, "text": "وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ"}}, EXPL={"3|الرياضيات|عالم الجمع والطرح": [{"t": "عالم الجمع والطرح", "k": "", "lines": ["بص يا حبيبي، لما نجمع، بنحط الأرقام تحت بعض: آحاد تحت آحاد، وعشرات تحت عشرات، ومئات تحت مئات."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["نبدأ الجمع من اليمين، من الآحاد. لو الناتج 10 أو أكتر، نكتب الآحاد ونرفع العشرة للعمود اللي جنبه. اسمها الحمل."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["في الطرح كمان نبدأ من الآحاد. لو الرقم اللي فوق أصغر، نستلف عشرة من العمود اللي جنبه."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["مثال: 45 + 28. نجمع 5 + 8 = 13، نكتب 3 ونرفع 1. بعدين 4 + 2 + 1 = 7. الناتج 73."]}, {"t": "عالم الجمع والطرح", "k": "", "lines": ["اتأكد من الحل: الجمع نختبره بالطرح، والطرح نختبره بالجمع. لو رجعنا للرقم الأصلي يبقى الحل صح. يلا يا بطل."]}], "3|الرياضيات|عالم الزمن": [{"t": "عالم الزمن", "k": "", "lines": ["بص يا حبيبي، الساعة فيها 60 دقيقة، واليوم فيه 24 ساعة، والأسبوع 7 أيام."]}, {"t": "عالم الزمن", "k": "", "lines": ["العقرب الصغير بيقول الساعة، والعقرب الكبير بيقول الدقايق. لما الكبير على 6 نقول والنصف، ولما يكون على 3 نقول والربع."]}, {"t": "عالم الزمن", "k": "", "lines": ["الزمن المنقضي هو الفرق بين وقت البداية ووقت النهاية. من 3:00 لحد 5:30 يبقى ساعتين ونص."]}, {"t": "عالم الزمن", "k": "", "lines": ["السنة فيها 12 شهر، والشهر ممكن يكون 30 أو 31 يوم، وفبراير أقل."]}, {"t": "عالم الزمن", "k": "", "lines": ["اقرأ السؤال وشوف بيسأل عن ساعة ولا دقيقة ولا يوم، وبعدين اختار الوحدة الصح. يلا يا بطل."]}], "3|الرياضيات|مملكة الضرب": [{"t": "مملكة الضرب", "k": "", "lines": ["بص يا حبيبي، الضرب هو جمع الرقم نفسه كذا مرة. 4 × 3 يعني 4 + 4 + 4 = 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["جدول الضرب لازم نحفظه. ممكن نتعلمه بالعد بالقفزات: 3، 6، 9، 12."]}, {"t": "مملكة الضرب", "k": "", "lines": ["الترتيب مش بيغير الناتج: 4 × 3 = 3 × 4."]}, {"t": "مملكة الضرب", "k": "", "lines": ["أي رقم × 1 يساوي نفسه. وأي رقم × 0 يساوي صفر."]}, {"t": "مملكة الضرب", "k": "", "lines": ["لو السؤال فيه مجموعات متساوية، اعرف عدد المجموعات وعدد كل مجموعة واضرب. يلا يا بطل."]}], "3|الرياضيات|مملكة ا var TIPS=["اقرأ السؤال مرتين قبل أن تجيب.","إن لم تكن متأكدًا، فاستبعد الاختيارات الخاطئة أولًا.","خذ نفسًا عميقًا قبل السؤال الصعب.","الخطأ يعلّمك أكثر من الإجابة السهلة.","راجع أخطاءك كل يوم خمس دقائق.","اشرب ماءً وارتح بين الجولات.","جرّب أن تشرح الدرس لغيرك، ستفهمه أفضل.","ابدأ بالمادة التي تحبها، ثم الأصعب.","اكتب الحل على ورقة قبل أن تختار.","النوم مبكرًا يجعل المذاكرة أسهل.","شاهد الشرح المتحرك إذا أخطأت في موضوع أكثر من مرة.","التكرار القليل كل يوم خير من يوم واحد طويل.","اسأل معلمك عن أي شيء لا تفهمه.","عندما تتعب، خذ استراحة ضحك.","ابدأ طعامَك ببسم الله، وكُل بيمينك، وكُل مما يليك؛ فهكذا علّمنا النبيُّ ﷺ.","فكِّر قبل أن تتكلم؛ فالكلمةُ الطيبة صدقة، والكلمة الجارحة لا تُنسى.","العب بروحٍ رياضية: افرح بالفوز بتواضع، وتقبّل الخسارة بابتسامة؛ فاللعبُ يجمع ولا يفرِّق.","ادخل المسجدَ بيمينك وقل دعاءَ الدخول، واجلس بأدبٍ وهدوء؛ فأنت في بيت الله.","قبل أن تدخل غرفةَ غيرك، اطرق البابَ بلطفٍ واستأذن؛ فالاستئذانُ أدبٌ رفيعٌ يحفظ الخصوصية.","ابدأ يومَك بذكر الله، واختمه بحمده؛ فالقلبُ الذي يذكر اللهَ قلبٌ مطمئن.","ساعد من يحتاج حولك: أخاك الصغير، وجارَك الكبير، وصديقَك المتعثر؛ فالمساعدةُ تُسعد قلبين.","ابدأ يومَك بالسلام على أهل بيتك؛ فالسلامُ يُدخل المحبةَ والطمأنينةَ إلى القلوب.","كن صادقًا دائمًا، حتى لو كان الصدقُ صعبًا؛ فالصدقُ يهدي إلى البرِّ والجنة.","حافظ على صلواتك الخمس في أوقاتها؛ فالصلاةُ راحةُ القلب ونورُ اليوم.","ابدأ مذاكرتَك بدعاءٍ قصير ونيةٍ صالحة؛ فطلبُ العلم عبادةٌ يُحبها الله.","النظافةُ من الإيمان؛ حافظ على نظافة جسدك وثيابك ومكانك دائمًا.","برُّ الوالدين طريقُك إلى رضا الله؛ كلمةٌ طيبةٌ وابتسامةٌ صادقةٌ تُسعد قلبَ أمِّك وأبيك.","زُر أقاربَك واسأل عنهم ولو بمكالمة؛ فصلةُ الرحم تُبارك في العمر والرزق.","اشكر اللهَ بعد الطعام بقول: الحمد لله؛ فالشكرُ يزيد النعمَ ويبارك فيها.","استمع إلى من يحدِّثك حتى يُكمل كلامَه، ولا تقاطعه؛ فحُسنُ الاستماع من حُسن الخُلق.","لا تسخر من صديقٍ أخطأ أو خسر؛ فاليوم تضحك وغدًا قد تكون مكانه.","حافظ على وردٍ يوميٍّ من القرآن ولو آياتٍ قليلة؛ فخيرُ الأعمال أدومُها وإن قلّت.","استأذن ثلاثَ مرات؛ فإن لم يُؤذَن لك، فارجع بقلبٍ راضٍ ولا تغضب.","ادعُ لوالديك وأهلك وأصدقائك بظهر الغيب؛ فدعوتُك لهم تعود عليك بمثلها.","كن رفيقًا بالحيوانات؛ اسقِها وأطعمها ولا تؤذِها، ففي كلِّ كبدٍ رطبةٍ أجر.","حين تدخل بيتَك أو بيتَ غيرك، قل: السلام عليكم، بصوتٍ واضحٍ وابتسامةٍ جميلة.","الأمانةُ أن تحفظ ما اؤتمنتَ عليه: مالًا كان أو سرًّا أو وعدًا قطعته.","توضأ بإتقانٍ وأحسن وضوءَك؛ فالوضوءُ طهارةٌ ونور.","قسِّم واجباتِك إلى أجزاءٍ صغيرة، وأنجزها واحدةً تلو الأخرى؛ فالجبلُ يُصعَد خطوةً خطوة.","رتِّب غرفتَك وأدواتَك بعد استعمالها؛ فالنظامُ يوفِّر وقتَك ويريح قلبَك.","حين تطلب منك أمُّك شيئًا، فلبِّ طلبَها بفرح؛ فخدمةُ الوالدين شرفٌ وبركة.","احترم كبارَ السن: قف لهم، وقدِّمهم في المجلس، واستمع إلى حكاياتهم بحب.","لا تعبْ طعامًا قُدِّم إليك؛ إن اشتهيتَه أكلتَ، وإن لم تشتهِه تركتَه بلا تعليق.","تكلّم بصوتٍ هادئٍ واضح؛ فرفعُ الصوت لا يجعل الحقَّ أقوى.","شارك ألعابَك مع أصدقائك؛ فالمشاركةُ تزيد الفرحَ ولا تُنقصه.","استمع إلى القرآن بقلبٍ حاضرٍ حين يُتلى؛ ففي سماعه رحمةٌ وطمأنينة.","حتى في بيتك، استأذن قبل دخول غرفة والديك أو إخوتك؛ فالأدبُ يبدأ من البيت.","اشكر من أحسن إليك بقول: جزاك الله خيرًا؛ فمن لا يشكر الناسَ لا يشكر الله.","تبسُّمُك في وجه أخيك صدقة؛ فلا تبخل بابتسامتك على أحد.","ردُّ السلام فضلٌ عظيم؛ رُدَّه بأحسنَ منه أو بمثلِه، وبوجهٍ بشوش.","إن وعدتَ فأوفِ بوعدك؛ فالوفاءُ بالوعد علامةُ المؤمن الصادق.","صلِّ بخشوعٍ وحضور قلب، وتذكّر أنك تقف بين يدي الله؛ فالصلاةُ لقاءٌ جميل.","راجع دروسَك أولًا بأول، ولا تؤجِّل عملَ اليوم إلى الغد.","اغسل يديك قبل الطعام وبعده، وبعد اللعب؛ فالصحةُ نعمةٌ عظيمةٌ تستحق الشكر.","قبِّل يدَ والديك وادعُ لهما كلَّ يوم؛ فدعاؤهما لك بابٌ من أبواب التوفيق.","معلِّمُك بمنزلة والدك في التربية؛ فاحترمه واشكره وادعُ له بالخير.","شارك إخوتَك وأصدقاءَك طعامَك إن استطعت؛ فالطعامُ المشترك ألذُّ وأبرك.","إن لم يكن عندك كلامٌ نافع، فالصمتُ أجمل؛ قال رسول الله ﷺ: «من كان يؤمن بالله واليوم الآخر فليقل خيرًا أو ليصمت».","اختر صديقَك بعناية؛ فالصديقُ الصالح يُعينك على الخير ويُبعدك عن الشر.","احترم مصحفَك: ضعه في مكانٍ نظيفٍ مرتفع، ولا تضع فوقه شيئًا.","لا تنظر من ثقب الباب أو النافذة قبل أن تدخل؛ فاحترامُ خصوصية الناس من كمال الخُلق.","افرح لفرح غيرك وادعُ له بالبركة؛ فالقلبُ الذي يحب الخيرَ للناس قلبٌ عظيم.","إن رأيتَ صديقًا حزينًا، اجلس بجواره واسأله عن حاله؛ فالكلمةُ الحانية دواء.","إفشاءُ السلام بين الناس من أحبِّ الأعمال إلى الله؛ فكن سبّاقًا إليه دائمًا.","اعترف بخطئك بشجاعة إن أخطأت؛ فالاعتذارُ قوةٌ لا ضعف.","جهِّز سجادتَك ومصحفَك في مكانٍ تحبه؛ فالمكانُ الجميل يُعينك على العبادة.","اسأل معلِّمَك عما لا تفهمه ولا تخجل؛ فالسؤالُ مفتاحُ العلم.","حافظ على نظافة مدرستك وشارعك؛ فإماطةُ الأذى عن الطريق من أخلاق المؤمن.","استمع إلى نصيحة والديك بصدرٍ رحب؛ فهما أكثرُ من يحبُّك ويخاف عليك في الدنيا.","خاطب الكبيرَ بألفاظٍ مهذبة، ولا ترفع صوتَك فوق صوته أبدًا.","حين تدخل بيتك، قل: «بسم الله ولجنا، وبسم الله خرجنا، وعلى ربنا توكلنا»، ثم سلّم على أهلك.","حين تخرج من بيتك، قل: «بسم الله، توكلت على الله، ولا حول ولا قوة إلا بالله» — تُكفى وتُهدى وتُوقى.","قبل أن تأكل، سمِّ الله وقل: «بسم الله»؛ فإن نسيت في أوله فقل: «بسم الله في أوله وآخره».","بعد أن تفرغ من طعامك، قل: «الحمد لله الذي أطعمني هذا ورزقنيه من غير حول مني ولا قوة».","حين تدخل المسجد، قدّم رجلك اليمنى وقل: «اللهم افتح لي أبواب رحمتك».","حين تخرج من المسجد، قدّم رجلك اليسرى وقل: «اللهم إني أسألك من فضلك».","حين تستيقظ من نومك، قل: «الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور».","قبل أن تنام، قل: «باسمك اللهم أموت وأحيا»، ونم على وضوء إن استطعت.","حين تركب السيارة أو الحافلة، قل: «سبحان الذي سخّر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون».","إذا لبست ثوبًا جديدًا، فقل: «الحمد لله الذي كساني هذا ورزقنيه من غير حول مني ولا قوة».","بعد الوضوء، قل: «أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدًا عبده ورسوله» — تُفتح لك أبواب الجنة.","حين تسمع الأذان، ردّد مع المؤذن كلمة كلمة، ثم صلِّ على النبي ﷺ واسأل الله له الوسيلة.","قبل دخول الخلاء قل: «اللهم إني أعوذ بك من الخبث والخبائث»، وحين تخرج قل: «غفرانك».","حين ترى المطر ينزل، قل: «اللهم صيّبًا نافعًا»، وادعُ بما تحب؛ فالدعاء عند المطر مستجاب.","حين تقوم من مجلس، قل كفارة المجلس: «سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك».","إذا عطست فقل: «الحمد لله»، وإذا قال لك أخوك: «يرحمك الله»، فقل: «يهديكم الله ويصلح بالكم».","الصدق منجاة: من صدق نجا ولو بعد حين؛ فاجعل لسانك لا يعرف إلا الحق، وستجد أثره في قلبك وحياتك.","الكذب حبله قصير: كذبة واحدة تحتاج عشر كذبات لتغطيتها، وفي النهاية يخسر صاحبها ثقة الناس ورضا الله.","احترام الكبير بركة: من وقّر الكبير في صغره وقّره الناس في كبره؛ فقم للكبير، وقدّمه في المجلس، واستمع إليه بأدب.","اعطف على أخيك الصغير: خذ بيده وعلّمه برفق واصبر عليه؛ فأنت قدوته الأولى بعد والديك، وهو يقلّد ما تفعله.","الشيطان يسعى جاهدًا ليجعلك جاهلًا كسولًا؛ فإذا وسوس لك بترك الصلاة والمذاكرة فاستعذ بالله وقم إلى عملك — فالعلم والعمل أعداء الشيطان.","صلاتك نجاتك: من حافظ على الصلوات الخمس كانت له نورًا وبرهانًا ونجاة يوم القيامة؛ فلا تؤخّر صلاة عن وقتها أبدًا.","علاقتك بالله هي النجاة الحقيقية: كلما ضاقت بك الدنيا فافزع إلى الصلاة والدعاء؛ فباب الله لا يُغلق في وجه من طرقه.","لا تؤجّل عمل اليوم إلى الغد؛ فالتسويف لصّ الوقت. ابدأ الآن ولو بخطوة صغيرة، وستندهش مما تنجزه.","قبل أن تتكلم، اسأل نفسك ثلاثة أسئلة: هل كلامي حق؟ هل هو نافع؟ هل هو لطيف؟ فإن لم يكن كذلك فالصمت أجمل.","اجعل القرآن صاحبك لا ضيفك: صفحة واحدة كل يوم بعد الفجر تجعلك تختم وتتدبر، وخير الأعمال أدومها وإن قلّت.","احفظ سرّ أخيك كما تحفظ سرّك؛ فمن ستر مسلمًا ستره الله، والسر أمانة لا تُذاع ولو اختلفت مع صاحبه.","كن أول من يبدأ بالخير: بادر بالسلام، وبادر بالصلح إذا اختلفت مع صديق، وبادر بالمساعدة قبل أن تُطلب منك.","وقتك أمانة ستُسأل عنها: ساعة جدّ وساعة لعب باعتدال؛ فمن حفظ وقته في الصغر بنى مستقبله في الكبر.","ادعُ لأخيك بظهر الغيب؛ فحين تدعو له يقول الملك الموكّل بك: آمين، ولك بمثل ما دعوت.","ساعد أمك في أعمال البيت من نفسك قبل أن تطلب منك؛ فالبرّ الحقيقي أن تبادر لا أن تنتظر الطلب.","إذا غضبت فاسكت قليلًا وعدّ في سرّك إلى عشرة؛ فأكثر الكلام الذي نندم عليه قلناه ونحن غاضبون.","حافظ على أذكار الصباح والمساء؛ فهي حصنك من كل سوء، وبداية يومك ونهايته بذكر الله بركة.","التمس لأخيك عذرًا إذا رأيت منه ما لا يعجبك؛ فحسن الظن راحة لقلبك وحفظ لمحبتك للناس.","علّم صديقك شيئًا تعلمته اليوم؛ فزكاة العلم تعليمه، وما علّمته غيرك ثبت في ذهنك أكثر.","إذا وجدت قلمًا أو شيئًا ضائعًا من زميلك فسلّمه لمعلمك؛ فالأمانة أن يرجع الحق لصاحبه ولو كان صغيرًا.","زُر قريبًا مريضًا أو اتصل به واسأل عنه؛ فعيادة المريض تخفف عنه وتُدخل السرور على قلبه.","لا تُسرف في الماء وأنت تتوضأ أو تستحم؛ فالماء نعمة عظيمة، والنبي ﷺ كان يتوضأ بالقليل.","اغتنم وقت فراغك في حفظ سورة قصيرة أو مراجعة درس؛ فالدقائق الصغيرة تصنع إنجازات كبيرة.","اعتنِ بنظافة أسنانك بالفرشاة كل يوم؛ ففم نظيف وابتسامة جميلة من تمام النظافة التي يحبها الله.","لا تتكلم عن غائب بما يكره أن يسمعه؛ فالغيبة تأكل الحسنات كما تأكل النار الحطب.","اتصل بجدك وجدتك واسأل عن صحتهما وادعُ لهما؛ فصوتك يسعدهما أكثر مما تتصور.","ضع جنيهًا صغيرًا في حصالة صدقة كل أسبوع؛ فالصدقة ولو قليلة تطفئ غضب الرب وتزيد البركة.","إذا جاء زميل جديد إلى فصلك فكن أول من يرحب به ويعرّفه بالمكان؛ فالغريب يحتاج قلبًا قريبًا.","ابدأ كل عمل باسم الله: المذاكرة واللعب والأكل؛ فما بُدئ ببسم الله تمّت بركته.","ألقِ السلام على من تعرف ومن لا تعرف؛ فإفشاء السلام ينشر المحبة بين الناس.","استغفر الله كل يوم ولو عشر مرات بقلب حاضر؛ فالاستغفار يفتح أبواب الرزق ويفرّج الهموم.","اخفض صوتك في المسجد والمكتبة والأماكن الهادئة؛ فمراعاة مشاعر الآخرين من كمال الأدب.","اشكر الله كل صباح على نعم صغيرة: بصرك وسمعك وصحتك وأهلك؛ فمن شكر على القليل رزقه الله الكثير.","إذا لعبت مع أصدقائك فالعب بنزاهة: لا غش ولا ظلم؛ فالفوز الشريف وحده هو الذي يُفرح القلب.","رتّب حذاءك وأغراضك عند الباب؛ فالبيت المرتب يبدأ من عادات صغيرة مرتبة.","ادعُ لوالديك في سجودك؛ فأقرب ما يكون العبد من ربه وهو ساجد، ودعاؤك لهما من أعظم البر.","إذا رأيت عامل نظافة أو رجلًا يكدح في الشارع فسلّم عليه وادعُ له؛ فكل عمل شريف يستحق الاحترام.","نم مبكرًا بعد صلاة العشاء وقراءة ما تيسر من القرآن؛ فجسمك أمانة، والنوم الكافي يجعلك أقوى وأذكى في يومك."];

<script id="azhar-pro-js">
(function(){
"use strict";
document.addEventListener("keydown",function(e){
 if(!e.key)return;var tg=e.target;if(tg&&(tg.tagName==="INPUT"||tg.tagName==="SELECT"||tg.tagName==="TEXTAREA"))return;

function ageWord(a){if(!a)return"";return a===1?"سنة واحدة":a===2?"سنتان":a<=10?a+" سنين":a+" سنة"}
function greet(){
 try{
  if(typeof P==="undefined"||!P||!P.name)return;
  var app=document.getElementById("app");if(!app||app.querySelector("#azhi"))return;
  if(app.querySelector("#azparents"))return;
  var h1=app.querySelector("h1");if(!h1)return;
  var d=document.createElement("div");d.id="azhi";
  var age=P.age?(" · عمرك "+ageWord(P.age)):"";
  var goal=(P.set&&P.set.goal)?(" · هدفك اليوم "+P.set.goal+" أسئلة"):"";
  d.textContent="🌟 أهلًا بعودتك يا "+P.name+age+goal+" — هيا نكمل بطولاتك!";
  h1.parentNode.insertBefore(d,h1.nextSibling);
  var pb=document.createElement("button");pb.id="azpbtn";pb.className="btn gold";pb.style.cssText="width:100%;margin:6px 0 12px";
  pb.textContent="👨‍👩‍👧 ركن بابا وماما — سؤال للأهل ومساعدة لهم";
  pb.addEventListener("click",function(){window.__azParents()});
  d.parentNode.insertBefore(pb,d.nextSibling);
 }catch(e){}
}
var PQ=null;
function pqPick(){
 try{
  var pool=(window.RAW||[]).filter(function(r){return r&&r.choices&&r.choices.length>=3&&r.explanation&&["القرآن","التربية الإسلامية","العربي"].indexOf(r.subject)>=0});
  if(!pool.length)return null;
  var q=pool[Math.floor(Math.random()*pool.length)];
  var ch=q.choices.slice();for(var i=ch.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ch[i];ch[i]=ch[j];ch[j]=t}
  return {q:q.question,ch:ch,ans:q.answer,exp:q.explanation,subj:q.subject};
 }catch(e){return null}
}
window.__azParents=function(){
 try{
  if(typeof P==="undefined"||!P)return;
  if(!PQ)PQ=pqPick();
  var girl=(typeof CFG!=="undefined"&&CFG.girl)||P.gender==="g";
  var kid=P.name, son=girl?"بنتكم":"ابنكم", his=girl?"ليها":"له";
  var ageTip=!P.age?"":P.age<=8?"في هذه السن، اللعب القصير المتكرر أفضل من الجلسات الطويلة: جولة واحدة (١٠ أسئلة) في اليوم تكفي، واحتفلوا بكل تقدّم صغير.":P.age<=10?"في هذه السن، مدة التركيز تصل إلى ٢٠ دقيقة: جولة أو جولتان يوميًا، ودَعوه يشرح لكم إجابته بصوته — الشرح بصوت عالٍ يثبّت المعلومة.":"في هذه السن يبدأ الاستعداد للامتحانات: شجّعوه على حلّ جولة كاملة دون تلميحات، ومراجعة الشرح بعد كل خطأ — فالخطأ الذي يصحّحه بنفسه لا يتكرر.";
  var qhtml=PQ?('<div class="card"><h2>🧠 سؤال لبابا وماما</h2><p class="sync">من مادة '+PQ.subj+' — جاوبوا مع '+kid+' واتناقشوا في السبب:</p><div class="qtext">'+PQ.q+'</div><div id="azpq">'+PQ.ch.map(function(c,i){return '<button class="choice" data-azpq="'+i+'"><span>'+c+'</span></button>'}).join("")+'</div><div id="azpfb"></div><button class="btn small ghost" id="azpnew">🔄 سؤال جديد للأهل</button></div>'):'';
  var h='<div id="azparents"><h1>👨‍👩‍👧 ركن بابا وماما</h1>'
   +'<p class="card">أهلًا بيكم! الركن ده معمول عشان تساعدوا '+kid+' يستمتع ويتعلم. '+his+' في كل مادة <b>١٠ تلميحات</b> بس — التلميح بيشيل اختيارات غلط وبيخصم ٥ نقط، وبيكسب تلميحات جديدة لما يكسب جولات في المادة.</p>'
   +qhtml
   +'<div class="card"><h2>🤝 كيف تساعدون '+son+'؟</h2><p>'+ageTip+'</p><p>· اسألوه كل يوم: «ماذا تعلّمتَ اليوم؟» ودَعوه يعلّمكم هو — أفضل تثبيت للمعلومة أن يشرحها بنفسه.<br>· اطّلعوا على تقريره من زرّ «تقريري» في اللعبة، وقارنوا تقدّمه أسبوعًا بأسبوع، وامدحوا الجهد لا الدرجة فقط.<br>· إذا واجه سؤالًا صعبًا، دعوه يستخدم تلميحًا أولًا قبل أن تخبروه بالإجابة.</p></div>'
   +'<div class="card"><h2>💬 أسئلة تفتح الكلام بعد اللعب</h2><p>· إيه أكتر سؤال عجبك النهاردة وليه؟<br>· إيه السؤال اللي غلطت فيه واتعلمت منه إيه؟<br>· لو هتعمل سؤال لبابا وماما، هيكون عن إيه؟<br>· إيه المادة اللي عايز تكسب فيها تلميحات زيادة؟</p></div>'
   +'<button class="btn" data-a="home">🏠 رجوع للعبة '+kid+'</button></div>';
  render(h);
  var nb=document.getElementById("azpnew");if(nb)nb.addEventListener("click",function(){PQ=pqPick();window.__azParents()});
  var box=document.getElementById("azpq");
  if(box)box.addEventListener("click",function(e){var b=e.target.closest("[data-azpq]");if(!b||!PQ)return;var pick=PQ.ch[+b.getAttribute("data-azpq")];var fb=document.getElementById("azpfb");
   if(pick===PQ.ans){b.classList.add("ok");fb.innerHTML='<div class="warn" style="background:#e8f5e9">🎉 إجابة صح! '+PQ.exp+'<br>اتكلموا مع '+kid+': ليه دي الإجابة الصح؟</div>'}
   else{b.classList.add("bad");fb.innerHTML='<div class="warn">قربتوا! الإجابة الصح: <b>'+PQ.ans+'</b><br>'+PQ.exp+'</div>'}});
 }catch(e){}
};
