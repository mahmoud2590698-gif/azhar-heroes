, "type": "normal", "topic": "البيئات والزراعة والصناعة"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-20", "question": "يعد ...... من هيئات الحكم العثماني في مصر ومقره القلعة.", "choices": ["الوالي", "الديوان", "الحامية العثمانية", "المماليك"], "answer": "الديوان", "answerIndex": 1, "explanation": "الديوان من هيئات الحكم العثماني في مصر، وكان مقره القلعة ويشرف على شؤون البلاد.", "type": "normal", "topic": "الحكم العثماني"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-21", "question": "من أشهر مصايد الأسماك ......", "choices": ["نهر النيل", "فرعا دمياط ورشيد", "الترع والبحيرات", "كل ما سبق"], "answer": "كل ما سبق", "answerIndex": 3, "explanation": "من أشهر مصايد الأسماك في مصر: بحيرة المنزلة والبرلس والبحر الأحمر والبحر المتوسط، فالإجابة: كل ما سبق.", "type": "normal", "topic": "البيئات والزراعة والصناعة"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-22", "question": "تولى محمد علي حكم مصر عام 1805م بعد عزل ......", "choices": ["إبراهيم", "طاهر", "خورشيد", "خسرو"], "answer": "خورشيد", "answerIndex": 2, "explanation": "تولى محمد علي حكم مصر عام 1805م بعد عزل الوالي خورشيد باشا واختيار العلماء والأعيان له.", "type": "normal", "topic": "محمد علي وأسرته"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-23", "question": "يمكن أن نجد البيئة الزراعية داخل البيئة الصحراوية.", "choices": ["صح", "خطأ"], "answer": "صح", "answerIndex": 0, "explanation": "صحيحة: يمكن أن توجد بيئة زراعية داخل البيئة الصحراوية حول الآبار والعيون في الواحات.", "type": "normal", "topic": "البيئات والزراعة والصناعة"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-24", "question": "أصبحت القسطنطينية عاصمة الإمبراطورية العثمانية في عهد محمد الفاتح.", "choices": ["صح", "خطأ"], "answer": "صح", "answerIndex": 0, "explanation": "صحيحة: أصبحت القسطنطينية عاصمة للدولة العثمانية بعد فتحها على يد السلطان محمد الفاتح عام 1453م.", "type": "normal", "topic": "الحكم العثماني"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-25", "question": "نجحت الحملة الفرنسية في جعل مصر قاعدة للإمبراطورية الفرنسية في الشرق.", "choices": ["صح", "خطأ"], "answer": "خطأ", "answerIndex": 1, "explanation": "خطأ: فشلت الحملة الفرنسية في جعل مصر قاعدة لإمبراطورية فرنسية في الشرق وخرجت منها عام 1801م.", "type": "normal", "topic": "الحملة الفرنسية"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-26", "question": "الانفتاح على العالم الخارجي يشجع على الاستثمار في مجال الصناعة.", "choices": ["صح", "خطأ"], "answer": "صح", "answerIndex": 0, "explanation": "صحيحة: الانفتاح على العالم الخارجي يجذب الاستثمارات ويشجع قيام الصناعات الحديثة.", "type": "normal", "topic": "البيئات والزراعة والصناعة"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-27", "question": "يعد السد العالي من أهم مشروعات الري التي اهتم بها محمد علي.", "choices": ["صح", "خطأ"], "answer": "خطأ", "answerIndex": 1, "explanation": "خطأ: السد العالي مشروع حديث بُني في عهد الرئيس جمال عبد الناصر، أما محمد علي فاهتم بالقناطر والترع.", "type": "normal", "topic": "محمد علي وأسرته"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-28", "question": "تقوم الزراعة المطرية على مياه الأمطار ......", "choices": ["الدائمة", "الصيفية", "الشتوية"], "answer": "الشتوية", "answerIndex": 2, "explanation": "الزراعة المطرية تعتمد على الأمطار الشتوية، وتقوم على سواحل البحر المتوسط وشمال سيناء.", "type": "normal", "topic": "جغرافيا الوطن العربي"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-29", "question": "توجد بمحافظة ...... مناطق آثار وحضارة (تل بسطة).", "choices": ["الشرقية", "الأقصر", "الفيوم"], "answer": "الشرقية", "answerIndex": 0, "explanation": "تل بسطة من أشهر المناطق الأثرية بمحافظة الشرقية، وكانت عاصمة لمصر في عصر الأسرة الثانية والعشرين.", "type": "normal", "topic": "البيئات المصرية والآثار"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-30", "question": "تمكن قائد الأسطول الإنجليزي من تدمير الأسطول الفرنسي في موقعة أبي قير البحرية وهو ......", "choices": ["ديبوي", "نلسون", "مينو"], "answer": "نلسون", "answerIndex": 1, "explanation": "الأميرال نلسون قائد الأسطول الإنجليزي دمّر الأسطول الفرنسي في موقعة أبي قير البحرية عام 1798م.", "type": "normal", "topic": "الحملة الفرنسية"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-31", "question": "تولى الخديو ...... حكم مصر عام 1863م.", "choices": ["عباس", "سعيد", "إسماعيل"], "answer": "إسماعيل", "answerIndex": 2, "explanation": "تولى الخديو إسماعيل حكم مصر عام 1863م بعد سعيد باشا، وفي عهده افتُتحت قناة السويس.", "type": "normal", "topic": "محمد علي وأسرته"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-32", "question": "توجد فاصلة حدود بين البيئات المصرية.", "choices": ["صح", "خطأ"], "answer": "خطأ", "answerIndex": 1, "explanation": "خطأ: لا توجد فواصل حدودية قاطعة بين البيئات المصرية؛ فهي متداخلة ومتكاملة يؤثر بعضها في بعض.", "type": "normal", "topic": "البيئات والزراعة والصناعة"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-33", "question": "قام السلطان سليم الأول بترحيل أمهر الصناع والحرفيين إلى الآستانة.", "choices": ["صح", "خطأ"], "answer": "صح", "answerIndex": 0, "explanation": "صحيحة: بعد فتح مصر رحّل السلطان سليم الأول أمهر الصناع والحرفيين المصريين إلى الآستانة (إسطنبول).", "type": "normal", "topic": "الحكم العثماني"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-34", "question": "الصناعة تؤدي إلى ارتفاع المستوى الاجتماعي والتعليمي والثقافي لسكان مصر.", "choices": ["صح", "خطأ"], "answer": "صح", "answerIndex": 0, "explanation": "صحيحة: الصناعة توفر فرص عمل وترفع المستوى الاجتماعي والتعليمي والثقافي للسكان.", "type": "normal", "topic": "البيئات والزراعة والصناعة"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "b4-35", "question": "استولت الحملة الفرنسية على جزيرة كريت ثم مالطة.", "choices": ["صح", "خطأ"], "answer": "خطأ", "answerIndex": 1, "explanation": "خطأ: الحملة الفرنسية استولت على مالطة فقط في طريقها، ولم تستولِ على جزيرة كريت.", "type": "normal", "topic": "الحملة الفرنسية"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-36", "question": "Choose: Who ______ the telephone?", "choices": ["discovered", "invented", "know"], "answer": "invented", "answerIndex": 1, "explanation": "نستخدم invented لأن السؤال عن مخترع التليفون في الماضي، والفعل المناسب: Who invented the telephone?", "type": "normal", "topic": "القواعد (اختر الأنسب)"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-37", "question": "Choose: How ______ bread did you have?", "choices": ["much", "many", "often"], "answer": "much", "answerIndex": 0, "explanation": "كلمة bread اسم لا يُعد، فيُسأل عن كميته بـ How much وليس How many.", "type": "normal", "topic": "القراءة"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-38", "question": "Choose: She will ______ the laundry.", "choices": ["make", "have", "do"], "answer": "do", "answerIndex": 2, "explanation": "غسيل الملابس يعبر عنه بـ do the laundry، ومع will نستخدم الفعل في صورته الأساسية do.", "type": "normal", "topic": "القواعد (اختر الأنسب)"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-39", "question": "Choose: The famous actor ______ some autographs.", "choices": ["signed", "talked", "heard"], "answer": "signed", "answerIndex": 0, "explanation": "الممثل وقّع التذكارات في الماضي، فالفعل المناسب signed.", "type": "normal", "topic": "القواعد (اختر الأنسب)"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-40", "question": "Choose: What are your hours?", "choices": ["We are open 8 to 5.", "We are open daily."], "answer": "We are open 8 to 5.", "answerIndex": 0, "explanation": "السؤال عن مواعيد العمل، والإجابة الصحيحة: We are open 8 to 5 (نعمل من الثامنة إلى الخامسة).", "type": "normal", "topic": "الحوار والعبارات"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-41", "question": "Choose the answer: How many brothers do you have?", "choices": ["A boy and a girl.", "Three."], "answer": "Three.", "answerIndex": 1, "explanation": "السؤال How many brothers...؟ إجابته عدد: Three (ثلاثة إخوة).", "type": "normal", "topic": "الحوار والعبارات"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-42", "question": "Choose the odd word: lorry - car - ship - taxi", "choices": ["lorry", "car", "ship", "taxi"], "answer": "ship", "answerIndex": 2, "explanation": "lorry وcar وtaxi وسائل نقل برية، أما ship فوسيلة نقل بحرية، فهي الكلمة الشاذة.", "type": "normal", "topic": "المفردات والكلمة الشاذة"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-43", "question": "Choose the odd word: pilot - patient - dentist - doctor", "choices": ["pilot", "patient", "dentist", "doctor"], "answer": "patient", "answerIndex": 1, "explanation": "pilot وdentist وdoctor مهن يقدم أصحابها خدمة، أما patient فهو المريض متلقي الخدمة، فهو الشاذ.", "type": "normal", "topic": "المفردات والكلمة الشاذة"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-44", "question": "Huda went to the supermarket for her father. She walked to the supermarket. She forgot the grocery list... Huda went to the supermarket ______.", "choices": ["by bus", "by taxi", "on foot"], "answer": "on foot", "answerIndex": 2, "explanation": "هدى ذهبت إلى السوبر ماركت ماشية، ومعنى walked هو on foot (سيرًا على الأقدام).", "type": "normal", "topic": "القراءة"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-45", "question": "Same text: Huda forgot the ______.", "choices": ["list", "money", "basket"], "answer": "list", "answerIndex": 0, "explanation": "من سياق القصة: هدى نسيت قائمة المشتريات، وكلمة list تعني القائمة.", "type": "normal", "topic": "القراءة"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-46", "question": "Rearrange: bridge - a library - There - near - the - was", "choices": ["There was a library near the bridge.", "The bridge was near a library there."], "answer": "There was a library near the bridge.", "answerIndex": 0, "explanation": "بترتيب الكلمات نحصل على جملة صحيحة: There was a library near the bridge (كان يوجد مكتبة قرب الكوبري).", "type": "normal", "topic": "ترتيب الكلمات"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-47", "question": "Rearrange: soup - salad - I'll - and - have", "choices": ["I'll have soup and salad.", "Salad I'll and have soup."], "answer": "I'll have soup and salad.", "answerIndex": 0, "explanation": "الترتيب الصحيح: I'll have soup and salad (سأتناول شوربة وسلطة).", "type": "normal", "topic": "ترتيب الكلمات"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-48", "question": "Rearrange: a haircut - How - get - you - do - often ?", "choices": ["How often do you get a haircut?", "How do you often get a haircut?"], "answer": "How often do you get a haircut?", "answerIndex": 0, "explanation": "سؤال عن عدد المرات بأداة How often: How often do you get a haircut?", "type": "normal", "topic": "ترتيب الكلمات"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "b4-49", "question": "Rearrange: He - school - himself - to - walked - by", "choices": ["He walked to school by himself.", "By himself he school walked to."], "answer": "He walked to school by himself.", "answerIndex": 0, "explanation": "الترتيب الصحيح: He walked to school by himself (ذهب إلى المدرسة ماشيًا بمفرده).", "type": "normal", "topic": "ترتيب الكلمات"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-50", "question": "لتحديد الطابعة الافتراضية نختار الأمر ......", "choices": ["Print test page", "Set as Default Printer", "open"], "answer": "Set as Default Printer", "answerIndex": 1, "explanation": "لجعل طابعة هي الافتراضية نختار الأمر Set as Default Printer من إعدادات الطابعات.", "type": "normal", "topic": "إعدادات الويندوز والطباعة"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-51", "question": "تبويب ...... يستخدم لجعل نمط الأرقام موجبة أو سالبة.", "choices": ["Currency", "Numbers", "Date"], "answer": "Numbers", "answerIndex": 1, "explanation": "تبويب Numbers في الإعدادات الإقليمية يتحكم في نمط عرض الأرقام موجبة أو سالبة.", "type": "normal", "topic": "الإنترنت والاتصال"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-52", "question": "يمكنك تغيير نمط عرض الوقت من خلال تبويب ......", "choices": ["Time", "Date", "Currency"], "answer": "Time", "answerIndex": 0, "explanation": "نمط عرض الوقت يُغيَّر من تبويب Time في إعدادات المنطقة واللغة.", "type": "normal", "topic": "الإنترنت والاتصال"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-53", "question": "لإغلاق كل الأصوات الصادرة من الكمبيوتر نضغط ......", "choices": ["Mute all", "Low", "Speaker icon"], "answer": "Mute all", "answerIndex": 0, "explanation": "الأمر Mute all يكتم جميع الأصوات الصادرة من الكمبيوتر.", "type": "normal", "topic": "أساسيات الحاسوب وبرامجه"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-54", "question": "الشبكة العالمية هي شبكة ذات نطاق واسع، وتسمى ......", "choices": ["Virus", "WAN", "LAN"], "answer": "WAN", "answerIndex": 1, "explanation": "الشبكة العالمية واسعة النطاق تسمى WAN اختصارًا لـ Wide Area Network.", "type": "normal", "topic": "الشبكات"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-55", "question": "من طرق حماية الكمبيوتر من الفيروسات تحميل البرامج المضادة للفيروسات على الكمبيوتر.", "choices": ["صح", "خطأ"], "answer": "صح", "answerIndex": 0, "explanation": "صحيحة: من أهم طرق حماية الكمبيوتر من الفيروسات تثبيت برامج مضادة للفيروسات وتحديثها.", "type": "normal", "topic": "أساسيات الحاسوب وبرامجه"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-56", "question": "الطابعة إحدى وحدات إخراج البيانات.", "choices": ["صح", "خطأ"], "answer": "صح", "answerIndex": 0, "explanation": "صحيحة: الطابعة وحدة إخراج؛ تطبع البيانات والمعلومات على الورق.", "type": "normal", "topic": "إعدادات الويندوز والطباعة"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-57", "question": "يطلق على من يقومون بسرقة المعلومات اسم ......", "choices": ["Hackers", "Date", "فيروسات"], "answer": "Hackers", "answerIndex": 0, "explanation": "يُطلق على من يسرقون المعلومات ويخترقون الأجهزة اسم Hackers (المخترقون).", "type": "normal", "topic": "أمان المعلومات وحقوق الملكية"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-58", "question": "لتبادل البيانات بين أجهزة الكمبيوتر يلزم وجود ...... بينها.", "choices": ["اتصال", "الطابعة", "الفيروسات"], "answer": "اتصال", "answerIndex": 0, "explanation": "تبادل البيانات بين أجهزة الكمبيوتر يتطلب وجود اتصال يربط بينها سلكيًا أو لاسلكيًا.", "type": "normal", "topic": "أساسيات الحاسوب وبرامجه"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-59", "question": "لكل موقع ويب محرك بحث خاص به.", "choices": ["صح", "خطأ"], "answer": "خطأ", "answerIndex": 1, "explanation": "خطأ: محركات البحث عامة مثل Google تبحث في مواقع الويب كلها، وليس لكل موقع محرك بحث خاص به.", "type": "normal", "topic": "الإنترنت والاتصال"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-60", "question": "من خدمات الإنترنت البحث عن المعلومات.", "choices": ["صح", "خطأ"], "answer": "صح", "answerIndex": 0, "explanation": "صحيحة: البحث عن المعلومات من أهم خدمات الإنترنت وأكثرها استخدامًا.", "type": "normal", "topic": "الإنترنت والاتصال"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-61", "question": "LAN هي شبكة محلية بين أجهزة في حيز محدود.", "choices": ["صح", "خطأ"], "answer": "صح", "answerIndex": 0, "explanation": "صحيحة: LAN شبكة محلية تربط أجهزة في حيز محدود مثل مبنى المدرسة أو الشركة.", "type": "normal", "topic": "الشبكات"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-62", "question": "الإعلان والدعاية (Advertising) من خدمات الإنترنت.", "choices": ["صح", "خطأ"], "answer": "صح", "answerIndex": 0, "explanation": "صحيحة: الإعلان والدعاية Advertising من الخدمات الشائعة عبر الإنترنت.", "type": "normal", "topic": "الإنترنت والاتصال"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-63", "question": "تستخدم أيقونة الإعدادات الإقليمية للتحكم في إعدادات سطح المكتب.", "choices": ["صح", "خطأ"], "answer": "خطأ", "answerIndex": 1, "explanation": "خطأ: أيقونة الإعدادات الإقليمية تتحكم في اللغة والأرقام والوقت والتاريخ، وليس في إعدادات سطح المكتب.", "type": "normal", "topic": "إعدادات الويندوز والطباعة"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-64", "question": "خدمة البريد الإلكتروني E-Mail تستخدم في ......", "choices": ["تبادل الرسائل عبر الإنترنت", "تصفح الإنترنت", "تغيير نمط الأرقام"], "answer": "تبادل الرسائل عبر الإنترنت", "answerIndex": 0, "explanation": "خدمة البريد الإلكتروني E-Mail تستخدم في تبادل الرسائل والملفات عبر الإنترنت.", "type": "normal", "topic": "الإنترنت والاتصال"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-65", "question": "Google هو ......", "choices": ["من أشهر محركات البحث في العالم", "برنامج له القدرة على التكاثر", "من التبويب Currency"], "answer": "من أشهر محركات البحث في العالم", "answerIndex": 0, "explanation": "Google من أشهر محركات البحث في العالم وأكثرها استخدامًا.", "type": "normal", "topic": "الإنترنت والاتصال"}, {"grade": 6, "subject": "تكنولوجيا المعلومات", "id": "b4-66", "question": "خدمة Chat تمكنك من ......", "choices": ["الاتصال بالآخرين عبر الإنترنت", "تصفح الإنترنت", "البحث عن موقع"], "answer": "الاتصال بالآخرين عبر الإنترنت", "answerIndex": 0, "explanation": "خدمة Chat (المحادثة) تمكنك من الاتصال بالآخرين والتواصل معهم عبر الإنترنت.", "type": "normal", "topic": "الإنترنت والاتصال"}, {"grade": 6, "subject": "العلوم", "id": "b4-67", "question": "اتباع نظام غذائي يحتوي على كمية كبيرة من البطاطس المقلية والمشروبات الغازية يضر كثيرا بعملية النمو.", "choices": ["صح", "خطأ"], "answer": "صح", "answerIndex": 0, "explanation": "صحيحة: الإكثار من البطاطس المقلية والمشروبات الغازية يضر بالنمو الصحي لأنه غذاء غير متوازن غني بالدهون والسكريات.", "type": "normal", "topic": "أجهزة الجسم"}, {"grade": 6, "subject": "العلوم", "id": "b4-68", "question": "تعمل التربة الطينية على تصريف الماء بنسبة أكبر من التربة الرملية.", "choices": ["صح", "خطأ"], "answer": "خطأ", "answerIndex": 1, "explanation": "خطأ: التربة الطينية بطيئة تصريف الماء وتحتفظ به، أما التربة الرملية فتصرف الماء بسرعة أكبر.", "type": "normal", "topic": "التربة"}, {"grade": 6, "subject": "العلوم", "id": "b4-69", "question": "يعتبر الهواء والماء والصخور من المكونات اللاحيوية.", "choices": ["صح", "خطأ"], "answer": "صح", "answerIndex": 0, "explanation": "صحيحة: الهواء والماء والصخور مكونات لا حيوية في النظام البيئي، لكنها ضرورية لحياة الكائنات الحية.", "type": "normal", "topic": "التربة"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-1", "question": "الإيمان باليوم الآخر ركن من أركان ......", "choices": ["الإسلام", "الإيمان", "الصلاة", "الزكاة"], "answer": "الإيمان", "answerIndex": 1, "explanation": "أركان الإيمان ستة، منها الإيمان باليوم الآخر: يوم القيامة وما فيه من بعث وحساب وجزاء.", "type": "normal", "topic": "العقيدة: الإيمان باليوم الآخر"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-2", "question": "معنى البعث والنشور هو ......", "choices": ["إحياء الموتى يوم القيامة للحساب", "هجرة المسلمين", "نزول الوحي", "بناء المساجد"], "answer": "إحياء الموتى يوم القيامة للحساب", "answerIndex": 0, "explanation": "البعث والنشور: إخراج الله الموتى من قبورهم أحياء يوم القيامة ليُحاسَبوا على أعمالهم ويُجازَوا عليها.", "type": "normal", "topic": "العقيدة: البعث والنشور"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-3", "question": "في يوم القيامة يأخذ كل إنسان كتاب أعماله؛ فمن أوتي كتابه بيمينه كان من ......", "choices": ["الخاسرين", "الفائزين المسرورين", "المترددين", "الغافلين"], "answer": "الفائزين المسرورين", "answerIndex": 1, "explanation": "قال تعالى: ﴿فأما من أوتي كتابه بيمينه فسوف يحاسب حسابًا يسيرًا وينقلب إلى أهله مسرورًا﴾.", "type": "normal", "topic": "العقيدة: الحساب والجزاء"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-4", "question": "حروف الإدغام مجموعة في كلمة ......", "choices": ["ينمو", "يرملون", "قطب جد", "أهعحغخ"], "answer": "يرملون", "answerIndex": 1, "explanation": "حروف الإدغام ستة مجموعة في «يرملون»: الياء والراء والميم واللام والواو والنون؛ فإذا جاءت النون الساكنة أو التنوين قبل أحدها أُدغمت فيه.", "type": "normal", "topic": "التجويد: الإدغام"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-5", "question": "الإدغام بغنة يكون مع حروف كلمة ......", "choices": ["يرملون", "ينمو", "رل", "قطب"], "answer": "ينمو", "answerIndex": 1, "explanation": "الإدغام بغنة مع حروف «ينمو» (الياء والنون والميم والواو)، وبغير غنة مع اللام والراء.", "type": "normal", "topic": "التجويد: الإدغام"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-6", "question": "معنى الإخفاء في التجويد هو ......", "choices": ["نطق النون واضحة تمامًا", "النطق بالنون بصوت بين الإظهار والإدغام مع الغنة", "حذف النون نهائيًا", "قلب النون ميمًا"], "answer": "النطق بالنون بصوت بين الإظهار والإدغام مع الغنة", "answerIndex": 1, "explanation": "الإخفاء حالة وسطى: لا إظهار كامل ولا إدغام كامل، مع بقاء الغنة، ويكون عند باقي حروف الهجاء غير حروف الإظهار والإدغام والإقلاب.", "type": "normal", "topic": "التجويد: الإخفاء"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-7", "question": "عدد أحكام الميم الساكنة ......", "choices": ["حكمان", "ثلاثة أحكام", "أربعة أحكام", "خمسة أحكام"], "answer": "ثلاثة أحكام", "answerIndex": 1, "explanation": "للميم الساكنة ثلاثة أحكام: الإخفاء الشفوي (عند الباء)، والإدغام الشفوي (عند الميم)، والإظهار الشفوي (عند باقي الحروف).", "type": "normal", "topic": "التجويد: الميم الساكنة"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-8", "question": "الركن الأعظم في الحج الذي قال عنه النبي ﷺ: «الحج عرفة» هو ......", "choices": ["طواف الوداع", "الوقوف بعرفة", "رمي الجمار", "الحلق"], "answer": "الوقوف بعرفة", "answerIndex": 1, "explanation": "الوقوف بعرفة في اليوم التاسع من ذي الحجة هو الركن الأعظم للحج، ومن فاته الوقوف فقد فاته الحج.", "type": "normal", "topic": "العبادات: الحج"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-9", "question": "السعي في الحج يكون بين جبلي ......", "choices": ["النور وثور", "الصفا والمروة", "أحد والرماة", "عرفات ومزدلفة"], "answer": "الصفا والمروة", "answerIndex": 1, "explanation": "يسعى الحاج سبعة أشواط بين الصفا والمروة تذكارًا لبحث السيدة هاجر عن الماء لابنها إسماعيل عليه السلام.", "type": "normal", "topic": "العبادات: الحج"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-10", "question": "يكون يوم عرفة في اليوم ...... من شهر ذي الحجة.", "choices": ["الأول", "التاسع", "العاشر", "الأخير"], "answer": "التاسع", "answerIndex": 1, "explanation": "يوم عرفة هو التاسع من ذي الحجة، ويليه عيد الأضحى في العاشر منه.", "type": "normal", "topic": "العبادات: الحج"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-11", "question": "الصحابي الجليل أبو هريرة رضي الله عنه اشتهر بـ ......", "choices": ["قيادة الجيوش", "كثرة رواية الحديث عن النبي ﷺ", "كتابة المصحف", "التجارة في الشام"], "answer": "كثرة رواية الحديث عن النبي ﷺ", "answerIndex": 1, "explanation": "أبو هريرة (واسمه عبد الرحمن بن صخر الدوسي) أكثر الصحابة رواية للحديث؛ لازم النبي ﷺ وحفظ عنه علمًا كثيرًا.", "type": "normal", "topic": "السير والشخصيات: أبو هريرة"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-12", "question": "الإمام أبو حنيفة النعمان هو مؤسس المذهب ......", "choices": ["المالكي", "الحنفي", "الشافعي", "الحنبلي"], "answer": "الحنفي", "answerIndex": 1, "explanation": "الإمام أبو حنيفة النعمان بن ثابت إمام أهل الرأي في الكوفة بالعراق، ومؤسس المذهب الحنفي أحد المذاهب الفقهية الأربعة.", "type": "normal", "topic": "السير والشخصيات: الأئمة"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-13", "question": "الإمام مالك بن أنس صاحب كتاب «الموطأ» عاش في ......", "choices": ["بغداد", "المدينة المنورة", "القاهرة", "دمشق"], "answer": "المدينة المنورة", "answerIndex": 1, "explanation": "الإمام مالك إمام دار الهجرة؛ عاش في المدينة المنورة ودرّس في المسجد النبوي، وكتابه «الموطأ» من أقدم كتب الحديث والفقه.", "type": "normal", "topic": "السير والشخصيات: الأئمة"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-14", "question": "وقعت غزوة حنين بعد ...... مباشرة في العام الثامن الهجري.", "choices": ["غزوة بدر", "فتح مكة", "صلح الحديبية", "غزوة الخندق"], "answer": "فتح مكة", "answerIndex": 1, "explanation": "بعد فتح مكة خرجت هوازن وثقيف لقتال المسلمين في وادي حنين، فثبت النبي ﷺ وأصحابه ونصرهم الله.", "type": "normal", "topic": "السيرة: غزوة حنين"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-15", "question": "آخر غزوة خرج فيها النبي ﷺ بنفسه هي غزوة ......", "choices": ["بدر", "أحد", "تبوك", "حنين"], "answer": "تبوك", "answerIndex": 2, "explanation": "غزوة تبوك (9هـ) آخر الغزوات النبوية، وكانت في مواجهة الروم عند حدود الشام، وسُمي جيشها جيش العُسرة.", "type": "normal", "topic": "السيرة: غزوة تبوك"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "n26-g6-16", "question": "علّمنا الإسلام الرفق بالحيوان، ومن صوره ......", "choices": ["تحميله فوق طاقته", "إطعامه وسقيه وعدم إيذائه", "حبسه دون طعام", "ضربه عند العمل"], "answer": "إطعامه وسقيه وعدم إيذائه", "answerIndex": 1, "explanation": "دخل رجل الجنة في كلب سقاه، والرفق بالحيوان من أخلاق المسلم التي يثاب عليها.", "type": "normal", "topic": "القيم: الرفق بالحيوان"}, {"grade": 6, "subject": "العربي", "id": "n26-g6-17", "question": "أي كلمة مما يلي من الأسماء الخمسة؟", "choices": ["كتاب", "أبوك", "قلم", "مدرسة"], "answer": "أبوك", "answerIndex": 1, "explanation": "الأسماء الخمسة: أبوك وأخوك وحموك وفوك وذو مال، وتُعرب بالحروف نيابة عن الحركات بشروطها.", "type": "normal", "topic": "الأسماء الخمسة"}, {"grade": 6, "subject": "العربي", "id": "n26-g6-18", "question": "في جملة «جاء أبوك» إعراب «أبوك» فاعل مرفوع وعلامة رفعه ......", "choices": ["الضمة", "الواو", "الألف", "الفتحة"], "answer": "الواو", "answerIndex": 1, "explanation": "الأسماء الخمسة تُرفع بالواو (أبوك)، وتُنصب بالألف (أباك)، وتُجر بالياء (أبيك) إذا أُضيفت إلى غير ياء المتكلم.", "type": "normal", "topic": "الأسماء الخمسة"}, {"grade": 6, "subject": "العربي", "id": "n26-g6-19", "question": "في جملة «رأيت أخاك» كلمة «أخاك» منصوبة وعلامة نصبها ......", "choices": ["الفتحة", "الألف", "الياء", "الكسرة"], "answer": "الألف", "answerIndex": 1, "explanation": "«أخاك» مفعول به من الأسماء الخمسة، فيُنصب بالألف نيابة عن الفتحة.", "type": "normal", "topic": "الأسماء الخمسة"}, {"grade": 6, "subject": "العربي", "id": "n26-g6-20", "question": "نوع الخبر في جملة «العلمُ نورٌ» هو خبر ......", "choices": ["جملة اسمية", "جملة فعلية", "مفرد", "شبه جملة"], "answer": "مفرد", "answerIndex": 2, "explanation": "الخبر المفرد هو ما كان كلمة واحدة (ليس جملة ولا شبه جملة)، و«نورٌ» كلمة واحدة فهو خبر مفرد.", "type": "normal", "topic": "أنواع الخبر"}, {"grade": 6, "subject": "العربي", "id": "n26-g6-21", "question": "نوع الخبر في جملة «الطالبُ يجتهدُ في دروسه» هو خبر ......", "choices": ["مفرد", "جملة فعلية", "شبه جملة", "مضاف"], "answer": "جملة فعلية", "answerIndex": 1, "explanation": "الخبر هنا جملة «يجتهد في دروسه» وهي جملة فعلية فعلها مضارع، وتشتمل على ضمير يعود على المبتدأ.", "type": "normal", "topic": "أنواع الخبر"}, {"grade": 6, "subject": "العربي", "id": "n26-g6-22", "question": "نوع الخبر في جملة «الكتابُ على المكتبِ» هو خبر ......", "choices": ["مفرد", "جملة اسمية", "شبه جملة", "جملة فعلية"], "answer": "شبه جملة", "answerIndex": 2, "explanation": "«على المكتب» جار ومجرور، وهو شبه جملة وقع خبرًا عن المبتدأ «الكتاب».", "type": "normal", "topic": "أنواع الخبر"}, {"grade": 6, "subject": "العربي", "id": "n26-g6-23", "question": "تدخل «كان» على الجملة الاسمية فـ ......", "choices": ["ترفع الاسم وتنصب الخبر", "تنصب الاسم وترفع الخبر", "تجزم الفعل", "لا تغير شيئًا"], "answer": "ترفع الاسم وتنصب الخبر", "answerIndex": 0, "explanation": "كان وأخواتها أفعال ناسخة: ترفع المبتدأ ويسمى اسمها، وتنصب الخبر ويسمى خبرها، مثل: كان الجوُّ صافيًا.", "type": "normal", "topic": "كان وأخواتها"}, {"grade": 6, "subject": "العربي", "id": "n26-g6-24", "question": "ما خبر كان في جملة «أصبحَ الزرعُ أخضرَ»؟", "choices": ["أصبحَ", "الزرعُ", "أخضرَ", "لا يوجد خبر"], "answer": "أخضرَ", "answerIndex": 2, "explanation": "«الزرعُ» اسم أصبح مرفوع، و«أخضرَ» خبرها منصوب وعلامة نصبه الفتحة.", "type": "normal", "topic": "كان وأخواتها"}, {"grade": 6, "subject": "العربي", "id": "n26-g6-25", "question": "تدخل «إنّ» على الجملة الاسمية فـ ......", "choices": ["ترفع الاسم وتنصب الخبر", "تنصب الاسم وترفع الخبر", "تحذف الخبر", "تجعلها جملة فعلية"], "answer": "تنصب الاسم وترفع الخبر", "answerIndex": 1, "explanation": "إنّ وأخواتها حروف ناسخة: تنصب المبتدأ ويسمى اسمها، وترفع الخبر ويسمى خبرها، مثل: إنَّ العلمَ نافعٌ.", "type": "normal", "topic": "إن وأخواتها"}, {"grade": 6, "subject": "العربي", "id": "n26-g6-26", "question": "في جملة «إنَّ المعلمَ مخلصٌ» كلمة «المعلمَ» تُعرب ......", "choices": ["خبر إنّ مرفوع", "اسم إنّ منصوب", "مبتدأ مرفوع", "فاعل مرفوع"], "answer": "اسم إنّ منصوب", "answerIndex": 1, "explanation": "«المعلمَ» اسم إنّ منصوب وعلامة نصبه الفتحة، و«مخلصٌ» خبر إنّ مرفوع.", "type": "normal", "topic": "إن وأخواتها"}, {"grade": 6, "subject": "العربي", "id": "n26-g6-27", "question": "نوع الخبر في جملة «الحديقةُ أزهارُها جميلةٌ» هو خبر ......", "choices": ["مفرد", "جملة اسمية", "شبه جملة", "جملة فعلية"], "answer": "جملة اسمية", "answerIndex": 1, "explanation": "الخبر جملة «أزهارها جميلة» وهي جملة اسمية مكونة من مبتدأ وخبر، وفيها ضمير يعود على المبتدأ الأول.", "type": "normal", "topic": "أنواع الخبر"}, {"grade": 6, "subject": "العربي", "id": "n26-g6-28", "question": "أي كلمة مما يلي من أخوات كان؟", "choices": ["إنّ", "أصبحَ", "لكنّ", "لعلّ"], "answer": "أصبحَ", "answerIndex": 1, "explanation": "من أخوات كان: كان وأصبح وأمسى وظل وبات وصار وليس، أما إنّ ولكنّ ولعلّ فمن أخوات إنّ.", "type": "normal", "topic": "كان وأخواتها"}, {"grade": 6, "subject": "العلوم", "id": "n26-g6-29", "question": "وظيفة الكليتين الأساسية هي ......", "choices": ["ضخ الدم", "تنقية الدم من الفضلات وتكوين البول", "هضم الطعام", "إنتاج الهرمونات فقط"], "answer": "تنقية الدم من الفضلات وتكوين البول", "answerIndex": 1, "explanation": "الكليتان ترشّحان الدم وتخلّصانه من الفضلات والأملاح الزائدة والماء الزائد في صورة بول.", "type": "normal", "topic": "الجهاز البولي والكليتان"}, {"grade": 6, "subject": "العلوم", "id": "n26-g6-30", "question": "ينتقل البول من الكلية إلى المثانة عن طريق ......", "choices": ["الحالب", "الشريان", "المريء", "القصبة الهوائية"], "answer": "الحالب", "answerIndex": 0, "explanation": "لكل كلية حالب؛ أنبوب ينقل البول إلى المثانة حيث يُخزّن حتى يخرج من الجسم عبر مجرى البول.", "type": "normal", "topic": "الجهاز البولي والكليتان"}, {"grade": 6, "subject": "العلوم", "id": "n26-g6-31", "question": "للحفاظ على صحة الكليتين يجب ......", "choices": ["الإقلال من شرب الماء", "شرب كميات كافية من الماء", "حبس البول فترات طويلة", "الإكثار من الملح جدًا"], "answer": "شرب كميات كافية من الماء", "answerIndex": 1, "explanation": "شرب الماء الكافي يساعد الكليتين على التخلص من الفضلات، وحبس البول والإفراط في الملح يضران الجهاز البولي.", "type": "normal", "topic": "الجهاز البولي والكليتان"}, {"grade": 6, "subject": "العلوم", "id": "n26-g6-32", "question": "الوحدة البنائية الأساسية لجسم الكائن الحي هي ......", "choices": ["العضو", "النسيج", "الخلية", "الجهاز"], "answer": "الخلية", "answerIndex": 2, "explanation": "الخلية هي أصغر وحدة بناء ووظيفة في الكائنات الحية، وتجتمع الخلايا المتشابهة لتكوّن النسيج.", "type": "normal", "topic": "الخلية"}, {"grade": 6, "subject": "العلوم", "id": "n26-g6-33", "question": "تنتقل الحرارة في الأجسام الصلبة المعدنية بطريقة ......", "choices": ["الحمل", "التوصيل", "الإشعاع", "التبخر"], "answer": "التوصيل", "answerIndex": 1, "explanation": "التوصيل انتقال الحرارة من الجزء الأسخن إلى الأبرد داخل الجسم الصلب، لذلك تسخن الملعقة المعدنية في الشوربة الساخنة.", "type": "normal", "topic": "انتقال الحرارة"}, {"grade": 6, "subject": "العلوم", "id": "n26-g6-34", "question": "يحتاج النبات لينمو نموًا صحيًا إلى ......", "choices": ["الماء والضوء والهواء والتربة المناسبة", "الظلام الدائم", "الماء المالح فقط", "الهواء الساخن فقط"], "answer": "الماء والضوء والهواء والتربة المناسبة", "answerIndex": 0, "explanation": "شروط النمو الصحي للنبات: ماء وضوء شمس وهواء وتربة خصبة بدرجة حرارة مناسبة.", "type": "normal", "topic": "النمو الصحي"}, {"grade": 6, "subject": "العلوم", "id": "n26-g6-35", "question": "الغذاء المتوازن الصحي للإنسان يجب أن يحتوي على ......", "choices": ["الحلويات فقط", "عناصر متنوعة: بروتينات ونشويات وفيتامينات وخضراوات", "الدهون فقط", "المشروبات الغازية"], "answer": "عناصر متنوعة: بروتينات ونشويات وفيتامينات وخضراوات", "answerIndex": 1, "explanation": "النمو الصحي يحتاج غذاءً متنوعًا متوازنًا مع الماء والنوم الكافي وممارسة الرياضة.", "type": "normal", "topic": "النمو الصحي"}, {"grade": 6, "subject": "العلوم", "id": "n26-g6-36", "question": "أفضل أنواع التربة للزراعة لأنها تحتفظ بالماء والغذاء هي التربة ......", "choices": ["الرملية", "الطينية المخلوطة (الصفراء)", "الصخرية", "الجيرية الجافة"], "answer": "الطينية المخلوطة (الصفراء)", "answerIndex": 1, "explanation": "التربة الصفراء خليط متوازن من الرمل والطين؛ تحتفظ بالماء والعناصر الغذائية وتصلح لمعظم المحاصيل.", "type": "normal", "topic": "التربة"}, {"grade": 6, "subject": "العلوم", "id": "n26-g6-37", "question": "تحوّل الماء من الحالة السائلة إلى الغازية يسمى ......", "choices": ["الانصهار", "التبخر", "التجمد", "التكثف"], "answer": "التبخر", "answerIndex": 1, "explanation": "التبخر تحول المادة من سائلة إلى غازية بالحرارة، وعكسه التكثف، أما الانصهار فتحول الصلب إلى سائل.", "type": "normal", "topic": "حالات المادة"}, {"grade": 6, "subject": "العلوم", "id": "n26-g6-38", "question": "يتكون النظام البيئي من ......", "choices": ["كائنات حية فقط", "مكونات حية ومكونات غير حية تتفاعل معًا", "صخور فقط", "ماء فقط"], "answer": "مكونات حية ومكونات غير حية تتفاعل معًا", "answerIndex": 1, "explanation": "النظام البيئي وحدة متكاملة: كائنات حية (نبات وحيوان وإنسان) ومكونات غير حية (ماء وهواء وتربة وضوء) يؤثر كل منها في الآخر.", "type": "normal", "topic": "النظام البيئي"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "n26-g6-39", "question": "عدد دول الوطن العربي (أعضاء جامعة الدول العربية) ...... دولة.", "choices": ["12", "18", "22", "30"], "answer": "22", "answerIndex": 2, "explanation": "يضم الوطن العربي 22 دولة تمتد في قارتي آسيا وأفريقيا، ومصر أكبرها من حيث عدد السكان.", "type": "normal", "topic": "الوطن العربي: الموقع والسكان"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "n26-g6-40", "question": "يمتد الوطن العربي بين قارتي ......", "choices": ["آسيا وأوروبا", "آسيا وأفريقيا", "أفريقيا وأمريكا", "آسيا وأستراليا"], "answer": "آسيا وأفريقيا", "answerIndex": 1, "explanation": "جناحا الوطن العربي: جناح آسيوي (المشرق والجزيرة العربية) وجناح أفريقي (وادي النيل والمغرب العربي) يربط بينهما البحر الأحمر.", "type": "normal", "topic": "الوطن العربي: الموقع والسكان"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "n26-g6-41", "question": "يتركز معظم سكان الوطن العربي في ......", "choices": ["قلب الصحاري", "أودية الأنهار والسواحل", "قمم الجبال", "الجزر النائية"], "answer": "أودية الأنهار والسواحل", "answerIndex": 1, "explanation": "يتجمع السكان حيث الماء والأرض الخصبة: وادي النيل ودلتاه، وسهول دجلة والفرات، والسواحل المطلة على البحار.", "type": "normal", "topic": "الوطن العربي: الموقع والسكان"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "n26-g6-42", "question": "من أشهر سلاسل جبال الوطن العربي في المغرب العربي جبال ......", "choices": ["الهيمالايا", "أطلس", "الألب", "الأنديز"], "answer": "أطلس", "answerIndex": 1, "explanation": "جبال أطلس تمتد في المغرب والجزائر وتونس شمال غرب أفريقيا، أما الهيمالايا ففي آسيا والألب في أوروبا.", "type": "normal", "topic": "الوطن العربي: التضاريس"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "n26-g6-43", "question": "يشتهر الوطن العربي عالميًا بإنتاج وتصدير ...... من منطقة الخليج العربي.", "choices": ["القطن فقط", "النفط والغاز الطبيعي", "الأخشاب", "الفحم الحجري فقط"], "answer": "النفط والغاز الطبيعي", "answerIndex": 1, "explanation": "يمتلك الوطن العربي نسبة كبيرة من احتياطي العالم من النفط والغاز الطبيعي، خاصة دول الخليج العربي والعراق وليبيا والجزائر.", "type": "normal", "topic": "الوطن العربي: الموارد"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "n26-g6-44", "question": "قناة السويس تربط بين البحرين ......", "choices": ["الأحمر والميت", "المتوسط والأحمر", "الأسود وقزوين", "العربي والهندي مباشرة"], "answer": "المتوسط والأحمر", "answerIndex": 1, "explanation": "قناة السويس ممر ملاحي عالمي في مصر يصل البحر المتوسط بالبحر الأحمر، ويختصر رحلة السفن بين الشرق والغرب.", "type": "normal", "topic": "الوطن العربي: الموارد"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "n26-g6-45", "question": "يشرف الوطن العربي على مضيق يربط البحر الأحمر بخليج عدن هو مضيق ......", "choices": ["هرمز", "باب المندب", "جبل طارق", "البسفور"], "answer": "باب المندب", "answerIndex": 1, "explanation": "باب المندب عند المدخل الجنوبي للبحر الأحمر بين اليمن وجيبوتي، أما هرمز فيربط الخليج العربي بخليج عمان.", "type": "normal", "topic": "الوطن العربي: الموقع والسكان"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "n26-g6-46", "question": "أكبر صحاري الوطن العربي والعالم من حيث المساحة تقريبًا هي ......", "choices": ["صحراء سيناء", "الصحراء الكبرى في شمال أفريقيا", "صحراء الربع الخالي فقط", "بادية الشام"], "answer": "الصحراء الكبرى في شمال أفريقيا", "answerIndex": 1, "explanation": "الصحراء الكبرى تمتد عبر شمال أفريقيا في مصر وليبيا والجزائر والمغرب وموريتانيا، وهي أكبر الصحاري الحارة في العالم.", "type": "normal", "topic": "الوطن العربي: التضاريس"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "n26-g6-47", "question": "Choose: Yesterday, we ______ the museum.", "choices": ["visit", "visited", "visits", "visiting"], "answer": "visited", "answerIndex": 1, "explanation": "كلمة Yesterday تدل على الماضي البسيط، فنستخدم visited بإضافة ed للفعل المنتظم.", "type": "normal", "topic": "Past Simple - Units 3-5"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "n26-g6-48", "question": "Choose: The Nile is ______ than the Thames.", "choices": ["long", "longer", "longest", "more long"], "answer": "longer", "answerIndex": 1, "explanation": "للمقارنة بين شيئين نستخدم الصفة + er + than: longer than (أطول من).", "type": "normal", "topic": "Comparatives - Unit 4"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "n26-g6-49", "question": "Choose: You ______ run in the hospital.", "choices": ["must", "mustn't", "can", "are"], "answer": "mustn't", "answerIndex": 1, "explanation": "mustn't تعني ممنوع/يجب ألا، والجري في المستشفى ممنوع حفاظًا على راحة المرضى.", "type": "normal", "topic": "Must / Mustn't - Unit 5"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "n26-g6-50", "question": "Choose: Look! The birds ______ in the sky.", "choices": ["fly", "flies", "are flying", "flew"], "answer": "are flying", "answerIndex": 2, "explanation": "كلمة Look! تدل على حدث يحدث الآن، فنستخدم المضارع المستمر: are flying مع الجمع.", "type": "normal", "topic": "Present Continuous - Unit 3"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "n26-g6-51", "question": "Choose: A ______ works in a hospital and helps sick people.", "choices": ["teacher", "doctor", "farmer", "driver"], "answer": "doctor", "answerIndex": 1, "explanation": "الطبيب doctor يعمل في المستشفى ويعالج المرضى، أما المعلم teacher ففي المدرسة.", "type": "normal", "topic": "Vocabulary: Jobs - Unit 4"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "n26-g6-52", "question": "Choose: She ______ her homework last night.", "choices": ["do", "does", "did", "doing"], "answer": "did", "answerIndex": 2, "explanation": "last night تدل على الماضي، والماضي من do هو did.", "type": "normal", "topic": "Past Simple - Units 3-5"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "n26-g6-53", "question": "Choose: We borrow books from the ______.", "choices": ["bakery", "library", "station", "market"], "answer": "library", "answerIndex": 1, "explanation": "نستعير الكتب من المكتبة: library، أما المخبز bakery فنشتري منه الخبز.", "type": "normal", "topic": "Vocabulary: Places - Unit 5"}, {"grade": 6, "subject": "اللغة الإنجليزية", "id": "n26-g6-54", "question": "Choose: How ______ eggs do we need?", "choices": ["much", "many", "is", "long"], "answer": "many", "answerIndex": 1, "explanation": "eggs اسم يعدّ (جمع)، فيُسأل عنه بـ How many، أما ما لا يعد فيُسأل عنه بـ How much.", "type": "normal", "topic": "How much / How many"}, {"grade": 6, "subject": "الرياضيات", "id": "n26-g6-55", "question": "لغز: ما العامل المشترك الأكبر للعددين 18 و24؟", "choices": ["3", "6", "8", "12"], "answer": "6", "answerIndex": 1, "explanation": "عوامل 18: 1،2،3،6،9،18. عوامل 24: 1،2،3،4،6،8،12،24. أكبر عامل مشترك هو 6.", "type": "puzzle", "topic": "لغز العامل المشترك"}, {"grade": 6, "subject": "الرياضيات", "id": "n26-g6-56", "question": "لغز: عدد إذا ضربته في 3 ثم طرحت 4 كان الناتج 20. ما العدد؟", "choices": ["6", "7", "8", "9"], "answer": "8", "answerIndex": 2, "explanation": "نعكس الخطوات: 20 + 4 = 24، ثم 24 ÷ 3 = 8.", "type": "puzzle", "topic": "لغز المعادلات"}, {"grade": 6, "subject": "الرياضيات", "id": "n26-g6-57", "question": "لغز: درجة الحرارة كانت −2 ثم ارتفعت 7 درجات. كم أصبحت؟", "choices": ["5", "9", "−5", "−9"], "answer": "5", "answerIndex": 0, "explanation": "−2 + 7 = 5 درجات.", "type": "puzzle", "topic": "لغز الأعداد الصحيحة"}, {"grade": 6, "subject": "الرياضيات", "id": "n26-g6-58", "question": "لغز: درجات تلميذ: 8، 10، 9، 13. ما الوسط الحسابي لدرجاته؟", "choices": ["9", "10", "11", "40"], "answer": "10", "answerIndex": 1, "explanation": "المجموع = 8+10+9+13 = 40، والوسط = 40 ÷ 4 = 10.", "type": "puzzle", "topic": "لغز الإحصاء"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-1", "question": "أكمل الآية الكريمة: ﴿وَلَكُمْ فِيهَا جَمَالٌ حِينَ تُرِيحُونَ وَحِينَ ............﴾ (النحل: 6)", "choices": ["تَسْرَحُونَ", "تَرْعَوْنَ", "تَسِيمُونَ", "تَرْتَعُونَ"], "answer": "تَسْرَحُونَ", "answerIndex": 0, "explanation": "قال تعالى: ﴿وَلَكُمْ فِيهَا جَمَالٌ حِينَ تُرِيحُونَ وَحِينَ تَسْرَحُونَ﴾؛ تسرحون أي تخرجون بها صباحًا إلى المرعى.", "type": "mcq", "topic": "حفظ: سورة النحل", "source": "https://shbabbek.com/show/263829"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-2", "question": "أكمل الآية الكريمة: ﴿وَالْخَيْلَ وَالْبِغَالَ وَالْحَمِيرَ لِتَرْكَبُوهَا ............ وَيَخْلُقُ مَا لَا تَعْلَمُونَ﴾ (النحل: 8)", "choices": ["وَمَتَاعًا", "وَزِينَةً", "وَقُوَّةً", "وَسَكَنًا"], "answer": "وَزِينَةً", "answerIndex": 1, "explanation": "خلق الله الخيل والبغال والحمير للركوب والزينة، كما في الآية الثامنة من سورة النحل.", "type": "mcq", "topic": "حفظ: سورة النحل", "source": "https://shbabbek.com/show/263829"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-3", "question": "أكمل الآية الكريمة: ﴿وَإِن تَعُدُّوا نِعْمَةَ اللَّهِ ............ إِنَّ اللَّهَ لَغَفُورٌ رَّحِيمٌ﴾ (النحل: 18)", "choices": ["لَا تَشْكُرُوهَا", "لَا تُحْصُوهَا", "لَا تَذْكُرُوهَا", "لَا تَعْرِفُوهَا"], "answer": "لَا تُحْصُوهَا", "answerIndex": 1, "explanation": "نعم الله كثيرة لا يستطيع الإنسان عدّها ولا إحصاءها مهما حاول.", "type": "mcq", "topic": "حفظ: سورة النحل", "source": "https://shbabbek.com/show/263829"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-4", "question": "أكمل الآية الكريمة: ﴿وَمَا بِكُم مِّن نِّعْمَةٍ ............﴾ (النحل: 53)", "choices": ["فَمِنَ النَّاسِ", "فَاشْكُرُوهَا", "فَمِنَ اللَّهِ", "فَمِنْ عَمَلِكُمْ"], "answer": "فَمِنَ اللَّهِ", "answerIndex": 2, "explanation": "كل نعمة ينعم بها الإنسان مصدرها الله وحده، فهو المنعم الحقيقي.", "type": "mcq", "topic": "حفظ: سورة النحل", "source": "https://www.facebook.com/ebtsamelsonbaty/posts/pfbid026gURZQKqrfrsMqVyU7kyxXK1irJWva7qwDmDZSTZc1UkfuLctaDwGYdKCMFrz91Vl"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-5", "question": "أكمل الآية الكريمة: ﴿يَخْرُجُ مِن بُطُونِهَا شَرَابٌ مُّخْتَلِفٌ أَلْوَانُهُ فِيهِ ............ لِلنَّاسِ﴾ (النحل: 69)", "choices": ["غِذَاءٌ", "شِفَاءٌ", "قُوَّةٌ", "بَرَكَةٌ"], "answer": "شِفَاءٌ", "answerIndex": 1, "explanation": "الآية تتحدث عن العسل الذي يخرج من بطون النحل، وفيه شفاء للناس.", "type": "mcq", "topic": "حفظ: سورة النحل", "source": "https://shbabbek.com/show/263829"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-6", "question": "أكمل الآية الكريمة: ﴿وَقُل جَاءَ الْحَقُّ وَزَهَقَ ............ إِنَّ الْبَاطِلَ كَانَ زَهُوقًا﴾ (الإسراء: 81)", "choices": ["الْكَذِبُ", "الظُّلْمُ", "الْبَاطِلُ", "الشَّرُّ"], "answer": "الْبَاطِلُ", "answerIndex": 2, "explanation": "حين يظهر الحق يزول الباطل ويضمحل؛ لأنه بطبيعته زائل.", "type": "mcq", "topic": "حفظ: سورة الإسراء", "source": "https://shbabbek.com/show/263829"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-7", "question": "أكمل الآية الكريمة: ﴿أَقِمِ الصَّلَاةَ لِدُلُوكِ الشَّمْسِ إِلَىٰ ............ اللَّيْلِ وَقُرْآنَ الْفَجْرِ﴾ (الإسراء: 78)", "choices": ["غَسَقِ", "طُلُوعِ", "سُكُونِ", "نِصْفِ"], "answer": "غَسَقِ", "answerIndex": 0, "explanation": "غسق الليل: ظلمته وأوله؛ والآية تحدد أوقات الصلوات من زوال الشمس إلى ظلمة الليل.", "type": "mcq", "topic": "حفظ: سورة الإسراء", "source": "https://www.facebook.com/ebtsamelsonbaty/posts/pfbid026gURZQKqrfrsMqVyU7kyxXK1irJWva7qwDmDZSTZc1UkfuLctaDwGYdKCMFrz91Vl"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-8", "question": "أكمل الآية الكريمة: ﴿إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ ............﴾ (الإسراء: 36)", "choices": ["مُحَاسَبًا", "مَسْئُولًا", "مُجَازًى", "مُكْرَمًا"], "answer": "مَسْئُولًا", "answerIndex": 1, "explanation": "الإنسان مسؤول يوم القيامة عما سمعه وأبصره وفكر فيه.", "type": "mcq", "topic": "حفظ: سورة الإسراء", "source": "https://shbabbek.com/show/263829"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-9", "question": "أكمل الآية الكريمة: ﴿إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَانَتْ لَهُمْ جَنَّاتُ ............ نُزُلًا﴾ (الكهف: 107)", "choices": ["الْخُلْدِ", "النَّعِيمِ", "الْفِرْدَوْسِ", "عَدْنٍ"], "answer": "الْفِرْدَوْسِ", "answerIndex": 2, "explanation": "الفردوس أعلى الجنة وأوسطها، وهي جزاء المؤمنين العاملين للصالحات.", "type": "mcq", "topic": "حفظ: سورة الكهف", "source": "https://shbabbek.com/show/263829"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-10", "question": "أكمل الآية الكريمة: ﴿فَمَن كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلَا ............ بِعِبَادَةِ رَبِّهِ أَحَدًا﴾ (الكهف: 110)", "choices": ["يَسْتَهِنْ", "يُشْرِكْ", "يَتَكَبَّرْ", "يُقَصِّرْ"], "answer": "يُشْرِكْ", "answerIndex": 1, "explanation": "هذه آخر آية في سورة الكهف، وتأمر بالإخلاص وعدم الشرك في العبادة.", "type": "mcq", "topic": "حفظ: سورة الكهف", "source": "https://www.facebook.com/ebtsamelsonbaty/posts/pfbid026gURZQKqrfrsMqVyU7kyxXK1irJWva7qwDmDZSTZc1UkfuLctaDwGYdKCMFrz91Vl"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-11", "question": "أكمل الآية الكريمة: قال سيدنا عيسى عليه السلام وهو في المهد: ﴿إِنِّي عَبْدُ اللَّهِ آتَانِيَ الْكِتَابَ وَجَعَلَنِي ............﴾ (مريم: 30)", "choices": ["رَسُولًا", "نَبِيًّا", "صِدِّيقًا", "إِمَامًا"], "answer": "نَبِيًّا", "answerIndex": 1, "explanation": "تحدث عيسى عليه السلام في المهد معجزةً، وأخبر أنه عبد الله آتاه الكتاب وجعله نبيًا.", "type": "mcq", "topic": "حفظ: سورة مريم", "source": "https://shbabbek.com/show/263829"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-12", "question": "أكمل الآية الكريمة: ﴿وَقُل رَّبِّ ............ عِلْمًا﴾ (طه: 114)", "choices": ["زِدْنِي", "هَبْ لِي", "عَلِّمْنِي", "ارْزُقْنِي"], "answer": "زِدْنِي", "answerIndex": 0, "explanation": "دعاء قرآني عظيم يعلمنا أن نطلب من الله الزيادة من العلم دائمًا.", "type": "mcq", "topic": "حفظ: سورة طه", "source": "https://shbabbek.com/show/263829"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-13", "question": "أكمل دعاء سيدنا موسى عليه السلام: ﴿قَالَ رَبِّ اشْرَحْ لِي ............ وَيَسِّرْ لِي أَمْرِي﴾ (طه: 25)", "choices": ["قَلْبِي", "صَدْرِي", "طَرِيقِي", "عَقْلِي"], "answer": "صَدْرِي", "answerIndex": 1, "explanation": "دعا موسى عليه السلام ربه أن يشرح صدره وييسر أمره قبل مواجهة فرعون.", "type": "mcq", "topic": "حفظ: سورة طه", "source": "https://www.facebook.com/ebtsamelsonbaty/posts/pfbid026gURZQKqrfrsMqVyU7kyxXK1irJWva7qwDmDZSTZc1UkfuLctaDwGYdKCMFrz91Vl"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-14", "question": "أكمل الآية الكريمة: ﴿إِنَّنِي أَنَا اللَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ ............﴾ (طه: 14)", "choices": ["لِتُطِيعَنِي", "لِذِكْرِي", "خَوْفًا مِنِّي", "فِي أَوْقَاتِهَا"], "answer": "لِذِكْرِي", "answerIndex": 1, "explanation": "خاطب الله موسى عليه السلام عند الوادي المقدس وأمره بإقامة الصلاة لذكره.", "type": "mcq", "topic": "حفظ: سورة طه", "source": "https://shbabbek.com/show/263829"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-15", "question": "ما معنى قوله تعالى في سورة النحل: ﴿خَلَقَ الْإِنسَانَ مِن نُّطْفَةٍ فَإِذَا هُوَ خَصِيمٌ مُّبِينٌ﴾؟ كلمة «خَصِيمٌ» تعني:", "choices": ["ضعيف عاجز", "كثير الجدال والخصومة", "شاكر لأنعم الله", "صابر محتسب"], "answer": "كثير الجدال والخصومة", "answerIndex": 1, "explanation": "خصيم مبين: شديد الخصومة والجدال لربه رغم أن الله خلقه من نطفة ضعيفة.", "type": "mcq", "topic": "معاني المفردات القرآنية", "source": "https://shbabbek.com/show/263829"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-16", "question": "ما معنى كلمة «دِفْءٌ» في قوله تعالى عن الأنعام: ﴿لَكُمْ فِيهَا دِفْءٌ وَمَنَافِعُ﴾ (النحل: 5)؟", "choices": ["لحم لذيذ", "ما يُستدفأ به من الصوف والوبر", "حليب غزير", "قوة على الحمل"], "answer": "ما يُستدفأ به من الصوف والوبر", "answerIndex": 1, "explanation": "الدفء: ما يتدفأ به الإنسان من أصواف الأنعام وأوبارها فيصنع منها الملابس والأغطية.", "type": "mcq", "topic": "معاني المفردات القرآنية", "source": "https://www.facebook.com/ebtsamelsonbaty/posts/pfbid026gURZQKqrfrsMqVyU7kyxXK1irJWva7qwDmDZSTZc1UkfuLctaDwGYdKCMFrz91Vl"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-17", "question": "ما معنى كلمة «زَهُوقًا» في قوله تعالى: ﴿إِنَّ الْبَاطِلَ كَانَ زَهُوقًا﴾ (الإسراء: 81)؟", "choices": ["قويًا ثابتًا", "زائلًا مضمحلًا", "مخيفًا مرعبًا", "خفيًا مستترًا"], "answer": "زائلًا مضمحلًا", "answerIndex": 1, "explanation": "زهوقًا: زائلًا لا ثبات له؛ فالباطل مهما انتفش فمصيره الزوال أمام الحق.", "type": "mcq", "topic": "معاني المفردات القرآنية", "source": "https://shbabbek.com/show/263829"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-18", "question": "ما معنى «غَسَقِ اللَّيْلِ» في قوله تعالى: ﴿أَقِمِ الصَّلَاةَ لِدُلُوكِ الشَّمْسِ إِلَىٰ غَسَقِ اللَّيْلِ﴾ (الإسراء: 78)؟", "choices": ["منتصف الليل", "ظلمة الليل وأوله", "طلوع الفجر", "وقت العشاء فقط"], "answer": "ظلمة الليل وأوله", "answerIndex": 1, "explanation": "الغسق: ظلمة الليل حين يشتد سواده في أوله.", "type": "mcq", "topic": "معاني المفردات القرآنية", "source": "https://shbabbek.com/show/263829"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-19", "question": "ما معنى قوله تعالى في أول سورة الكهف: ﴿وَلَمْ يَجْع urce": "https://www.facebook.com/ebtsamelsonbaty/posts/pfbid026gURZQKqrfrsMqVyU7kyxXK1irJWva7qwDmDZSTZc1UkfuLctaDwGYdKCMFrz91Vl"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-28", "question": "ما حكم النون الساكنة في قوله تعالى: ﴿مِن بَعْدِ﴾؟", "choices": ["إظهار حلقي", "إدغام بغنة", "إخفاء حقيقي", "إقلاب"], "answer": "إقلاب", "answerIndex": 3, "explanation": "إذا جاءت الباء بعد النون الساكنة قُلبت النون ميمًا مخفاة مع الغنة، ويسمى الحكم إقلابًا.", "type": "mcq", "topic": "أحكام التجويد", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-29", "question": "ما حكم النون الساكنة في قوله تعالى: ﴿مَن يَعْمَلْ﴾؟", "choices": ["إدغام بغنة", "إظهار حلقي", "إقلاب", "إخفاء حقيقي"], "answer": "إدغام بغنة", "answerIndex": 0, "explanation": "الياء من حروف الإدغام بغنة (ينمو)، فتُدغم النون الساكنة فيها مع بقاء الغنة.", "type": "mcq", "topic": "أحكام التجويد", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "القرآن", "id": "h26-g6-30", "question": "المد في كلمة «قَالَ» يسمى مدًا:", "choices": ["متصلًا", "منفصلًا", "طبيعيًا", "لازمًا"], "answer": "طبيعيًا", "answerIndex": 2, "explanation": "المد الطبيعي (الأصلي) يمد بمقدار حركتين، ويكون حرف المد غير متبوع بهمزة ولا سكون.", "type": "mcq", "topic": "أحكام التجويد", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-31", "question": "من آثار الإيمان بالبعث والنشور على المسلم أنه:", "choices": ["يتكاسل عن العمل", "يحسن العمل ويبتعد عن الظلم والفساد", "يخاف من الناس", "يترك طلب الرزق"], "answer": "يحسن العمل ويبتعد عن الظلم والفساد", "answerIndex": 1, "explanation": "من أيقن أنه سيبعث ويحاسب اجتهد في الإحسان وابتعد عن الظلم والفساد، كما جاء في إجابات نماذج اختبارات نوفمبر.", "type": "mcq", "topic": "الإيمان بالبعث والنشور", "source": "https://www.modrsbook.com/pdf/25344/preview"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-32", "question": "الملك الذي ينفخ في الصور يوم القيامة هو:", "choices": ["جبريل عليه السلام", "ميكائيل عليه السلام", "إسرافيل عليه السلام", "مالك خازن النار"], "answer": "إسرافيل عليه السلام", "answerIndex": 2, "explanation": "إسرافيل عليه السلام هو الملك الموكل بالنفخ في الصور، فتكون النفخة الأولى للصعق والثانية للبعث.", "type": "mcq", "topic": "الإيمان باليوم الآخر", "source": "https://mlzma.mozkrty.com/pdf/284/"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-33", "question": "أول ما يُحاسَب عليه العبد يوم القيامة من أعماله هو:", "choices": ["الصيام", "الصلاة", "بر الوالدين", "الصدقة"], "answer": "الصلاة", "answerIndex": 1, "explanation": "قال النبي ﷺ: «إن أول ما يحاسب به العبد يوم القيامة من عمله صلاته»؛ فإن صلحت فقد أفلح ونجح.", "type": "mcq", "topic": "الحساب والجزاء", "source": "https://mlzma.mozkrty.com/pdf/284/"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-34", "question": "«الصراط» الذي يمر عليه الناس يوم القيامة هو:", "choices": ["كتاب تسجل فيه الأعمال", "جسر ممدود على ظهر جهنم يمر عليه الناس", "ميزان توزن فيه الأعمال", "حوض النبي ﷺ"], "answer": "جسر ممدود على ظهر جهنم يمر عليه الناس", "answerIndex": 1, "explanation": "الصراط جسر على ظهر جهنم يعبره الناس على قدر أعمالهم، فمن نجا دخل الجنة.", "type": "mcq", "topic": "الحساب والجزاء", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-35", "question": "حرفا الإدغام بغير غنة هما:", "choices": ["الياء والنون", "اللام والراء", "الميم والواو", "الباء والميم"], "answer": "اللام والراء", "answerIndex": 1, "explanation": "الإدغام بغير غنة يكون مع اللام والراء فقط من حروف «يرملون»، مثل: ﴿مِن رَّبِّهِمْ﴾.", "type": "mcq", "topic": "التجويد: الإدغام", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-36", "question": "حكم النون الساكنة في قوله تعالى: ﴿مِن رَّبِّهِمْ﴾ هو:", "choices": ["إظهار حلقي", "إخفاء حقيقي", "إدغام بغير غنة", "إقلاب"], "answer": "إدغام بغير غنة", "answerIndex": 2, "explanation": "الراء من حرفي الإدغام بغير غنة (اللام والراء)، فتدغم النون فيها إدغامًا كاملًا بلا غنة.", "type": "mcq", "topic": "التجويد: الإدغام", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-37", "question": "عدد حروف الإخفاء الحقيقي هو:", "choices": ["6 حروف", "10 حروف", "15 حرفًا", "20 حرفًا"], "answer": "15 حرفًا", "answerIndex": 2, "explanation": "حروف الإخفاء خمسة عشر حرفًا، وهي بقية الحروف الهجائية بعد حروف الإظهار والإدغام والإقلاب.", "type": "mcq", "topic": "التجويد: الإخفاء", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-38", "question": "حكم النون الساكنة في قوله تعالى: ﴿مِن شَرِّ مَا خَلَقَ﴾ هو:", "choices": ["إخفاء حقيقي", "إظهار حلقي", "إدغام بغنة", "إقلاب"], "answer": "إخفاء حقيقي", "answerIndex": 0, "explanation": "الشين من حروف الإخفاء الخمسة عشر، فتُخفى النون الساكنة عندها مع الغنة.", "type": "mcq", "topic": "التجويد: الإخفاء", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-39", "question": "حكم الميم الساكنة في قوله تعالى: ﴿تَرْمِيهِم بِحِجَارَةٍ﴾ (الفيل: 4) هو:", "choices": ["إظهار شفوي", "إدغام شفوي", "إخفاء شفوي", "إقلاب"], "answer": "إخفاء شفوي", "answerIndex": 2, "explanation": "إذا جاءت الباء بعد الميم الساكنة كان الحكم إخفاءً شفويًا مع الغنة.", "type": "mcq", "topic": "التجويد: أحكام الميم الساكنة", "source": "https://www.modrsbook.com/pdf/25344/preview"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-40", "question": "حكم الميم الساكنة في قوله تعالى: ﴿فِي قُلُوبِهِم مَّرَضٌ﴾ (البقرة: 10) هو:", "choices": ["إدغام شفوي", "إخفاء شفوي", "إظهار شفوي", "مد لازم"], "answer": "إدغام شفوي", "answerIndex": 0, "explanation": "إذا جاءت الميم بعد الميم الساكنة أُدغمت فيها، ويسمى الحكم إدغامًا شفويًا (إدغام متماثلين).", "type": "mcq", "topic": "التجويد: أحكام الميم الساكنة", "source": "https://www.modrsbook.com/pdf/25344/preview"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-41", "question": "حكم الميم الساكنة في قوله تعالى: ﴿أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ﴾ (الفاتحة: 7) في «عَلَيْهِمْ غَيْرِ» هو:", "choices": ["إخفاء شفوي", "إدغام شفوي", "إظهار شفوي", "إقلاب"], "answer": "إظهار شفوي", "answerIndex": 2, "explanation": "الميم الساكنة إذا جاء بعدها حرف غير الباء والميم (كالغين) وجب إظهارها، وهو الإظهار الشفوي.", "type": "mcq", "topic": "التجويد: أحكام الميم الساكنة", "source": "https://www.modrsbook.com/pdf/25344/preview"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-42", "question": "الركن الذي يعلن به الحاج بدء نسكه ويدخل به في أعمال الحج هو:", "choices": ["طواف الإفاضة", "الإحرام", "رمي الجمرات", "الحلق أو التقصير"], "answer": "الإحرام", "answerIndex": 1, "explanation": "الإحرام هو نية الدخول في النسك، وهو أول أركان الحج كما ورد في نماذج اختبارات نوفمبر المجاب عنها.", "type": "mcq", "topic": "الحج وأحكامه", "source": "https://www.modrsbook.com/pdf/25344/preview"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-43", "question": "يطوف الحاج حول الكعبة المشرفة:", "choices": ["ثلاثة أشواط", "خمسة أشواط", "سبعة أشواط", "عشرة أشواط"], "answer": "سبعة أشواط", "answerIndex": 2, "explanation": "الطواف حول الكعبة سبعة أشواط كاملة، يبدأ كل شوط من عند الحجر الأسود وينتهي إليه.", "type": "mcq", "topic": "الحج وأحكامه", "source": "https://mlzma.mozkrty.com/pdf/284/"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-44", "question": "من آداب الحج التي أمر الله بها في قوله تعالى: ﴿فَلَا رَفَثَ وَلَا فُسُوقَ وَلَا جِدَالَ فِي الْحَجِّ﴾ أن يبتعد الحاج عن:", "choices": ["الأكل والشرب", "النوم بالنهار", "الجدال والخصام وإيذاء الناس", "لبس الإحرام"], "answer": "الجدال والخصام وإيذاء الناس", "answerIndex": 2, "explanation": "ينبغي للحاج أن يحفظ لسانه وجوارحه، فيترك الرفث والفسوق والجدال ويعامل الناس بالرفق.", "type": "mcq", "topic": "آداب الحج", "source": "https://mlzma.mozkrty.com/pdf/284/"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-45", "question": "الاسم الحقيقي للصحابي الجليل أبي هريرة رضي الله عنه هو:", "choices": ["عبد الله بن عمر", "عبد الرحمن بن صخر الدوسي", "زيد بن ثابت", "سعد بن معاذ"], "answer": "عبد الرحمن بن صخر الدوسي", "answerIndex": 1, "explanation": "أبو هريرة اسمه عبد الرحمن بن صخر الدوسي، وهو أكثر الصحابة رواية لحديث النبي ﷺ.", "type": "mcq", "topic": "سيرة الصحابة: أبو هريرة", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-46", "question": "لُقِّب الصحابي عبد الرحمن بن صخر بـ«أبي هريرة» لأنه كان:", "choices": ["يملك قطيعًا من الغنم", "يحمل هرة (قطة) صغيرة ويلاعبها", "يسكن بجوار جبل هريرة", "يحب صيد الطيور"], "answer": "يحمل هرة (قطة) صغيرة ويلاعبها", "answerIndex": 1, "explanation": "كان رضي الله عنه يحمل هرة صغيرة في كمه ويرعاها، فكناه النبي ﷺ بأبي هريرة وغلبت الكنية على اسمه.", "type": "mcq", "topic": "سيرة الصحابة: أبو هريرة", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-47", "question": "اعتمد الإمام أبو حنيفة رحمه الله في دروسه ومجلسه على أسلوب:", "choices": ["الحفظ والتلقين فقط", "الحوار والنقاش", "القراءة من الكتب فقط", "الامتحانات التحريرية"], "answer": "الحوار والنقاش", "answerIndex": 1, "explanation": "كان مجلس أبي حنيفة قائمًا على الحوار والنقاش وطرح المسائل ومناقشتها حتى يتضح الحكم، كما جاء في نماذج الاختبارات المجاب عنها.", "type": "mcq", "topic": "الأئمة: أبو حنيفة", "source": "https://www.modrsbook.com/pdf/25344/preview"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-48", "question": "أستاذ الإمام أبي حنيفة الذي تعلم منه الفقه هو الإمام:", "choices": ["مالك بن أنس", "الشافعي", "حماد بن أبي سليمان", "أحمد بن حنبل"], "answer": "حماد بن أبي سليمان", "answerIndex": 2, "explanation": "لازم أبو حنيفة شيخه حماد بن أبي سليمان ثماني عشرة سنة يتعلم منه الفقه حتى برع فيه.", "type": "mcq", "topic": "الأئمة: أبو حنيفة", "source": "https://www.modrsbook.com/pdf/25344/preview"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-49", "question": "الاسم الحقيقي للإمام أبي حنيفة هو:", "choices": ["محمد بن إدريس", "النعمان بن ثابت", "مالك بن أنس", "أحمد بن محمد"], "answer": "النعمان بن ثابت", "answerIndex": 1, "explanation": "الإمام أبو حنيفة اسمه النعمان بن ثابت الكوفي، وأبو حنيفة كنيته التي اشتهر بها.", "type": "mcq", "topic": "الأئمة: أبو حنيفة", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-50", "question": "لُقِّب الإمام مالك بن أنس رحمه الله بـ:", "choices": ["إمام دار الهجرة", "حجة الإسلام", "شيخ الإسلام", "فقيه العراق"], "answer": "إمام دار الهجرة", "answerIndex": 0, "explanation": "لُقب مالك بإمام دار الهجرة؛ لأنه كان أعلم أهل المدينة المنورة (دار هجرة النبي ﷺ) في عصره.", "type": "mcq", "topic": "الأئمة: الإمام مالك", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-51", "question": "يُعد كتاب «الموطأ» للإمام مالك من أوائل الكتب المؤلفة في:", "choices": ["التفسير وعلوم القرآن", "الحديث والفقه", "السيرة النبوية", "اللغة والنحو"], "answer": "الحديث والفقه", "answerIndex": 1, "explanation": "جمع الإمام مالك في الموطأ أحاديث النبي ﷺ وآثار الصحابة والتابعين مع فقهها، فكان من أوائل كتب الحديث والفقه.", "type": "mcq", "topic": "الأئمة: الإمام مالك", "source": "https://mlzma.mozkrty.com/pdf/284/"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-52", "question": "قاتل المسلمون في غزوة حنين قبيلتي:", "choices": ["قريش وبني النضير", "هوازن وثقيف", "الأوس والخزرج", "بنو قريظة وبنو المصطلق"], "answer": "هوازن وثقيف", "answerIndex": 1, "explanation": "تجمعت هوازن وثقيف في وادي حنين لقتال المسلمين بعد فتح مكة، فكانت الغزوة سنة 8 هجرية.", "type": "mcq", "topic": "السيرة: غزوة حنين", "source": "https://www.modrsbook.com/pdf/25344/preview"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-53", "question": "الدرس المستفاد من بداية غزوة حنين حين تراجع المسلمون أول المعركة أن سبب ذلك كان:", "choices": ["قلة عدد المسلمين", "إعجاب المسلمين بكثرتهم واغترارهم بها", "نقص السلاح والخيل", "تأخر وصول النبي ﷺ"], "answer": "إعجاب المسلمين بكثرتهم واغترارهم بها", "answerIndex": 1, "explanation": "قال تعالى: ﴿وَيَوْمَ حُنَيْنٍ إِذْ أَعْجَبَتْكُمْ كَثْرَتُكُمْ فَلَمْ تُغْنِ عَنكُمْ شَيْئًا﴾؛ فالنصر من عند الله لا بالكثرة.", "type": "mcq", "topic": "السيرة: غزوة حنين", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-54", "question": "استمر حصار المسلمين للطائف بعد غزوة حنين مدة:", "choices": ["عشرة أيام", "عشرين يومًا", "ثلاثين يومًا", "أربعين يومًا"], "answer": "أربعين يومًا", "answerIndex": 3, "explanation": "حاصر النبي ﷺ الطائف أربعين يومًا ثم رفع الحصار، كما ورد في إجابات نماذج اختبارات نوفمبر.", "type": "mcq", "topic": "السيرة: حصار الطائف", "source": "https://www.modrsbook.com/pdf/25344/preview"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-55", "question": "كان سبب حصار المسلمين للطائف أن بعض جنود هوازن وثقيف:", "choices": ["هاجموا المدينة المنورة", "تحصنوا بها بعد هزيمتهم في حنين", "منعوا المسلمين من الحج", "سرقوا أموال المسلمين"], "answer": "تحصنوا بها بعد هزيمتهم في حنين", "answerIndex": 1, "explanation": "فر فلول هوازن وثقيف إلى الطائف وتحصنوا بحصونها المنيعة، فحاصرهم المسلمون.", "type": "mcq", "topic": "السيرة: حصار الطائف", "source": "https://www.modrsbook.com/pdf/25344/preview"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-56", "question": "سُميت غزوة تبوك بـ«غزوة العُسرة» بسبب:", "choices": ["كثرة عدد الأعداء وقوتهم", "شدة الحر وبعد المسافة وقلة الماء والمال", "هزيمة المسلمين فيها", "طول مدة القتال"], "answer": "شدة الحر وبعد المسافة وقلة الماء والمال", "answerIndex": 1, "explanation": "خرج المسلمون إلى تبوك في حر شديد وجدب وبعد شقة، فسميت غزوة العسرة أي الشدة والمشقة.", "type": "mcq", "topic": "السيرة: غزوة تبوك", "source": "https://shbabbek.com/show/258241"}, {"grade": 6, "subject": "التربية الإسلامية", "id": "h26-g6-57", "question": "عدد الصحابة الذين تخلفوا عن غزوة تبوك ثم تاب الله عليهم (ومنهم كعب بن مالك) هو:", "choices": ["صحابي واحد", "صحابيان", "ثلاثة صحابة", "عشرة صحابة"], "answer": "ثلاثة صحابة", "answerIndex": 2, "expla on": "كأن تفيد التشبيه، مثل: كأن القمرَ مصباحٌ؛ شبهنا القمر بالمصباح في الإنارة.", "type": "mcq", "topic": "إن وأخواتها: معاني الأخوات", "source": "https://www.belarabyapps.com/%D8%A3%D8%B3%D8%A6%D9%84%D8%A9-%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D9%84%D8%BA%D8%A9-%D8%A7%D9%84%D8%B9%D8%B1%D8%A8%D9%8A%D8%A9/"}, {"grade": 6, "subject": "العربي", "id": "h26-g6-73", "question": "حرف «لكنَّ» من أخوات إنّ ويفيد:", "choices": ["التوكيد فقط", "الاستدراك", "التشبيه", "الترجي"], "answer": "الاستدراك", "answerIndex": 1, "explanation": "لكن تفيد الاستدراك، أي تصحيح ما قبلها بما بعدها، مثل: الغنيُّ كثيرُ المال لكن البخيلَ مكروهٌ.", "type": "mcq", "topic": "إن وأخواتها: معاني الأخوات", "source": "https://www.belarabyapps.com/%D8%A3%D8%B3%D8%A6%D9%84%D8%A9-%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D9%84%D8%BA%D8%A9-%D8%A7%D9%84%D8%B9%D8%B1%D8%A8%D9%8A%D8%A9/"}, {"grade": 6, "subject": "العربي", "id": "h26-g6-74", "question": "أي كلمة مما يلي ليست من أخوات إنّ؟", "choices": ["لعلَّ", "كأنَّ", "كانَ", "ليتَ"], "answer": "كانَ", "answerIndex": 2, "explanation": "كان فعل ناسخ من أخوات كان وليست حرفًا من أخوات إن؛ أما لعل وكأن وليت فمن أخوات إن.", "type": "mcq", "topic": "إن وأخواتها", "source": "https://www.belarabyapps.com/%D8%A3%D8%B3%D8%A6%D9%84%D8%A9-%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D9%84%D8%BA%D8%A9-%D8%A7%D9%84%D8%B9%D8%B1%D8%A8%D9%8A%D8%A9/"}, {"grade": 6, "subject": "العربي", "id": "h26-g6-75", "question": "في جملة «كانَ الطالبُ يكتبُ الدرسَ» نوع خبر كان هو:", "choices": ["خبر مفرد", "خبر جملة اسمية", "خبر جملة فعلية", "خبر شبه جملة"], "answer": "خبر جملة فعلية", "answerIndex": 2, "explanation": "خبر كان هنا جملة «يكتب الدرس» وهي جملة فعلية فعلها مضارع، في محل نصب خبر كان.", "type": "mcq", "topic": "أنواع الخبر مع كان", "source": "https://www.belarabyapps.com/%D8%A3%D8%B3%D8%A6%D9%84%D8%A9-%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D9%84%D8%BA%D8%A9-%D8%A7%D9%84%D8%B9%D8%B1%D8%A8%D9%8A%D8%A9/"}, {"grade": 6, "subject": "العربي", "id": "h26-g6-76", "question": "في جملة «إنَّ المجتهدَ ينجحُ دائمًا» نوع خبر إنّ هو:", "choices": ["خبر مفرد", "خبر شبه جملة", "خبر جملة فعلية", "خبر جملة اسمية"], "answer": "خبر جملة فعلية", "answerIndex": 2, "explanation": "خبر إن هنا جملة «ينجح دائمًا» وهي جملة فعلية فعلها مضارع، في محل رفع خبر إن.", "type": "mcq", "topic": "أنواع الخبر مع إن", "source": "https://www.belarabyapps.com/%D8%A3%D8%B3%D8%A6%D9%84%D8%A9-%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D9%84%D8%BA%D8%A9-%D8%A7%D9%84%D8%B9%D8%B1%D8%A8%D9%8A%D8%A9/"}, {"grade": 6, "subject": "العربي", "id": "h26-g6-77", "question": "المبتدأ في جملة «الحديقةُ واسعةٌ» هو كلمة:", "choices": ["واسعةٌ", "الحديقةُ", "لا يوجد مبتدأ", "الجملة كلها"], "answer": "الحديقةُ", "answerIndex": 1, "explanation": "الجملة الاسمية تبدأ بالمبتدأ وهو «الحديقةُ» مرفوع، و«واسعةٌ» خبره المرفوع.", "type": "mcq", "topic": "الجملة الاسمية", "source": "https://www.belarabyapps.com/%D8%A3%D8%B3%D8%A6%D9%84%D8%A9-%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D9%84%D8%BA%D8%A9-%D8%A7%D9%84%D8%B9%D8%B1%D8%A8%D9%8A%D8%A9/"}, {"grade": 6, "subject": "العربي", "id": "h26-g6-78", "question": "الفعل «أمسى» من أخوات كان، ويفيد اتصاف اسمه بخبره في وقت:", "choices": ["الصباح", "الضحى", "المساء", "منتصف الليل"], "answer": "المساء", "answerIndex": 2, "explanation": "أخوات كان تدل على أوقات مختلفة: أصبح للصباح، وأضحى للضحى، وأمسى للمساء، وبات لليل.", "type": "mcq", "topic": "كان وأخواتها: معاني الأخوات", "source": "https://nabdapp.com/original_story.php?aid=180433934"}, {"grade": 6, "subject": "العربي", "id": "h26-g6-79", "question": "اقرأ الفقرة ثم أجب: «نهر النيل أطول أنهار العالم، يجري في مصر من الجنوب إلى الشمال ليصب في البحر المتوسط، وقد قامت على ضفافه حضارة عظيمة، فهو شريان الحياة لمصر منذ آلاف السنين». الفكرة الرئيسة في الفقرة هي:", "choices": ["أهمية نهر النيل لمصر وحضارتها", "أسماء أنهار العالم", "رحلة النيل في السودان", "أخطار الفيضانات"], "answer": "أهمية نهر النيل لمصر وحضارتها", "answerIndex": 0, "explanation": "تحدثت الفقرة عن مكانة النيل ودوره في قيام الحضارة المصرية، فهو شريان الحياة لمصر.", "type": "mcq", "topic": "قراءة وفهم", "source": "https://nabdapp.com/original_story.php?aid=180433934"}, {"grade": 6, "subject": "العربي", "id": "h26-g6-80", "question": "اقرأ الفقرة ثم أجب: «المكتبة مكان هادئ مليء بالكتب النافعة، يذهب إليها التلاميذ ليقرؤوا ويستعيروا الكتب، فتزيد معارفهم وتتسع أخيلتهم». مرادف كلمة «النافعة» في الفقرة هو:", "choices": ["الكثيرة", "المفيدة", "القديمة", "المصورة"], "answer": "المفيدة", "answerIndex": 1, "explanation": "النافعة تعني المفيدة التي ينتفع بها الإنسان، وضدها الضارة.", "type": "mcq", "topic": "قراءة: مفردات", "source": "https://nabdapp.com/original_story.php?aid=180433934"}, {"grade": 6, "subject": "العلوم", "id": "h26-g6-81", "question": "أي العبارات التالية تشرح وظيفة القلب بصورة صحيحة؟", "choices": ["يهضم القلب الطعام الذي نتناوله", "ينبض القلب باستمرار لضخ الدم إلى جميع أجزاء الجسم", "يخزن القلب العناصر الغذائية", "ينتج القلب العصارة الصفراوية"], "answer": "ينبض القلب باستمرار لضخ الدم إلى جميع أجزاء الجسم", "answerIndex": 1, "explanation": "القلب عضلة تنبض بلا توقف لتضخ الدم المحمل بالأكسجين والغذاء إلى الجسم كله، كما ورد في اختبار متفوّق على فصل الدورة الدموية والإخراج.", "type": "mcq", "topic": "القلب والدورة الدموية", "source": "https://www.motafawek.com/lessons/science-g6-g6c4"}, {"grade": 6, "subject": "العلوم", "id": "h26-g6-82", "question": "أين توجد الكليتان في جسم الإنسان؟", "choices": ["في الجزء العلوي من البطن", "في الصدر بين الرئتين", "في أسفل الظهر على جانبي العمود الفقري", "داخل الجمجمة"], "answer": "في أسفل الظهر على جانبي العمود الفقري", "answerIndex": 2, "explanation": "تقع الكليتان في أسفل الظهر على جانبي العمود الفقري، ولكل إنسان كليتان على شكل حبة الفاصوليا.", "type": "mcq", "topic": "كيف تعمل الكليتان", "source": "https://www.motafawek.com/lessons/science-g6-g6c4"}, {"grade": 6, "subject": "العلوم", "id": "h26-g6-83", "question": "من أين تأتي العناصر الغذائية التي يحملها الدم إلى خلايا الجسم؟", "choices": ["تأخذها الرئتان من الهواء", "تُمتَصّ من الأمعاء الدقيقة بعد هضم الطع "grade": 6, "subject": "الدراسات الاجتماعية", "id": "h26-g6-111", "question": "يربط مضيق هرمز بين:", "choices": ["البحر الأحمر وخليج عدن", "الخليج العربي وخليج عُمان", "البحر المتوسط والمحيط الأطلسي", "بحر العرب والمحيط الهندي"], "answer": "الخليج العربي وخليج عُمان", "answerIndex": 1, "explanation": "مضيق هرمز ممر مائي إستراتيجي يصل الخليج العربي بخليج عُمان ومنه إلى بحر العرب، وتمر عبره ناقلات النفط.", "type": "mcq", "topic": "الممرات المائية", "source": "https://www.modrsbook.com/pdf/25534/download"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "h26-g6-112", "question": "تنمو أشجار الزيتون والأرز طبيعيًا في غابات إقليم:", "choices": ["البحر المتوسط", "الإقليم الصحراوي", "الإقليم الاستوائي", "إقليم التندرا"], "answer": "البحر المتوسط", "answerIndex": 0, "explanation": "إقليم البحر المتوسط معتدل ممطر شتاءً، وتنمو فيه أشجار الزيتون والأرز والصنوبر في بلاد الشام والمغرب العربي.", "type": "mcq", "topic": "المناخ والنبات الطبيعي", "source": "https://www.modrsbook.com/pdf/25534/download"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "h26-g6-113", "question": "عاصمة المملكة العربية السعودية هي مدينة:", "choices": ["جدة", "الرياض", "مكة المكرمة", "الدمام"], "answer": "الرياض", "answerIndex": 1, "explanation": "الرياض هي عاصمة المملكة العربية السعودية ومقر الحكومة، وتقع في منطقة نجد وسط المملكة.", "type": "mcq", "topic": "دول الوطن العربي وعواصمها", "source": "https://www.modrsbook.com/pdf/25534/download"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "h26-g6-114", "question": "عاصمة دولة المغرب هي مدينة:", "choices": ["الدار البيضاء", "مراكش", "الرباط", "فاس"], "answer": "الرباط", "answerIndex": 2, "explanation": "الرباط هي العاصمة السياسية للمغرب، بينما الدار البيضاء أكبر مدنه الاقتصادية.", "type": "mcq", "topic": "دول الوطن العربي وعواصمها", "source": "https://www.modrsbook.com/pdf/25534/download"}, {"grade": 6, "subject": "الدراسات الاجتماعية", "id": "h26-g6-115", "question": "عاصمة دولة العراق هي مدينة:", "choices": ["البصرة", "الموصل", "بغداد", "أربيل"], "answer": "بغداد", "answerIndex": 2, "explanation": "بغداد عاصمة العراق، بناها الخليفة العباسي أبو جعفر المنصور، ويشقها نهر دجلة.", "type": "mcq", "topic": "دول الوطن العربي وعواصمها", "source": "https://www.modrsbook.com/pdf/25534/download"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-116", "question": "معامل الحد الجبري الذي يمثل «المتغير مقسومًا على ستة» هو:", "choices": ["6", "1/6", "−6", "1/3"], "answer": "1/6", "answerIndex": 1, "explanation": "المتغير مقسومًا على 6 يعني (1/6) × المتغير، فالمعامل هو الكسر 1/6، كما ورد في مراجعة شهر نوفمبر بشبابيك.", "type": "mcq", "topic": "المقادير الجبرية", "source": "https://shbabbek.com/show/261405"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-117", "question": "المقدار الجبري الذي يعبّر عن «ضعف عدد ما مطروحًا منه خمسة» هو:", "choices": ["س + 5", "2س − 5", "5 − 2س", "س/2 − 5"], "answer": "2س − 5", "answerIndex": 1, "explanation": "ضعف العدد يعني 2 × س، ومطروحًا منه خمسة أي ننقص 5، فيكون المقدار 2س − 5.", "type": "mcq", "topic": "المقادير الجبرية", "source": "https://shbabbek.com/show/261405"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-118", "question": "الصورة الأسية (5 أس 3) تكافئ:", "choices": ["5 + 5 + 5", "5 × 3", "5 × 5 × 5", "3 × 3 × 3 × 3 × 3"], "answer": "5 × 5 × 5", "answerIndex": 2, "explanation": "الأس يعني ضرب العدد في نفسه بعدد مرات الأس؛ 5 أس 3 = 5 × 5 × 5 = 125.", "type": "mcq", "topic": "الصور الأسية", "source": "https://shbabbek.com/show/261405"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-119", "question": "المعادلة هي جملة رياضية تتضمن علامة ............ بين تعبيرين رياضيين:", "choices": ["أكبر من", "أصغر من", "التساوي", "لا يساوي"], "answer": "التساوي", "answerIndex": 2, "explanation": "المعادلة تساوي بين تعبيرين رياضيين، أما الجملة التي تتضمن علامة أكبر أو أصغر فتسمى متباينة.", "type": "mcq", "topic": "المعادلات", "source": "https://shbabbek.com/show/261405"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-120", "question": "قيمة الصورة الأسية (8 أس 3) هي:", "choices": ["24", "64", "512", "888"], "answer": "512", "answerIndex": 2, "explanation": "8 أس 3 = 8 × 8 × 8 = 64 × 8 = 512، كما ورد في مراجعة نوفمبر.", "type": "mcq", "topic": "الصور الأسية", "source": "https://shbabbek.com/show/261405"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-121", "question": "حل المعادلة: 2س + 3 = 11 هو س =", "choices": ["3", "4", "5", "7"], "answer": "4", "answerIndex": 1, "explanation": "نطرح 3 من الطرفين: 2س = 8، ثم نقسم على 2 فتكون س = 4. وبالتعويض: 2×4+3 = 11 ✓", "type": "mcq", "topic": "المعادلات", "source": "https://t.me/learn_together4p"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-122", "question": "أي عدد من الأعداد التالية يحقق المتباينة: س ≤ 5 ؟", "choices": ["7", "6", "5", "8"], "answer": "5", "answerIndex": 2, "explanation": "المتباينة س ≤ 5 تعني أن س أصغر من 5 أو تساويها، فالعدد 5 يحققها، بينما 6 و7 و8 أكبر منها.", "type": "mcq", "topic": "المتباينات", "source": "https://t.me/learn_together4p"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-123", "question": "تتوقف المسافة التي تقطعها السيارة على الزمن الذي تسير فيه بسرعة ثابتة. المتغير التابع في هذه العلاقة هو:", "choices": ["الزمن", "المسافة المقطوعة", "نوع السيارة", "لون السيارة"], "answer": "المسافة المقطوعة", "answerIndex": 1, "explanation": "المسافة تتغير تبعًا للزمن فهي المتغير التابع، أما الزمن فهو المتغير المستقل.", "type": "mcq", "topic": "المتغيرات التابعة والمستقلة", "source": "https://shbabbek.com/show/261405"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-124", "question": "أي زوج من الحدود التالية يُعد حدين متشابهين؟", "choices": ["3س و5س", "3س و3ص", "4س و4", "7س² و7س"], "answer": "3س و5س", "answerIndex": 0, "explanation": "الحدود المتشابهة لها نفس المتغير بنفس الأس، فـ3س و5س متشابهان ويمكن جمعهما: 3س + 5س = 8س.", "type": "mcq", "topic": "المقادير الجبرية", "source": "https://shbabbek.com/show/261405"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-125", "question": "إذا كانت س = 3 فإن قيمة المقدار الجبري (4س + 2) هي:", "choices": ["10", "12", "14", "18"], "answer": "14", "answerIndex": 2, "explanation": "نعوض عن س بـ3: 4 × 3 + 2 = 12 + 2 = 14.", "type": "mcq", "topic": "المقادير الجبرية", "source": "https://shbabbek.com/show/261405"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-126", "question": "ناتج جمع: 3/4 + 1/4 =", "choices": ["4/8", "1/2", "1", "4/4 = 2"], "answer": "1", "answerIndex": 2, "explanation": "المقامات متساوية فنجمع البسطين: (3 + 1)/4 = 4/4 = 1 صحيح.", "type": "mcq", "topic": "الكسور", "source": "https://shbabbek.com/show/287109"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-127", "question": "في فصل به 20 طالبًا، عدد البنات 5 بنات. نسبة عدد البنات إلى العدد الكلي للطلاب في أبسط صورة هي:", "choices": ["5 : 20", "1 : 4", "4 : 1", "1 : 5"], "answer": "1 : 4", "answerIndex": 1, "explanation": "النسبة 5 : 20، وبقسمة الطرفين على 5 تصبح في أبسط صورة 1 : 4.", "type": "mcq", "topic": "النسبة", "source": "https://shbabbek.com/show/287109"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-128", "question": "25% من العدد 200 يساوي:", "choices": ["25", "40", "50", "75"], "answer": "50", "answerIndex": 2, "explanation": "25% تعني الربع، وربع العدد 200 هو 200 ÷ 4 = 50. والنسبة المئوية من مقرر شهر نوفمبر.", "type": "mcq", "topic": "النسبة المئوية", "source": "https://shbabbek.com/show/287109"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-129", "question": "أي كسر مما يلي يكافئ الكسر 2/3 ؟", "choices": ["4/9", "6/9", "3/6", "8/10"], "answer": "6/9", "answerIndex": 1, "explanation": "بضرب بسط 2/3 ومقامه في 3 نحصل على 6/9، فالكسران متكافئان ويمثلان القيمة نفسها.", "type": "mcq", "topic": "الكسور", "source": "https://shbabbek.com/show/287109"}, {"grade": 6, "subject": "الرياضيات", "id": "h26-g6-130", "question": "محيط مستطيل طوله 8 سم وعرضه 5 سم يساوي:", "choices": ["13 سم", "26 سم", "40 سم", "20 سم"], "answer": "26 سم", "answerIndex": 1, "explanation": "محيط المستطيل = 2 × (الطول + العرض) = 2 × (8 + 5) = 2 × 13 = 26 سم.", "type": "mcq", "topic": "الهندسة والقيا
