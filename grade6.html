بَّصُوا۟ ۖ فَسَتَعْلَمُونَ مَنْ أَصْحَٰبُ ٱلصِّرَٰطِ ٱلسَّوِىِّ وَمَنِ ٱهْتَدَىٰ"}, "044023": {"a": 23, "text": "فَأَسْرِ بِعِبَادِى لَيْلًا إِنَّكُم مُّتَّبَعُونَ"}, "022068": {"a": 68, "text": "وَإِن جَٰدَلُوكَ فَقُلِ ٱللَّهُ أَعْلَمُ بِمَا تَعْمَلُونَ"}, "038051": {"a": 51, "text": "مُتَّكِـِٔينَ فِيهَا يَدْعُونَ فِيهَا بِفَٰكِهَةٍۢ كَثِيرَةٍۢ وَشَرَابٍۢ"}, "027020": {"a": 20, "text": "وَتَفَقَّدَ ٱلطَّيْرَ فَقَالَ مَا لِىَ لَآ أَرَى ٱلْهُدْهُدَ أَمْ كَانَ مِنَ ٱلْغَآئِبِينَ"}, "017109": {"a": 109, "text": "وَيَخِرُّونَ لِلْأَذْقَانِ يَبْكُونَ وَيَزِيدُهُمْ خُشُوعًۭا ۩"}, "016022": {"a": 22, "text": "إِلَٰهُكُمْ إِلَٰهٌۭ وَٰحِدٌۭ ۚ فَٱلَّذِينَ لَا يُؤْمِنُونَ بِٱلْءَاخِرَةِ قُلُوبُهُم مُّنكِرَةٌۭ وَهُم مُّسْتَكْبِرُونَ"}, "017104": {"a": 104, "text": "وَقُلْنَا مِنۢ بَعْدِهِۦ لِبَنِىٓ إِسْرَٰٓءِيلَ ٱسْكُنُوا۟ ٱلْأَرْضَ فَإِذَا جَآءَ وَعْدُ ٱلْءَاخِرَةِ جِئْنَا بِكُمْ لَفِيفًۭا"}, "076001": {"a": 1, "text": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ هَلْ أَتَىٰ عَلَى ٱلْإِنسَٰنِ حِينٌۭ مِّنَ ٱلدَّهْرِ لَمْ يَكُن شَيْـًۭٔا مَّذْكُورًا"}, "020080": {"a": 80, "text": "يَٰبَنِىٓ إِسْرَٰٓءِيلَ قَدْ أَنجَيْنَٰكُم مِّنْ عَدُوِّكُمْ وَوَٰعَدْنَٰكُمْ جَانِبَ ٱلطُّورِ ٱلْأَيْمَنَ وَنَزَّلْنَا عَلَيْكُمُ ٱلْمَنَّ وَٱلسَّلْوَىٰ"}, "071006": {"a": 6, "text": "فَلَمْ يَزِدْهُمْ دُعَآءِىٓ إِلَّا فِرَارًۭا"}, "026052": {"a": 52, "text": "۞ وَأَوْحَيْنَآ إِلَىٰ مُوسَىٰٓ أَنْ أَسْرِ بِعِبَادِىٓ إِنَّكُم مُّتَّبَعُونَ"}, "017021": {"a": 21, "text": "ٱنظُرْ كَيْفَ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍۢ ۚ وَلَلْءَاخِرَةُ أَكْبَرُ دَرَجَٰتٍۢ وَأَكْبَرُ تَفْضِيلًۭا"}, "018034": {"a": 34, "text": "وَكَانَ لَهُۥ ثَمَرٌۭ فَقَالَ لِصَٰحِبِهِۦ وَهُوَ يُحَاوِرُهُۥٓ أَنَا۠ أَكْثَرُ مِنكَ مَالًۭا وَأَعَزُّ نَفَرًۭا"}, "017006": {"a": 6, "text": "ثُمَّ رَدَدْنَا لَكُمُ ٱلْكَرَّةَ عَلَيْهِمْ وَأَمْدَدْنَٰكُم بِأَمْوَٰلٍۢ وَبَنِينَ وَجَعَلْنَٰكُمْ أَكْثَرَ نَفِيرًا"}, "020109": {"a": 109, "text": "يَوْمَئِذٍۢ لَّا تَنفَعُ ٱلشَّفَٰعَةُ إِلَّا مَنْ أَذِنَ لَهُ ٱلرَّحْمَٰنُ وَرَضِىَ لَهُۥ قَوْلًۭا"}, "076002": {"a": 2, "text": "إِنَّا خَلَقْنَا ٱلْإِنسَٰنَ مِن نُّطْفَةٍ أَمْشَاجٍۢ نَّبْتَلِيهِ فَجَعَلْنَٰهُ سَمِيعًۢا بَصِيرًا"}, "069025": {"a": 25, "text": "وَأَمَّا مَنْ أُوتِىَ كِتَٰبَهُۥ بِشِمَالِهِۦ فَيَقُولُ يَٰلَيْتَنِى لَمْ أُوتَ كِتَٰبِيَهْ"}, "037021": {"a": 21, "text": "هَٰذَا يَوْمُ ٱلْفَصْلِ ٱلَّذِى كُنتُم بِهِۦ تُكَذِّبُونَ"}, "053035": {"a": 35, "text": "أَعِندَهُۥ عِلْمُ ٱلْغَيْبِ فَهُوَ يَرَىٰٓ"}, "036020": {"a": 20, "text": "وَجَآءَ مِنْ أَقْصَا ٱلْمَدِينَةِ رَجُلٌۭ يَسْعَىٰ قَالَ يَٰقَوْمِ ٱتَّبِعُوا۟ ٱلْمُرْسَلِينَ"}, "036064": {"a": 64, "text": "ٱصْلَوْهَا ٱلْيَوْمَ بِمَا كُنتُمْ تَكْفُرُونَ"}, "019050": {"a": 50, "text": "وَوَهَبْنَا لَهُم مِّن رَّحْمَتِنَا وَجَعَلْنَا لَهُمْ لِسَانَ صِدْقٍ عَلِيًّۭا"}, "021052": {"a": 52, "text": "إِذْ قَالَ لِأَبِيهِ وَقَوْمِهِۦ مَا هَٰذِهِ ٱلتَّمَاثِيلُ ٱلَّتِىٓ أَنتُمْ لَهَا عَٰكِفُونَ"}, "020098": {"a": 98, "text": "إِنَّمَآ إِلَٰهُكُمُ ٱللَّهُ ٱلَّذِى لَآ إِلَٰهَ إِلَّا هُوَ ۚ وَسِعَ كُلَّ شَىْءٍ عِلْمًۭا"}, "041019": {"a": 19, "text": "وَيَوْمَ يُحْشَرُ أَعْدَآءُ ٱللَّهِ إِلَى ٱلنَّارِ فَهُمْ يُوزَعُونَ"}, "029032": {"a": 32, "text": "قَالَ إِنَّ فِيهَا لُوطًۭا ۚ قَالُوا۟ نَحْنُ أَعْلَمُ بِمَن فِيهَا ۖ لَنُنَجِّيَنَّهُۥ وَأَهْلَهُۥٓ إِلَّا ٱمْرَأَتَهُۥ كَانَتْ مِنَ ٱلْغَٰبِرِينَ"}, "017092": {"a": 92, "text": "أَوْ تُسْقِطَ ٱلسَّمَآءَ كَمَا زَعَمْتَ عَلَيْنَا كِسَفًا أَوْ تَأْتِىَ بِٱللَّهِ وَٱلْمَلَٰٓئِكَةِ قَبِيلًا"}, "017054": {"a": 54, "text": "رَّبُّكُمْ أَعْلَمُ بِكُمْ ۖ إِن يَشَأْ يَرْحَمْكُمْ أَوْ إِن يَشَأْ يُعَذِّبْكُمْ ۚ وَمَآ أَرْسَلْنَٰكَ عَلَيْهِمْ وَكِيلًۭا"}, "051050": {"a": 50, "text": "فَفِرُّوٓا۟ إِلَى ٱللَّهِ ۖ إِنِّى لَكُم مِّنْهُ نَذِيرٌۭ مُّبِينٌۭ"}, "018037": {"a": 37, "text": "قَالَ لَهُۥ صَاحِبُهُۥ وَهُوَ يُحَاوِرُهُۥٓ أَكَفَرْتَ بِٱلَّذِى خَلَقَكَ مِن تُرَابٍۢ ثُمَّ مِن نُّطْفَةٍۢ ثُمَّ سَوَّىٰكَ رَجُلًۭا"}, "032015": {"a": 15, "text": "إِنَّمَا يُؤْمِنُ بِـَٔايَٰتِنَا ٱلَّذِينَ إِذَا ذُكِّرُوا۟ بِهَا خَرُّوا۟ سُجَّدًۭا وَسَبَّحُوا۟ بِحَمْدِ رَبِّهِمْ وَهُمْ لَا يَسْتَكْبِرُونَ ۩"}, "020091": {"a": 91, "text": "قَالُوا۟ لَن نَّبْرَحَ عَلَيْهِ عَٰكِفِينَ حَتَّىٰ يَرْجِعَ إِلَيْنَا مُوسَىٰ"}, "053027": {"a": 27, "text": "إِنَّ ٱلَّذِينَ لَا يُؤْمِنُونَ بِٱلْءَاخِرَةِ لَيُسَمُّونَ ٱلْمَلَٰٓئِكَةَ تَسْمِيَةَ ٱلْأُنثَىٰ"}, "054035": {"a": 35, "text": "نِّعْمَةًۭ مِّنْ عِندِنَا ۚ كَذَٰلِكَ نَجْزِى مَن شَكَرَ"}, "020036": {"a": 36, "text": "قَالَ قَدْ أُوتِيتَ سُؤْلَكَ يَٰمُوسَىٰ"}, "020101": {"a": 101, "text": "خَٰلِدِينَ فِيهِ ۖ وَسَآءَ لَهُمْ يَوْمَ ٱلْقِيَٰمَةِ حِمْلًۭا"}, "017108": {"a": 108, "text": "وَيَقُولُونَ سُبْحَٰنَ رَبِّنَآ إِن كَانَ وَعْدُ رَبِّنَا لَمَفْعُولًۭا"}, "016038": {"a": 38, "text": "وَأَقْسَمُوا۟ بِٱللَّهِ جَهْدَ أَيْمَٰنِهِمْ ۙ لَا يَبْعَثُ ٱللَّهُ مَن يَمُوتُ ۚ بَلَىٰ وَعْدًا عَلَيْهِ حَقًّۭا وَلَٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَعْلَمُونَ"}, "072012": {"a": 12, "text": "وَأَنَّا ظَنَنَّآ أَن لَّن نُّعْجِزَ ٱللَّهَ فِى ٱلْأَرْضِ وَلَن نُّعْجِزَهُۥ هَرَبًۭا"}, "020058": {"a": 58, "text": "فَلَنَأْتِيَنَّكَ بِسِحْرٍۢ مِّثْلِهِۦ فَٱجْعَلْ بَيْنَنَا وَبَيْنَكَ مَوْعِدًۭا لَّا نُخْلِفُهُۥ نَحْنُ وَلَآ أَنتَ مَكَانًۭا سُوًۭى"}, "016037": {"a": 37, "text": "إِن تَحْرِصْ عَلَىٰ هُدَىٰهُمْ فَإِنَّ ٱللَّهَ لَا يَهْدِى مَن يُضِلُّ ۖ وَمَا لَهُم مِّن نَّٰصِرِينَ"}, "079046": {"a": 46, "text": "كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوٓا۟ إِلَّا عَشِيَّةً أَوْ ضُحَىٰهَا"}, "020102": {"a": 102, "text": "يَوْمَ يُنفَخُ فِى ٱلصُّورِ ۚ وَنَحْشُرُ ٱلْمُجْرِمِينَ يَوْمَئِذٍۢ زُرْقًۭا"}, "034048": {"a": 48, "text": "قُلْ إِنَّ رَبِّى يَقْذِفُ بِٱلْحَقِّ عَلَّٰمُ ٱلْغُيُوبِ"}, "030032": {"a": 32, "text": "مِنَ ٱلَّذِينَ فَرَّقُوا۟ دِينَهُمْ وَكَانُوا۟ شِيَعًۭا ۖ كُلُّ حِزْبٍۭ بِمَا لَدَيْهِمْ فَرِحُونَ"}, "019015": {"a": 15, "text": "وَسَلَٰمٌ عَلَيْهِ يَوْمَ وُلِدَ وَيَوْمَ يَمُوتُ وَيَوْمَ يُبْعَثُ حَيًّۭا"}, "038030": {"a": 30, "text": "وَوَهَبْنَا لِدَاوُۥدَ سُلَيْمَٰنَ ۚ نِعْمَ ٱلْعَبْدُ ۖ إِنَّهُۥٓ أَوَّابٌ"}, "037149": {"a": 149, "text": "فَٱسْتَفْتِهِمْ أَلِرَبِّكَ ٱلْبَنَاتُ وَلَهُمُ ٱلْبَنُونَ"}, "018012": {"a": 12, "text": "ثُمَّ بَعَثْنَٰهُمْ لِنَعْلَمَ أَىُّ ٱلْحِزْبَيْنِ أَحْصَىٰ لِمَا لَبِثُوٓا۟ أَمَدًۭا"}, "056075": {"a": 75, "text": "۞ فَلَآ أُقْسِمُ بِمَوَٰقِعِ ٱلنُّجُومِ"}, "018004": {"a": 4, "text": "وَيُنذِرَ ٱلَّذِينَ قَالُوا۟ ٱتَّخَذَ ٱللَّهُ وَلَدًۭا"}, "047009": {"a": 9, "text": "ذَٰلِكَ بِأَنَّهُمْ كَرِهُوا۟ مَآ أَنزَلَ ٱللَّهُ فَأَحْبَطَ أَعْمَٰلَهُمْ"}, "016054": {"a": 54, "text": "ثُمَّ إِذَا كَشَفَ ٱلضُّرَّ عَنكُمْ إِذَا فَرِيقٌۭ مِّنكُم بِرَبِّهِمْ يُشْرِكُونَ"}, "017086": {"a": 86, "text": "وَلَئِن شِئْنَا لَنَذْهَبَنَّ بِٱلَّذِىٓ أَوْحَيْنَآ إِلَيْكَ ثُمَّ لَا تَجِدُ لَكَ بِهِۦ عَلَيْنَا وَكِيلًا"}, "018011": {"a": 11, "text": "فَضَرَبْنَا عَلَىٰٓ ءَاذَانِهِمْ فِى ٱلْكَهْفِ سِنِينَ عَدَدًۭا"}, "016040": {"a": 40, "text": "إِنَّمَا قَوْلُنَا لِشَىْءٍ إِذَآ أَرَدْنَٰهُ أَن نَّقُولَ لَهُۥ كُن فَيَكُونُ"}, "019052": {"a": 52, "text": "وَنَٰدَيْنَٰهُ مِن جَانِبِ ٱلطُّورِ ٱلْأَيْمَنِ وَقَرَّبْنَٰهُ نَجِيًّۭا"}, "026222": {"a": 222, "text": "تَنَزَّلُ عَلَىٰ كُلِّ أَفَّاكٍ أَثِيمٍۢ"}, "051051": {"a": 51, "text": "وَلَا تَجْعَلُوا۟ مَعَ ٱللَّهِ إِلَٰهًا ءَاخَرَ ۖ إِنِّى لَكُم مِّنْهُ نَذِيرٌۭ مُّبِينٌۭ"}, "076015": {"a": 15, "text": "وَيُطَافُ عَلَيْهِم بِـَٔانِيَةٍۢ مِّن فِضَّةٍۢ وَأَكْوَابٍۢ كَانَتْ قَوَارِيرَا۠"}, "026051": {"a": 51, "text": "إِنَّا نَطْمَعُ أَن يَغْفِرَ لَنَا رَبُّنَا خَطَٰيَٰنَآ أَن كُنَّآ أَوَّلَ ٱلْمُؤْمِنِينَ"}, "076016": {"a": 16, "text": "قَوَارِيرَا۟ مِن فِضَّةٍۢ قَدَّرُوهَا تَقْدِيرًۭا"}, "068010": {"a": 10, "text": "وَلَا تُطِعْ كُلَّ حَلَّافٍۢ مَّهِينٍ"}, "088018": {"a": 18, "text": "وَإِلَى ٱلسَّمَآءِ كَيْفَ رُفِعَتْ"}, "017024": {"a": 24, "text": "وَٱخْفِضْ لَهُمَا جَنَاحَ ٱلذُّلِّ مِنَ ٱلرَّحْمَةِ وَقُل رَّبِّ ٱرْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًۭا"}, "019094": {"a": 94, "text": "لَّقَدْ أَحْصَىٰهُمْ وَعَدَّهُمْ عَدًّۭا"}, "037147": {"a": 147, "text": "وَأَرْسَلْنَٰهُ إِلَىٰ مِا۟ئَةِ أَلْفٍ أَوْ يَزِيدُونَ"}, "017030": {"a": 30, "text": "إِنَّ رَبَّكَ يَبْسُطُ ٱلرِّزْقَ لِمَن يَشَآءُ وَيَقْدِرُ ۚ إِنَّهُۥ كَانَ بِعِبَادِهِۦ خَبِيرًۢا بَصِيرًۭا"}, "019005": {"a": 5, "text": "وَإِنِّى خِفْتُ ٱلْمَوَٰلِىَ مِن وَرَآءِى وَكَانَتِ ٱمْرَأَتِى عَاقِرًۭا فَهَبْ لِى مِن لَّدُنكَ وَلِيًّۭا"}, "019029": {"a": 29, "text": "فَأَشَارَتْ إِلَيْهِ ۖ قَالُوا۟ كَيْفَ نُكَلِّمُ مَن كَانَ فِى ٱلْمَهْدِ صَبِيًّۭا"}, "023074": {"a": 74, "text": "وَإِنَّ ٱلَّذِينَ لَا يُؤْمِنُونَ بِٱلْءَاخِرَةِ عَنِ ٱلصِّرَٰطِ لَنَٰكِبُونَ"}, "040053": {"a": 53, "text": "وَلَقَدْ ءَاتَيْنَا مُوسَى ٱلْهُدَىٰ وَأَوْرَثْنَا بَنِىٓ إِسْرَٰٓءِيلَ ٱلْكِتَٰبَ"}, "020108": {"a": 108, "text": "يَوْمَئِذٍۢ يَتَّبِعُونَ ٱلدَّاعِىَ لَا عِوَجَ لَهُۥ ۖ وَخَشَعَتِ ٱلْأَصْوَاتُ لِلرَّحْمَٰنِ فَلَا تَسْمَعُ إِلَّا هَمْسًۭا"}, "026045": {"a": 45, "text": "فَأَلْقَىٰ مُوسَىٰ عَصَاهُ فَإِذَا هِىَ تَلْقَفُ مَا يَأْفِكُونَ"}, "020045": {"a": 45, "text": "قَالَا رَبَّنَآ إِنَّنَا نَخَافُ أَن يَفْرُطَ عَلَيْنَآ أَوْ أَن يَطْغَىٰ"}, "017091": {"a": 91, "text": "أَوْ تَكُونَ لَكَ جَنَّةٌۭ مِّن نَّخِيلٍۢ وَعِنَبٍۢ فَتُفَجِّرَ ٱلْأَنْهَٰرَ خِلَٰلَهَا تَفْجِيرًا"}, "018069": {"a": 69, "text": "قَالَ سَتَجِدُنِىٓ إِن شَآءَ ٱللَّهُ صَابِرًۭا وَلَآ أَعْصِى لَكَ أَمْرًۭا"}, "030033": {"a": 33, "text": "وَإِذَا مَسَّ ٱلنَّاسَ ضُرٌّۭ دَعَوْا۟ رَبَّهُم مُّنِيبِينَ إِلَيْهِ ثُمَّ إِذَآ أَذَاقَهُم مِّنْهُ رَحْمَةً إِذَا فَرِيقٌۭ مِّنْهُم بِرَبِّهِمْ يُشْرِكُونَ"}, "019053": {"a": 53, "text": "وَوَهَبْنَا لَهُۥ مِن رَّحْمَتِنَآ أَخَاهُ هَٰرُونَ نَبِيًّۭا"}}, EXPL={"6|الرياضيات|القسمة والمضاعفات والعوامل": [{"t": "القسمة والمضاعفات والعوامل", "k": "", "lines": ["بص يا بطلة، العامل المشترك الأكبر (ع.م.أ) هو أكبر عدد بيقسم العددين."]}, {"t": "القسمة والمضاعفات والعوامل", "k": "", "lines": ["المضاعف المشترك الأصغر (م.م.أ) هو أصغر عدد يقبل القسمة على العددين."]}, {"t": "القسمة والمضاعفات والعوامل", "k": "", "lines": ["نحلل الأعداد لعواملها الأولية: 12 = 2 × 2 × 3 و18 = 2 × 3 × 3."]}, {"t": "القسمة والمضاعفات والعوامل", "k": "", "lines": ["ع.م.أ نختار العوامل المشتركة بأقل أس، وم.م.أ نختار كل العوامل بأكبر أس."]}, {"t": "القسمة والمضاعفات والعوامل", "k": "", "lines": ["السؤال اللي فيه أكبر عدد يقسم يبقى ع.م.أ، واللي فيه كل كام يوم يتقابلوا يبقى م.م.أ. يلا يا بطلة."]}], "6|الرياضيات|الأعداد النسبية والأعداد الصحيحة": [{"t": "الأعداد النسبية والأعداد الصحيحة", "k": "", "lines": ["بص يا بطلة، الأعداد الصحيحة هي الموجبة والسالبة والصفر على خط الأعداد."]}, {"t": "الأعداد النسبية والأعداد الصحيحة", "k": "", "lines": ["كل ما نمشي يمين العدد بيكبر، وكل ما نمشي شمال بيصغر. فـ -5 أصغر من -2."]}, {"t": "الأعداد النسبية والأعداد الصحيحة", "k": "", "lines": ["جمع عددين لهم نفس الإشارة نجمع القيمتين ونحتفظ بالإشارة، ولو مختلفين نطرح القيمتين ونكتب إشارة الأكبر."]}, {"t": "الأعداد النسبية والأعداد الصحيحة", "k": "", "lines": ["العدد النسبي هو اللي نقدر نكتبه على شكل كسر، بسطه ومقامه صحيحين والمقام مش صفر."]}, {"t": "الأعداد النسبية والأعداد الصحيحة", "k": "", "lines": ["لمقارنة الكسور نوحد المقامات الأول. يلا يا بطلة."]}], "6|الرياضيات|المقادير الجبرية": [{"t": "المقادير الجبرية", "k": "", "lines": ["بص يا بطلة، في الجبر بنستخدم حرف زي س مكان عدد مجهول."]}, {"t": "المقادير الجبرية", "k": "", "lines": ["المقدار الجبري زي 3س + 5 فيه حد جبري ومعامل وحد ثابت."]}, {"t": "المقادير الجبرية", "k": "", "lines": ["نبسط المقدار بجمع الحدود المتشابهة: 2س + 3س = 5س."]}, {"t": "المقادير الجبرية", "k": "", "lines": ["لو عوضنا بقيمة س نحصل على قيمة المقدار: لما س = 4 يبقى 3س + 5 = 17."]}, {"t": "المقادير الجبرية", "k": "", "lines": ["الحدود المش متشابهة ما نجمعهاش. يلا يا بطلة."]}], "6|الرياضيات|المعادلات والمتباينات": [{"t": "المعادلات والمتباينات", "k": "", "lines": ["بص يا بطلة، المعادلة زي ميزان متوازن، اللي نعمله في كفة نعمله في الكفة التانية."]}, {"t": "المعادلات والمتباينات", "k": "", "lines": ["لحل س + 5 = 12 نطرح 5 من الطرفين فتطلع س = 7."]}, {"t": "المعادلات والمتباينات", "k": "", "lines": ["لحل 3س = 15 نقسم الطرفين على 3 فتطلع س = 5."]}, {"t": "المعادلات والمتباينات", "k": "", "lines": ["المتباينة نفس الفكرة لكن بتستخدم أكبر من أو أصغر من، وحلها مجموعة أعداد."]}, {"t": "المعادلات والمتباينات", "k": "", "lines": ["اتأكد بالتعويض في المعا var TIPS=["اقرأ السؤال مرتين قبل أن تجيب.","إن لم تكن متأكدًا، فاستبعد الاختيارات الخاطئة أولًا.","خذ نفسًا عميقًا قبل السؤال الصعب.","الخطأ يعلّمك أكثر من الإجابة السهلة.","راجع أخطاءك كل يوم خمس دقائق.","اشرب ماءً وارتح بين الجولات.","جرّب أن تشرح الدرس لغيرك، ستفهمه أفضل.","ابدأ بالمادة التي تحبها، ثم الأصعب.","اكتب الحل على ورقة قبل أن تختار.","النوم مبكرًا يجعل المذاكرة أسهل.","شاهد الشرح المتحرك إذا أخطأت في موضوع أكثر من مرة.","التكرار القليل كل يوم خير من يوم واحد طويل.","اسأل معلمك عن أي شيء لا تفهمه.","عندما تتعب، خذ استراحة ضحك.","ابدأ طعامَك ببسم الله، وكُل بيمينك، وكُل مما يليك؛ فهكذا علّمنا النبيُّ ﷺ.","فكِّر قبل أن تتكلم؛ فالكلمةُ الطيبة صدقة، والكلمة الجارحة لا تُنسى.","العب بروحٍ رياضية: افرح بالفوز بتواضع، وتقبّل الخسارة بابتسامة؛ فاللعبُ يجمع ولا يفرِّق.","ادخل المسجدَ بيمينك وقل دعاءَ الدخول، واجلس بأدبٍ وهدوء؛ فأنت في بيت الله.","قبل أن تدخل غرفةَ غيرك، اطرق البابَ بلطفٍ واستأذن؛ فالاستئذانُ أدبٌ رفيعٌ يحفظ الخصوصية.","ابدأ يومَك بذكر الله، واختمه بحمده؛ فالقلبُ الذي يذكر اللهَ قلبٌ مطمئن.","ساعد من يحتاج حولك: أخاك الصغير، وجارَك الكبير، وصديقَك المتعثر؛ فالمساعدةُ تُسعد قلبين.","ابدأ يومَك بالسلام على أهل بيتك؛ فالسلامُ يُدخل المحبةَ والطمأنينةَ إلى القلوب.","كن صادقًا دائمًا، حتى لو كان الصدقُ صعبًا؛ فالصدقُ يهدي إلى البرِّ والجنة.","حافظ على صلواتك الخمس في أوقاتها؛ فالصلاةُ راحةُ القلب ونورُ اليوم.","ابدأ مذاكرتَك بدعاءٍ قصير ونيةٍ صالحة؛ فطلبُ العلم عبادةٌ يُحبها الله.","النظافةُ من الإيمان؛ حافظ على نظافة جسدك وثيابك ومكانك دائمًا.","برُّ الوالدين طريقُك إلى رضا الله؛ كلمةٌ طيبةٌ وابتسامةٌ صادقةٌ تُسعد قلبَ أمِّك وأبيك.","زُر أقاربَك واسأل عنهم ولو بمكالمة؛ فصلةُ الرحم تُبارك في العمر والرزق.","اشكر اللهَ بعد الطعام بقول: الحمد لله؛ فالشكرُ يزيد النعمَ ويبارك فيها.","استمع إلى من يحدِّثك حتى يُكمل كلامَه، ولا تقاطعه؛ فحُسنُ الاستماع من حُسن الخُلق.","لا تسخر من صديقٍ أخطأ أو خسر؛ فاليوم تضحك وغدًا قد تكون مكانه.","حافظ على وردٍ يوميٍّ من القرآن ولو آياتٍ قليلة؛ فخيرُ الأعمال أدومُها وإن قلّت.","استأذن ثلاثَ مرات؛ فإن لم يُؤذَن لك، فارجع بقلبٍ راضٍ ولا تغضب.","ادعُ لوالديك وأهلك وأصدقائك بظهر الغيب؛ فدعوتُك لهم تعود عليك بمثلها.","كن رفيقًا بالحيوانات؛ اسقِها وأطعمها ولا تؤذِها، ففي كلِّ كبدٍ رطبةٍ أجر.","حين تدخل بيتَك أو بيتَ غيرك، قل: السلام عليكم، بصوتٍ واضحٍ وابتسامةٍ جميلة.","الأمانةُ أن تحفظ ما اؤتمنتَ عليه: مالًا كان أو سرًّا أو وعدًا قطعته.","توضأ بإتقانٍ وأحسن وضوءَك؛ فالوضوءُ طهارةٌ ونور.","قسِّم واجباتِك إلى أجزاءٍ صغيرة، وأنجزها واحدةً تلو الأخرى؛ فالجبلُ يُصعَد خطوةً خطوة.","رتِّب غرفتَك وأدواتَك بعد استعمالها؛ فالنظامُ يوفِّر وقتَك ويريح قلبَك.","حين تطلب منك أمُّك شيئًا، فلبِّ طلبَها بفرح؛ فخدمةُ الوالدين شرفٌ وبركة.","احترم كبارَ السن: قف لهم، وقدِّمهم في المجلس، واستمع إلى حكاياتهم بحب.","لا تعبْ طعامًا قُدِّم إليك؛ إن اشتهيتَه أكلتَ، وإن لم تشتهِه تركتَه بلا تعليق.","تكلّم بصوتٍ هادئٍ واضح؛ فرفعُ الصوت لا يجعل الحقَّ أقوى.","شارك ألعابَك مع أصدقائك؛ فالمشاركةُ تزيد الفرحَ ولا تُنقصه.","استمع إلى القرآن بقلبٍ حاضرٍ حين يُتلى؛ ففي سماعه رحمةٌ وطمأنينة.","حتى في بيتك، استأذن قبل دخول غرفة والديك أو إخوتك؛ فالأدبُ يبدأ من البيت.","اشكر من أحسن إليك بقول: جزاك الله خيرًا؛ فمن لا يشكر الناسَ لا يشكر الله.","تبسُّمُك في وجه أخيك صدقة؛ فلا تبخل بابتسامتك على أحد.","ردُّ السلام فضلٌ عظيم؛ رُدَّه بأحسنَ منه أو بمثلِه، وبوجهٍ بشوش.","إن وعدتَ فأوفِ بوعدك؛ فالوفاءُ بالوعد علامةُ المؤمن الصادق.","صلِّ بخشوعٍ وحضور قلب، وتذكّر أنك تقف بين يدي الله؛ فالصلاةُ لقاءٌ جميل.","راجع دروسَك أولًا بأول، ولا تؤجِّل عملَ اليوم إلى الغد.","اغسل يديك قبل الطعام وبعده، وبعد اللعب؛ فالصحةُ نعمةٌ عظيمةٌ تستحق الشكر.","قبِّل يدَ والديك وادعُ لهما كلَّ يوم؛ فدعاؤهما لك بابٌ من أبواب التوفيق.","معلِّمُك بمنزلة والدك في التربية؛ فاحترمه واشكره وادعُ له بالخير.","شارك إخوتَك وأصدقاءَك طعامَك إن استطعت؛ فالطعامُ المشترك ألذُّ وأبرك.","إن لم يكن عندك كلامٌ نافع، فالصمتُ أجمل؛ قال رسول الله ﷺ: «من كان يؤمن بالله واليوم الآخر فليقل خيرًا أو ليصمت».","اختر صديقَك بعناية؛ فالصديقُ الصالح يُعينك على الخير ويُبعدك عن الشر.","احترم مصحفَك: ضعه في مكانٍ نظيفٍ مرتفع، ولا تضع فوقه شيئًا.","لا تنظر من ثقب الباب أو النافذة قبل أن تدخل؛ فاحترامُ خصوصية الناس من كمال الخُلق.","افرح لفرح غيرك وادعُ له بالبركة؛ فالقلبُ الذي يحب الخيرَ للناس قلبٌ عظيم.","إن رأيتَ صديقًا حزينًا، اجلس بجواره واسأله عن حاله؛ فالكلمةُ الحانية دواء.","إفشاءُ السلام بين الناس من أحبِّ الأعمال إلى الله؛ فكن سبّاقًا إليه دائمًا.","اعترف بخطئك بشجاعة إن أخطأت؛ فالاعتذارُ قوةٌ لا ضعف.","جهِّز سجادتَك ومصحفَك في مكانٍ تحبه؛ فالمكانُ الجميل يُعينك على العبادة.","اسأل معلِّمَك عما لا تفهمه ولا تخجل؛ فالسؤالُ مفتاحُ العلم.","حافظ على نظافة مدرستك وشارعك؛ فإماطةُ الأذى عن الطريق من أخلاق المؤمن.","استمع إلى نصيحة والديك بصدرٍ رحب؛ فهما أكثرُ من يحبُّك ويخاف عليك في الدنيا.","خاطب الكبيرَ بألفاظٍ مهذبة، ولا ترفع صوتَك فوق صوته أبدًا.","الفتاةُ المؤدبة كالوردة الجميلة: جمالُها الحقيقي في خُلقها وطيب كلامها وحيائها.","ساعدي أمَّك في أعمال البيت بحب؛ فبرُّك بها ومساعدتُك لها تُدخل السرورَ على قلبها.","كوني لطيفةً مع صديقاتك، واحفظي أسرارَهن، وشاركيهن الفرحَ والحزن؛ فالصداقةُ كنز.","حياؤكِ تاجُ جمالك؛ فتمسّكي به وافتخري بأدبك وأخلاقك أينما كنتِ.","رتّبي أغراضَك وحافظي على نظافة مكانك؛ فالنظامُ يجعل يومَك أجملَ وأسهل.","ابتسامتُك الجميلة وصدقُ كلامك يجعلان كلَّ من حولك يحبُّك ويحترمك.","حين تدخل بيتك، قل: «بسم الله ولجنا، وبسم الله خرجنا، وعلى ربنا توكلنا»، ثم سلّم على أهلك.","حين تخرج من بيتك، قل: «بسم الله، توكلت على الله، ولا حول ولا قوة إلا بالله» — تُكفى وتُهدى وتُوقى.","قبل أن تأكل، سمِّ الله وقل: «بسم الله»؛ فإن نسيت في أوله فقل: «بسم الله في أوله وآخره».","بعد أن تفرغ من طعامك، قل: «الحمد لله الذي أطعمني هذا ورزقنيه من غير حول مني ولا قوة».","حين تدخل المسجد، قدّم رجلك اليمنى وقل: «اللهم افتح لي أبواب رحمتك».","حين تخرج من المسجد، قدّم رجلك اليسرى وقل: «اللهم إني أسألك من فضلك».","حين تستيقظ من نومك، قل: «الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور».","قبل أن تنام، قل: «باسمك اللهم أموت وأحيا»، ونم على وضوء إن استطعت.","حين تركب السيارة أو الحافلة، قل: «سبحان الذي سخّر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون».","إذا لبست ثوبًا جديدًا، فقل: «الحمد لله الذي كساني هذا ورزقنيه من غير حول مني ولا قوة».","بعد الوضوء، قل: «أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدًا عبده ورسوله» — تُفتح لك أبواب الجنة.","حين تسمع الأذان، ردّد مع المؤذن كلمة كلمة، ثم صلِّ على النبي ﷺ واسأل الله له الوسيلة.","قبل دخول الخلاء قل: «اللهم إني أعوذ بك من الخبث والخبائث»، وحين تخرج قل: «غفرانك».","حين ترى المطر ينزل، قل: «اللهم صيّبًا نافعًا»، وادعُ بما تحب؛ فالدعاء عند المطر مستجاب.","حين تقوم من مجلس، قل كفارة المجلس: «سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك».","إذا عطست فقل: «الحمد لله»، وإذا قال لك أخوك: «يرحمك الله»، فقل: «يهديكم الله ويصلح بالكم».","الصدق منجاة: من صدق نجا ولو بعد حين؛ فاجعل لسانك لا يعرف إلا الحق، وستجد أثره في قلبك وحياتك.","الكذب حبله قصير: كذبة واحدة تحتاج عشر كذبات لتغطيتها، وفي النهاية يخسر صاحبها ثقة الناس ورضا الله.","احترام الكبير بركة: من وقّر الكبير في صغره وقّره الناس في كبره؛ فقم للكبير، وقدّمه في المجلس، واستمع إليه بأدب.","اعطف على أخيك الصغير: خذ بيده وعلّمه برفق واصبر عليه؛ فأنت قدوته الأولى بعد والديك، وهو يقلّد ما تفعله.","الشيطان يسعى جاهدًا ليجعلك جاهلًا كسولًا؛ فإذا وسوس لك بترك الصلاة والمذاكرة فاستعذ بالله وقم إلى عملك — فالعلم والعمل أعداء الشيطان.","صلاتك نجاتك: من حافظ على الصلوات الخمس كانت له نورًا وبرهانًا ونجاة يوم القيامة؛ فلا تؤخّر صلاة عن وقتها أبدًا.","علاقتك بالله هي النجاة الحقيقية: كلما ضاقت بك الدنيا فافزع إلى الصلاة والدعاء؛ فباب الله لا يُغلق في وجه من طرقه.","لا تؤجّل عمل اليوم إلى الغد؛ فالتسويف لصّ الوقت. ابدأ الآن ولو بخطوة صغيرة، وستندهش مما تنجزه.","قبل أن تتكلم، اسأل نفسك ثلاثة أسئلة: هل كلامي حق؟ هل هو نافع؟ هل هو لطيف؟ فإن لم يكن كذلك فالصمت أجمل.","اجعل القرآن صاحبك لا ضيفك: صفحة واحدة كل يوم بعد الفجر تجعلك تختم وتتدبر، وخير الأعمال أدومها وإن قلّت.","احفظ سرّ أخيك كما تحفظ سرّك؛ فمن ستر مسلمًا ستره الله، والسر أمانة لا تُذاع ولو اختلفت مع صاحبه.","كن أول من يبدأ بالخير: بادر بالسلام، وبادر بالصلح إذا اختلفت مع صديق، وبادر بالمساعدة قبل أن تُطلب منك.","وقتك أمانة ستُسأل عنها: ساعة جدّ وساعة لعب باعتدال؛ فمن حفظ وقته في الصغر بنى مستقبله في الكبر.","ادعُ لأخيك بظهر الغيب؛ فحين تدعو له يقول الملك الموكّل بك: آمين، ولك بمثل ما دعوت.","غضّ بصرك يحفظ قلبك: النظرة الأولى لك والثانية عليك؛ فإذا وقع بصرك على ما لا يحل فاصرفه سريعًا، وستجد قلبك أصفى.","النظر إلى المحرمات يورث القلب قسوة والعمل كسلًا وذلًّا للمعصية؛ وغضّ البصر يورث نورًا في القلب وبصيرة في الدين.","عينك أمانة من الله وستُسأل عنها يوم القيامة؛ فاجعل نظرك في طاعة: في المصحف، وفي وجوه والديك، وفي خلق الله بتفكر.","إذا وقع بصرك على محرّم فتذكّر أن الله يراك؛ فاستحيِ ممن يراك ولا يغيب عنه شيء، وقل: اللهم اصرف عني السوء.","غضّ البصر قوة لا ضعف: من ملك عينه ملك قلبه، ومن أطلق بصره في كل شيء تعب قلبه وتشتّت ذهنه وضعفت مذاكرته.","اجعل هاتفك شاهدًا لك لا عليك: ما لا ترضى أن يراه والداك ومعلمك أمامك، لا تنظر إليه وأنت وحدك؛ فالله معك أينما كنت.","ثمرة غضّ البصر حلاوة في القلب وانشراح في الصدر وقوة في الحفظ لا يعرفها إلا من جرّبها؛ جرّب أسبوعًا واحدًا وسترى الفرق.","ادعُ كل يوم: «اللهم احفظ بصري وسمعي وقلبي من كل ما لا يرضيك، واجعل نظري عبرة وفكري ذكرًا».","ساعد أمك في أعمال البيت من نفسك قبل أن تطلب منك؛ فالبرّ الحقيقي أن تبادر لا أن تنتظر الطلب.","إذا غضبت فاسكت قليلًا وعدّ في سرّك إلى عشرة؛ فأكثر الكلام الذي نندم عليه قلناه ونحن غاضبون.","حافظ على أذكار الصباح والمساء؛ فهي حصنك من كل سوء، وبداية يومك ونهايته بذكر الله بركة.","التمس لأخيك عذرًا إذا رأيت منه ما لا يعجبك؛ فحسن الظن راحة لقلبك وحفظ لمحبتك للناس.","علّم صديقك شيئًا تعلمته اليوم؛ فزكاة العلم تعليمه، وما علّمته غيرك ثبت في ذهنك أكثر.","إذا وجدت قلمًا أو شيئًا ضائعًا من زميلك فسلّمه لمعلمك؛ فالأمانة أن يرجع الحق لصاحبه ولو كان صغيرًا.","زُر قريبًا مريضًا أو اتصل به واسأل عنه؛ فعيادة المريض تخفف عنه وتُدخل السرور على قلبه.","لا تُسرف في الماء وأنت تتوضأ أو تستحم؛ فالماء نعمة عظيمة، والنبي ﷺ كان يتوضأ بالقليل.","اغتنم وقت فراغك في حفظ سورة قصيرة أو مراجعة درس؛ فالدقائق الصغيرة تصنع إنجازات كبيرة.","اعتنِ بنظافة أسنانك بالفرشاة كل يوم؛ ففم نظيف وابتسامة جميلة من تمام النظافة التي يحبها الله.","لا تتكلم عن غائب بما يكره أن يسمعه؛ فالغيبة تأكل الحسنات كما تأكل النار الحطب.","اتصل بجدك وجدتك واسأل عن صحتهما وادعُ لهما؛ فصوتك يسعدهما أكثر مما تتصور.","ضع جنيهًا صغيرًا في حصالة صدقة كل أسبوع؛ فالصدقة ولو قليلة تطفئ غضب الرب وتزيد البركة.","إذا جاء زميل جديد إلى فصلك فكن أول من يرحب به ويعرّفه بالمكان؛ فالغريب يحتاج قلبًا قريبًا.","ابدأ كل عمل باسم الله: المذاكرة واللعب والأكل؛ فما بُدئ ببسم الله تمّت بركته.","ألقِ السلام على من تعرف ومن لا تعرف؛ فإفشاء السلام ينشر المحبة بين الناس.","استغفر الله كل يوم ولو عشر مرات بقلب حاضر؛ فالاستغفار يفتح أبواب الرزق ويفرّج الهموم.","اخفض صوتك في المسجد والمكتبة والأماكن الهادئة؛ فمراعاة مشاعر الآخرين من كمال الأدب.","اشكر الله كل صباح على نعم صغيرة: بصرك وسمعك وصحتك وأهلك؛ فمن شكر على القليل رزقه الله الكثير.","إذا لعبت مع أصدقائك فالعب بنزاهة: لا غش ولا ظلم؛ فالفوز الشريف وحده هو الذي يُفرح القلب.","رتّب حذاءك وأغراضك عند الباب؛ فالبيت المرتب يبدأ من عادات صغيرة مرتبة.","ادعُ لوالديك في سجودك؛ فأقرب ما يكون العبد من ربه وهو ساجد، ودعاؤك لهما من أعظم البر.","إذا رأيت عامل نظافة أو رجلًا يكدح في الشارع فسلّم عليه وادعُ له؛ فكل عمل شريف يستحق الاحترام.","نم مبكرًا بعد صلاة العشاء وقراءة ما تيسر من القرآن؛ فجسمك أمانة، والنوم الكافي يجعلك أقوى وأذكى في يومك.","قلبك يستحق النقاء: كل نظرة محرمة تترك أثرًا فيه، وكل غضة بصر تزيد قلبك نورًا وقربًا من الله.","إذا فاجأك مشهد لا يليق على هاتفك فمرّر بسرعة ولا تعد إليه؛ فالشجاعة الحقيقية أن تهرب من الفتنة لا أن تقف أمامها.","تذكّر دائمًا: الله يراك في خلوتك كما يراك أمام الناس؛ ومن راقب الله في الخلوة حفظه الله في العلانية.","غضّ البصر يعينك على الحفظ والتركيز: عين هادئة تعني ذهنًا صافيًا ودرجات أعلى بإذن الله.","الصديق الذي ينصحك بترك النظر المحرم صديق مخلص يحبك بصدق؛ فاسمع له واشكره.","اجعل لك وردًا من القرآن كلما ضعفت نفسك؛ فالقلب الممتلئ بالقرآن لا يبقى فيه مكان للهوى."];

var WISDOM=[{"k": "dhikr", "t": "حين تدخل بيتك، قل: «بسم الله ولجنا، وبسم الله خرجنا، وعلى ربنا توكلنا»، ثم سلّم على أهلك."}, {"k": "dhikr", "t": "حين تخرج من بيتك، قل: «بسم الله، توكلت على الله، ولا حول ولا قوة إلا بالله» — تُكفى وتُهدى وتُوقى."}, {"k": "dhikr", "t": "قبل أن تأكل، سمِّ الله وقل: «بسم الله»؛ فإن نسيت في أوله فقل: «بسم الله في أوله وآخره»."}, {"k": "dhikr", "t": "بعد أن تفرغ من طعامك، قل: «الحمد لله الذي أطعمني هذا ورزقنيه من غير حول مني ولا قوة»."}, {"k": "dhikr", "t": "حين تدخل المسجد، قدّم رجلك اليمنى وقل: «اللهم افتح لي أبواب رحمتك»."}, {"k": "dhikr", "t": "حين تخرج من المسجد، قدّم رجلك اليسرى وقل: «اللهم إني أسألك من فضلك»."}, {"k": "dhikr", "t": "حين تستيقظ من نومك، قل: «الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور»."}, {"k": "dhikr", "t": "قبل أن تنام، قل: «باسمك اللهم أموت وأحيا»، ونم على وضوء إن استطعت."}, {"k": "dhikr", "t": "حين تركب السيارة أو الحافلة، قل: «سبحان الذي سخّر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون»."}, {"k": "dhikr", "t": "إذا لبست ثوبًا جديدًا، فقل: «الحمد لله الذي كساني هذا ورزقنيه من غير حول مني ولا قوة»."}, {"k": "dhikr", "t": "بعد الوضوء، قل: «أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدًا عبده ورسوله» — تُفتح لك أبواب الجنة."}, {"k": "dhikr", "t": "حين تسمع الأذان، ردّد مع المؤذن كلمة كلمة، ثم صلِّ على النبي ﷺ واسأل الله له الوسيلة."}, {"k": "dhikr", "t": "قبل دخول الخلاء قل: «اللهم إني أعوذ بك من الخبث والخبائث»، وحين تخرج قل: «غفرانك»."}, {"k": "dhikr", "t": "حين ترى المطر ينزل، قل: «اللهم صيّبًا نافعًا»، وادعُ بما تحب؛ فالدعاء عند المطر مستجاب."}, {"k": "dhikr", "t": "حين تقوم من مجلس، قل كفارة المجلس: «سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك»."}, {"k": "dhikr", "t": "إذا عطست فقل: «الحمد لله»، وإذا قال لك أخوك: «يرحمك الله»، فقل: «يهديكم الله ويصلح بالكم»."}, {"k": "tip", "t": "الصدق منجاة: من صدق نجا ولو بعد حين؛ فاجعل لسانك لا يعرف إلا الحق، وستجد أثره في قلبك وحياتك."}, {"k": "tip", "t": "الكذب حبله قصير: كذبة واحدة تحتاج عشر كذبات لتغطيتها، وفي النهاية يخسر صاحبها ثقة الناس ورضا الله."}, {"k": "tip", "t": "احترام الكبير بركة: من وقّر الكبير في صغره وقّره الناس في كبره؛ فقم للكبير، وقدّمه في المجلس، واستمع إليه بأدب."}, {"k": "tip", "t": "اعطف على أخيك الصغير: خذ بيده وعلّمه برفق واصبر عليه؛ فأنت قدوته الأولى بعد والديك، وهو يقلّد ما تفعله."}, {"k": "tip", "t": "الشيطان يسعى جاهدًا ليجعلك جاهلًا كسولًا؛ فإذا وسوس لك بترك الصلاة والمذاكرة فاستعذ بالله وقم إلى عملك — فالعلم والعمل أعداء الشيطان."}, {"k": "tip", "t": "صلاتك نجاتك: من حافظ على الصلوات الخمس كانت له نورًا وبرهانًا ونجاة يوم القيامة؛ فلا تؤخّر صلاة عن وقتها أبدًا."}, {"k": "tip", "t": "علاقتك بالله هي النجاة الحقيقية: كلما ضاقت بك الدنيا فافزع إلى الصلاة والدعاء؛ فباب الله لا يُغلق في وجه من طرقه."}, {"k": "tip", "t": "لا تؤجّل عمل اليوم إلى الغد؛ فالتسويف لصّ الوقت. ابدأ الآن ولو بخطوة صغيرة، وستندهش مما تنجزه."}, {"k": "tip", "t": "قبل أن تتكلم، اسأل نفسك ثلاثة أسئلة: هل كلامي حق؟ هل هو نافع؟ هل هو لطيف؟ فإن لم يكن كذلك فالصمت أجمل."}, {"k": "tip", "t": "اجعل القرآن صاحبك لا ضيفك: صفحة واحدة كل يوم بعد الفجر تجعلك تختم وتتدبر، وخير الأعمال أدومها وإن قلّت."}, {"k": "tip", "t": "احفظ سرّ أخيك كما تحفظ سرّك؛ فمن ستر مسلمًا ستره الله، والسر أمانة لا تُذاع ولو اختلفت مع صاحبه."}, {"k": "tip", "t": "كن أول من يبدأ بالخير: بادر بالسلام، وبادر بالصلح إذا اختلفت مع صديق، وبادر بالمساعدة قبل أن تُطلب منك."}, {"k": "tip", "t": "وقتك أمانة ستُسأل عنها: ساعة جدّ وساعة لعب باعتدال؛ فمن حفظ وقته في الصغر بنى مستقبله في الكبر."}, {"k": "tip", "t": "ادعُ لأخيك بظهر الغيب؛ فحين تدعو له يقول الملك الموكّل بك: آمين، ولك بمثل ما دعوت."}, {"k": "eye", "t": "غضّ بصرك يحفظ قلبك: النظرة الأولى لك والثانية عليك؛ فإذا وقع بصرك على ما لا يحل فاصرفه سريعًا، وستجد قلبك أصفى."}, {"k": "eye", "t": "النظر إلى المحرمات يورث القلب قسوة والعمل كسلًا وذلًّا للمعصية؛ وغضّ البصر يورث نورًا في القلب وبصيرة في الدين."}, {"k": "eye", "t": "عينك أمانة من الله وستُسأل عنها يوم القيامة؛ فاجعل نظرك في طاعة: في المصحف، وفي وجوه والديك، وفي خلق الله بتفكر."}, {"k": "eye", "t": "إذا وقع بصرك على محرّم فتذكّر أن الله يراك؛ فاستحيِ ممن يراك ولا يغيب عنه شيء، وقل: اللهم اصرف عني السوء."}, {"k": "eye", "t": "غضّ البصر قوة لا ضعف: من ملك عينه ملك قلبه، ومن أطلق بصره في كل شيء تعب قلبه وتشتّت ذهنه وضعفت مذاكرته."}, {"k": "eye", "t": "اجعل هاتفك شاهدًا لك لا عليك: ما لا ترضى أن يراه والداك ومعلمك أمامك، لا تنظر إليه وأنت وحدك؛ فالله معك أينما كنت."}, {"k": "eye", "t": "ثمرة غضّ البصر حلاوة في القلب وانشراح في الصدر وقوة في الحفظ لا يعرفها إلا من جرّبها؛ جرّب أسبوعًا واحدًا وسترى الفرق."}, {"k": "eye", "t": "ادعُ كل يوم: «اللهم احفظ بصري وسمعي وقلبي من كل ما لا يرضيك، واجعل نظري عبرة وفكري ذكرًا»."},{"k": "tip", "t": "ساعد أمك في أعمال البيت من نفسك قبل أن تطلب منك؛ فالبرّ الحقيقي أن تبادر لا أن تنتظر الطلب."},{"k": "tip", "t": "إذا غضبت فاسكت قليلًا وعدّ في سرّك إلى عشرة؛ فأكثر الكلام الذي نندم عليه قلناه ونحن غاضبون."},{"k": "tip", "t": "حافظ على أذكار الصباح والمساء؛ فهي حصنك من كل سوء، وبداية يومك ونهايته بذكر الله بركة."},{"k": "tip", "t": "التمس لأخيك عذرًا إذا رأيت منه ما لا يعجبك؛ فحسن الظن راحة لقلبك وحفظ لمحبتك للناس."},{"k": "tip", "t": "علّم صديقك شيئًا تعلمته اليوم؛ فزكاة العلم تعليمه، وما علّمته غيرك ثبت في ذهنك أكثر."},{"k": "tip", "t": "إذا وجدت قلمًا أو شيئًا ضائعًا من زميلك فسلّمه لمعلمك؛ فالأمانة أن يرجع الحق لصاحبه ولو كان صغيرًا."},{"k": "tip", "t": "زُر قريبًا مريضًا أو اتصل به واسأل عنه؛ فعيادة المريض تخفف عنه وتُدخل السرور على قلبه."},{"k": "tip", "t": "لا تُسرف في الماء وأنت تتوضأ أو تستحم؛ فالماء نعمة عظيمة، والنبي ﷺ كان يتوضأ بالقليل."},{"k": "tip", "t": "اغتنم وقت فراغك في حفظ سورة قصيرة أو مراجعة درس؛ فالدقائق الصغيرة تصنع إنجازات كبيرة."},{"k": "tip", "t": "اعتنِ بنظافة أسنانك بالفرشاة كل يوم؛ ففم نظيف وابتسامة جميلة من تمام النظافة التي يحبها الله."},{"k": "tip", "t": "لا تتكلم عن غائب بما يكره أن يسمعه؛ فالغيبة تأكل الحسنات كما تأكل النار الحطب."},{"k": "tip", "t": "اتصل بجدك وجدتك واسأل عن صحتهما وادعُ لهما؛ فصوتك يسعدهما أكثر مما تتصور."},{"k": "tip", "t": "ضع جنيهًا صغيرًا في حصالة صدقة كل أسبوع؛ فالصدقة ولو قليلة تطفئ غضب الرب وتزيد البركة."} var PQ=null;
function pqPick(){
 try{
  var pool=(window.RAW||[]).filter(function(r){return r&&r.choices&&r.choices.length>=3&&r.explanation&&["القرآن","التربية الإسلامية","العربي"].indexOf(r.subject)>=0});
  if(!pool.length)return null;
  var q=pool[Math.floor(Math.random()*pool.length)];
  var ch=q.choices.slice();for(var i=ch.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ch[i];ch[i]=ch[j];ch[j]=t}

 }catch(e){return null}
}
